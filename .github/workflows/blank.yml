                  setVis(R.id.fullSeekRow, !live)
                  setVis(R.id.fullBtnRow, !live)
                  setVis(R.id.fullBar, !live)
                  setVis(R.id.btn_full_pip, !live)
                  setVis(R.id.btn_full_cast, Build.VERSION.SDK_INT >= 23)
              }

              private fun showFullBars() {
                  if (!full) return
                  setVis(R.id.fullTop, true)
                  setVis(R.id.fullBar, !live)
                  armHideBars()
              }

              private fun hideFullBars() {
                  if (!full) return
                  setVis(R.id.fullTop, false)
                  setVis(R.id.fullBar, false)
              }

              private fun armHideBars() {
                  barsToken++
                  val mine = barsToken
                  h.removeCallbacks(hideBars)
                  if (live) h.postDelayed({ if (mine == barsToken) hideFullBars() }, 4000L)
                  else h.postDelayed({ if (mine == barsToken) hideFullBars() }, 6000L)
              }

              private val hideBars = Runnable { hideFullBars() }

              private fun applyResize(m: String) {
                  val r = when (m) {
                      "fill" -> androidx.media3.ui.AspectRatioFrameLayout.RESIZE_MODE_FILL
                      "zoom" -> androidx.media3.ui.AspectRatioFrameLayout.RESIZE_MODE_ZOOM
                      "fixed_width" -> androidx.media3.ui.AspectRatioFrameLayout.RESIZE_MODE_FIXED_WIDTH
                      "fixed_height" -> androidx.media3.ui.AspectRatioFrameLayout.RESIZE_MODE_FIXED_HEIGHT
                      else -> androidx.media3.ui.AspectRatioFrameLayout.RESIZE_MODE_FIT
                  }
                  try { pv?.resizeMode = r; pvFull?.resizeMode = r } catch (t: Throwable) {}
              }

              private fun cycleResize() {
                  val list = arrayOf("fit", "fill", "zoom", "fixed_width", "fixed_height")
                  val i = list.indexOf(sp.s("rm2", "fit"))
                  val n = list[(i + 1) % list.size]
                  sp.put("rm2", n)
                  applyResize(n)
                  text(R.id.full_qual, label(n))
                  toast("نسبة الصورة: " + label(n))
              }

              private fun label(m: String): String = when (m) {
                  "fit" -> "ملاءمة"
                  "fill" -> "ملء"
                  "zoom" -> "تكبير"
                  "fixed_width" -> "عرض ثابت"
                  else -> "ارتفاع ثابت"
              }

              private fun seekBy(delta: Long) {
                  if (live) { toast("التقديم غير متاح للمباشر"); return }
                  val p = player ?: return
                  val t = (p.currentPosition + delta).coerceAtLeast(0L)
                  try { p.seekTo(t) } catch (t2: Throwable) {}
                  text(R.id.tv_seek_hint, (if (delta > 0) "⏩ +" else "⏪ ") + (delta / 1000) + " ث")
                  setVis(R.id.tv_seek_hint, true)
                  h.removeCallbacks(hideSeek)
                  h.postDelayed(hideSeek, 800L)
              }

              private fun updButton() {
                  val r = if (player?.isPlaying == true) R.drawable.ic_pause else R.drawable.ic_play
                  try { findViewById<ImageView>(R.id.btn_center_play).setImageResource(r) } catch (t: Throwable) {}
                  try { findViewById<ImageView>(R.id.btn_full_play).setImageResource(r) } catch (t: Throwable) {}
              }

              private fun enterPip() {
                  if (Build.VERSION.SDK_INT < 26) { toast("الصورة داخل صورة تحتاج Android 8+"); return }
                  try {
                      enterPictureInPictureMode(PictureInPictureParams.Builder().setAspectRatio(Rational(16, 9)).build())
                  } catch (t: Throwable) { Crash.log(t) }
              }

              /** يفتح نافذة اختيار شاشة الإرسال (يُستدعى من زر «إرسال» العادي، لا من MediaRouteButton نفسه). */
