           val total = ms / 1000
           val h = total / 3600
           val m = (total % 3600) / 60
           val s = total % 60
           return if (h > 0) String.format(java.util.Locale.FRANCE, "%d:%02d:%02d", h, m, s)
           else String.format(java.util.Locale.FRANCE, "%d:%02d", m, s)
          }

          fun fmtBytes(n: Long): String = when {
