              private fun dial(d: String) {
                  val s = (tvDial.text?.toString() ?: "") + d
                  text(tvDial, s)
                  setVis(R.id.tv_dial, true)
                  h.removeCallbacks(dialGo)
                  h.postDelayed(dialGo, 1300L)
              }

              private val dialGo = Runnable {
                  val n = tvDial.text?.toString()?.toIntOrNull()
                  text(tvDial, "")
                  setVis(R.id.tv_dial, false)
                  val idx = when {
                      n == null -> -1
                      n in 1..pl.size -> n - 1
                      else -> pl.indexOfFirst { it.num == n }
                  }
                  if (idx >= 0) playAt(idx) else toast("لا يوجد عنصر بهذا الرقم")
              }

