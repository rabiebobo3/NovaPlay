            findViewById<Button>(R.id.btn_direct).setOnClickListener {
             sp.put("auth_user", sp.s("guest_user", "guest")); fillServerForm(); show("server")
            }
            findViewById<View>(R.id.btn_admin_open).setOnClickListener { openAdmin() }
            findViewById<View>(R.id.btn_update_open).setOnClickListener { checkUpdate(true) }
            findViewById<View>(R.id.btn_theme_toggle).setOnClickListener {
             sp.put("theme", if (sp.s("theme", "night") == "night") "day" else "night")
             (getApplication() as NovaApp).applyTheme()
             recreate()
            }

            findViewById<Button>(R.id.btn_login).setOnClickListener { doLogin() }
            findViewById<Button>(R.id.btn_login_back).setOnClickListener { show("gate") }
            findViewById<TextView>(R.id.cb_auto).setOnClickListener {
             autoLogin = !autoLogin
             (it as TextView).text = if (autoLogin) "☑ دخول تلقائي عند التشغيل" else "☐ دخول تلقائي عند التشغيل"
             sp.put("auto_login", autoLogin)
            }
            autoLogin = sp.b("auto_login", false)
            findViewById<TextView>(R.id.cb_auto).text =
             if (autoLogin) "☑ دخول تلقائي عند التشغيل" else "☐ دخول تلقائي عند التشغيل"

            findViewById<Button>(R.id.btn_connect).setOnClickListener { connect() }
            findViewById<Button>(R.id.btn_saved).setOnClickListener { savedServers() }
            findViewById<Button>(R.id.btn_server_back).setOnClickListener { show(if (sp.s("auth_user").isNotEmpty()) "home" else "gate") }

            findViewById<View>(R.id.tile_live).setOnClickListener { openLive() }
            findViewById<View>(R.id.tile_movies).setOnClickListener { openGrid("movie") }
            findViewById<View>(R.id.tile_series).setOnClickListener { openGrid("series") }
            findViewById<View>(R.id.tile_switch).setOnClickListener { fillServerForm(); show("server") }
            findViewById<View>(R.id.tile_reload).setOnClickListener { startLoad(true) }
            findViewById<View>(R.id.tile_exit).setOnClickListener { finishAffinity() }
            findViewById<View>(R.id.tile_admin).setOnClickListener { openAdmin() }
            findViewById<View>(R.id.tile_update).setOnClickListener { checkUpdate(true) }
            findViewById<View>(R.id.tile_settings).setOnClickListener { openSettings() }
            findViewById<View>(R.id.tile_account).setOnClickListener { openAccount() }
            findViewById<Button>(R.id.btn_busy_cancel).setOnClickListener { cancelLoad() }
            findViewById<Button>(R.id.btn_watchdog_retry).setOnClickListener {
             wdBar.visibility = View.GONE; startLoad(true)
            }
