        private boolean expiryOk(String expiry) {
        // يدعم: 2026-12-31 و 15-09-2026 و 15/09/2026 و 15.09.2026
        try {
        if (expiry == null || expiry.trim().isEmpty()) return true;
        String s = expiry.trim().replace(".", "-").replace("/", "-").replace(" ", "");
        String[] p = s.split("-");
        if (p.length != 3) return true;
        int a = Integer.parseInt(p[0]); int b = Integer.parseInt(p[1]); int c = Integer.parseInt(p[2]);
        int year, month, day;
        if (p[0].length() == 4 || a > 31) { year = a; month = b; day = c; }
        else { day = a; month = b; year = c; }
        if (month < 1 || month > 12 || day < 1 || day > 31 || year < 2000 || year > 2100) return true;
        java.util.Calendar exp = java.util.Calendar.getInstance();
        exp.clear();
        exp.set(year, month - 1, day, 23, 59, 59);
        return System.currentTimeMillis() <= exp.getTimeInMillis();
        } catch (Exception e) { return true; }
        }

