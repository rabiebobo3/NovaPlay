                val n = intent.getIntExtra("pos", -1)
                val rawCh = intent.getStringExtra("chan")
                if (!rawCh.isNullOrBlank()) {
                    try {
                        val c = Channel.fromJson(JSONObject(rawCh))
                        if (!c.url.startsWith("http") && c.cmd.isNotBlank()) c.url = c.cmd
                        val idx = list.indexOfFirst { Store.favKey(it) == Store.favKey(c) }
                        if (idx >= 0) pos = idx
                        else { list.add(0, c); pos = 0 }
