# ============================================================================
#  NovaPlay_Kotlin_Full  —  v8.39  (ملف واحد مكتفٍ بذاته)
#
#  يبني تطبيق Android كامل (Kotlin) من الصفر داخل الـ workflow ثم:
#    1) يولّد المشروع كاملًا (Gradle + Manifest + 7 ملفات Kotlin + كل موارد الواجهة)
#    2) ينشئ مفتاح التوقيع app/debug.keystore تلقائيًا (بدون أي سر/SECRET إلزامي)
#    3) يبني نسختي debug و release
#    4) يرفع الـ APK كـ Artifacts
#    5) ينشر إصدار GitHub باسم:  nova-v<VERSION_NAME>-build<رقم التشغيل>
#
#  كل ميزات النسخة السابقة محفوظة بلا حذف ولا تعطيل (مباشر/أفلام/مسلسلات، M3U و Xtream
#  و بوابات MAC مع create_link والقبض، المحرّك الذكي، Firebase RTDB/FCM/OTA، الثيمات،
#  المجموعات والأقفال، PiP، الإرسال للشاشة، نظام العودة واستئناف المكان… إلخ).
#
#  إصلاح v8.39.1 (خطأ البناء):
#   • أُلغيت خطوة android-actions/setup-android@v3 — نسختها الحالية تفشل بـ
#     "Failed to find package 'tools'" لأن حزمة tools أُزيلت من مستودعات Google.
#     الآن نجهّز Android SDK بأنفسنا (متسامح: يتجاهل المكوّنات المثبّتة مسبقًا) ونكتب
#     local.properties، مع تحقّق واضح قبل البناء.
#
#  ما الذي أُصلح في v8.39؟
#   • الثقل وبطء الريموت بعد الخروج والعودة: لم تعد تُمسح ذاكرة الصور عند كل خروج
#     (كانت تُجبر التطبيق على إعادة تنزيل كل الشعارات والبوسترات ⇒ ثقل واضح)،
#     وإيقاف/استئناف طلبات الصور بدل تفريغها، وتشغيل مُسبق لفاكّ الترميز،
#     وتخزين مسبق في طابور بخيط واحد، وتحديث الواجهة عند تغيّر القيم فقط.
#   • عدم تشغيل القنوات/الأفلام/الحلقات بعد العودة: فحص صلاحية الرابط والتوكن عند
#     الاستئناف (إن انتهى توكن البوابة يُطلب create_link جديد)، وتصحيح تلقائي https→http،
#     وتجريب المصدر/المرشّح التالي، وإعادة تحضير ناعمة ثم إعادة بناء المشغّل — بلا تعليق.
#   • التخزين الثقيل: لم تبقَ كتابة قوائم كبيرة (آلاف العناصر) على الواجهة — تُكتب في الخيط
#     الخلفي وعند التغيّر فقط، مع حد أعلى للكاش، فصار الرجوع من المشغّل فوريًا.
#
#  طريقة الاستعمال: Actions → NovaPlay_Kotlin_Full → Run workflow
#     (يمكن ترك الحقول فارغة؛ الافتراضي 8.39 / 839)
# ============================================================================

name: NovaPlay_Kotlin_Full

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "اسم الإصدار الظاهر للمستخدم (مثال: 8.39)"
        required: false
        default: "8.39"
      version_code:
        description: "رقم البناء الداخلي (مثال: 839)"
        required: false
        default: "839"
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'

permissions:
  contents: write

env:
  VERSION_NAME: ${{ github.event.inputs.version_name || '8.39' }}
  VERSION_CODE: ${{ github.event.inputs.version_code || '839' }}
  GRADLE_VERSION: "8.6"
  NAMESPACE: com.nova.play
  APK_NAME: NovaPlay

jobs:
  build:
    name: بناء NovaPlay (debug + release)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      # اختياري: إن أضفت سرًّا باسم GOOGLE_SERVICES_JSON في المستودع فسيُفعّل Firebase/FCM تلقائيًا
      GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES_JSON }}

    steps:
      - name: تنزيل المستودع
        uses: actions/checkout@v4

      - name: تجهيز Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ملاحظة v8.39.1: أُلغيت خطوة android-actions/setup-android@v3 لأنها تُشغّل داخليًا
      # `sdkmanager tools` وحزمة "tools" أُزيلت من مستودعات Google ⇒ الخطوة تفشل دائمًا الآن.
      # صورة ubuntu-latest تأتي ومعها Android SDK جاهز، لذا نجهّزه بأنفسنا بشكل متسامح.
      - name: تجهيز Android SDK (بدون setup-android)
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK" ]; then SDK="/usr/local/lib/android/sdk"; fi
          export ANDROID_HOME="$SDK"
          export ANDROID_SDK_ROOT="$SDK"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          # البحث عن أدوات سطر الأوامر (cmdline-tools) أو تنزيلها عند الحاجة
          CMDLINE="$(ls -d "$SDK"/cmdline-tools/*/bin 2>/dev/null | head -n1 || true)"
          if [ -z "$CMDLINE" ]; then
            echo "› cmdline-tools غير موجودة — تُنزَّل الآن"
            mkdir -p "$SDK/cmdline-tools"
            curl -sSL -o /tmp/cmdline.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
            rm -rf /tmp/cmdl && mkdir -p /tmp/cmdl
            unzip -q /tmp/cmdline.zip -d /tmp/cmdl
            rm -rf "$SDK/cmdline-tools/latest"
            mv /tmp/cmdl/cmdline-tools "$SDK/cmdline-tools/latest"
            CMDLINE="$SDK/cmdline-tools/latest/bin"
          fi
          echo "$CMDLINE" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          export PATH="$CMDLINE:$SDK/platform-tools:$PATH"
          echo "› sdkmanager: $("$CMDLINE/sdkmanager" --version 2>/dev/null | head -n1 || echo '?')"

          # قبول كل التراخيص بصمت (بلا أي سؤال)
          yes | "$CMDLINE/sdkmanager" --licenses > /dev/null 2>&1 || true

          # تثبيت المكوّنات المطلوبة — يتجاهل الخطأ إن كانت مثبّتة مسبقًا (لا يفشل البناء)
          for pkg in "platform-tools" "platforms;android-34" "build-tools;34.0.0"; do
            echo "› تثبيت: $pkg"
            "$CMDLINE/sdkmanager" --install "$pkg" > /dev/null 2>&1               || "$CMDLINE/sdkmanager" "$pkg" > /dev/null 2>&1               || true
          done

          # تحقّق نهائي: إن غاب مكوّن أساسي نفشل برسالة واضحة بدل فشل غامض أثناء البناء
          test -d "$SDK/platforms/android-34" || { echo "!! المكوّن platforms;android-34 غير مثبّت"; exit 1; }
          test -d "$SDK/build-tools/34.0.0"   || { echo "!! المكوّن build-tools;34.0.0 غير مثبّت"; exit 1; }
          echo "✔ Android SDK جاهز: $SDK"

      - name: كتابة local.properties (مسار الـ SDK)
        run: |
          set -euo pipefail
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          cat local.properties

      - name: تنزيل Gradle ${{ env.GRADLE_VERSION }} + كاش
        run: |
          set -euo pipefail
          mkdir -p "$HOME/gradle-dist"
          if [ ! -d "$HOME/gradle-dist/gradle-$GRADLE_VERSION" ]; then
            curl -sSL -o /tmp/gradle.zip "https://services.gradle.org/distributions/gradle-$GRADLE_VERSION-bin.zip"
            unzip -q /tmp/gradle.zip -d "$HOME/gradle-dist"
          fi
          echo "$HOME/gradle-dist/gradle-$GRADLE_VERSION/bin" >> "$GITHUB_PATH"
          # نطبع نسخة Gradle التي سنستعملها فعليًا (بمسار مطلق) — لا نعتمد على PATH
          "$HOME/gradle-dist/gradle-$GRADLE_VERSION/bin/gradle" --version

      - name: كاش ملفات Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/build-cache
          key: nova-gradle-${{ runner.os }}-${{ env.GRADLE_VERSION }}-${{ hashFiles('**/*.gradle*', '**/gradle.properties') }}
          restore-keys: |
            nova-gradle-${{ runner.os }}-${{ env.GRADLE_VERSION }}-

      - name: (اختياري) google-services.json من الأسرار
        if: ${{ env.GOOGLE_SERVICES != '' }}
        run: |
          set -euo pipefail
          printf '%s' "$GOOGLE_SERVICES" > app/google-services.json
          echo "› أُضيف google-services.json — سيُفعّل Firebase/FCM في البناء"

      - name: توليد المشروع الكامل
        run: |
          set -euo pipefail

          # ============================================================
          #  NovaPlay — توليد المشروع الكامل داخل الـ workflow (ملف واحد مكتفٍ بذاته)
          #  كل الميزات محفوظة: Live/Movies/Series + MAC/M3U/Xtream + المحرّك الذكي + Firebase + OTA
          #  إصلاحات v8.39: ثقل التطبيق وبطء الريموت + التشغيل بعد الخروج والعودة
          # ============================================================
          mkdir -p app/src/main/java/com/nova/play \
                   app/src/main/res/values \
                   app/src/main/res/values-night \
                   app/src/main/res/xml \
                   app/src/main/res/drawable \
                   app/src/main/res/layout \
                   tools

          echo "› كتابة ملفات المشروع…"
          cat <<'NP_EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url 'https://jitpack.io' }
              }
          }
          rootProject.name = "NovaPlay"
          include ':app'
          NP_EOF

          cat <<'NP_EOF' > build.gradle
          // NovaPlay — الجذر. بلجـن google-services يُحمَّل لكن لا يُطبَّق إلا إذا وُجد google-services.json
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.google.gms:google-services:4.4.2'
              }
          }

          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          NP_EOF

          cat <<'NP_EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
          org.gradle.daemon=true
          org.gradle.parallel=true
          org.gradle.caching=true
          android.useAndroidX=true
          android.nonTransitiveRClass=false
          kotlin.code.style=official
          android.enableR8.fullMode=false
          android.r8.maxWorkers=1
          NP_EOF

          cat <<'NP_EOF' > .gitignore
          *.iml
          .gradle
          /local.properties
          /localTest
          /.idea
          .DS_Store
          /build
          /captures
          .externalNativeBuild
          .cxx
          app/build
          app/release
          .idea/
          NP_EOF

          cat <<'NP_EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          // google-services.json اختياري: إن وُجد فُعّل بلجـن Firebase، وإلا يعمل التطبيق في الوضع المحلي
          if (file("google-services.json").exists()) {
              apply plugin: 'com.google.android.gms.google-services'
          }

          android {
              namespace 'com.nova.play'
              compileSdk 34

              defaultConfig {
                  applicationId "com.nova.play"
                  minSdk 21
                  targetSdk 34
                  // الرقم والاصدار يمكن تمريرهما من الـ workflow (env) — وإلا الافتراضي 838 / 8.38
                  versionCode (System.getenv("VERSION_CODE")?.toInteger() ?: 838)
                  versionName (System.getenv("VERSION_NAME") ?: "8.38")
                  vectorDrawables.useSupportLibrary = true
              }

              // توقيع debug و release بنفس المفتاح حتى يثبت التحديث فوق النسخة الحالية بدون تعارض
              signingConfigs {
                  debug {
                      storeFile file("debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
                  release {
                      storeFile file("debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }

              buildTypes {
                  debug {
                      signingConfig signingConfigs.debug
                  }
                  release {
                      minifyEnabled false
                      shrinkResources false
                      signingConfig signingConfigs.release
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
              packagingOptions {
                  resources.excludes += ['META-INF/*.version', 'META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
              }
              lint {
                  abortOnError false
                  checkReleaseBuilds false
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.recyclerview:recyclerview:1.3.2'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
              implementation 'androidx.media3:media3-exoplayer:1.4.1'
              implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
              implementation 'androidx.media3:media3-exoplayer-dash:1.4.1'
              implementation 'androidx.media3:media3-exoplayer-smoothstreaming:1.4.1'
              implementation 'androidx.media3:media3-exoplayer-rtsp:1.4.1'
              implementation 'androidx.media3:media3-datasource-rtmp:1.4.1'
              implementation 'androidx.media3:media3-ui:1.4.1'
              implementation 'androidx.mediarouter:mediarouter:1.6.0'
              implementation 'com.github.bumptech.glide:glide:4.16.0'
              implementation platform('com.google.firebase:firebase-bom:33.7.0')
              implementation 'com.google.firebase:firebase-database'
              implementation 'com.google.firebase:firebase-messaging'
          }
          NP_EOF

          cat <<'NP_EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
           xmlns:tools="http://schemas.android.com/tools">

           <uses-permission android:name="android.permission.INTERNET" />
           <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
           <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
           <uses-permission android:name="android.permission.WAKE_LOCK" />
           <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
           <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />

           <uses-feature android:name="android.software.leanback" android:required="false" />
           <uses-feature android:name="android.hardware.touchscreen" android:required="false" />

           <application
            android:name=".NovaApp"
            android:allowBackup="false"
            android:banner="@drawable/ic_banner"
            android:hardwareAccelerated="true"
            android:icon="@drawable/ic_live"
            android:label="NovaPlay"
            android:largeHeap="true"
            android:resizeableActivity="true"
            android:supportsRtl="true"
            android:theme="@style/ThemeNova"
            android:usesCleartextTraffic="true"
            tools:targetApi="34">

            <activity
             android:name=".MainActivity"
             android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboard|keyboardHidden|navigation|density|uiMode"
             android:exported="true"
             android:launchMode="singleTop"
             android:screenOrientation="sensorLandscape"
             android:windowSoftInputMode="stateAlwaysHidden|adjustPan">
             <intent-filter>
              <action android:name="android.intent.action.MAIN" />
              <category android:name="android.intent.category.LAUNCHER" />
              <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
             </intent-filter>
            </activity>

            <activity
             android:name=".LiveActivity"
             android:launchMode="singleTop"
             android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboard|keyboardHidden|navigation|density|uiMode|locale|layoutDirection"
             android:exported="false"
             android:screenOrientation="sensorLandscape"
             android:theme="@style/ThemeNova"
             android:windowSoftInputMode="stateAlwaysHidden|adjustPan"/>

            <activity
             android:name=".GridActivity"
             android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboard|keyboardHidden|navigation|density|uiMode"
             android:exported="false"
             android:screenOrientation="sensorLandscape"
             android:windowSoftInputMode="stateAlwaysHidden|adjustPan"/>

            <provider
             android:name="androidx.core.content.FileProvider"
             android:authorities="${applicationId}.provider"
             android:exported="false"
             android:grantUriPermissions="true">
             <meta-data
              android:name="android.support.FILE_PROVIDER_PATHS"
              android:resource="@xml/file_paths" />
            </provider>

            <service
             android:name=".NovaMessagingService"
             android:exported="false">
             <intent-filter>
              <action android:name="com.google.firebase.MESSAGING_EVENT" />
             </intent-filter>
            </service>

            <meta-data
             android:name="com.google.firebase.messaging.default_notification_channel_id"
             android:value="nova_push" />
            <meta-data
             android:name="com.google.firebase.messaging.default_notification_color"
             android:resource="@color/np_gold" />
           </application>
          </manifest>
          NP_EOF

          cat <<'NP_EOF' > app/src/main/java/com/nova/play/Core.kt
          package com.nova.play

          import android.app.Activity
          import android.content.Context
          import android.content.Intent
          import android.content.SharedPreferences
          import android.net.Uri
          import android.os.Build
          import android.os.Handler
          import android.os.Looper
          import android.view.View
          import android.view.inputmethod.InputMethodManager
          import android.widget.EditText
          import android.view.ViewGroup
          import android.widget.Toast
          import androidx.appcompat.app.AlertDialog
          import org.json.JSONArray
          import org.json.JSONObject
          import android.widget.LinearLayout
          import android.widget.TextView
          import java.io.BufferedReader
          import java.io.InputStreamReader
          import java.io.ByteArrayOutputStream
          import java.io.File
          import java.io.InputStream
          import java.net.HttpURLConnection
          import java.net.URL
          import java.util.concurrent.Executors
          import java.util.zip.GZIPInputStream
          import kotlin.math.abs



          class Channel {
           var num = 0
           var name = ""
           var url = ""
           var group = "عام"
           var kind = "live"
           var id = ""
           var catId = ""
           var logo = ""
           var epgId = ""
           var alt = ""
           var extra = ""
           var mid = ""
           var sid = ""
           var snum = 0
           var stype = ""
           var art = ""

           fun toJson(): JSONObject = JSONObject().apply {
            put("num", num); put("name", name); put("url", trimToken(url)); put("group", group)
            put("kind", kind); put("id", id); put("catId", catId); put("logo", logo)
            put("epgId", epgId); put("alt", trimToken(alt)); put("extra", extra)
            put("mid", mid); put("sid", sid); put("stype", stype); put("snum", snum); put("art", art)
           }

           companion object {
            fun trimToken(u: String): String {
             if (u.isBlank() || !u.contains("play_token=")) return u
             var s = u.replace(Regex("([?&])play_token=[^&]*"), "$1")
             while (s.contains("?&")) s = s.replace("?&", "?")
             while (s.endsWith("&") || s.endsWith("?")) s = s.substring(0, s.length - 1)
             return s
            }

            fun fromJson(o: JSONObject): Channel = Channel().apply {
             num = o.optInt("num"); name = o.optString("name"); url = trimToken(o.optString("url"))
             group = o.optString("group", "عام"); kind = o.optString("kind", "live")
             id = o.optString("id"); catId = o.optString("catId"); logo = o.optString("logo")
             epgId = o.optString("epgId"); alt = o.optString("alt"); extra = o.optString("extra")
             mid = o.optString("mid"); sid = o.optString("sid"); stype = o.optString("stype")
             snum = o.optInt("snum")
             art = o.optString("art")
            }
           }
          }


          class Group {
           var name = ""
           var count = 0
           var special = ""
           var catId = ""
          }


          class Profile {
           var name = ""
           var type = "m3u"
           var url = ""
           var user = ""
           var pass = ""
           var mac = ""
           var epg = ""
           var added = 0L

           fun toJson(): JSONObject = JSONObject().apply {
            put("name", name); put("type", type); put("url", url); put("user", user)
            put("pass", pass); put("mac", mac); put("epg", epg); put("added", added)
           }

           fun key(): String = abs((type + url + user + pass + mac).hashCode()).toString(16)

           companion object {
            fun fromJson(o: JSONObject): Profile = Profile().apply {
             name = o.optString("name"); type = o.optString("type", "m3u"); url = o.optString("url")
             user = o.optString("user"); pass = o.optString("pass"); mac = o.optString("mac")
             epg = o.optString("epg"); added = o.optLong("added")
            }
           }
          }



          val Context.sp: SharedPreferences get() = getSharedPreferences("nova", Context.MODE_PRIVATE)

          fun SharedPreferences.s(k: String, d: String = ""): String = getString(k, d) ?: d
          fun SharedPreferences.i(k: String, d: Int = 0): Int = getInt(k, d)
          fun SharedPreferences.l(k: String, d: Long = 0L): Long = getLong(k, d)
          fun SharedPreferences.b(k: String, d: Boolean = false): Boolean = getBoolean(k, d)
          fun SharedPreferences.put(k: String, v: String?) = edit().putString(k, v).apply()
          fun SharedPreferences.put(k: String, v: Int) = edit().putInt(k, v).apply()
          fun SharedPreferences.put(k: String, v: Long) = edit().putLong(k, v).apply()
          fun SharedPreferences.put(k: String, v: Boolean) = edit().putBoolean(k, v).apply()
          fun SharedPreferences.rm(k: String) = edit().remove(k).apply()


          fun encodeChans(list: List<Channel>): String {
           val a = JSONArray()
           for (c in list) a.put(c.toJson())
           return a.toString()
          }

          fun decodeChans(text: String?, out: MutableList<Channel>) {
           out.clear()
           if (text.isNullOrEmpty()) return
           try {
            val a = JSONArray(text)
