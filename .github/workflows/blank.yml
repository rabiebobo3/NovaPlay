          package com.nova.play

          /**
           * الجلسة الحالية بين شاشة القائمة وشاشة المشغّل.
           * نحتفظ بنفس كائنات Channel (مرجع واحد) حتى يبقى التنقل بين القنوات دقيقاً.
           */
          object PlaySession {

              var list: MutableList<Channel> = ArrayList()
              var index: Int = 0
