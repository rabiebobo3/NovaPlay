          object Perf {
           private val decPool: java.util.concurrent.ExecutorService =
            Executors.newSingleThreadExecutor { r ->
             val th = Thread(r, "nova-dec"); th.isDaemon = true; th
            }
           @Volatile private var warmed = false

           fun fixAll(ctx: Context) {
            warmDecoder()
           }

           /**
            * تهيئة مُسبقة لفاكّ ترميز الفيديو في الخيط الخلفي — أول استعمال على الجهاز يستغرق
            * ثواني (خصوصًا في الرسيفرات/التلفازات) ويُحسب على أول فيلم/قناة ⇒ نُخرجه من الطريق.
            */
           fun warmDecoder() {
            if (warmed) return
            warmed = true
            decPool.execute {
             var codec: android.media.MediaCodec? = null
             val t0 = System.currentTimeMillis()
             try {
              codec = android.media.MediaCodec.createDecoderByType("video/avc")
              val took = System.currentTimeMillis() - t0
              if (took >= 0) Crash.note("DEC-INIT", "تهيئة فاكّ الترميز المسبقة: " + took + "مللي (مرة واحدة فقط على الجهاز)")
             } catch (t: Throwable) {
              Crash.log(t)
             } finally {
              try { codec?.release() } catch (t: Throwable) {}
             }
            }
           }
          }



          object Http {
           const val UA = "Mozilla/5.0 (Linux; Android 12) NovaPlay/8.2 IPTV-Client"


           fun read(url: String, headers: Map<String, String> = emptyMap(), timeoutMs: Int = 16000, retries: Int = 1): String {
            var last: Throwable? = null
            var attempt = 0
            while (attempt <= retries) {
             attempt++
             var c: HttpURLConnection? = null
             try {
              c = (URL(url).openConnection() as HttpURLConnection)
              c.connectTimeout = timeoutMs
              c.readTimeout = timeoutMs + 6000
              c.instanceFollowRedirects = true
              c.setRequestProperty("User-Agent", UA)
              c.setRequestProperty("Accept-Encoding", "gzip")
              c.setRequestProperty("Connection", "close")
              for ((k, v) in headers) c.setRequestProperty(k, v)
              val code = c.responseCode
              if (code in 300..399) {
               val loc = c.getHeaderField("Location")
               if (!loc.isNullOrEmpty()) { c.disconnect(); c = null; return read(loc, headers, timeoutMs, 0) }
              }
              if (code !in 200..299) throw java.io.IOException("HTTP $code")
              val raw: InputStream = c.inputStream
              val stream = if ("gzip".equals(c.contentEncodingEnc(), true)) GZIPInputStream(raw) else raw
              return stream.bufferedReader().use { it.readText() }
             } catch (t: Throwable) {
              last = t
              try { c?.disconnect() } catch (_: Throwable) {}
              if (attempt <= retries) Thread.sleep(400L * attempt)
             }
            }
            throw last ?: java.io.IOException("فشل الاتصال")
           }

           fun bytes(url: String, headers: Map<String, String> = emptyMap(), onProgress: ((Long, Long) -> Unit)? = null): ByteArray {
            val c = (URL(url).openConnection() as HttpURLConnection)
            try {
             c.connectTimeout = 20000
             c.readTimeout = 40000
             c.instanceFollowRedirects = true
             c.setRequestProperty("User-Agent", UA)
             for ((k, v) in headers) c.setRequestProperty(k, v)
             val code = c.responseCode
             if (code !in 200..299) throw java.io.IOException("HTTP $code")
             val total = c.contentLengthLong.let { if (it <= 0) -1L else it }
             val out = ByteArrayOutputStream(if (total in 1..8388608) total.toInt() else 1 shl 16)
             val buf = ByteArray(64 * 1024)
             var done = 0L
             c.inputStream.use { ins ->
              while (true) {
               val n = ins.read(buf)
               if (n < 0) break
               out.write(buf, 0, n)
               done += n
               if (onProgress != null) onProgress(done, total)
              }
             }
             return out.toByteArray()
            } finally {
             try { c.disconnect() } catch (_: Throwable) {}
            }
           }

           fun head(url: String): Int = try {
            val c = (URL(url).openConnection() as HttpURLConnection)
            c.requestMethod = "HEAD"; c.connectTimeout = 10000; c.readTimeout = 10000
            val code = c.responseCode
            c.disconnect()
            code
           } catch (t: Throwable) { -1 }
          }

          private fun HttpURLConnection.contentEncodingEnc(): String? = try { contentEncoding } catch (t: Throwable) { null }


