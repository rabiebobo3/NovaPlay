            private fun toast(m: String) = Toast.makeText(this, m, Toast.LENGTH_SHORT).show()
            private fun filter(q: String) {
              displayed = if (q.isEmpty()) baseDisplayed.toMutableList() else baseDisplayed.filter { it.n.contains(q, true) }.toMutableList()
              if (liveBox.visibility == View.VISIBLE) chansRv.adapter = LiveAdapter() else gridRv.adapter = CardAdapter()
            }
            private fun connect() {
              toast("جاري الاتصال..."); serverBox.visibility = View.GONE; homeBox.visibility = View.GONE
              when (serverType) {
                "m3u" -> httpGet(sUrl) { s -> if (s == null) toast("فشل تحميل القائمة") else parseM3u(s) }
                "xtream" -> { xtBase = sUrl.trimEnd('/'); loadXtream() }
                else -> { macBase = sUrl.trimEnd('/'); macCookie = "mac=$sMac; stb_lang=ar; timezone=Europe/London"; loadMac() }
              }
            }
            private fun httpGet(url: String, headers: Map<String,String> = emptyMap(), cb: (String?) -> Unit) {
              Thread {
                var res: String? = null
                try {
                  val c = URL(url).openConnection() as HttpURLConnection
                  c.connectTimeout = 15000; c.readTimeout = 20000
                  for ((k, v) in headers) c.setRequestProperty(k, v)
                  if (c.responseCode == 200) res = c.inputStream.bufferedReader().use { it.readText() }
                } catch (e: Exception) { res = null }
                runOnUiThread { cb(res) }
              }.start()
            }
            private fun parseM3u(s: String) {
              liveList.clear(); movieList.clear(); seriesList.clear()
              var c: Ch? = null
              for (line in s.lines()) {
                val l = line.trim()
                if (l.startsWith("#EXTINF")) {
                  c = Ch(); c.n = l.substringAfterLast(',').trim()
                  c.g = attr(l, "group-title"); if (c.g.isEmpty()) c.g = "عام"
                  c.type = when { c.g.contains("movie", true) || c.g.contains("film", true) || c.g.contains("أفلام", true) || c.g.contains("افلام", true) -> "movie"; c.g.contains("series", true) || c.g.contains("مسلسل", true) -> "series"; else -> "live" }
                } else if (l.isNotEmpty() && !l.startsWith("#") && c != null) {
                  c.u = l
                  when (c.type) { "movie" -> movieList.add(c); "series" -> seriesList.add(c); else -> liveList.add(c) }
                  c = null
                }
              }
              runOnUiThread { afterLoad() }
            }
            private fun attr(l: String, key: String): String { val m = Regex("$key=\"([^\"]*)\"").find(l); return m?.groupValues?.get(1)?.trim() ?: "" }
            private fun loadXtream() {
              val api = "$xtBase/player_api.php?username=$sUser&password=$sPass"
              httpGet(api) { s ->
                if (s != null) { try { val ui = JSONObject(s).optJSONObject("user_info"); if (ui != null) homeExp.text = "قائمة التشغيل الحالية تنتهي: ${ui.optString("exp_date", "-")}" } catch (e: Exception) {} }
                httpGet(api + "&action=get_live_categories") { c ->
                  val lc = parseCats(c)
                  httpGet(api + "&action=get_live_streams") { ls -> parseXtream(ls, lc, "live")
                    httpGet(api + "&action=get_vod_categories") { vc -> movieCats.clear(); movieCats.addAll(parseCats(vc))
                      httpGet(api + "&action=get_vod_streams") { vs -> parseXtream(vs, movieCats, "movie")
                        httpGet(api + "&action=get_series_categories") { sc -> seriesCats.clear(); seriesCats.addAll(parseCats(sc))
                          httpGet(api + "&action=get_series") { ss -> parseXtream(ss, seriesCats, "series"); runOnUiThread { afterLoad() } }
                        }
                      }
                    }
                  }
                }
              }
            }
            private fun parseCats(s: String?): List<Grp> {
              val out = mutableListOf<Grp>(); if (s == null) return out
              try { val a = JSONArray(s); for (i in 0 until a.length()) { val o = a.getJSONObject(i); val g = Grp(); g.catId = o.optString("category_id"); g.name = o.optString("category_name"); out.add(g) } } catch (e: Exception) {}
              return out
            }
            private fun parseXtream(s: String?, cats: List<Grp>, type: String) {
              if (s == null) return
              try {
                val a = JSONArray(s)
                for (i in 0 until a.length()) {
                  val o = a.getJSONObject(i); val c = Ch()
                  c.g = cats.firstOrNull { it.catId == o.optString("category_id") }?.name ?: "عام"
                  c.type = type
                  when (type) {
                    "live" -> { c.n = o.optString("name"); c.id = o.optString("stream_id"); c.u = "$xtBase/live/$sUser/$sPass/${c.id}.m3u8"; liveList.add(c) }
                    "movie" -> { c.n = o.optString("name"); c.id = o.optString("stream_id"); c.u = "$xtBase/movie/$sUser/$sPass/${c.id}.${o.optString("container_extension","mp4")}"; movieList.add(c) }
                    else -> { c.n = o.optString("name"); c.id = o.optString("series_id"); seriesList.add(c) }
                  }
                }
              } catch (e: Exception) {}
            }
            private fun loadMac() {
              val h1 = mapOf("Cookie" to macCookie, "User-Agent" to "Mozilla/5.0 (QtEmbedded; U; Linux; C)")
              httpGet("$macBase/server/load.php?type=stb&action=handshake&token=&JsHttpRequest=1-xml", h1) { s ->
                if (s == null) { toast("فشل الاتصال بالبوابة"); return@httpGet }
                try { val js = JSONObject(s).opt("js"); macToken = when (js) { is JSONObject -> js.optString("token"); is String -> js; else -> "" } } catch (e: Exception) {}
                val h2 = h1 + ("Authorization" to "Bearer $macToken")
                httpGet("$macBase/server/load.php?type=itv&action=get_all_channels&JsHttpRequest=1-xml", h2) { ls ->
                  liveList.clear()
                  try { val o = JSONObject(ls ?: ""); val js = o.opt("js"); val data = if (js is JSONObject) js.optJSONArray("data") else js as? JSONArray
                    if (data != null) for (i in 0 until data.length()) { val it = data.getJSONObject(i); val c = Ch(); c.n = it.optString("name"); c.u = it.optString("cmd"); c.g = it.optString("tv_genre_id"); c.id = it.optString("id"); liveList.add(c) }
                  } catch (e: Exception) {}
                  httpGet("$macBase/server/load.php?type=itv&action=get_genres&JsHttpRequest=1-xml", h2) { gs ->
                    val gm = mutableMapOf<String, String>()
                    try { val o = JSONObject(gs ?: ""); val js = o.opt("js"); val arr = if (js is JSONObject) js.optJSONArray("data") else js as? JSONArray
                      if (arr != null) for (i in 0 until arr.length()) { val it = arr.getJSONObject(i); gm[it.optString("id")] = it.optString("title") } } catch (e: Exception) {}
                    for (c in liveList) if (gm.containsKey(c.g)) c.g = gm[c.g]!!
                    movieCats.clear(); seriesCats.clear()
                    httpGet("$macBase/server/load.php?type=vod&action=get_categories&JsHttpRequest=1-xml", h2) { vc ->
                      try { val o = JSONObject(vc ?: ""); val js = o.opt("js"); val arr = if (js is JSONObject) js.optJSONArray("data") else js as? JSONArray
                        if (arr != null) for (i in 0 until arr.length()) { val it = arr.getJSONObject(i); val g = Grp(); g.name = it.optString("title"); g.catId = it.optString("id"); movieCats.add(g) } } catch (e: Exception) {}
                      httpGet("$macBase/server/load.php?type=series&action=get_categories&JsHttpRequest=1-xml", h2) { sc ->
                        try { val o = JSONObject(sc ?: ""); val js = o.opt("js"); val arr = if (js is JSONObject) js.optJSONArray("data") else js as? JSONArray
                          if (arr != null) for (i in 0 until arr.length()) { val it = arr.getJSONObject(i); val g = Grp(); g.name = it.optString("title"); g.catId = it.optString("id"); seriesCats.add(g) } } catch (e: Exception) {}
                        runOnUiThread { afterLoad() }
                      }
                    }
                  }
                }
              }
            }
            private fun loadMacCategory(type: String, catId: String) {
              val h = mapOf("Cookie" to macCookie, "Authorization" to "Bearer $macToken", "User-Agent" to "Mozilla/5.0 (QtEmbedded; U; Linux; C)")
              val t = if (type == "movie") "vod" else "series"
              httpGet("$macBase/server/load.php?type=$t&action=get_ordered_list&genre=$catId&p=1&JsHttpRequest=1-xml", h) { s ->
                displayed.clear()
                if (s != null) try { val o = JSONObject(s); val js = o.opt("js"); val data = if (js is JSONObject) js.optJSONArray("data") else js as? JSONArray
                  if (data != null) for (i in 0 until data.length()) { val it = data.getJSONObject(i); val c = Ch(); c.n = it.optString("name"); c.u = it.optString("cmd"); c.g = it.optString("category_name"); c.type = type; c.id = it.optString("id"); displayed.add(c) }
                } catch (e: Exception) {}
                baseDisplayed = displayed.toList(); runOnUiThread { refreshMode() }
              }
            }
            private fun loadSeriesInfo(id: String) {
              val api = "$xtBase/player_api.php?username=$sUser&password=$sPass&action=get_series_info&series_id=$id"
              httpGet(api) { s ->
                displayed.clear()
                if (s != null) try {
                  val eps = JSONObject(s).optJSONObject("episodes")
                  if (eps != null) { val keys = eps.keys(); while (keys.hasNext()) { val k = keys.next(); val arr = eps.getJSONArray(k); for (i in 0 until arr.length()) { val o = arr.getJSONObject(i); val c = Ch(); c.n = "حلقة ${o.optString("episode_num")} - ${o.optString("title")}"; c.u = "$xtBase/series/$sUser/$sPass/${o.optString("id")}.${o.optString("container_extension","mp4")}"; c.type = "episode"; displayed.add(c) } } }
                } catch (e: Exception) {}
                baseDisplayed = displayed.toList(); runOnUiThread { refreshMode() }
              }
            }
            private fun afterLoad() { homeBox.visibility = View.VISIBLE; liveBox.visibility = View.GONE; gridBox.visibility = View.GONE; fullBox.visibility = View.GONE; toast("تم تحميل القائمة") }
            private fun curList(): List<Ch> = when (mode) { "live" -> liveList; "movie" -> movieList; else -> seriesList }
            private fun buildGroups() {
              groups.clear()
              if (mode == "live") {
                groups.add(Grp().apply { name = "+ Add Group"; special = "add" })
                groups.add(Grp().apply { name = "شوهدت مؤخرا"; special = "recent"; count = recents.size })
                groups.add(Grp().apply { name = "ALL"; special = "all"; count = liveList.size })
                groups.add(Grp().apply { name = "المفضلات"; special = "fav"; count = favs.size })
                groups.add(Grp().apply { name = "Lock"; special = "lock"; count = 0 })
                liveList.groupBy { it.g }.forEach { groups.add(Grp().apply { name = it.key; count = it.value.size }) }
              } else {
                groups.add(Grp().apply { name = "ALL"; special = "all"; count = curList().size })
                (if (mode == "movie") movieCats else seriesCats).forEach { cc -> groups.add(Grp().apply { name = cc.name; catId = cc.catId; count = if (serverType == "mac") 0 else curList().count { it.g == cc.name } }) }
              }
            }
            private fun showLive() { homeBox.visibility = View.GONE; gridBox.visibility = View.GONE; liveBox.visibility = View.VISIBLE; buildGroups(); groupsRv.adapter = GroupAdapter(groupsRv); if (groups.isNotEmpty()) selectGroup(groups[0]) }
            private fun showGrid() { homeBox.visibility = View.GONE; liveBox.visibility = View.GONE; gridBox.visibility = View.VISIBLE; gridTitle.text = if (mode == "movie") "أفلام" else "مسلسلات"; buildGroups(); ggroupsRv.adapter = GroupAdapter(ggroupsRv); displayed = curList().toMutableList(); baseDisplayed = displayed.toList(); gridRv.adapter = CardAdapter() }
            private fun selectGroup(g: Grp) {
              curGroup = g.name
              when (g.special) {
                "add" -> toast("غير متاح")
                "lock" -> toast("قائمة مقفلة")
                "recent" -> { displayed = recents.toMutableList(); baseDisplayed = displayed.toList(); refreshMode() }
                "fav" -> { displayed = favs.toMutableList(); baseDisplayed = displayed.toList(); refreshMode() }
                else -> {
                  if (serverType == "mac" && mode != "live") loadMacCategory(mode, g.catId)
                  else { displayed = curList().filter { if (g.special == "all") true else it.g == g.name }.toMutableList(); baseDisplayed = displayed.toList(); refreshMode() }
                }
              }
            }
            private fun refreshMode() {
              if (mode == "live") { liveBox.visibility = View.VISIBLE; gridBox.visibility = View.GONE; chansRv.adapter = LiveAdapter() }
              else { gridBox.visibility = View.VISIBLE; liveBox.visibility = View.GONE; gridTitle.text = if (mode == "movie") "أفلام" else "مسلسلات"; gridRv.adapter = CardAdapter() }
            }
            private fun toggleFav() {
              val c = cur ?: return
              val idx = favs.indexOfFirst { it.n == c.n && it.u == c.u }
              if (idx >= 0) { favs.removeAt(idx); toast("أزيل من المفضلة") } else { favs.add(c); toast("أضيف للمفضلة") }
              saveList("favs", favs)
            }
            private fun play(c: Ch, full: Boolean) {
              cur = c
              recents.removeAll { it.n == c.n && it.u == c.u }; recents.add(0, c); if (recents.size > 30) recents.removeAt(recents.size - 1); saveList("recents", recents)
              if (full) { fullBox.visibility = View.VISIBLE; fullTitle.text = c.n; PlayerView.switchTargetView(player, pv, pvFull) }
              else if (fullBox.visibility == View.VISIBLE) { fullBox.visibility = View.GONE; PlayerView.switchTargetView(player, pvFull, pv) }
              infoName.text = c.n
              infoDesc.text = "${c.g} | ${if (c.type == "live") "بث مباشر" else c.type}\nلا يتوفر دليل برامج حالياً"
              player?.setMediaItem(MediaItem.fromUri(c.u)); player?.prepare(); player?.play()
              chansRv.adapter?.notifyDataSetChanged()
            }
            private fun saveList(key: String, list: List<Ch>) {
              val a = JSONArray(); for (c in list) { val o = JSONObject(); o.put("n", c.n); o.put("u", c.u); o.put("g", c.g); o.put("type", c.type); o.put("id", c.id); o.put("catId", c.catId); a.put(o) }
              prefs.edit().putString(key, a.toString()).apply()
            }
            private fun loadList(key: String, list: MutableList<Ch>) {
              list.clear()
              try { val a = JSONArray(prefs.getString(key, "[]")); for (i in 0 until a.length()) { val o = a.getJSONObject(i); val c = Ch(); c.n = o.optString("n"); c.u = o.optString("u"); c.g = o.optString("g"); c.type = o.optString("type"); c.id = o.optString("id"); c.catId = o.optString("catId"); list.add(c) } } catch (e: Exception) {}
            }
            private fun saveServer(o: JSONObject) {
              val a = JSONArray(prefs.getString("servers", "[]")); a.put(o); prefs.edit().putString("servers", a.toString()).apply()
            }
            inner class GroupAdapter(private val rv: RecyclerView) : RecyclerView.Adapter<GroupAdapter.H>() {
              inner class H(v: View) : RecyclerView.ViewHolder(v) { val name: TextView = v.findViewById(R.id.g_name); val count: TextView = v.findViewById(R.id.g_count) }
              override fun onCreateViewHolder(p: ViewGroup, t: Int): H = H(LayoutInflater.from(p.context).inflate(R.layout.item_group, p, false))
              override fun getItemCount(): Int = groups.size
              override fun onBindViewHolder(h: H, i: Int) {
                val g = groups[i]; h.name.text = g.name
                h.count.text = if (g.special == "add" || g.special == "lock") "" else g.count.toString()
                h.name.setTextColor(if (g.name == curGroup) Color.parseColor("#FFD400") else Color.WHITE)
                h.itemView.setOnClickListener { selectGroup(g) }
              }
            }
            inner class LiveAdapter : RecyclerView.Adapter<LiveAdapter.H>() {
              inner class H(v: View) : RecyclerView.ViewHolder(v) { val num: TextView = v.findViewById(R.id.c_num); val name: TextView = v.findViewById(R.id.c_name) }
              override fun onCreateViewHolder(p: ViewGroup, t: Int): H = H(LayoutInflater.from(p.context).inflate(R.layout.item_live, p, false))
              override fun getItemCount(): Int = displayed.size
              override fun onBindViewHolder(h: H, i: Int) {
                val c = displayed[i]; h.num.text = (i + 1).toString(); h.name.text = c.n
                h.name.setTextColor(if (cur != null && cur!!.n == c.n) Color.parseColor("#FFD400") else Color.WHITE)
                h.itemView.setOnClickListener { play(c, false) }
              }
            }
            inner class CardAdapter : RecyclerView.Adapter<CardAdapter.H>() {
              inner class H(v: View) : RecyclerView.ViewHolder(v) { val name: TextView = v.findViewById(R.id.k_name); val icon: android.widget.ImageView = v.findViewById(R.id.k_icon) }
              override fun onCreateViewHolder(p: ViewGroup, t: Int): H = H(LayoutInflater.from(p.context).inflate(R.layout.item_card, p, false))
              override fun getItemCount(): Int = displayed.size
              override fun onBindViewHolder(h: H, i: Int) {
                val c = displayed[i]; h.name.text = c.n
                h.icon.setImageResource(if (mode == "series") R.drawable.ic_series else R.drawable.ic_movie)
                h.itemView.setOnClickListener {
                  when {
                    c.type == "cat" -> loadMacCategory(mode, c.catId)
                    c.type == "series" && serverType == "xtream" -> loadSeriesInfo(c.id)
                    else -> play(c, true)
                  }
                }
              }
            }
            override fun onBackPressed() {
              when {
                fullBox.visibility == View.VISIBLE -> { fullBox.visibility = View.GONE; PlayerView.switchTargetView(player, pvFull, pv) }
                liveBox.visibility == View.VISIBLE || gridBox.visibility == View.VISIBLE -> { homeBox.visibility = View.VISIBLE; liveBox.visibility = View.GONE; gridBox.visibility = View.GONE }
                else -> super.onBackPressed()
              }
            }
            override fun onDestroy() { player?.release(); player = null; super.onDestroy() }
          }
          KT_EOF
