        edtUser.setText(username); edtUser.setEnabled(false);
        edtPass.setText(sval(c.child("password")));
        edtExpiry.setText(sval(c.child("expiry")));
        edtServer.setText(sval(c.child("server_id")));
        chkBlocked.setChecked(sval(c.child("blocked")).equalsIgnoreCase("true"));
        }
        box.addView(edtUser); box.addView(edtPass); box.addView(edtExpiry); box.addView(edtServer); box.addView(chkBlocked);
        new AlertDialog.Builder(this)
        .setTitle(c == null ? "➕ إضافة مشترك جديد" : "✏️ تعديل: " + username)
