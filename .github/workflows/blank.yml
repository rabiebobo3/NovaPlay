                tvSub.text = listOfNotNull(
                    c.group.ifBlank { null },
                    when (c.kind) { "live" -> "بث مباشر"; "movie" -> "فيلم"; "series" -> "مسلسل"; "episode" -> "حلقة"; "season" -> "موسم"; else -> null }
                ).joinToString("  •  ")
                errBox.visibility = View.GONE
                resume = if (c.kind == "live") 0L else Store.pos(this, Store.favKey(c))
                val direct = c.url.startsWith("http") && Channel.direct(c.url) && !Channel.broken(c.url)
                if (direct) {
                    startPlayback(c, c.url, mySeq)
                } else {
                    busy(true, "طلب رابط من البوابة…")
                    Catalog.link(c) { u ->
                        if (mySeq != seq) return@link
                        if (u.isBlank()) {
                            busy(false, "")
                            err(true, "تعذّر الحصول على رابط تشغيل من البوابة لهذا العنصر.\n" + Catalog.status)
                            return@link
                        }
                        startPlayback(c, u, mySeq)
                    }
                }
                fetchEpg(c)
            }

            private fun startPlayback(c: Channel, url: String, mySeq: Int) {
                if (mySeq != seq) return
                val p = player ?: return
                lastUrl = url
                Diag.d("PLAY", c.kind + " → " + tail(url, 190))
                clearWatch()
                errBox.visibility = View.GONE
                busy(true, "جارٍ التحميل…")
                val mime = mimeOf(url)
                val b = MediaItem.Builder()
                    .setUri(url)
                    .setMediaMetadata(MediaMetadata.Builder().setTitle(c.name).build())
                if (mime != null) b.setMimeType(mime)
                if (c.kind == "live") {
                    b.setLiveConfiguration(
                        MediaItem.LiveConfiguration.Builder()
                            .setTargetOffsetMs(6000L)
                            .setMinOffsetMs(3000L)
                            .setMaxOffsetMs(15000L)
                            .setMinPlaybackSpeed(0.97f)
                            .setMaxPlaybackSpeed(1.03f)
                            .build()
                    )
                }
                try {
                    p.stop()
                    p.setMediaItem(b.build())
                    p.prepare()
                    p.playWhenReady = true
                    showControls()
                } catch (t: Throwable) {
                    Diag.e(t)
                    err(true, "تعذّر بدء التشغيل: " + (t.message ?: ""))
                    return
                }
                armWatch(mySeq)
            }

            private fun armWatch(mySeq: Int) {
                watchRun?.let { h.removeCallbacks(it) }
                val r = Runnable {
                    val p = player ?: return@Runnable
                    if (mySeq != seq) return@Runnable
                    if (!p.playWhenReady) return@Runnable
                    if (p.playbackState == Player.STATE_READY && p.isPlaying && p.videoFormat != null) return@Runnable
                    Diag.d("WATCH", "لا صورة بعد 7 ثوان • state=" + p.playbackState +
                        " playing=" + p.isPlaying + " video=" + (p.videoFormat != null) + " url=" + tail(lastUrl, 90))
                    retry("الصورة لا تظهر")
                }
                watchRun = r
                h.postDelayed(r, 7000)
            }

            private fun clearWatch() { watchRun?.let { h.removeCallbacks(it) }; watchRun = null }

            private fun retry(why: String) {
                val c = cur ?: return
                if (attempt >= 3) {
                    busy(false, "")
                    err(true, "تعذّر التشغيل: $why\n" + tail(lastUrl, 90))
                    return
                }
                attempt++
                Diag.d("RETRY", "#$attempt • $why")
                when (attempt) {
                    1 -> {
                        busy(true, "إعادة المحاولة…")
                        h.postDelayed({ startPlayback(c, lastUrl, seq) }, 700)
                    }
                    2 -> {
                        busy(true, "طلب رابط جديد من البوابة…")
                        Catalog.profile?.let { if (it.type == "mac") Portal.get(it).invalidate() }
                        Catalog.link(c) { u ->
                            if (u.isNotBlank() && u != lastUrl) startPlayback(c, u, seq)
                            else startPlayback(c, lastUrl, seq)
                        }
                    }
                    3 -> {
                        val alt = c.alt
                        if (alt.isNotBlank() && alt != lastUrl) {
                            busy(true, "تجربة مصدر بديل…")
                            startPlayback(c, alt, seq)
                        } else {
                            busy(false, "")
                            err(true, "تعذّر التشغيل: $why\n" + tail(lastUrl, 90))
                        }
                    }
                }
            }

            /* ------------------------------ أحداث المشغّل ------------------------------ */

            override fun onPlaybackStateChanged(state: Int) {
                val p = player ?: return
                if (state == lastState) return
                lastState = state
                when (state) {
                    Player.STATE_BUFFERING -> busy(true, "جاري التحميل…")
                    Player.STATE_READY -> {
                        busy(false, "")
                        clearWatch()
                        attempt = 0
                        lastPosVal = -1L
                        lastPosAt = System.currentTimeMillis()
                        val dur = p.duration
                        val vod = dur > 0 && dur != C.TIME_UNSET
                        seekRow.visibility = if (vod) View.VISIBLE else View.GONE
                        sb.max = (dur / 1000).toInt().coerceAtLeast(0)
                        tvDur.text = fmtTime(dur)
                        Diag.d("READY", "kind=" + (cur?.kind ?: "-") + " video=" + (p.videoFormat?.height ?: 0) +
                            "p dur=" + (if (vod) fmtTime(dur) else "مباشر"))
                        if (p.videoFormat == null) Diag.d("WARN", "READY بلا مسار فيديو — قد تكون الصوت فقط")
                        if (vod && resume > 15000L && resume < dur - 15000L) {
                            val r = resume
                            resume = 0L
                            askResume(r)
                        } else resume = 0L
                        if (cur?.kind != "live") showControls()
                    }
                    Player.STATE_ENDED -> {
                        busy(false, "")
                        cur?.let { Store.setPos(this, Store.favKey(it), 0L) }
                        if (autoNext && next(true)) return
                        showControls()
                        toast("انتهى العرض")
                    }
                }
            }

            override fun onIsPlayingChanged(isPlaying: Boolean) {
                btnPlay.setImageResource(if (isPlaying) R.drawable.ic_pause else R.drawable.ic_play)
                if (isPlaying) {
                    busy(false, "")
                    errBox.visibility = View.GONE
                }
            }

            override fun onVideoSizeChanged(size: VideoSize) {
                applyResize()
            }

            override fun onPlayerError(e: PlaybackException) {
                val http = httpCode(e)
                Diag.d("PLAY-ERR", "code=" + e.errorCodeName + (if (http > 0) " http=$http" else "") +
                    " kind=" + (cur?.kind ?: "-") + " url=" + tail(lastUrl, 130))
                if (!triedHttp && lastUrl.startsWith("https://") &&
                    (e.errorCode == PlaybackException.ERROR_CODE_IO_NETWORK_CONNECTION_FAILED || http >= 500)
                ) {
                    triedHttp = true
                    val c = cur ?: return
                    val plain = "http://" + lastUrl.substring(8)
                    Diag.d("PLAY-FIX", "تجربة http بدل https")
                    startPlayback(c, plain, seq)
                    return
                }
                retry(e.errorCodeName + (if (http > 0) " ($http)" else ""))
            }

            private fun httpCode(e: PlaybackException): Int {
                var c: Throwable? = e
                for (i in 0..3) {
                    if (c is androidx.media3.datasource.HttpDataSource.InvalidResponseCodeException) return c.responseCode
                    c = c?.cause ?: break
                }
                return -1
            }

            /* --------------------------------- الواجهة --------------------------------- */

            private fun busy(on: Boolean, t: String) {
                busyBox.visibility = if (on) View.VISIBLE else View.GONE
                if (t.isNotBlank()) tvBusy.text = t
            }

            private fun err(on: Boolean, msg: String) {
                if (on) {
                    tvErr.text = msg
                    errBox.visibility = View.VISIBLE
                    errBox.requestFocus()
                } else errBox.visibility = View.GONE
            }

            private fun togglePlay() {
                val p = player ?: return
                try {
                    if (p.isPlaying) p.pause() else { p.playWhenReady = true; p.play() }
                } catch (t: Throwable) { Diag.e(t) }
                showControls()
            }

            private fun seek(delta: Long) {
                val p = player ?: return
                if (p.duration <= 0 || p.duration == C.TIME_UNSET) { toast("التقديم غير متاح في البث المباشر"); return }
                val to = (p.currentPosition + delta).coerceIn(0, p.duration)
                p.seekTo(to)
                hint((if (delta > 0) "⏩ " else "⏪ ") + fmtTime(to))
                showControls()
            }

            private fun hint(t: String) {
                tvHint.text = t
                tvHint.visibility = View.VISIBLE
                tvHint.alpha = 1f
                tvHint.animate().cancel()
                tvHint.animate().alpha(0f).setStartDelay(600).setDuration(500)
                    .withEndAction { tvHint.visibility = View.GONE }.start()
            }

            private fun showControls() {
                topBar.visibility = View.VISIBLE
                bottomBar.visibility = View.VISIBLE
                topBar.alpha = 1f
                bottomBar.alpha = 1f
                hideRun?.let { h.removeCallbacks(it) }
                hideRun = Runnable { hideControls() }
                h.postDelayed(hideRun!!, 6000)
            }

            private fun hideControls() {
                if (listOpen) return
                topBar.visibility = View.GONE
                bottomBar.visibility = View.GONE
                currentFocus?.clearFocus()
                pv.requestFocus()
            }

            private fun controlsVisible() = bottomBar.visibility == View.VISIBLE

            private fun toggleList() {
                listOpen = !listOpen
                sideList.visibility = if (listOpen) View.VISIBLE else View.GONE
                if (listOpen) {
                    showControls()
                    val i = list.indexOfFirst { Store.favKey(it) == Store.favKey(cur ?: return) }
                    if (i >= 0) rvList.scrollToPosition(i)
                    rvList.postDelayed({ rvList.requestFocus() }, 80)
                } else {
                    pv.requestFocus()
                }
            }

            private fun focusInBar(): Boolean {
                val v = currentFocus ?: return false
                return isChildOf(bottomBar, v) || isChildOf(topBar, v) || isChildOf(errBox, v) || isChildOf(sideList, v)
            }

            private fun isChildOf(parent: View, v: View): Boolean {
                var p = v.parent
                while (p != null) {
                    if (p === parent) return true
                    p = p.parent
                }
                return false
            }

            /* --------------------------------- التنقّل --------------------------------- */

            private fun next(auto: Boolean): Boolean {
                if (list.isEmpty()) return false
                var n = pos + 1
                if (n >= list.size) {
                    if (!auto) { toast("هذه آخر عنصر في القائمة"); return false }
                    n = 0
                }
                pos = n
                play(list[n])
                return true
            }

            private fun prev() {
                if (list.isEmpty()) return
                var n = pos - 1
                if (n < 0) n = list.size - 1
                pos = n
                play(list[n])
            }

            /* --------------------------------- المفاتيح --------------------------------- */

            override fun dispatchKeyEvent(e: KeyEvent): Boolean {
                if (e.action == KeyEvent.ACTION_DOWN) {
                    when (e.keyCode) {
                        KeyEvent.KEYCODE_DPAD_UP, KeyEvent.KEYCODE_DPAD_DOWN -> {
                            if (!listOpen && !focusInBar()) { toggleList(); return true }
                        }
                        KeyEvent.KEYCODE_DPAD_LEFT, KeyEvent.KEYCODE_DPAD_RIGHT -> {
                            if (listOpen || focusInBar() || currentFocus === sb) return super.dispatchKeyEvent(e)
                            val now = System.currentTimeMillis()
                            if (isLive()) {
                                if (e.repeatCount == 0 || now - lastSwitchAt > 400) {
                                    lastSwitchAt = now
                                    if (e.keyCode == KeyEvent.KEYCODE_DPAD_RIGHT) next(false) else prev()
                                }
                            } else {
                                if (now - lastSeekAt > 220) {
                                    lastSeekAt = now
                                    seek(if (e.keyCode == KeyEvent.KEYCODE_DPAD_RIGHT) 10000 else -10000)
                                }
                            }
                            return true
                        }
                        KeyEvent.KEYCODE_DPAD_CENTER, KeyEvent.KEYCODE_ENTER, KeyEvent.KEYCODE_NUMPAD_ENTER -> {
                            if (focusInBar() || listOpen) return super.dispatchKeyEvent(e)
                            if (!controlsVisible()) showControls()
                            else togglePlay()
                            return true
                        }
                        KeyEvent.KEYCODE_BACK -> {
                            if (listOpen) { toggleList(); return true }
                            if (controlsVisible()) { hideControls(); return true }
                        }
                        KeyEvent.KEYCODE_MENU, KeyEvent.KEYCODE_SETTINGS, KeyEvent.KEYCODE_INFO -> {
                            optionsDialog()
                            return true
                        }
                        KeyEvent.KEYCODE_MEDIA_PLAY_PAUSE -> { togglePlay(); return true }
                        KeyEvent.KEYCODE_MEDIA_PLAY -> { player?.play(); return true }
                        KeyEvent.KEYCODE_MEDIA_PAUSE -> { player?.pause(); return true }
                        KeyEvent.KEYCODE_MEDIA_NEXT -> { next(false); return true }
                        KeyEvent.KEYCODE_MEDIA_PREVIOUS -> { prev(); return true }
                        KeyEvent.KEYCODE_MEDIA_FAST_FORWARD -> { seek(30000); return true }
                        KeyEvent.KEYCODE_MEDIA_REWIND -> { seek(-30000); return true }
                        KeyEvent.KEYCODE_CHANNEL_UP -> { prev(); return true }
                        KeyEvent.KEYCODE_CHANNEL_DOWN -> { next(false); return true }
                        KeyEvent.KEYCODE_DEL -> {
                            if (dial.isNotEmpty()) { dial = dial.dropLast(1); updateDial(); return true }
                        }
                        KeyEvent.KEYCODE_0, KeyEvent.KEYCODE_1, KeyEvent.KEYCODE_2, KeyEvent.KEYCODE_3, KeyEvent.KEYCODE_4,
                        KeyEvent.KEYCODE_5, KeyEvent.KEYCODE_6, KeyEvent.KEYCODE_7, KeyEvent.KEYCODE_8, KeyEvent.KEYCODE_9,
                        KeyEvent.KEYCODE_NUMPAD_0, KeyEvent.KEYCODE_NUMPAD_1, KeyEvent.KEYCODE_NUMPAD_2, KeyEvent.KEYCODE_NUMPAD_3,
                        KeyEvent.KEYCODE_NUMPAD_4, KeyEvent.KEYCODE_NUMPAD_5, KeyEvent.KEYCODE_NUMPAD_6, KeyEvent.KEYCODE_NUMPAD_7,
                        KeyEvent.KEYCODE_NUMPAD_8, KeyEvent.KEYCODE_NUMPAD_9 -> {
                            commitDial(e.keyCode)
                            return true
                        }
                    }
                }
                return super.dispatchKeyEvent(e)
            }

            private fun commitDial(code: Int) {
                val d = when (code) {
                    KeyEvent.KEYCODE_0, KeyEvent.KEYCODE_NUMPAD_0 -> 0
                    KeyEvent.KEYCODE_1, KeyEvent.KEYCODE_NUMPAD_1 -> 1
                    KeyEvent.KEYCODE_2, KeyEvent.KEYCODE_NUMPAD_2 -> 2
                    KeyEvent.KEYCODE_3, KeyEvent.KEYCODE_NUMPAD_3 -> 3
                    KeyEvent.KEYCODE_4, KeyEvent.KEYCODE_NUMPAD_4 -> 4
                    KeyEvent.KEYCODE_5, KeyEvent.KEYCODE_NUMPAD_5 -> 5
                    KeyEvent.KEYCODE_6, KeyEvent.KEYCODE_NUMPAD_6 -> 6
                    KeyEvent.KEYCODE_7, KeyEvent.KEYCODE_NUMPAD_7 -> 7
                    KeyEvent.KEYCODE_8, KeyEvent.KEYCODE_NUMPAD_8 -> 8
                    else -> 9
                }
                dial = (dial + d.toString()).takeLast(4)
                updateDial()
                dialRun?.let { h.removeCallbacks(it) }
                dialRun = Runnable {
                    val n = dial.toIntOrNull() ?: 0
                    dial = ""
                    tvDial.visibility = View.GONE
                    if (n <= 0) return@Runnable
                    val i = list.indexOfFirst { it.num == n }
                    if (i >= 0) { pos = i; play(list[i]) } else toast("لا يوجد العنصر رقم $n")
                }
                h.postDelayed(dialRun!!, 1200)
            }

            private fun updateDial() {
                if (dial.isEmpty()) { tvDial.visibility = View.GONE; return }
                tvDial.visibility = View.VISIBLE
                tvDial.text = dial
            }

            /* -------------------------------- الخيارات -------------------------------- */

            private fun optionsDialog() {
                val c = cur ?: return
                val labels = ArrayList<String>()
                val acts = ArrayList<() -> Unit>()
                labels.add("الصوت والمسارات"); acts.add { tracksDialog(false) }
                if (!isLive()) { labels.add("الترجمة"); acts.add { tracksDialog(true) } }
                if (!isLive()) { labels.add("سرعة التشغيل"); acts.add { cycleSpeed() } }
                labels.add("الجودة / المصدر"); acts.add { qualityDialog() }
                labels.add("نسبة الصورة: " + ratioLabel()); acts.add { cycleResize() }
                labels.add(if (Store.isFav(this, c)) "إزالة من المفضلة" else "إضافة للمفضلة ★")
                acts.add { toast(if (Store.toggleFav(this, c)) "أُضيفت" else "أُزيلت") }
                labels.add(if (autoNext) "☑ تشغيل التالي تلقائيًا" else "☐ تشغيل التالي تلقائيًا")
                acts.add { autoNext = !autoNext; sp.put("auto_next", autoNext) }
                labels.add("قائمة العناصر"); acts.add { if (!listOpen) toggleList() }
                labels.add("معلومات"); acts.add { infoDialog(c.name, c.group + "\n" + tail(lastUrl, 200)) }
                labels.add("سجل الأخطاء"); acts.add {
                    val text = "NovaPlay " + appVersion(this) + "\n" + Diag.text()
                    try {
                        val cm = getSystemService(android.content.Context.CLIPBOARD_SERVICE) as android.content.ClipboardManager
                        cm.setPrimaryClip(android.content.ClipData.newPlainText("NovaPlay", text))
                        toast("نُسخ السجل")
                    } catch (t: Throwable) { toast("تعذّر النسخ") }
                }
                pickDialog("خيارات المشغّل", labels) { i -> acts[i].invoke() }
            }

            private fun tracksDialog(text: Boolean) {
                val p = player ?: return
                try {
                    val names = ArrayList<String>()
                    val groups = ArrayList<Tracks.Group>()
                    val idxs = ArrayList<Int>()
                    val type = if (text) C.TRACK_TYPE_TEXT else C.TRACK_TYPE_AUDIO
                    for (g in p.currentTracks.groups) {
                        if (g.type != type) continue
                        for (i in 0 until g.length) {
                            val f = g.getTrackFormat(i)
                            val label = f.label ?: f.language ?: ("مسار " + (i + 1))
                            names.add((if (g.isTrackSelected(i)) "✔ " else "") + label)
                            groups.add(g)
                            idxs.add(i)
                        }
                    }
                    if (names.isEmpty()) { toast(if (text) "لا توجد ترجمات في هذا المصدر" else "مسار صوتي واحد"); return }
                    val opts = ArrayList<String>()
                    opts.add("تلقائي")
                    opts.addAll(names)
                    pickDialog(if (text) "الترجمة" else "الصوت", opts) { k ->
                        try {
                            val b = p.trackSelectionParameters.buildUpon()
                            if (k == 0) {
                                if (text) b.setTrackTypeDisabled(C.TRACK_TYPE_TEXT, true)
                                else b.clearOverridesOfType(C.TRACK_TYPE_AUDIO)
                            } else {
                                b.setOverrideForType(TrackSelectionOverride(groups[k - 1].mediaTrackGroup, idxs[k - 1]))
                            }
                            p.trackSelectionParameters = b.build()
                            toast("تم")
                        } catch (t: Throwable) { Diag.e(t); toast("تعذّر التغيير") }
                    }
                } catch (t: Throwable) { Diag.e(t) }
            }

            private fun qualityDialog() {
                val p = player ?: return
                try {
                    val names = ArrayList<String>()
                    val groups = ArrayList<Tracks.Group>()
                    val idxs = ArrayList<Int>()
                    for (g in p.currentTracks.groups) {
                        if (g.type != C.TRACK_TYPE_VIDEO) continue
                        for (i in 0 until g.length) {
                            val f = g.getTrackFormat(i)
                            names.add((if (g.isTrackSelected(i)) "✔ " else "") + (if (f.height > 0) f.height.toString() + "p" else "جودة " + (i + 1)))
                            groups.add(g)
                            idxs.add(i)
                        }
                    }
                    val hasAlt = cur?.alt?.isNotBlank() == true && cur?.alt != lastUrl
                    if (names.isEmpty() && !hasAlt) { toast("لا توجد جودات أخرى"); return }
                    val opts = ArrayList<String>(names)
                    if (hasAlt) opts.add("مصدر بديل")
                    pickDialog("الجودة / المصدر", opts) { k ->
                        if (k < names.size) {
                            try {
                                val b = p.trackSelectionParameters.buildUpon()
                                b.setOverrideForType(TrackSelectionOverride(groups[k].mediaTrackGroup, idxs[k]))
                                p.trackSelectionParameters = b.build()
                            } catch (t: Throwable) { Diag.e(t) }
                        } else {
                            cur?.let { startPlayback(it, it.alt, seq) }
                        }
                    }
                } catch (t: Throwable) { Diag.e(t) }
            }

            private fun cycleSpeed() {
                val p = player ?: return
                val speeds = floatArrayOf(0.5f, 0.75f, 1f, 1.25f, 1.5f, 2f)
                var i = 0
                val curSp = p.playbackParameters.speed
                for (k in speeds.indices) if (Math.abs(speeds[k] - curSp) < 0.01f) i = k
                val next = speeds[(i + 1) % speeds.size]
                p.setPlaybackSpeed(next)
                toast("السرعة: $next×")
            }

            private fun ratioLabel() = when (sp.s("rm", "1")) {
                "1" -> "تمديد"
                "2" -> "ملاءمة"
                "3" -> "تكبير"
                else -> "ملاءمة"
            }

            private fun cycleResize() {
                val next = when (sp.s("rm", "1")) { "1" -> "2"; "2" -> "3"; else -> "1" }
                sp.put("rm", next)
                applyResize()
                toast("نسبة الصورة: " + ratioLabel())
            }

            private fun applyResize() {
                pv.resizeMode = when (sp.s("rm", "1")) {
                    "1" -> androidx.media3.ui.AspectRatioFrameLayout.RESIZE_MODE_ZOOM
                    "3" -> androidx.media3.ui.AspectRatioFrameLayout.RESIZE_MODE_FILL
                    else -> androidx.media3.ui.AspectRatioFrameLayout.RESIZE_MODE_FIT
                }
            }

            /* ------------------------------ الموضع والسجل ------------------------------ */

            private fun isLive() = (cur?.kind ?: "live") == "live"

            private fun savePos() {
                val c = cur ?: return
                if (c.kind == "live") return
                val p = player ?: return
                val v = p.currentPosition
                Store.setPos(this, Store.favKey(c), if (v > 15000L) v else 0L)
            }

            private fun askResume(v: Long) {
                confirmDialog("متابعة المشاهدة", "إكمال من " + fmtTime(v) + "؟") {
                    try { player?.seekTo(v) } catch (_: Throwable) {}
                }
            }

            private fun startTick() {
                tickRun?.let { h.removeCallbacks(it) }
                val r = object : Runnable {
                    override fun run() {
                        tick()
                        h.postDelayed(this, 1000)
                    }
                }
                tickRun = r
                h.postDelayed(r, 1000)
            }

            private fun tick() {
                val p = player ?: return
                if (!userSeeking) {
                    val dur = p.duration
                    if (dur > 0 && dur != C.TIME_UNSET) {
                        val curPos = p.currentPosition
                        sb.progress = (curPos / 1000).toInt()
                        sb.secondaryProgress = (p.bufferedPosition / 1000).toInt()
                        tvPos.text = fmtTime(curPos)
                        if (System.currentTimeMillis() - lastSaveAt > 10000) { lastSaveAt = System.currentTimeMillis(); savePos() }
                    }
                }
                if (isLive()) {
                    val pos = p.currentPosition
                    val now = System.currentTimeMillis()
                    if (pos != lastPosVal) { lastPosVal = pos; lastPosAt = now }
                    else if (p.isPlaying && lastPosAt > 0 && now - lastPosAt > 15000) {
                        lastPosAt = now
                        Diag.d("STALL", "الصورة واقفة 15 ثانية — إعادة تشغيل ناعمة")
                        try { p.prepare(); p.playWhenReady = true } catch (t: Throwable) { Diag.e(t) }
                    }
                }
            }

            /* ----------------------------------- EPG ----------------------------------- */

            private fun fetchEpg(c: Channel) {
                epgRun?.let { h.removeCallbacks(it) }
                val p = Catalog.profile
                if (p == null || p.type != "xtream" || c.kind != "live" || c.id.isBlank()) return
                epgRun = Runnable {
                    Bg.run {
                        try {
                            val x = XtreamApi(p)
                            val body = Http.get(x.shortEpg(c.id), timeoutMs = 7000, retries = 0)
                            val o = JSONObject(body)
                            val arr = o.optJSONArray("epg_listings")
                            val sb = StringBuilder()
                            if (arr != null) {
                                for (i in 0 until Math.min(2, arr.length())) {
                                    val it = arr.getJSONObject(i)
                                    sb.append(if (i == 0) "الآن: " else "التالي: ").append(it.optString("title"))
                                        .append(" (").append(it.optString("start_date").take(16)).append(")\n")
                                }
                            }
                            val txt = sb.toString().trim()
                            if (txt.isNotBlank()) Bg.ui { tvSub.text = txt }
                        } catch (t: Throwable) {}
                    }
                }
                h.postDelayed(epgRun!!, 1200)
            }

            /* ------------------------------- قائمة العناصر ------------------------------- */

            private inner class ListAdapter : androidx.recyclerview.widget.RecyclerView.Adapter<RowH>() {
                override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): RowH =
                    RowH(LayoutInflater.from(parent.context).inflate(R.layout.item_row, parent, false))

                override fun getItemCount() = list.size

                override fun onBindViewHolder(h: RowH, i: Int) {
                    val c = list[i]
                    val sel = Store.favKey(c) == Store.favKey(cur ?: return)
                    h.name.text = (if (c.num > 0) c.num.toString() + "  " else "") + (if (sel) "▶ " else "") + c.name
                    h.name.setTextColor(resources.getColor(if (sel) R.color.np_gold else R.color.np_text))
                    h.count.text = ""
                    h.itemView.setOnClickListener { pos = i; play(c); if (listOpen) toggleList() }
                }
            }

            class RowH(v: View) : androidx.recyclerview.widget.RecyclerView.ViewHolder(v) {
                val name: TextView = v.findViewById(R.id.g_name)
                val count: TextView = v.findViewById(R.id.g_count)
            }
        }
