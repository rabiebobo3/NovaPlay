                      db = d
                      available = true
                  } catch (t: Throwable) {
                      available = false
                      Crash.log(t)
                  }
              }

              fun ready(): Boolean = available && db != null

              private fun ref(ctx: Context, path: String): DatabaseReference? =
                  if (ready()) db!!.getReference(ROOT).child(path) else null

              fun get(ctx: Context, path: String, cb: (JSONObject) -> Unit) {
                  val r = ref(ctx, path)
                  if (r == null) { Bg.ui { cb(JSONObject()) }; return }
                  r.addListenerForSingleValueEvent(object : ValueEventListener {
                      override fun onDataChange(s: DataSnapshot) {
                          val o = JSONObject()
                          try {
                              for (c in s.children) {
                                  val v = c.value
                                  when (v) {
                                      null -> {}
                                      is Map<*, *> -> o.put(c.key ?: "?", JSONObject(v))
                                      else -> o.put(c.key ?: "?", v)
                                  }
                              }
                              val raw = s.value
                              if (raw != null && raw !is Map<*, *>) o.put("value", raw)
                          } catch (t: Throwable) { Crash.log(t) }
                          Bg.ui { cb(o) }
                      }

                      override fun onCancelled(e: DatabaseError) { Bg.ui { cb(JSONObject()) } }
                  })
              }

              fun set(ctx: Context, path: String, values: Map<String, Any>, cb: ((Boolean) -> Unit)? = null) {
                  val r = ref(ctx, path)
                  if (r == null) { cb?.invoke(false); return }
                  r.updateChildren(values)
                      .addOnSuccessListener { cb?.invoke(true) }
                      .addOnFailureListener { t -> Crash.log(t); cb?.invoke(false) }
              }

              fun remove(ctx: Context, path: String, cb: ((Boolean) -> Unit)? = null) {
                  val r = ref(ctx, path)
                  if (r == null) { cb?.invoke(false); return }
                  r.removeValue()
                      .addOnSuccessListener { cb?.invoke(true) }
                      .addOnFailureListener { t -> Crash.log(t); cb?.invoke(false) }
              }

              /** يشتغل على مسار كامل خارج الجذر (للروابط الخارجية). */
              fun listen(ctx: Context, path: String, cb: (JSONObject) -> Unit): ValueEventListener? {
                  val r = ref(ctx, path) ?: return null
                  val l = object : ValueEventListener {
                      override fun onDataChange(s: DataSnapshot) {
                          val o = JSONObject()
                          try {
                              for (c in s.children) {
                                  val v = c.value
                                  when (v) {
                                      null -> {}
                                      is Map<*, *> -> o.put(c.key ?: "?", JSONObject(v))
                                      else -> o.put(c.key ?: "?", v)
                                  }
                              }
                              val raw = s.value
                              if (raw != null && raw !is Map<*, *>) o.put("value", raw)
                          } catch (t: Throwable) {}
                          Bg.ui { cb(o) }
                      }

                      override fun onCancelled(e: DatabaseError) {}
                  }
                  r.addValueEventListener(l)
                  synchronized(listeners) { listeners.add(l) }
                  return l
              }

              fun stop(ctx: Context, l: ValueEventListener?) {
                  if (l == null) return
                  try { db?.getReference(ROOT)?.removeEventListener(l) } catch (t: Throwable) {}
                  synchronized(listeners) { listeners.remove(l) }
