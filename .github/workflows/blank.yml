        sp.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
        try { startActivityForResult(sp, 7001); } catch (Exception e2) {
        try { Intent g = new Intent(android.provider.Settings.ACTION_SECURITY_SETTINGS); g.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK); startActivityForResult(g, 7001); } catch (Exception e3) { showInstallReadyDialog(out, next); }
