            private fun headers(): Map<String, String> {
                val m = LinkedHashMap<String, String>()
                m["Accept"] = "*/*"
                val p = Catalog.profile
                if (p != null && p.type == "mac") {
                    m["Cookie"] = "mac=" + Stalker.normMac(p.mac) + "; stb_lang=ar; timezone=Europe/London"
                    m["Referer"] = Stalker.origin(p.url) + "/c/"
                    m["X-User-Agent"] = "Model: MAG250; Link: WiFi"
                }
                return m
            }

            private fun buildPlayer() {
                val http = DefaultHttpDataSource.Factory()
                    .setTransferListener(null)
                    .setUserAgent(if (Catalog.profile?.type == "mac") Http.UA_STB else Http.UA)
                    .setAllowCrossProtocolRedirects(true)
                    .setConnectTimeoutMs(12000)
                    .setReadTimeoutMs(20000)
                    .setDefaultRequestProperties(headers())
                val ds = DefaultDataSource.Factory(this, http)
                val load = DefaultLoadControl.Builder()
                    .setBufferDurationsMs(2500, 20000, 1000, 2500)
                    .setBackBuffer(0, false)
                    .setPrioritizeTimeOverSizeThresholds(true)
                    .build()
                val p = ExoPlayer.Builder(this)
                    .setMediaSourceFactory(DefaultMediaSourceFactory(ds))
                    .setRenderersFactory(DefaultRenderersFactory(this).setEnableDecoderFallback(true))
                    .setLoadControl(load)
                    .setLivePlaybackSpeedControl(
                        DefaultLivePlaybackSpeedControl.Builder()
                            .setFallbackMinPlaybackSpeed(0.97f)
                            .setFallbackMaxPlaybackSpeed(1.03f)
                            .setTargetLiveOffsetIncrementOnRebufferMs(1000L)
                            .build()
                    )
                    .setSeekBackIncrementMs(10000)
                    .setSeekForwardIncrementMs(10000)
                    .setHandleAudioBecomingNoisy(true)
                    .build()
                p.playWhenReady = true
                p.addListener(this)
                pv.player = p
                player = p
            }

