              'seekbar_gold.xml': '<?xml version="1.0" encoding="utf-8"?>\n<layer-list xmlns:android="http://schemas.android.com/apk/res/android">\n    <item android:id="@android:id/background">\n        <shape android:shape="rectangle">\n            <corners android:radius="4dp" />\n            <solid android:color="@color/np_scrim" />\n            <stroke android:width="1dp" android:color="@color/np_stroke" />\n        </shape>\n    </item>\n    <item android:id="@android:id/secondaryProgress">\n        <clip>\n            <shape android:shape="rectangle">\n                <corners android:radius="4dp" />\n                <solid android:color="@color/np_stroke_soft" />\n            </shape>\n        </clip>\n    </item>\n    <item android:id="@android:id/progress">\n        <clip>\n            <shape android:shape="rectangle">\n                <corners android:radius="4dp" />\n                <gradient android:angle="0" android:startColor="@color/np_gold2" android:endColor="@color/np_gold_soft" />\n            </shape>\n        </clip>\n    </item>\n</layer-list>\n',
