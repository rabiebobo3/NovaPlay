               c.name.contains("HD", true) -> "HD"
               else -> ""
             }
             val sel = cur?.url == c.url
             h.name.setTextColor(if (sel) gold() else ContextCompat.getColor(this@LiveActivity, R.color.np_text))
             if (c.logo.isNotBlank()) {
               try { Glide.with(this@LiveActivity).load(c.logo).placeholder(R.drawable.ic_live).error(R.drawable.ic_live).into(h.logo) } catch (t: Throwable) {}
             } else h.logo.setImageResource(R.drawable.ic_live)
