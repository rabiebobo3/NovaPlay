                      }
                      return
                  }
                  showList(local)
                  tvGrTitle.text = g.name
              }

              private fun sameChan(a: Channel, b: Channel): Boolean {
                  if (a.id.isNotBlank() && b.id.isNotBlank()) return a.id == b.id
                  return a.name == b.name && (a.url == b.url || a.mid == b.mid)
              }

              // =============================== التشغيل ===============================

              private fun startPlay(c: Channel, reset: Boolean) {
                  if (reset) {
                      httpTried = false
                      freshTried = false
                      softFails = 0
                      hardFails = 0
                      askedResume = false
                      cands = ArrayList()
                      candIdx = 0
                  }
                  cur = c
                  Ai.playHint()
                  kind = if (c.kind.isNotBlank()) c.kind else kind
                  live = kind == "live" || kind == "channel"
                  val p = Catalog.profile
                  sp.put("last_ch", c.name)
                  pushRecent(c)
                  if (p != null && p.type == "mac") {
                      if (isMacUrlOk(c)) { playUrl(c, c.url, c.url); return }
                      val pre = Ai.takePrefetch(c)
                      if (pre.isNotBlank() && !freshTried) { playUrl(c, pre, ""); return }
                      showBusy(true, "…جاري تجهيز الرابط")
                      Loader.macPlayable(p, c) { u ->
                          showBusy(false, "")
                          if (u.isNotBlank()) playUrl(c, u, "") else buildCandsThenPlay(c)
                      }
                      return
                  }
                  var u = c.url
                  if (u.isBlank()) u = c.alt
                  if (u.isBlank()) { toast("لا يوجد رابط لهذا العنصر"); return }
                  playUrl(c, u, "")
              }

              /** هل رابط العنصر صالح للاستعمال مباشرة (وليس رابط بوابة بلا توكن)؟ */
              private fun isMacUrlOk(c: Channel): Boolean {
                  val u = c.url
                  if (u.isBlank()) return false
                  if (!u.startsWith("http")) return false
                  if (Stalker.isPortalPlayUrl(u) && !Stalker.hasToken(u)) return false   // توكن منتهٍ ⇒ نجدد
                  return true
              }

              private fun buildCandsThenPlay(c: Channel) {
                  val p = Catalog.profile ?: return
                  showBusy(true, "…جاري تجربة المصادر")
                  Loader.macPlayQueries(p, c) { list ->
                      cands = ArrayList(list.filter { it.isNotBlank() })
                      candFor = Ai.keyOf(c)
                      Ai.orderCands(p, if (c.kind.isNotBlank()) c.kind else kind, cands)
                      candIdx = 0
                      showBusy(false, "")
                      if (cands.isEmpty()) { failHard("البوابة ما رجعتش رابطًا لهذا العنصر"); return@macPlayQueries }
                      tryCand(c)
                  }
              }

              private fun tryCand(c: Channel) {
                  val p = Catalog.profile ?: return
                  if (candIdx >= cands.size) { failHard("انتهت المصادر المتاحة لهذا العنصر"); return }
                  val q = cands[candIdx++]
                  Loader.macResolveQuery(p, q) { u ->
                      if (u.isNotBlank()) playUrl(c, u, q)
                      else { Ai.markFail(p, if (c.kind.isNotBlank()) c.kind else kind, q); tryCand(c) }
                  }
              }

              private fun playUrl(c: Channel, url: String, q: String) {
                  curQ = q
                  var u = url.trim()
                  if (u.isBlank()) { failHard("رابط فارغ"); return }
                  if (Stalker.isPortalPlayUrl(u)) u = Stalker.fixHost(u)
                  lastUrl = u
                  lastUrlTs = System.currentTimeMillis()
                  ensurePlayer()
                  val p = player ?: return
                  Ai.playStart()
                  showBusy(true, "جاري التحميل")
                  val item = MediaItem.Builder()
                      .setUri(Uri.parse(u))
                      .setMediaId(Ai.keyOf(c))
                      .apply {
                          val l = u.lowercase(Locale.US)
                          when {
                              l.contains(".m3u8") -> setMimeType(MimeTypes.APPLICATION_M3U8)
                              l.contains(".ts") || l.contains("/play/") || l.contains("/ch/") -> setMimeType(MimeTypes.APPLICATION_MPEGTS)
                          }
                      }
                      .build()
                  try {
                      if (u.lowercase(Locale.US).contains(".m3u8")) {
                          val ds = dataSource(u)
                          p.setMediaSource(HlsMediaSource.Factory(ds).setAllowChunklessPreparation(true).createMediaSource(item))
                      } else p.setMediaItem(item)
                  } catch (t: Throwable) {
                      Crash.log(t)
                      try { p.setMediaItem(item) } catch (t2: Throwable) { Crash.log(t2) }
                  }
                  p.prepare()
                  p.playWhenReady = true
                  updateInfo(c)
                  setFullUI()
                  armWatchdog(if (live) 20000L else 25000L)
              }

              private fun ensurePlayer() {
                  if (player != null) return
                  try {
                      player = buildPlayer()
                      pv?.player = player
                      pvFull?.player = player
                      applyResize(sp.s("rm2", "fit"))
                      player?.addListener(listener)
                      built = true
                      Crash.note("DEC-INIT", "أُنشئ المشغّل مرة واحدة وأُعيد استعماله في كل التنقّل (v8.39)")
                  } catch (t: Throwable) { Crash.log(t); player = null }
              }

              private fun buildPlayer(): ExoPlayer {
                  val lc = DefaultLoadControl.Builder()
                      .setBufferDurationsMs(Ai.bufMs(cur, live).toInt(), 20000, 1500, 3000)
                      .setPrioritizeTimeOverSizeThresholds(true)
                      .build()
                  return ExoPlayer.Builder(this)
                      .setMediaSourceFactory(DefaultMediaSourceFactory(dataSource("")).setExtractorsFactory(DefaultExtractorsFactory()))
                      .setLoadControl(lc)
                      .setHandleAudioBecomingNoisy(true)
                      .build()
              }

              private fun dataSource(url: String): DefaultDataSource {
                  val http = DefaultHttpDataSource.Factory()
                      .setUserAgent(Stalker.UA_STB)
                      .setConnectTimeoutMs(12000)
                      .setReadTimeoutMs(18000)
                      .setAllowCrossProtocolRedirects(true)
                  val prof = Catalog.profile
                  if (prof != null && prof.type == "mac") {
                      try {
                          val hd = Stalker.playHeaders(prof)
                          if (hd.isNotEmpty()) http.setDefaultRequestProperties(hd)
                      } catch (t: Throwable) { Crash.log(t) }
                  }
                  return DefaultDataSource.Factory(this, http)
              }

              /** عند العودة للتطبيق: نستأنف من نفس النقطة، وإن كان الرابط قد انتهى نجدّده (v8.39). */
              private fun resumePlayback() {
                  val c = cur ?: return
                  val p = player
                  if (p == null) { startPlay(c, true); return }
                  try {
                      if (Catalog.profile?.type == "mac" && lastUrl.isNotBlank() && Stalker.isPortalPlayUrl(lastUrl) && !Stalker.hasToken(lastUrl)) {
                          Crash.note("PLAY-RESUME", "الرابط عاد بلا توكن ⇒ تجديد create_link للعنصر: " + c.name.take(40))
                          startPlay(c, true)
                          return
                      }
                      if (p.mediaItemCount == 0 && c.url.isNotBlank()) { startPlay(c, true); return }
                      if (p.playbackState == Player.STATE_IDLE) { startPlay(c, true); return }
                      if (p.playbackState == Player.STATE_ENDED && live) { startPlay(c, true); return }
                      if (resumeOnReturn) { p.play(); resumeOnReturn = false }
                  } catch (t: Throwable) { Crash.log(t) }
              }

              private val listener = object : Player.Listener {
                  override fun onPlaybackStateChanged(state: Int) {
                      when (state) {
                          Player.STATE_BUFFERING -> {
                              val p = player
                              if (p != null && stable > 0) {
                                  rebuffer++
                                  if (rebuffer == 1) Ai.onRebuffer(cur)
                              }
                              setVis(R.id.fullBusy, full)
                              setVis(R.id.dockBusy, !full)
                          }
                          Player.STATE_READY -> {
                              setVis(R.id.fullBusy, false)
                              setVis(R.id.dockBusy, false)
                              disarmWatchdog()
                              rebuffer = 0
                              Ai.playReady(cur, curQ.ifBlank { null })
                              cur?.let { pushRecent(it); prefillAuto(it) }
                              askResumeIfNeeded()
                          }
                          Player.STATE_ENDED -> {
                              setVis(R.id.fullBusy, false)
                              setVis(R.id.dockBusy, false)
                              if (sp.b("auto_next", true)) next()
                          }
                          Player.STATE_IDLE -> { setVis(R.id.fullBusy, false); setVis(R.id.dockBusy, false) }
                      }
                      updButton()
                  }

                  override fun onIsPlayingChanged(isPlaying: Boolean) {
                      updButton()
                      if (isPlaying) { if (stable == 0) stable = 1 }
                  }

                  override fun onPlayerError(error: PlaybackException) {
                      val p = Catalog.profile
                      val q = curQ.ifBlank { null }
                      val d = Ai.playFail(cur, error, lastUrl, q)
                      Crash.note("PLAY-FAIL", d + " | " + (error.message ?: ""))
                      setVis(R.id.fullBusy, false)
                      setVis(R.id.dockBusy, false)
                      when (d) {
                          "TOKEN" -> {
                              freshTried = true
                              val c = cur
                              if (c != null && p != null && p.type == "mac" && !tryHttpFix()) {
                                  toast("…تجديد الرابط (انتهت الجلسة)")
                                  startPlay(c, false)
                              } else failSoft()
                          }
                          "HTTPS" -> { if (!tryHttpFix()) failSoft() }
                          else -> { if (!tryHttpFix()) failSoft() }
                      }
                  }

              }

              /** v8.39: تصحيح تلقائي https→http مرة واحدة (بوابات قديمة/شهادات مكسورة). */
              private fun tryHttpFix(): Boolean {
                  if (httpTried) return false
                  if (!lastUrl.startsWith("https://", true)) return false
                  httpTried = true
                  val fixed = "http://" + lastUrl.substring(8)
                  Crash.note("HTTPS-FIX", "تحويل إلى: " + fixed.take(80))
                  val c = cur ?: return false
                  playUrl(c, fixed, curQ)
                  return true
              }

              /** فشل: مرشّح آخر (بوابات MAC) ثم إعادة تحضير ناعمة ثم إعادة بناء. */
              private fun failSoft() {
                  softFails++
                  if (softFails <= 2) {
                      val p = player
                      if (p != null && lastUrl.isNotBlank()) {
                          toast("إعادة توصيل…")
                          try { p.prepare(); p.playWhenReady = true; armWatchdog(15000L); return } catch (t: Throwable) { Crash.log(t) }
                      }
                  }
                  if (Catalog.profile?.type == "mac" && (candIdx in 0 until cands.size)) {
                      val c = cur
                      if (c != null) { tryCand(c); return }
                  }
                  failHard("تعذّر تشغيل هذا العنصر")
              }

              private fun failHard(msg: String) {
                  hardFails++
                  setVis(R.id.fullBusy, false)
                  setVis(R.id.dockBusy, false)
                  tvWd.text = msg
                  setVis(R.id.wdBar, true)
                  text(R.id.tv_wd, msg)
              }

              private fun prefillAuto(c: Channel) {
                  // v8.39: تجهيز العنصر التالي (رابط + صورة) بهدوء — طلب واحد فقط في الوقت نفسه (طابور Ai)
                  val i = pl.indexOfFirst { sameChan(it, c) }
                  if (i >= 0) { pid = i; Ai.prefetch(pl, i, c) }
                  saveListIfNeeded()
              }

              /** v8.39: نحفظ القائمة الحالية (حتى 400 عنصر) لتعمل الشاشة بعد إغلاق التطبيق وإعادة فتحه. */
              private fun saveListIfNeeded() {
                  try {
                      if (pl.isEmpty() || pl.size > 400) return
                      val sig = pl.size.toString() + "|" + (pl.getOrNull(0)?.name ?: "")
                      if (sig == lastListSig) return
                      lastListSig = sig
                      val copy = ArrayList(pl)
                      Bg.pool.execute { try { sp.put("last_list", encodeChans(copy)) } catch (t: Throwable) {} }
                  } catch (t: Throwable) { Crash.log(t) }
              }

              private fun next() {
                  if (pl.isEmpty()) return
                  val i = cur?.let { c -> pl.indexOfFirst { sameChan(it, c) } } ?: -1
                  val n = if (i < 0) 0 else (i + 1) % pl.size
                  val c = pl.getOrNull(n) ?: return
                  try { rvCh.scrollToPosition(n) } catch (t: Throwable) {}
                  startPlay(c, true)
              }

              private fun prev() {
                  if (pl.isEmpty()) return
                  val i = cur?.let { c -> pl.indexOfFirst { sameChan(it, c) } } ?: -1
                  val n = if (i <= 0) pl.size - 1 else i - 1
                  val c = pl.getOrNull(n) ?: return
                  try { rvCh.scrollToPosition(n) } catch (t: Throwable) {}
                  startPlay(c, true)
              }

              private fun playAt(n: Int) {
                  val c = pl.getOrNull(n) ?: return
                  startPlay(c, true)
              }

              // =============================== المفضلة وحديث ===============================

              private fun isFav(c: Channel?): Boolean = c != null && favs.any { sameChan(it, c) }

              private fun pushRecent(c: Channel) {
                  try {
                      if (c.url.isBlank() && c.mid.isBlank()) return
                      val head = recents.firstOrNull()
                      if (head != null && sameChan(head, c)) return          // v8.39: لا كتابة بلا تغيير
                      recents.removeAll { sameChan(it, c) }
                      recents.add(0, c)
                      while (recents.size > 40) recents.removeAt(recents.size - 1)
                      sp.put("recents", encodeChans(recents))
                  } catch (t: Throwable) { Crash.log(t) }
              }

              private fun listFrom(arr: ArrayList<Channel>, title: String) {
                  if (arr.isEmpty()) { toast("القائمة فارغة"); return }
                  selGroup = null
                  tvGrTitle.text = title
                  showList(ArrayList(arr))
              }

              private fun toggleFav(c: Channel?) {
                  val x = c ?: return
                  if (isFav(x)) {
                      favs.removeAll { sameChan(it, x) }
                      toast("أُزيل من المفضلة")
                  } else {
                      favs.add(0, x)
                      toast("أُضيف للمفضلة ★")
                  }
                  sp.put("favs", encodeChans(favs))
                  chAdapter?.notifyDataSetChanged()
              }

              // =============================== القبض / الأزمنة ===============================

              private fun catchup() {
                  val c = cur ?: return
                  val p = Catalog.profile ?: return
                  if (p.type != "mac") { toast("القبض متاح لبوابات MAC فقط"); return }
                  if (c.url.isBlank() && c.mid.isBlank()) { toast("لا يوجد أمر للقبض"); return }
                  val hours = intArrayOf(1, 2, 3, 6, 12, 24, 48, 72, 168)
                  val labels = hours.map { "قبل " + it + " ساعة" }.toTypedArray()
                  AlertDialog.Builder(this).setTitle("القبض — " + c.name).setItems(labels) { _, i ->
                      showBusy(true, "…جاري جلب النسخة")
                      Loader.macTimeshift(p, if (c.url.isNotBlank()) c.url else c.mid, hours[i]) { u ->
                          showBusy(false, "")
                          if (u.isNotBlank()) playUrl(c, u, "") else toast("لا يوجد أرشيف لهذا الزمن")
                      }
                  }.setNegativeButton("إلغاء", null).show()
              }

