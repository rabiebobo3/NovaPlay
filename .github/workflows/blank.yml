                if (sUrl.isEmpty()) { toast("أدخل الرابط"); return@setOnClickListener }
                val o = JSONObject(); o.put("type", serverType); o.put("url", sUrl); o.put("user", sUser); o.put("pass", sPass); o.put("mac", sMac); o.put("name", etName.text.toString())
                prefs.edit().putString("last", o.toString()).apply(); saveServer(o); connect()
