              private fun open(c: Channel) {
                  val p = Catalog.profile
                  if (kind == "series" && p?.type == "mac") {
                      if (c.kind == "episode") { playNow(c); return }
                      if (c.kind == "season" && c.mid.isNotBlank()) {
                          showBusy(true, "تحميل حلقات الموسم…")
                          val out = ArrayList<Channel>()
                          Loader.macSeason(p, c.mid, c.sid, out) { n ->
                              try {
                                  showBusy(false, "")
                                  if (n == 0) { toast("لا توجد حلقات لهذا الموسم"); return@macSeason }
                                  if (saved.isEmpty()) { saved.addAll(all) }
                                  all.clear(); all.addAll(out)
                                  inEpisodes = true; seriesName = c.name + " • " + c.group
                                  applyFilter(); rvGrid.scrollToPosition(0)
                              } catch (t: Throwable) {
                                  try { showBusy(false, "") } catch (e: Throwable) {}
                                  Crash.log(t)
                                  toast("تعذر الفتح: " + (t.message ?: t.javaClass.simpleName))
                              }
                          }
                          return
                      }
                      if (c.id.isNotBlank()) {
                          showBusy(true, "تحميل الحلقات…")
                          val out = ArrayList<Channel>()
                          Loader.macSeries(p, c.id, c.name, c.group, c.logo, out) { n ->
                              try {
                                  showBusy(false, "")
                                  if (n == 0) {
                                      toast("لا توجد حلقات — سيتم تشغيل العنصر مباشرة")
                                      playNow(c); return@macSeries
                                  }
                                  if (saved.isEmpty()) { saved.addAll(all) }
                                  all.clear(); all.addAll(out)
                                  inEpisodes = true; seriesName = c.name
                                  if (out.any { it.kind == "season" }) {
                                      // مواسم فقط: المستخدم يضغط الموسم ليُحمَّل
                                      seriesName = c.name
                                  }
                                  applyFilter(); rvGrid.scrollToPosition(0)
                              } catch (t: Throwable) {
                                  try { showBusy(false, "") } catch (e: Throwable) {}
                                  Crash.log(t)
                                  toast("تعذر الفتح: " + (t.message ?: t.javaClass.simpleName))
                              }
                          }
                          return
                      }
                  }
                  if (kind == "series" && p?.type == "xtream" && !inEpisodes && c.id.isNotBlank()) {
                      showBusy(true, "تحميل الحلقات…")
                      val out = ArrayList<Channel>()
                      Loader.xtreamEpisodes(p, c.id, out) { n ->
                          try {
                              showBusy(false, "")
                              if (n == 0) { toast("لا توجد حلقات — سيتم تشغيل الرابط المباشر"); playNow(c); return@xtreamEpisodes }
                              if (saved.isEmpty()) { saved.addAll(all) }
                              all.clear(); all.addAll(out)
                              inEpisodes = true; seriesName = c.name
