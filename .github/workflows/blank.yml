name: NovaPlay_Kotlin_Full
# NovaPlay — تطبيق IPTV كامل بلغة Kotlin (الحزمة com.nova.play)
# ينشئ كل ملفات المشروع داخل جهاز البناء ثم يبني APK ويُنشر تلقائيًا.
# كل ميزات Rabie Pro v138 SmartLoad منقولة إلى Kotlin هنا، بدون أي ملف مضغوط غامض.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: novaplay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_NAME: "8.34"
      VERSION_CODE: "834"
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-nova-${{ hashFiles('**/*.gradle*', 'gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-nova-

    - name: Setup Android SDK
      run: |
        set -e
        if [ -z "${ANDROID_HOME:-}" ]; then export ANDROID_HOME="$HOME/android-sdk"; fi
        echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
        SDKM="$(command -v sdkmanager || true)"
        if [ -z "$SDKM" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"; fi
        if [ -z "$SDKM" ]; then
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -sSLo /tmp/clt.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q -o /tmp/clt.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest" 2>/dev/null || true
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
        fi
        yes | "$SDKM" --licenses >/dev/null 2>&1 || true
        "$SDKM" "platform-tools" "platforms;android-34" "build-tools;34.0.0" 2>&1 | tail -3 || echo "WARN: تعذّر تثبيت حزم SDK — سنستخدم ما هو مثبّت مسبقًا على الجهاز"

    - name: Generate project (Kotlin + resources)
      run: |
       set -e
       rm -rf app build.gradle settings.gradle gradle.properties
       mkdir -p app/src/main/java/com/nova/play
       mkdir -p app/src/main/res/drawable app/src/main/res/layout
       mkdir -p app/src/main/res/values app/src/main/res/values-night app/src/main/res/xml
       cat <<'NP_EOF' > settings.gradle
       pluginManagement {
           repositories {
               google()
               mavenCentral()
               gradlePluginPortal()
           }
       }
       dependencyResolutionManagement {
           repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
           repositories {
               google()
               mavenCentral()
               maven { url 'https://jitpack.io' }
           }
       }
       rootProject.name = "NovaPlay"
       include ':app'
       NP_EOF
       cat <<'NP_EOF' > build.gradle
       // NovaPlay — الجذر. بلجـن google-services يُحمَّل لكن لا يُطبَّق إلا إذا وُجد google-services.json
       buildscript {
           repositories {
               google()
               mavenCentral()
           }
           dependencies {
               classpath 'com.google.gms:google-services:4.4.2'
           }
       }

       plugins {
           id 'com.android.application' version '8.2.2' apply false
           id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
       }
       NP_EOF
       cat <<'NP_EOF' > gradle.properties
       org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
       org.gradle.daemon=true
       org.gradle.parallel=true
       android.useAndroidX=true
       android.nonTransitiveRClass=false
       kotlin.code.style=official
       android.enableR8.fullMode=false
       android.r8.maxWorkers=1
       NP_EOF
       cat <<'NP_EOF' > app/build.gradle
       plugins {
           id 'com.android.application'
           id 'org.jetbrains.kotlin.android'
       }

       // google-services.json اختياري: إن وُجد فُعّل بلجـن Firebase، وإلا يعمل التطبيق في الوضع المحلي
       if (file("google-services.json").exists()) {
           apply plugin: 'com.google.android.gms.google-services'
       }

       android {
           namespace 'com.nova.play'
           compileSdk 34

           defaultConfig {
               applicationId "com.nova.play"
               minSdk 21
               targetSdk 34
               // الرقم والاصدار يمكن تمريرهما من الـ workflow (env) — وإلا الافتراضي 82 / 8.2
               versionCode (System.getenv("VERSION_CODE")?.toInteger() ?: 834)
               versionName (System.getenv("VERSION_NAME") ?: "8.34")
               vectorDrawables.useSupportLibrary = true
           }

           // توقيع debug و release بنفس المفتاح حتى يثبت التحديث فوق النسخة الحالية بدون تعارض
           signingConfigs {
               debug {
                   storeFile file("debug.keystore")
                   storePassword "android"
                   keyAlias "androiddebugkey"
                   keyPassword "android"
               }
               release {
                   storeFile file("debug.keystore")
                   storePassword "android"
                   keyAlias "androiddebugkey"
                   keyPassword "android"
               }
           }

           buildTypes {
               debug {
                   signingConfig signingConfigs.debug
               }
               release {
                   minifyEnabled false
                   shrinkResources false
                   signingConfig signingConfigs.release
               }
           }

           compileOptions {
               sourceCompatibility JavaVersion.VERSION_17
               targetCompatibility JavaVersion.VERSION_17
           }
           kotlinOptions {
               jvmTarget = '17'
           }
           packagingOptions {
               resources.excludes += ['META-INF/*.version', 'META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
           }
           lint {
               abortOnError false
               checkReleaseBuilds false
           }
       }

       dependencies {
           implementation 'androidx.appcompat:appcompat:1.6.1'
           implementation 'androidx.core:core-ktx:1.12.0'
           implementation 'androidx.recyclerview:recyclerview:1.3.2'
           implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
           implementation 'androidx.media3:media3-exoplayer:1.4.1'
           implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
           implementation 'androidx.media3:media3-exoplayer-dash:1.4.1'
           implementation 'androidx.media3:media3-exoplayer-smoothstreaming:1.4.1'
           implementation 'androidx.media3:media3-exoplayer-rtsp:1.4.1'
            implementation 'androidx.media3:media3-datasource-rtmp:1.4.1'
           implementation 'androidx.media3:media3-ui:1.4.1'
           implementation 'androidx.mediarouter:mediarouter:1.6.0'
           implementation 'com.github.bumptech.glide:glide:4.16.0'
           implementation platform('com.google.firebase:firebase-bom:33.7.0')
           implementation 'com.google.firebase:firebase-database'
           implementation 'com.google.firebase:firebase-messaging'
       }
       NP_EOF
       cat <<'NP_EOF' > .gitignore
       *.iml
       .gradle
       /local.properties
       /localTest
       /.idea
       .DS_Store
       /build
       /captures
       .externalNativeBuild
       .cxx
       app/build
       app/release
       .idea/
       NP_EOF
       cat <<'NP_EOF' > README.md
       # NovaPlay — مشغّل IPTV (Kotlin · `com.nova.play`)

       **الإصدار 8.34 (code 834)** — الأفلام والحلقات تشتغل + رجوع للقنوات صحيح + لوحة أزرار احترافية.

       ## البناء
       ارفع الملف (**Add file → Upload files**) ⇒ Commit ⇒ Actions ⇒ Artifacts ⇒ `app-debug.apk`.
       بعد التثبيت: **الإعدادات لازم 8.34**.

       ## واش تصلّح (أسباب مُثبتة من سجل الأعطال + تجربة على البوابة)
       - **الأفلام/الحلقات ما كانوش يشتغلوا:** كنا نبعث للبوابة أوامر غالطة (أمر فارغ، معرّف مستخرج من base64،
         رابط البوابة نفسها، نوع itv لفلم) ⇒ البوابة ترد **رابطًا ميتًا** `stream=.` ⇒ 444/405/404.
         صار: فلم = `type=vod` وأمر البوابة، وإن ما كانش الأمر نبنيوه من المعرّف (مُجرّب: يرجع رابطًا سليمًا)؛
         حلقة = صيغة Java بالحرف (base64 + `series=<رقم الحلقة>`)، وكل رابط ميت يُرفض قبل التشغيل.
       - **«يذهب للحلقة ولا يدخل القنوات»:** كان يُحفظ «آخر عنصر» حتى للأفلام/الحلقات. صار الحفظ للقنوات فقط،
         وزر «البث المباشر» يفتح وضع القنوات صراحةً.
       - **الفوكس مع الريموت:** الفوكس يُوضع على القناة/القائمة عند الفتح وبعد اختيار قسم، وما يروحش للبحث أبدًا.
       - **شكل الأزرار في المشغل الكبير:** لوحة دائرية أنيقة (Vector) — السابق، -10، **تشغيل/إيقاف في الوسط**،
         +10، التالي، و«⋯» للباقي — وكل زر يتوهّج بحدّ ذهبي لمّا يوصل إليه الريموت.
       - **بلا أسهم عائمة** على الصورة في مشغل القنوات.

       ## سجل الأعطال
       `PLAY-URL` الرابط · `PLAY-FAIL` رمز الخطأ · `PLAY-FIX` إصلاح ذاتي · `LIVE-STALL` إصلاح الوقفة.

       ## الصيغ
       HLS · DASH · RTSP · RTMP · MP4 · MKV · TS · AVI · FLV + ترجمات. **غير مدعوم:** WMV/ASF.
       NP_EOF
       cat <<'NP_EOF' > app/src/main/AndroidManifest.xml
       <?xml version="1.0" encoding="utf-8"?>
       <manifest xmlns:android="http://schemas.android.com/apk/res/android"
           xmlns:tools="http://schemas.android.com/tools">

           <uses-permission android:name="android.permission.INTERNET" />
           <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
           <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
           <uses-permission android:name="android.permission.WAKE_LOCK" />
           <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
           <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />

           <uses-feature android:name="android.software.leanback" android:required="false" />
           <uses-feature android:name="android.hardware.touchscreen" android:required="false" />

           <application
               android:name=".NovaApp"
               android:allowBackup="false"
               android:banner="@drawable/ic_banner"
               android:hardwareAccelerated="true"
               android:icon="@drawable/ic_live"
               android:label="NovaPlay"
               android:largeHeap="true"
               android:resizeableActivity="true"
               android:supportsRtl="true"
               android:theme="@style/ThemeNova"
               android:usesCleartextTraffic="true"
               tools:targetApi="34">

               <activity
                   android:name=".MainActivity"
                   android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboard|keyboardHidden|navigation|density|uiMode"
                   android:exported="true"
                   android:launchMode="singleTop"
                   android:screenOrientation="sensorLandscape">
                   <intent-filter>
                       <action android:name="android.intent.action.MAIN" />
                       <category android:name="android.intent.category.LAUNCHER" />
                       <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                   </intent-filter>
               </activity>

               <activity
                   android:name=".LiveActivity"
                   android:launchMode="singleTop"
                   android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboard|keyboardHidden|navigation|density|uiMode|locale|layoutDirection"
                   android:exported="false"
                   android:screenOrientation="sensorLandscape"
                   android:theme="@style/ThemeNova" />

               <activity
                   android:name=".GridActivity"
                   android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboard|keyboardHidden|navigation|density|uiMode"
                   android:exported="false"
                   android:screenOrientation="sensorLandscape" />

               <provider
                   android:name="androidx.core.content.FileProvider"
                   android:authorities="${applicationId}.provider"
                   android:exported="false"
                   android:grantUriPermissions="true">
                   <meta-data
                       android:name="android.support.FILE_PROVIDER_PATHS"
                       android:resource="@xml/file_paths" />
               </provider>

               <service
                   android:name=".NovaMessagingService"
                   android:exported="false">
                   <intent-filter>
                       <action android:name="com.google.firebase.MESSAGING_EVENT" />
                   </intent-filter>
               </service>

               <meta-data
                   android:name="com.google.firebase.messaging.default_notification_channel_id"
                   android:value="nova_push" />
               <meta-data
                   android:name="com.google.firebase.messaging.default_notification_color"
                   android:resource="@color/np_gold" />
