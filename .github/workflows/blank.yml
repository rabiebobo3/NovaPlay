           safe("المشغّل") { buildPlayer() }
           safe("المفضلة") { decodeChans(sp.s("favs"), favs) }
           safe("الأخيرة") { decodeChans(sp.s("recents"), recents) }
           safe("قنواتي") { loadMine() }
           autoNext = sp.b("auto_next", true)
           safe("الأقسام والقنوات") {
             buildGroups()
             rvChannels.adapter = chanAdapter
             rvGroups.adapter = grpAdapter
             selectGroup(groups.firstOrNull() ?: Group().apply { name = "ALL"; special = "all" })
           }
           safe("البث للشاشة") { setupCast() }
           safe("مسار التشغيل") { readExtraRoute() }
           val direct = intent.getStringExtra("play")
           val chanExtra = intent.getStringExtra("chan")
           if (!direct.isNullOrBlank() || !chanExtra.isNullOrBlank()) {
             playSafe(chanFromIntent(direct ?: ""), true)
           } else if (!Catalog.loaded) {
             val p = Catalog.profile ?: lastProfile()
             if (p != null) {
               busy(true, "تحميل القائمة…")
               Loader.load(this, p, false, { t -> runOnUiThread { tvLoadTxt.text = t } }) { ok, _ ->
                 busy(false, "")
                 if (ok) {
                   buildGroups(); selectGroup(groups.firstOrNull()!!)
                   // v8.24 + (8.34): أمر «وضع القنوات» أهمّ من استعادة آخر قناة
                   if (intent?.getStringExtra("mode") == "live") focusChannelList()
                   else restoreLastChannel()
                 } else toast("تعذّر تحميل القائمة")
               }
             }
           } else safe("آخر قناة") {
             // v8.24 + (8.34): آخر قناة (مباشر فقط) تُشتغل في المشغل الصغير — وإلا نُظهر القنوات والفوكس عليها
             // (8.34) ولو جاي من زر «البث المباشر» نعرض القنوات مباشرةً بلا تشغيل تلقائي
             if (intent?.getStringExtra("mode") == "live") focusChannelList()
             else if (!restoreLastChannel()) focusChannelList()
           }
           safe("الساعة") { startTicker() }
         }

         override fun onResume() {
           super.onResume()
           goImmersive()
           if (!isTvDevice()) keepAwake()
           receiver = Events.register(this) { type, text ->
             when (type) {
               "kicked" -> { toast(text.ifBlank { "انتهت الجلسة" }); finish() }
               "reload" -> { buildGroups(); refresh() }
               "broadcast" -> if (text.isNotEmpty()) infoDialog("إشعار", text)
             }
           }
         }

         override fun onStop() {
           // v8.24: نوقف التشغيل عند خروج الشاشة من الأمام (بلا صوت في الخلفية ولا استنزاف بطارية)
           try {
             wasPlayingBeforeStop = player?.isPlaying == true
             player?.pause()
           } catch (t: Throwable) {}
           super.onStop()
         }

         override fun onStart() {
           super.onStart()
           try { if (wasPlayingBeforeStop) player?.play() } catch (t: Throwable) {}
         }

         override fun onPause() {
           savePosNow()
           Events.unregister(this, receiver); receiver = null
           try { pv.keepScreenOn = false } catch (t: Throwable) {}
           super.onPause()
         }

         private fun keepAwake() {
           try { pv.keepScreenOn = true } catch (t: Throwable) {}
         }

         /** إعادة استخدام نفس الشاشة بدل تكديس مشغّلات (يمنع صوت قناتين معًا). */
         override fun onNewIntent(i: Intent?) {
           super.onNewIntent(i)
           intent = i
           readExtraRoute()
           val direct = i?.getStringExtra("play")
           val chanExtra = i?.getStringExtra("chan")
           if (!direct.isNullOrBlank() || !chanExtra.isNullOrBlank()) {
             showPip(false)
             playSafe(chanFromIntent(direct ?: ""), true)
             return
           }
           // (8.34) رجعنا للشاشة من زر «البث المباشر» ⇒ نعرض القنوات (لا نبقى على فلم/حلقة)
           if (i?.getStringExtra("mode") == "live") enterLiveMode()
         }

         /**
         * (8.34) وضع القنوات: نُفرّغ مسار الفلم/الحلقة ونضع الفوكس على قائمة القنوات.
         * كانت المشكلة: بعد الخروج من التطبيق والدخول من جديد، تبقى الحلقة/الفلم معروضة
         * ولا «تدخل» شاشة القنوات.
         */
         private fun enterLiveMode() {
           try {
             fromGrid = false
             plist.clear()
             if (cur != null && cur?.kind != "live") {
               stopAllPlayback()
               cur = null
               try {
                 infoName.text = "NovaPlay"
                 infoSub.text = "اختر قناة من القائمة"
                 infoDesc.text = ""
               } catch (t: Throwable) {}
               showPip(false)
             }
             refresh()
             focusChannelList()
           } catch (t: Throwable) { Crash.log(t) }
         }

         /** (8.34) الفوكس على قائمة القنوات — تُستعمل عند الفتح/الرجوع لكي لا يذهب الفوكس للبحث أو للفراغ. */
         private fun focusChannelList() {
           try {
             val g = curGroup
             if (g.isNotBlank()) {
               val hit = groups.firstOrNull { it.name == g }
               if (hit != null && !groups.isEmpty() && shown.isEmpty()) selectGroup(hit)
             }
             rvChannels.isFocusable = true
             rvChannels.descendantFocusability = android.view.ViewGroup.FOCUS_AFTER_DESCENDANTS
             rvChannels.postDelayed({
               try { rvChannels.requestFocus() } catch (t: Throwable) {}
             }, 120)
           } catch (t: Throwable) { Crash.log(t) }
         }

         override fun onWindowFocusChanged(hasFocus: Boolean) {
           super.onWindowFocusChanged(hasFocus)
           if (hasFocus) goImmersive()
         }

         override fun onDestroy() {
           savePosNow()
           stopTicker(); clearWd()
           try { player?.removeListener(this) } catch (t: Throwable) {}
           try { player?.release() } catch (t: Throwable) {}
           player = null
           try { pv.player = null; pvFull.player = null } catch (t: Throwable) {}
           super.onDestroy()
         }

         /** يعيد بناء العنصر كاملًا (kind/mid/sid/id/catId) حتى يعرف المشغّل كيف يحل رابط البوابة. */
         private fun chanFromIntent(url: String): Channel {
           val raw = intent.getStringExtra("chan")
           if (!raw.isNullOrBlank()) {
             try {
               val c = Channel.fromJson(JSONObject(raw))
               if (c.url.isBlank()) c.url = url
               if (c.kind.isBlank()) c.kind = intent.getStringExtra("kind") ?: "movie"
               return c
             } catch (t: Throwable) { Crash.log(t) }
           }
           return Channel().apply {
             name = intent.getStringExtra("title") ?: "تشغيل"
             this.url = url
             id = intent.getStringExtra("cid") ?: ""
             kind = intent.getStringExtra("kind") ?: "movie"
           }
         }

         /** (8.24) يستعيد آخر قناة شُغّلت في المشغل الصغير (بلا شاشة كبيرة) مع الفوكس فوقها. */
         private fun restoreLastChannel(): Boolean {
           return try {
             val raw = sp.s("last_ch")
             if (raw.isBlank()) return false
             if (cur != null) return false                        // شيء يعمل الآن
             val c = Channel.fromJson(JSONObject(raw))
             if (c.name.isBlank()) return false
             if (c.kind != "live") return false                 // (8.34) لا نُشغّل فلمًا/حلقة في شاشة القنوات
             if (!Catalog.loaded || Catalog.live.isEmpty()) return false
             selectGroupOf(c)
             playSafe(c, false)
             true
           } catch (t: Throwable) { Crash.log(t); false }
         }

         private fun lastProfile(): Profile? = try {
           val t = sp.s("last")
           if (t.isEmpty()) null else Profile.fromJson(JSONObject(t))
         } catch (t: Throwable) { null }

         /* ================================ المشغّل ================================ */

         private fun buildPlayer() {
           val hdr = HashMap<String, String>()
           hdr["Accept"] = "*/*"
           hdr.putAll(Stalker.playHeaders(Catalog.profile))
           // v8.26: عدّاد السرعة الذي يظهر تحت عجلة التحميل (KB/s) مثل الصورة
           bm = androidx.media3.exoplayer.upstream.DefaultBandwidthMeter.Builder(this).build()
           val http = DefaultHttpDataSource.Factory()
             .setTransferListener(bm)
             .setUserAgent(if (Catalog.profile?.type == "mac") Stalker.UA_STB else Http.UA)
             .setAllowCrossProtocolRedirects(true)
             .setConnectTimeoutMs(12000)
             .setReadTimeoutMs(20000)
             .setDefaultRequestProperties(hdr)
           val load = buildLoadControl(cur?.kind == "live")
           // (8.27) كل الصيغ: DefaultDataSource يوزّع — rtmp:// على وحدة RTMP، والباقي (http/file/content/asset) على HTTP
           val dsf = androidx.media3.datasource.DefaultDataSource.Factory(this, http).setTransferListener(bm)
           val p = ExoPlayer.Builder(this)
             .setMediaSourceFactory(DefaultMediaSourceFactory(dsf))
             // (8.24) فكّ الترميز البديل: لو فشل مفكّك الجهاز (شائع في الأجهزة الرخيصة) يجرّب الذي بعده
             // بدل ما يتجمّد المشغّل أو يطلع خطأ. نفس النداء مستعمل في media3 1.2.x.
             .setRenderersFactory(androidx.media3.exoplayer.DefaultRenderersFactory(this).setEnableDecoderFallback(true))
             .setLoadControl(load)
             // (8.27) البث المباشر: يبقى قريبًا من حرف البث ويتدارك التأخّر بالسرعة ⇒ بلا تجمّد
             .setLivePlaybackSpeedControl(
               androidx.media3.exoplayer.DefaultLivePlaybackSpeedControl.Builder()
                 .setFallbackMinPlaybackSpeed(0.96f)
                 .setFallbackMaxPlaybackSpeed(1.04f)
                 .setTargetLiveOffsetIncrementOnRebufferMs(400L)
                 .build())
             .setSeekBackIncrementMs(10000L)
             .setSeekForwardIncrementMs(10000L)
             .setHandleAudioBecomingNoisy(true)
             .build()
           p.playWhenReady = true
           player = p
           pv.player = p
           pv.useController = true
           applyResize()
           p.addListener(this)
         }

         /**
         * (8.24) أداء: إعدادات ذاكرة مؤقتة مختلفة للبث المباشر وللأفلام/الحلقات.
         *  - القنوات: مخزون صغير ⇒ بداية فورية وزمن تبديل قصير (Live يتطلّب سرعة لا عمقًا).
         *  - الأفلام/الحلقات: مخزون أكبر + ذاكرة رجوع واسعة ⇒ بلا تقطيع وتقديم/تأخير سريع.
         */
         private fun buildLoadControl(live: Boolean): DefaultLoadControl =
           if (live) DefaultLoadControl.Builder()
             // (8.32) كان 1200/12000/500/900 — صغير جدًا: أي اهتزاز في الشبكة يوقف الصورة (تقطيع).
             //        صار بهامش يتحمّل الشبكة الضعيفة مع بقاء البداية سريعة.
             .setBufferDurationsMs(6000, 45000, 2000, 3500)
             .setBackBuffer(0, false)
             .setPrioritizeTimeOverSizeThresholds(true)
             .build()
           else DefaultLoadControl.Builder()
             .setBufferDurationsMs(3000, 60000, 1000, 2500)
             .setBackBuffer(20000, true)
             .setPrioritizeTimeOverSizeThresholds(true)
             .build()

         /**
         * (8.24) في media3 لا يمكن تغيير LoadControl بعد إنشاء المشغّل، لذلك نُسجّل نوع المحتوى
         * ويُستعمل عند إنشاء المشغّل (media3: المخزون يُضبط في ExoPlayer.Builder.setLoadControl).
         */
         private fun tuneLoad(c: Channel?) {
           try { lastTunedLive = (c?.kind == "live") } catch (t: Throwable) { Crash.log(t) }
         }

         private fun setupCast() {
           try {
             val sel = MediaRouteSelector.Builder()
               .addControlCategory(MediaControlIntent.CATEGORY_REMOTE_PLAYBACK)
               .addControlCategory(MediaControlIntent.CATEGORY_LIVE_VIDEO)
               .addControlCategory(MediaControlIntent.CATEGORY_LIVE_AUDIO)
               .build()
             castBtn.routeSelector = sel
           } catch (t: Throwable) { Crash.log(t) }
         }

         /** رقم آخر ضغطة: أي رد قديم (قناة سابقة) لا يقطع تشغيل ما ضغط عليه المستخدم للتو. */
         private var playSeq = 0
         private var resolvedLive = false
         private var triedPlainHttp = false     // (8.30) جرّبنا http بعد فشل https؟
         private var busyFlash: Runnable? = null   // (8.32) تأخير ظهور عجلة التحميل
         private var softTries = 0                 // (8.32) إصلاح ناعم قبل إعادة التشغيل الكاملة

         private fun play(c: Channel, full0: Boolean) {
           playSeq++
           val mySeq = playSeq
           savePosNow()                      // نحفظ موضع العنصر السابق قبل الانتقال
           stopAllPlayback()
           cur = c
           retries = 0
           usingAlt = false
           triedPlainHttp = false
           softTries = 0
           queries.clear(); candIdx = 0            // لا تبقى أوامر عنصر سابق (كانت تُشغّل قناة غلط)
           tuneLoad(c)
           applySkin()                                                       // v8.26: شكل المشغّل حسب المحتوى
           // (8.34) نحفظ «آخر قناة» للمباشر فقط: كان يُحفظ فلم/حلقة ⇒ عند فتح شاشة القنوات
           //        تُشغَّل الحلقة تلقائيًا بدل عرض القنوات (شكوى: «يذهب للحلقة ولا يدخل القنوات»)
           if (c.kind == "live") try { sp.put("last_ch", c.toJson().toString()) } catch (t: Throwable) {}
           pushRecent(c)
           var url = c.url.ifBlank { c.alt }
           val p = Catalog.profile
           // MAC: كل تشغيل يمرّ عبر البوابة (create_link). المشغل يظهر فورًا، ثم يُجلب الرابط،
           // ولو فشلت البوابة يظهر سبب الفشل داخل المشغل نفسه (لا يخرج المستخدم).
           if (p?.type == "mac") {
             if (url.isBlank()) url = Stalker.localCmd(c.id.ifBlank { c.mid })   // أمر MAG من المعرّف
             if (url.isBlank()) { toast("لا يوجد أمر تشغيل لهذا العنصر"); return }
             c.url = url                            // مهم: الأمر يصل للبوابة حتى لو كان مُستنبطًا
             // (8.31) رابط بوابة بلا play_token (من الكاش) لا يتشغّل (511) ⇒ نطلب رابطًا جديدًا من البوابة
             val staleTok = Stalker.isPortalPlayUrl(url) && !Stalker.hasToken(url)
             if (staleTok) try {
               Crash.note("PLAY-FIX", "رابط مخزَّن بلا توكن حيّ ⇒ نطلب رابطًا جديدًا من البوابة")
             } catch (t: Throwable) {}
             // مثل كود Java: القناة المباشرة رابطها جاهز → تُشغَّل مباشرة بلا create_link
             if (c.kind == "live" && directUrl(url) && !staleTok) {
               resolvedLive = false
               c.url = url
               startPlayback(c, url, full0)
               return
             }
             val cmd0 = url
             pendingPlayer(c, full0, "جارٍ تجهيز رابط البوابة…")
             Loader.macPlayQueries(p, c) { list ->
               if (mySeq != playSeq) return@macPlayQueries     // ضغط المستخدم على عنصر آخر
               try {
                 busy(false, "")
                 queries.clear(); queries.addAll(list); candIdx = 0
                 if (queries.isEmpty()) {
                   busy(false, "")
                   val info = try { StalkerSession.get(p).lastEpsInfo } catch (t: Throwable) { "" }
                   if (info.isNotBlank()) Crash.note("PLAY-FAIL", "kind=${c.kind} mid=${c.mid} sid=${c.sid} snum=${c.snum} ep=${c.id} :: " + info.take(400))
                   showPlayerError("البوابة لم تُرجع رابطًا لهذا العنصر\n" + Catalog.status.take(160))
                   return@macPlayQueries
                 }
                 resolveAndPlay(p, c, full0, mySeq)
               } catch (t: Throwable) {
                 try { busy(false, "") } catch (e: Throwable) {}
                 Crash.log(t)
                 showPlayerError("تعذر التشغيل: " + (t.message ?: t.javaClass.simpleName))
               }
             }
             return
           }
           if (url.startsWith("rtmp") || url.startsWith("mms")) { openExternal(url); return }
           if (url.isBlank()) { toast("لا يوجد رابط تشغيل لهذا العنصر"); return }
           startPlayback(c, url, full0)
         }

         /**
         * (8.21) ينفّذ الأمر الحالي؛ إن فشل ينتقل للموالي تلقائيًا حتى ينجح أحدها.
         * هذا هو اللي يمنع التجمّد: كل أمر فاشل يُستبدل بلا تدخّل من المستخدم.
         */
         private fun resolveAndPlay(p: Profile, c: Channel, asFull: Boolean, mySeq: Int) {
           if (mySeq != playSeq) return
           if (candIdx >= queries.size) {
             busy(false, "")
             val info = try { StalkerSession.get(p).lastEpsInfo } catch (t: Throwable) { "" }
             if (info.isNotBlank()) Crash.note("PLAY-FAIL-ALL", "kind=${c.kind} mid=${c.mid} sid=${c.sid} snum=${c.snum} ep=${c.id} :: " + info.take(400))
             showPlayerError("تعذّر جلب رابط تشغيل من البوابة لهذا العنصر (${queries.size} محاولة)\n" +
               "جرّب عنصرًا آخر أو حدّث القائمة من الإعدادات.\n" + Catalog.status.take(120))
             return
           }
           val q = queries[candIdx]
           busy(true, "تجهيز رابط التشغيل (${candIdx + 1}/${queries.size})…")
           Loader.macResolveQuery(p, q) { u ->
             if (mySeq != playSeq) return@macResolveQuery
             if (u.isBlank()) { candIdx++; resolveAndPlay(p, c, asFull, mySeq) }
             else {
               busy(false, "")
               c.url = u
               startPlayback(c, u, asFull)
             }
           }
         }

         /** رابط قابل للتشغيل مباشرة (ليس أمر بوابة محلي ولا رابطًا نسبيًا). */
         private fun directUrl(u: String): Boolean {
           if (u.isBlank()) return false
           val l = u.lowercase()
           if (l.contains("localhost") || l.contains("127.0.0.1")) return false
           return l.startsWith("http://") || l.startsWith("https://") || l.startsWith("rtsp") || l.startsWith("udp") || l.startsWith("rtmp")
         }

         /** يفتح شاشة المشغل فورًا (عنوان + شريط تحميل) قبل ما يوصل الرابط. */
         private fun pendingPlayer(c: Channel, asFull: Boolean, msg: String) {
           try {
             infoName.text = c.name
             infoSub.text = listOfNotNull(
               if (c.group.isBlank()) null else c.group,
               when (c.kind) { "live" -> "بث مباشر"; "movie" -> "فيلم"; "series" -> "مسلسل"; "episode" -> "حلقة"; else -> c.kind }
             ).joinToString(" • ")
             infoDesc.text = c.extra.ifBlank { "بانتظار البيانات…" }
             if ((asFull || c.kind != "live") && !full) toggleFull(true)
             dockBusy.visibility = View.VISIBLE; fullBusy.visibility = View.VISIBLE
             tvLoadTxt.text = "جاري تحميل"; tvFullTxt.text = "جاري تحميل"; tvFullPct.text = ""; tvLoadPct.text = ""
             wdBar.visibility = View.GONE
             chanAdapter.notifyDataSetChanged()
             showPip(true)
           } catch (t: Throwable) { Crash.log(t) }
         }

         /** رسالة الفشل تظهر داخل المشغل (الشريط العلوي) بدل ما يخرج المستخدم أو ما يشوفش شي. */
         private fun showPlayerError(msg: String) {
           try {
             dockBusy.visibility = View.GONE; fullBusy.visibility = View.GONE
             tvWd.text = msg
             wdBar.visibility = View.VISIBLE
             infoDesc.text = msg
           } catch (t: Throwable) { Crash.log(t) }
         }

         /** غلاف آمن للضغط على القناة: أي خطأ يظهر كتنبيه ولا يُغلق التطبيق. */
         /**
         * (8.24) ضغطة على قناة: تُشغَّل في المشغل **الصغير**. وإذا كانت هي نفسها تعمل الآن ⇒ ضغطة ثانية سريعة
         * (ريموت OK مرتين أو لمس) تفتح **المشغل الكبير** فورًا؛ وإذا كانت قناة أخرى ⇒ تُشغَّل في الصغير.
         */
         private fun onChannelTap(c: Channel) {
           val now = System.currentTimeMillis()
           val same = cur != null && sameChan(c, cur!!)
           if (same && now - lastTapAt < 700) { openFullFast(c); lastTapId = ""; lastTapAt = 0; return }
           lastTapId = c.id.ifBlank { c.url }
           lastTapAt = now
           if (same) { if (!full) focusChannel(); return }        // نفس القناة تعمل: لا نعيد التحميل
           playSafe(c, false)
         }

         /** (8.24) يفتح المشغل الكبير **فورًا**: نفس المشغّل يُنسب للمشهد الكبير بلا إعادة تحضير. */
         private fun openFullFast(c: Channel) {
           try {
             val same = cur != null && sameChan(c, cur!!)
             if (same && player != null) {
               if (!full) toggleFull(true)
               else showBars()
               return
             }
             playSafe(c, true)
           } catch (t: Throwable) { Crash.log(t); playSafe(c, true) }
         }

         private fun playSafe(c: Channel, asFull: Boolean) {
           try { play(c, asFull) } catch (t: Throwable) {
             try { busy(false, "") } catch (e: Throwable) {}
             Crash.log(t)
             toast("تعذر التشغيل: " + (t.message ?: t.javaClass.simpleName))
           }
         }

         private fun openExternal(u: String) {
           if (u.isBlank()) return
           try {
             val i = Intent(Intent.ACTION_VIEW)
             i.setDataAndType(Uri.parse(u), "video/*")
             i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
             startActivity(Intent.createChooser(i, "تشغيل خارجيًا (RTMP)"))
           } catch (t: Throwable) { toast("لا يوجد مشغّل خارجي لهذا الرابط") }
         }

         /** يوقف أي صوت/فيديو سابق فورًا قبل تشغيل عنصر جديد. */
         private fun stopAllPlayback() {
           try { pv.player = null } catch (t: Throwable) {}
           try { pvFull.player = null } catch (t: Throwable) {}
           try { player?.pause() } catch (t: Throwable) {}
           try { player?.stop() } catch (t: Throwable) {}
           try { player?.clearMediaItems() } catch (t: Throwable) {}
         }

         private fun startPlayback(c: Channel, url: String, asFull: Boolean) {
           val p = player ?: return
           // (8.30) الدليل: الرابط الذي يُشغَّل فعلًا (نقارنه مع التطبيق القديم)
           try {
             Crash.note("PLAY-URL", c.kind + " | " + (if (url.length > 190) url.substring(0, 190) else url) +
               (if (url.contains("localhost") || url.contains("127.0.0.1")) " ⚠️ المضيف محلي!" else ""))
           } catch (t: Throwable) {}
           infoName.text = c.name
           infoSub.text = listOfNotNull(
             if (c.group.isBlank()) null else c.group,
             when (c.kind) { "live" -> "بث مباشر"; "movie" -> "فيلم"; "series" -> "مسلسل"; "episode" -> "حلقة"; else -> c.kind }
           ).joinToString(" • ")
           infoDesc.text = "بانتظار البيانات…"
           // (8.27) نحدّد النوع بدقّة ⇒ المشغّل يختار المحلّل الصحيح فورًا (خصوصًا TS في القنوات)
           val mime = when {
             url.contains(".m3u8", true) -> "application/x-mpegURL"
             url.contains(".mpd", true) -> "application/dash+xml"
             url.contains(".ts", true) || url.contains(".m2ts", true) || url.contains(".mts", true) -> "video/mp2t"
             url.contains(".mkv", true) -> "video/x-matroska"
             url.contains(".mp4", true) || url.contains(".m4v", true) -> "video/mp4"
             url.contains(".webm", true) -> "video/webm"
             else -> null
           }
           val meta = MediaMetadata.Builder().setTitle(c.name).build()
           val item = liveCfg(MediaItem.Builder().setUri(url).setMediaMetadata(meta)
             .setMimeType(mime).setTag(c.name)).build()
           // نفس كود Java: الأفلام/الحلقات تُفتح ملء الشاشة — نُجهّز المشهد الكبير **قبل** التشغيل
           if ((asFull || c.kind != "live") && !full) toggleFull(true)
           resumeAsk = if (c.kind == "live") 0L else savedPosOf(c)     // متابعة المشاهدة (showResumeDialog)
           p.stop()
           p.setMediaItem(item)
           p.prepare()
           p.playWhenReady = true
           if (full) { try { pvFull.player = p } catch (t: Throwable) { pv.player = p } } else pv.player = p
           playStarted = false
           armStartWatch()
           if (!full) { dockBusy.visibility = View.VISIBLE; tvLoadPct.text = "0%" }
           else { fullBusy.visibility = View.VISIBLE; tvFullPct.text = "0%" }
           armWd()
           fetchEpg(c)
           chanAdapter.notifyDataSetChanged()
           showPip(!full)                     // ما نُظهرش البطاقة الصغيرة فوق المشغل الكبير
           if (cur?.kind == "live" && !full) { selectGroupOf(c); focusChannel() }
         }

         private fun playAlt() {
           val c = cur ?: return
           if (c.alt.isBlank() || c.alt == c.url) { toast("لا يوجد مصدر بديل"); return }
           usingAlt = true
           retries = 0
           infoDesc.text = "تجربة المصدر البديل…"
           val item = liveCfg(MediaItem.Builder().setUri(c.alt)
             .setMediaMetadata(MediaMetadata.Builder().setTitle(c.name).build())).build()
           player?.stop(); player?.setMediaItem(item); player?.prepare(); player?.play()
           armWd(); toast("المصدر البديل قيد التجربة")
         }

         private fun toggleFull(on: Boolean) {
           try { applySkin() } catch (t: Throwable) {}
           full = on
           val p = player ?: return
           if (on) {
             fullBox.visibility = View.VISIBLE
             try { findViewById<View>(R.id.playerHolder)?.visibility = View.GONE } catch (t: Throwable) {}
             showPip(false)
             goImmersive()
             // إسناد المشغّل للمشهد الكبير مباشرة (أضمن من switchTargetView على كل الأجهزة)
             try { pvFull.player = p } catch (t: Throwable) { Crash.log(t) }
             try { pv.player = null } catch (t: Throwable) { Crash.log(t) }
             applyResize()
             try { pvFull.requestLayout() } catch (t: Throwable) {}
             pvFull.useController = false
             fullTitle.text = cur?.name ?: ""
             // (8.34) الفوكس على زر التشغيل مباشرة (أوضح للريموت)
             findViewById<View>(R.id.btn_full_play)?.requestFocus()
             hideBarsSoon()
           } else {
             fullBox.visibility = View.GONE
             try { findViewById<View>(R.id.playerHolder)?.visibility = View.VISIBLE } catch (t: Throwable) {}
             try { pv.player = p } catch (t: Throwable) { Crash.log(t) }
             try { pvFull.player = null } catch (t: Throwable) { Crash.log(t) }
             ctrlLocked = false
             try { findViewById<TextView>(R.id.btn_center_play)?.visibility = View.GONE } catch (t: Throwable) {}
             // v8.24 + (8.32): نرجّعوا **القسم** اللي فيه القناة ثم نضعوا الفوكس فوق القناة نفسها
             try { cur?.let { c -> selectGroupOf(c) } } catch (t: Throwable) { Crash.log(t) }
             try { focusChannel() } catch (t: Throwable) { Crash.log(t) }
             try { focusFirst() } catch (t: Throwable) { Crash.log(t) }
           }
         }

         /**
         * نسبة الصورة (v8.19): 1 تلقائي — يملأ شاشة الهاتف بلا شدّ (قصّ خفيف فقط) وهو الافتراضي،
         * 0 ملاءمة مضبوطة (الصورة كاملة بأشرطة)، 2 تمديد، 3 نسبة 16:9 ثابتة، 4 نسبة 4:3 ثابتة.
         */
         /**
         * (8.20) اختيار تلقائي على حساب شاشة الهاتف وأبعاد الفيديو:
         *   الفيديو 16:9 أو أعرض ⇒ «يملأ الشاشة» (بلا أشرطة، قصّ خفيف في الجوانب).
         *   الفيديو أضيق (4:3 أو عمودي) ⇒ «ملاءمة كاملة» (لا تكبير عنيف يخرّب الصورة).
         */
         private fun autoModeFor(w: Int, h: Int): String {
           if (w <= 0 || h <= 0) return "1"
           val va = w.toFloat() / h.toFloat()
           return if (va >= 1.55f) "1" else "0"
         }

         private fun applyResize() {
           val mode = sp.s("rm2", "1")
           val rm = when (mode) {
             "1" -> androidx.media3.ui.AspectRatioFrameLayout.RESIZE_MODE_ZOOM
             "2" -> androidx.media3.ui.AspectRatioFrameLayout.RESIZE_MODE_FILL
             else -> androidx.media3.ui.AspectRatioFrameLayout.RESIZE_MODE_FIT
           }
           val ratio = when (mode) { "3" -> 16f / 9f; "4" -> 4f / 3f; else -> 0f }
           try { applyBox(pv, rm, ratio) } catch (t: Throwable) { Crash.log(t) }
           try { applyBox(pvFull, rm, ratio) } catch (t: Throwable) { Crash.log(t) }
         }

         /** يضبط صندوق المشغل: ملء الشاشة، أو نسبة ثابتة في وسط الشاشة (لتصحيح بيانات السرفر). */
         private fun applyBox(v: PlayerView, rm: Int, ratio: Float) {
           try { v.resizeMode = rm } catch (t: Throwable) {}
           val parent = v.parent as? View ?: return
           val lp = v.layoutParams as? FrameLayout.LayoutParams ?: return
           if (ratio <= 0f) {                       // «يملأ الشاشة»: الصندوق كامل (لا يبقى محبوسًا على 16:9)
             try {
               lp.width = FrameLayout.LayoutParams.MATCH_PARENT
               lp.height = FrameLayout.LayoutParams.MATCH_PARENT
               v.layoutParams = lp
             } catch (t: Throwable) {}
             return
           }
           if (ratio > 0f) {
             var pw = parent.width
             var ph = parent.height
             if (pw <= 0 || ph <= 0) {
               pw = resources.displayMetrics.widthPixels
               ph = resources.displayMetrics.heightPixels
             }
             var w = pw
             var hh = (pw / ratio).toInt()
             if (hh > ph) { hh = ph; w = (ph * ratio).toInt() }
             if (w <= 0 || hh <= 0) return
             lp.width = w
             lp.height = hh
             lp.gravity = android.view.Gravity.CENTER
           } else {
             lp.width = FrameLayout.LayoutParams.MATCH_PARENT
             lp.height = FrameLayout.LayoutParams.MATCH_PARENT
             lp.gravity = android.view.Gravity.CENTER
           }
           try { v.layoutParams = lp } catch (t: Throwable) { Crash.log(t) }
         }

         /** (8.24) تشغيل/إيقاف بزر واحد (يُستعمل في الزر المركزي وزر التشغيل). */
         private fun togglePlay() {
           val p = player ?: return
           try {
             if (p.isPlaying) p.pause() else p.play()
             updateCenterPlay()
             hideBarsSoon()
           } catch (t: Throwable) { Crash.log(t) }
         }

         private fun updateCenterPlay() {
           try {
             findViewById<TextView>(R.id.btn_center_play).text = if (player?.isPlaying == true) "⏸" else "▶"
             // (8.34) أيقونة زر التشغيل في لوحة الأزرار (ImageButton) — تتبدّل مع حالة المشغّل
             (findViewById<View>(R.id.btn_full_play) as? android.widget.ImageButton)?.let { b ->
               b.setImageResource(if (player?.isPlaying == true) R.drawable.ic_pause else R.drawable.ic_play)
             }
           } catch (t: Throwable) {}
         }

         /** (8.24) تقديم/تأخير 10 ثوان مع مؤشر عائم يبيّن المدة الجديدة. */
         private fun skip(deltaMs: Long) {
           val p = player ?: return
           try {
             if (cur?.kind == "live" && p.duration <= 0) { toast("تأخير البث غير متاح في القناة الحية"); return }
             val pos = (p.currentPosition + deltaMs).coerceAtLeast(0L)
             p.seekTo(pos)
             val hint = findViewById<TextView>(R.id.tv_seek_hint)
             hint.text = (if (deltaMs > 0) "⏩ " else "⏪ ") + fmtTime(pos)
             hint.visibility = View.VISIBLE
             hint.alpha = 1f
             hint.animate().alpha(0f).setDuration(700).withEndAction { hint.visibility = View.GONE }.start()
             showBars()
           } catch (t: Throwable) { Crash.log(t) }
         }

         /** (8.24) تبديل سرعة العرض: 0.5× → 1× → 1.25× → 1.5× → 2×. */
         private fun cycleSpeed() {
           val p = player ?: return
           try {
             speedIdx = (speedIdx + 1) % speeds.size
             p.setPlaybackSpeed(speeds[speedIdx])
             tvSpeed.text = speeds[speedIdx].toString() + "×"
             toast("السرعة: " + speeds[speedIdx] + "×")
             showBars()
           } catch (t: Throwable) { Crash.log(t) }
         }

         /** (8.24) قفل الأزرار (لمنع الضغطات الخاطئة) — ضغطة مطوّلة على القفل لفكّه. */
         private fun toggleLock() {
           ctrlLocked = !ctrlLocked
           try {
             val cp = findViewById<TextView>(R.id.btn_center_play)
             cp.text = if (ctrlLocked) "\uD83D\uDD13" else (if (player?.isPlaying == true) "\u23F8" else "\u25B6")
             cp.visibility = if (full) View.VISIBLE else View.GONE
             if (ctrlLocked) fadeBars(false) else showBars()
           } catch (t: Throwable) { Crash.log(t) }
           toast(if (ctrlLocked) "الأزرار مقفلة — اضغط مطوّلًا على 🔓 لفكّها" else "الأزرار مفتوحة")
         }

         /** (8.24) اختيار مسار الصوت أو الترجمة من المشغّل (media3 Tracks). */
         private fun pickTrack(isText: Boolean) {
           val p = player ?: return
           try {
             val names = ArrayList<String>()
             val groups = ArrayList<androidx.media3.common.Tracks.Group>()
             val idxs = ArrayList<Int>()
             val tracks = p.currentTracks
             for (g in tracks.groups) {
               if (g.type != (if (isText) androidx.media3.common.C.TRACK_TYPE_TEXT else androidx.media3.common.C.TRACK_TYPE_AUDIO)) continue
               for (i in 0 until g.length) {
                 val f = g.getTrackFormat(i)
                 val label = f.label ?: f.language ?: ("مسار " + (i + 1))
                 names.add((if (g.isTrackSelected(i)) "✔ " else "") + label)
                 groups.add(g); idxs.add(i)
               }
             }
             if (names.isEmpty()) { toast(if (isText) "لا توجد ترجمات في هذا المصدر" else "مسار صوتي واحد"); return }
             val items = ArrayList<String>()
             items.add("تلقائي")
             items.addAll(names)
             pickDialog(if (isText) "الترجمة" else "الصوت", items) { k ->
               try {
                 val b = p.trackSelectionParameters.buildUpon()
                 if (k == 0) {
                   if (isText) b.setTrackTypeDisabled(androidx.media3.common.C.TRACK_TYPE_TEXT, true)
                   else b.clearOverridesOfType(androidx.media3.common.C.TRACK_TYPE_AUDIO)
                 } else {
                   val gi = k - 1
                   b.setOverrideForType(androidx.media3.common.TrackSelectionOverride(groups[gi].mediaTrackGroup, idxs[gi]))
                 }
                 p.trackSelectionParameters = b.build()
                 toast("تم التغيير")
               } catch (t: Throwable) { Crash.log(t); toast("تعذر التغيير") }
             }
           } catch (t: Throwable) { Crash.log(t) }
         }

         /* ================= v8.26: شكل المشغّل + المصادر + المفضلة + حماية ================= */

         private fun vis(id: Int, on: Boolean) {
           try { findViewById<View>(id).visibility = if (on) View.VISIBLE else View.GONE } catch (t: Throwable) {}
         }

         /**
         * (8.26) يضبط شكل المشغّل حسب المحتوى:
         *  - قناة حيّة: شارة LIVE + شعار القناة + اسمها، وأزرار السابق/التالي، وبلا شريط تقدّم.
         *  - فلم/حلقة: شريط التقدّم اليدوي + أزرار (±10، سرعة، صوت، ترجمة، قفل) + زر التشغيل في الوسط.
         */
         private fun applySkin() {
           try {
             val live = (cur?.kind ?: "live") == "live"
             isLive = live
             // (8.34) بلا أسهم عائمة على الصورة: التنقّل صار من لوحة الأزرار السفلية
             vis(R.id.liveBadge, live)
             vis(R.id.fullSeekRow, !live)
             vis(R.id.fullBtnRow, true)
             vis(R.id.btn_full_back10, !live)
             vis(R.id.btn_full_fwd10, !live)
             vis(R.id.btn_full_more, true)
             vis(R.id.btn_center_play, false)
             vis(R.id.ch_name, true)
             vis(R.id.ch_logo, true)
             chName.text = cur?.name ?: ""
             findViewById<TextView>(R.id.full_title).text = cur?.name ?: ""
             tvFullTxt.text = "جاري تحميل"
             loadChLogo()
             updateCenterPlay()
           } catch (t: Throwable) { Crash.log(t) }
         }

         /** شعار القناة/العنصر (يظهر أسفل يمين مثل الصورة) — وإن لم يوجد يُخفى. */
         private fun loadChLogo() {
           try {
             val l = cur?.logo ?: ""
             if (l.isBlank()) { chLogo.visibility = View.GONE; return }
             chLogo.visibility = View.VISIBLE
             Glide.with(this).load(l).placeholder(R.drawable.ic_live).into(chLogo)
           } catch (t: Throwable) { Crash.log(t) }
         }

         /** (8.26) أيقونة «الطبقات»: قائمة الجودات المتوفّرة + المصدر البديل. */
         private fun sourcesDialog() {
           try {
             val c = cur ?: return
             val items = ArrayList<String>()
             val groups = ArrayList<androidx.media3.common.Tracks.Group>()
             val idxs = ArrayList<Int>()
             val tracks = player?.currentTracks
             if (tracks != null) {
               for (g in tracks.groups) {
                 if (g.type != C.TRACK_TYPE_VIDEO) continue
                 for (i in 0 until g.length) {
                   val f = g.getTrackFormat(i)
                   val h = if (f.height > 0) f.height.toString() + "p" else "جودة " + (i + 1)
                   items.add((if (g.isTrackSelected(i)) "✔ " else "") + h)
                   groups.add(g); idxs.add(i)
                 }
               }
             }
             val hasAlt = c.alt.isNotBlank() && c.alt != c.url
             if (items.isEmpty() && !hasAlt) { toast("لا توجد مصادر أو جودات أخرى"); return }
             val opts = ArrayList<String>(items)
             if (hasAlt) opts.add("مصدر بديل")
             androidx.appcompat.app.AlertDialog.Builder(this)
               .setTitle("المصدر / الجودة")
               .setItems(opts.toTypedArray()) { _, k ->
                 try {
                   if (k < items.size) {
                     val b = player!!.trackSelectionParameters.buildUpon()
                     b.setOverrideForType(androidx.media3.common.TrackSelectionOverride(groups[k].mediaTrackGroup, idxs[k]))
                     player!!.trackSelectionParameters = b.build()
                     toast("تم: " + items[k])
                   } else playAlt()
                   showBars()
                 } catch (t: Throwable) { Crash.log(t); toast("تعذّر التبديل") }
               }
               .show()
           } catch (t: Throwable) { Crash.log(t) }
         }

         /** (8.26) القلب: إضافة/إزالة العنصر الحالي من المفضلة (نفس قائمة المفضلة في القائمة). */
         private fun favCurrent() {
           val c = cur ?: return
           try {
             val i = favs.indexOfFirst { it.url == c.url }
             if (i >= 0) { favs.removeAt(i); toast("أُزيلت من المفضلة") } else { favs.add(0, c); toast("أُضيفت للمفضلة ♥") }
             sp.put("favs", encodeChans(favs))
             grpAdapter.notifyDataSetChanged()
             findViewById<ImageView>(R.id.btn_pfav).alpha = if (i >= 0) 0.5f else 1f
           } catch (t: Throwable) { Crash.log(t) }
         }

         /**
         * (8.26) حراسة البث المباشر: لا نترك الصورة تتجمّد.
         *  - «يجمّع» أكثر من 9 ثوان ⇒ إعادة بناء الرابط.
         *  - الوقت واقف أكثر من 8 ثوان وهو يقول «يشتغل» ⇒ إعادة بناء الرابط.
         *  - نجرب المصدر البديل أولًا إن وُجد، ثم نعيد حل الرابط من البوابة (وتُكتب الحادثة على السجل: LIVE-STALL).
         */
         /**
         * (8.27) إعداد البث المباشر — نفس فكرة المشغّلات الاحترافية:
         *  نبقى ~2.5 ثانية وراء حرف البث، ونسمح للمشغّل يسرّع/يبطّئ بين 0.96 و 1.04
         *  باش يتدارك التأخّر لوحده بدل ما يوقف الصورة («يتجمّد»).
         */
         private fun liveCfg(b: MediaItem.Builder): MediaItem.Builder {
           return try {
             if ((cur?.kind ?: "live") == "live")
               b.setLiveConfiguration(
                 MediaItem.LiveConfiguration.Builder()
                   .setTargetOffsetMs(6000L)      // (8.32) 2.5s كانت ملصوقة بحرف البث ⇒ تجمّد متكرر
                   .setMinOffsetMs(4000L)
                   .setMaxOffsetMs(15000L)
                   .setMinPlaybackSpeed(0.96f)
                   .setMaxPlaybackSpeed(1.04f)
                   .build())
             else b
           } catch (t: Throwable) { Crash.log(t); b }
         }

         private fun liveGuard() {
           try {
             val p = player ?: return
             val now = System.currentTimeMillis()
             if (p.playbackState == Player.STATE_BUFFERING) {
               if (bufFrom == 0L) bufFrom = now
               else if (now - bufFrom > 12000) { bufFrom = 0L; liveRecover("تجميع طويل") }
             } else bufFrom = 0L
             if (p.playbackState == Player.STATE_READY && p.isPlaying) {
               val pos = p.currentPosition
               if (pos != lastPosVal) { lastPosVal = pos; lastPosAt = now }
               else if (lastPosAt != 0L && now - lastPosAt > 10000) { lastPosAt = now; liveRecover("الصورة واقفة") }
             }
           } catch (t: Throwable) { Crash.log(t) }
         }

         private fun liveRecover(why: String) {
           val c = cur ?: return
           val now = System.currentTimeMillis()
           if (now - stallAt < 12000) return                    // لا نكرّر بسرعة
           stallAt = now; stallCount++
           // (8.32) أولًا إصلاح «ناعم»: نعيد التجهيز على نفس الرابط — بلا قطع الصورة ولا شاشة سوداء
           if (softTries < 2) {
             softTries++
             Crash.note("LIVE-STALL", why + " #" + stallCount + " — إعادة تجهيز ناعمة (" + softTries + "/2)")
             try {
               val pp = player
               if (pp != null) { pp.prepare(); pp.playWhenReady = true; armWd(); return }
             } catch (t: Throwable) { Crash.log(t) }
           }
           softTries = 0
           Crash.note("LIVE-STALL", why + " #" + stallCount + " — إعادة تشغيل كاملة")
           toast("إعادة تشغيل تلقائي…")
           try {
             if (c.alt.isNotBlank() && c.alt != c.url) { playAlt(); return }
           } catch (t: Throwable) { Crash.log(t) }
           try { playSafe(c, full) } catch (t: Throwable) { Crash.log(t) }
         }

         /**
         * (8.32) نافذة «⋯» الاحترافية: الوظائف الثانوية كلها هنا (صديقة للريموت، بلا زحمة على الشاشة).
         * كل عنصر يستدعي نفس الدالة الأصلية ⇒ ما ضاعش حتى خيار من قبل.
         */
         private fun moreDialog() {
           try {
             val live = (cur?.kind ?: "live") == "live"
             val labels = ArrayList<String>()
             val acts = ArrayList<() -> Unit>()
             labels.add("الصوت / القنوات الصوتية"); acts.add { pickTrack(false); showBars() }
             if (!live) { labels.add("الترجمة"); acts.add { pickTrack(true); showBars() } }
             if (!live) { labels.add("سرعة التشغيل"); acts.add { cycleSpeed() } }
             labels.add("المصدر / الجودة"); acts.add { sourcesDialog(); showBars() }
             labels.add("نسبة الصورة"); acts.add { cycleResize(); showBars() }
             labels.add("المفضلة ★"); acts.add { toggleFav(); showBars() }
             if (!live) { labels.add(if (ctrlLocked) "فكّ قفل الأزرار" else "قفل الأزرار"); acts.add { toggleLock() } }
             labels.add("بطاقة صغيرة"); acts.add { showPip(!pipOn); toggleFull(false) }
             labels.add("إرسال للشاشة"); acts.add {
               try { if (!castBtn.showDialog()) toast("لا توجد أجهزة متاحة") } catch (t: Throwable) { toast("البث غير مدعوم") }
             }
             labels.add("معلومات"); acts.add { infoDialog(cur?.name ?: "-", descOf(cur) + "\n\n" + (cur?.url ?: "")); showBars() }
             androidx.appcompat.app.AlertDialog.Builder(this)
               .setTitle("خيارات المشغّل")
               .setItems(labels.toTypedArray()) { _, k -> try { acts[k].invoke() } catch (t: Throwable) { Crash.log(t) } }
               .show()
           } catch (t: Throwable) { Crash.log(t) }
         }

         private fun cycleResize() {
           val order = listOf("1", "0", "2", "3", "4")
           val i = order.indexOf(sp.s("rm2", "1")).let { if (it < 0) 0 else it }
           val nxt = order[(i + 1) % order.size]
           sp.put("rm2", nxt)
           sp.put("rm_man", if (nxt == "1") "0" else "1")
           applyResize()
           toast("نسبة الصورة: " + ratioLabel(nxt))
         }

         /**
         * (8.24) يُمرّر قائمة القنوات إلى القناة الحالية ويضع الفوكس (▶) فوقها.
         * تُنادى عند: الرجوع من المشغل الكبير، الدخول للشاشة، وتبديل القناة.
         */
         private fun focusChannel() {
           val c = cur ?: return
           val host = if (shown.isNotEmpty()) shown else sourceList()
           var i = -1
           for (k in host.indices) if (sameChan(host[k], c)) { i = k; break }
           if (i < 0) { focusFirst(); return }                   // (8.32) ماشي في القائمة ⇒ الفوكس على القنوات لا البحث
           try { rvChannels.scrollToPosition(i) } catch (t: Throwable) {}
           rvChannels.postDelayed({
             try {
               val lm = rvChannels.layoutManager
               val v = lm?.findViewByPosition(i)
               if (v != null) { v.requestFocus() } else rvChannels.requestFocus()
             } catch (t: Throwable) {}
           }, 200)
         }

         /**
         * (8.32) ما نخلّيوش الفوكس يسقط على صندوق البحث: نضعه على القناة الحالية، وإلا على قائمة القنوات.
         * لا تتحرّك إلا إذا كان الفوكس ضايع ولا على البحث (حتى ما نزعزعوش فوكس المستخدم).
         */
         private fun focusFirst() {
           try {
             val cf = currentFocus
             if (cf != null && cf !== etSearch) return
             if (etSearch.hasFocus()) etSearch.clearFocus()
             val host = if (shown.isNotEmpty()) shown else sourceList()
             val c = cur
             var i = -1
             if (c != null) for (k in host.indices) if (sameChan(host[k], c)) { i = k; break }
             rvChannels.postDelayed({
               try {
                 val v = if (i >= 0) rvChannels.layoutManager?.findViewByPosition(i) else null
                 if (v != null) v.requestFocus() else rvChannels.requestFocus()
               } catch (t: Throwable) {}
             }, 120)
           } catch (t: Throwable) { Crash.log(t) }
         }

         /** (8.32) هل الشريط السفلي ظاهر الآن؟ (لتفريق أزرار الريموت: تنقّل ولا تبديل قناة) */
         private fun barsVisible(): Boolean = try {
           findViewById<View>(R.id.fullBar)?.visibility == View.VISIBLE
         } catch (t: Throwable) { true }

         /** (8.24) يرجّع القناة الحالية في القائمة المُحمّلة (نفس المجموعة/الفلتر). */
         private fun selectGroupOf(c: Channel) {
           try {
             if (listMode == "all" || listMode == "fav" || listMode == "recent" || listMode == "mine") return
             val g = groups.firstOrNull { it.name == c.group } ?: return
             if (g.name != curGroup) selectGroup(g)
           } catch (t: Throwable) { Crash.log(t) }
         }

         private fun hideBarsSoon() {
           h.removeCallbacks(hideBar)
           h.postDelayed(hideBar, if (tv) 2600 else 4000)
         }

         /** يُظهر/يُخفي الشريطين (العلوي بالعنوان والشعار + السفلي) معًا — صورة نظيفة ملء الشاشة. */
         private fun fadeBars(show: Boolean) {
           val bar = try { findViewById<View>(R.id.fullBar) } catch (t: Throwable) { null }
           val top = topBar
           for (v in listOfNotNull(bar, top)) {
             try {
               if (show) {
                 v.visibility = View.VISIBLE
                 v.animate().alpha(1f).setDuration(150).start()
               } else {
                 v.animate().alpha(0f).setDuration(220).withEndAction { v.visibility = View.GONE }.start()
               }
             } catch (t: Throwable) {}
           }
         }

         private val hideBar = Runnable {
           try { if (full && player?.isPlaying == true) fadeBars(false) } catch (t: Throwable) {}
         }

         private fun showBars() {
           if (ctrlLocked) return
           fadeBars(true)
           hideBarsSoon()
         }

         /* ===================== v8.16: رجوع للقسم + نسبة الصورة + متابعة ===================== */

         /**
         * مسار التشغيل: هل جاء من قسم الأفلام/المسلسلات؟ ومعها قائمة القسم/الحلقات
         * حتى يعمل «التالي/السابق» داخل نفس القسم أو داخل حلقات المسلسل.
         */
         private fun readExtraRoute() {
           try {
             fromGrid = (intent?.getStringExtra("from") ?: "") == "grid"
             plist.clear()
             val raw = intent?.getStringExtra("plist")
             if (!raw.isNullOrBlank()) decodeChans(raw, plist)
           } catch (t: Throwable) { Crash.log(t) }
         }

         /** قائمة التشغيل الحالية: قائمة القسم/الحلقات لو جاي من الشبكة، وإلا قنوات الشاشة. */
         private fun pl(): List<Channel> = if (plist.isNotEmpty()) plist else shown

         private fun sameChan(a: Channel, b: Channel?): Boolean {
           if (b == null) return false
           if (a.url.isNotBlank() && a.url == b.url) return true
           return a.id.isNotBlank() && a.id == b.id && a.name == b.name
         }

         private fun plIndex(): Int = pl().indexOfFirst { sameChan(it, cur) }

         /** مفتاح حفظ موضع المشاهدة لكل عنصر (فيلم/حلقة). */
         private fun keyOf(c: Channel?): String {
           if (c == null) return ""
           val u = if (c.url.isNotBlank()) c.url else c.alt
           if (u.isNotBlank()) return "u" + Integer.toHexString(u.hashCode())
           return if (c.id.isNotBlank()) "i" + c.id else ""
         }

         private fun savedPosOf(c: Channel): Long {
           val k = keyOf(c)
           if (k.isBlank()) return 0L
           return sp.s("pos_" + k).toLongOrNull() ?: 0L
         }

         private fun clearPosOf(c: Channel?) {
           val k = keyOf(c)
           if (k.isNotBlank()) sp.put("pos_" + k, "")
         }

         /** يحفظ الموضع الحالي (يُستعمل في الرجوع/الخروج) — نفس استئناف المشاهدة في كود Java. */
         private fun savePosNow() {
           try {
             val c = cur ?: return
             if (c.kind == "live") return
             val k = keyOf(c)
             if (k.isBlank()) return
             val pos = player?.currentPosition ?: return
             sp.put("pos_" + k, if (pos > 15000L) pos.toString() else "")
           } catch (t: Throwable) { Crash.log(t) }
         }

         /** نافذة «متابعة المشاهدة» — نفس `showResumeDialog` في كود Java. */
         private fun askResume(pos: Long) {
           try {
             AlertDialog.Builder(this)
               .setTitle("متابعة المشاهدة")
               .setMessage("هل تريد إكمال " + (if (cur?.kind == "movie") "الفلم" else "الحلقة") +
                 " من الوقت الذي خرجت فيه؟\n\nالوقت المحفوظ: " + fmtTime(pos))
               .setPositiveButton("إكمال من " + fmtTime(pos)) { _, _ ->
                 try { player?.seekTo(pos); player?.play() } catch (t: Throwable) {}
               }
               .setNegativeButton("من البداية") { _, _ ->
                 try { player?.seekTo(0); player?.play() } catch (t: Throwable) {}
                 clearPosOf(cur)
               }
               .show()
           } catch (t: Throwable) { Crash.log(t) }
         }

         /** اسم نسبة الصورة الحالية (تظهر في الإعدادات وفي التنبيه). */
         private fun ratioLabel(m: String): String = when (m) {
           "1" -> "تلقائي — يملأ شاشة الهاتف (16:9)"
           "2" -> "تمديد"
           "3" -> "16:9 ثابتة"
           "4" -> "4:3 ثابتة"
           else -> "ملاءمة كاملة (تلقائي للأفلام الأضيق)"
         }

         /* ================================ SmartLoad ================================ */

         override fun onPlaybackStateChanged(state: Int) {
           val p = player ?: return
           when (state) {
             Player.STATE_BUFFERING -> {
               // (8.32) ما نُظهرش العجلة على كل توقّف خفيف (ظهورها واختفاؤها المتكرر كان يُحسّ كتقطيع)
               busyFlash?.let { h.removeCallbacks(it) }
               val bf = Runnable {
                 try {
                   if (full) { fullBusy.visibility = View.VISIBLE; findViewById<TextView>(R.id.tv_full_txt).text = "جاري تحميل" }
                   else { dockBusy.visibility = View.VISIBLE; tvLoadTxt.text = "جاري تحميل" }
                 } catch (t: Throwable) {}
               }
               busyFlash = bf
               h.postDelayed(bf, 900)
             }
             Player.STATE_READY -> {
               busyFlash?.let { h.removeCallbacks(it) }; busyFlash = null
               dockBusy.visibility = View.GONE
               fullBusy.visibility = View.GONE
               playStarted = true
               clearStartWatch()
               clearWd()
               retries = 0
               val dur = p.duration
               val vod = dur > 0 && dur != C.TIME_UNSET
               dockSeek.visibility = if (vod) View.VISIBLE else View.GONE
               val bar = findViewById<LinearLayout>(R.id.fullBar)
               bar.alpha = 1f
               if (topBar != null) topBar!!.alpha = 1f
               bar.visibility = if (vod) View.VISIBLE else View.INVISIBLE
               if (full) hideBarsSoon()
               sbDock.max = (dur / 1000).toInt().coerceAtLeast(0)
               sbFull.max = sbDock.max
               tvDur.text = fmtTime(dur)
               tvFullDur.text = fmtTime(dur)
               if (vod && infoDesc.text.toString().startsWith("بانتظار")) infoDesc.text = descOf(cur)
               if (resumeAsk > 60000L && dur > resumeAsk + 30000L) {
                 val rp = resumeAsk
                 resumeAsk = 0L
                 askResume(rp)
               } else resumeAsk = 0L
             }
             Player.STATE_ENDED -> {
               busyFlash?.let { h.removeCallbacks(it) }; busyFlash = null
               clearPosOf(cur)
               dockBusy.visibility = View.GONE; fullBusy.visibility = View.GONE
               if (autoNext) next(true) else toast("انتهى العرض")
             }
             else -> {}
           }
         }

         override fun onIsPlayingChanged(isPlaying: Boolean) {
           updateCenterPlay()
           try { findViewById<TextView>(R.id.btn_center_play).visibility = if (full && !isLive) View.VISIBLE else View.GONE } catch (t: Throwable) {}
           if (isPlaying) {
             dockBusy.visibility = View.GONE; fullBusy.visibility = View.GONE
             wdBar.visibility = View.GONE
             clearWd()
           }
         }

         override fun onVideoSizeChanged(size: VideoSize) {
           val w = size.width
           val h = size.height
           lastW = w
           lastH = h
           fullQual.text = if (w > 0 && h > 0) "$w×$h" else ""
           // تلقائي على حساب شاشة الهاتف: الوضع يُختار من أبعاد الفيديو نفسه ما لم يختر المستخدم يدويًا
           if (sp.s("rm_man", "0") != "1") {
             try {
               val m = autoModeFor(w, h)
               if (m != sp.s("rm2", "1")) sp.put("rm2", m)
               applyResize()
             } catch (t: Throwable) { Crash.log(t) }
           }
           // لا نبدّل نسبة الصورة تلقائيًا: الأبعاد المقلوبة من السرفر لا تُغيّر الصورة المعروضة،
           // والتبديل التلقائي كان يضعها في إطار 16:9 بأشرطة سوداء (شكوى 8.17). التبديل يدوي بضغطة مطوّلة.
         }

         override fun onPlayerError(e: PlaybackException) {
           val p = player ?: return
           clearStartWatch()
           // (8.29) تشخيص: نسجّل الرابط الفاشل + رمز الخطأ + رمز HTTP (403/404/500…) في سجل الأعطال
           val httpCode = try {
             (e.cause as? androidx.media3.datasource.HttpDataSource.InvalidResponseCodeException)?.responseCode ?: -1
           } catch (t: Throwable) { -1 }
           val u0 = cur?.url ?: ""
           Crash.note("PLAY-FAIL", "code=" + e.errorCodeName + (if (httpCode > 0) " http=$httpCode" else "") +
             " | kind=" + (cur?.kind ?: "-") +
             " | alt=" + (if (cur?.alt?.isNullOrBlank() != false) "لا" else "نعم") +
             " | url=" + (if (u0.length > 170) u0.substring(0, 170) else u0))
           // (8.30) https فشل الاتصال؟ نجرّب نفس الرابط على http (شهادات بوابات IPTV كثيرة منتهية)
           if (!triedPlainHttp && e.errorCode == PlaybackException.ERROR_CODE_IO_NETWORK_CONNECTION_FAILED &&
             u0.startsWith("https://", true)) {
             triedPlainHttp = true
             val plain = "http://" + u0.substring(8)
             Crash.note("PLAY-FIX", "جرّبنا http بدل https: " + (if (plain.length > 150) plain.substring(0, 150) else plain))
             cur?.let { c -> c.url = plain; startPlayback(c, plain, full) }
             return
           }
           // (8.21) فشل الرابط؟ نجرّب المرشّح الموالي فورًا (تشغيل ذاتي الإصلاح)
           if (candIdx + 1 < queries.size) { tryNextCand("المصدر فشل (" + e.errorCodeName + ")"); return }
           retries++
           val smartAlt = sp.b("smart_alt", true)
           val canAlt = !usingAlt && smartAlt && (cur?.alt?.isNotBlank() == true) && cur?.alt != cur?.url
           val msg = e.errorCodeName + (if (httpCode > 0) " ($httpCode)" else "")
           // (8.29) بوابة MAC: الرابط يصلح مرّة واحدة ⇒ عند فشل الاتصال أو ردّ السيرفر نطلب رابطًا جديدًا
           //        (كان للمباشر فقط في 8.28 — صار للأفلام والحلقات كذلك)
           val pm = Catalog.profile
           val ioErr = e.errorCode == PlaybackException.ERROR_CODE_IO_NETWORK_CONNECTION_FAILED ||
             e.errorCode == PlaybackException.ERROR_CODE_IO_BAD_HTTP_STATUS ||
             e.errorCode == PlaybackException.ERROR_CODE_IO_UNSPECIFIED
           if (!resolvedLive && pm != null && pm.type == "mac" && (cur?.kind == "live" || ioErr)) {
             resolvedLive = true
             val ch = cur ?: return
             busy(true, "طلب رابط جديد من البوابة…")
             Loader.macPlayable(pm, ch) { u ->
               busy(false, "")
               if (u.isNotBlank() && u != ch.url) {
                 Crash.note("PLAY-FIX", "رابط جديد من البوابة — kind=" + ch.kind)
                 ch.url = u
                 startPlayback(ch, u, full)
               } else {
                 Crash.note("PLAY-FAIL", "create_link ما رجّعش رابطًا جديدًا — kind=" + ch.kind)
                 retrySame(p, msg)
               }
             }
             return
           }
           if (canAlt) { playAlt(); return }
           retrySame(p, msg)
         }

         /** (8.29) إعادات المحاولة العادية (كانت داخل onPlayerError). */
         private fun retrySame(p: androidx.media3.exoplayer.ExoPlayer, msg: String) {
           if (retries <= 3) {
             val wait = 700L * retries
             Crash.note("RETRY", "انقطاع ($msg) — إعادة محاولة $retries/3 بعد ${wait}ms")
             tvLoadTxt.text = "جاري تحميل"
             dockBusy.visibility = View.VISIBLE
             h.postDelayed({ if (!isFinishing && !isDestroyed) { p.prepare(); p.play() }; armWd() }, wait)
           } else {
             dockBusy.visibility = View.GONE
             tvWd.text = "فشل التشغيل: $msg — جرّب مصدرًا بديلًا أو أعد التحميل"
             wdBar.visibility = View.VISIBLE
           }
         }

         private fun startTicker() {
           stopTicker()
           val r = object : Runnable {
             override fun run() {
               tick()
               ticker = this
               h.postDelayed(this, 500)
             }
           }
           ticker = r
           h.postDelayed(r, 500)
         }

         private fun stopTicker() {
           ticker?.let { h.removeCallbacks(it) }
           ticker = null
         }

         private fun tick() {
           val p = player ?: return
           // v8.26: سرعة الشبكة تحت عجلة التحميل
           try {
             val kb = (bm?.bitrateEstimate ?: 0L) / 8192.0
             val st = "KB/s " + String.format(java.util.Locale.US, "%.1f", kb).replace('.', ',')
             tvSpeed.text = st
             tvDockSpeed.text = st
           } catch (t: Throwable) {}
           // v8.26: عجلة التحميل الأنيقة تظهر وحدها أثناء التجميع (بلا أي شرائط)
           try {
             if (full) {
               val need = p.playbackState == Player.STATE_BUFFERING
               if (need && fullBusy.visibility != View.VISIBLE) {
                 fullBusy.visibility = View.VISIBLE
                 tvFullTxt.text = "جاري تحميل"
               } else if (!need && fullBusy.visibility == View.VISIBLE) fullBusy.visibility = View.GONE
             }
           } catch (t: Throwable) {}
           if (isLive) liveGuard()                    // v8.26: لا يتجمّد في البث المباشر
           // (8.26) لا نُظهر أي نسبة مئوية: العجلة + «جاري تحميل» + KB/s فقط
           if (p.playbackState == Player.STATE_BUFFERING) {
             tvLoadPct.text = ""
             tvFullPct.text = ""
           }
           val dur = p.duration
           if (dur > 0 && dur != C.TIME_UNSET && !userSeeking) {
             val pos = p.currentPosition
             sbDock.progress = (pos / 1000).toInt()
             sbFull.progress = sbDock.progress
             tvPos.text = fmtTime(pos)
             tvFullPos.text = fmtTime(pos)
             // v8.24: كم تم تحميله (buffer) + الوقت المتبقّي بالضغط على المدة
             val buf = p.bufferedPosition
             sbFull.secondaryProgress = (buf / 1000).toInt()
             sbDock.secondaryProgress = sbFull.secondaryProgress
             tvDur.text = if (wantRemain) "-" + fmtTime((dur - pos).coerceAtLeast(0)) else fmtTime(dur)
             tvFullDur.text = tvDur.text
           }
         }

         /* ================================ الرقابة ================================ */

         /**
         * (8.21) مؤقّت بدء التشغيل: إذا ما بداش الفيديو في 12 ثانية ⇒ نجرب المرشّح الموالي تلقائيًا،
         * وإذا ما بقاش مرشّح نعرض سبب الفشل. الغاية: المشغّل ما يتجمّدش على شاشة فاضية.
         */
         private fun armStartWatch() {
           startTask?.let { h.removeCallbacks(it) }
           // القنوات الحية تتأخّر في التحميل: لا نُغيّر مصدرها إلا إذا توقّف المشغّل فعلًا
           val r = object : Runnable {
             override fun run() {
               if (isFinishing || isDestroyed) return
               if (playStarted) return
               val live = cur?.kind == "live"
               val st = try { player?.playbackState } catch (t: Throwable) { -1 }
               if (live && st != Player.STATE_IDLE) { h.postDelayed(this, 15_000); return }  // يجمّع البيانات: انتظر
               if (candIdx + 1 < queries.size) { tryNextCand("تأخّر المصدر"); return }
               h.postDelayed(this, 20_000)     // بلا بدائل: ننتظر ولا نُعلن الفشل (بلا تجمّد)
             }
           }
           startTask = r
           h.postDelayed(r, if (cur?.kind == "live") 25_000 else 12_000)
         }

         private fun clearStartWatch() {
           startTask?.let { h.removeCallbacks(it) }
           startTask = null
         }

         /** يجرّب المرشّح الموالي؛ وإن انتهوا يعرض سببًا واضحًا (بلا تجمّد). */
         private fun tryNextCand(why: String) {
           try {
             val c = cur ?: return
             val pr = Catalog.profile
             if (candIdx + 1 < queries.size && pr != null) {
               candIdx++
               toast("$why — تجربة مصدر بديل ($candIdx/${queries.size - 1})")
               busy(true, "تجهيز رابط بديل…")
               resolveAndPlay(pr, c, full, playSeq)
             } else {
               val info = if (pr == null) "" else try { StalkerSession.get(pr).lastEpsInfo } catch (t: Throwable) { "" }
               if (info.isNotBlank()) Crash.note("PLAY-FAIL-ALL", "kind=${c.kind} mid=${c.mid} sid=${c.sid} snum=${c.snum} ep=${c.id} :: " + info.take(400))
               showPlayerError("فشلت كل المصادر (${queries.size}) لهذا العنصر\n$why")
               tvWd.text = "فشل التشغيل — جرّب عنصرًا آخر أو أعد التحميل"
               wdBar.visibility = View.VISIBLE
             }
           } catch (t: Throwable) { Crash.log(t) }
         }

         private fun armWd() {
           clearWd()
           val r = Runnable {
             val p = player
             if (p == null || !p.isPlaying) {
               tvWd.text = "انقطاع في الاتصال منذ 25 ثانية — القناة: ${cur?.name ?: "-"}"
               wdBar.visibility = View.VISIBLE
             }
           }
           wdTask = r
           h.postDelayed(r, 25_000)
         }

         private fun clearWd() {
           wdTask?.let { h.removeCallbacks(it) }
           wdTask = null
           wdBar.visibility = View.GONE
         }

         /* ================================ القوائم ================================ */

         private fun sourceList(): List<Channel> = when (listMode) {
           "fav" -> favs
           "recent" -> recents
           "mine" -> myGroupChannels(curGroup)
           "all" -> Catalog.live
           else -> Catalog.live.filter { it.group == curGroup }
         }

         private fun myGroupChannels(name: String): List<Channel> {
           val urls = mine[name] ?: return emptyList()
           return Catalog.live.filter { urls.contains(it.url) }
         }

         private fun buildGroups() {
           groups.clear()
           groups.add(Group().apply { name = "ALL"; special = "all"; count = Catalog.live.size })
           groups.add(Group().apply { name = "★ المفضلة"; special = "fav"; count = favs.size })
           groups.add(Group().apply { name = "🕐 شوهدت مؤخرًا"; special = "recent"; count = recents.size })
           for (k in mine.keys) groups.add(Group().apply { name = k; special = "mine"; count = (mine[k]?.size ?: 0) })
           val byName = LinkedHashMap<String, Int>()
           for (c in Catalog.live) byName[c.group] = (byName[c.group] ?: 0) + 1
           val cats = Catalog.liveCats.filter { it.name.isNotBlank() && it.name != "عام" }
           if (cats.isNotEmpty()) {
             for (g in cats.sortedBy { it.name.lowercase() }) byName[g.name] = (byName[g.name] ?: 0)
           }
           for ((k, v) in byName.toSortedMap(compareBy(String.CASE_INSENSITIVE_ORDER) { it })) {
             if (k == "ALL" || mine.containsKey(k)) continue
             groups.add(Group().apply { name = k; special = if (locked.contains(k)) "lock" else "group"; count = v })
           }
           groups.add(Group().apply { name = "+ إضافة مجموعة"; special = "add"; count = 0 })
           groups.add(Group().apply { name = "🔒 الأقفال"; special = "locks"; count = locked.size })
         }

         private fun selectGroup(g: Group) {
           curGroup = g.name
           listMode = when (g.special) {
             "all" -> "all"
             "fav" -> "fav"
             "recent" -> "recent"
             "mine" -> "mine"
             "add" -> { addGroupDialog(); return }
             "lock" -> { unlockDialog(g); return }
             "locks" -> { locksDialog(); return }
             else -> "group"
           }
           tvGroupTitle.text = g.name
           refresh()
           grpAdapter.notifyDataSetChanged()
           // (8.34) الفوكس ينتقل إلى قائمة القنوات — وإلا يبقى ضايعًا على الأقسام
           rvChannels.postDelayed({ try { rvChannels.requestFocus() } catch (t: Throwable) {} }, 90)
         }

         private fun refresh() {
           val q = etSearch.text.toString().trim()
           shown.clear()
           val base = sourceList()
           if (q.isEmpty()) {
             shown.addAll(base)
           } else {
             val needle = q.lowercase()
             for (c in base) {
               if (c.name.lowercase().contains(needle) || c.group.lowercase().contains(needle)) shown.add(c)
               if (shown.size >= 900) break
             }
           }
           tvChanCount.text = if (q.isEmpty()) "${shown.size} عنصر" else "نتائج البحث: ${shown.size}"
           chanAdapter.notifyDataSetChanged()
           if (shown.isNotEmpty()) rvChannels.scrollToPosition(indexOf(cur).coerceAtLeast(0))
         }

         private fun indexOf(c: Channel?): Int {
           if (c == null) return 0
           return shown.indexOfFirst { it.url == c.url }
         }

         private fun addGroupDialog() {
           val c = cur
           if (c == null) { toast("اختر قناة أولًا ثم أضفها لمجموعة"); return }
           inputDialog("مجموعة جديدة", "اسم المجموعة", null, v1 = "", msg = "ستُضاف القناة «${c.name}» إليها") { name, _ ->
             if (name.isBlank()) { toast("اسم فارغ"); return@inputDialog }
             val list = mine.getOrPut(name) { ArrayList() }
             if (!list.contains(c.url)) list.add(c.url)
             saveMine()
             buildGroups()
             toast("أنشأت مجموعة «$name»")
           }
         }

         private fun unlockDialog(g: Group) {
           inputDialog("مجموعة مقفلة", "رمز الفتح", null, msg = "الرمز الافتراضي 0000 — يمكن تغييره من الأدوات") { code, _ ->
             if (code == sp.s("lock_code", "0000")) {
               if (!locked.contains(g.name)) locked.add(g.name)
               saveMine()
               toast("المجموعة «${g.name}» مقفلة — اضغط عليها لفتحها")
               buildGroups(); refresh()
             } else toast("رمز خاطئ")
           }
         }

         private fun locksDialog() {
           if (locked.isEmpty()) { toast("لا مجموعات مقفلة"); return }
           val names = locked.toList()
           pickDialog("المجموعات المقفلة", names) { i ->
             val n = names[i]
             if (locked.remove(n)) { saveMine(); buildGroups(); refresh(); toast("فُتح القفل: $n") }
           }
         }

         private fun saveMine() {
           val o = JSONObject()
           for ((k, v) in mine) o.put(k, JSONArray(v))
           sp.put("mygroups", o.toString())
           sp.put("locked", JSONArray(locked).toString())
         }

         private fun loadMine() {
           mine.clear(); locked.clear()
           try {
             val o = JSONObject(sp.s("mygroups", "{}"))
             for (k in o.keys()) {
               val a = o.getJSONArray(k)
               val list = ArrayList<String>()
               for (i in 0 until a.length()) list.add(a.getString(i))
               mine[k] = list
             }
             val l = JSONArray(sp.s("locked", "[]"))
             for (i in 0 until l.length()) locked.add(l.getString(i))
           } catch (t: Throwable) {}
         }

         private fun toggleFav() {
           val c = cur ?: return
           val i = favs.indexOfFirst { it.url == c.url }
           if (i >= 0) { favs.removeAt(i); toast("أُزيلت من المفضلة") } else { favs.add(0, c); toast("أُضيفت للمفضلة ★") }
           sp.put("favs", encodeChans(favs))
           grpAdapter.notifyDataSetChanged()
           if (listMode == "fav") refresh()
         }

         private fun pushRecent(c: Channel) {
           recents.removeAll { it.url == c.url }
           recents.add(0, c)
           while (recents.size > 40) recents.removeAt(recents.size - 1)
           sp.put("recents", encodeChans(recents))
         }

         private fun next(auto: Boolean) {
           val list = pl()
           if (list.isEmpty()) return
           val fromList = plist.isNotEmpty()
           val i = if (fromList) plIndex() else indexOf(cur)
           var n = i + 1
           if (n >= list.size) {
             if (!auto) { toast(if (fromList) "هذه آخر حلقة" else "هذه آخر قناة"); return }
             n = 0
           }
           play(list[n], full)
         }

         private fun prev() {
           val list = pl()
           if (list.isEmpty()) return
           val i = if (plist.isNotEmpty()) plIndex() else indexOf(cur)
           var n = i - 1
           if (n < 0) n = list.size - 1
           play(list[n], full)
         }

         /* ================================ EPG / القبض ================================ */

         private fun fetchEpg(c: Channel) {
           val p = Catalog.profile ?: run { infoDesc.text = descOf(c); return }
           if (p.type != "xtream" || c.kind != "live" || c.id.isBlank()) { infoDesc.text = descOf(c); return }
           val x = Xtream(p.url, p.user, p.pass)
           io({ Http.read(x.urlEpgShort(c.id), timeoutMs = 9000, retries = 0) }) { body, _ ->
             if (body.isNullOrBlank()) { infoDesc.text = descOf(c); return@io }
             val sb = StringBuilder()
             try {
               val o = JSONObject(body)
               val list = o.optJSONArray("epg_listings") ?: o.optJSONObject("epg_listings")?.optJSONArray("list")
               if (list != null) {
                 for (i in 0 until Math.min(2, list.length())) {
                   val o = list.getJSONObject(i)
                   sb.append(if (i == 0) "الآن: " else "التالي: ")
                     .append(o.optString("title")).append("  (").append(o.optString("start_date").take(16)).append(")\n")
                 }
               }
             } catch (t: Throwable) {}
             infoDesc.text = if (sb.isEmpty()) descOf(c) else sb.toString().trim()
           }
         }

         private fun descOf(c: Channel?): String {
           if (c == null) return ""
           val extra = c.extra.ifBlank { "" }
           val parts = ArrayList<String>()
           if (c.epgId.isNotBlank()) parts.add("EPG: " + c.epgId)
           if (extra.isNotBlank()) parts.add(extra.take(220))
           if (c.id.isNotBlank()) parts.add("ID: " + c.id)
           parts.add(if (c.logo.isNotBlank()) "شعار خارجي" else "بدون شعار")
           return parts.joinToString("\n")
         }

         /** قبض / timeshift: Xtream عبر timeshift.php، MAC عبر create_link بـ timeshift، وM3U لو كان في الرابط. */
         private fun catchup() {
           val c = cur ?: return
           val p = Catalog.profile
           if (p == null) { toast("أضف مصدرًا أولًا"); return }
           val u = c.url.ifBlank { c.alt }
           if (u.isBlank()) { toast("لا يوجد رابط للقبض"); return }
           val opts = arrayOf("آخر ساعة", "آخر 3 ساعات", "آخر 6 ساعات", "آخر 12 ساعة", "إغلاق")
           androidx.appcompat.app.AlertDialog.Builder(this)
             .setTitle("القبض على «" + c.name + "»")
             .setItems(opts) { _, w ->
               if (w >= 4) return@setItems
               val hours = intArrayOf(1, 3, 6, 12)[w]
               when (p.type) {
                 "xtream" -> {
                   val x = Xtream(p.url, p.user, p.pass)
                   val url = x.base + "/streaming/timeshift.php?username=" + Uri.encode(p.user) +
                     "&password=" + Uri.encode(p.pass) + "&stream=" + c.id + "&start=-" + (hours * 60) + "&stop="
                   startCatchup(url, hours, c.name)
                 }
                 "mac" -> {
                   busy(true, "طلب timeshift من البوابة…")
                   Loader.macTimeshift(p, u, hours) { tu ->
                     busy(false, "")
                     if (tu.startsWith("http")) startCatchup(tu, hours, c.name)
                     else toast("البوابة لا تدعم القبض لهذا الباقة")
                   }
                 }
                 else -> {
                   if (u.contains("catchup") || u.contains("timeshift")) {
                     val sep = if (u.contains("?")) "&" else "?"
                     val head = u.replace("{{TIMESHIFT}}", "").replace("[", "%5B").replace("]", "%5D")
                       .let { if (it.endsWith("?") || it.endsWith("&")) it.dropLast(1) else it }
                     startCatchup(head + sep + "start=-" + (hours * 60) + "&stop=", hours, c.name)
                   } else toast("هذه القائمة لا تحمل رابط قبض")
                 }
               }
             }
             .show()
         }

         private fun startCatchup(url: String, hours: Int, name: String) {
           if (!url.startsWith("http") && !url.startsWith("rtsp")) { toast("رابط القبض غير صالح"); return }
           val pl = player ?: return
           infoDesc.text = "القبض: آخر $hours ساعة"
           pl.stop()
           pl.setMediaItem(
             MediaItem.Builder().setUri(url)
               .setMediaMetadata(MediaMetadata.Builder().setTitle(name + " — قبض").build()).build()
           )
           pl.prepare()
           pl.playWhenReady = true
           pv.player = pl
           armWd()
           toast("تشغيل القبض — آخر $hours ساعة")
         }

