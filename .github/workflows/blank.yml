           val src = if (kind == "movie") Catalog.movieCats else Catalog.seriesCats
           if (src.isNotEmpty()) cats.addAll(src)
           else cats.addAll(all.groupBy { it.group }.map { Group().apply { name = it.key; count = it.value.size } }.sortedBy { it.name.lowercase() })
           val byCat = HashMap<String, Int>()
           for (c in all) if (c.catId.isNotBlank()) byCat[c.catId] = (byCat[c.catId] ?: 0) + 1
           for (g in cats) if (g.catId.isNotBlank() && byCat.containsKey(g.catId)) g.count = byCat[g.catId]!!
           cats.add(0, Group().apply { name = "ALL"; special = "all"; count = all.size })
           if (macLocal && all.isNotEmpty()) cats.add(Group().apply { name = "★ حديث"; special = "recent"; count = all.size })
           if (!inEpisodes) rvCats.adapter = CatAdapter()
           selCat = cats.firstOrNull { it.special == "all" }
           applyFilter()
         }

         private fun applyFilter() {
           val q = etSearch.text.toString().trim().lowercase()
           items.clear()
           val base: List<Channel> = if (inEpisodes) all else {
             val c = selCat
             when {
               c == null || c.special == "all" || c.name == "ALL" -> base0()
               c.special == "recent" -> base0().sortedByDescending { it.num }
               c.catId.isNotBlank() -> base0().filter { it.catId == c.catId }
               else -> base0().filter { it.group == c.name }
             }
           }
           for (ch in base) {
             if (q.isEmpty() || ch.name.lowercase().contains(q)) items.add(ch)
             if (items.size >= 1200) break
           }
           adapter.notifyDataSetChanged()
           title.text = (if (inEpisodes) seriesName else (if (kind == "movie") "أفلام" else "مسلسلات")) +
             (if (selCat != null && selCat!!.special != "all") " • " + selCat!!.name else "") +
             " (${items.size})"
         }

         /** تحديث خفيف أثناء الجلب الخلفي: يحدّث العدّادات والعناصر مع الحفاظ على القسم المختار. */
         private fun softRefresh() {
           if (inEpisodes) return
           val keep = selCat
           all.clear()
           all.addAll(if (kind == "movie") Catalog.movie else Catalog.series)
           val byCat = HashMap<String, Int>()
           for (c in all) if (c.catId.isNotBlank()) byCat[c.catId] = (byCat[c.catId] ?: 0) + 1
           for (g in cats) if (g.catId.isNotBlank()) g.count = byCat[g.catId] ?: 0
           if (cats.isNotEmpty()) cats[0].count = all.size
           selCat = keep
           applyFilter()
           try { rvCats.adapter?.notifyDataSetChanged() } catch (t: Throwable) {}
         }

         /**
         * (8.24) ذاكرة أقسام **دائمة** (تُحفظ على الجهاز):
         *  - أول دخول للقسم: يُجلب من السيرفر (شاشة تحميل أنيقة) ثم يُخزّن.
         *  - الدخول الثاني (حتى بعد إغلاق التطبيق): يُعرض فورًا بلا شاشة تحميل ولا إنترنت.
         */
         private fun catCacheKey(catId: String): String = "cc_" + kind + "_" + catId

         /** يُرجع عدد عناصر القسم إن وُجدت في الذاكرة الدائمة (0 = لا شيء محفوظ). */
         private fun catCacheLoad(g: Group): Int {
           return try {
             if (g.catId.isBlank()) return 0
             val raw = sp.s(catCacheKey(g.catId))
             if (raw.isBlank()) return 0
             val out = ArrayList<Channel>()
             decodeChans(raw, out)
             if (out.isEmpty()) return 0
             val cat = if (kind == "movie") Catalog.movie else Catalog.series
             val keep = ArrayList<Channel>()
             for (c in cat) if (c.catId != g.catId) keep.add(c)
             cat.clear(); cat.addAll(keep); cat.addAll(out)
             for (i in cat.indices) cat[i].num = i + 1
             g.count = out.size
             Catalog.fillSet(kind, g.catId, 2)                 // نعلّمها «تمّت» ⇒ لا جلب بعد اليوم
             catCachedAt = System.currentTimeMillis()
             Crash.note("CAT-CACHE", "من الذاكرة: " + g.name + " = " + out.size)
             out.size
           } catch (t: Throwable) { Crash.log(t); 0 }
         }

         /** يحفظ عناصر القسم كاملة في الذاكرة الدائمة (نتجاهل الأقسام الضخمة جدًا). */
         private fun catCacheSave(g: Group, list: List<Channel>) {
           try {
             if (g.catId.isBlank() || list.isEmpty()) return
             if (list.size > 5000) return                            // حماية من الحجم الكبير
             sp.put(catCacheKey(g.catId), encodeChans(list))
             Crash.note("CAT-SAVE", g.name + " = " + list.size)
           } catch (t: Throwable) { Crash.log(t) }
         }

         /** لو القسم فاضي في الذاكرة (بوابة MAC): نجلبه من السيرفر فورًا ونضيفه محليًا. */
         private fun maybeFillCat(g: Group) {
           val p = Catalog.profile
           if (!macLocal || inEpisodes || p?.type != "mac") return
           if (g.catId.isBlank() || g.special == "all" || g.special == "recent") return
           val cat = if (kind == "movie") Catalog.movie else Catalog.series
           // القسم يُجلب كاملًا مرة واحدة (كل الصفحات)؛ ولا نعيد جلبه إذا كان مكتملًا أو جاريًا
           if (Catalog.fillDone(kind, g.catId) || Catalog.fillBusy(kind, g.catId)) return
           // (8.24) ذاكرة دائمة: لو القسم محفوظ ⇒ يظهر فورًا بلا شاشة تحميل ولا إنترنت
           if (catCacheLoad(g) > 0) {
             all.clear(); all.addAll(cat)
             applyFilter()
             try { rvCats.adapter?.notifyDataSetChanged() } catch (t: Throwable) {}
             return
           }
           showBusy(true, "جلب «" + g.name + "» بكل صفحاته…")
           val out = ArrayList<Channel>()
           Loader.macFillCat(this, p, kind, g.catId, g.name, out) { n ->
             try {
               showBusy(false, "")
               if (n == 0) { toast("لا عناصر في هذا القسم عند السيرفر"); return@macFillCat }
               val keep = ArrayList<Channel>()
               for (c in cat) if (c.catId != g.catId) keep.add(c)
               cat.clear(); cat.addAll(keep); cat.addAll(out)
               for (i in cat.indices) cat[i].num = i + 1
               g.count = n
               if (!inEpisodes) {
                 all.clear(); all.addAll(cat)
                 applyFilter()
                 rvCats.adapter = CatAdapter()
               }
               catCacheSave(g, out)                     // (8.24) نحفظه ⇒ الدخول القادم فوري
               Catalog.fillSet(kind, g.catId, 2)
               toast("+ " + n + " عنصر في «" + g.name + "»")
             } catch (t: Throwable) {
               try { showBusy(false, "") } catch (e: Throwable) {}
               Crash.log(t)
               toast("تعذر الفتح: " + (t.message ?: t.javaClass.simpleName))
             }
           }
         }

         private fun base0(): List<Channel> = all

         /**
         * (8.24) شاشة تحميل أنيقة وسريعة:
         *  - تظهر بتلاشٍ ناعم (ما تظهرش وتختفي في لمحة)،
         *  - لا تختفي قبل 400 مللي حتى لا تومض،
         *  - نص ثانوي «لحظة…» تحت العنوان.
         * ملاحظة: الرجوع من المشغّل لا يُظهرها إطلاقًا (البيانات محفوظة في الذاكرة).
         */
         private fun showBusy(on: Boolean, t: String) {
           try {
             if (on) {
               busyPending?.let { busy.removeCallbacks(it) }
               busyTxt.text = "جاري تحميل"                                  // (8.26) نص واحد أنيق
               try { busy.findViewById<TextView>(R.id.gridBusySub)?.visibility = View.GONE } catch (e: Throwable) {}
               if (busy.visibility != View.VISIBLE) {
                 busy.visibility = View.VISIBLE
                 busy.alpha = 0f
                 busy.scaleX = 0.92f; busy.scaleY = 0.92f
                 busy.animate().alpha(1f).scaleX(1f).scaleY(1f).setDuration(180).start()
                 busyShownAt = System.currentTimeMillis()
               }
             } else {
               val showed = System.currentTimeMillis() - busyShownAt
               val wait = if (showed < 400) 400 - showed else 0L
               busyPending?.let { busy.removeCallbacks(it) }
               val r = Runnable {
                 try { busy.animate().alpha(0f).setDuration(150)
                   .withEndAction { try { busy.visibility = View.GONE } catch (e: Throwable) {} }.start() } catch (e: Throwable) {}
               }
               busyPending = r
               busy.postDelayed(r, wait)
             }
           } catch (e: Throwable) { Crash.log(e) }
         }

         private fun open(c: Channel) {
           val p = Catalog.profile
           if (lvl == 0 && sectionTitle.isBlank()) sectionTitle = title.text.toString()
           if (kind == "series" && p?.type == "mac") {
             if (c.kind == "episode") { playNow(c); return }
             if (c.kind == "season" && c.mid.isNotBlank()) {
               seasonCh = c
               if (lvl == 0) { seriesCh = c; if (sectionTitle.isBlank()) sectionTitle = title.text.toString() }
               showBusy(true, "تحميل حلقات الموسم…")
               val out = ArrayList<Channel>()
               Loader.macSeason(p, c.mid, c.sid, out) { n ->
                 try {
                   showBusy(false, "")
                   if (n == 0) {
                     // تشخيص: نكتب آخر الطلبات في سجل الأعطال حتى نعرف سبب الرفض بالضبط
                     val info = try { StalkerSession.get(p).lastEpsInfo } catch (t: Throwable) { "" }
                     Crash.note("EPS-FAIL", "series=${c.mid} season=${c.sid} :: " + info)
                     toast("البوابة ما رجعتش حلقات — راجع «سجل الأعطال» من الإعدادات")
                     return@macSeason
                   }
                   if (saved.isEmpty() && all.none { it.stype == "season" }) { saved.addAll(all) }
                   seasonsList.clear(); seasonsList.addAll(all)      // المستوى الحالي = مواسم
                   all.clear(); all.addAll(out)
                   epsList.clear(); epsList.addAll(out)
                   lvl = 2
                   inEpisodes = true; seriesName = c.name + " • " + c.group
                   curSeriesMid = c.mid
                   markOn(null)
                   applyFilter(); rvGrid.scrollToPosition(0)
                   toast("حُمّلت ${out.size} حلقة")
                 } catch (t: Throwable) {
                   try { showBusy(false, "") } catch (e: Throwable) {}
                   Crash.log(t)
                   toast("تعذر الفتح: " + (t.message ?: t.javaClass.simpleName))
                 }
               }
               return
             }
             if (c.id.isNotBlank() || c.mid.isNotBlank()) {
               if (c.mid.isBlank()) c.mid = c.id          // بعض البوابات ترسل series_id في id فقط
               if (lvl == 0) { seriesCh = c; if (sectionTitle.isBlank()) sectionTitle = title.text.toString() }
               showBusy(true, "تحميل الحلقات…")
               val out = ArrayList<Channel>()
               Loader.macSeries(p, c.mid, c.name, c.group, c.logo, out) { n ->
                 try {
                   showBusy(false, "")
                   if (n == 0) {
                     // مسار احتياطي: نجيب الحلقات مباشرة من الموسم 1
                     showBusy(true, "مسار احتياطي: جلب الحلقات…")
                     val out2 = ArrayList<Channel>()
                     Loader.macSeason(p, c.mid, "1", out2) { n2 ->
                       showBusy(false, "")
                       if (n2 > 0) {
                         if (saved.isEmpty() && all.none { it.stype == "season" }) saved.addAll(all)
                         all.clear(); all.addAll(out2)
                         inEpisodes = true; seriesName = c.name
                         curSeriesMid = c.mid
                         applyFilter(); rvGrid.scrollToPosition(0)
                         toast("حُمّلت $n2 حلقة (مسار احتياطي)")
                       } else {
                         toast("البوابة لم ترجع حلقات: " + Catalog.status.take(60))
                         playNow(c)
                       }
                     }
                     return@macSeries
                   }
                   if (saved.isEmpty() && all.none { it.stype == "season" }) { saved.addAll(all) }
                   all.clear(); all.addAll(out)
                   seasonsList.clear(); seasonsList.addAll(out)     // مستوى المواسم (للرجوع الهرمي)
                   lvl = 1
                   inEpisodes = true; seriesName = c.name
                   curSeriesMid = c.mid
                   title.text = c.name
                   if (out.any { it.kind == "season" }) {
                     // مواسم فقط: نبدأ فورًا (في الخلفية) جلب حلقات كل موسم مثل كود Java
                     seriesName = c.name
                     toast("اختر الموسم لتحميل حلقاته (${out.size} موسم)")
                     Loader.prefetchEps(p, out) { s, nn ->
                       if (!s.name.contains("حلقة")) s.name = s.name + " • $nn حلقة"
                       try { adapter.notifyDataSetChanged() } catch (t: Throwable) {}
                     }
                   } else {
                     toast("حُمّلت ${out.size} حلقة")
                   }
                   applyFilter(); rvGrid.scrollToPosition(0)
                 } catch (t: Throwable) {
                   try { showBusy(false, "") } catch (e: Throwable) {}
                   Crash.log(t)
                   toast("تعذر الفتح: " + (t.message ?: t.javaClass.simpleName))
                 }
               }
               return
             }
           }
           if (kind == "series" && p?.type == "xtream" && !inEpisodes && c.id.isNotBlank()) {
             showBusy(true, "تحميل الحلقات…")
             val out = ArrayList<Channel>()
             Loader.xtreamEpisodes(p, c.id, out) { n ->
               try {
                 showBusy(false, "")
                 if (n == 0) { toast("لا توجد حلقات — سيتم تشغيل الرابط المباشر"); playNow(c); return@xtreamEpisodes }
                 if (saved.isEmpty() && all.none { it.stype == "season" }) { saved.addAll(all) }
                 all.clear(); all.addAll(out)
                 inEpisodes = true; seriesName = c.name
                 curSeriesMid = c.id
                 applyFilter(); rvGrid.scrollToPosition(0)
               } catch (t: Throwable) {
                 try { showBusy(false, "") } catch (e: Throwable) {}
                 Crash.log(t)
                 toast("تعذر الفتح: " + (t.message ?: t.javaClass.simpleName))
               }
             }
             return
           }
           if (c.url.isBlank() && c.alt.isBlank()) {
             val p2 = Catalog.profile
             if (p2?.type == "mac" && (c.id.isNotBlank() || c.mid.isNotBlank())) {
               if (c.url.isBlank()) c.url = Stalker.localCmd(c.id.ifBlank { c.mid })   // أمر MAG من المعرّف
               playNow(c); return
             }
             toast("لا يوجد رابط لهذا العنصر"); return
           }
           playNow(c)
         }

         /** غلاف آمن لضغط البطاقة: أي خطأ يظهر كتنبيه ولا يُغلق التطبيق. */
         private fun openSafe(c: Channel) {
           try { open(c) } catch (t: Throwable) {
             try { showBusy(false, "") } catch (e: Throwable) {}
             Crash.log(t)
             toast("تعذر الفتح: " + (t.message ?: t.javaClass.simpleName))
           }
         }

         private fun playNow(c: Channel) {
           val i = Intent(this, LiveActivity::class.java)
           i.putExtra("play", if (c.url.isNotBlank()) c.url else c.alt)
           i.putExtra("cid", c.id)
           i.putExtra("title", c.name)
           i.putExtra("kind", c.kind.ifBlank { if (kind == "movie") "movie" else "series" })
           i.putExtra("chan", c.toJson().toString())
           // v8.16: الرجوع من المشغل يرجع **نفس القسم ونفس العنصر**، والقائمة تُمكّن «التالي/السابق» داخل الحلقات
           i.putExtra("from", "grid")
           try {
             val list = ArrayList<Channel>()
             val idx = items.indexOfFirst { sameItem(it, c) }
             val from = if (idx > 120) idx - 120 else 0
             val to = Math.min(items.size, from + 240)
             for (k in from until to) list.add(items[k])
             if (list.isNotEmpty()) {
               i.putExtra("plist", encodeChans(list))
               i.putExtra("ppos", idx - from)
             }
           } catch (t: Throwable) { Crash.log(t) }
           lastPlayedId = c.id
           lastPlayedUrl = if (c.url.isNotBlank()) c.url else c.alt
           lastName = c.name
           pendingScroll = true
           saveReturn(c)
           // (8.26) نافذة مشغّل مستقلة: الرجوع يرجع لنفس القائمة (الفلم/الحلقة) ولا يمرّ على شاشة القنوات
           i.addFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP)
           try { startActivity(i) } catch (t: Throwable) { toast("تعذّر فتح المشغّل: " + (t.message ?: "")) }
         }

         /** يحفظ «مكان الرجوع»: القسم + المستوى + العنصر + موضع التمرير (قبل فتح المشغل). */
         private fun saveReturn(c: Channel) = saveStateAt(c, lvl)

         /**
         * يحفظ الحالة كاملة (المستوى الحالي + الموسم/الحلقات + الفوكس) — تُستعاد عند الرجوع من المشغل
         * حتى بعد إعادة إنشاء الشاشة. played=null يعني «حافظ على الفوكس الحالي».
         */
         private fun saveStateAt(played: Channel?, lv: Int) {
           try {
             if (played != null) {
               lastPlayedId = played.id
               lastPlayedUrl = if (played.url.isNotBlank()) played.url else played.alt
               lastName = played.name
             }
             sp.put("ret_kind", kind)
             sp.put("ret_lvl", lv.toString())
             sp.put("ret_level", if (lv > 0) "1" else "0")
             sp.put("ret_series", seriesName)
             sp.put("ret_mid", curSeriesMid)
             sp.put("ret_section", sectionTitle)
             sp.put("ret_cat", selCat?.name ?: "")
             sp.put("ret_played_url", lastPlayedUrl)
             sp.put("ret_played_id", lastPlayedId)
             sp.put("ret_played_name", lastName)
             sp.put("ret_idx", items.indexOfFirst { sameItem(it, played ?: lastPlayedIdOrEmpty()) }.toString())
             sp.put("ret_scroll", firstVisible().toString())
             val mark = played ?: lastPlayedIdOrEmpty()
             sp.put("ret_list_idx", if (lv == 0) items.indexOfFirst { sameItem(it, mark) }.toString() else idxOf(saved, seriesCh).toString())
             sp.put("ret_series_idx", idxOf(saved, seriesCh).toString())
             sp.put("ret_season_idx", idxOf(seasonsList, seasonCh).toString())
             sp.put("ret_season_id", seasonCh?.id ?: "")
             sp.put("ret_series_id", seriesCh?.id ?: "")
             sp.put("ret_seasons", if (lv >= 1) encodeChans(seasonsList) else "")
             sp.put("ret_eps", if (lv >= 2) encodeChans(epsList) else "")
             sp.put("ret_eps_idx", epsList.indexOfFirst { sameItem(it, played ?: lastPlayedIdOrEmpty()) }.toString())
             sp.put("ret_items", if (lv > 0) encodeChans(items) else "")
             sp.put("ret_saved", if (saved.isEmpty()) "" else encodeChans(saved))   // قائمة القسم الأصلية
             sp.put("ret_pending", "1")
           } catch (t: Throwable) { Crash.log(t) }
         }

         private fun lastPlayedIdOrEmpty(): Channel = Channel().apply { id = lastPlayedId; name = lastName; url = lastPlayedUrl }

         private fun idxOf(list: List<Channel>, c: Channel?): Int {
           if (c == null || list.isEmpty()) return -1
           return list.indexOfFirst { sameItem(it, c) }
         }

         /** موقع المسلسل داخل قائمة القسم (نستعمله لرجوع «موسم → مسلسل» بعد إعادة إنشاء الشاشة). */
         private fun allSnapshotIdx(c: Channel): Int =
           try { saved.indexOfFirst { sameItem(it, c) } } catch (t: Throwable) { -1 }

         private fun firstVisible(): Int = try {
           (rvGrid.layoutManager as? LinearLayoutManager)?.findFirstVisibleItemPosition() ?: 0
         } catch (t: Throwable) { 0 }

         /** يعيد القائمة الأصلية للقسم (من الذاكرة أو من المحفوظ) — بلا اعتماد على إعادة البناء. */
         private fun ensureSavedList() {
           if (saved.isNotEmpty()) return
           val t = sp.s("ret_saved")
           if (t.isNotBlank()) {
             decodeChans(t, saved)
             if (saved.isNotEmpty()) return
           }
           build()
           val keep = ArrayList(all)
           if (keep.isNotEmpty() && keep.none { it.stype == "season" }) saved.addAll(keep)
         }

         /** يستعيد «مكان الرجوع» — نفس القسم ونفس المستوى ونفس العنصر (يشتغل حتى بعد إعادة إنشاء الشاشة). */
         private fun restoreReturn() {
           // (8.32) لا نثق في «النوع المحفوظ» إذا خالف النوع المطلوب — كان فلم يرجع لقائمة المسلسلات
           val savedK = sp.s("ret_kind")
           if ((savedK == "movie" || savedK == "series") && savedK != kind) {
             Crash.note("RET-KIND", "محفوظ=" + savedK + " مطلوب=" + kind + " ⇒ نفتح المطلوب")
             sp.put("ret_eps", ""); sp.put("ret_seasons", ""); sp.put("ret_items", ""); sp.put("ret_pending", "0")
           } else if (savedK.isNotBlank()) kind = savedK
           macLocal = Catalog.loaded && Catalog.profile?.type == "mac"
           lastName = sp.s("ret_played_name")
           lastPlayedId = sp.s("ret_played_id")
           lastPlayedUrl = sp.s("ret_played_url")
           val lv = sp.s("ret_lvl", if (sp.s("ret_level") == "1") "2" else "0").toIntOrNull() ?: 0
           val idx = sp.s("ret_idx").toIntOrNull() ?: -1
           val section = sp.s("ret_section")
           if (section.isNotBlank()) sectionTitle = section

           // (أ) الحلقات: نعيد المستويات الثلاثة كما كانت
           if (lv >= 2) {
             val eps = ArrayList<Channel>()
             decodeChans(sp.s("ret_eps"), eps)
             val seasons = ArrayList<Channel>()
             decodeChans(sp.s("ret_seasons"), seasons)
             if (eps.isNotEmpty()) {
               ensureSavedList()                           // قائمة القسم (تحت الموسم) للرجوع إليها لاحقًا
               seasonsList.clear(); seasonsList.addAll(seasons)
               epsList.clear(); epsList.addAll(eps)
               lvl = 2
               inEpisodes = true
               seriesName = sp.s("ret_series")
               curSeriesMid = sp.s("ret_mid")
               all.clear(); all.addAll(eps)
               cats.clear()
               cats.add(Group().apply { name = "ALL"; special = "all"; count = all.size })
               title.text = seriesName.ifBlank { sectionTitle }
               applyFilter()
               rvCats.adapter = CatAdapter()
               val pos = if (idx in items.indices) idx else (sp.s("ret_eps_idx").toIntOrNull() ?: 0)
               try { rvGrid.scrollToPosition(pos.coerceAtLeast(0)) } catch (t: Throwable) {}
               adapter.notifyDataSetChanged()
               return
             }
           }
           // (ب) المواسم: نرجع لمستوى المواسم والفوكس على الموسم
           if (lv >= 1) {
             val seasons = ArrayList<Channel>()
             decodeChans(sp.s("ret_seasons"), seasons)
             if (seasons.isNotEmpty()) {
               ensureSavedList()
               seasonsList.clear(); seasonsList.addAll(seasons)
               lvl = 1
               inEpisodes = true
               seriesName = sp.s("ret_series")
               curSeriesMid = sp.s("ret_mid")
               all.clear(); all.addAll(seasons)
               cats.clear()
               cats.add(Group().apply { name = "ALL"; special = "all"; count = all.size })
               title.text = seriesName.ifBlank { sectionTitle }
               applyFilter()
               rvCats.adapter = CatAdapter()
               val pos = sp.s("ret_idx").toIntOrNull() ?: -1
               try { rvGrid.scrollToPosition((if (pos in items.indices) pos else 0).coerceAtLeast(0)) } catch (t: Throwable) {}
               adapter.notifyDataSetChanged()
               return
             }
           }
           // (ج) القائمة (أفلام/مسلسلات)
           lvl = 0
           inEpisodes = false
           seriesName = ""
           build()                                        // قائمة الأفلام/المسلسلات من الكتالوج
           val catName = sp.s("ret_cat")
           if (catName.isNotBlank()) {
             val g = cats.firstOrNull { it.name == catName }
             if (g != null) { selCat = g; applyFilter() }
           }
           val pos = if (idx in items.indices) idx else (sp.s("ret_scroll").toIntOrNull() ?: 0)
           try { rvGrid.scrollToPosition(pos.coerceAtLeast(0)) } catch (t: Throwable) {}
           adapter.notifyDataSetChanged()
         }

         /** يضع الفوكس (▶) على عنصر — يُستعمل عند الرجوع مستوى لأعلى. */
         private fun markOn(c: Channel?) {
           if (c == null) return
           lastPlayedId = c.id
           lastPlayedUrl = if (c.url.isNotBlank()) c.url else c.alt
           lastName = c.name
         }

         /** الرجوع مستوى لأعلى داخل نفس الشاشة: حلقة → مواسم (فوكس على الموسم) → قائمة (فوكس على المسلسل). */
         private fun upLevel(): Boolean {
           if (lvl >= 2 && seasonsList.isNotEmpty()) {
             lvl = 1
             inEpisodes = true
             all.clear(); all.addAll(seasonsList)
             seriesName = (seriesCh?.name ?: seriesName) + (seriesCh?.group?.let { " • " + it } ?: "")
             title.text = if (seriesName.isNotBlank()) seriesName.substringBefore(" • ") else sectionTitle
             markOn(seasonCh)
             applyFilter(); rvCats.adapter = CatAdapter()
             saveStateAt(null, 1)
             val pos = items.indexOfFirst {
               (lastPlayedUrl.isNotBlank() && it.url == lastPlayedUrl) ||
               (lastPlayedId.isNotBlank() && it.id == lastPlayedId && it.name == lastName)
             }
             try { rvGrid.post { scrollToLast() } } catch (t: Throwable) {}
             if (pos >= 0) { rvGrid.scrollToPosition(pos); focusOn(pos) }
             toast("المواسم (" + items.size + ")")
             return true
           }
           if (lvl >= 1 && saved.isNotEmpty() && saved.none { it.stype == "season" }) {
             lvl = 0
             inEpisodes = false
             seriesName = ""
             all.clear(); all.addAll(saved)
             title.text = sectionTitle
             markOn(seriesCh)
             applyFilter(); rvCats.adapter = CatAdapter()
             saveStateAt(null, 0)
             val pos = items.indexOfFirst {
               (lastPlayedUrl.isNotBlank() && it.url == lastPlayedUrl) ||
               (lastPlayedId.isNotBlank() && it.id == lastPlayedId && it.name == lastName)
             }
             try { rvGrid.post { scrollToLast() } } catch (t: Throwable) {}
             if (pos >= 0) { rvGrid.scrollToPosition(pos); focusOn(pos) }
             toast("رجعنا للقسم: " + (if (kind == "movie") "أفلام" else "مسلسلات"))
             return true
           }
           return false
         }

         private fun sameItem(a: Channel, b: Channel): Boolean {
           if (a.url.isNotBlank() && a.url == b.url) return true
           return a.id.isNotBlank() && a.id == b.id && a.name == b.name
         }

         /** يرجّع الشبكة على آخر عنصر شُغّل (نفس الموضع) — يشتغل عند الرجوع من المشغل. */
         private fun scrollToLast() {
           try {
             val i = items.indexOfFirst {
               (lastPlayedUrl.isNotBlank() && it.url == lastPlayedUrl) ||
               (lastPlayedId.isNotBlank() && it.id == lastPlayedId && it.name == lastName)
             }
             if (i >= 0) {
               rvGrid.scrollToPosition(i)
               adapter.notifyDataSetChanged()
             }
           } catch (t: Throwable) { Crash.log(t) }
         }

         private fun back() {
           // رجوع هرمي: حلقات → مواسم → قائمة → خروج
           if (upLevel()) return
           // (8.21) في قائمة الأفلام/المسلسلات: الرجوع يرجّع الفوكس لقسم الأقسام (يمين) قبل الخروج
           try {
             if (lvl == 0 && rvGrid.hasFocus() && rvCats.adapter != null) {
               rvCats.isFocusable = true
               rvCats.descendantFocusability = android.view.ViewGroup.FOCUS_AFTER_DESCENDANTS
               rvCats.post { try { rvCats.requestFocus() } catch (t: Throwable) {} }
               toast("الأقسام — رجوع مرة أخرى للخروج")
               return
             }
           } catch (t: Throwable) { Crash.log(t) }
           if (inEpisodes) {
             inEpisodes = false
             lvl = 0
             seriesName = ""
             all.clear()
             if (saved.isNotEmpty()) { all.addAll(saved); saved.clear() }
             else all.addAll(if (kind == "movie") Catalog.movie else Catalog.series)
             applyFilter()
             rvCats.adapter = CatAdapter()
             return
           }
           finish()
         }

         override fun onResume() {
           super.onResume()
           goImmersive()
           val wantRestore = sp.s("ret_pending") == "1" || intent?.getStringExtra("restore") == "1"
           if (wantRestore) {                        // رجعنا من المشغل: نفس القسم ونفس العنصر
             pendingScroll = false
             tryRestore()                          // v8.24: بلا أي تحميل — القائمة والفوكس فقط
           }
           evRec = Events.register(this) { type, _ ->
             if (type == "catalog") runOnUiThread {
               try { softRefresh() } catch (t: Throwable) { Crash.log(t) }
             }
           }
         }

         /** v8.23: المشغل يرسل أمر «استعادة» مع الإنتنت ⇒ نستعيد المكان مباشرة (لا نعتمد على أي حالة داخلية). */
         override fun onNewIntent(i: Intent?) {
           super.onNewIntent(i)
           intent = i
           if (i?.getStringExtra("kind")?.let { it == "movie" || it == "series" } == true) kind = i.getStringExtra("kind")!!
           if (i?.getStringExtra("restore") == "1") {
             Crash.note("NEWINTENT", "restore=1 kind=" + kind)
             tryRestore()
           }
         }

         /** استعادة مكان الرجوع — تُنادى من كل المسارات (onResume / onNewIntent / onCreate). */
         private fun tryRestore() {
           try {
             Crash.note("RET", "kind=" + sp.s("ret_kind") + " lvl=" + sp.s("ret_lvl") +
               " eps=" + sp.s("ret_eps").length + " seasons=" + sp.s("ret_seasons").length +
               " saved=" + sp.s("ret_saved").length + " played=" + sp.s("ret_played_name"))
             restoreReturn()
             focusGrid()
             val i = items.indexOfFirst {
               (lastPlayedUrl.isNotBlank() && it.url == lastPlayedUrl) ||
               (lastPlayedId.isNotBlank() && it.id == lastPlayedId && it.name == lastName)
             }
             if (i >= 0) { rvGrid.scrollToPosition(i); focusOn(i) }
             sp.put("ret_pending", "0")
             Crash.note("RET-OK", "focus=" + (if (i >= 0) i.toString() else "none") + " kind=" + kind +
               " cat=" + (selCat?.name ?: "-"))
             val lv = sp.s("ret_lvl", "0").toIntOrNull() ?: 0
             if (lv >= 1) toast("رجعت للمكان: " + (if (seriesName.isNotBlank()) seriesName.substringBefore(" • ") else "المسلسل"))
             else toast("رجعت للقسم: " + (if (kind == "movie") "أفلام" else "مسلسلات"))
           } catch (t: Throwable) {
             Crash.log(t)
             Crash.note("RET-FAIL", (t.message ?: t.javaClass.simpleName) + " lvl=" + sp.s("ret_lvl"))
             try { rvGrid.post { scrollToLast() } } catch (e: Throwable) {}
           }
         }

         override fun onPause() {
           Events.unregister(this, evRec); evRec = null
           super.onPause()
         }

         override fun onWindowFocusChanged(hasFocus: Boolean) {
           super.onWindowFocusChanged(hasFocus)
           if (hasFocus) goImmersive()
         }

         /** الريموت: رجوع = للخلف داخل القائمة، MENU = الإعدادات. */
         override fun dispatchKeyEvent(k: KeyEvent): Boolean {
           if (k.keyCode == KeyEvent.KEYCODE_MENU && k.action == KeyEvent.ACTION_UP) {
             try {
               val i = Intent(this, MainActivity::class.java)
               i.addFlags(Intent.FLAG_ACTIVITY_REORDER_TO_FRONT or Intent.FLAG_ACTIVITY_SINGLE_TOP)
               startActivity(i)
             } catch (t: Throwable) {}
             return true
           }
           if (k.keyCode == KeyEvent.KEYCODE_BACK && k.action == KeyEvent.ACTION_UP && inEpisodes) { back(); return true }
           return super.dispatchKeyEvent(k)
         }

         override fun onBackPressed() = back()

         private fun toggleFav(c: Channel) {
           val i = favs.indexOfFirst { it.url == c.url }
           if (i >= 0) { favs.removeAt(i); toast("أُزيلت من المفضلة") } else { favs.add(0, c); toast("أُضيفت للمفضلة ★") }
           sp.put("favs", encodeChans(favs))
           Events.send(this, "reload")
         }

