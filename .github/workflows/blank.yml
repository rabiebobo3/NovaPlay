              }
              findViewById<LinearLayout>(R.id.tile_settings).setOnClickListener {
                AlertDialog.Builder(this).setTitle("الإعدادات").setItems(arrayOf("مسح المفضلة","مسح السجل","حول التطبيق")) { d, i ->
                  when (i) { 0 -> { favs.clear(); saveList("favs", favs); toast("تم مسح المفضلة") }; 1 -> { recents.clear(); saveList("recents", recents); toast("تم مسح السجل") }; 2 -> AlertDialog.Builder(this).setMessage("Rabie Pro 8.1").setPositiveButton("حسنا", null).show() }
                  d.dismiss()
                }.show()
              }
              findViewById<TextView>(R.id.tab_home).setOnClickListener { homeBox.visibility = View.VISIBLE; liveBox.visibility = View.GONE; gridBox.visibility = View.GONE }
              findViewById<TextView>(R.id.tab_live).setOnClickListener { mode = "live"; showLive() }
              findViewById<TextView>(R.id.tab_movies).setOnClickListener { mode = "movie"; showGrid() }
              findViewById<TextView>(R.id.tab_series).setOnClickListener { mode = "series"; showGrid() }
              findViewById<Button>(R.id.btn_search).setOnClickListener { searchEt.requestFocus() }
              findViewById<Button>(R.id.btn_fav).setOnClickListener { toggleFav() }
