        cat <<'NP_F_CLOUD' > app/src/main/java/com/nova/play/Cloud.kt
        package com.nova.play

        import android.content.Context
        import com.google.firebase.FirebaseApp
        import com.google.firebase.database.DataSnapshot
        import com.google.firebase.database.DatabaseError
        import com.google.firebase.database.FirebaseDatabase
        import com.google.firebase.database.ValueEventListener
        import com.google.firebase.messaging.FirebaseMessaging
        import com.google.firebase.messaging.FirebaseMessagingService
        import com.google.firebase.messaging.RemoteMessage
        import org.json.JSONObject

        /** جذر العقد في قاعدة البيانات — غيّره إن أردت. */
        const val ROOT = "nova/play90"

        /**
         * السحابة (Firebase) — تحميل متأخّر ولا يعمل إلا إذا فعّله المستخدم من الإعدادات،
         * حتى لا يتحمّل التلفزيون تهيئة Firebase عند كل إقلاع.
         */
        object Cloud {
            @Volatile private var started = false
            @Volatile private var ok = false
            private var db: FirebaseDatabase? = null

            fun enabled(ctx: Context) = ctx.sp.b("cloud", false)

            fun initAsync(ctx: Context) {
                if (started) return
                if (!ctx.sp.b("cloud", false)) {
                    Diag.d("CLOUD", "متوقفة من الإعدادات")
                    return
                }
                started = true
                Bg.run {
                    try {
                        if (FirebaseApp.getApps(ctx).isEmpty()) FirebaseApp.initializeApp(ctx)
                        db = FirebaseDatabase.getInstance()
                        ok = true
                        try {
                            FirebaseMessaging.getInstance().token.addOnSuccessListener { t -> ctx.sp.put("fcm", t ?: "") }
                            FirebaseMessaging.getInstance().subscribeToTopic("all")
                        } catch (t: Throwable) { Diag.e(t) }
                        Diag.d("CLOUD", "Firebase جاهز")
                    } catch (t: Throwable) {
                        Diag.e(t)
                        ok = false
                    }
                }
            }

            fun ready() = ok && db != null

            private fun toJson(s: DataSnapshot): JSONObject {
                val o = JSONObject()
                try {
                    for (c in s.children) {
                        val v = c.value
                        when (v) {
                            null -> {}
                            is Map<*, *> -> o.put(c.key ?: "?", JSONObject(v as Map<*, *>))
                            else -> o.put(c.key ?: "?", v)
                        }
                    }
                } catch (t: Throwable) { Diag.e(t) }
                return o
            }

            fun login(ctx: Context, user: String, pass: String, cb: (Boolean, String) -> Unit) {
                if (user.isBlank() || pass.isBlank()) { cb(false, "أدخل المستخدم وكلمة المرور"); return }
                if (!ready()) { ctx.sp.put("cloud", true); initAsync(ctx); cb(false, "السحابة قيد التهيئة — أعد المحاولة"); return }
                db!!.getReference(ROOT).child("users/$user")
                    .addListenerForSingleValueEvent(object : ValueEventListener {
                        override fun onDataChange(s: DataSnapshot) {
                            val o = toJson(s)
                            if (o.length() == 0) { cb(false, "الحساب غير موجود"); return }
                            val want = o.optString("pass", o.optString("password", ""))
                            if (want.isNotEmpty() && want != pass) { cb(false, "كلمة المرور غير صحيحة"); return }
                            if (o.optBoolean("blocked", false)) { cb(false, "الحساب محظور"); return }
                            val exp = o.optString("expiry", o.optString("exp_date", ""))
                            if (exp.isNotBlank() && exp != "null") {
                                val h = humanExpiry(exp)
                                if (h.contains("منتهٍ")) { cb(false, "انتهى الاشتراك ($h)"); return }
                            }
                            ctx.sp.put("auth_user", user)
                            val sess = ctx.sp.s("auth_session").ifBlank {
                                val v = java.util.UUID.randomUUID().toString().take(18)
                                ctx.sp.put("auth_session", v)
                                v
                            }
                            val max = o.optInt("devices", 1)
                            if (max > 0) {
                                db!!.getReference(ROOT).child("devs/$user").get()
                                    .addOnSuccessListener { ds ->
                                        val mine = ds.child(sess).getValue(String::class.java) ?: ""
                                        var count = 0
                                        for (ch in ds.children) if ((ch.value?.toString() ?: "").isNotBlank()) count++
                                        if (mine.isBlank() && count >= max) cb(false, "الحساب مستخدم على $count جهاز (الحد $max)")
                                        else {
                                            db!!.getReference(ROOT).child("devs/$user/$sess")
                                                .setValue(System.currentTimeMillis())
                                            cb(true, "أهلًا $user")
                                        }
                                    }
                                    .addOnFailureListener { t -> Diag.e(t); cb(true, "أهلًا $user") }
                            } else cb(true, "أهلًا $user")
                        }

                        override fun onCancelled(e: DatabaseError) { cb(false, "تعذّر الوصول للسيرفر: " + e.message) }
                    })
            }

            fun logout(ctx: Context) {
                val u = ctx.sp.s("auth_user")
                val s = ctx.sp.s("auth_session")
                if (ready() && u.isNotBlank() && s.isNotBlank()) {
                    try { db!!.getReference(ROOT).child("devs/$u/$s").removeValue() } catch (t: Throwable) { Diag.e(t) }
                }
                ctx.sp.put("auth_user", "")
            }

            fun findUpdate(cb: (Ota?) -> Unit) {
                if (!ready()) { cb(null); return }
                db!!.getReference(ROOT).child("app")
                    .addListenerForSingleValueEvent(object : ValueEventListener {
                        override fun onDataChange(s: DataSnapshot) {
                            val o = toJson(s)
                            val t = Ota()
                            t.code = o.optLong("code", o.optLong("version_code", 0))
                            t.name = o.optString("name", o.optString("version_name", ""))
                            t.url = o.optString("url")
                            t.note = o.optString("note")
                            cb(if (t.valid()) t else null)
                        }

                        override fun onCancelled(e: DatabaseError) { cb(null) }
                    })
            }
        }

        class NovaMessagingService : FirebaseMessagingService() {
            override fun onNewToken(token: String) {
                try { sp.put("fcm", token) } catch (t: Throwable) { Diag.e(t) }
            }

            override fun onMessageReceived(msg: RemoteMessage) {
                try {
                    val d = msg.data
                    val text = d["text"] ?: msg.notification?.body ?: ""
                    val title = d["title"] ?: msg.notification?.title ?: "NovaPlay"
                    if (text.isNotBlank()) Diag.d("PUSH", "$title: $text")
                } catch (t: Throwable) { Diag.e(t) }
            }
        }
        NP_F_CLOUD
