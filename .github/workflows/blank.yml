                          val rb = cc.sp.i("ai_m_rebuf", 0); val fl = cc.sp.i("ai_m_fail", 0)
                          Crash.note("AI-MET", "الإجمالي: تشغيل=" + t + " سريع=" + f + " تجميع=" + rb + " فشل=" + fl)
                      }
                  } catch (t: Throwable) {}
