name: NovaPlay_v4_NovaCore
on: [push, workflow_dispatch]
permissions:
  contents: write
  actions: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Build APK V138 SmartLoad
      run: |
        echo "org.gradle.jvmargs=-Xmx4096m" > gradle.properties
        echo "android.useAndroidX=true" >> gradle.properties
        echo "android.enableJetifier=true" >> gradle.properties
        cat <<'SETTINGS_EOF' > settings.gradle
        pluginManagement {
        repositories { google(); mavenCentral(); gradlePluginPortal() }
        plugins { id 'com.android.application' version '8.2.2'; id 'com.google.gms.google-services' version '4.4.2' }
        }
        dependencyResolutionManagement {
        repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
        repositories { google(); mavenCentral(); maven { url "https://jitpack.io" } }
        }
        include ':app'
        SETTINGS_EOF
        mkdir -p app/src/main/java/com/rabie/iptv app/src/main/res/{layout,layout-land,drawable,xml,values,mipmap-hdpi,mipmap-mdpi,mipmap-xhdpi,mipmap-xxhdpi,mipmap-xxxhdpi}
        echo '' > app_src_main_res_drawable_bg_home_photo.jpg.b64
        echo '' >> app_src_main_res_drawable_bg_home_photo.jpg.b64
