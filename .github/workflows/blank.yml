                  if (local.isNotEmpty()) {
                      showList(local)
                      tvGrTitle.text = g.name
                      return
                  }
                  val p = Catalog.profile
                  if (p != null && p.type == "mac" && g.catId.isNotBlank()) {
                      if (Catalog.fillDone(kind, g.catId) || Catalog.fillBusy(kind, g.catId)) {
                          toast("…المجموعة قيد التحميل في الخلفية")
                          showList(local)
                          return
                      }
                      Catalog.fillSet(kind, g.catId, 1)
                      val out = ArrayList<Channel>()
                      showBusy(true, "…جاري تحميل " + g.name)
                      Loader.macFillCat(this, p, kind, g.catId, g.name, out) { n ->
                          showBusy(false, "")
                          Catalog.fillSet(kind, g.catId, 2)
                          if (n <= 0) { toast("لم تُرجع البوابة عناصر لهذه المجموعة"); return@macFillCat }
                          val added = Loader.appendCat(kind, g.catId, g.name, out)
                          if (added > 0) Catalog.numbers()
                          showList(baseList().filter { it.group == g.name })
                          tvGrTitle.text = g.name
