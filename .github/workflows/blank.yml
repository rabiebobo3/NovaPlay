                  val sb = object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(bar: SeekBar?, progress: Int, fromUser: Boolean) {
                          if (!fromUser) return
                          val p = player ?: return
                          val dur = p.duration
                          if (dur > 0) {
                              val t = dur * progress / 1000L
                              text(tvFullPos, fmtTime(t)); text(tvPos, fmtTime(t))
                          }
                      }
                      override fun onStartTrackingTouch(bar: SeekBar?) { barsToken++ }
                      override fun onStopTrackingTouch(bar: SeekBar?) {
                          val p = player ?: return
                          val dur = p.duration
                          if (dur > 0) {
                              try { p.seekTo(dur * (bar?.progress ?: 0) / 1000L) } catch (t: Throwable) {}
                          }
                          armHideBars()
                      }
