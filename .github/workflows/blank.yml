        gunzip -c app/src/main/java/com/rabie/iptv/HomeActivity.java.gz > app/src/main/java/com/rabie/iptv/HomeActivity.java && rm -f app/src/main/java/com/rabie/iptv/HomeActivity.java.gz
        cat <<'RABIE_EOF_001' > app/src/main/res/drawable/ic_launcher_background.xml
