        <?xml version="1.0" encoding="utf-8"?>
        <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android" xmlns:app="http://schemas.android.com/apk/res-auto" android:id="@+id/root_layout" android:layout_width="match_parent" android:layout_height="match_parent" android:background="@drawable/bg_crystal_black_main" android:keepScreenOn="true">

        <LinearLayout android:id="@+id/splash_screen" android:layout_width="match_parent" android:layout_height="match_parent" android:background="#081222" android:gravity="center" android:orientation="vertical" android:elevation="20dp">
        <androidx.cardview.widget.CardView android:id="@+id/splash_logo_card" android:layout_width="150dp" android:layout_height="150dp" app:cardCornerRadius="75dp" app:cardBackgroundColor="#06080F" app:cardElevation="16dp">
