       NP_EOF
       cat <<'NP_EOF' > app/src/main/java/com/nova/play/Cloud.kt
       package com.nova.play

       import android.app.AlarmManager
       import android.app.Application
       import android.app.NotificationChannel
       import android.app.NotificationManager
       import android.app.PendingIntent
       import android.content.BroadcastReceiver
       import android.content.Context
       import android.content.Intent
       import android.content.IntentFilter
       import android.content.pm.PackageManager
       import android.net.Uri
       import android.os.Build
       import android.os.Process
       import androidx.core.app.NotificationCompat
       import androidx.core.content.ContextCompat
       import androidx.core.content.FileProvider
       import com.bumptech.glide.Glide
       import com.google.firebase.FirebaseApp
       import com.google.firebase.database.DataSnapshot
       import com.google.firebase.database.DatabaseError
       import com.google.firebase.database.DatabaseReference
       import com.google.firebase.database.FirebaseDatabase
       import com.google.firebase.database.ValueEventListener
       import com.google.firebase.messaging.FirebaseMessaging
       import com.google.firebase.messaging.FirebaseMessagingService
       import com.google.firebase.messaging.RemoteMessage
       import org.json.JSONObject
       import java.io.File
       import java.util.concurrent.atomic.AtomicBoolean

       /* ========================================================================
        *  السحابة والحماية: Firebase RTDB (دخول/جلسات/تنبيهات/OTA)، حارس الانهيار،
        *  مدير الذاكرة، مستقبل FCM. كل شيء يعمل بوضع «بدون سحابة» إذا غاب google-services.json
        * ======================================================================== */

       /** مسار جذر العقد في قاعدة البيانات — غيّره لو أردت. */
       const val ROOT = "nova/play138"

       /* ------------------------------ أحداث التطبيق ------------------------------ */

       object Events {
           const val ACTION = "com.nova.play.EVENT"

           fun send(ctx: Context, type: String, text: String = "") {
               try {
                   ctx.sendBroadcast(Intent(ACTION).setPackage(ctx.packageName)
                       .putExtra("type", type).putExtra("text", text))
               } catch (t: Throwable) { Crash.log(t) }
           }

           fun register(ctx: Context, handler: (String, String) -> Unit): BroadcastReceiver {
               val r = object : BroadcastReceiver() {
                   override fun onReceive(c: Context?, i: Intent?) {
                       if (i == null) return
                       try { handler(i.getStringExtra("type") ?: "", i.getStringExtra("text") ?: "") }
                       catch (t: Throwable) { Crash.log(t) }
                   }
               }
               try {
                   ContextCompat.registerReceiver(ctx, r, IntentFilter(ACTION), ContextCompat.RECEIVER_NOT_EXPORTED)
               } catch (t: Throwable) { Crash.log(t) }
               return r
           }

           fun unregister(ctx: Context, r: BroadcastReceiver?) {
               if (r == null) return
               try { ctx.unregisterReceiver(r) } catch (t: Throwable) {}
           }
       }

       /* -------------------------------- حارس الانهيار -------------------------------- */

       object Crash {
           private var saved: Thread.UncaughtExceptionHandler? = null
           private val file = AtomicBoolean(false)

           fun init(app: Application) {
               val crashFile = File(app.filesDir, "crash.log")
               if (app.sp.b("crashed", false)) {
                   app.sp.put("crashed", false)
                   Bg.ui { app.toastLong("التطبيق أُعيد تشغيله بعد إغلاق غير متوقع — راجع سجل الأعطال من الإعدادات") }
               }
               saved = Thread.getDefaultUncaughtExceptionHandler()
               Thread.setDefaultUncaughtExceptionHandler { t, e ->
                   try {
                       if (file.compareAndSet(false, true)) {
                           val sb = StringBuilder()
                           sb.append("\n=== ").append(java.text.SimpleDateFormat("yyyy-MM-dd HH:mm:ss", java.util.Locale.US)
                               .format(java.util.Date())).append(" ===\n")
                           sb.append(appVersion(app)).append(" / android ").append(Build.VERSION.SDK_INT).append("\n")
                           sb.append(e.javaClass.name).append(": ").append(e.message).append("\n")
                           for (st in e.stackTrace.take(24)) sb.append("  at ").append(st).append("\n")
                           var prev = if (crashFile.exists()) crashFile.readText() else ""
                           if (prev.length > 90_000) prev = prev.take(90_000)
                           crashFile.writeText((sb.toString() + prev).take(120_000))
                           app.sp.put("crashed", true)
                       }
                       restart(app)
                   } catch (t2: Throwable) {} finally {
                       try { saved?.uncaughtException(t, e) } catch (t3: Throwable) {}
                       Process.killProcess(Process.myPid())
                       kotlin.system.exitProcess(10)
                   }
               }
           }

           private fun restart(ctx: Context) {
               try {
                   val i = ctx.packageManager.getLaunchIntentForPackage(ctx.packageName) ?: return
                   val flags = if (Build.VERSION.SDK_INT >= 23)
                       PendingIntent.FLAG_CANCEL_CURRENT or PendingIntent.FLAG_IMMUTABLE
                   else PendingIntent.FLAG_CANCEL_CURRENT
                   val pi = PendingIntent.getActivity(ctx, 91, i, flags)
                   val am = ctx.getSystemService(Context.ALARM_SERVICE) as? AlarmManager
                   am?.set(AlarmManager.RTC, System.currentTimeMillis() + 1200, pi)   // إعادة تشغيل بعد 1.2 ثانية
               } catch (t: Throwable) {}
           }

           fun log(t: Throwable) {
               try {
                   val f = File(NovaApp.ctx?.filesDir ?: File("/data/local/tmp"), "crash.log")
                   val line = "[log] ${t.javaClass.simpleName}: ${t.message}\n"
                   f.parentFile?.mkdirs()
                   if (f.exists() && f.length() < 120_000) f.appendText(line) else f.writeText(line)
               } catch (t2: Throwable) {}
           }

           /** (8.19) سطر تشخيص في نفس سجل الأعطال (يُقرأ من الإعدادات ← سجل الأعطال). */
           fun note(tag: String, msg: String) {
               try {
                   val f = File(NovaApp.ctx?.filesDir ?: File("/data/local/tmp"), "crash.log")
                   val line = "[" + tag + "] " + msg + "\n"
                   f.parentFile?.mkdirs()
                   if (f.exists() && f.length() < 120_000) f.appendText(line) else f.writeText(line)
               } catch (t2: Throwable) {}
           }

           fun read(ctx: Context): String = try {
               val f = File(ctx.filesDir, "crash.log")
               if (!f.exists()) "لا يوجد سجل أعطال." else {
                   val s = f.readText()
                   if (s.length > 4000) s.take(4000) + "\n…" else s
               }
           } catch (t: Throwable) { "تعذّر قراءة السجل" }

           fun clear(ctx: Context) {
               try { File(ctx.filesDir, "crash.log").delete() } catch (t: Throwable) {}
           }
       }

       /* ------------------------------ مدير الذاكرة ------------------------------ */

       object Memory {
           const val PERIOD = 10L * 60_000L
           @Volatile private var started = false

           fun start(app: Application) {
               if (started) return
               started = true
               Thread {
                   while (true) {
                       try { Thread.sleep(PERIOD) } catch (t: Throwable) { return@Thread }
                       trim(app, false)
                   }
               }.apply { isDaemon = true; name = "nova-mem" }.start()
           }

           /** ينظّف كاش غير الضروري (يحافظ على كاش القوائم الذكي). */
           fun trim(ctx: Context, full: Boolean) {
               Bg.pool.execute {
                   var freed = 0L
                   try {
                       val cache = ctx.cacheDir
                       val keep = File(cache, "pl")
                       val limit = System.currentTimeMillis() - (if (full) 0L else 3L * 24 * 3600_000L)
                       cache.walkTopDown().forEach { f ->
                           if (f.isFile && !f.absolutePath.startsWith(keep.absolutePath) && f.lastModified() < limit) {
                               freed += f.length()
                               try { f.delete() } catch (t: Throwable) {}
                           }
                       }
                   } catch (t: Throwable) { Crash.log(t) }
                   Bg.ui {
                       try { Glide.get(ctx).clearMemory() } catch (t: Throwable) {}
                       try { ctx.cacheDir.resolve("pl").listFiles()?.let { if (full) for (f in it) { freed += f.length(); f.delete() } } } catch (t: Throwable) {}
                   }
                   try {
                       val rt = Runtime.getRuntime()
                       val used = (rt.totalMemory() - rt.freeMemory()) / 1048576
                       val max = rt.maxMemory() / 1048576
                       if (used > max * 0.7) System.gc()
                       ctx.sp.put("mem", "محرر: ${fmtBytes(freed)} • جافا: $used/$max MB")
                   } catch (t: Throwable) {}
               }
           }

           fun dump(ctx: Context): String {
               val rt = Runtime.getRuntime()
               val used = (rt.totalMemory() - rt.freeMemory()) / 1048576
               val am = ctx.getSystemService(Context.ACTIVITY_SERVICE) as? android.app.ActivityManager
               val memInfo = android.app.ActivityManager.MemoryInfo()
               try { am?.getMemoryInfo(memInfo) } catch (t: Throwable) {}
               val cache = try { ctx.cacheDir.walkTopDown().filter { it.isFile }.sumOf { it.length() } } catch (t: Throwable) { 0L }
               return "جافا: $used / ${rt.maxMemory() / 1048576} MB\n" +
                   "كاش التطبيق: ${fmtBytes(cache)} (الذكي: ${fmtBytes(cacheOf(ctx, "pl"))})\n" +
                   "متاح للنظام: ${fmtBytes(memInfo.availMem)} • ضغط منخفض: ${if (memInfo.lowMemory) "نعم" else "لا"}\n" +
                   "دورات التنظيف: كل 10 دقائق"
           }

           private fun cacheOf(ctx: Context, sub: String): Long = try {
               File(ctx.cacheDir, sub).walkTopDown().filter { it.isFile }.sumOf { it.length() }
           } catch (t: Throwable) { 0L }
       }

       /* ------------------------------ قاعدة البيانات ------------------------------ */

       object Remote {
           @Volatile private var checked = false
           @Volatile var available = false
               private set
           private var db: FirebaseDatabase? = null
           private val listeners = ArrayList<ValueEventListener>()

           fun init(ctx: Context) {
               if (checked) return
               checked = true
               try {
                   if (FirebaseApp.getApps(ctx).isEmpty()) FirebaseApp.initializeApp(ctx)
                   if (FirebaseApp.getApps(ctx).isEmpty()) { available = false; return }
                   val d = FirebaseDatabase.getInstance()
                   // نتحقق من العنوان صراحةً: بدون google-services.json نفشل بهدوء
                   val probe = d.getReference(ROOT)
                   probe.addListenerForSingleValueEvent(object : ValueEventListener {
                       override fun onDataChange(s: DataSnapshot) {
                           available = true
                       }

                       override fun onCancelled(e: DatabaseError) {
                           available = false
                       }
                   })
                   db = d
                   available = true
               } catch (t: Throwable) {
                   available = false
                   Crash.log(t)
               }
           }

           fun ready(): Boolean = available && db != null

           private fun ref(ctx: Context, path: String): DatabaseReference? =
               if (ready()) db!!.getReference(ROOT).child(path) else null

           fun get(ctx: Context, path: String, cb: (JSONObject) -> Unit) {
               val r = ref(ctx, path)
               if (r == null) { Bg.ui { cb(JSONObject()) }; return }
               r.addListenerForSingleValueEvent(object : ValueEventListener {
                   override fun onDataChange(s: DataSnapshot) {
                       val o = JSONObject()
                       try {
                           for (c in s.children) {
                               val v = c.value
                               when (v) {
                                   null -> {}
                                   is Map<*, *> -> o.put(c.key ?: "?", JSONObject(v))
                                   else -> o.put(c.key ?: "?", v)
                               }
                           }
                           val raw = s.value
                           if (raw != null && raw !is Map<*, *>) o.put("value", raw)
                       } catch (t: Throwable) { Crash.log(t) }
                       Bg.ui { cb(o) }
                   }

                   override fun onCancelled(e: DatabaseError) { Bg.ui { cb(JSONObject()) } }
               })
           }

           fun set(ctx: Context, path: String, values: Map<String, Any>, cb: ((Boolean) -> Unit)? = null) {
               val r = ref(ctx, path)
               if (r == null) { cb?.invoke(false); return }
               r.updateChildren(values)
                   .addOnSuccessListener { cb?.invoke(true) }
                   .addOnFailureListener { t -> Crash.log(t); cb?.invoke(false) }
           }

           fun remove(ctx: Context, path: String, cb: ((Boolean) -> Unit)? = null) {
               val r = ref(ctx, path)
               if (r == null) { cb?.invoke(false); return }
               r.removeValue()
                   .addOnSuccessListener { cb?.invoke(true) }
                   .addOnFailureListener { t -> Crash.log(t); cb?.invoke(false) }
           }

           /** يشتغل على مسار كامل خارج الجذر (للروابط الخارجية). */
           fun listen(ctx: Context, path: String, cb: (JSONObject) -> Unit): ValueEventListener? {
               val r = ref(ctx, path) ?: return null
               val l = object : ValueEventListener {
                   override fun onDataChange(s: DataSnapshot) {
                       val o = JSONObject()
                       try {
                           for (c in s.children) {
                               val v = c.value
                               when (v) {
                                   null -> {}
                                   is Map<*, *> -> o.put(c.key ?: "?", JSONObject(v))
                                   else -> o.put(c.key ?: "?", v)
                               }
                           }
                           val raw = s.value
                           if (raw != null && raw !is Map<*, *>) o.put("value", raw)
                       } catch (t: Throwable) {}
                       Bg.ui { cb(o) }
                   }

                   override fun onCancelled(e: DatabaseError) {}
               }
               r.addValueEventListener(l)
               synchronized(listeners) { listeners.add(l) }
               return l
           }

           fun stop(ctx: Context, l: ValueEventListener?) {
               if (l == null) return
               try { db?.getReference(ROOT)?.removeEventListener(l) } catch (t: Throwable) {}
               synchronized(listeners) { listeners.remove(l) }
           }

           /* ----------------------- الدخول ----------------------- */

           /**
            * نتيجة الدخول: ok / سبب الرفض.
            * العقد المتوقع: users/<user> = { pass, blocked, expiry, devices, note }
            */
           fun login(ctx: Context, user: String, pass: String, session: String, cb: (Boolean, String) -> Unit) {
               if (!ready()) { localLogin(ctx, user, pass, cb); return }
               get(ctx, "users/$user") { o ->
                   if (o.length() == 0) { cb(false, "الحساب غير موجود في السيرفر"); return@get }
                   val want = o.optString("pass", o.optString("password", ""))
                   if (want.isNotEmpty() && want != pass) { cb(false, "كلمة المرور غير صحيحة"); return@get }
                   if (o.optBoolean("blocked", false)) { cb(false, "الحساب محظور: " + o.optString("reason", "")); return@get }
                   val exp = o.optString("expiry", o.optString("exp_date", ""))
                   if (Expiry.expired(exp)) { cb(false, "انتهت الاشتراك ($exp)"); return@get }
                   val maxDev = o.optInt("devices", 1)
                   if (maxDev > 0) {
                       get(ctx, "devs/$user") { d ->
                           val mine = d.optString(session, "")
                           var count = 0
                           val keys = d.keys()
                           while (keys.hasNext()) { if (d.optString(keys.next(), "").isNotEmpty()) count++ }
                           if (mine.isEmpty() && count >= maxDev) {
                               cb(false, "الحساب مستخدم على $count جهاز (الحد $maxDev)")
                           } else {
                               val patch = HashMap<String, Any>()
                               patch[session] = System.currentTimeMillis()
                               set(ctx, "devs/$user", patch) { cb(true, "أهلًا $user") }
                           }
                       }
                   } else cb(true, "أهلًا $user")
               }
           }

           /** دخول محلي (بدون سحابة): مستخدم واحد افتراضي + أي قائمة محفوظة. */
           private fun localLogin(ctx: Context, user: String, pass: String, cb: (Boolean, String) -> Unit) {
               val admin = ctx.sp.s("admin_user", "admin")
               val apass = ctx.sp.s("admin_pass", "admin123")
               if (user == admin && pass == apass) { cb(true, "دخول محلي (بدون سحابة)"); return }
               val users = try { JSONObject(ctx.sp.s("users", "{}")) } catch (t: Throwable) { JSONObject() }
               val rec = users.optJSONObject(user)
               if (rec == null) { cb(false, "لا يوجد حساب بهذا الاسم — استخدم وضع «دخول مباشر»"); return }
               if (rec.optBoolean("blocked", false)) { cb(false, "الحساب محظور"); return }
               if (rec.optString("pass", "") != pass) { cb(false, "كلمة المرور غير صحيحة"); return }
               if (Expiry.expired(rec.optString("expiry"))) { cb(false, "انتهت مدة الاشتراك"); return }
               cb(true, "أهلًا $user (محلي)")
           }

           fun logout(ctx: Context, user: String, session: String) {
               if (ready() && session.isNotEmpty()) set(ctx, "devs/$user", mapOf(session to ""))
               ctx.sp.rm("auth_user"); ctx.sp.rm("auth_session")
               Events.send(ctx, "logout")
           }

           /** رقابة الجلسة: إن طُرد الجهاز من نفس الحساب نخرج فورًا. */
           fun watchSession(ctx: Context, user: String, session: String, onKick: () -> Unit): ValueEventListener? {
               if (!ready() || user.isEmpty()) return null
               return listen(ctx, "devs/$user") { o ->
                   val v = o.optString(session, "")
                   if (v.isEmpty()) onKick()
               }
           }

           fun subscribeAll(ctx: Context) {
               try {
                   if (FirebaseApp.getApps(ctx).isNotEmpty()) {
                       FirebaseMessaging.getInstance().subscribeToTopic("all")
                   }
               } catch (t: Throwable) { Crash.log(t) }
           }

           fun pushToken(ctx: Context) {
               try {
                   if (FirebaseApp.getApps(ctx).isEmpty()) return
                   FirebaseMessaging.getInstance().token.addOnCompleteListener { task ->
                       if (!task.isSuccessful) return@addOnCompleteListener
                       val tk = task.result ?: return@addOnCompleteListener
                       ctx.sp.put("fcm", tk)
                       if (ready()) {
                           val u = ctx.sp.s("auth_user")
                           if (u.isNotEmpty()) set(ctx, "tokens", mapOf(u to tk))
                       }
                   }
               } catch (t: Throwable) { Crash.log(t) }
           }
       }

       /* --------------------------------- التحديث الذاتي --------------------------------- */

       object Ota {
           class Info {
               var code = 0L
               var name = ""
               var note = ""
               var url = ""
               var parts = 0
               var md5 = ""
               fun valid() = code > 0 || url.isNotEmpty()
           }

           fun apkFile(ctx: Context): File = File(ctx.externalCacheDir ?: ctx.cacheDir, "update/novaplay-update.apk")

           /** 1) من RTDB (نسخة + أجزاء base64) 2) أو رابط مباشر من عقدة update/url. */
           fun check(ctx: Context, manual: Boolean, cb: (Info?, String) -> Unit) {
               val mine = try {
                   val pi = ctx.packageManager.getPackageInfo(ctx.packageName, 0)
                   if (Build.VERSION.SDK_INT >= 28) pi.longVersionCode else @Suppress("DEPRECATION") pi.versionCode.toLong()
               } catch (t: Throwable) { 0L }
               fun finish(o: JSONObject?) {
                   val i = Info()
                   if (o != null) {
                       i.code = o.optLong("code", o.optLong("version_code", 0))
                       i.name = o.optString("name", o.optString("version_name", ""))
                       i.note = o.optString("note", "")
                       i.url = o.optString("url", "")
                       i.parts = o.optInt("parts", 0)
                       i.md5 = o.optString("md5", "")
                   }
                   if (!i.valid()) { if (manual) Bg.ui { cb(null, "لا يوجد تحديث منشور") } else Bg.ui { cb(null, "") }; return }
                   if (i.code in 1..mine) {
                       if (manual) Bg.ui { cb(null, "أنت على أحدث إصدار ($mine)") } else Bg.ui { cb(null, "") }
                       return
                   }
                   Bg.ui { cb(i, "تحديث متوفر: ${i.name.ifBlank { i.code.toString() }}") }
               }
               if (Remote.ready()) Remote.get(ctx, "app") { o -> finish(if (o.length() == 0) null else o) }
               else if (manual) finish(null) else Bg.ui { cb(null, "") }
           }

           /** تنزيل مع شريط تقدم (أجزاء base64 من RTDB أو رابط مباشر). */
           fun download(ctx: Context, info: Info, progressRaw: (Int, String) -> Unit, doneRaw: (File?, String) -> Unit) {
               val progress = { a: Int, b: String -> Bg.ui { progressRaw(a, b) } }
               val done = { a: File?, b: String -> Bg.ui { doneRaw(a, b) } }
               Bg.pool.execute {
                   val out = apkFile(ctx)
                   try {
                       out.parentFile?.mkdirs()
                       if (out.exists()) out.delete()
                       if (info.parts > 0 && Remote.ready()) {
                           val raf = java.io.RandomAccessFile(out, "rw")
                           raf.setLength(0)
                           var pos = 0L
                           for (i in 0 until info.parts) {
                               if (OtaFlag.wantCancel) break
                               var chunk: String? = null
                               val latch = java.util.concurrent.CountDownLatch(1)
                               Remote.get(ctx, "app/p/$i") { o -> chunk = o.optString("v", o.optString("value", "")); latch.countDown() }
                               latch.await(40, java.util.concurrent.TimeUnit.SECONDS)
                               val b64 = chunk ?: ""
                               if (b64.isEmpty()) { raf.close(); done(null, "فشل تنزيل الجزء $i"); return@execute }
                               val bytes = android.util.Base64.decode(b64, android.util.Base64.DEFAULT)
                               raf.seek(pos); raf.write(bytes); pos += bytes.size
                               progress(5 + (i + 1) * 90 / info.parts, "جزء ${i + 1}/${info.parts} • ${fmtBytes(pos)}")
                           }
                           raf.close()
                       } else if (info.url.isNotEmpty()) {
                           val data = Http.bytes(info.url) { got, total ->
                               if (total > 0) progress(5 + (got * 90 / total).toInt(), fmtBytes(got) + " / " + fmtBytes(total))
                           }
                           out.writeBytes(data)
                       } else { done(null, "لا يوجد مصدر للتنزيل"); return@execute }
                       if (!out.exists() || out.length() < 1024) { done(null, "الملف تالف أو فارغ"); return@execute }
                       if (info.md5.isNotEmpty()) {
                           val md = md5(out)
                           if (!md.equals(info.md5, true)) { done(null, "الملف لا يطابق البصمة ($md)"); return@execute }
                       }
                       progress(97, "تحضير التثبيت…")
                       done(out, "تم التنزيل ${fmtBytes(out.length())}")
                   } catch (t: Throwable) {
                       Crash.log(t)
                       done(null, "خطأ في التنزيل: " + (t.message ?: t.javaClass.simpleName))
                   }
               }
           }

           private fun md5(f: File): String = try {
               val md = java.security.MessageDigest.getInstance("MD5")
               f.inputStream().use { ins ->
                   val buf = ByteArray(64 * 1024)
                   while (true) { val n = ins.read(buf); if (n < 0) break; md.update(buf, 0, n) }
               }
               md.digest().joinToString("") { String.format("%02x", it) }
           } catch (t: Throwable) { "" }

           /** تثبيت ذاتي عبر FileProvider. */
           fun install(ctx: Context, f: File): Boolean {
               return try {
                   if (Build.VERSION.SDK_INT >= 26 && !ctx.packageManager.canRequestPackageInstalls()) {
                       try {
                           ctx.startActivity(Intent(android.provider.Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES,
                               Uri.parse("package:" + ctx.packageName)).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
                       } catch (t: Throwable) { ctx.toastLong("اسمح للتطبيق بتثبيت التطبيقات المجهولة من الإعدادات") }
                       return false
                   }
                   val uri = FileProvider.getUriForFile(ctx, ctx.packageName + ".provider", f)
                   val i = Intent(Intent.ACTION_VIEW)
                       .setDataAndType(uri, "application/vnd.android.package-archive")
                       .addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION or Intent.FLAG_ACTIVITY_NEW_TASK)
                   ctx.startActivity(i)
                   true
               } catch (t: Throwable) {
                   Crash.log(t)
                   ctx.toastLong("تعذّر فتح شاشة التثبيت: " + (t.message ?: ""))
                   false
               }
           }

           /* --------------------- النشر من لوحة الأدمن --------------------- */

           /** يقرأ APK المثبت ويقسّمه أجزاء base64 في app/p/i ثم ينشر الرقم. */
           fun publish(ctx: Context, note: String, progressRaw: (Int, String) -> Unit, doneRaw: (Boolean, String) -> Unit) {
               val progress = { a: Int, b: String -> Bg.ui { progressRaw(a, b) } }
               val done = { a: Boolean, b: String -> Bg.ui { doneRaw(a, b) } }
               if (!Remote.ready()) { done(false, "النشر يحتاج Firebase (google-services.json)"); return }
               Bg.pool.execute {
                   try {
                       val path = ctx.applicationInfo.sourceDir
                       val f = File(path)
                       if (!f.exists()) { Bg.ui { done(false, "ملف APK غير موجود") }; return@execute }
                       val total = f.length()
                       val size = 480 * 1024
                       val n = Math.max(1, ((total + size - 1) / size).toInt())
                       val code = try {
                           val pi = ctx.packageManager.getPackageInfo(ctx.packageName, 0)
                           if (Build.VERSION.SDK_INT >= 28) pi.longVersionCode else @Suppress("DEPRECATION") pi.versionCode.toLong()
                       } catch (t: Throwable) { 0L }
                       val ins = f.inputStream()
                       val buf = ByteArray(size)
                       for (i in 0 until n) {
                           val read = readFull(ins, buf)
                           val b64 = android.util.Base64.encodeToString(buf, 0, read, android.util.Base64.NO_WRAP)
                           val ok = booleanArrayOf(false)
                           val latch = java.util.concurrent.CountDownLatch(1)
                           Remote.set(ctx, "app/p/$i", mapOf("v" to b64, "len" to read)) { r -> ok[0] = r; latch.countDown() }
                           latch.await(90, java.util.concurrent.TimeUnit.SECONDS)
                           progress(5 + (i + 1) * 92 / n, "رفع $i/$n (${fmtBytes(total * (i + 1) / n)})")
                           if (!ok[0]) { ins.close(); Bg.ui { done(false, "فشل الرفع عند الجزء $i") }; return@execute }
                       }
                       ins.close()
                       val head = mapOf<String, Any>("code" to code, "parts" to n, "name" to (ctx.sp.s("ota_name", appVersion(ctx))), "note" to note, "bytes" to total)
                       Remote.set(ctx, "app", head) { ok -> Bg.ui { done(ok, if (ok) "نُشر v$code ($n جزء)" else "فشل نشر بيانات الإصدار") } }
                   } catch (t: Throwable) {
                       Crash.log(t)
                       Bg.ui { done(false, "خطأ: " + (t.message ?: t.javaClass.simpleName)) }
                   }
               }
           }

           private fun readFull(ins: java.io.InputStream, buf: ByteArray): Int {
               var n = 0
               while (n < buf.size) {
                   val r = try { ins.read(buf, n, buf.size - n) } catch (t: Throwable) { -1 }
                   if (r < 0) break
                   n += r
               }
               return n
           }
       }

       /** غطاء إيقاف تنزيل OTA (يُستعمل من واجهة التحديث). */
       object OtaFlag { var wantCancel = false }

       /* --------------------------- إشعارات + خدمة FCM --------------------------- */

       object Notify {
           const val CH = "nova_push"
           fun ensure(ctx: Context) {
               if (Build.VERSION.SDK_INT < 26) return
               try {
                   val nm = ctx.getSystemService(NotificationManager::class.java) ?: return
                   if (nm.getNotificationChannel(CH) == null) {
                       nm.createNotificationChannel(
                           NotificationChannel(CH, "إشعارات NovaPlay", NotificationManager.IMPORTANCE_DEFAULT)
                       )
                   }
               } catch (t: Throwable) { Crash.log(t) }
           }

           fun push(ctx: Context, title: String, text: String, url: String = "") {
               try {
                   ensure(ctx)
                   val pi = try {
                       ctx.packageManager.getLaunchIntentForPackage(ctx.packageName)?.let {
                           PendingIntent.getActivity(ctx, 7, it,
                               if (Build.VERSION.SDK_INT >= 23) PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                               else PendingIntent.FLAG_UPDATE_CURRENT)
                       }
                   } catch (t: Throwable) { null }
                   val b = NotificationCompat.Builder(ctx, CH)
                       .setSmallIcon(R.drawable.ic_live)
                       .setContentTitle(title)
                       .setContentText(text)
                       .setStyle(NotificationCompat.BigTextStyle().bigText(text))
                       .setAutoCancel(true)
                       .setColor(ContextCompat.getColor(ctx, R.color.np_gold))
                   if (pi != null) b.setContentIntent(pi)
                   val nm = ctx.getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                   nm.notify((title + text).hashCode(), b.build())
               } catch (t: Throwable) { Crash.log(t) }
           }

           fun granted(ctx: Context): Boolean = Build.VERSION.SDK_INT < 33 ||
               ContextCompat.checkSelfPermission(ctx, android.Manifest.permission.POST_NOTIFICATIONS) == PackageManager.PERMISSION_GRANTED
       }

       class NovaApp : Application() {
           companion object {
               @Volatile var ctx: Context? = null
               const val EXTRA_RESUME = "resume"
           }

           override fun onCreate() {
               super.onCreate()
               ctx = applicationContext
               Crash.init(this)
               Memory.start(this)
               applyTheme()
               Notify.ensure(this)
               Remote.init(this)
               if (Remote.ready()) {
                   Remote.pushToken(this)
                   Remote.subscribeAll(this)
                   // تنبيه البث العام → يظهر في كل الشاشات
                   Remote.listen(this, "broadcast") { o ->
                       val text = o.optString("text", "")
                       val ts = o.optLong("ts", 0)
                       if (text.isNotEmpty() && ts > sp.l("last_bc", 0)) {
                           sp.put("last_bc", ts)
                           Notify.push(this, o.optString("title", "NovaPlay"), text)
                           Events.send(this, "broadcast", text)
                       }
                   }
               }
               // فحص التحديث عند التشغيل (مرة كل 12 ساعة)
               if (System.currentTimeMillis() - sp.l("last_ota_check", 0) > 12L * 3600_000L) {
                   sp.put("last_ota_check", System.currentTimeMillis())
                   Ota.check(this, false) { info, msg ->
                       if (info != null) Events.send(this, "update", info.code.toString())
                       else if (msg.isNotEmpty()) { /* صامت */ }
                   }
               }
           }

           fun applyTheme() {
               val mode = when (sp.s("theme", "night")) {
                   "day" -> androidx.appcompat.app.AppCompatDelegate.MODE_NIGHT_NO
                   "system" -> androidx.appcompat.app.AppCompatDelegate.MODE_NIGHT_FOLLOW_SYSTEM
                   else -> androidx.appcompat.app.AppCompatDelegate.MODE_NIGHT_YES
               }
               try { androidx.appcompat.app.AppCompatDelegate.setDefaultNightMode(mode) } catch (t: Throwable) {}
           }

           override fun onTrimMemory(level: Int) {
               super.onTrimMemory(level)
               if (level >= TRIM_MEMORY_BACKGROUND) { try { Glide.get(this).clearMemory() } catch (t: Throwable) {} }
           }

           override fun onLowMemory() {
               super.onLowMemory()
               try { Glide.get(this).clearMemory() } catch (t: Throwable) {}
           }
       }

       /** استقبال رسائل FCM: إشعار محلي أو أمر للواجهة (reload / update / broadcast). */
       class NovaMessagingService : FirebaseMessagingService() {
           override fun onNewToken(token: String) {
               try {
                   sp.put("fcm", token)
                   val u = sp.s("auth_user")
                   if (u.isNotEmpty()) Remote.set(applicationContext, "tokens", mapOf(u to token))
               } catch (t: Throwable) { Crash.log(t) }
           }

           override fun onMessageReceived(msg: RemoteMessage) {
               try {
                   val d = msg.data
                   val action = d["action"] ?: ""
                   val text = d["text"] ?: msg.notification?.body ?: d["msg"] ?: ""
                   val title = d["title"] ?: msg.notification?.title ?: "NovaPlay"
                   when (action) {
                       "reload" -> { Events.send(applicationContext, "reload", text); }
                       "update" -> Events.send(applicationContext, "update", d["code"] ?: "")
                       "block" -> {
                           Events.send(applicationContext, "kicked", if (text.isEmpty()) "تم إيقاف الحساب" else text)
                       }
                       else -> if (text.isNotEmpty()) Notify.push(applicationContext, title, text)
                   }
                   if (msg.notification != null && text.isNotEmpty() && action.isEmpty()) {
                       Notify.push(applicationContext, msg.notification!!.title ?: title, text)
                   }
               } catch (t: Throwable) { Crash.log(t) }
           }
       }
