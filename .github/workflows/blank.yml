             if (autoNext) "☑ تشغيل التالي تلقائيًا" else "☐ تشغيل التالي تلقائيًا",
             if (sp.b("smart_alt", true)) "☑ مصدر بديل ذكي" else "☐ مصدر بديل ذكي",
             "إعادة تحميل القائمة",
             "معلومات الجلسة والحساب",
             "تغيير رمز القفل",
             "مسح السجل",
             "عمق الجلب (أفلام/مسلسلات): " + depthLabel(),
             "نسبة الصورة: " + ratioLabel(sp.s("rm2", "1"))
           )
           pickDialog("الإعدادات السريعة", items) { i ->
             when (i) {
               0 -> { autoNext = !autoNext; sp.put("auto_next", autoNext); toast(if (autoNext) "التالي تلقائي: مفعّل" else "التالي تلقائي: معطّل") }
               1 -> { sp.put("smart_alt", !sp.b("smart_alt", true)); toast("البديل الذكي: " + if (sp.b("smart_alt", true)) "مفعّل" else "معطّل") }
               2 -> {
                 val p = Catalog.profile ?: Profile.fromJson(JSONObject(sp.s("last", "{}")))
                 Loader.load(this, p, true, { t -> runOnUiThread { tvLoadTxt.text = t } }) { ok, msg ->
                   if (ok) { buildGroups(); refresh(); toast("تحديث كامل • " + msg) } else toast(msg)
                 }
               }
               3 -> infoDialog("الجلسة", "المستخدم: " + sp.s("auth_user") + "\nالمعرّف: " + sp.s("auth_session") +
                 "\nالسيرفر: " + (Catalog.profile?.url ?: "-") + "\nالنوع: " + (Catalog.profile?.type ?: "-") +
                 "\nالانتهاء: " + Catalog.expiry + "\nالحالة: " + Catalog.status + "\nFCM: " + sp.s("fcm", "-").take(20))
               4 -> inputDialog("رمز القفل", "4 أرقام", null, v1 = "", msg = "الرمز الحالي: " + sp.s("lock_code", "0000")) { code, _ ->
                 if (code.length >= 3) { sp.put("lock_code", code); toast("تم تغيير الرمز") } else toast("قصير جدًا")
               }
               5 -> { recents.clear(); sp.put("recents", "[]"); buildGroups(); refresh(); toast("مُسح السجل") }
               6 -> cycleDepth()
               7 -> cycleResize()
             }
           }
         }

         override fun onKeyDown(keyCode: Int, event: KeyEvent?): Boolean {
           val typing = etSearch.visibility == View.VISIBLE && etSearch.hasFocus()
           // (8.32) الفوكس ضايع؟ نرجّعوه للقنوات قبل أي تنقّل (كان يروح للبحث)
           if (!typing && (keyCode == KeyEvent.KEYCODE_DPAD_DOWN || keyCode == KeyEvent.KEYCODE_DPAD_UP ||
               keyCode == KeyEvent.KEYCODE_DPAD_LEFT || keyCode == KeyEvent.KEYCODE_DPAD_RIGHT) &&
             (currentFocus == null || currentFocus === etSearch)) { focusFirst(); return true }
           when (keyCode) {
             KeyEvent.KEYCODE_DPAD_UP, KeyEvent.KEYCODE_DPAD_DOWN -> {
               if (typing) return super.onKeyDown(keyCode, event)
               // والشريط مخفي: فوق/تحت = تبديل القناة (سلوك مشغّلات IPTV)
               if (full && !barsVisible()) {
                 if (keyCode == KeyEvent.KEYCODE_DPAD_DOWN) next(false) else prev()
                 return true
               }
             }
             KeyEvent.KEYCODE_DPAD_LEFT, KeyEvent.KEYCODE_DPAD_RIGHT -> {
               if (typing) return super.onKeyDown(keyCode, event)
               val p = player ?: return true
               if (full && !barsVisible()) {
                 if (p.isCurrentMediaItemLive) { if (keyCode == KeyEvent.KEYCODE_DPAD_RIGHT) next(false) else prev() }
                 else skip(if (keyCode == KeyEvent.KEYCODE_DPAD_RIGHT) 10_000L else -10_000L)
                 return true
               }
             }
             KeyEvent.KEYCODE_MENU -> { settingsDialog(); return true }
             KeyEvent.KEYCODE_SETTINGS -> { settingsDialog(); return true }
             KeyEvent.KEYCODE_MEDIA_PLAY_PAUSE, KeyEvent.KEYCODE_HEADSETHOOK -> {
               val p = player ?: return false
               if (p.isPlaying) p.pause() else { p.playWhenReady = true; p.play() }
               return true
             }
             KeyEvent.KEYCODE_MEDIA_PLAY -> { player?.play(); return true }
             KeyEvent.KEYCODE_MEDIA_PAUSE -> { player?.pause(); return true }
             KeyEvent.KEYCODE_MEDIA_NEXT -> { next(false); return true }
             KeyEvent.KEYCODE_MEDIA_PREVIOUS -> { prev(); return true }
             KeyEvent.KEYCODE_INFO -> { infoDialog(cur?.name ?: "معلومات", descOf(cur)); return true }
             KeyEvent.KEYCODE_ESCAPE -> {
               if (full) { toggleFull(false); return true }
               if (pipOn) { showPip(false); return true }
             }
             KeyEvent.KEYCODE_DPAD_CENTER, KeyEvent.KEYCODE_ENTER, KeyEvent.KEYCODE_NUMPAD_ENTER -> {
               if (typing) return super.onKeyDown(keyCode, event)
               if (!full) { toggleFull(true); return true }
               val p = player ?: return true
               if (p.isPlaying) p.pause() else { p.playWhenReady = true; p.play() }
               showBars()
               return true
             }
             KeyEvent.KEYCODE_SPACE -> {
               if (typing) return super.onKeyDown(keyCode, event)
               val p = player ?: return true
               if (p.isPlaying) p.pause() else { p.playWhenReady = true; p.play() }
               return true
             }
             KeyEvent.KEYCODE_MEDIA_FAST_FORWARD, KeyEvent.KEYCODE_MEDIA_REWIND -> {
               val p = player ?: return true
               val step = if (keyCode == KeyEvent.KEYCODE_MEDIA_FAST_FORWARD) 30000L else -30000L
               if (p.isCurrentMediaItemLive) return true
               p.seekTo(maxOf(0L, p.currentPosition + step))
               showBars()
               return true
             }
             KeyEvent.KEYCODE_PAGE_UP, KeyEvent.KEYCODE_PAGE_DOWN -> {
               if (typing) return super.onKeyDown(keyCode, event)
               val p = player ?: return true
               if (!p.isCurrentMediaItemLive) { p.seekTo(maxOf(0L, p.currentPosition + if (keyCode == KeyEvent.KEYCODE_PAGE_DOWN) 60000L else -60000L)); showBars() }
               return true
             }
             KeyEvent.KEYCODE_NUMPAD_0, KeyEvent.KEYCODE_0, KeyEvent.KEYCODE_1, KeyEvent.KEYCODE_2, KeyEvent.KEYCODE_3,
             KeyEvent.KEYCODE_4, KeyEvent.KEYCODE_5, KeyEvent.KEYCODE_6, KeyEvent.KEYCODE_7, KeyEvent.KEYCODE_8, KeyEvent.KEYCODE_9 -> {
               if (typing) return super.onKeyDown(keyCode, event)
               commitDial(keyCode)
               return true
             }
             KeyEvent.KEYCODE_DEL -> {
               if (dial.isNotEmpty()) { dial = dial.dropLast(1); updateDial(); return true }
             }
             KeyEvent.KEYCODE_BACK -> {
               if (dial.isNotEmpty()) { dial = ""; updateDial(); return true }
               // (8.32) زر الرجوع في الريموت: فلم/حلقة ⇒ لقائمة الأفلام/المسلسلات مباشرة
               if (cur != null && cur?.kind != "live") { savePosNow(); backToGrid(); return true }
               if (full) { toggleFull(false); return true }
               if (pipOn) { showPip(false); return true }
             }
           }
           return super.onKeyDown(keyCode, event)
         }

         /** اختيار قناة برقمها عبر أرقام الريموت (1.5 ثانية ثم التنفيذ). */
         private var dial = ""
         private val dialRun = Runnable {
           val n = dial.toIntOrNull() ?: 0
           dial = ""
           tvDial.visibility = View.GONE
           if (n <= 0) return@Runnable
           val list = sourceList().filter { it.kind == "live" && it.num > 0 }
           val c = list.firstOrNull { it.num == n }
           if (c != null) {
             val i = list.indexOf(c)
             if (i >= 0) { rvChannels.scrollToPosition(i); playSafe(c, false) }
           } else toast("لا توجد القناة رقم $n")
         }

         private fun commitDial(keyCode: Int) {
           val d = when (keyCode) {
             KeyEvent.KEYCODE_NUMPAD_0, KeyEvent.KEYCODE_0 -> 0
             else -> keyCode - KeyEvent.KEYCODE_1 + 1
           }
           dial = (dial + d.toString()).takeLast(4)
           updateDial()
           h.removeCallbacks(dialRun)
           h.postDelayed(dialRun, 1500)
         }

         private fun updateDial() {
           if (dial.isEmpty()) { tvDial.visibility = View.GONE; return }
           tvDial.visibility = View.VISIBLE
           tvDial.text = dial
         }

         override fun onBackPressed() {
           when {
             // (8.32) فلم/حلقة/مسلسل: الرجوع **دائمًا** لقائمة الأفلام/المسلسلات بنفس القسم ونفس العنصر.
             //        قبل: الرجوع الأول كان يخرج من الشاشة الكاملة ويبقى داخل المشغّل فوق شاشة القنوات.
             cur != null && cur?.kind != "live" -> { savePosNow(); backToGrid() }
             // جاي من قسم الأفلام/المسلسلات: الرجوع يرجّع **نفس القسم ونفس العنصر** (لا المسكن)
             fromGrid -> { savePosNow(); backToGrid() }
             full -> toggleFull(false)
             pipOn -> showPip(false)
             etSearch.text.isNotEmpty() -> etSearch.setText("")
             else -> finish()
           }
         }

         /**
         * (8.22) يرجع لشاشة الأفلام/المسلسلات: إن كانت موجودة تُستدعى (وتُستعيد حالتها المحفوظة)،
         * وإن كانت أُغلقت تُنشأ من جديد وتُستعيد الحالة من الذاكرة الدائمة ⇒ الرجوع ما يفشلش أبدًا.
         */
         private fun backToGrid() {
           try {
             // (8.32) النوع من العنصر المعروض الآن — قبل كان يقرا «النوع المحفوظ» القديم
             //        (تعرض فلم ⇒ ترجع لقائمة المسلسلات!)
             val k = when (cur?.kind) {
               "movie" -> "movie"
               "episode", "series" -> "series"
               else -> sp.s("ret_kind").ifBlank { "movie" }
             }
             val i = Intent(this, GridActivity::class.java)
             i.putExtra("kind", if (k == "series") "series" else "movie")
             i.putExtra("restore", "1")               // v8.23: أمر صريح للشاشة باستعادة المكان
             i.addFlags(Intent.FLAG_ACTIVITY_REORDER_TO_FRONT or Intent.FLAG_ACTIVITY_SINGLE_TOP)
             Crash.note("BACK", "to grid kind=" + k + " lvl=" + sp.s("ret_lvl") + " played=" + sp.s("ret_played_name"))
