                              Crash.log(t)
                              toast("تعذر الفتح: " + (t.message ?: t.javaClass.simpleName))
                          }
                      }
                      return
                  }
                  if (c.url.isBlank() && c.alt.isBlank()) { toast("لا يوجد رابط لهذا العنصر"); return }
                  playNow(c)
              }

              /** غلاف آمن لضغط البطاقة: أي خطأ يظهر كتنبيه ولا يُغلق التطبيق. */
