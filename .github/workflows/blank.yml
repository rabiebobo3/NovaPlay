              private fun showSources() {
                  val c = cur ?: return
                  val opts = ArrayList<String>()
                  opts.add("مصدر بديل تلقائي")
                  opts.add("تجديد الرابط (create_link)")
                  opts.add("تحويل إلى http")
                  if (!live) opts.add("من البداية")
                  opts.add("تشخيص التشغيل")
                  AlertDialog.Builder(this).setTitle("الجودة والمصادر").setItems(opts.toTypedArray()) { _, i ->
