          fun Activity.io(work: () -> String?, cb: (String?, String?) -> Unit) {
              Bg.pool.execute {
                  var body: String? = null
                  var err: String? = null
                  try { body = work() } catch (t: Throwable) { err = t.javaClass.simpleName + ": " + (t.message ?: "") }
                  runOnUiThread { if (!isFinishing && !isDestroyed) cb(body, err) }
              }
