                                p.type = so.optString("type", "m3u")
                                p.url = so.optString("url")
                                p.user = so.optString("user")
                                p.pass = so.optString("pass")
                                p.mac = so.optString("mac")
                                if (p.url.isNotBlank()) sources.add(p)
                            }
                        }
                        val up = o.optJSONObject("update")
                        if (up != null && up.optString("url").startsWith("http")) {
                            val t = Ota()
                            t.code = up.optLong("code", 0)
                            t.name = up.optString("name")
                            t.url = up.optString("url")
                            t.note = up.optString("note")
