          | التطبيق يملأ الشاشة كليًا (بلا شريط حالة/تنقل، وخلف النوتش) | `Core.kt` → `Activity.goImmersive()` (نفسه على API 21–29 بـ `systemUiVisibility` وعلى 30+ بـ `WindowInsetsControllerCompat`) + `windowFullscreen` في `values/theme.xml` |
