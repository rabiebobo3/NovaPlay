              spType = findViewById(R.id.sp_type); etName = findViewById(R.id.et_name); etUrl = findViewById(R.id.et_url); etUser = findViewById(R.id.et_user); etPass = findViewById(R.id.et_pass); etMac = findViewById(R.id.et_mac)
              spType.adapter = ArrayAdapter(this, android.R.layout.simple_spinner_item, listOf("M3U / رابط","Xtream Codes","MAC Portal")).also { it.setDropDownViewResource(android.R.layout.simple_spinner_dropdown_item) }
              spType.onItemSelectedListener = object : android.widget.AdapterView.OnItemSelectedListener {
