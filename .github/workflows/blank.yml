name: NovaPlay_Kotlin_Full
# ============================================================================
#  NovaPlay / Rabie TV v8.42.20 — نسخة «مصغَّرة» للنسخ السهل (نفس المشروع حرفيًّا، بلا حذف أي ميزة)
#
#  لماذا؟ الملف العادي حجمه 792 كيلوبايت لأن كود المشروع مكتوب داخله كنصّ.
#  في هذه النسخة يُخزَّن نفس المشروع **مضغوطًا** (xz ثم base64) داخل خطوة التوليد،
#  فتُفكّ أثناء البناء وتُكتب نفس الملفات بالبايت ⇒ لا فرق في التطبيق الناتج أبدًا.
#
#  الحجم: 196 كيلوبايت بدل 792 (نصّ المشروع المضغوط داخله 125 كيلوبايت) | مطابق بالبايت للكاملة.
#
#  جديد 8.42.20 — إصلاحات التلفاز: لوحة ريموت داخل الشاشة · فوكس ثابت بلا توهج · ثيم أسود حقيقي:
#   • كل القوائم (الإعدادات · الضغط المطوّل · الحذف المتعدد) صارت لوحة واحدة داخل الشاشة نفسها
#     فوق المشغّل: حدّ فوكس واضح، تُغلق بزر الرجوع، ويكفي ↑↓ OK (كانت نوافذ AlertDialog لا تُنقل).
#   • الضغط المطوّل على قسم = ثلاثة أزرار على الريموت: ترتيب · حذف هذا القسم · حذف متعدد…
#   • «حذف متعدد» فيه زرّان: «حذف المحدد» و«حذف الكل» (ومثلهما في الإرجاع).
#   • حُذف كل توهج من الفوكس وبقي حدّ واضح، وأُلغي تكبير العنصر عند الفوكس وأُلغي محرّك العناصر
#     في القوائم ⇒ فوكس ثابت وسلس.
#   • الثيم الأسود صار أسود حقيقيًا (#000000) بكتابة بيضاء، وهو الافتراضي (والمارون والكريستال باقيان).
#   • خفّة: صور القوائم بحجم صغير بلا حركة (كانت تُفكّ بالحجم الكامل ⇒ تجمّد وامتلاء ذاكرة)،
#     وتهيئة التطبيق محميّة فلا يخرج عند أي فشل.
#
#  وكل ما في 8.42.8 — مسار الاكستريم كله صار بدوالك المرفقة (منقولة حرفيًّا):
#   • object Xtream8432: checkXtreamLogin · buildXtreamUrl · xtreamRequest · الأقسام الثلاثة ·
#     fetchXtreamContent · fetchXtreamLiveStreams · fetchXtreamSeriesInfo · playXtream* · buildMediaItem.
#
#  وكل ما في 8.42.6 (دوالك القديمة مطابقة بالبايت — بلا أي تعديل مني):
#   • class Xtream · loadXtream · appendCat · Catalog.clear · maybeFillCat: مطابقة بالبايت ✔
#     (تحقّق آلي حرفي في كل إصدار، ونتيجة 8.42.20 هي نفسها).
#   • القنوات في الجالب تُضاف بدالة جديدة appendLive8432 (الدالة الأصلية appendCat لم تُمسّ).
#
#  وكل ما في 8.42.5/8.42.4/8.42.3/8.42.2/8.42.1/8.42 (باختصار):
#   • دالة الجلب القديمة كما كانت (parseStreams بالحرف · urlVodInfo القديم · loadXtream سطر واحد).
#   • دوالك الأربع كانت في الإعدادات ثم حُذفت في 8.42.7 بطلبك، ثم صارت هي مسار الاكستريم في 8.42.20.
#   • مطابقة هوية التطبيق الآخر + اتصال واحد فقط + تشخيص الحجب (X-Ray) + عدّاد الانتظار عند 429.
#   • الأقسام/الفئات: اختيار أي فئة يجلب عناصرها فورًا من السيرفر بالـ category_id.
#
#  ومعها كل ميزات 8.41/8.40.10: الرجوع يعود دائمًا للواجهة الرئيسية · الثيم الثالث «أسود كريستالي
#  صافٍ» (مارون · كريستال · أسود) · الأقسام تظهر دائمًا · ALL قابل للحذف · «ترتيب سلس» بالريموت ·
#  لوحة التفاصيل الاحترافية · التركيز الدقيق · عجلة التحميل · إذن تثبيت التحديثات + توقيع ثابت.
#
#  للنسخة المقروءة (الكود ظاهر داخل الملف): استعمل NovaPlay_Kotlin_Full_TV84228.yml
# ============================================================================
on:
  push:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: novaplay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_NAME: "8.42.28"
      VERSION_CODE: "8441"
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # (8.42.15) كاش Gradle الرسمي: أدقّ وأسرع في البناءات المتكرّرة، وينظّف نفسه تلقائيًا.
    - name: Cache Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        cache-read-only: false

    - name: Setup Android SDK
      run: |
        set -e
        if [ -z "${ANDROID_HOME:-}" ]; then export ANDROID_HOME="$HOME/android-sdk"; fi
        echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
        SDKM="$(command -v sdkmanager || true)"
        if [ -z "$SDKM" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"; fi
        if [ -z "$SDKM" ]; then
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -sSLo /tmp/clt.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q -o /tmp/clt.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest" 2>/dev/null || true
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
        fi
        yes | "$SDKM" --licenses >/dev/null 2>&1 || true
        "$SDKM" "platform-tools" "platforms;android-34" "build-tools;34.0.0" 2>&1 | tail -3 || echo "WARN: تعذّر تثبيت حزم SDK — سنستخدم ما هو مثبّت مسبقًا على الجهاز"

