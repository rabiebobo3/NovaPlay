          mkdir -p $(dirname app/src/main/java/com/nova/play/Server.kt)
          cat > app/src/main/java/com/nova/play/Server.kt <<'NOVA_EOF'
          package com.nova.play

          /**
           * سيرفر يدوي — كلاس عادي (ليس data class) للحفاظ على سلوك المقارنة بالمرجع.
           */
          class Server {

              var id: String = ""
              var name: String = ""
              var type: String = TYPE_XTREAM
              var host: String = ""
              var port: String = "8080"
              var user: String = ""
              var pass: String = ""
              var m3uUrl: String = ""

              fun isXtream(): Boolean = type != TYPE_M3U

              /** عنوان أساسي نظيف: http://host:port */
              fun baseUrl(): String {
                  if (!isXtream()) {
                      // الرابط الكامل لملف M3U: نأخذ منه الجزء قبل get.php
                      val u = m3uUrl.trim()
                      val idx = u.indexOf("/get.php")
                      return if (idx > 0) u.substring(0, idx) else u
                  }
                  var h = host.trim()
                  if (h.isEmpty()) return ""
                  if (!h.startsWith("http://") && !h.startsWith("https://")) h = "http://$h"
                  h = if (h.endsWith("/")) h.substring(0, h.length - 1) else h
                  val p = port.trim()
                  val hostPart = h.substringAfter("://")
                  val hostHasPort = hostPart.split(":").size > 1 && hostPart.substringAfter(":").isNotEmpty()
                  return if (hostHasPort || p.isEmpty()) h else "$h:$p"
              }

              /** رابط M3U الكامل (يُبنى تلقائياً في وضع Xtream) */
              fun fullM3uUrl(): String {
                  if (!isXtream()) return m3uUrl.trim()
                  val b = baseUrl()
                  if (b.isEmpty()) return ""
                  return "$b/get.php?username=$user&password=$pass&type=m3u_plus&output=ts"
              }

              /** وصف مختصر للعرض */
              fun summary(): String {
                  return if (isXtream()) "Xtream • ${baseUrl()}" else "M3U • ${m3uUrl.trim()}"
              }

              companion object {
                  const val TYPE_XTREAM = "xtream"
                  const val TYPE_M3U = "m3u"
              }
          }
          NOVA_EOF

