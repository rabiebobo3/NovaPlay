            /* ------------------------------ الإعدادات ------------------------------ */

            private fun settingsDialog() {
                val items = mutableListOf(
                    if (sp.b("img", true)) "☑ صور الأفلام والمسلسلات" else "☐ صور الأفلام والمسلسلات",
                    "عمق الجلب: " + depthLabel(),
                    "نسبة الصورة: " + ratioLabel(),
                    "إعادة تحميل القائمة (تحديث)",
                    "تغيير/إضافة سيرفر",
                    "رابط إعدادات السيرفر (JSON)",
                    "سجل الأخطاء",
                    "التحقق من التحديث",
                    "مسح الكاش (" + fmtBytes(Disk.size(this)) + ")",
                    "حول التطبيق"
                )
                if (Cloud.ready() || sp.b("cloud", false)) items.add(if (Cloud.ready()) "الحساب السحابي: متصل" else "الحساب السحابي: غير متصل")
                pickDialog("الإعدادات", items) { i ->
                    when (i) {
                        0 -> { sp.put("img", !sp.b("img", true)); Config.img = sp.b("img", true); toast(if (sp.b("img", true)) "الصور: مفعّلة" else "الصور: متوقفة") }
                        1 -> {
                            val cur = sp.i("depth", 1)
                            val next = (cur + 1) % 3
                            sp.put("depth", next); Config.depth = next
                            Catalog.resetBuckets()
                            toast("عمق الجلب: " + depthLabel())
                        }
                        2 -> cycleResize()
                        3 -> reload(true)
                        4 -> showSetup()
                        5 -> inputDialog("رابط إعدادات السيرفر", "https://.../nova.json", sp.s("cfg_url")) { v, _ ->
                            sp.put("cfg_url", v.trim())
                            Config.load(this) { ok -> toast(if (ok) "تم جلب الإعدادات" else "تعذّر الجلب"); applyServerConfig() }
                        }
                        6 -> showLog()
                        7 -> checkUpdate(true)
                        8 -> { Disk.clear(this); toast("تم مسح الكاش"); refreshHome() }
                        9 -> infoDialog("NovaPlay", "نسخة التلفزيون الخفيفة 9.0\n" + appVersion(this) + "\nيعمل مع M3U و Xtream و بوابات MAC.")
                        10 -> cloudDialog()
                    }
                }
            }

            private fun depthLabel() = when (sp.i("depth", 1)) { 0 -> "صفحة واحدة (الأخف)"; 1 -> "5 صفحات"; else -> "كل الصفحات" }

            private fun ratioLabel(mode: String = sp.s("rm", "1")) = when (mode) {
                "1" -> "تمديد (ملء الشاشة)"
                "2" -> "ملاءمة"
                "3" -> "تكبير"
                else -> "ملاءمة"
            }

            private fun cycleResize() {
                val order = listOf("1", "2", "3")
                val cur = sp.s("rm", "1")
                val next = order[(order.indexOf(cur) + 1) % order.size]
                sp.put("rm", next)
                toast("نسبة الصورة: " + ratioLabel(next))
            }

            private fun cloudDialog() {
                inputDialog("الحساب السحابي", "اسم المستخدم", sp.s("auth_user"), "كلمة المرور", "",
                    if (Cloud.ready()) "الحالة: متصل" else "الحالة: غير متصل — فعّله من الإعدادات") { u, p ->
                    if (u.isBlank()) { Cloud.logout(this); return@inputDialog }
                    Cloud.login(this, u, p) { ok, msg -> toast(msg) }
                }
            }

            /* ------------------------------ التحديث ------------------------------ */

            private fun checkUpdate(manual: Boolean) {
                Update.find(this) { ota ->
                    if (ota == null) {
                        if (manual) toast("أنت على أحدث إصدار")
                        return@find
                    }
                    AlertDialog.Builder(this).setTitle("تحديث " + ota.name)
                        .setMessage(ota.note.ifBlank { "تنزيل وتثبيت التحديث الآن؟" })
                        .setPositiveButton("تنزيل") { d, _ -> d.dismiss(); downloadUpdate(ota) }
                        .setNegativeButton("لاحقًا", null)
                        .show()
                }
            }

            private fun downloadUpdate(ota: Ota) {
                val v = LinearLayout(this)
                v.orientation = LinearLayout.VERTICAL
                v.setPadding(48, 32, 48, 16)
                val pb = ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal)
                pb.max = 100
                val tv = TextView(this)
                tv.setTextColor(resources.getColor(R.color.np_text_dim))
                v.addView(pb, LinearLayout.LayoutParams(-1, -2))
                v.addView(tv, LinearLayout.LayoutParams(-1, -2))
                val dlg = AlertDialog.Builder(this).setTitle("تنزيل التحديث").setView(v).setCancelable(false).show()
                Bg.run {
                    try {
                        val bytes = Http.bytes(ota.url) { got, total ->
                            Bg.ui {
                                pb.progress = if (total > 0) (got * 100 / total).toInt() else 0
                                tv.text = fmtBytes(got)
                            }
                        }
                        val f = File(getExternalCacheDir() ?: cacheDir, "update/nova-update.apk")
                        f.parentFile?.mkdirs()
                        f.writeBytes(bytes)
                        Bg.ui { dlg.dismiss(); installApk(f) }
                    } catch (t: Throwable) {
                        Diag.e(t)
                        Bg.ui { dlg.dismiss(); toast("فشل التنزيل: " + (t.message ?: "")) }
                    }
                }
            }

            private fun installApk(f: File) {
                try {
                    if (android.os.Build.VERSION.SDK_INT >= 26 && !packageManager.canRequestPackageInstalls()) {
                        startActivity(Intent(android.provider.Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES, Uri.parse("package:$packageName")))
                        toast("اسمح بالتثبيت من مصادر مجهولة ثم أعد المحاولة")
                        return
                    }
                    val uri = FileProvider.getUriForFile(this, "$packageName.provider", f)
                    val i = Intent(Intent.ACTION_VIEW).setDataAndType(uri, "application/vnd.android.package-archive")
                        .addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION or Intent.FLAG_ACTIVITY_NEW_TASK)
                    startActivity(i)
                } catch (t: Throwable) {
                    Diag.e(t)
                    toast("تعذّر فتح التثبيت")
                }
            }

            /* ------------------------------ السجل ------------------------------ */

            private fun showLog() {
                val text = "NovaPlay " + appVersion(this) + "\n" + Diag.text()
                AlertDialog.Builder(this).setTitle("سجل الأخطاء").setMessage(text.takeLast(6000))
                    .setPositiveButton("مشاركة") { d, _ -> d.dismiss(); share(text) }
                    .setNeutralButton("نسخ") { d, _ -> d.dismiss(); copy(text) }
                    .setNegativeButton("مسح") { d, _ -> d.dismiss(); Diag.clear(this); toast("مُسح السجل") }
                    .show()
            }

            private fun share(text: String) {
                try {
                    val i = Intent(Intent.ACTION_SEND)
                    i.type = "text/plain"
                    i.putExtra(Intent.EXTRA_SUBJECT, "NovaPlay log")
                    i.putExtra(Intent.EXTRA_TEXT, text)
                    startActivity(Intent.createChooser(i, "إرسال السجل"))
                } catch (t: Throwable) { copy(text) }
            }

            private fun copy(text: String) {
                try {
                    val cm = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                    cm.setPrimaryClip(ClipData.newPlainText("NovaPlay", text))
                    toast("نُسخ السجل — الصقه في أي تطبيق")
                } catch (t: Throwable) { toast("تعذّر النسخ") }
            }

            /* ------------------------------ المفاتيح ------------------------------ */

            override fun onKeyDown(keyCode: Int, event: android.view.KeyEvent): Boolean {
                when (keyCode) {
                    android.view.KeyEvent.KEYCODE_MENU, android.view.KeyEvent.KEYCODE_SETTINGS -> {
                        if (setupBox.visibility != View.VISIBLE) settingsDialog()
                        return true
                    }
                    android.view.KeyEvent.KEYCODE_BACK -> {
                        if (setupBox.visibility == View.VISIBLE && Catalog.loaded) { showHome(); return true }
                    }
                }
                return super.onKeyDown(keyCode, event)
            }
        }

        /* ------------------------------ البحث عن تحديث ------------------------------ */

        object Update {
            fun find(ctx: Context, cb: (Ota?) -> Unit) {
                val mine = appCode(ctx)
                Config.update?.let {
                    if (it.valid() && it.code > mine) { cb(it); return }
                }
                Cloud.findUpdate { o ->
                    if (o != null && o.valid() && o.code > mine) cb(o) else cb(null)
                }
            }
        }
