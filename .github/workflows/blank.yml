          mkdir -p $(dirname .gitignore)
          cat > .gitignore <<'NOVA_EOF'
          *.iml
          .gradle/
          /local.properties
          /.idea/
          .DS_Store
          /build
          /app/build
          /captures
          .externalNativeBuild
          .cxx
          /out
          project.tar.gz
          project.tar.gz.b64
          *.apk
          NOVA_EOF

          mkdir -p $(dirname MIGRATION_NOTES.md)
          cat > MIGRATION_NOTES.md <<'NOVA_EOF'
          # تقرير التحويل — NovaPlay (Kotlin · بدون Firebase)

          **التاريخ:** 2026-09-18 · **الإصدار:** 139.0-NovaPlay · **الحزمة:** `com.nova.play`

          ---

          ## 1) ما تم إنجازه

          | البند | الحالة |
          |---|---|
          | تطبيق Kotlin كامل (19 ملف، ~2,000 سطر) | ✅ |
          | بدون Firebase (لا حزم، لا `google-services.json`، لا خدمة FCM) | ✅ |
          | إدخال السيرفرات يدويًا (Xtream + M3U) مع اختبار اتصال | ✅ |
          | المشغّل بنفس إعدادات ExoPlayer الأصلية | ✅ |
          | الموارد (Layouts / Drawables / Themes / أيقونة) | ✅ |
          | ورك فلو واحد يبني Debug + Release وينشر Release | ✅ |
          | مفتاح توقيع ثابت مرفق بالمشروع | ✅ |

          ### إعدادات المشغّل المحفوظة كما هي
          - `DefaultLoadControl(3000, 20000, 800, 1500)` + **backBuffer 2000 مللي** (retain from keyframe).
          - تزايد البحث ±10000 مللي (`setSeekBackIncrementMs` / `setSeekForwardIncrementMs`).
          - `mimeType` يُضبط فقط عند `m3u8` أو `mpd`.
          - إعادة محاولة بعد **2000 مللي** عند الخطأ، ثم الانتقال للقناة التالية بعد 3 محاولات.
          - **نبضة كل 1000 مللي** + **مراقب توقف 15 ثانية** → إعادة تشغيل تلقائي.
          - حفظ الموضع في `pos_<hash(url)>`: يُستأنف فقط إذا كان أكبر من **10 ثوانٍ** ويُتجاهل قرب النهاية (آخر 15 ثانية → يُمسح).
          - تبديل `PlayerView` صغير/كامل مع `setPlayer(null)`.
          - طابور الشبكة: `RequestQueue(NoCache(), BasicNetwork(HurlStack()), 6)` + وسم `REQUEST_TAG` + `DefaultRetryPolicy` موحّد.
          - `CrashGuard` (تقرير في `crash_last.txt` + إعادة تشغيل بعد 1.2 ثانية) و`MemoryManager` (تنظيف الكاش كل 10 دقائق مع الحفاظ على ملف التحديث).

          ---

          ## 2) التحقق الذي تم فعليًا

          | الاختبار | النتيجة |
          |---|---|
          | `:app:processDebugResources` (كل الموارد والـ Manifest) | ✅ نجح |
          | **تصريف Kotlin لكل الملفات** | ✅ **صفر أخطاء** — 19 ملفًا أُنتجت 69 كلاس (يشمل الفئات الداخلية والـ lambdas) |
          | مطابقة `R.*` المستعملة في الكود ↔ الموارد الموجودة | ✅ صفر ناقص |
          | صلاحية كل ملفات XML (55 ملفًا) قبل وبعد التضمين | ✅ |
          | فك تضمين الورك فلو (base64 → tar) وتشغيل خطوته فعليًا | ✅ 91 ملفًا، المفتاح مطابق بايت-ببايت |
          | التحقق من YAML وصلاحية الخطوات التسع | ✅ |

          **ملاحظة صريحة:** بناء ملف APK الكامل داخل بيئة الاختبار توقّف عند مرحلة تصنيع الـ dex بسبب **نقص الذاكرة في بيئة الاختبار** (خُنق العامل JVM من قِبَل نظام التشغيل: 1.9 GB RAM فقط). هذا قيد البيئة لا قيد الكود — تصريف Kotlin والموارد نجح بالكامل، و runners على GitHub توفر 7 GB+ لذا سيكتمل البناء هناك.

          ### خطأ API حقيقي وُجد وأُصلح
          في Media3 1.2.1 لا توجد `ExoPlayer.setBackBuffer(...)`؛ المكان الصحيح هو:
          ```kotlin
          DefaultLoadControl.Builder()
              .setBufferDurationsMs(3000, 20000, 800, 1500)
              .setBackBuffer(2000, true)   // نفس المعنى تماماً
              .build()
          ```
          (تم التحقق من الـ API بـ `javap` على مكتبة media3-exoplayer-1.2.1.aar.)

          ---

          ## 3) ما تغيّر عن Rabie Pro v138 (بسبب إلغاء Firebase — كما طلبت)

          | في الأصل | في NovaPlay |
          |---|---|
          | دخول بكلمة سر من قاعدة البيانات + حجب/انتهاء اشتراك | كلمة سر محلية اختيارية (`Config.DEFAULT_APP_PASSWORD` / شاشة السيرفرات) |
          | قائمة سيرفرات سحابية + `settings.msg` + `m3u_url` | إدخال يدوي بالكامل (Xtream / M3U) |
          | إشعارات FCM | مُلغاة |
          | تحديث OTA عبر عقد `app_apk` / `app_update` | تحديث اختياري عبر رابط مباشر + **فحص اسم الحزمة قبل التثبيت** |
          | `AdminActivity` (لوحة تحكم) | مُلغاة (لا معنى لها بدون قاعدة بيانات) |
          | Chromecast (CastOptionsProvider + CC1AD845) | لم يُدرج في هذه النسخة (يمكن إرجاعه في ~10 دقائق إن أردت) |

          كل ما سواه محفوظ: القنوات، الأفلام، المسلسلات والحلقات، التصنيفات، البحث، المفضلة، متابعة المشاهدة، الاستئناف، الريموت، شاشة أفقية.

          ---

          ## 4) للوصول إلى «نفس التطبيق» حرفيًا

          عند إرسال ملف مشروعك الأصلي (`Rabie_Pro_v138_SmartLoad.yml` أو الـ ZIP) سأقوم بـ:
          1. فك ملفَي `MainActivity.java` و`HomeActivity.java` (gzip+base64) والتأكد بـ hash.
          2. تحويلهما إلى Kotlin **بنفس أسماء الدوال والحقول والمتغيرات**، ونفس ترتيب المنطق، مع `object :` للفئات المجهولة.
          3. إبقاء كل الموارد كما هي حرفيًا (نفس `R.id` / `R.layout` / `R.string`).
          4. استبدال قراءة/كتابة Firebase بـ `ServerStore` / `HistoryStore` **بنفس أسماء الدوال** قدر الإمكان.
          5. مطابقة آلية: جرد دوال Java ↔ دوال Kotlin = **صفر دالة ناقصة**.

          ---

          ## 5) قائمة فحص على الهاتف (بعد تثبيت الـ APK)

          1. يفتح التطبيق على شاشة الإضافة (أول تشغيل) → أدخل سيرفر Xtream واختبر الاتصال.
          2. تبويب **مباشر** → اختر تصنيفًا → شغّل قناة.
          3. أثناء التشغيل جرّب: ⏸ / ⏪⏩ / ملء الشاشة / قائمة القنوات.
          4. اخرج من التطبيق منتصف فيلم ثم أعد التشغيل من **متابعة المشاهدة** → يجب أن يبدأ من الموضع السابق.
          5. اضغط ⭐ في المشغّل → يجب أن تظهر في **المفضلة**.
          6. أضف سيرفر M3U ثانيًا وبدّل بينهما من شاشة السيرفرات.
          7. اترك التطبيق يعمل 10 دقائق → التنظيف التلقائي للكاش يعمل دون توقف التشغيل.
          NOVA_EOF

          mkdir -p $(dirname README_AR.md)
          cat > README_AR.md <<'NOVA_EOF'
          # NovaPlay — دليل كامل (Kotlin · بدون Firebase)

          تطبيق IPTV مكتوب بالكامل بـ **Kotlin**، بدون أي ربط بـ Firebase، وكل سيرفراتك تُدخلها **يدويًا** داخل التطبيق.
          مصمّم ليعمل **جنب** تطبيقك القديم على نفس الهاتف حتى تقارن بينهما.

          | العنصر | القيمة |
          |---|---|
          | اسم الحزمة | `com.nova.play` |
          | اسم التطبيق | NovaPlay |
          | versionCode / versionName | `139` / `139.0-NovaPlay` |
          | أقل إصدار أندرويد | 21 (Android 5) |
          | هدف البناء | 34 (Android 14) |
          | المشغّل | Media3 ExoPlayer 1.2.1 |
          | التوقيع | مفتاح ثابت مرفق بالمشروع (`app/debug.keystore`) |

          ---

          ## 1) كيف تبني التطبيق على GitHub (طريقة واحدة فقط)

          1. أنشئ مستودعًا جديدًا (يمكن أن يكون خاصًا/Private).
          2. ارفع ملف `.github/workflows/novaplay.yml` كما هو إلى هذا المسار داخل المستودع:
             `.github/workflows/novaplay.yml`
          3. اذهب إلى تبويب **Actions** ← اختر «NovaPlay Build» ← **Run workflow**.
          4. انتظر ~5 دقائق، وستحصل على:

          | الناتج | المكان |
          |---|---|
          | **كل ملفات المشروع** (`app/` + `build.gradle` + `settings.gradle` + المفتاح…) | تظهر **داخل المستودع نفسه** بعد الرفع التلقائي (commit + push) |
          | `NovaPlay-v139-debug.apk` و `NovaPlay-v139-release.apk` | تبويب **Actions → Artifacts** |
          | نفس الملفات + أرشيف الكود | تبويب **Releases** → `v139.0-NovaPlay` |

          > الورك فلو **يولّد المشروع كاملاً بنفسه** (كل ملفات Kotlin والموارد والمفتاح) ثم يبنيه ثم يرفع الملفات إلى المستودع.
          > لا تحتاج إلى رفع أي كود بنفسك.
          >
          > عند التشغيل اليدوي (Run workflow) يظهر خيار `commit_files` — اتركه `true` لرفع الملفات إلى المستودع، أو `false` إن أردت الاكتفاء بالـ APK.
          > الرسالة `push` تحمل `[skip ci]` حتى لا يعيد تشغيل نفسه بلا نهاية.


          ## 2) البناء على جهازك (اختياري)

          افتح المجلد `novaplay` في **Android Studio** (Ladybug أو أحدث) أو نفّذ:

          ```bash
          ./gradlew :app:assembleDebug     # أو :app:assembleRelease
          ```

          المتطلبات: JDK 17، Android SDK 34.

          ---

          ## 3) الاستعمال — إدخال السيرفرات يدويًا

          **أول تشغيل:** يفتح لك التطبيق نموذج إضافة سيرفر مباشرة.

          | النوع | ما تحتاج إدخاله |
          |---|---|
          | **Xtream Codes** | العنوان (Host أو IP) + المنفذ (عادة 8080) + اسم المستخدم + كلمة السر |
          | **رابط M3U** | الرابط الكامل (ينتهي بـ `get.php?...&type=m3u_plus` أو ملف `.m3u`) |

          - زر **اختبار الاتصال** يتحقق من السيرفر قبل الحفظ.
          - من زر **السيرفرات** في الأعلى (أو من شاشة الدخول) تستطيع: **إضافة / تعديل / حذف / اختبار / اختيار السيرفر النشط**.
          - كل شيء محفوظ في الهاتف (SharedPreferences) — يبقى بعد إغلاق التطبيق، ولا يحتاج إنترنت للقراءة.

          **كلمة سر التطبيق (اختيارية):** من شاشة «السيرفرات» → حقل كلمة السر → حفظ.
          اتركها فارغة إذا لا تريد شاشة قفل.

          **الشاشات:** مباشر · أفلام · مسلسلات · متابعة المشاهدة · المفضلة + بحث فوري + تصنيفات.
          اختيار مسلسل يعرض الحلقات، والاختيار يفتح المشغّل.

          **المشغّل:** تشغيل/إيقاف · ⏪⏩ ±10 ثوان · القناة السابقة/التالية · ملء الشاشة · قائمة القنوات الجانبية ·
          المفضلة · الرجوع للموضع المحفوظ تلقائيًا (فوق 10 ثوان، ويُتجاهل قرب النهاية) + شارة «متابعة» على البطاقة.

          ---

          ## 4) تعديلات سريعة

          | ما تريد تغييره | المكان |
          |---|---|
          | اسم التطبيق الظاهر | `res/values/strings.xml` → `app_name` |
          | ألوان الواجهة (الذهبي/الأسود) | `res/values/colors.xml` |
          | رقم الإصدار | `app/build.gradle` → `versionCode` / `versionName` (وحدّثها أيضًا في ملف الورك فلو) |
          | اسم الحزمة | `app/build.gradle` → `applicationId` + `AndroidManifest.xml` (لاحظ أن تغيير الحزمة = تطبيق جديد) |
          | رابط التحديث | `Config.kt` → `DEFAULT_UPDATE_URL` (أو أضف حقلًا في الإعدادات) |
          | حدّ حجم القوائم/التحميل | `Config.kt` |

          ---

          ## 5) ملاحظات وحدود (مهمة)

          1. **بدون Firebase** — لا حسابات مشتركة، لا سيرفرات سحابية، لا إشعارات Push، لا تثبيت تحديث عن بُعد.
             وهذا مقصود كما طلبت.
          2. **التحديث** يعمل فقط إذا وضعت رابط APK مباشرًا؛ وقبل التثبيت يتحقق التطبيق من أن **اسم الحزمة هو نفسه**
             (`com.nova.play`) وإلا يرفض التثبيت — حماية من تثبيت ملف غريب.
          3. **التثبيت جنب تطبيقك القديم**: لأن اسم الحزمة مختلف، يتثبت تطبيقًا منفصلًا ولا يؤثر على القديم.
          4. **لا يؤثر على اشتراكاتك**: أنت من يدخل بيانات السيرفر، فلا شيء يتغير على السيرفر.
          5. **الموارد المستعملة**: Media3 (ExoPlayer) + Volley + Gson + Glide + AppCompat. لا مكتبات ثقيلة.
          6. **الشاشة أفقية** (Landscape) مثل تطبيقات التلفزيون/الأندرويد TV، وتدعم الريموت (تركيز + أزرار DPAD).

          ## 6) الملفات المهمة

          ```
          app/src/main/java/com/nova/play/
            LoginActivity.kt        شاشة الدخول + عرض السيرفر النشط
            ServerManagerActivity.kt  إضافة/تعديل/حذف/اختبار السيرفرات
            HomeActivity.kt         التصنيفات + القنوات + الأفلام + المسلسلات + البحث
            MainActivity.kt         المشغّل (نفس إعدادات ExoPlayer الأصلية)
            ServerStore.kt          تخزين السيرفرات محليًا
            HistoryStore.kt         المفضلة + متابعة المشاهدة + مواضع التوقف
            XtreamClient.kt         قراءة Xtream API
            M3uClient.kt            قراءة روابط M3U
            ChannelAdapter.kt / GroupAdapter.kt
            CrashGuard.kt           حفظ تقرير الخطأ + إعادة تشغيل تلقائية
            MemoryManager.kt        تنظيف الكاش كل 10 دقائق
            Config.kt               الإعدادات العامة
          ```
