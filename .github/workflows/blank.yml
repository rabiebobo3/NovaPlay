name: NovaPlay_v3_2_NovaLogin
on: [push, workflow_dispatch]
permissions:
  contents: write
  actions: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Build NovaPlay v3.2 NovaLogin
      run: |
        echo "org.gradle.jvmargs=-Xmx4096m" > gradle.properties
        echo "android.useAndroidX=true" >> gradle.properties
        echo "android.enableJetifier=true" >> gradle.properties
        mkdir -p app/src/main/java/com/nova/play app/src/main/res/layout app/src/main/res/drawable app/src/main/res/values app/src/main/res/mipmap-xxxhdpi ~/.android
        cat <<'NOVA_SETTINGS' > settings.gradle
        pluginManagement {
        repositories { google(); mavenCentral(); gradlePluginPortal() }
        plugins { id 'com.android.application' version '8.2.2'; id 'org.jetbrains.kotlin.android' version '1.9.22' }
        }
        dependencyResolutionManagement {
        repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
        repositories { google(); mavenCentral() }
        }
        rootProject.name = "NovaPlay"
        include ':app'
        NOVA_SETTINGS
        echo '' > app_src_main_res_mipmap-xxxhdpi_ic_launcher.png.b64
        echo '' >> app_src_main_res_mipmap-xxxhdpi_ic_launcher.png.b64
        echo '' >> app_src_main_res_mipmap-xxxhdpi_ic_launcher.png.b64
        echo '' >> app_src_main_res_mipmap-xxxhdpi_ic_launcher.png.b64
        echo '' >> app_src_main_res_mipmap-xxxhdpi_ic_launcher.png.b64
        base64 -d app_src_main_res_mipmap-xxxhdpi_ic_launcher.png.b64 > app/src/main/res/mipmap-xxxhdpi/ic_launcher.png && rm -f app_src_main_res_mipmap-xxxhdpi_ic_launcher.png.b64
        echo '' > nova_ks.b64
        echo '' | base64 -d > app/src/main/java/com/nova/play/MainActivity.kt.gz
        gunzip -c app/src/main/java/com/nova/play/MainActivity.kt.gz > app/src/main/java/com/nova/play/MainActivity.kt && rm -f app/src/main/java/com/nova/play/MainActivity.kt.gz
        echo '' | base64 -d > app/src/main/java/com/nova/play/StalkerClient.kt.gz
        gunzip -c app/src/main/java/com/nova/play/StalkerClient.kt.gz > app/src/main/java/com/nova/play/StalkerClient.kt && rm -f app/src/main/java/com/nova/play/StalkerClient.kt.gz
        cat <<'NOVA_EOF_001' > app/build.gradle
        plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
        android {
        namespace 'com.nova.play'
        compileSdk 34
        defaultConfig { applicationId "com.nova.play"; minSdk 21; targetSdk 34; versionCode 7; versionName "3.4-LoginCompact" }
        buildTypes { release { minifyEnabled false } }
        compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
        kotlinOptions { jvmTarget = '1.8' }
        }
        dependencies {
        implementation 'androidx.appcompat:appcompat:1.6.1'
        implementation 'androidx.recyclerview:recyclerview:1.3.2'
        implementation 'androidx.media3:media3-exoplayer:1.2.1'
        implementation 'androidx.media3:media3-exoplayer-hls:1.2.1'
        implementation 'androidx.media3:media3-ui:1.2.1'
        implementation 'com.squareup.okhttp3:okhttp:4.12.0'
        }
        NOVA_EOF_001
        cat <<'NOVA_EOF_002' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
        <uses-permission android:name="android.permission.INTERNET"/>
        <uses-feature android:name="android.software.leanback" android:required="false"/>
        <uses-feature android:name="android.hardware.touchscreen" android:required="false"/>
        <application android:hardwareAccelerated="true" android:label="NovaPlay Kotlin" android:icon="@mipmap/ic_launcher" android:usesCleartextTraffic="true" android:supportsRtl="true" android:theme="@style/Theme.Nova">
        <activity android:name=".MainActivity" android:exported="true" android:launchMode="singleTask" android:screenOrientation="landscape" android:configChanges="orientation|screenSize|keyboardHidden">
        <intent-filter>
        <action android:name="android.intent.action.MAIN"/>
        <category android:name="android.intent.category.LAUNCHER"/>
        <category android:name="android.intent.category.LEANBACK_LAUNCHER"/>
        </intent-filter>
        </activity>
        </application>
        </manifest>
        NOVA_EOF_002
        cat <<'NOVA_EOF_003' > app/src/main/res/layout/activity_main.xml
