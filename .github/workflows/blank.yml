name: NovaPlay_Kotlin_Full
# ============================================================================
#  NovaPlay / Rabie TV v8.42.5 — نسخة «مصغَّرة» للنسخ السهل (نفس المشروع حرفيًّا، بلا حذف أي ميزة)
#
#  لماذا؟ الملف العادي حجمه 669 كيلوبايت لأن كود المشروع مكتوب داخله كنصّ.
#  في هذه النسخة يُخزَّن نفس المشروع **مضغوطًا** (xz ثم base64) داخل خطوة التوليد،
#  فتُفكّ أثناء البناء وتُكتب نفس الملفات بالبايت ⇒ لا فرق في التطبيق الناتج أبدًا.
#
#  الحجم: 168 كيلوبايت بدل 669 (نصّ المشروع المضغوط داخله 138 كيلوبايت) | مطابق بالبايت للكاملة.
#
#  جديد 8.42.5 (دوالك القديمة رجعت حرفيًّا بلا أي تعديل):
#   • parseStreams: c.url = x.liveUrl(id) · c.alt = x.liveTs(id) كما كانت بالحرف، وحُذف سطر catId.
#   • urlVodInfo رجع get_vod_streams&stream_id · loadXtream رجع سطرًا واحدًا كما كان.
#   • maybeFillCat رجعت حرفيًّا (لا طلب من السيرفر عند اختيار قسم) · ولا جلب عند اختيار قسم قنوات.
#   • وبقيت دوالك الأربع (الإعدادات ← تحديث Xtream بالدوال الجديدة) + «تجهيز محتوى كل الأقسام».
#
#  وكل ما في 8.42.4 (دوال Xtream التي أرسلتها + ربطها بالجالب القديم):
#   • دوالك الأربع (authenticateXtreamApi · loadXtreamCategories · movie/series categories) منقولة إلى
#     الكوتلن بنفس الطلبات ونفس الرسائل العربية، وتُثبّت الأقسام في بنية التطبيق نفسها.
#   • البند «تحديث Xtream بالدوال الجديدة» شغّلها الآن، و«تجهيز محتوى كل الأقسام» يجلب محتوى كل
#     قسم عبر الجالب القديم (Loader.xFillCat) قسمًا كل ثانيتين ⇒ الأقسام و«ALL» تمتلئ.
#
#  وكل ما في 8.42.3 (بصمة الجهاز — لماذا يعمل التطبيق الآخر؟):
#   • «ترويسات مخصّصة»: اكتب أي ترويسة يرسلها التطبيق الآخر (X-Device-Id · Referer …)
#     فتُرسَل مع كل الطلبات (قوائم + بث + فحص) ⇒ تصبح بصمتنا مطابقة للجهاز المسجَّل.
#   • «فحص الوكلاء تلقائيًا»: يجرّب 26 وكيلًا حقيقيًا لمشغّلات IPTV ويتوقّف عند أول ردّ 200 ويحفظه.
#   • كل نتيجة تُسجَّل في سجل الأعطال (PROBE/XBIO).
#
#  وكل ما في 8.42.2 (تشخيص الحجب + عدّاد انتظار):
#   • «X-Ray» يفحص الآن المصادقة أيضًا: HTTP + حالة الحساب + الصيغ المسموحة + حدّ الاتصالات +
#     «الاتصالات النشطة الآن» + عمر بيانات القنوات (كاش/سيرفر) ⇒ يوضّح هل الحجب شامل أم على البث فقط.
#   • عند 429: عدّ تنازلي واضح (10 دقائق، تتضاعف حتى 30) + محاولة تلقائية واحدة عند الانتهاء،
#     وبلا أي طلب أثناء الحجب (كل محاولة تُجدّده)، وزر «إعادة المحاولة» اليدوي يبقى متاحًا.
#
#  وكل ما في 8.42.1 (مطابقة التطبيق الآخر + اتصال واحد فقط):
#   • «وكيل المستخدم» 11 خيارًا + وكيل مخصّص تكتبه بنفسك ⇒ اجعله نفس وكيل التطبيق الآخر الذي يعمل.
#   • «إعادة استخدام الاتصال» مغلق افتراضيًا (كل طلب يُغلق اتصاله) ⇒ لا يُحسب اتصالًا ثانيًا على السيرفر.
#   • 401/403: يُجرَّب الرابط البديل كما قبل 8.42 (429 لا يفتح أي اتصال جديد).
#   • قسم فشل جلبه يمكن إعادة محاولته بنقرة أخرى.
#
#  وكل ما في 8.42 (إصلاح Xtream الذي كان يظهر ولا يعمل + الفئات التي لا يظهر محتواها):
#   • صيغة البث: تُقرأ allowed_output_formats من السيرفر ويُبنى رابط القناة بالصيغة المسموحة
#     (ts أولًا — وهي التي تعمل في التطبيقات الأخرى)، والبديلة جاهزة إن فشلت.
#   • إغلاق اتصال البث فعليًا عند الخروج للخلفية (كان pause فقط) ⇒ لا يبقى اتصال قائم يحسبه
#     السيرفر «مشاركة حساب» ويردّ 401/429 على التشغيل التالي (sيرفرك max_connections = 1).
#   • رسالة عربية واضحة لردود 401/429/403 تقرأ X-Firewall-Reason + محاولة واحدة بعد 12 ثانية
#     + «تشخيص الرابط (X-Ray)» من قائمة القناة (استمر بالضغط ← X-Ray).
#   • بند «وكيل المستخدم (User-Agent)» في الإعدادات: التطبيق · VLC · IPTV Smarters · TiviMate.
#   • الأقسام/الفئات: اختيار أي فئة في الأفلام أو المسلسلات أو القنوات يجلب عناصرها فورًا من
#     السيرفر بالـ category_id مع عدّاد ومؤشر انتظار (كانت تعمل لبوابات MAC فقط ⇒ تظهر فارغة).
#   • حفظ category_id لكل عنصر + إصلاح رابط تفاصيل الفيلم (get_vod_info).
#
#  ومعها كل ميزات 8.41/8.40.10: الرجوع يعود دائمًا للواجهة الرئيسية · الثيم الثالث «أسود كريستالي
#  صافٍ» (مارون · كريستال · أسود) · الأقسام تظهر دائمًا · ALL قابل للحذف · «ترتيب سلس» بالريموت ·
#  لوحة التفاصيل الاحترافية · التركيز الدقيق · عجلة التحميل · إذن تثبيت التحديثات + توقيع ثابت.
#
#  للنسخة المقروءة (الكود ظاهر داخل الملف): استعمل NovaPlay_Kotlin_Full_TV8425.yml
# ============================================================================
on:
  push:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: novaplay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_NAME: "8.42.5"
      VERSION_CODE: "8417"
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-nova-${{ hashFiles('**/*.gradle*', 'gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-nova-

    - name: Setup Android SDK
      run: |
        set -e
        if [ -z "${ANDROID_HOME:-}" ]; then export ANDROID_HOME="$HOME/android-sdk"; fi
        echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
        SDKM="$(command -v sdkmanager || true)"
        if [ -z "$SDKM" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"; fi
        if [ -z "$SDKM" ]; then
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -sSLo /tmp/clt.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q -o /tmp/clt.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest" 2>/dev/null || true
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
        fi
        yes | "$SDKM" --licenses >/dev/null 2>&1 || true
        "$SDKM" "platform-tools" "platforms;android-34" "build-tools;34.0.0" 2>&1 | tail -3 || echo "WARN: تعذّر تثبيت حزم SDK — سنستخدم ما هو مثبّت مسبقًا على الجهاز"

