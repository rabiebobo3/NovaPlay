       fun fmtTime(ms: Long): String {
         if (ms <= 0 || ms == Long.MIN_VALUE) return "0:00"
         val total = ms / 1000
         val h = total / 3600
         val m = (total % 3600) / 60
         val s = total % 60
         return if (h > 0) String.format("%d:%02d:%02d", h, m, s) else String.format("%d:%02d", m, s)
       }

       fun fmtBytes(n: Long): String = when {
         n <= 0 -> "0 B"
         n < 1024 -> "$n B"
         n < 1048576 -> String.format("%.1f KB", n / 1024.0)
         n < 1073741824 -> String.format("%.1f MB", n / 1048576.0)
         else -> String.format("%.2f GB", n / 1073741824.0)
       }

