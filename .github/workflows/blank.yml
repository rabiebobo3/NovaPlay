          mkdir -p $(dirname app/src/main/AndroidManifest.xml)
          cat > app/src/main/AndroidManifest.xml <<'NOVA_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />

              <uses-feature android:name="android.software.leanback" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />

              <application
                  android:name=".NovaApp"
                  android:allowBackup="true"
                  android:hardwareAccelerated="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:largeHeap="true"
                  android:networkSecurityConfig="@xml/network_security_config"
                  android:supportsRtl="false"
                  android:theme="@style/NovaGoldTheme"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name=".LoginActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:screenOrientation="landscape">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <activity
                      android:name=".HomeActivity"
                      android:exported="false"
                      android:launchMode="singleTask"
                      android:screenOrientation="landscape" />

                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout"
                      android:exported="false"
                      android:launchMode="singleTop"
                      android:screenOrientation="landscape" />

                  <activity
                      android:name=".ServerManagerActivity"
                      android:exported="false"
                      android:screenOrientation="landscape" />

                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>

              </application>
          </manifest>
          NOVA_EOF

          mkdir -p $(dirname build.gradle)
          cat > build.gradle <<'NOVA_EOF'
          // NovaPlay - root build file  (NO Firebase, standalone)
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }

          tasks.register('clean', Delete) {
              delete rootProject.buildDir
          }
          NOVA_EOF

          mkdir -p $(dirname gradle.properties)
          cat > gradle.properties <<'NOVA_EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          org.gradle.parallel=true
          android.useAndroidX=true
          android.nonTransitiveRClass=false
          kotlin.code.style=official
          NOVA_EOF

          mkdir -p $(dirname settings.gradle)
          cat > settings.gradle <<'NOVA_EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "NovaPlay"
          include ':app'
          NOVA_EOF
          echo "✅ تم إنشاء ملفات البناء"

      - name: Build Debug + Release APK — بناء التطبيق
        run: |
          set -e
          gradle :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace

      - name: Collect APKs — تجميع الملفات
        run: |
          set -e
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk      out/NovaPlay-v139-debug.apk
          cp app/build/outputs/apk/release/app-release.apk  out/NovaPlay-v139-release.apk
          tar czf out/NovaPlay-v139-source.tar.gz --exclude=build --exclude=.gradle --exclude=.git .
          ls -la out

      - name: Upload APKs (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: NovaPlay-v139-APK
          path: out/*.apk
          if-no-files-found: error

      - name: Upload sources (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: NovaPlay-v139-Source
          path: out/NovaPlay-v139-source.tar.gz
          if-no-files-found: warn

      - name: Upload project files to repository — رفع الملفات إلى المستودع
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.commit_files == 'true' }}
        continue-on-error: true
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "لا توجد تغييرات — الملفات موجودة مسبقاً"
          else
            git commit -m "NovaPlay: إنشاء ملفات المشروع (Kotlin) [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
            echo "تم رفع الملفات إلى المستودع ✅"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v139.0-NovaPlay
          name: NovaPlay 139.0
          body: |
            **NovaPlay** — نسخة Kotlin كاملة بدون Firebase
            - الحزمة: `com.nova.play`
            - الإصدار: `139.0-NovaPlay` (versionCode 139)
            - Debug + Release APK موقّعتان بنفس المفتاح
            - إدخال السيرفرات يدوياً داخل التطبيق
          files: |
            out/NovaPlay-v139-debug.apk
            out/NovaPlay-v139-release.apk
            out/NovaPlay-v139-source.tar.gz
          draft: false
          prerelease: false
