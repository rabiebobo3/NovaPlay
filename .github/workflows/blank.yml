name: NovaPlay_Kotlin_UI
on: [push]
permissions:
  contents: write
  actions: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Build APK
        run: |
          rm -f build.gradle settings.gradle
          echo "org.gradle.jvmargs=-Xmx4096m" > gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          cat <<'EOF' > settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS); repositories { google(); mavenCentral() } }
          rootProject.name = "NovaPlay"
          include ':app'
          EOF
          cat <<'EOF' > build.gradle
          plugins { id 'com.android.application' version '8.2.2' apply false; id 'org.jetbrains.kotlin.android' version '1.9.22' apply false }
          EOF
          mkdir -p app/src/main/java/com/nova/play app/src/main/res/{layout,drawable,values}
          cat <<'EOF' > app/build.gradle
          plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
          android {
            namespace 'com.nova.play'
            compileSdk 34
            defaultConfig { applicationId "com.nova.play"; minSdk 21; targetSdk 34; versionCode 81; versionName "8.1" }
            buildTypes { release { minifyEnabled false } }
            compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
            kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'androidx.recyclerview:recyclerview:1.3.2'
            implementation 'androidx.media3:media3-exoplayer:1.2.1'
            implementation 'androidx.media3:media3-ui:1.2.1'
          }
          EOF
          cat <<'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <application android:label="Rabie Pro" android:usesCleartextTraffic="true" android:theme="@style/Theme.Rabie" android:largeHeap="true">
              <activity android:name=".MainActivity" android:exported="true" android:screenOrientation="landscape" android:configChanges="orientation|screenSize|keyboard|keyboardHidden|navigation">
                <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat <<'EOF' > app/src/main/res/values/themes.xml
          <resources>
            <style name="Theme.Rabie" parent="Theme.AppCompat.NoActionBar">
              <item name="android:windowBackground">@drawable/bg_maroon</item>
            </style>
          </resources>
          EOF
          cat <<'EOF' > app/src/main/res/drawable/bg_maroon.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android"><gradient android:angle="270" android:startColor="#7A1116" android:centerColor="#5E0D12" android:endColor="#3E070B"/></shape>
          EOF
          cat <<'EOF' > app/src/main/res/drawable/row_bg.xml
          <selector xmlns:android="http://schemas.android.com/apk/res/android">
            <item android:state_pressed="true"><shape><solid android:color="#8A2A2E"/><stroke android:width="1dp" android:color="#C05A5E"/><corners android:radius="4dp"/></shape></item>
            <item><shape><solid android:color="#7A1418"/><stroke android:width="1dp" android:color="#8A2A2E"/><corners android:radius="4dp"/></shape></item>
          </selector>
          EOF
          cat <<'EOF' > app/src/main/res/drawable/tile_bg.xml
          <selector xmlns:android="http://schemas.android.com/apk/res/android">
            <item android:state_pressed="true"><shape><solid android:color="#A82A2E"/><corners android:radius="6dp"/></shape></item>
            <item><shape><solid android:color="#8E1216"/><corners android:radius="6dp"/></shape></item>
          </selector>
          EOF
          cat <<'EOF' > app/src/main/res/drawable/btn_lavender.xml
          <selector xmlns:android="http://schemas.android.com/apk/res/android">
            <item android:state_pressed="true"><shape><solid android:color="#A795C6"/><corners android:radius="4dp"/></shape></item>
            <item><shape><solid android:color="#8B7BA8"/><corners android:radius="4dp"/></shape></item>
          </selector>
          EOF
          cat <<'EOF' > app/src/main/res/drawable/search_bg.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="#7A1418"/><stroke android:width="1dp" android:color="#C08A8E"/><corners android:radius="18dp"/></shape>
          EOF
          cat <<'EOF' > app/src/main/res/drawable/ic_tv.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24"><path android:fillColor="#FFFFFF" android:pathData="M4,6h16v12H4z M9,20h6v1H9z M12,2l3,3H9z"/><path android:fillColor="#7A1418" android:pathData="M10,9l6,3l-6,3z"/></vector>
          EOF
          cat <<'EOF' > app/src/main/res/drawable/ic_live.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="48dp" android:height="48dp" android:viewportWidth="24" android:viewportHeight="24"><path android:fillColor="#FFFFFF" android:pathData="M3,6h18v13H3z M10,21h4v1h-4z M12,2l4,4H8z"/><path android:fillColor="#8E1216" android:pathData="M10,9l7,3.5l-7,3.5z"/></vector>
          EOF
          cat <<'EOF' > app/src/main/res/drawable/ic_movie.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="40dp" android:height="40dp" android:viewportWidth="24" android:viewportHeight="24"><path android:fillColor="#00000000" android:strokeColor="#FFFFFF" android:strokeWidth="1.8" android:pathData="M12,3C7,3 3,7 3,12s4,9 9,9 9,-4 9,-9S17,3 12,3z"/><path android:fillColor="#FFFFFF" android:pathData="M10,8l7,4l-7,4z"/></vector>
          EOF
          cat <<'EOF' > app/src/main/res/drawable/ic_series.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="40dp" android:height="40dp" android:viewportWidth="24" android:viewportHeight="24"><path android:fillColor="#FFFFFF" android:pathData="M3,8l2,-4l4,1l-2,4z M10,9l2,-4l4,1l-2,4z M3,10h18v10H3z"/></vector>
          EOF
          cat <<'EOF' > app/src/main/res/drawable/ic_account.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="40dp" android:height="40dp" android:viewportWidth="24" android:viewportHeight="24"><path android:fillColor="#FFFFFF" android:pathData="M9,11a3.5,3.5 0 1,0 0.01,0z M17,11a3,3 0 1,0 0.01,0z M2,19c0,-3 3.5,-5 7,-5s7,2 7,5z M16,19c0,-2 2.5,-4 5,-4 1.5,0 3,1 3,4z"/></vector>
          EOF
          cat <<'EOF' > app/src/main/res/drawable/ic_switch.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="40dp" android:height="40dp" android:viewportWidth="24" android:viewportHeight="24"><path android:fillColor="#FFFFFF" android:pathData="M7,8h8V5l5,4l-5,4v-3H7z M17,16H9v3l-5,-4l5,-4v3h8z"/></vector>
          EOF
          cat <<'EOF' > app/src/main/res/drawable/ic_settings.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24"><path android:fillColor="#FFFFFF" android:pathData="M12,9a3,3 0 1,0 0.01,0z M12,1l1.5,3.5h-3z M12,23l-1.5,-3.5h3z M1,12l3.5,-1.5v3z M23,12l-3.5,1.5v-3z M4,4l3.5,1.5l-2,2z M20,20l-3.5,-1.5l2,-2z M20,4l-1.5,3.5l-2,-2z M4,20l1.5,-3.5l2,2z"/></vector>
          EOF
          cat <<'EOF' > app/src/main/res/drawable/ic_reload.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24"><path android:fillColor="#FFFFFF" android:pathData="M12,5a7,7 0 1,1 -7,7h2a5,5 0 1,0 5,-5z M12,1l5,5l-5,5z"/></vector>
          EOF
          cat <<'EOF' > app/src/main/res/drawable/ic_exit.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24"><path android:fillColor="#FFFFFF" android:pathData="M14,3h7v18h-7v-2h5V5h-5z M9,8l4,4l-4,4z M13,10H4v4h9z"/></vector>
          EOF
          cat <<'EOF' > app/src/main/res/layout/item_group.xml
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal" android:background="@drawable/row_bg" android:padding="10dp" android:gravity="center_vertical">
            <TextView android:id="@+id/g_name" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:textColor="#FFFFFF" android:textSize="13sp" android:textStyle="bold" android:maxLines="1"/>
            <TextView android:id="@+id/g_count" android:layout_width="wrap_content" android:layout_height="wrap_content" android:textColor="#FFD400" android:textSize="12sp" android:textStyle="bold"/>
          </LinearLayout>
          EOF
          cat <<'EOF' > app/src/main/res/layout/item_live.xml
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal" android:background="@drawable/row_bg" android:padding="8dp" android:gravity="center_vertical">
            <TextView android:id="@+id/c_num" android:layout_width="26dp" android:layout_height="wrap_content" android:textColor="#E8C9C9" android:textSize="11sp"/>
            <ImageView android:layout_width="26dp" android:layout_height="26dp" android:src="@drawable/ic_tv" android:layout_marginEnd="8dp"/>
            <TextView android:id="@+id/c_name" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:textColor="#FFFFFF" android:textSize="12sp" android:textStyle="bold" android:maxLines="1"/>
          </LinearLayout>
          EOF
          cat <<'EOF' > app/src/main/res/layout/item_card.xml
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="110dp" android:orientation="vertical" android:background="@drawable/tile_bg" android:padding="8dp" android:gravity="center">
            <ImageView android:id="@+id/k_icon" android:layout_width="36dp" android:layout_height="36dp" android:src="@drawable/ic_movie"/>
            <TextView android:id="@+id/k_name" android:layout_width="match_parent" android:layout_height="wrap_content" android:layout_marginTop="6dp" android:gravity="center" android:textColor="#FFFFFF" android:textSize="12sp" android:textStyle="bold" android:maxLines="2"/>
          </LinearLayout>
          EOF
          cat <<'EOF' > app/src/main/res/layout/activity_main.xml
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android" xmlns:app="http://schemas.android.com/apk/res-auto" android:id="@+id/root" android:layout_width="match_parent" android:layout_height="match_parent" android:layoutDirection="rtl" android:background="@drawable/bg_maroon">
            <LinearLayout android:id="@+id/serverBox" android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical" android:gravity="center" android:padding="24dp" android:visibility="visible">
              <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Rabie Pro" android:textColor="#FF2A2A" android:textSize="30sp" android:textStyle="bold|italic"/>
              <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="إدخال بيانات السيرفر" android:textColor="#FFFFFF" android:textSize="18sp" android:textStyle="bold" android:layout_marginTop="8dp"/>
              <Spinner android:id="@+id/sp_type" android:layout_width="340dp" android:layout_height="44dp" android:layout_marginTop="14dp" android:background="@drawable/search_bg"/>
              <EditText android:id="@+id/et_name" android:layout_width="340dp" android:layout_height="44dp" android:layout_marginTop="8dp" android:background="@drawable/search_bg" android:hint="اسم القائمة" android:textColor="#FFFFFF" android:textColorHint="#C08A8E" android:paddingStart="14dp" android:paddingEnd="14dp" android:maxLines="1"/>
              <EditText android:id="@+id/et_url" android:layout_width="340dp" android:layout_height="44dp" android:layout_marginTop="8dp" android:background="@drawable/search_bg" android:hint="رابط القائمة / البوابة" android:textColor="#FFFFFF" android:textColorHint="#C08A8E" android:paddingStart="14dp" android:paddingEnd="14dp" android:maxLines="1"/>
              <EditText android:id="@+id/et_user" android:layout_width="340dp" android:layout_height="44dp" android:layout_marginTop="8dp" android:background="@drawable/search_bg" android:hint="اسم المستخدم" android:textColor="#FFFFFF" android:textColorHint="#C08A8E" android:paddingStart="14dp" android:paddingEnd="14dp" android:maxLines="1" android:visibility="gone"/>
              <EditText android:id="@+id/et_pass" android:layout_width="340dp" android:layout_height="44dp" android:layout_marginTop="8dp" android:background="@drawable/search_bg" android:hint="كلمة المرور" android:inputType="textPassword" android:textColor="#FFFFFF" android:textColorHint="#C08A8E" android:paddingStart="14dp" android:paddingEnd="14dp" android:maxLines="1" android:visibility="gone"/>
              <EditText android:id="@+id/et_mac" android:layout_width="340dp" android:layout_height="44dp" android:layout_marginTop="8dp" android:background="@drawable/search_bg" android:hint="عنوان MAC" android:textColor="#FFFFFF" android:textColorHint="#C08A8E" android:paddingStart="14dp" android:paddingEnd="14dp" android:maxLines="1" android:visibility="gone"/>
              <LinearLayout android:layout_width="340dp" android:layout_height="wrap_content" android:orientation="horizontal" android:layout_marginTop="14dp">
                <Button android:id="@+id/btn_connect" android:layout_width="0dp" android:layout_height="44dp" android:layout_weight="1" android:text="اتصال" android:background="@drawable/btn_lavender" android:textColor="#FFFFFF"/>
                <Button android:id="@+id/btn_saved" android:layout_width="0dp" android:layout_height="44dp" android:layout_weight="1" android:text="السيرفرات المحفوظة" android:background="@drawable/btn_lavender" android:textColor="#FFFFFF" android:layout_marginStart="8dp"/>
              </LinearLayout>
            </LinearLayout>
            <LinearLayout android:id="@+id/homeBox" android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical" android:visibility="gone">
              <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal" android:padding="10dp" android:gravity="center_vertical">
                <TextView android:id="@+id/home_exp" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:text="قائمة التشغيل الحالية تنتهي: -" android:textColor="#F0D0D0" android:textSize="13sp"/>
                <TextView android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:gravity="center" android:text="Rabie Pro" android:textColor="#FF2A2A" android:textSize="20sp" android:textStyle="bold|italic"/>
                <View android:layout_width="0dp" android:layout_height="1dp" android:layout_weight="1"/>
              </LinearLayout>
              <LinearLayout android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="1" android:orientation="horizontal" android:padding="14dp" android:gravity="center_vertical">
                <LinearLayout android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:orientation="vertical">
                  <LinearLayout android:id="@+id/tile_settings" android:layout_width="match_parent" android:layout_height="52dp" android:orientation="horizontal" android:background="@drawable/row_bg" android:gravity="center_vertical" android:paddingStart="12dp"><ImageView android:layout_width="22dp" android:layout_height="22dp" android:src="@drawable/ic_settings"/><TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="الإعدادات" android:textColor="#FFFFFF" android:textSize="14sp" android:layout_marginStart="10dp"/></LinearLayout>
                  <LinearLayout android:id="@+id/tile_reload" android:layout_width="match_parent" android:layout_height="52dp" android:orientation="horizontal" android:background="@drawable/row_bg" android:gravity="center_vertical" android:paddingStart="12dp" android:layout_marginTop="8dp"><ImageView android:layout_width="22dp" android:layout_height="22dp" android:src="@drawable/ic_reload"/><TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="إعادة تحميل البوابة" android:textColor="#FFFFFF" android:textSize="14sp" android:layout_marginStart="10dp"/></LinearLayout>
                  <LinearLayout android:id="@+id/tile_exit" android:layout_width="match_parent" android:layout_height="52dp" android:orientation="horizontal" android:background="@drawable/row_bg" android:gravity="center_vertical" android:paddingStart="12dp" android:layout_marginTop="8dp"><ImageView android:layout_width="22dp" android:layout_height="22dp" android:src="@drawable/ic_exit"/><TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="خروج" android:textColor="#FFFFFF" android:textSize="14sp" android:layout_marginStart="10dp"/></LinearLayout>
                </LinearLayout>
                <GridLayout android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1.2" android:columnCount="2" android:layout_marginStart="10dp">
                  <LinearLayout android:id="@+id/tile_movies" android:layout_width="0dp" android:layout_height="86dp" android:layout_columnWeight="1" android:layout_margin="4dp" android:orientation="vertical" android:background="@drawable/tile_bg" android:gravity="center"><ImageView android:layout_width="34dp" android:layout_height="34dp" android:src="@drawable/ic_movie"/><TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="افلام" android:textColor="#FFFFFF" android:textSize="13sp" android:layout_marginTop="4dp"/></LinearLayout>
                  <LinearLayout android:id="@+id/tile_series" android:layout_width="0dp" android:layout_height="86dp" android:layout_columnWeight="1" android:layout_margin="4dp" android:orientation="vertical" android:background="@drawable/tile_bg" android:gravity="center"><ImageView android:layout_width="34dp" android:layout_height="34dp" android:src="@drawable/ic_series"/><TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="مسلسلات" android:textColor="#FFFFFF" android:textSize="13sp" android:layout_marginTop="4dp"/></LinearLayout>
                  <LinearLayout android:id="@+id/tile_account" android:layout_width="0dp" android:layout_height="86dp" android:layout_columnWeight="1" android:layout_margin="4dp" android:orientation="vertical" android:background="@drawable/tile_bg" android:gravity="center"><ImageView android:layout_width="34dp" android:layout_height="34dp" android:src="@drawable/ic_account"/><TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="الحساب" android:textColor="#FFFFFF" android:textSize="13sp" android:layout_marginTop="4dp"/></LinearLayout>
                  <LinearLayout android:id="@+id/tile_switch" android:layout_width="0dp" android:layout_height="86dp" android:layout_columnWeight="1" android:layout_margin="4dp" android:orientation="vertical" android:background="@drawable/tile_bg" android:gravity="center"><ImageView android:layout_width="34dp" android:layout_height="34dp" android:src="@drawable/ic_switch"/><TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="تغيير قائمة التسجيل" android:textColor="#FFFFFF" android:textSize="11sp" android:layout_marginTop="4dp"/></LinearLayout>
                </GridLayout>
                <LinearLayout android:id="@+id/tile_live" android:layout_width="0dp" android:layout_height="190dp" android:layout_weight="1.2" android:orientation="vertical" android:background="@drawable/tile_bg" android:gravity="center" android:layout_marginStart="10dp"><ImageView android:layout_width="64dp" android:layout_height="64dp" android:src="@drawable/ic_live"/><TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="بث مباشر" android:textColor="#FFFFFF" android:textSize="16sp" android:textStyle="bold" android:layout_marginTop="8dp"/></LinearLayout>
              </LinearLayout>
            </LinearLayout>
            <LinearLayout android:id="@+id/liveBox" android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical" android:visibility="gone">
              <LinearLayout android:layout_width="match_parent" android:layout_height="48dp" android:orientation="horizontal" android:gravity="center_vertical" android:paddingStart="10dp" android:paddingEnd="10dp">
                <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Rabie Pro" android:textColor="#FF2A2A" android:textSize="16sp" android:textStyle="bold|italic"/>
                <EditText android:id="@+id/et_search" android:layout_width="0dp" android:layout_height="36dp" android:layout_weight="1" android:layout_marginStart="14dp" android:layout_marginEnd="14dp" android:background="@drawable/search_bg" android:hint="بحث" android:textColorHint="#C08A8E" android:textColor="#FFFFFF" android:paddingStart="30dp" android:paddingEnd="10dp" android:maxLines="1"/>
                <TextView android:id="@+id/tab_series" android:layout_width="wrap_content" android:layout_height="36dp" android:gravity="center" android:text="مسلسلات" android:textColor="#F0D0D0" android:textSize="13sp" android:paddingStart="10dp" android:paddingEnd="10dp"/>
                <TextView android:id="@+id/tab_movies" android:layout_width="wrap_content" android:layout_height="36dp" android:gravity="center" android:text="افلام" android:textColor="#F0D0D0" android:textSize="13sp" android:paddingStart="10dp" android:paddingEnd="10dp"/>
                <TextView android:id="@+id/tab_live" android:layout_width="wrap_content" android:layout_height="36dp" android:gravity="center" android:text="بث مباشر" android:textColor="#FFD400" android:textSize="13sp" android:textStyle="bold" android:paddingStart="10dp" android:paddingEnd="10dp"/>
                <TextView android:id="@+id/tab_home" android:layout_width="wrap_content" android:layout_height="36dp" android:gravity="center" android:text="مسكن" android:textColor="#F0D0D0" android:textSize="13sp" android:paddingStart="10dp" android:paddingEnd="10dp"/>
              </LinearLayout>
              <LinearLayout android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="1" android:orientation="horizontal">
                <LinearLayout android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="0.5" android:orientation="vertical" android:padding="6dp">
                  <FrameLayout android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="0.55">
                    <androidx.media3.ui.PlayerView android:id="@+id/pv" android:layout_width="match_parent" android:layout_height="match_parent" app:use_controller="false"/>
                  </FrameLayout>
                  <LinearLayout android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="0.45" android:orientation="vertical" android:padding="8dp">
                    <TextView android:id="@+id/info_name" android:layout_width="match_parent" android:layout_height="wrap_content" android:textColor="#FFFFFF" android:textSize="15sp" android:textStyle="bold"/>
                    <TextView android:id="@+id/info_desc" android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="1" android:textColor="#F0D0D0" android:textSize="12sp" android:layout_marginTop="4dp"/>
                    <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal">
                      <Button android:id="@+id/btn_search" android:layout_width="0dp" android:layout_height="36dp" android:layout_weight="1" android:text="بحث" android:background="@drawable/btn_lavender" android:textColor="#FFFFFF" android:textSize="12sp"/>
                      <Button android:id="@+id/btn_fav" android:layout_width="0dp" android:layout_height="36dp" android:layout_weight="1.4" android:text="اضافة الى المفضلة" android:background="@drawable/btn_lavender" android:textColor="#FFFFFF" android:textSize="12sp" android:layout_marginStart="6dp"/>
