            buildTypes {
                debug {
                    signingConfig signingConfigs.debug
                }
                release {
                    minifyEnabled false
                    shrinkResources false
                    signingConfig signingConfigs.release
                }
            }

            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
            kotlinOptions {
                jvmTarget = '17'
            }
            packagingOptions {
                resources.excludes += ['META-INF/*.version', 'META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
            }
            lint {
                abortOnError false
                checkReleaseBuilds false
            }
        }

        dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
            implementation 'androidx.recyclerview:recyclerview:1.3.2'
            implementation 'androidx.media3:media3-exoplayer:1.4.1'
            implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
            implementation 'androidx.media3:media3-exoplayer-dash:1.4.1'
            implementation 'androidx.media3:media3-exoplayer-rtsp:1.4.1'
            implementation 'androidx.media3:media3-ui:1.4.1'
            implementation 'com.github.bumptech.glide:glide:4.16.0'
        }
        NP_F_APPGRADLE
        cat <<'NP_F_MANIFEST' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">

            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
            <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
            <uses-permission android:name="android.permission.WAKE_LOCK" />
            <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
            <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />

            <uses-feature android:name="android.software.leanback" android:required="false" />
            <uses-feature android:name="android.hardware.touchscreen" android:required="false" />

            <application
                android:name=".NovaApp"
                android:allowBackup="false"
                android:banner="@drawable/ic_banner"
                android:hardwareAccelerated="true"
                android:icon="@drawable/ic_launcher"
                android:label="NovaPlay"
                android:supportsRtl="true"
                android:theme="@style/ThemeNova"
                android:usesCleartextTraffic="true">

                <activity
                    android:name=".MainActivity"
                    android:configChanges="orientation|screenSize|smallestScreenSize|screenLayout|keyboard|keyboardHidden|navigation|density|uiMode"
                    android:exported="true"
                    android:launchMode="singleTop"
                    android:screenOrientation="sensorLandscape"
                    android:windowSoftInputMode="stateAlwaysHidden|adjustPan">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                        <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                    </intent-filter>
                </activity>

                <activity
                    android:name=".BrowseActivity"
                    android:configChanges="orientation|screenSize|smallestScreenSize|screenLayout|keyboard|keyboardHidden|navigation|density|uiMode"
                    android:exported="false"
                    android:launchMode="singleTop"
                    android:screenOrientation="sensorLandscape"
                    android:windowSoftInputMode="stateAlwaysHidden|adjustPan" />

                <activity
                    android:name=".PlayerActivity"
                    android:configChanges="orientation|screenSize|smallestScreenSize|screenLayout|keyboard|keyboardHidden|navigation|density|uiMode"
                    android:exported="false"
                    android:launchMode="singleTop"
                    android:screenOrientation="sensorLandscape"
                    android:theme="@style/ThemeNova"
                    android:windowSoftInputMode="stateAlwaysHidden|adjustPan" />

                <provider
                    android:name="androidx.core.content.FileProvider"
                    android:authorities="${applicationId}.provider"
                    android:exported="false"
                    android:grantUriPermissions="true">
                    <meta-data
                        android:name="android.support.FILE_PROVIDER_PATHS"
                        android:resource="@xml/file_paths" />
                </provider>
            </application>
        </manifest>
        NP_F_MANIFEST
        cat <<'NP_F_CLOUD' > app/src/main/java/com/nova/play/Cloud.kt
        package com.nova.play

        import android.content.Context

        /**
         * السحابة — النسخة الخفيفة (بلا Firebase).
         * نفس واجهة نسخة Firebase تمامًا، حتى لا يتغيّر أي كود في الواجهة.
         * البيانات كلها من السيرفر عبر ملف JSON (Config) بدل قاعدة Firebase.
         */
        object Cloud {
            @Volatile private var started = false

            fun initAsync(ctx: Context) {
                if (started) return
                started = true
                Diag.d("CLOUD", "الوضع المحلي — البيانات من رابط الإعدادات (JSON) إن وُجد")
            }

            fun ready(): Boolean = false

            fun login(ctx: Context, user: String, pass: String, cb: (Boolean, String) -> Unit) {
                val admin = ctx.sp.s("admin_user", "admin")
                val ap = ctx.sp.s("admin_pass", "admin123")
                if (user == admin && pass == ap) {
                    ctx.sp.put("auth_user", user)
                    cb(true, "دخول محلي (بدون سحابة)")
                    return
                }
                cb(false, "الحساب السحابي غير مفعّل — استخدم المصادر المباشرة")
            }

            fun logout(ctx: Context) {
                ctx.sp.put("auth_user", "")
            }

            fun findUpdate(cb: (Ota?) -> Unit) {
                cb(null)
            }
        }
        NP_F_CLOUD
        fi
        if [ ! -s app/debug.keystore ]; then
          keytool -genkeypair -keystore app/debug.keystore -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10950 \
            -dname 'CN=NovaPlay, OU=Dev, O=NovaPlay, L=Setif, ST=S, C=DZ' >/dev/null 2>&1 || echo "WARN: تعذّر إنشاء مفتاح التوقيع"
        fi
        echo "--- الملفات المولّدة ---"
        find app -type f | sort | sed 's|^|  |'
        wc -l app/src/main/java/com/nova/play/*.kt | tail -1

    - name: Build APK (debug + release)
      run: |
        set -e
        if command -v gradle >/dev/null 2>&1; then gradle wrapper --gradle-version 8.5 >/dev/null 2>&1 || true; fi
        if [ -x ./gradlew ]; then chmod +x ./gradlew; RUN=./gradlew; else RUN=gradle; fi
        $RUN :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace
        ls -lh app/build/outputs/apk/debug app/build/outputs/apk/release
        DBG=$(du -h app/build/outputs/apk/debug/app-debug.apk 2>/dev/null | cut -f1 || echo "-")
        REL=$(du -h app/build/outputs/apk/release/app-release.apk 2>/dev/null | cut -f1 || echo "-")
        echo "### NovaPlay 9.0 — APK" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"
        echo "- debug: $DBG" >> "$GITHUB_STEP_SUMMARY"
        echo "- release: $REL" >> "$GITHUB_STEP_SUMMARY"
        echo "- الحزمة: com.nova.play • الإصدار 9.0 (code 900)" >> "$GITHUB_STEP_SUMMARY"
        echo "- اللغات: Kotlin 1.9.22 + media3 1.4.1 + Glide + RecyclerView (بلا Firebase إلا بوجود google-services.json)" >> "$GITHUB_STEP_SUMMARY"

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: NovaPlay-Light-v${{ env.VERSION_CODE }}-build${{ github.run_number }}
        path: |
          app/build/outputs/apk/debug/app-debug.apk
          app/build/outputs/apk/release/app-release.apk
        if-no-files-found: error

    - name: Publish Release
      if: success()
      uses: softprops/action-gh-release@v2
      with:
        tag_name: nova-light-v${{ env.VERSION_NAME }}-build${{ github.run_number }}
        name: NovaPlay TV Light v${{ env.VERSION_NAME }} (com.nova.play) build ${{ github.run_number }}
        body: |
          نسخة التلفزيون الخفيفة 9.0.
          • سطح عرض واحد (لا شاشة سوداء عند تشغيل الأفلام والحلقات)
          • ترقيم صفحي من السيرفر + كاش صفحات (لا جلب لكل المحتوى)
          • ريموت أخف: بلا حركات في القوائم، استجابة فورية
          • Firebase اختياري ومتأخّر (يُبنى فقط بوجود google-services.json)
          • سجل أخطاء قابل للمشاركة/النسخ من الإعدادات
          يدعم: M3U • Xtream Codes • بوابات MAC/Stalker
        files: |
          app/build/outputs/apk/debug/app-debug.apk
          app/build/outputs/apk/release/app-release.apk
        overwrite: true
        generate_release_notes: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
