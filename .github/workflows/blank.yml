          package com.nova.play

          import android.app.Activity
          import android.app.DownloadManager
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.net.Uri
          import android.os.Build
          import android.widget.Toast
          import androidx.core.content.FileProvider
          import java.io.File

          /**
           * تحديث بسيط عبر رابط ثابت (بدون Firebase).
           * لا نثبّت إلا ملف APK يحمل نفس اسم الحزمة — حماية من تثبيت تطبيق آخر.
           */
          class Updater(private val act: Activity) {

              fun check(store: ServerStore) {
                  val url = store.updateUrl().trim()
                  if (url.isEmpty() || !url.startsWith("http")) {
                      Toast.makeText(act, R.string.update_none, Toast.LENGTH_SHORT).show()
                      return
                  }
                  try {
                      val target = File(act.externalCacheDir ?: act.cacheDir, Config.UPDATE_FILE)
                      if (target.exists()) target.delete()

                      val dm = act.getSystemService(Context.DOWNLOAD_SERVICE) as DownloadManager
                      val req = DownloadManager.Request(Uri.parse(url))
                          .setTitle(Config.APP_NAME)
                          .setDestinationInExternalFilesDir(act, null, Config.UPDATE_FILE)
                          .setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED)
                      val id = dm.enqueue(req)

                      val receiver = object : BroadcastReceiver() {
                          override fun onReceive(ctx: Context?, intent: Intent?) {
                              val dId = intent?.getLongExtra(DownloadManager.EXTRA_DOWNLOAD_ID, -1L) ?: -1L
                              if (dId != id) return
                              try {
                                  act.unregisterReceiver(this)
                              } catch (_: Exception) {
                              }
                              install()
                          }
                      }
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                          act.registerReceiver(receiver, IntentFilter(DownloadManager.ACTION_DOWNLOAD_COMPLETE), Context.RECEIVER_EXPORTED)
                      } else {
                          act.registerReceiver(receiver, IntentFilter(DownloadManager.ACTION_DOWNLOAD_COMPLETE))
                      }
                  } catch (e: Exception) {
                      Toast.makeText(act, "تعذّر التحديث: ${e.message}", Toast.LENGTH_LONG).show()
                  }
              }

              private fun install() {
                  try {
                      val f = File(act.externalCacheDir ?: act.cacheDir, Config.UPDATE_FILE)
                      if (!f.exists()) return

                      // تحقق من اسم الحزمة قبل التثبيت
                      val pm = act.packageManager
                      var flags = 0
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) flags = flags or android.content.pm.PackageManager.GET_SIGNING_CERTIFICATES
                      val info = pm.getPackageArchiveInfo(f.absolutePath, flags)
                      if (info == null || info.packageName != act.packageName) {
                          f.delete()
                          Toast.makeText(act, R.string.update_bad, Toast.LENGTH_LONG).show()
                          return
                      }

                      val uri = FileProvider.getUriForFile(act, act.packageName + ".fileprovider", f)
                      val i = Intent(Intent.ACTION_VIEW)
                      i.setDataAndType(uri, "application/vnd.android.package-archive")
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_GRANT_READ_URI_PERMISSION)
                      act.startActivity(i)
                  } catch (e: Exception) {
                      Toast.makeText(act, "تعذّر التثبيت: ${e.message}", Toast.LENGTH_LONG).show()
                  }
              }
          }
          NOVA_EOF

          mkdir -p $(dirname app/src/main/java/com/nova/play/XtreamClient.kt)
          cat > app/src/main/java/com/nova/play/XtreamClient.kt <<'NOVA_EOF'
          package com.nova.play

          import android.content.Context
          import android.os.Handler
          import android.os.Looper
          import com.android.volley.Request
          import com.android.volley.Response
          import com.android.volley.toolbox.StringRequest
          import org.json.JSONArray
          import org.json.JSONObject

          /**
           * قراءة المحتوى من سيرفر Xtream (Live / VOD / Series)
           * كل الطلبات تعود على الخيط الرئيسي بعد التحليل.
           */
          class XtreamClient(private val ctx: Context) {

              interface Callback {
                  fun onDone(list: MutableList<Channel>)
                  fun onError(msg: String)
              }

              private val main = Handler(Looper.getMainLooper())

              fun load(server: Server, kind: String, cb: Callback) {
                  if (!server.isXtream()) {
                      M3uClient(ctx).load(server, kind, cb)
                      return
                  }
                  val base = server.baseUrl()
                  if (base.isEmpty()) {
                      cb.onError(ctx.getString(R.string.bad_url))
                      return
                  }
                  val action = when (kind) {
                      Channel.KIND_VOD -> "get_vod_streams"
                      Channel.KIND_SERIES -> "get_series"
                      else -> "get_live_streams"
                  }
                  val catAction = when (kind) {
                      Channel.KIND_VOD -> "get_vod_categories"
                      Channel.KIND_SERIES -> "get_series_categories"
                      else -> "get_live_categories"
                  }
                  val creds = "username=${server.user}&password=${server.pass}"
                  val catUrl = "$base/player_api.php?$creds&action=$catAction"
                  val listUrl = "$base/player_api.php?$creds&action=$action"

                  get(catUrl, { catText ->
                      val cats = parseCategories(catText)
                      get(listUrl, { listText ->
                          Thread {
                              val out = try {
                                  parseStreams(listText, kind, cats, server)
                              } catch (e: Exception) {
                                  main.post { cb.onError(e.message ?: "parse error") }
                                  return@Thread
                              }
                              main.post { cb.onDone(out) }
                          }.start()
                      }, { err -> cb.onError(err) })
                  }, { err ->
                      // قد لا يدعم السيرفر قائمة التصنيفات — نتابع بدونها
                      get(listUrl, { listText ->
                          Thread {
                              val out = try {
                                  parseStreams(listText, kind, HashMap(), server)
                              } catch (e: Exception) {
                                  main.post { cb.onError(e.message ?: "parse error") }
                                  return@Thread
                              }
                              main.post { cb.onDone(out) }
                          }.start()
                      }, { e2 -> cb.onError(e2) })
                  })
              }

              /** حلقات مسلسل معيّن */
              fun loadSeriesEpisodes(server: Server, seriesId: String, cb: Callback) {
                  if (!server.isXtream()) {
                      cb.onError(ctx.getString(R.string.bad_url))
                      return
                  }
                  val base = server.baseUrl()
                  val url = "$base/player_api.php?username=${server.user}&password=${server.pass}&action=get_series_info&series_id=$seriesId"
                  get(url, { text ->
                      Thread {
                          val out = ArrayList<Channel>()
                          try {
                              val root = JSONObject(text)
                              val eps = root.optJSONObject("episodes")
                              if (eps != null) {
                                  val seasons = eps.keys()
                                  while (seasons.hasNext()) {
                                      val season = seasons.next()
                                      val arr = eps.optJSONArray(season) ?: continue
                                      for (i in 0 until arr.length()) {
                                          val e = arr.optJSONObject(i) ?: continue
                                          val ch = Channel()
                                          ch.kind = Channel.KIND_SERIES
                                          ch.seriesId = seriesId
                                          val epId = e.optString("id")
                                          val ext = e.optString("container_extension", "mp4")
                                          ch.id = epId
                                          ch.ext = ext
                                          val info = e.optJSONObject("info")
                                          val epName = if (info != null) info.optString("name", "") else ""
                                          val epNum = e.optString("episode_num", "")
                                          val title = e.optString("title", "")
                                          ch.name = (if (title.isNotEmpty()) title else "S$season E$epNum").trim()
                                          if (epName.isNotEmpty()) ch.name = "$epName"
                                          ch.group = "الموسم $season"
                                          ch.logo = if (info != null) info.optString("movie_image", "") else ""
                                          ch.url = "$base/series/${server.user}/${server.pass}/$epId.$ext"
                                          out.add(ch)
                                      }
                                  }
                              }
                          } catch (e: Exception) {
                              main.post { cb.onError(e.message ?: "parse error") }
                              return@Thread
                          }
                          main.post { cb.onDone(out) }
                      }.start()
                  }, { err -> cb.onError(err) })
              }

              /** اختبار الاتصال: يقرأ معلومات الحساب */
              fun test(server: Server, done: (Boolean, String) -> Unit) {
                  if (!server.isXtream()) {
                      M3uClient(ctx).test(server) { ok, msg -> done(ok, msg) }
                      return
                  }
                  val url = "${server.baseUrl()}/player_api.php?username=${server.user}&password=${server.pass}"
                  get(url, { text ->
                      try {
                          val o = JSONObject(text)
                          val info = o.optJSONObject("user_info")
                          val status = if (info != null) info.optString("status", "") else ""
                          val exp = if (info != null) info.optString("exp_date", "") else ""
                          if (status.equals("Active", true) || status.equals("1", true) || status.isEmpty()) {
                              val extra = if (exp.isNotEmpty() && exp != "null") " • ينتهي: $exp" else ""
                              done(true, ctx.getString(R.string.srv_ok) + extra)
                          } else {
                              done(false, "الحساب: $status")
                          }
                      } catch (e: Exception) {
                          done(false, "رد غير متوقع")
                      }
                  }, { err -> done(false, err) })
              }

              // ---------- داخلي ----------

              private fun get(url: String, ok: (String) -> Unit, err: (String) -> Unit) {
                  val req = object : StringRequest(Request.Method.GET, url,
                      Response.Listener { r -> if (r.isNullOrEmpty()) err("رد فارغ") else ok(r) },
                      Response.ErrorListener { e -> err(e.message ?: "network error") }) {
                  }
                  Net.add(ctx, req)
              }

              private fun parseCategories(text: String): HashMap<String, String> {
                  val map = HashMap<String, String>()
                  try {
                      val arr = JSONArray(text)
                      for (i in 0 until arr.length()) {
                          val o = arr.optJSONObject(i) ?: continue
                          map[o.optString("category_id")] = o.optString("category_name")
                      }
                  } catch (_: Exception) {
                  }
                  return map
              }

              private fun parseStreams(text: String, kind: String, cats: HashMap<String, String>, server: Server): MutableList<Channel> {
                  val out = ArrayList<Channel>()
                  val arr = JSONArray(text)
                  val base = server.baseUrl()
                  for (i in 0 until arr.length()) {
                      val o = arr.optJSONObject(i) ?: continue
                      val ch = Channel()
                      ch.kind = kind
                      when (kind) {
                          Channel.KIND_VOD -> {
                              ch.id = o.optString("stream_id")
                              ch.ext = o.optString("container_extension", "mp4")
                              ch.logo = o.optString("stream_icon", o.optString("cover", ""))
                              ch.url = "$base/movie/${server.user}/${server.pass}/${ch.id}.${ch.ext}"
                          }
                          Channel.KIND_SERIES -> {
                              ch.id = o.optString("series_id")
                              ch.logo = o.optString("cover", "")
                              ch.url = "" // يُبنى عند اختيار الحلقة
                          }
                          else -> {
                              ch.id = o.optString("stream_id")
                              ch.ext = "m3u8"
                              ch.logo = o.optString("stream_icon", "")
                              ch.url = "$base/live/${server.user}/${server.pass}/${ch.id}.m3u8"
                          }
                      }
                      ch.name = o.optString("name", "").trim()
                      if (ch.name.isEmpty()) continue
                      val catId = o.optString("category_id", "")
                      ch.group = cats[catId] ?: o.optString("category_name", "غير مصنّف")
                      out.add(ch)
                  }
                  out.sortWith(compareBy({ it.group }, { it.name }))
                  return out
              }
          }
          NOVA_EOF
          echo "✅ تم إنشاء ملفات Kotlin"

