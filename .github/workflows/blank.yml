name: NovaPlay_Kotlin_Full
# NovaPlay — تطبيق IPTV كامل بلغة Kotlin (الحزمة com.nova.play)
# ينشئ كل ملفات المشروع داخل جهاز البناء ثم يبني APK ويُنشر تلقائيًا.
# كل ميزات Rabie Pro v138 SmartLoad منقولة إلى Kotlin هنا، بدون أي ملف مضغوط غامض.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: novaplay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_NAME: "8.8"
      VERSION_CODE: "88"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-nova-${{ hashFiles('**/*.gradle*', 'gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-nova-

      - name: Setup Android SDK
        run: |
          set -e
          if [ -z "${ANDROID_HOME:-}" ]; then export ANDROID_HOME="$HOME/android-sdk"; fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKM="$(command -v sdkmanager || true)"
          if [ -z "$SDKM" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"; fi
          if [ -z "$SDKM" ]; then
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -sSLo /tmp/clt.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q -o /tmp/clt.zip -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest" 2>/dev/null || true
            SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" "platform-tools" "platforms;android-34" "build-tools;34.0.0" 2>&1 | tail -3 || echo "WARN: تعذّر تثبيت حزم SDK — سنستخدم ما هو مثبّت مسبقًا على الجهاز"

      - name: Generate project (Kotlin + resources)
        run: |
          set -e
          rm -rf app build.gradle settings.gradle gradle.properties
          mkdir -p app/src/main/java/com/nova/play
          mkdir -p app/src/main/res/drawable app/src/main/res/layout
          mkdir -p app/src/main/res/values app/src/main/res/values-night app/src/main/res/xml
          cat <<'NP_EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url 'https://jitpack.io' }
              }
          }
          rootProject.name = "NovaPlay"
          include ':app'
          NP_EOF
          cat <<'NP_EOF' > build.gradle
          // NovaPlay — الجذر. بلجـن google-services يُحمَّل لكن لا يُطبَّق إلا إذا وُجد google-services.json
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.google.gms:google-services:4.4.2'
              }
          }

          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          NP_EOF
          cat <<'NP_EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
          org.gradle.daemon=true
          org.gradle.parallel=true
          android.useAndroidX=true
          android.nonTransitiveRClass=false
          kotlin.code.style=official
          android.enableR8.fullMode=false
          android.r8.maxWorkers=1
          NP_EOF
          cat <<'NP_EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          // google-services.json اختياري: إن وُجد فُعّل بلجـن Firebase، وإلا يعمل التطبيق في الوضع المحلي
          if (file("google-services.json").exists()) {
              apply plugin: 'com.google.android.gms.google-services'
          }

          android {
              namespace 'com.nova.play'
              compileSdk 34

              defaultConfig {
                  applicationId "com.nova.play"
                  minSdk 21
                  targetSdk 34
                  // الرقم والاصدار يمكن تمريرهما من الـ workflow (env) — وإلا الافتراضي 82 / 8.2
                  versionCode (System.getenv("VERSION_CODE")?.toInteger() ?: 88)
                  versionName (System.getenv("VERSION_NAME") ?: "8.8")
                  vectorDrawables.useSupportLibrary = true
              }

              // توقيع debug و release بنفس المفتاح حتى يثبت التحديث فوق النسخة الحالية بدون تعارض
              signingConfigs {
                  debug {
                      storeFile file("debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
                  release {
                      storeFile file("debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }

              buildTypes {
                  debug {
                      signingConfig signingConfigs.debug
                  }
                  release {
                      minifyEnabled false
                      shrinkResources false
                      signingConfig signingConfigs.release
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
              packagingOptions {
                  resources.excludes += ['META-INF/*.version', 'META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
              }
              lint {
                  abortOnError false
                  checkReleaseBuilds false
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.recyclerview:recyclerview:1.3.2'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
              implementation 'androidx.media3:media3-exoplayer:1.2.1'
              implementation 'androidx.media3:media3-exoplayer-hls:1.2.1'
              implementation 'androidx.media3:media3-exoplayer-dash:1.2.1'
              implementation 'androidx.media3:media3-exoplayer-smoothstreaming:1.2.1'
              implementation 'androidx.media3:media3-exoplayer-rtsp:1.2.1'
              implementation 'androidx.media3:media3-ui:1.2.1'
              implementation 'androidx.mediarouter:mediarouter:1.6.0'
              implementation 'com.github.bumptech.glide:glide:4.16.0'
              implementation platform('com.google.firebase:firebase-bom:33.7.0')
              implementation 'com.google.firebase:firebase-database'
              implementation 'com.google.firebase:firebase-messaging'
          }
          NP_EOF
          cat <<'NP_EOF' > .gitignore
          *.iml
          .gradle
          /local.properties
          /localTest
          /.idea
          .DS_Store
          /build
          /captures
          .externalNativeBuild
          .cxx
          app/build
          app/release
          .idea/
          NP_EOF
          cat <<'NP_EOF' > README.md
          # NovaPlay — IPTV Android (Kotlin)

          نسخة **Kotlin** كاملة من ميزات `Rabie Pro v138 SmartLoad`، داخل **نفس الحزمة** `com.nova.play`،
          مع نفس أسلوب «ملف Workflow واحد يبني كل شيء»: ملف `.github/workflows/novaplay.yml` ينشئ كل ملفات
          المشروع داخل جهاز البناء ثم يبني APK debug + release ويُنشر تلقائيًا.

          > لا يوجد أي كود مضغوط غامض هنا: كل الملفات تُكتب نصًا صريحًا في الـ workflow (يمكنك قراءتها وتعديلها).

          ## ما الجديد في 8.5 (إصلاح MAC: قنوات + أفلام + مسلسلات)

          | المشكلة | الحل في الكود |
          |---|---|
          | القنوات لا تعمل في بوابات MAC | عند التشغيل تُرسل نفس ترويسات البوابة (`Cookie: mac=..`, `Referer`, `User-Agent`, `Authorization: Bearer`) عبر `Stalker.playHeaders` داخل `DefaultHttpDataSource` — فالسيرفر كان يرفض طلب media3 بدونها |
          | أقسام الأفلام تظهر لكن لا أفلام | `Stalker.fetchAll` يجلب **كل الأقسام وكل الصفحات** دفعة واحدة بـ 8 خيوط متوازية (`type=vod&action=get_ordered_list&genre=<id>&p=<n>`) — نفس منطق الكود المجَرَّب لكن بالتوازي بدل صفحة بواحدة |
          | المسلسلات بلا مواسم/حلقات | `Stalker.seriesTree` يجرّب `get_series_info` ثم `get_ordered_list&movie_id=` و`&series_id=` ويفهم `js.series` كخريطة مواسم أو `data[]` فيها `series/episodes` متداخلة؛ والموسم بلا حلقات يفتح `seasonEpisodes(movie_id + season_id)` |
          | الحلقة لا تُشغَّل | `playable("episode", …)` يبني أمر **base64** لـ `{"series_id":..,"season_num":..,"type":"series"}` ويرسله في `create_link&cmd=<b64>&series=<episodeId>` ثم `ffmpeg ` تُجرَّد، وبعدها `create_link` العادي كخيار ثانٍ |
          | الرد يُقرأ خطأ | `itemsOf` تقبل `js` مصفوفة أو `{data}` أو `{categories}` أو `{channels}` أو خريطة مفاتيحها أرقام/«season» — مثل `parseStalkerList` تمامًا |
          | المصافحة تفشل على بعض البوابات | 5 مسارات × نسختا ترويسات × 4 صيغ handshake (`token=`, `pre_auth=1`, `mac=`) مع تذكير المسار الناجح، حتى 5 محاولات |
          | التنقّل بطيء | بعد جلب 8.5 كل شيء محلي: الأقسام والفرز والبحث يعملان على الذاكرة (بلا انتظار السيرفر)، والكاش المضغوط في `cacheDir/pl/<profile>.gz` بـ TTL 6 ساعات |
          | المشغّل | `DefaultLoadControl(2500, 20000, 500, 1200)` + `setBackBuffer(3000, true)`، تخطّي 10 ثوانٍ، `seekParameters` DEFAULT، خطأ التشغيل → إعادة تحضير، ومزاج mime فقط لـ m3u8/mpd |
          | الريموت | `MENU` = الإعدادات/الحساب، `OK` = تشغيل كامل ثم تشغيل/إيقاف، `0-9` = اختيار قناة برقمها، `◀◀/▶▶` = ±30 ث، `PageUp/Down` = ±60 ث |

          **ملاحظة مهمة**: في بوابات MAC الأمر المخزّن في القائمة ليس رابطًا؛ لذلك كل تشغيل يمرّ بـ `create_link`
          (وظيفة `Loader.macPlayable`) — وهذا هو سبب «الأقسام تظهر والتشغيل لا يعمل» قبل هذه النسخة.


          ## 8.8 — فتح سريع + جلب **كل** محتوى السيرفر (كل الأقسام بكل صفحاتها)

          | المشكلة القديمة | الحل في 8.8 |
          |---|---|
          | التطبيق يطول 5 دقائق ويجيبهش البيانات | المسار السريع: مصافحة + الأقسام + القنوات فقط (**ثوانٍ**) ثم الأفلام والمسلسلات تُجلب **في الخلفية** والعناصر تظهر تباعًا بلا تجميد |
          | كل قسم يجيب 14 عنصر فقط (صفحة واحدة) | كان لا يقرأ `total_pages` من البوابة → يتوقف بعد الصفحة الأولى. الآن يقرأها (وإن غابت يكمل ما دامت الصفحة ممتلئة: `page++ while len>=14` مثل كود Java) حتى **آخر صفحة** |
          | المسلسلات لا تُجلب أبدًا | صارت في نفس مسار الجلب (خلفي + عند فتح القسم) وتظهر كاملة |
          | الضغط على قناة/فلم يُخرج التطبيق | `create_link` لكل عنصر MAC + أمر البوابة المحلي `http://localhost/ch/N_` يُصلَّح إلى مضيف البوابة (مثل جهاز MAG) + كل مسارات الضغط محميّة (تنبيه بدل خروج) |
          | القسم يُجلب مرة واحدة فقط | كل قسم يُوسم «مكتمل» (`Catalog.fillDone`) — يُجلب كاملًا مرة واحدة ثم يُقرأ من الذاكرة |

          ## 8.7 — دالة MAC Portal الجديدة + الضغط لا يُخرج التطبيق

          | العنصر | التفصيل |
          |---|---|
          | دالة MAC Portal | نفس سلسلة كود Java: مصافحة → `get_profile` → `get_settings` → `get_genres`/`get_all_channels`/`get_categories` → `get_ordered_list` (صفحات) → `get_series_info` + الحلقات → **create_link** → المشغّل |
          | جلسة محفوظة | `StalkerSession`: نفس التوكن والمسار الناجح يُعاد استعمالهما — الضغط على القناة يشغّل بلا مصافحة جديدة |
          | الضغط = تشغيل | كل عنصر MAC يمرّ بـ `create_link` حتى لو كان أمره يشبه رابطًا (`http://localhost/ch/12_`)، والحلقات بأمر base64 (`series_id`/`season_num`/`type=series`) |
          | بدل الفشل الصامت | إذا رفضت البوابة إنشاء الرابط ترجع `""` فتظهر «البوابة لم تُرجع رابطًا صالحًا» بدل تشغيل رابط خاطئ |
          | الضغط لا يُغلق التطبيق | كل مسارات الضغط (قناة/فيلم/مسلسل/حلقة) محميّة: أي خطأ يظهر كتنبيه `تعذر التشغيل: …` ويُسجَّل في سجل الأعطال **دون إغلاق التطبيق** |

          ## 8.6 — تحكّم في عمق الجلب + جلب القسم عند الطلب

          | العنصر | التفصيل |
          |---|---|
          | خيار «عمق الجلب» | في `الإعدادات السريعة` (زر MENU داخل المشغّل): صفحة 1 فقط / 6 صفحات / 20 صفحة / **كل الصفحات** (افتراضي). يُخزَّن في `mac_depth` ويُطبَّق عند «إعادة تحميل القائمة» |
          | جلب قسم عند الضغط | `GridActivity.maybeFillCat`: لو القسم المحلي أقل من 14 عنصرًا يُجلب من السيرفر فورًا (`Stalker.fillCat`) ويُضاف للمحلي — فتح الأقسام الثقيلة ما بقاش يستنى التحميل الأول |
          | ميزانية وقت مختلفة لكل نوع | الأفلام 150 ثانية، المسلسلات 210 ثانية (المواسم أثقل)، وسقف 45 ألف عنصر لكل نوع حتى لا يعلق الجهاز |
          | إعادة ترقيم محلي | بعد أي إضافة تُعاد أرقام العناصر (`num = i+1`) حتى يبقى البحث والفرز صحيحين |


          ## التشغيل على GitHub

          1. أنشئ مستودعًا فارغًا وارفع فيه هذا الملف فقط: `.github/workflows/novaplay.yml`
          2. اعمل `push` → يبدأ البناء تلقائيًا (~4–6 دقائق).
          3. النتيجة: Artifact + GitHub Release بالتاج `nova-v8.2-build<رقم التشغيل>` وفيه `app-debug.apk` و `app-release.apk`.

          اختياري (لكل ميزات السحابة): ارفع `google-services.json` في جذر المستودع — الـ workflow ينسخه إلى `app/`
          ويُفعَّل بلجـن `google-services` تلقائيًا (راجع `app/build.gradle`).

          ## خريطة الميزات: من Rabie v138 إلى هنا

          | ميزة Rabie Pro v138 | المكان في كود Kotlin |
          |---|---|
          | توليد كل ملفات المشروع في CI ثم البناء والنشر | `.github/workflows/novaplay.yml` |
          | توقيع debug و release بنفس المفتاح (تحديث يثبت فوق القديم) | `app/build.gradle` + `app/debug.keystore` (base64 في الـ workflow) |
          | ثيم Crystal Black × Gold (`#F5C542`/`#E9BE5A`/`#FFDD7A` على `#0A1626`/`#0D1B33`/`#06080F`) | `res/values-night/colors.xml` + `res/values/theme.xml` |
          | ثيم Nova Maroon (هوية NovaPlay) | `res/values/colors.xml` + زر التبديل في الإعدادات |
          | `state_focused` على كل عنصر (استعمال الريموت) | كل الـ selectors: `sel_row.xml`, `card_bg.xml`, `tab_bg.xml`, `btn_gold.xml`, `btn_ghost.xml`, `input_gold.xml`, `circle_gold.xml`, `seekbar_gold.xml` |
          | شريط بحث + تبويبات (قنوات/أفلام/مسلسلات/⭐/🕐/⚙) | `res/layout/activity_live.xml` |
          | أعمدة: لاعب + قائمة عناصر + مجموعات | `activity_live.xml` (0.40 / 0.35 / 0.25) |
          | SmartLoad: تغطية تحميل بنسبة + كاش ذكي + إعادة محاولة + مصدر بديل | `LiveActivity.kt` (`onPlaybackStateChanged`, `tick`, `onPlayerError`) + `Sources.kt` (`Loader`) |
          | Seekbar ذهبي لـ VOD | `res/drawable/seekbar_gold.xml`, `seek_thumb.xml` + `activity_live.xml` |
          | بطاقة عائمة دائمة (PiP) | `pipBox` في `activity_live.xml` + `showPip()` |
          | بث للتلفاز / DLNA عبر MediaRouter | `androidx.mediarouter` + `MediaRouteButton` في `activity_live.xml` (`setupCast()`) |
          | M3U (EXTINF, group-title, tvg-logo, catchup) | `Sources.kt` → `M3u` |
          | Xtream Codes (فئات/بث/أفلام/مسلسلات/حلقات/EPG قصير) | `Sources.kt` → `Xtream` |
          | MAC Portal / Stalker: `handshake?pre_auth=1&mac=` → `js.token` ثم `get_profile` و`result.status=="1"` | `Sources.kt` → `Stalker.connect()` |
          | تصنيفات البوابة `type=itv\|vod\|series&action=get_categories` (js[] فيه id/title) | `Stalker.catsOf/liveCategories/categories` |
          | قوائم بـ `action=get_ordered_list&category=<id>` (مع `genre=` و`p=` و`search` احتياطًا) | `Stalker.ordered` + `Loader.macOrdered` |
          | `screenshot_uri` + `cmd` + `name` لعناصر الأفلام والمسلسلات | `Stalker.ordered` (خريطة الحقول المرنة) |
          | `type=series&action=get_series_info&movie_id=` → مواسم `js.series{k}.series[]` | `Stalker.seriesInfo` + `Loader.macEpisodes` |
          | ترويسات `Authorization: Bearer <token>` و`X-User-Agent: Mozilla/5.0 (QtEmbedded; Linux; C)` | `Stalker.headers` |
          | أقسام + `get_ordered_list` بترقيم الصفحات (`p`, `totalPages`, `search`, `detailed=1`) | `Stalker.categories/ordered` + `Loader.macOrdered` |
          | تحويل `cmd` الداخلي إلى رابط HTTP عبر `create_link` لكل نوع (`itv`/`vod`/`series`) | `Stalker.playable(kind,cmd)` + `Loader.macPlayable` |
          | حلقات مسلسلات البوابة عبر `series_id` | `Stalker.episodes` + `Loader.macEpisodes` |
          | نسختا ترويسات + 4 صيغ استعلام بديلة (`p`/`number`/`sortby`/`detailed`) حتى ترجع القائمة | `Stalker.headers/get`, `Stalker.ordered` |
          | قسم «ALL» اصطناعي إذا لم تُرجع البوابة تصنيفات، وتقسيم البحث على الخادم | `Stalker.categories` + `GridActivity.loadMac` |
          | تجميع كل الأشكال (`js`/`result`/`data`/`list`/خريطة id→عنصر) قبل القراءة | `Stalker.node/items` |
          | تسجيل دخول عبر Realtime DB + مطابقة نصية | `Cloud.kt` → `Remote.login()` |
          | فحص `blocked` والانتهاء بصيغ متعددة | `Cloud.kt` + `Sources.kt` → `Expiry` |
          | منع مشاركة الحساب (جلسات/أجهزة) | `Remote.login()` + `Remote.watchSession()` |
          | watchdog 25 ثانية | `MainActivity.armWatchdog()` و `LiveActivity.armWd()` |
          | FCM + topic `all` + إشعارات + أوامر (reload/update/block) | `Cloud.kt` → `NovaMessagingService`, `Remote.subscribeAll/pushToken` |
          | تحديث ذاتي OTA: أجزاء base64 من RTDB + شريط تقدم + تثبيت عبر FileProvider | `Cloud.kt` → `Ota` (تنزيل/تثبيت فقط) |
          | رابط تحديث بديل عند غياب القاعدة | `Ota.check/download` (عقدة `app/url`) |
          | لا تشغيل في الخلفية: إيقاف المشغّل عند المغادرة واستئناف الموضع عند الرجوع | `LiveActivity.onPause/resumeLast` + مفتاح `bg_play` |
          | فقدان التركيز الصوتي + إيقاف عند نزع السماعة | `LiveActivity.buildPlayer` (`setAudioAttributes(…, true)`, `setHandleAudioBecomingNoisy`) |
          | كتابة رقم القناة بالأرقام (ريموت) + تنقّل بالقنوات بالأسهم | `LiveActivity.onKeyDown/commitDial` + `tvDial` في `activity_live.xml` |
          | سرعة التشغيل، اختيار مسار الصوت/الترجمة، مقياس الصورة | `LiveActivity.cycleSpeed/tracksDialog/cycleResize` |
          | بحث مؤجَّل (debounce) وأداء أفضل للقوائم الضخمة | `LiveActivity`/`GridActivity` (handler 240–300ms) + `itemAnimator = null`, `setHasFixedSize`, prefetch |
          | تم حذف لوحة الأدمن من التطبيق (لا شاشة، لا Manifest entry، لا نشر OTA من داخله) | أُزيل `AdminActivity.kt` و `activity_admin.xml` و `item_admin.xml` و `Ota.publish` |
          | CrashGuard: إعادة تشغيل بعد 1.2 ثانية + سجل أعطال | `Cloud.kt` → `Crash` |
          | MemoryManager: تنظيف كل 10 دقائق | `Cloud.kt` → `Memory` |
          | مفضلات + سجل + مجموعات مخصصة + قفل مجموعة | `LiveActivity.kt` (`toggleFav`, `pushRecent`, `saveMine/loadMine`, `unlockDialog`) |
          | نشر تلقائي على GitHub Releases مع كل push | خطوة `Publish Release` |

          ## ملاحظات أمنية (مهمة)

          * الدخول يقارن كلمة المرور **نصيًا** داخل `users/<user>`, والتحديثات تُنزَّل من نفس القاعدة — لذلك **قواعد
            Realtime Database هي خط الدفاع الوحيد**. اجعل الكتابة مقصورة على الأدمن:
            ```json
            { "rules": { "nova": { "play138": {
                ".read": "auth != null",
                ".write": "auth.token.admin === true"
            }}}}}
            ```
          * لم تعد هناك لوحة أدمن داخل التطبيق: إدارة المستخدمين والمجموعات تُكتب مباشرة في Realtime Database.
          * `usesCleartextTraffic=true` مسموح لأجل روابط `http` للقنوات؛ إن كانت قائمتك كلها `https` أغلقها.
          * النشر الذاتي للـ OTA يقرأ APK المثبت ويرفعه للقاعدة: استعمله فقط من نسخة مبنية للإرسال، وفعّل حقل `md5`
            ليُرفض أي ملف لا يطابق البصمة.
          * مع كل `push` يُنشَر Release جديد — لا تدمج فروعا حساسة تلقائيًا.

          ## التحقّق الذي جرى

          * `gradle :app:assembleDebug :app:assembleRelease` → **BUILD SUCCESSFUL** (AGP 8.2.2 / Kotlin 1.9.22 / SDK 34).
          * `aapt2 dump badging` → `package: name='com.nova.play' versionCode='82' versionName='8.2'` + launchable
            و leanback-launchable + الأذونات (`INTERNET`, `POST_NOTIFICATIONS`, `REQUEST_INSTALL_PACKAGES`, …).
          * بصمة التوقيع في debug و release متطابقة: `1ead6aba…d57b79` (حتى يثبت التحديث فوق النسخة الحالية).
          * ملف الـ workflow فُصِل بـ PyYAML ونُفّذ أمر توليده في مجلد نظيف: **70 ملفًا مطابقة حرفيًا** لمشروع المصدر.
          * غير مُختبَر على جهاز حقيقي (لا محاكي هنا): منطق التشغيل/الدخول مُراجَع كودًا فقط.

          ## إعادة توليد الـ workflow بعد أي تعديل

          ```bash
          python3 tools/gen_workflow.py       # يولّد .github/workflows/novaplay.yml من الملفات
          python3 tools/verify_workflow.py /tmp/verify   # ينفّذ أمر التوليد ويقارن الناتج حرفيًا
          ```


