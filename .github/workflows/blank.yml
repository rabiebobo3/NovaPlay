              // =============================== الحراسة ===============================

              private fun armWatchdog(ms: Long) {
                  wdArmed = true
                  wdAt = SystemClock.elapsedRealtime() + ms
              }

              private fun disarmWatchdog() {
                  wdArmed = false
                  setVis(R.id.wdBar, false)
              }

              private fun checkWatchdog() {
                  if (!wdArmed) return
                  val p = player ?: return
                  if (p.isPlaying || p.playbackState == Player.STATE_READY) { wdArmed = false; return }
                  if (SystemClock.elapsedRealtime() < wdAt) return
                  wdArmed = false
                  Crash.note("WD", "الحراسة: لا تشغيل خلال المهلة ⇒ " + (if (softFails < 2) "إعادة تحضير ناعمة" else "مصدر/رابط جديد"))
                  if (softFails < 2) failSoft() else {
                      val c = cur
                      if (c != null) { freshTried = false; softFails = 0; startPlay(c, true) }
                      else failHard("لا يوجد بث — تحقّق من الشبكة")
                  }
              }

              // =============================== النبض (tick) ===============================

              private fun tick() {
                  val p = player ?: return
                  checkWatchdog()
                  val now = SystemClock.elapsedRealtime()
                  try {
                      val pos = p.currentPosition
                      val dur = p.duration
                      val buf = p.bufferedPosition
                      if (!live && dur > 0) {
                          val pr = ((pos * 1000L) / dur).toInt().coerceIn(0, 1000)
                          text(tvPos, fmtTime(pos))
                          text(tvDur, fmtTime(dur))
                          text(tvFullPos, fmtTime(pos))
                          text(tvFullDur, fmtTime(dur))
                          sbDock?.max = 1000
                          sbFull?.max = 1000
                          if (sbDock?.progress != pr) sbDock?.progress = pr
                          if (sbFull?.progress != pr) sbFull?.progress = pr
                      } else {
                          val sec = if (dur > 0) ((buf * 1000L) / dur).toInt().coerceIn(0, 1000) else 0
                          sbDock?.max = 1000
                          sbFull?.max = 1000
                          if (sbDock?.secondaryProgress != sec) sbDock?.secondaryProgress = sec
                          if (sbFull?.secondaryProgress != sec) sbFull?.secondaryProgress = sec
                          text(tvPos, "")
                          text(tvDur, "")
                          text(tvFullPos, "")
                          text(tvFullDur, "")
                      }
                      if (now - lastTick >= 1000L) {
                          lastTick = now
                          val lag = ((buf - pos) / 1000.0).coerceAtLeast(0.0)
                          val s = String.format(Locale.FRANCE, "تأخير البث %.0f ث", lag)
                          text(tvSpeed, s)
                          text(tvDockSpeed, String.format(Locale.FRANCE, "%.0fث", lag))
                          text(tvFullTxt, if (p.isPlaying) "جاري التشغيل" else "جاري التحميل")
                          if (isFav(cur)) text(tvPip, cur?.name ?: "") else text(tvPip, cur?.name ?: "")
                          val pid2 = cur?.let { c -> pl.indexOfFirst { sameChan(it, c) } } ?: -1
                          if (pid2 != pid) { pid = pid2 }
                          text(liSpeed, if (p.isPlaying) "►" else "❚❚")
                      }
                      if (p.isPlaying) {
                          stable++
                          if (stable == 9) { Ai.onStable(cur); stable = 10 }
                          if (stable % 12 == 0) savePos(false)
                      } else stable = 0
                  } catch (t: Throwable) {}
              }

              private fun text(v: TextView?, s: String) {
                  if (v == null) return
                  if (v.text?.toString() != s) v.text = s
              }

              private fun text(id: Int, s: String) {
                  try { text(findViewById<TextView>(id), s) } catch (t: Throwable) {}
              }

              private fun setVis(id: Int, on: Boolean) {
                  try {
                      val v = findViewById<View>(id) ?: return
                      if (on && v.visibility != View.VISIBLE) v.visibility = View.VISIBLE
                      if (!on && v.visibility != View.GONE) v.visibility = View.GONE
                  } catch (t: Throwable) {}
              }

              private fun showBusy(on: Boolean, t: String) {
                  if (on) text(R.id.tv_load_txt, t) else if (t.isNotBlank()) text(R.id.tv_load_txt, t)
                  setVis(R.id.dockBusy, on && !full)
                  setVis(R.id.fullBusy, on && full)
              }

              // =============================== الاستئناف والحفظ ===============================

              private fun posKey(c: Channel): String {
                  val id = if (c.id.isNotBlank()) c.id else c.name.hashCode().toString()
                  return "pos_" + kind + "_" + id + "_" + (if (c.mid.isNotBlank()) c.mid else "0")
              }

              private fun askResumeIfNeeded() {
                  if (live || askedResume) return
                  val c = cur ?: return
                  if (pendingSeek >= 0) return
                  val saved = sp.l(posKey(c), 0L)
                  val p = player ?: return
                  val dur = p.duration
                  if (saved < 20000L) return
                  if (dur > 0 && saved >= dur - 15000L) return
                  askedResume = true
                  AlertDialog.Builder(this)
                      .setTitle("استئناف المشاهدة")
                      .setMessage("هل تريد المتابعة من " + fmtTime(saved) + "؟")
                      .setPositiveButton("متابعة") { _, _ -> p.seekTo(saved); sp.put("resumed_" + posKey(c), true) }
                      .setNegativeButton("من البداية") { _, _ -> p.seekTo(0); sp.put(posKey(c), 0L) }
                      .show()
              }

              private fun savePos(force: Boolean) {
                  val c = cur ?: return
                  if (live) return
                  val p = player ?: return
                  val now = SystemClock.elapsedRealtime()
                  if (!force && now - lastSave < 6000L) return
                  lastSave = now
                  try {
                      val pos = p.currentPosition
                      val dur = p.duration
                      if (pos > 8000L && (dur <= 0 || pos < dur - 15000L)) {
                          sp.put(posKey(c), pos)
                          sp.put("last_pos", pos.toInt())
                          sp.put("last_pos_key", posKey(c))
                      }
                  } catch (t: Throwable) {}
              }

