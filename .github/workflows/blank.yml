           private fun show(which: String) {
            box = which
            gateBox.visibility = if (which == "gate") View.VISIBLE else View.GONE
            loginBox.visibility = if (which == "login") View.VISIBLE else View.GONE
            serverBox.visibility = if (which == "server") View.VISIBLE else View.GONE
            homeBox.visibility = if (which == "home") View.VISIBLE else View.GONE
            if (which == "server") fillServerForm()
            if (which == "home") refreshHome()
           }

           private fun refreshHome() {
            if (box != "home") return
            val exp = Catalog.expiry.ifBlank { "-" }
            homeExp.text = "قائمة التشغيل الحالية تنتهي: $exp"
            tvHomeStatus.text = when {
             Loader.busy -> "جارٍ التحميل…"
             Catalog.loaded -> "${Catalog.live.size + Catalog.movie.size + Catalog.series.size} عنصر • ${Catalog.status}"
             else -> "لم تُحمّل قائمة بعد"
            }
            tvLiveCount.text = if (Catalog.live.isEmpty()) "اضغط للتحميل" else "${Catalog.live.size} قناة"
           }



           private fun ensureSession() {
            sess = sp.s("auth_session")
            if (sess.isEmpty()) {
             sess = UUID.randomUUID().toString().take(18)
             sp.put("auth_session", sess)
            }
           }

           private fun startSessionWatch() {
            val u = sp.s("auth_user")
            if (u.isEmpty() || u == "guest") return
            sessionListener = Remote.watchSession(this, u, sess) {
             runOnUiThread { forceLogout("تم فتح الحساب على جهاز آخر") }
            }
           }

           private fun forceLogout(why: String) {
            Remote.logout(this, sp.s("auth_user"), sess)
            toast(why)
            show(if (Remote.ready()) "gate" else "server")
           }

           private fun doLogin() {
            val u = etLUser.text.toString().trim()
            val p = etLPass.text.toString()
            if (u.isEmpty() || p.isEmpty()) { tvLoginStatus.text = "أدخل المستخدم وكلمة المرور"; return }
            hideKeyboard(etLPass)
            tvLoginStatus.text = if (Remote.ready()) "جاري التحقق من السيرفر…" else "تحقق محلي…"
            busy("تسجيل الدخول…")
            Remote.login(this, u, p, sess) { ok, msg ->
             busyDone()
             tvLoginStatus.text = msg
             if (ok) {
              sp.put("auth_user", u)
              sp.put("auth_pass_cache", p)
              sp.put("auto_login", true)
              Remote.pushToken(this)
              Remote.subscribeAll(this)
              startSessionWatch()
              val prof = currentProfile()
              if (prof == null) { fillServerForm(); show("server"); toast("أدخل بيانات السيرفر") }
              else { show("home"); startLoad(false) }
             }
            }
           }



           private fun currentProfile(): Profile? {
            val t = sp.s("last")
            if (t.isEmpty()) return null
            return try { Profile.fromJson(JSONObject(t)) } catch (e: Exception) { null }
           }

           private fun fillServerForm() {
            val p = currentProfile() ?: return
            etUrl.setText(p.url); etUser.setText(p.user); etPass.setText(p.pass); etMac.setText(p.mac); etName.setText(p.name)
            spType.setSelection(when (p.type) { "xtream" -> 1; "mac" -> 2; else -> 0 })
           }

           private fun connect() {
            val p = Profile()
            p.type = when (spType.selectedItemPosition) { 1 -> "xtream"; 2 -> "mac"; else -> "m3u" }
            p.url = etUrl.text.toString().trim()
            p.user = etUser.text.toString().trim()
            p.pass = etPass.text.toString()
            p.mac = etMac.text.toString().trim()
            p.name = etName.text.toString().trim().ifBlank { if (p.type == "mac") p.mac else p.url }
            p.epg = ""
            p.added = System.currentTimeMillis()
            if (p.url.isEmpty()) { tvServerStatus.text = "أدخل الرابط أو البوابة"; return }
            if (p.type == "xtream" && (p.user.isEmpty() || p.pass.isEmpty())) { tvServerStatus.text = "أدخل المستخدم وكلمة المرور"; return }
            if (p.type == "mac" && p.mac.isEmpty()) { tvServerStatus.text = "أدخل عنوان MAC"; return }
            saveProfile(p)
            tvServerStatus.text = "تم الحفظ: ${p.name}"
            startLoad(false)
           }

           private fun saveProfile(p: Profile) {
            sp.put("last", p.toJson().toString())
            try {
             val a = JSONArray(sp.s("servers", "[]"))
             var idx = -1
             for (i in 0 until a.length()) if (a.getJSONObject(i).optString("url") == p.url && a.getJSONObject(i).optString("type") == p.type) idx = i
             val o = p.toJson()
             if (idx >= 0) a.put(idx, o) else a.put(o)
             sp.put("servers", a.toString())
            } catch (t: Throwable) { Crash.log(t) }
           }

           private fun savedServers() {
            val a = try { JSONArray(sp.s("servers", "[]")) } catch (t: Throwable) { JSONArray() }
            if (a.length() == 0) { toast("لا توجد سيرفرات محفوظة"); return }
            val names = ArrayList<String>()
            for (i in 0 until a.length()) {
             val o = a.getJSONObject(i)
             names.add(o.optString("name", "سيرفر " + (i + 1)) + " • " + o.optString("type"))
            }
            val dlg = AlertDialog.Builder(this).setTitle("السيرفرات المحفوظة")
             .setItems(names.toTypedArray()) { d, i ->
              val p = Profile.fromJson(a.getJSONObject(i))
              sp.put("last", p.toJson().toString())
              fillServerForm()
              d.dismiss()
              startLoad(true)
             }.setNeutralButton("حذف الكل") { _, _ ->
              sp.put("servers", "[]"); toast("حُذفت قائمة السيرفرات")
             }.setNegativeButton("إغلاق", null)
             .create()
            dlg.show()
           }

           private fun cancelLoad() {
            Loader.cancel = true
            busyDone()
            wdBar.visibility = View.GONE
            toast("أُلغي التحميل")
           }

           private fun startLoad(force: Boolean) {
            val p = currentProfile()
            if (p == null) { show("server"); toast("أدخل بيانات السيرفر أولًا"); return }
            busy("جاري تحميل القائمة…")
            armWatchdog()
            Loader.load(this, p, force, { txt -> runOnUiThread { tvBusy.text = txt } }) { ok, msg ->
             disarmWatchdog()
             busyDone()
             if (ok) {
              if (sp.s("auth_user").isEmpty()) sp.put("auth_user", "guest")
              show("home")
              startSessionWatch()
              if (msg.contains("كاش")) tvHomeStatus.text = msg
              toast("جاهز: ${Catalog.live.size} قناة • ${Catalog.movie.size} فيلم • ${Catalog.series.size} مسلسل")
              if (Catalog.bgRun) { bgWasRun = true; h.removeCallbacks(bgTick); h.postDelayed(bgTick, 1200) }
             } else {
              toast(msg.ifBlank { "تعذّر التحميل" })
              wdBar.visibility = View.VISIBLE
              findViewById<TextView>(R.id.tv_watchdog).text = "تعذّر تحميل القائمة — تحقق من الرابط/الاشتراك"
             }
            }
           }



           private var bgWasRun = false


           private val bgTick = object : Runnable {
            override fun run() {
             try {
              if (Catalog.bgRun) {
               tvHomeStatus.text = "جلب المحتوى… " + Catalog.bgMsg
               h.postDelayed(this, 1200)
              } else if (bgWasRun) {
               bgWasRun = false
               tvHomeStatus.text = "${Catalog.live.size + Catalog.movie.size + Catalog.series.size} عنصر • ${Catalog.status}"
               toast("اكتمل الجلب: ${Catalog.movie.size} فيلم • ${Catalog.series.size} مسلسل")
              }
             } catch (t: Throwable) { Crash.log(t) }
            }
           }

           private fun armWatchdog() {
            disarmWatchdog()
            val r = Runnable {
             if (Loader.busy) {
              wdBar.visibility = View.VISIBLE
              findViewById<TextView>(R.id.tv_watchdog).text = "البوابة لا تستجيب منذ 25 ثانية"
             }
            }
            loadTimeout = r
            h.postDelayed(r, 25_000)
           }

           private fun disarmWatchdog() {
            loadTimeout?.let { h.removeCallbacks(it) }
            loadTimeout = null
            wdBar.visibility = View.GONE
           }

           private fun busy(t: String) {
            tvBusy.text = t
            busyBox.visibility = View.VISIBLE
           }

           private fun busyDone() {
            busyBox.visibility = View.GONE
           }



           private fun openLive() {
            if (!Catalog.loaded) { startLoad(false); return }
            val i = android.content.Intent(this, LiveActivity::class.java)
            i.putExtra("mode", "live")
            i.addFlags(android.content.Intent.FLAG_ACTIVITY_SINGLE_TOP or android.content.Intent.FLAG_ACTIVITY_REORDER_TO_FRONT)
            startActivity(i)
           }

           private fun openGrid(kind: String) {
            if (!Catalog.loaded) { startLoad(false); return }
            val i = android.content.Intent(this, GridActivity::class.java)
            i.putExtra("kind", kind)
            startActivity(i)
           }


           private fun openAdmin() = openAccount()

           private fun openAccount() {
            val p = currentProfile()
            val u = sp.s("auth_user")
            val o = JSONObject()
            p?.let {
             o.put("النوع", it.type); o.put("الرابط", it.url)
             if (it.user.isNotEmpty()) o.put("المستخدم", it.user)
             if (it.mac.isNotEmpty()) o.put("MAC", it.mac)
            }
            o.put("الحساب", u.ifBlank { "ضيف" })
            o.put("انتهاء الاشتراك", Catalog.expiry)
            o.put("حالة الحساب", Catalog.status)
            o.put("جلسة", sess)
            o.put("FCM", sp.s("fcm", "غير مسجّل").take(18))
            val msg = StringBuilder()
            for (k in o.keys()) msg.append(k).append(": ").append(o.optString(k)).append("\n")
            AlertDialog.Builder(this).setTitle("الحساب").setMessage(msg.toString())
             .setPositiveButton("إغلاق", null)
             .setNeutralButton("خروج من الحساب") { _, _ -> forceLogout("تم الخروج") }
             .show()
           }

           private fun openSettings() {
            val items = listOf(
             "محاولة ذكية للتحميل (بديل)\uFE0E", "تبديل الثيم (Crystal / Maroon)", "تحميل جديد إجباري",
             "مسح المفضلة", "مسح سجل المشاهدة", "حذف ذاكرة الكاش", "سجل الأعطال", "حالة الذاكرة",
             "التحقق من التحديث", "حول التطبيق"
            )
            pickDialog("الإعدادات", items) { i ->
             when (i) {
              0 -> {
               sp.put("smart_alt", !sp.b("smart_alt", true))
               toast("المصدر البديل: " + if (sp.b("smart_alt", true)) "مفعّل" else "معطّل")
              }
              1 -> {
               sp.put("theme", if (sp.s("theme", "night") == "night") "day" else "night")
               (getApplication() as NovaApp).applyTheme(); recreate()
              }
              2 -> startLoad(true)
              3 -> { sp.put("favs", "[]"); toast("مسحت المفضلة") }
              4 -> { sp.put("recents", "[]"); toast("مسح السجل") }
              5 -> { Memory.trim(this, true); Memory.clearImageCache(this); toast("نُظّف الكاش") }
              6 -> {
               val log = Crash.read(this)
               AlertDialog.Builder(this).setTitle("سجل الأعطال").setMessage(log)
                .setPositiveButton("مسح السجل") { _, _ -> Crash.clear(this); toast("مُسح") }
                .setNeutralButton("مشاركة/نسخ") { _, _ ->
                 try {
                  val i = android.content.Intent(android.content.Intent.ACTION_SEND)
                  i.type = "text/plain"
                  i.putExtra(android.content.Intent.EXTRA_SUBJECT, "NovaPlay " + appVersion(this) + " — سجل الأعطال")
                  i.putExtra(android.content.Intent.EXTRA_TEXT, "NovaPlay " + appVersion(this) + "\n" + log.takeLast(4000))
                  startActivity(android.content.Intent.createChooser(i, "إرسال سجل الأعطال"))
                 } catch (t: Throwable) {
                  try {
                   val cb = getSystemService(CLIPBOARD_SERVICE) as android.content.ClipboardManager
                   cb.setPrimaryClip(android.content.ClipData.newPlainText("NovaPlay log", log.takeLast(4000)))
                   toast("نُسخ السجل — الصقه في أي تطبيق")
                  } catch (e: Throwable) { toast("تعذر النسخ") }
                 }
                }
                .setNegativeButton("إغلاق", null).show()
              }
              7 -> infoDialog("الذاكرة", Memory.dump(this))
              8 -> checkUpdate(true)
              9 -> infoDialog("NovaPlay", "مشغّل IPTV — Kotlin + media3\n" +
               "الثيم: Crystal Black × Gold / Nova Maroon\n" + appVersion(this) +
               "\nكل شيء يعمل داخل ملف GitHub Actions واحد.")
             }
            }
           }



           private fun checkUpdate(manual: Boolean) {
            if (manual) busy("فحص التحديث…")
            Ota.check(this, manual) { info, msg ->
             if (manual) busyDone()
             if (info == null) { if (manual) toast(msg.ifBlank { "لا يوجد تحديث" }); return@check }
             AlertDialog.Builder(this).setTitle("تحديث متوفر " + info.name)
              .setMessage(info.note.ifBlank { "تنزيل وتثبيت التحديث الآن؟" })
              .setPositiveButton("تنزيل") { _, _ -> doUpdate(info) }
              .setNegativeButton("لاحقًا", null).show()
            }
           }

           private fun offerUpdate(code: Long) {
            if (code <= 0) return
            Ota.check(this, true) { info, _ -> if (info != null) doUpdate(info) }
           }

           private fun doUpdate(info: Ota.Info) {
            OtaFlag.wantCancel = false
            val v = LinearLayout(this)
            v.orientation = LinearLayout.VERTICAL
            v.setPadding(40, 30, 40, 10)
            val pb = ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal)
            pb.max = 100
            val tv = TextView(this)
            tv.textSize = 13f
            v.addView(pb, LinearLayout.LayoutParams(-1, -2))
            v.addView(tv, LinearLayout.LayoutParams(-1, -2))
            bar = pb; barTxt = tv
            dlgProgress = AlertDialog.Builder(this).setTitle("تنزيل التحديث")
             .setView(v).setNegativeButton("إلغاء") { d, _ -> OtaFlag.wantCancel = true; d.dismiss() }
             .setCancelable(false).show()
            Ota.download(this, info, { pct, txt ->
             pb.progress = pct; tv.text = txt
            }) { f, msg ->
             dlgProgress?.dismiss(); dlgProgress = null
             if (f == null) { toast(msg); return@download }
             if (Ota.install(this, f)) toast("افتح شاشة التثبيت لإكمال التحديث")
            }
           }

           override fun onBackPressed() {
            when {
             busyBox.visibility == View.VISIBLE -> cancelLoad()
             box == "home" -> finishAffinity()
             box == "login" || box == "server" -> show(if (sp.s("auth_user").isNotEmpty()) "home" else "gate")
             else -> super.onBackPressed()
            }
           }

           private fun askNotifPermission() {
            if (Build.VERSION.SDK_INT < 33) return
            if (ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS)
             == PackageManager.PERMISSION_GRANTED) return
            try {
             requestPermissions(arrayOf(Manifest.permission.POST_NOTIFICATIONS), 71)
            } catch (t: Throwable) { Crash.log(t) }
           }
          }
