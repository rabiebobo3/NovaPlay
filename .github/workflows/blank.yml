              return a.toString()
          }

          fun decodeChans(text: String?, out: MutableList<Channel>) {
              out.clear()
              if (text.isNullOrEmpty()) return
              try {
                  val a = JSONArray(text)
                  for (i in 0 until a.length()) out.add(Channel.fromJson(a.getJSONObject(i)))
              } catch (t: Throwable) { /* قائمة تالفة — تجاهل */ }
