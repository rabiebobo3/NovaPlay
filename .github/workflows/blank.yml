        private interface Action { void run(); }

        private void confirmDelete(String msg, final Action a) {
        new AlertDialog.Builder(this)
        .setTitle("🗑️ تأكيد الحذف")
        .setMessage(msg + "\nلا يمكن التراجع!")
        .setPositiveButton("نعم، احذف", (d, w) -> a.run())
        .setNegativeButton("إلغاء", null)
        .show();
        }

        private void toggleBlock(String username, boolean newState) {
        try {
        db.child("users").child(username).child("blocked").setValue(newState)
        .addOnSuccessListener(x -> { toast(newState ? "⛔ تم الحظر" : "✅ تم فك الحظر"); rebuild(); })
        .addOnFailureListener(e -> toast("❌ تعذر الحفظ — فعّل قواعد الكتابة في Firebase"));
        } catch (Exception e) { toast("❌ " + e.getMessage()); }
        }

        // ═══════════ نموذج إضافة/تعديل مشترك ═══════════
        private void userForm(final String username, DataSnapshot c) {
        LinearLayout box = new LinearLayout(this);
        box.setOrientation(LinearLayout.VERTICAL);
        box.setPadding(dp(18), dp(10), dp(18), 0);
        final EditText edtUser = makeInput("👤 اسم المستخدم", false);
        final EditText edtPass = makeInput("🔑 كلمة المرور", false);
        final EditText edtExpiry = makeInput("⏰ الانتهاء: 2026-12-31 أو 15-09-2026 — فارغ = بلا تحديد", false);
        final EditText edtServer = makeInput("🖥️ رقم السيرفر (مثال: server1) — فارغ = الافتراضي", false);
        final CheckBox chkBlocked = new CheckBox(this);
        chkBlocked.setText("⛔ محظور"); chkBlocked.setTextColor(TXT);
