        private void doLogin() {
        if (busy) return;
        String user = edtUser != null ? edtUser.getText().toString().trim() : "";
        String pass = edtPass != null ? edtPass.getText().toString() : "";
        if (user.isEmpty() || pass.isEmpty()) { showError("⚠️ أدخل اسم المستخدم وكلمة المرور"); return; }
        if (db == null) { showError("⚠️ تعذر تهيئة Firebase"); return; }
        loginPass = pass;
        busy = true; done = false;
        refreshUi();
        showError("");
        startWatchdog(false);
        try {
        db.child("users").child(user).get()
        .addOnSuccessListener(snap -> {
        if (done) return; done = true; stopWatchdog();
        try {
        if (snap == null || !snap.exists()) { fail("❌ اسم المستخدم غير موجود"); return; }
        String dbPass = sval(snap.child("password"));
        String blockedS = sval(snap.child("blocked")).toLowerCase(Locale.US);
        String expiry = sval(snap.child("expiry"));
        String serverId = sval(snap.child("server_id"));
        if (dbPass.isEmpty()) { fail("❌ كلمة المرور غير معرفة في قاعدة البيانات"); return; }
        if (!dbPass.equals(pass)) { fail("❌ كلمة المرور غير صحيحة"); return; }
        if (blockedS.equals("true") || blockedS.equals("1")) { fail("⛔ هذا الحساب محظور، تواصل مع الإدارة"); return; }
        if (!expiryOk(expiry)) { fail("⏰ انتهى الاشتراك بتاريخ " + expiry + " — تواصل مع الإدارة"); return; }
        // منع مشاركة الحساب: إنشاء رمز جلسة جديد يبطل الجلسات الأخرى
        String token = UUID.randomUUID().toString();
        try { db.child("sessions").child(user).setValue(token); } catch (Exception ignored) {}
        fetchServerAndProceed(user, serverId, token);
        } catch (Exception e) { fail("⚠️ خطأ: " + e.getClass().getSimpleName()); }
        })
        .addOnFailureListener(e -> { if (done) return; done = true; stopWatchdog(); fail("⚠️ تعذر الاتصال: " + friendly(e.getMessage())); });
        } catch (Exception e) { done = true; stopWatchdog(); fail("⚠️ " + e.getMessage()); }
        }

        private void revalidateSession() {
        // فحص الحساب في كل فتح للتطبيق: حظر/انتهاء/حذف/كلمة مرور/استخدام على جهاز آخر
        String u = prefs.getString("username", "");
        if (u.isEmpty() || db == null) { goHome(); return; }
        busy = true; done = false;
        refreshUi();
        startWatchdog(true);
        try {
        db.child("users").child(u).get()
        .addOnSuccessListener(snap -> {
        if (done) return; done = true; stopWatchdog();
        try {
        if (snap == null || !snap.exists()) { endSession("⛔ الحساب لم يعد موجوداً في قاعدة البيانات"); return; }
        String b = sval(snap.child("blocked")).toLowerCase(Locale.US);
        String ex = sval(snap.child("expiry"));
        String p = sval(snap.child("password"));
        if (b.equals("true") || b.equals("1")) { endSession("⛔ تم حظر هذا الحساب، تواصل مع الإدارة"); return; }
        if (!expiryOk(ex)) { endSession("⏰ انتهى الاشتراك بتاريخ " + ex + " — تواصل مع الإدارة"); return; }
        String saved = prefs.getString("password", "");
        if (!saved.isEmpty() && !p.isEmpty() && !saved.equals(p)) { endSession("🔁 تم تغيير كلمة المرور، سجّل الدخول من جديد"); return; }
        String sid = sval(snap.child("server_id"));
        refreshBindingAndCheckToken(u, sid);
        } catch (Exception e) { goHome(); }
        })
        .addOnFailureListener(e -> { if (done) return; done = true; stopWatchdog(); goHome(); });
        } catch (Exception e) { done = true; stopWatchdog(); goHome(); }
        }

        private void checkSessionToken(String u) {
        // مقارنة رمز الجلسة: إذا دخل بنفس الحساب من جهاز آخر يُفصل هذا الجهاز
        try {
        db.child("sessions").child(u).get()
        .addOnSuccessListener(s -> {
        String remote = sval(s);
        String local = prefs.getString("session_token", "");
        if (!remote.isEmpty() && !local.isEmpty() && !remote.equals(local)) { endSession("👥 هذا الحساب مفتوح على جهاز آخر"); return; }
        if (remote.isEmpty() && !local.isEmpty()) { try { db.child("sessions").child(u).setValue(local); } catch (Exception ignored) {} }
        checkForUpdate(this::goHome);
        })
        .addOnFailureListener(e -> goHome());
        } catch (Exception e) { goHome(); }
        }

        private void fetchServerAndProceed(String user, String serverId, String token) {
        if (serverId == null || serverId.isEmpty()) { fetchSettingsAndFinish(user, token); return; }
        resolveAndFetch(serverId, () -> fetchSettingsAndFinish(user, token));
        }

        private interface Next { void run(); }

        private void resolveAndFetch(String sid, final Next next) {
        try {
        db.child("servers").child(sid).get().addOnSuccessListener(s -> {
        boolean exists = s != null && s.exists();
        String alt = sid.matches("\\d+") ? ("server" + sid) : "";
        if (!exists && !alt.isEmpty()) {
        try {
        db.child("servers").child(alt).get().addOnSuccessListener(s2 -> handleServerSnap(s2, alt, next)).addOnFailureListener(e -> next.run());
        } catch (Exception e) { next.run(); }
        } else handleServerSnap(s, sid, next);
        }).addOnFailureListener(e -> next.run());
        } catch (Exception e) { next.run(); }
        }

        private void handleServerSnap(DataSnapshot s, final String id, final Next next) {
        try {
        if (s != null && s.exists()) {
        savePendingServer(s, id);
        String newHash = String.valueOf(prefs.getString("pending_server", "").hashCode());
        String oldHash = prefs.getString("fb_server_hash", "");
        String oldSid = prefs.getString("fb_server_id", "");
        prefs.edit().putString("fb_server_id", id).putString("fb_server_hash", newHash).apply();
        if (newHash.equals(oldHash) && oldSid.equals(id)) prefs.edit().remove("pending_server").apply();
        } else {
        prefs.edit().putString("fb_server_id", "").remove("pending_server").apply();
        }
        } catch (Exception e) {}
        next.run();
        }

        private void refreshBindingAndCheckToken(final String u, final String sid) {
        if (sid == null || sid.isEmpty()) {
        prefs.edit().putString("fb_server_id", "").apply();
        try {
        db.child("settings").child("m3u_url").get().addOnSuccessListener(s -> {
        try {
        String m3u = sval(s);
        if (!m3u.isEmpty()) {
        org.json.JSONObject o = new org.json.JSONObject();
        o.put("type", "m3u"); o.put("url", m3u); o.put("name", "قائمة RabiePro");
        prefs.edit().putString("pending_server", o.toString()).apply();
        }
        } catch (Exception ignored) {}
        checkSessionToken(u);
        }).addOnFailureListener(e -> checkSessionToken(u));
        } catch (Exception e) { checkSessionToken(u); }
        return;
        }
        resolveAndFetch(sid, () -> checkSessionToken(u));
        }

        private void savePendingServer(DataSnapshot s, String serverId) throws Exception {
        String type = sval(s.child("type"));
        org.json.JSONObject o = new org.json.JSONObject();
        o.put("name", !sval(s.child("name")).isEmpty() ? sval(s.child("name")) : "سيرفر RabiePro");
        if (type.equalsIgnoreCase("xtream")) {
        o.put("type", "xtream");
        o.put("url", sval(s.child("url")));
        o.put("username", sval(s.child("username")));
        o.put("password", sval(s.child("password")));
        } else if (type.equalsIgnoreCase("mac")) {
        o.put("type", "mac");
        o.put("url", sval(s.child("portal")));
        o.put("mac", sval(s.child("mac")));
        } else {
        o.put("type", "m3u");
        o.put("url", sval(s.child("url")));
        }
        prefs.edit().putString("pending_server", o.toString()).apply();
        }

        private void fetchSettingsAndFinish(String user, String token) {
        try {
        db.child("settings").get().addOnSuccessListener(s -> {
        try {
        if (s != null && s.exists()) {
        String msg = sval(s.child("msg"));
        String m3u = sval(s.child("m3u_url"));
        if (!msg.isEmpty()) prefs.edit().putString("welcome_msg", msg).apply();
        if (prefs.getString("pending_server", "").isEmpty() && prefs.getString("fb_server_id", "").isEmpty() && !m3u.isEmpty()) {
        org.json.JSONObject o = new org.json.JSONObject();
        o.put("type", "m3u"); o.put("url", m3u); o.put("name", "قائمة RabiePro");
        prefs.edit().putString("pending_server", o.toString()).apply();
        }
        }
        } catch (Exception ignored) {}
        finishLogin(user, token);
        }).addOnFailureListener(e -> finishLogin(user, token));
        } catch (Exception e) { finishLogin(user, token); }
        }

        private void finishLogin(String user, String token) {
        busy = false; done = true; stopWatchdog();
        prefs.edit().putBoolean("logged_in", true).putString("username", user).putString("password", loginPass).putString("session_token", token == null ? "" : token).apply();
        Toast.makeText(this, "✅ أهلاً " + user + " — تم الدخول بنجاح", Toast.LENGTH_SHORT).show();
        checkForUpdate(this::goHome);
        }

        private void initNotifications() {

        try {
        if (android.os.Build.VERSION.SDK_INT >= 33 && ContextCompat.checkSelfPermission(this, android.Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
        ActivityCompat.requestPermissions(this, new String[]{android.Manifest.permission.POST_NOTIFICATIONS}, 101);
        }
        } catch (Exception e) {}
        }

        private void checkForUpdate(final Next next) {
        try {
        int vc = getPackageManager().getPackageInfo(getPackageName(), 0).versionCode;
        db.child("app_apk").child("meta").get().addOnSuccessListener(s -> {
        try {
        if (s != null && s.exists()) {
        String vcStr = sval(s.child("versionCode"));
        int latest = vcStr.isEmpty() ? 0 : Integer.parseInt(vcStr);
        long size = 0; try { size = Long.parseLong(sval(s.child("size"))); } catch (Exception e) {}
        if (latest > vc && latest != prefs.getInt("update_asked_vc", -1)) {
        String msg = "إصدار جديد (" + latest + ") متاح الآن" + (size > 0 ? " — الحجم: " + Math.max(1, size / (1024 * 1024)) + "MB" : "") + ".\nبعد التحميل: إذا سُئلت عن السماح بالتثبيت اختر «السماح».\nسيتم التحميل والتثبيت بعد موافقتك.";
        new AlertDialog.Builder(this)
        .setTitle("📥 تحديث جديد متوفر")
        .setMessage(msg)
        .setPositiveButton("📥 تحديث الآن", (d, w) -> { try { prefs.edit().putInt("update_asked_vc", latest).apply(); } catch (Exception e2) {} downloadAndInstall(next); })
        .setNegativeButton("لاحقاً", (d, w) -> { try { prefs.edit().putInt("update_asked_vc", latest).apply(); } catch (Exception e2) {} next.run(); })
        .setCancelable(false)
        .show();
        return;
        }
        if (latest > vc) { /* رقم السيرفر أقدم من تحديث سبق عرضه — لا نكرر الإزعاج */ }
        }
        } catch (Exception e) {}
        checkUrlUpdate(vc, next);
        }).addOnFailureListener(e -> checkUrlUpdate(vc, next));
        } catch (Exception e) { next.run(); }
        }

        private void checkUrlUpdate(int vc, final Next next) {
        try {
        db.child("app_update").get().addOnSuccessListener(s -> {
        try {
        String vcStr = sval(s.child("versionCode"));
        int latest = vcStr.isEmpty() ? 0 : Integer.parseInt(vcStr);
        String url = sval(s.child("url"));
        String msg = sval(s.child("msg"));
        if (latest > vc && !url.isEmpty() && latest != prefs.getInt("update_asked_vc", -1)) {
        new AlertDialog.Builder(this)
        .setTitle("📥 تحديث جديد متوفر")
        .setMessage(msg.isEmpty() ? ("إصدار جديد من التطبيق متاح الآن (إصدار " + latest + ").") : msg)
        .setPositiveButton("📥 فتح صفحة التحميل", (d, w) -> { try { prefs.edit().putInt("update_asked_vc", latest).apply(); } catch (Exception e2) {} try { startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(url))); } catch (Exception e) {} next.run(); })
        .setNegativeButton("لاحقاً", (d, w) -> { try { prefs.edit().putInt("update_asked_vc", latest).apply(); } catch (Exception e2) {} next.run(); })
        .setCancelable(false)
        .show();
        return;
        }
        } catch (Exception e) {}
        next.run();
        }).addOnFailureListener(e -> next.run());
        } catch (Exception e) { next.run(); }
        }

        private void downloadAndInstall(final Next next) {
        android.widget.LinearLayout box = new android.widget.LinearLayout(this);
        box.setOrientation(android.widget.LinearLayout.VERTICAL);
        int p = (int) (18 * getResources().getDisplayMetrics().density);
        box.setPadding(p, p, p, p);
        android.widget.ProgressBar pb = new android.widget.ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal);
        pb.setMax(100); pb.setProgress(0);
        final android.widget.TextView st = new android.widget.TextView(this);
        st.setText("جاري تجهيز التحميل...");
        st.setTextColor(0xFFF2F6FC); st.setTextSize(14); st.setPadding(0, p / 2, 0, 0);
        box.addView(pb); box.addView(st);
        final AlertDialog dlg = new AlertDialog.Builder(this)
        .setTitle("📥 جاري تحميل التحديث")
        .setView(box)
        .setCancelable(false)
        .create();
        final java.io.ByteArrayOutputStream acc = new java.io.ByteArrayOutputStream();
        dlg.show();
        try {
        db.child("app_apk").child("meta").get().addOnSuccessListener(s -> {
        try {
        int parts = Integer.parseInt(sval(s.child("parts")));
        if (parts < 1 || parts > 200) { dlg.dismiss(); Toast.makeText(this, "⚠️ بيانات التحديث غير صالحة", Toast.LENGTH_LONG).show(); next.run(); return; }
        downloadPart(0, parts, acc, dlg, pb, st, next);
        } catch (Exception e) { dlg.dismiss(); next.run(); }
        }).addOnFailureListener(e -> { dlg.dismiss(); Toast.makeText(this, "⚠️ تعذر بدء التحميل", Toast.LENGTH_SHORT).show(); next.run(); });
        } catch (Exception e) { dlg.dismiss(); next.run(); }
        }

        private void downloadPart(final int i, final int total, final java.io.ByteArrayOutputStream acc, final AlertDialog dlg, final android.widget.ProgressBar pb, final android.widget.TextView st, final Next next) { downloadPart(i, total, acc, dlg, pb, st, next, 0); }

        private void downloadPart(final int i, final int total, final java.io.ByteArrayOutputStream acc, final AlertDialog dlg, final android.widget.ProgressBar pb, final android.widget.TextView st, final Next next, final int attempt) {
        try {
        db.child("app_apk").child("part_" + i).get()
        .addOnSuccessListener(s -> {
        try {
        String b64 = sval(s);
        if (b64.isEmpty()) throw new IllegalStateException("part empty");
        byte[] chunk = android.util.Base64.decode(b64, android.util.Base64.NO_WRAP);
        acc.write(chunk, 0, chunk.length);
        int pct = (int) Math.min(99, (i + 1) * 100L / total);
        try { pb.setProgress(pct); st.setText("التحميل: الجزء " + (i + 1) + " من " + total + " (" + pct + "%)"); } catch (Exception e) {}
        if (i + 1 < total) downloadPart(i + 1, total, acc, dlg, pb, st, next);
        else {
        try { st.setText("✅ اكتمل — جاري التثبيت..."); } catch (Exception e) {}
        dlg.dismiss();
        installApk(acc, next);
        }
        } catch (Exception e) {
        if (attempt < 2) { try { new android.os.Handler(android.os.Looper.getMainLooper()).postDelayed(() -> downloadPart(i, total, acc, dlg, pb, st, next, attempt + 1), 1200); } catch (Exception e3) { try { dlg.dismiss(); } catch (Exception e2) {} Toast.makeText(this, "⚠️ فشل جزء من التحميل — حاول مجدداً", Toast.LENGTH_LONG).show(); next.run(); } return; }
        try { dlg.dismiss(); } catch (Exception e2) {}
        Toast.makeText(this, "⚠️ فشل جزء من التحميل — حاول مجدداً", Toast.LENGTH_LONG).show();
        next.run();
        }
        })
        .addOnFailureListener(e -> {
        if (attempt < 2) { try { new android.os.Handler(android.os.Looper.getMainLooper()).postDelayed(() -> downloadPart(i, total, acc, dlg, pb, st, next, attempt + 1), 1200); } catch (Exception e3) {} return; }
        try { dlg.dismiss(); } catch (Exception e2) {}
        Toast.makeText(this, "⚠️ تعذر التحميل — تحقق من الإنترنت", Toast.LENGTH_LONG).show();
        next.run();
        });
        } catch (Exception e) { try { dlg.dismiss(); } catch (Exception e2) {} next.run(); }
        }

        private void installApk(java.io.ByteArrayOutputStream acc, final Next next) {
        try {
        java.io.File out = new java.io.File(getCacheDir(), "rabie_update.apk");
        if (out.exists()) out.delete();
