                              val p = Catalog.profile ?: return@execute
                              if (p.type != "mac" || nxt.kind != "live" || online(nxt.url)) return@execute
                              if (pre.containsKey(key)) return@execute
                              Loader.macPlayable(p, nxt) { u ->
                                  try {
