        }

        /* --------------------------------- الكتالوج --------------------------------- */

        object Catalog {
            private const val PAGE_LOCAL = 150

            @Volatile var profile: Profile? = null
            @Volatile var loaded = false
            @Volatile var status = "-"
            @Volatile var expiry = "-"

            val live = ArrayList<Channel>()
            val liveCats = ArrayList<Group>()
            val movieCats = ArrayList<Group>()
            val seriesCats = ArrayList<Group>()

            private val buckets = HashMap<String, ArrayList<Channel>>()
            private val pageNo = HashMap<String, Int>()
            private val fetched = HashSet<String>()
            private val full = HashMap<String, ArrayList<Channel>>()

            fun cats(kind: String): List<Group> = when (kind) { "movie" -> movieCats; "series" -> seriesCats; else -> liveCats }

            fun bucket(kind: String, catId: String): ArrayList<Channel> {
                val k = kind + "|" + catId
                var b = buckets[k]
                if (b == null) { b = ArrayList(); buckets[k] = b }
                return b
            }

            fun reset() {
                live.clear()
                liveCats.clear(); movieCats.clear(); seriesCats.clear()
                buckets.clear(); pageNo.clear(); fetched.clear(); full.clear()
                loaded = false
                status = "-"
            }

            fun resetBuckets() { buckets.clear(); pageNo.clear() }

            /* ------------------------------ التحميل الأساسي ------------------------------ */

            fun load(ctx: Context, p: Profile, force: Boolean, progress: (String) -> Unit, done: (Boolean, String) -> Unit) {
                Bg.run {
                    val prog = { t: String -> Bg.ui { progress(t) } }
                    try {
                        Portal.drop()
                        profile = p
                        reset()
                        when (p.type) {
                            "mac" -> loadMac(ctx, p, force, prog)
                            "xtream" -> loadXtream(ctx, p, force, prog)
                            else -> loadM3u(ctx, p, force, prog)
                        }
                        loaded = true
                        val msg = "${live.size} قناة • ${movieCats.size} قسم أفلام • ${seriesCats.size} قسم مسلسلات"
                        status = msg
                        Diag.d("LOAD", p.type + " → " + msg)
                        Bg.ui { done(true, msg) }
                    } catch (t: Throwable) {
                        Diag.e(t)
                        val m = when (t) {
                            is java.io.InterruptedIOException -> "تم الإلغاء"
                            is java.io.IOException -> (t.message ?: "تعذّر الاتصال")
                            else -> "خطأ: " + (t.message ?: t.javaClass.simpleName)
                        }
                        Bg.ui { done(false, m) }
                    }
                }
            }

            private fun loadMac(ctx: Context, p: Profile, force: Boolean, prog: (String) -> Unit) {
                val st = Portal.get(p)
                prog("مصافحة البوابة…")
                if (!st.connect()) throw java.io.IOException(st.lastError.ifBlank { "تعذّر الاتصال بالبوابة" })
                prog("جلب الأقسام…")
                liveCats.addAll(st.cats("live"))
                movieCats.addAll(st.cats("movie"))
                seriesCats.addAll(st.cats("series"))
                addAllCat(liveCats)
                if (movieCats.isNotEmpty()) movieCats.add(0, Group().apply { id = "*"; name = "الكل" })
                if (seriesCats.isNotEmpty()) seriesCats.add(0, Group().apply { id = "*"; name = "الكل" })
                prog("جلب القنوات…")
                val f = Disk.page(ctx, p, "live")
                val cached = if (force) null else Disk.read(f)
                if (cached != null) chansFromJson(cached, live)
                if (live.isEmpty()) {
                    live.addAll(st.channels(Config.liveMax))
                    if (live.isNotEmpty()) Disk.write(f, chansToJson(live))
                }
                if (live.isEmpty() && liveCats.isEmpty()) throw java.io.IOException(st.lastError.ifBlank { "البوابة لم تُرجع بيانات" })
            }

            private fun loadXtream(ctx: Context, p: Profile, force: Boolean, prog: (String) -> Unit) {
                val x = XtreamApi(p)
                prog("التحقق من الحساب…")
                try {
                    val ui = JSONObject(Http.get(x.auth(), timeoutMs = 12000)).optJSONObject("user_info")
                    if (ui != null) {
                        status = ui.optString("status", "-")
                        expiry = humanExpiry(ui.optString("exp_date"))
                    }
                } catch (t: Throwable) {
                    Diag.e(t)
                }
                prog("جلب الأقسام…")
                liveCats.addAll(x.parseCats(Http.get(x.cats("live"))))
                movieCats.addAll(x.parseCats(Http.get(x.cats("movie"))))
                seriesCats.addAll(x.parseCats(Http.get(x.cats("series"))))
                addAllCat(liveCats)
                if (movieCats.isNotEmpty()) movieCats.add(0, Group().apply { id = "*"; name = "الكل" })
                if (seriesCats.isNotEmpty()) seriesCats.add(0, Group().apply { id = "*"; name = "الكل" })
                prog("جلب القنوات…")
                val f = Disk.page(ctx, p, "live")
                val cached = if (force) null else Disk.read(f)
                if (cached != null) chansFromJson(cached, live)
                if (live.isEmpty()) {
                    live.addAll(x.parseStreams(Http.get(x.streams("live", ""), timeoutMs = 25000), "live", "", ""))
                    if (live.isNotEmpty()) Disk.write(f, chansToJson(live))
                }
                if (live.isEmpty()) throw java.io.IOException("السيرفر لم يُرجع قنوات")
            }

            private fun loadM3u(ctx: Context, p: Profile, force: Boolean, prog: (String) -> Unit) {
                prog("تنزيل القائمة…")
                val f = Disk.page(ctx, p, "m3u")
                var txt = if (force) null else Disk.read(f)
                if (txt == null) {
                    txt = Http.get(p.url, timeoutMs = 40000, retries = 1)
                    Disk.write(f, txt)
                }
                prog("تحليل القائمة…")
                val mv = ArrayList<Channel>()
                val sr = ArrayList<Channel>()
                M3u.parse(txt, live, mv, sr)
                full["movie|*"] = mv
                full["series|*"] = sr
                liveCats.addAll(groupOf(live))
                movieCats.addAll(groupOf(mv))
                seriesCats.addAll(groupOf(sr))
                if (live.isEmpty() && mv.isEmpty()) throw java.io.IOException("القائمة فارغة أو غير مفهومة")
            }

            private fun addAllCat(list: MutableList<Group>) {
                if (list.isNotEmpty() && list.none { it.id == "*" }) list.add(0, Group().apply { id = "*"; name = "الكل" })
            }

            private fun groupOf(list: List<Channel>): List<Group> {
                val out = ArrayList<Group>()
                val byName = LinkedHashMap<String, Int>()
                for (c in list) byName[c.group] = (byName[c.group] ?: 0) + 1
                for ((k, v) in byName) out.add(Group().apply { id = k; name = k; count = v })
                return out.sortedBy { it.name }
            }

            /* ------------------------------ الترقيم الصفحي ------------------------------ */

            fun more(ctx: Context, kind: String, g: Group, cb: (Int, Boolean) -> Unit) {
                Bg.run {
                    val p = profile
                    if (p == null) { Bg.ui { cb(0, false) }; return@run }
                    val key = kind + "|" + g.id
                    val bucket = bucket(kind, g.id)
                    var added = 0
                    var hasMore = false
                    try {
                        when {
                            p.type == "mac" && kind != "live" -> {
                                val st = Portal.get(p)
                                if (!st.connect()) { Bg.ui { cb(0, false) }; return@run }
                                val page = (pageNo[key] ?: 0) + 1
                                val maxPages = when (Config.depth) { 0 -> 1; 1 -> 5; else -> 60 }
                                val file = Disk.page(ctx, p, kind + "_" + g.id + "_" + page)
                                val cached = Disk.read(file)
                                val list: List<Channel> = if (cached != null) {
                                    val t = ArrayList<Channel>()
                                    chansFromJson(cached, t)
                                    t
                                } else {
                                    st.ordered(kind, if (g.id == "*") "" else g.id, page)
                                }
                                if (cached == null && list.isNotEmpty()) Disk.write(file, chansToJson(list))
                                added = append(bucket, list)
                                pageNo[key] = page
                                hasMore = list.isNotEmpty() && page < maxPages && added > 0
                            }
                            else -> {
                                if (!fetched.contains(key)) {
                                    fetched.add(key)
                                    val all = ArrayList<Channel>()
                                    if (kind == "live") {
                                        all.addAll(if (g.id == "*") live else live.filter { it.group == g.name })
                                    } else {
                                        val src = full[kind + "|*"]
                                        if (src != null) {
                                            all.addAll(if (g.id == "*") src else src.filter { it.group == g.name })
                                        } else if (p.type == "xtream") {
                                            val x = XtreamApi(p)
                                            all.addAll(
                                                x.parseStreams(
                                                    Http.get(x.streams(kind, if (g.id == "*") "" else g.id), timeoutMs = 30000),
                                                    kind, g.name, g.id
                                                )
                                            )
                                        }
                                    }
                                    full[key] = all
                                }
                                val src = full[key] ?: emptyList()
                                val from = bucket.size
                                val to = minOf(src.size, from + PAGE_LOCAL)
                                if (from < to) {
                                    bucket.addAll(src.subList(from, to))
                                    added = to - from
                                }
                                hasMore = to < src.size
                            }
                        }
                    } catch (t: Throwable) {
                        Diag.e(t)
                    }
                    val a = added
                    val m = hasMore
                    Bg.ui { cb(a, m) }
                }
            }

            private fun append(bucket: ArrayList<Channel>, list: List<Channel>): Int {
                var n = 0
                val seen = HashSet<String>()
                for (c in bucket) seen.add(keyOf(c))
                for (c in list) {
                    if (c.name.isBlank()) continue
                    if (seen.add(keyOf(c))) { bucket.add(c); n++ }
                }
                return n
            }

            fun keyOf(c: Channel): String =
                if (c.id.isNotBlank()) "i" + c.id else "u" + c.url.ifBlank { c.cmd }

            /* ------------------------------ البحث ------------------------------ */

            fun search(ctx: Context, kind: String, q: String, cb: (List<Channel>) -> Unit) {
                Bg.run {
                    val p = profile
                    val out = ArrayList<Channel>()
                    try {
                        when {
                            p == null -> {}
                            p.type == "mac" -> {
                                val st = Portal.get(p)
                                if (st.connect()) out.addAll(st.ordered(kind, "", 1, q))
                            }
                            p.type == "xtream" -> {
                                val src = full[kind + "|*"]
                                if (src != null) out.addAll(src.filter { it.name.contains(q, true) }.take(200))
                                else out.addAll(live.filter { it.name.contains(q, true) }.take(200))
                            }
                            else -> {
                                val src = if (kind == "live") live else (full[kind + "|*"] ?: emptyList())
                                out.addAll(src.filter { it.name.contains(q, true) }.take(200))
                            }
                        }
                    } catch (t: Throwable) { Diag.e(t) }
                    Bg.ui { cb(out) }
                }
            }

            /* ------------------------------ المواسم والحلقات ------------------------------ */

            fun seasons(c: Channel, cb: (List<Channel>) -> Unit) {
                Bg.run {
                    val p = profile
                    var out: List<Channel> = emptyList()
                    try {
                        when {
                            p == null -> {}
                            p.type == "mac" -> {
                                val st = Portal.get(p)
                                if (st.connect()) out = st.seasons(c.mid.ifBlank { c.id }, c.name, c.logo)
                            }
                            p.type == "xtream" -> {
                                val x = XtreamApi(p)
                                out = x.parseEpisodes(Http.get(x.seriesInfo(c.id), timeoutMs = 25000))
                            }
                        }
                    } catch (t: Throwable) { Diag.e(t) }
                    val res = out
                    Bg.ui { cb(res) }
                }
            }

            fun episodes(mid: String, sid: String, cb: (List<Channel>) -> Unit) {
                Bg.run {
                    val p = profile
                    var out: List<Channel> = emptyList()
                    try {
                        if (p != null && p.type == "mac") {
                            val st = Portal.get(p)
                            if (st.connect()) out = st.episodes(mid, sid)
                        }
                    } catch (t: Throwable) { Diag.e(t) }
                    val res = out
                    Bg.ui { cb(res) }
                }
            }

            /* ------------------------------ رابط التشغيل ------------------------------ */

            fun link(c: Channel, cb: (String) -> Unit) {
                Bg.run {
                    var u = ""
                    val p = profile
                    try {
                        u = if (p != null && p.type == "mac") {
                            Portal.get(p).linkFor(c)
                        } else {
                            c.url.ifBlank { c.alt }
                        }
                    } catch (t: Throwable) { Diag.e(t) }
                    val res = u
                    Bg.ui { cb(res) }
                }
            }
        }

        /* --------------------------------- التطبيق --------------------------------- */

        class NovaApp : Application() {
            override fun onCreate() {
                super.onCreate()
                Diag.init(this)
                val prev = Thread.getDefaultUncaughtExceptionHandler()
                Thread.setDefaultUncaughtExceptionHandler { t, e ->
                    Diag.e(e)
                    try { prev?.uncaughtException(t, e) } catch (_: Throwable) {}
                }
                Cloud.initAsync(this)
                Config.load(this)
            }

            override fun onTrimMemory(level: Int) {
                super.onTrimMemory(level)
                if (level >= TRIM_MEMORY_UI_HIDDEN) {
                    try { Glide.get(this).clearMemory() } catch (_: Throwable) {}
                }
            }

            override fun onLowMemory() {
                super.onLowMemory()
                try { Glide.get(this).clearMemory() } catch (_: Throwable) {}
            }
        }

        /* --------------------------------- تواريخ --------------------------------- */

        fun humanExpiry(v: String?): String {
            if (v.isNullOrBlank()) return "غير محدد"
            val s = v.trim()
            if (s == "null" || s.equals("never", true) || s == "0") return "بدون انتهاء"
            s.toLongOrNull()?.let { n ->
                if (n > 0) {
                    val ms = if (n < 10_000_000_000L) n * 1000 else n
                    val d = (ms - System.currentTimeMillis()) / 86_400_000L
                    val left = when { d < 0 -> "منتهٍ"; d == 0L -> "ينتهي اليوم"; else -> "بقي $d يوم" }
                    return SimpleDateFormat("yyyy-MM-dd", Locale.US).format(java.util.Date(ms)) + " ($left)"
                }
            }
            return s
        }
