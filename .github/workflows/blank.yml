           *     ⇒ كل شعار قناة/بوستر فيلم يُنزَّل من الشبكة من جديد ⇒ ثقل واضح وانتظار
           *     (وأكثر بعد الرجوع من المشغّل). الإصلاح: المسح فقط عند الضغط الفعلي للذاكرة
           *     أو عند طلب المستخدم (الإعدادات ← حذف الكاش).
           *  2) توقيف طلبات Glide عند الخروج من الشاشة (pauseRequests) واستئنافها عند العودة
