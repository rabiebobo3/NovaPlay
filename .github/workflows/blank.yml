    - name: Build APK (debug + release)
      run: |
        set -e   # (8.42.15) أول خطأ يوقف الخطوة فورًا (كانت موجودة في خطوة التوليد فقط)
        if command -v gradle >/dev/null 2>&1; then gradle wrapper --gradle-version 8.5 >/dev/null 2>&1 || true; fi
        if [ -x ./gradlew ]; then chmod +x ./gradlew; RUN=./gradlew; else RUN=gradle; fi
        $RUN :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace --parallel   # (8.42.15)
        ls -lh app/build/outputs/apk/debug app/build/outputs/apk/release
        DBG=$(du -h app/build/outputs/apk/debug/app-debug.apk 2>/dev/null | cut -f1 || echo "-")
        REL=$(du -h app/build/outputs/apk/release/app-release.apk 2>/dev/null | cut -f1 || echo "-")
        echo "### NovaPlay APK" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"
        echo "- debug: $DBG" >> "$GITHUB_STEP_SUMMARY"
        echo "- release: $REL" >> "$GITHUB_STEP_SUMMARY"
        echo "- الحزمة: com.nova.play — الاصدار $VERSION_NAME (code $VERSION_CODE)" >> "$GITHUB_STEP_SUMMARY"
        echo "- اللغات: Kotlin 1.9.22 + media3 1.4.1 + Firebase RTDB/FCM + Glide + MediaRouter" >> "$GITHUB_STEP_SUMMARY"

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: NovaPlay-Kotlin-v${{ env.VERSION_CODE }}-build${{ github.run_number }}
        path: |
          app/build/outputs/apk/debug/app-debug.apk
          app/build/outputs/apk/release/app-release.apk
        if-no-files-found: error
        retention-days: 30   # (8.42.15) لا تتراكم نسخ APK قديمة على المستودع

    - name: Publish Release
      if: success()
      uses: softprops/action-gh-release@v2
      with:
        tag_name: nova-v${{ env.VERSION_NAME }}-build${{ github.run_number }}
        name: NovaPlay Kotlin v${{ env.VERSION_NAME }} (com.nova.play) build ${{ github.run_number }}
        body: |
          APK مبني من ملف Workflow واحد — Kotlin + media3.
          ميزات: M3U / Xtream / MAC Portal، SmartLoad (كاش + إعادة محاولة + مصدر بديل)،
          دخول سحابي عبر Firebase RTDB، جلسة أحادية، OTA، FCM، ثيم Crystal Black × Gold / Nova Maroon.
          لإضافة Firebase: ارفع google-services.json في جذر المستودع.
        files: |
          app/build/outputs/apk/debug/app-debug.apk
          app/build/outputs/apk/release/app-release.apk
        overwrite: true
        generate_release_notes: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
