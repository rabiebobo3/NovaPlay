        /* =====================================================================
         *  المصادر: M3U  •  Xtream Codes  •  بوابة MAC (Stalker/MAG)
         *  كل الدوال تعمل على خيط في الخلفية (Bg) — لا شيء هنا يلمس الواجهة.
         * ===================================================================== */

        private fun str(o: JSONObject, vararg keys: String): String {
            for (k in keys) {
                val v = o.optString(k)
                if (v.isNotBlank() && v != "null" && v != "0") return v
            }
            return ""
        }

        private fun enc(s: String) = Uri.encode(s)

        /* ================================== M3U ================================== */

        object M3u {
            private val RE_GROUP = Regex("group-title=\"([^\"]*)\"", RegexOption.IGNORE_CASE)
            private val RE_LOGO = Regex("tvg-logo=\"([^\"]*)\"", RegexOption.IGNORE_CASE)
            private val RE_ID = Regex("tvg-id=\"([^\"]*)\"", RegexOption.IGNORE_CASE)
            private val RE_NAME = Regex("tvg-name=\"([^\"]*)\"", RegexOption.IGNORE_CASE)

            private fun attr(re: Regex, line: String): String {
                val m = re.find(line) ?: return ""
                for (i in 1 until m.groupValues.size) {
                    val g = m.groupValues[i]
                    if (g.isNotEmpty()) return g.trim()
                }
                return ""
            }

            fun classify(group: String, name: String): String {
                val g = group.lowercase()
                val n = name.lowercase()
                return when {
                    g.contains("movie") || g.contains("film") || g.contains("vod") ||
                        g.contains("أفلام") || g.contains("افلام") || g.contains("سينما") -> "movie"
                    g.contains("series") || g.contains("مسلسل") || g.contains("drama") || g.contains("كرتون") -> "series"
                    n.contains("s0") && n.contains("e0") -> "series"
                    else -> "live"
                }
            }

            /** تحليل متدفّق سطرًا بسطر (بلا نسخ للنص كاملًا في الذاكرة). */
            fun parse(text: String, live: MutableList<Channel>, movie: MutableList<Channel>, series: MutableList<Channel>, limit: Int = 40000): Int {
                live.clear(); movie.clear(); series.clear()
                var pending: Channel? = null
                var n = 0
                text.lineSequence().forEach { raw ->
                    if (n >= limit) return@forEach
                    val l = raw.trim()
                    if (l.isEmpty()) return@forEach
                    if (l.startsWith("#EXTINF", true)) {
                        val c = Channel()
                        c.name = l.substringAfterLast(',').trim().ifBlank { attr(RE_NAME, l) }
                        c.group = attr(RE_GROUP, l).ifBlank { "عام" }
                        c.logo = attr(RE_LOGO, l)
                        c.epgId = attr(RE_ID, l)
                        c.kind = classify(c.group, c.name)
                        pending = c
                    } else if (l.startsWith("#EXTGRP", true)) {
                        val g = l.substringAfter(':').trim()
                        if (g.isNotEmpty()) pending?.group = g
                    } else if (l.startsWith("#")) {
                        return@forEach
                    } else if (pending != null) {
                        val c = pending!!
                        if (l.startsWith("http") || l.startsWith("rtsp") || l.startsWith("rtmp") || l.startsWith("udp")) {
                            c.url = l
                            c.num = ++n
                            when (c.kind) { "movie" -> movie.add(c); "series" -> series.add(c); else -> live.add(c) }
                        }
                        pending = null
                    }
                }
                return n
            }
        }

        /* ================================ Xtream ================================ */

        class XtreamApi(private val p: Profile) {
            private val base = p.url.trimEnd('/')
            private val u = enc(p.user)
            private val pw = enc(p.pass)

            private fun api(vararg q: String): String {
                val sb = StringBuilder(base).append("/player_api.php?username=").append(u).append("&password=").append(pw)
                for (s in q) if (s.isNotBlank()) sb.append('&').append(s)
                return sb.toString()
            }

            fun auth() = api()
            fun cats(kind: String) = api(
                "action=" + when (kind) { "movie" -> "get_vod_categories"; "series" -> "get_series_categories"; else -> "get_live_categories" }
            )

            fun streams(kind: String, catId: String) = api(
                "action=" + when (kind) { "movie" -> "get_vod_streams"; "series" -> "get_series"; else -> "get_live_streams" },
                if (catId.isBlank()) "" else "category_id=$catId"
            )

            fun seriesInfo(id: String) = api("action=get_series_info", "series_id=$id")
            fun shortEpg(id: String) = api("action=get_short_epg", "stream_id=$id", "limit=2")

            fun liveUrl(id: String) = "$base/live/$u/$pw/$id.m3u8"
            fun liveTs(id: String) = "$base/live/$u/$pw/$id.ts"
            fun movieUrl(id: String, ext: String) = "$base/movie/$u/$pw/$id.${ext.ifBlank { "mp4" }}"
            fun episodeUrl(id: String, ext: String) = "$base/series/$u/$pw/$id.${ext.ifBlank { "mp4" }}"

            fun parseCats(json: String?): List<Group> {
                val out = ArrayList<Group>()
                if (json.isNullOrBlank()) return out
                return try {
                    val a = JSONArray(json)
                    for (i in 0 until a.length()) {
                        val o = a.getJSONObject(i)
                        out.add(Group().apply {
                            id = o.optString("category_id")
                            name = o.optString("category_name").ifBlank { "بدون اسم" }
                            count = 0
                        })
                    }
                    out
                } catch (t: Throwable) { Diag.e(t); out }
            }

            fun parseStreams(json: String?, kind: String, catName: String, catId: String): ArrayList<Channel> {
                val out = ArrayList<Channel>()
                if (json.isNullOrBlank()) return out
                try {
                    val a = JSONArray(json)
                    for (i in 0 until a.length()) {
                        val o = a.getJSONObject(i)
                        val c = Channel()
                        c.kind = kind
                        c.catId = catId
                        c.group = catName.ifBlank { "عام" }
                        c.num = i + 1
                        when (kind) {
                            "live" -> {
                                c.name = o.optString("name")
                                c.id = o.optString("stream_id")
                                c.url = liveUrl(c.id)
                                c.alt = liveTs(c.id)
                                c.logo = o.optString("stream_icon")
                                c.epgId = o.optString("epg_channel_id")
                            }
                            "movie" -> {
                                c.name = o.optString("name")
                                c.id = o.optString("stream_id")
                                val ext = o.optString("container_extension")
                                c.url = movieUrl(c.id, ext)
                                c.alt = movieUrl(c.id, if (ext == "mp4") "mkv" else "mp4")
                                c.logo = o.optString("stream_icon")
                                c.extra = listOf(o.optString("genre"), o.optString("rating"), o.optString("year"))
                                    .filter { it.isNotBlank() }.joinToString(" • ")
                            }
                            else -> {
                                c.name = o.optString("name")
                                c.id = o.optString("series_id")
                                c.mid = c.id
                                c.logo = o.optString("cover")
                                c.extra = o.optString("genre")
                            }
                        }
                        if (c.name.isNotBlank()) out.add(c)
                    }
                } catch (t: Throwable) { Diag.e(t) }
                return out
            }

            fun parseEpisodes(json: String?): ArrayList<Channel> {
                val out = ArrayList<Channel>()
                if (json.isNullOrBlank()) return out
                try {
                    val info = JSONObject(json).optJSONObject("episodes") ?: return out
                    val seasons = info.keys().asSequence().toList()
                    var n = 0
                    for (s in seasons) {
                        val arr = info.optJSONArray(s) ?: continue
                        for (i in 0 until arr.length()) {
                            val o = arr.getJSONObject(i)
                            val c = Channel()
                            c.kind = "episode"
                            c.num = ++n
                            c.group = "موسم $s"
                            c.sid = s
                            c.snum = s.toIntOrNull() ?: 0
                            val ep = o.optString("episode_num")
                            val title = o.optString("title")
                            c.name = if (ep.isBlank()) title else "حلقة $ep" + (if (title.isNotBlank()) " — $title" else "")
                            c.id = o.optString("id")
                            val ext = o.optString("container_extension")
                            c.url = episodeUrl(c.id, ext)
                            c.alt = episodeUrl(c.id, if (ext == "mp4") "mkv" else "mp4")
                            c.extra = o.optString("info_movie").take(160)
                            out.add(c)
                        }
                    }
                } catch (t: Throwable) { Diag.e(t) }
                return out
            }
        }

        /* ============================ بوابة MAC / Stalker ============================ */

        class Stalker(private val p: Profile) {

            var base: String = origin(p.url)
            val mac: String = normMac(if (p.mac.isNotBlank()) p.mac else macFrom(p.url))
            var token = ""
                private set
            @Volatile var lastError = ""
            private var path = "/server/load.php"
            private var probed = false
            private val epCache = HashMap<String, List<Channel>>()
            private val coverCache = HashMap<String, String>()

            companion object {
                private val PATHS = arrayOf(
                    "/server/load.php", "/stalker_portal/server/load.php",
                    "/portal.php", "/c/server/load.php"
                )
                const val UA = Http.UA_STB

                fun normMac(raw: String): String {
                    val h = raw.uppercase().replace("[^0-9A-F]".toRegex(), "")
                    if (h.length != 12) return raw.trim()
                    return h.chunked(2).joinToString(":")
                }

                fun macFrom(url: String): String {
                    Regex("([0-9A-Fa-f]{2}[:-]){5}[0-9A-Fa-f]{2}").find(url)?.let { return it.value }
                    Regex("[?&]mac=([^&]+)").find(url)?.let { return it.groupValues[1].replace("%3A", ":") }
                    return ""
                }

                fun origin(url: String): String {
                    val m = Regex("^(https?://[^/?#]+)([^?#]*)").find(url.trim()) ?: return url.trim()
                    var path = m.groupValues[2]
                    while (path.endsWith("/")) path = path.dropLast(1)
                    if (path.endsWith("/c")) path = path.dropLast(2)
                    return m.groupValues[1] + path
                }

                fun cleanCmd(cmd: String, base: String): String {
                    var c = cmd.trim()
                    if (c.startsWith("\"") && c.endsWith("\"") && c.length > 1) c = c.substring(1, c.length - 1)
                    c = c.replace("\\/", "/").replace("\\u0026", "&").trim()
                    while (c.startsWith("ffmpeg")) c = c.substring(6).trim()
                    if (c.startsWith("http") || c.startsWith("rtsp") || c.startsWith("rtmp") || c.startsWith("udp")) return c
                    if (c.startsWith("/")) return base + c
                    return c
                }

                fun fixHost(u: String, base: String): String {
                    val l = u.lowercase()
                    if (!l.contains("localhost") && !l.contains("127.0.0.1")) return u
                    return try {
                        val bu = java.net.URI(base)
                        val host = bu.host ?: return u
                        val port = if (bu.port > 0) ":" + bu.port else ""
                        val scheme = if (l.startsWith("https")) "https" else "http"
                        val rest = u.substringAfter("://").substringAfter("/", "")
                        "$scheme://$host$port/$rest"
                    } catch (t: Throwable) { u }
                }

                private fun numOf(s: String): String {
                    val t = s.substringBefore(':').trim()
                    return if (t.isNotEmpty() && t.length <= 9 && t.all { it.isDigit() }) t else ""
                }

                fun movieCmd(id: String, ext: String): String = try {
                    val j = JSONObject()
                    j.put("type", "movie")
                    j.put("stream_id", id)
                    j.put("stream_source", JSONObject.NULL)
                    j.put("target_container", "[\"${ext.ifBlank { "mp4" }}\"]")
                    Base64.encodeToString(j.toString().toByteArray(Charsets.UTF_8), Base64.NO_WRAP)
                } catch (t: Throwable) { Diag.e(t); "" }

                fun seriesCmd(seriesId: String, seasonNum: String, epId: String = ""): String = try {
                    val j = JSONObject()
                    val s: Any = seriesId.toIntOrNull() ?: seriesId
                    val n: Any = seasonNum.toIntOrNull() ?: (if (seasonNum.isBlank()) 1 else seasonNum)
                    j.put("series_id", s)
                    j.put("season_num", n)
                    j.put("type", "series")
                    if (epId.isNotBlank()) {
                        val e = numOf(epId)
                        if (e.isNotBlank()) j.put("episode", e.toIntOrNull() ?: e)
                    }
                    Base64.encodeToString(j.toString().toByteArray(Charsets.UTF_8), Base64.NO_WRAP)
                } catch (t: Throwable) { Diag.e(t); "" }
            }

            /* --------------------------- الاستعلامات --------------------------- */

            private fun headers(auth: Boolean): Map<String, String> {
                val m = LinkedHashMap<String, String>()
                m["Cookie"] = "mac=$mac; stb_lang=ar; timezone=Europe/London"
                m["User-Agent"] = UA
                m["X-User-Agent"] = "Model: MAG250; Link: WiFi"
                m["Referer"] = "$base/c/"
                m["Accept"] = "*/*"
                if (auth && token.isNotBlank()) m["Authorization"] = "Bearer $token"
                return m
            }

            private fun req(q: String, auth: Boolean = true, timeoutMs: Int = 12000, retries: Int = 0): String? {
                val query = if (q.contains("JsHttpRequest")) q else "$q&JsHttpRequest=1-xml"
                val paths = if (probed) listOf(path) else PATHS.toList()
                var err = ""
                for (pt in paths) {
                    try {
                        val r = Http.get(base + pt + "?" + query, headers(auth), timeoutMs, retries)
                        val t = r.trimStart()
                        if (t.startsWith("{") || t.startsWith("[")) {
                            path = pt; probed = true
                            return r
                        }
                        err = "رد غير JSON"
                    } catch (t: Throwable) {
                        err = t.message ?: t.javaClass.simpleName
                    }
                }
                lastError = err.ifBlank { "لا رد من البوابة" }
                return null
            }

            private fun jsOf(json: String): Any? = try {
                val o = JSONObject(json)
                when {
                    o.has("js") -> o.get("js")
                    o.has("result") -> o.get("result")
                    else -> o
                }
            } catch (t: Throwable) { null }

            private fun itemsOf(json: String): JSONArray {
                val js = jsOf(json)
                if (js is JSONArray) return js
                val o = js as? JSONObject ?: return JSONArray()
                for (k in arrayOf("data", "list", "categories", "channels", "items", "series", "episodes")) {
                    val a = o.optJSONArray(k)
                    if (a != null) return a
                }
                return JSONArray()
            }

            fun invalidate() { token = ""; probed = false }

            /** مصافحة + توكن. رخيصة بعد أول مرة (تُستدعى قبل كل طلب). */
            fun connect(): Boolean {
                if (token.isNotBlank()) return true
                val qs = listOf(
                    "type=stb&action=handshake&pre_auth=1&mac=" + enc(mac),
                    "type=stb&action=handshake&token=&mac=" + enc(mac),
                    "type=stb&action=handshake&mac=" + enc(mac)
                )
                for (q in qs) {
                    val r = req(q, false, 10000) ?: continue
                    val tk = try {
                        val j = JSONObject(r).opt("js")
                        when (j) {
                            is String -> j
                            is JSONObject -> j.optString("token").ifBlank { j.optString("random") }
                            else -> ""
                        }
                    } catch (t: Throwable) { "" }
                    if (tk.isNotBlank() && tk.length > 8) {
                        token = tk
                        try { req("type=stb&action=get_profile", true, 8000) } catch (_: Throwable) {}
                        Diag.d("PORTAL", "handshake ok • $base")
                        return true
                    }
                }
                invalidate()
                if (lastError.isBlank()) lastError = "فشلت المصافحة — تحقق من MAC والرابط"
                Diag.d("PORTAL", "handshake FAIL • " + lastError)
                return false
            }

            /* --------------------------- الأقسام --------------------------- */

            fun cats(kind: String): List<Group> {
                val type = if (kind == "movie") "vod" else if (kind == "series") "series" else "itv"
                val out = ArrayList<Group>()
                for (act in arrayOf("get_categories", "get_filter")) {
                    val r = req("type=$type&action=$act", true, 12000) ?: continue
                    val arr = itemsOf(r)
                    for (i in 0 until arr.length()) {
                        val o = arr.optJSONObject(i) ?: continue
                        val id = str(o, "id", "category_id", "value_id")
                        val title = str(o, "title", "category_name", "name", "alias")
                        if (id.isBlank() || title.isBlank()) continue
                        if (out.none { it.id == id }) out.add(Group().apply { this.id = id; name = title })
                    }
                    if (out.isNotEmpty()) break
                }
                return out
            }

            /* --------------------------- القنوات --------------------------- */

            fun channels(max: Int): ArrayList<Channel> {
                val out = ArrayList<Channel>()
                val genres = HashMap<String, String>()
                req("type=itv&action=get_genres", true, 10000)?.let { r ->
                    val arr = itemsOf(r)
                    for (i in 0 until arr.length()) {
                        val o = arr.optJSONObject(i) ?: continue
                        val id = str(o, "id")
                        val t = str(o, "title", "category_name", "name")
                        if (id.isNotBlank() && t.isNotBlank()) genres[id] = t
                    }
                }
                for (page in 0..6) {
                    if (out.size >= max) break
                    val r = req("type=itv&action=get_all_channels&number=$page", true, 20000) ?: break
                    val arr = itemsOf(r)
                    if (arr.length() == 0) break
                    val before = out.size
                    for (i in 0 until arr.length()) {
                        val o = arr.optJSONObject(i) ?: continue
                        val c = Channel()
                        c.kind = "live"
                        c.num = out.size + 1
                        c.name = str(o, "name", "title")
                        c.id = str(o, "id")
                        val cmd = cleanCmd(str(o, "cmd", "media_url", "url"), base)
                        if (cmd.startsWith("http")) c.url = cmd else c.cmd = cmd
                        c.logo = str(o, "logo", "logo_url", "picon")
                        val gid = str(o, "tv_genre_id", "category_id")
                        c.catId = gid
                        c.group = genres[gid] ?: str(o, "tv_genre", "category_name").ifBlank { "عام" }
                        c.extra = str(o, "num")
                        if (c.name.isNotBlank()) out.add(c)
                    }
                    if (out.size == before) break
                }
                return out
            }

            /* ---------------- قائمة مرتّبة (أفلام/مسلسلات/بحث) ---------------- */

            fun ordered(kind: String, catId: String, page: Int, search: String = ""): ArrayList<Channel> {
                val type = if (kind == "movie") "vod" else "series"
                val out = ArrayList<Channel>()
                var q = "type=$type&action=get_ordered_list&p=$page"
                if (catId.isNotBlank() && catId != "0" && catId != "*") q += "&genre=" + enc(catId)
                if (search.isNotBlank()) q += "&search=" + enc(search)
                var json = req(q, true, 15000)
                if (json == null || itemsOf(json).length() == 0) {
                    val alt = q.replace("&genre=", "&category=")
                    if (alt != q) json = req(alt, true, 15000)
                }
                if (json == null) return out
                val arr = itemsOf(json)
                for (i in 0 until arr.length()) {
                    val o = arr.optJSONObject(i) ?: continue
                    val c = Channel()
                    c.kind = kind
                    c.num = out.size + 1
                    c.name = str(o, "name", "title")
                    c.id = str(o, "id", "series_id", "movie_id")
                    c.mid = c.id
                    c.catId = catId
                    val cmd = cleanCmd(str(o, "cmd", "media_url", "url"), base)
                    if (cmd.startsWith("http")) c.url = cmd else c.cmd = cmd
                    c.logo = str(o, "screenshot_uri", "cover", "screenshot", "movie_image", "backdrop_path")
                    val parts = ArrayList<String>()
                    val yr = str(o, "year"); if (yr.isNotBlank()) parts.add(yr)
                    val rt = str(o, "rating", "rating_kinopoisk", "rating_imdb"); if (rt.isNotBlank()) parts.add("★ $rt")
                    val ds = str(o, "description", "overview"); if (ds.isNotBlank()) parts.add(ds.take(120))
                    c.extra = parts.joinToString(" • ")
                    if (c.name.isNotBlank()) out.add(c)
                }
                return out
            }

            /* --------------------------- المواسم والحلقات --------------------------- */

            fun seasons(seriesId: String, seriesName: String, cover: String): ArrayList<Channel> {
                val sid = seriesId.replace("series_", "").trim()
                if (sid.isBlank()) return ArrayList()
                if (cover.isNotBlank()) coverCache[sid] = cover
                val out = ArrayList<Channel>()
                val urls = listOf(
                    "type=series&action=get_ordered_list&movie_id=${enc(sid)}&p=1",
                    "type=series&action=get_ordered_list&movie_id=${enc(sid)}&p=1&force_ch_link_check=1",
                    "type=vod&action=get_ordered_list&movie_id=${enc(sid)}&p=1",
                    "type=series&action=get_series_info&movie_id=${enc(sid)}"
                )
                for (u in urls) {
                    val r = req(u, true, 15000) ?: continue
                    if (buildTree(r, sid, seriesName, cover, out) > 0) {
                        Diag.d("SEASON", "series=$sid → ${out.size} عنصر")
                        return out
                    }
                }
                Diag.d("SEASON", "series=$sid ⇒ لا مواسم ($lastError)")
                return out
            }

            fun episodes(seriesId: String, seasonId: String): ArrayList<Channel> {
                val sid = seriesId.replace("series_", "").trim()
                val key = sid + "|" + seasonId
                epCache[key]?.let { if (it.isNotEmpty()) return ArrayList(it) }
                epCache[sid + "|*"]?.let { if (it.isNotEmpty()) return ArrayList(it) }
                val urls = listOf(
                    "type=series&action=get_ordered_list&movie_id=${enc(sid)}&p=1",
                    "type=series&action=get_ordered_list&movie_id=${enc("$sid:$seasonId")}&p=1",
                    "type=series&action=get_series_info&movie_id=${enc(sid)}"
                )
                for (u in urls) {
                    val r = req(u, true, 15000) ?: continue
                    val tmp = ArrayList<Channel>()
                    buildTree(r, sid, "", coverCache[sid] ?: "", tmp)
                    val got = epCache[key] ?: epCache[sid + "|*"]
                    if (!got.isNullOrEmpty()) {
                        Diag.d("EPS", "series=$sid season=$seasonId → ${got.size} حلقة")
                        return ArrayList(got)
                    }
                }
                Diag.d("EPS", "series=$sid season=$seasonId ⇒ 0 ($lastError)")
                return ArrayList()
            }

            private fun buildTree(json: String, seriesId: String, seriesName: String, cover: String, out: MutableList<Channel>): Int {
                val js = jsOf(json)
                val data = when (js) {
                    is JSONArray -> js
                    is JSONObject -> js.opt("data") ?: js
                    else -> return 0
                }

                fun addSeason(sKey: String, sName: String, eps: JSONArray?) {
                    if (eps != null && eps.length() > 0) {
                        val list = parseEps(eps, seriesId, sKey, sName, cover)
                        epCache[seriesId + "|" + sKey] = list
                        if (sKey == "1") epCache[seriesId + "|*"] = list
                    }
                    val cnt = epCache[seriesId + "|" + sKey]?.size ?: 0
                    out.add(Channel().apply {
                        kind = "season"
                        name = if (cnt > 0) "$sName • $cnt حلقة" else sName
                        mid = seriesId
                        sid = sKey
                        snum = sKey.toIntOrNull() ?: 0
                        num = snum
                        group = seriesName.ifBlank { "مسلسلات" }
                        logo = cover
                        id = "season_${seriesId}_$sKey"
                    })
                }

                if (data is JSONArray) {
                    var seasons = 0
                    for (i in 0 until data.length()) {
                        val o = data.optJSONObject(i) ?: continue
                        val eps = o.optJSONArray("series") ?: o.optJSONArray("episodes")
                        if (eps == null || eps.length() == 0) continue
                        val sKey = str(o, "id", "season_id", "season_number").ifBlank { (i + 1).toString() }
                        val sName = str(o, "name", "title").ifBlank { "موسم $sKey" }
                        addSeason(sKey, sName, eps)
                        seasons++
                    }
                    if (seasons > 0) return seasons
                    // لا مواسم: حلقات مباشرة
                    val list = parseEps(data, seriesId, "1", seriesName.ifBlank { "حلقات" }, cover)
                    if (list.isNotEmpty()) {
                        epCache[seriesId + "|1"] = list
                        epCache[seriesId + "|*"] = list
                        out.addAll(list)
                        return list.size
                    }
                }
                if (data is JSONObject) {
                    val keys = ArrayList<String>()
                    val it = data.keys()
                    while (it.hasNext()) keys.add(it.next())
                    keys.sortBy { it.toIntOrNull() ?: 9999 }
                    var seasons = 0
                    for (k in keys) {
                        val sd = data.optJSONObject(k) ?: continue
                        val eps = sd.optJSONArray("series") ?: sd.optJSONArray("episodes") ?: continue
                        val sName = str(sd, "name", "title").ifBlank { "موسم $k" }
                        addSeason(k, sName, eps)
                        seasons++
                    }
                    if (seasons > 0) return seasons
                }
                return 0
            }

            private fun parseEps(arr: JSONArray, seriesId: String, seasonKey: String, seasonName: String, cover: String): ArrayList<Channel> {
                val out = ArrayList<Channel>()
                for (i in 0 until arr.length()) {
                    val e = arr.optJSONObject(i) ?: continue
                    val c = Channel()
                    c.kind = "episode"
                    c.mid = seriesId
                    c.sid = seasonKey
                    c.snum = seasonKey.toIntOrNull() ?: 0
                    c.group = seasonName
                    c.logo = str(e, "screenshot_uri", "screenshot").ifBlank { cover }
                    c.id = str(e, "id", "episode_id", "series_id")
                    val rawName = str(e, "name", "title", "episode_name")
                    var n = str(e, "episode_number", "series_number", "num", "episode").filter { it.isDigit() }.take(4).toIntOrNull()
                    if (n == null) n = Regex("(\\d{1,4})").find(rawName)?.groupValues?.get(1)?.toIntOrNull()
                    c.num = n ?: (i + 1)
                    c.name = rawName.ifBlank { "الحلقة ${c.num}" }
                    val cmd = cleanCmd(str(e, "cmd", "media_url", "url", "link"), base)
                    if (cmd.startsWith("http")) c.url = cmd else c.cmd = cmd
                    if (c.id.isBlank()) c.id = Regex("(\\d{1,7})").find(cmd)?.groupValues?.get(1) ?: c.num.toString()
                    out.add(c)
                }
                return out
            }

            /* ------------------------------ روابط التشغيل ------------------------------ */

            private fun urlOf(json: String): String {
                val js = jsOf(json)
                val raw = when (js) {
                    is String -> js
                    is JSONObject -> str(js, "cmd", "url", "link", "media_url")
                    else -> ""
                }
                var c = raw.trim()
                if (c.startsWith("\"") && c.endsWith("\"")) c = c.substring(1, c.length - 1)
                c = c.replace("\\/", "/").replace("\\u0026", "&").trim()
                while (c.startsWith("ffmpeg")) c = c.substring(6).trim()
                if (c.startsWith("http") || c.startsWith("rtsp") || c.startsWith("rtmp") || c.startsWith("udp")) return fixHost(c, base)
                return ""
            }

            /** محاولة واحدة لإنشاء رابط. يعيد "" عند الفشل (مع إعادة مصافحة عند الشك بالتوكن). */
            fun createLink(type: String, cmd: String, extra: String = ""): String {
                if (cmd.isBlank()) return ""
                val q = "type=$type&action=create_link&cmd=" + enc(cmd) + "&js_price=0&forced_country=" + extra
                var r = req(q, true, 15000)
                if (r == null) {
                    // توكن منتهٍ؟ نعيد المصافحة مرة واحدة ثم نحاول مجددًا
                    invalidate()
                    if (!connect()) return ""
                    r = req(q, true, 15000) ?: return ""
                }
                val u = urlOf(r)
                if (u.isBlank() || Channel.broken(u)) {
                    Diag.d("LINK", "رد فارغ/ميت type=$type cmd=" + tail(cmd, 60))
                    return ""
                }
                return u
            }

            private fun liveId(c: Channel): String {
                Regex("[?&]stream=(\\d+)").find(c.cmd.ifBlank { c.url })?.let { return it.groupValues[1] }
                Regex("/ch/(\\d+)").find(c.cmd.ifBlank { c.url })?.let { return it.groupValues[1] }
                val t = c.id.substringBefore(':').trim()
                return if (t.isNotEmpty() && t.all { it.isDigit() }) t else ""
            }

            /** قائمة مرشّحين مرتّبة حسب الأكثر نجاحًا على هذا النوع من البوابات. */
            fun candidates(c: Channel): List<Pair<String, String>> {
                val out = ArrayList<Pair<String, String>>()
                val raw = c.cmd.ifBlank { c.url }
                val clean = cleanCmd(raw, base)
                when (c.kind) {
                    "episode" -> {
                        if (clean.isNotBlank() && !clean.startsWith("http")) { out += "vod" to clean; out += "series" to clean }
                        val sid = c.mid.ifBlank { c.id }
                        if (sid.isNotBlank()) {
                            val num = if (c.snum > 0) c.snum.toString() else c.sid.substringAfterLast(':').ifBlank { "1" }
                            val b64 = seriesCmd(sid, num, c.id)
                            if (b64.isNotBlank()) { out += "vod" to b64; out += "series" to b64 }
                        }
                        if (clean.startsWith("http") && Channel.direct(clean)) out += "vod" to clean
                    }
                    "live" -> {
                        val id = liveId(c)
                        if (id.isNotBlank()) {
                            val mag = "http://localhost/ch/" + id + "_"
                            out += "itv" to mag
                            out += "vod" to mag
                        }
                        if (clean.isNotBlank()) out += "itv" to clean
                    }
                    else -> {
                        if (clean.isNotBlank() && !clean.startsWith("http")) out += "vod" to clean
                        val vid = numOfId(c)
                        if (vid.isNotBlank()) {
                            out += "vod" to movieCmd(vid, "mp4")
                            out += "vod" to movieCmd(vid, "mkv")
                        }
                        if (clean.startsWith("http") && Channel.direct(clean)) out += "vod" to clean
                    }
                }
                return out
            }

            private fun numOfId(c: Channel): String {
                for (v in listOf(c.mid, c.id)) {
                    val t = v.substringBefore(':').trim()
                    if (t.isNotEmpty() && t.length <= 9 && t.all { it.isDigit() }) return t
                }
                return ""
            }

            /**
             * الرابط الجاهز للتشغيل:
             *   1) رابط محفوظ مباشر ← فوري
             *   2) رابط بوابة فيه توكن ← نجرّبه كما هو
             *   3) create_link على المرشّحين بالترتيب
             */
            fun linkFor(c: Channel): String {
                if (!connect()) return ""
                val u = c.url
                if (u.startsWith("http") && Channel.direct(u) && !Channel.broken(u)) {
                    if (!Channel.isPortalPlay(u) || Channel.hasToken(u)) return u
                }
                for ((type, cmd) in candidates(c)) {
                    val got = createLink(type, cmd)
                    if (got.isNotBlank()) {
                        Diag.d("LINK", "ok type=$type kind=${c.kind} → " + tail(got, 120))
                        return got
                    }
                }
                lastError = "create_link لم يُرجع رابطًا صالحًا (kind=${c.kind} id=${c.id} mid=${c.mid})"
                return ""
            }

            fun timeshift(c: Channel, hours: Int): String {
                if (!connect()) return ""
                val cmd = cleanCmd(c.cmd.ifBlank { c.url }, base)
                val r = req(
                    "type=itv&action=create_link&cmd=" + enc(cmd) +
                        "&js_price=0&forced_country=&timeshift=" + (hours * 3600), true, 15000
                ) ?: return ""
                val u = urlOf(r)
                return if (Channel.broken(u)) "" else u
            }
        }
