              private fun updateInfo(c: Channel) {
                  infoName.text = c.name
                  val sub = StringBuilder()
                  if (c.group.isNotBlank()) sub.append(c.group)
                  if (c.num > 0) { if (sub.isNotEmpty()) sub.append(" • "); sub.append("#").append(c.num) }
                  infoSub.text = sub.toString()
                  val extra = if (c.extra.isNotBlank()) c.extra else if (c.art.isNotBlank()) c.art else ""
                  infoDesc.text = extra
                  fullTitle.text = c.name
                  mvName.text = c.name
                  mvQual.text = c.group
                  chName.text = c.name
                  setVis(R.id.liveInfoC, live)
                  setVis(R.id.mvInfoC, !live)
                  setVis(R.id.liveBadge, live)
                  setVis(R.id.livePulse, live)
                  setVis(R.id.fullSeekRow, !live)
                  setVis(R.id.dockSeek, !full && !live)
                  setVis(R.id.btn_dock_catch, live && Catalog.profile?.type == "mac")
                  setVis(R.id.btn_big_prev, live)
                  setVis(R.id.btn_big_next, live)
                  setVis(R.id.btn_center_play, !live)
                  setVis(R.id.castBtn, Build.VERSION.SDK_INT >= 23)
                  setVis(R.id.btn_full_pip, !live)
                  val logo = if (c.logo.isNotBlank()) c.logo else c.art
                  if (logo.isNotBlank()) {
                      setVis(R.id.ch_logo, true)
                      Glide.with(this).load(logo).override(96, 96).into(findViewById(R.id.ch_logo))
                  } else setVis(R.id.ch_logo, false)
                  val art = findViewById<ImageView>(R.id.mv_art)
                  if (c.art.isNotBlank() || c.logo.isNotBlank()) {
                      Glide.with(this).load(if (c.art.isNotBlank()) c.art else c.logo).override(140, 140).into(art)
                      art.visibility = android.view.View.VISIBLE
                  } else art.visibility = android.view.View.GONE
                  val q = quality(c.name + " " + c.group)
                  if (q.isNotBlank()) { liType.text = q; liRes.text = q }
                  else { liType.text = ""; liRes.text = "" }
                  liSpeed.text = ""
                  try { findViewById<TextView>(R.id.li_speed).text = "" } catch (t: Throwable) {}
              }

              private fun quality(s: String): String {
                  val l = s.lowercase(Locale.US)
                  return when {
                      l.contains("4k") || l.contains("2160") -> "4K"
                      l.contains("1080") -> "1080p"
                      l.contains("720") -> "720p"
                      l.contains("480") -> "480p"
                      l.contains("hd") -> "HD"
                      else -> ""
                  }
              }

              private fun showEpg() {
                  val c = cur ?: return
                  val p = Catalog.profile ?: return
                  if (p.type != "xtream") { toast("دليل البرامج متاح لبوابة Xtream فقط"); return }
                  val id = if (c.id.isNotBlank()) c.id else c.mid
                  if (id.isBlank()) { toast("لا يوجد معرّف للقناة"); return }
                  showBusy(true, "…جاري جلب دليل البرامج")
                  Bg.pool.execute {
                      var body = ""
                      try {
                          val x = Xtream(p.url, p.user, p.pass)
                          body = Http.read(x.urlEpgShort(id), emptyMap(), 12000, 0)
                      } catch (t: Throwable) { Crash.log(t) }
                      val b = body
                      Bg.ui {
                          showBusy(false, "")
                          if (b.isBlank()) { toast("لا يوجد دليل برامج"); return@ui }
                          val titles = ArrayList<String>()
                          try {
                              val o = org.json.JSONObject(b)
                              val arr = o.optJSONObject("epg_listings")?.optJSONArray("0") ?: o.optJSONArray("epg_listings")
                              if (arr != null) for (i in 0 until Math.min(arr.length(), 12)) {
                                  val e = arr.optJSONObject(i) ?: continue
                                  val t0 = dec(e.optString("title", ""))
                                  val st = e.optString("start", "")
                                  if (t0.isNotBlank()) titles.add((if (st.isNotBlank()) st + "  " else "") + t0)
                              }
                          } catch (t: Throwable) { Crash.log(t) }
                          if (titles.isEmpty()) titles.add("لم تُرجع البوابة برامج (JSON: " + b.take(160) + ")")
                          AlertDialog.Builder(this).setTitle("دليل البرامج — " + c.name)
                              .setMessage(titles.joinToString("\n"))
                              .setPositiveButton("إغلاق", null).show()
                      }
                  }
              }

              private fun dec(s: String): String = try {
                  if (s.isBlank()) "" else String(android.util.Base64.decode(s, android.util.Base64.DEFAULT))
              } catch (t: Throwable) { s }

