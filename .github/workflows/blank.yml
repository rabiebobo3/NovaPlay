                  try {
                      val cc = ctx() ?: return
                      cc.sp.put("ai_m_plays", cc.sp.i("ai_m_plays", 0) + 1)
                  } catch (t: Throwable) {}
              }

              /** عند نجاح التشغيل: نسجّل الزمن + نعلّم المصدر الناجح + نظبط الاستقرار. */
              fun playReady(c: Channel?, q: String?) {
