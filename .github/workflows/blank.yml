       package com.nova.play

       import android.content.Context
       import android.net.Uri
       import org.json.JSONArray
       import org.json.JSONObject
       import java.io.BufferedOutputStream
       import java.io.File
       import java.io.FileOutputStream
       import java.util.concurrent.Executors
       import java.util.zip.GZIPOutputStream

       /* ========================================================================
       *  مصادر القوائم: M3U / Xtream-Codes / MAC (Stalker) + ذاكرة تحميل ذكية
       * ======================================================================== */

       object M3u {
         private val RE_GROUP = Regex("group-title=\"([^\"]*)\"", RegexOption.IGNORE_CASE)
         private val RE_LOGO = Regex("tvg-logo=\"([^\"]*)\"", RegexOption.IGNORE_CASE)
         private val RE_ID = Regex("tvg-id=\"([^\"]*)\"", RegexOption.IGNORE_CASE)
         private val RE_NAME = Regex("tvg-name=\"([^\"]*)\"", RegexOption.IGNORE_CASE)
         private val RE_DUR = Regex("tvg-duration=\"([^\"]*)\"|duration=(-?\\d+)", RegexOption.IGNORE_CASE)
         private val RE_CATCH = Regex("catchup=\"([^\"]*)\"|catchup-max-hours=\"(\\d+)\"", RegexOption.IGNORE_CASE)

         private fun attr(re: Regex, line: String): String {
           val m = re.find(line) ?: return ""
           for (i in 1..m.groupValues.size - 1) {
             val g = m.groupValues[i]
             if (g.isNotEmpty()) return g.trim()
           }
           return ""
         }

         fun classify(group: String, name: String): String {
           val g = group.lowercase()
           val n = name.lowercase()
           return when {
             g.contains("movie") || g.contains("film") || g.contains("vоd") || g.contains("vod") ||
               g.contains("افلام") || g.contains("أفلام") || g.contains("سينما") -> "movie"
             g.contains("series") || g.contains("مسلسل") || g.contains("drama") || g.contains("كرتون") -> "series"
             g.contains("radio") || g.contains("إذاعة") || g.contains("اذاعة") -> "radio"
             n.contains(" 1080") || n.contains("fhd") -> "live"
             else -> "live"
           }
         }

         /** يفكّ نص m3u/m3u8 إلى ثلاث قوائم. يرجع عدد الأسطر المفحوصة. */
         fun parse(
           text: String,
           live: MutableList<Channel>,
           movie: MutableList<Channel>,
           series: MutableList<Channel>
         ): Int {
           live.clear(); movie.clear(); series.clear()
           var pending: Channel? = null
           var idx = 0
           for (raw in text.lineSequence()) {
             val l = raw.trim()
             if (l.isEmpty()) continue
             if (l.startsWith("#EXTINF", true)) {
               val c = Channel()
               c.name = l.substringAfterLast(',').trim()
               if (c.name.isEmpty()) c.name = attr(RE_NAME, l)
               val grp = attr(RE_GROUP, l)
               c.group = if (grp.isEmpty()) "عام" else grp
               c.logo = attr(RE_LOGO, l)
               c.epgId = attr(RE_ID, l)
               val dur = attr(RE_DUR, l)
               c.kind = classify(c.group, c.name)
               if (dur == "-1" || dur.isEmpty()) {
                 if (c.kind == "live") c.kind = "live"
               } else if (c.kind == "live") c.kind = "movie"
               pending = c
             } else if (l.startsWith("#EXTGRP", true)) {
               val g = l.substringAfter(':').trim()
               if (g.isNotEmpty()) pending?.group = g
             } else if (l.startsWith("#EXTVLCOPT", true) || l.startsWith("#EXTHTTP", true) ||
               l.startsWith("#KODIPROP", true) || l.startsWith("#EXTM3U", true) || l.startsWith("#", true)
             ) {
               // تعليقات/خصائص إضافية: نتجاهلها لكن نستخرج catchup إن وُجد
               val catch = attr(RE_CATCH, l)
               if (catch.isNotEmpty()) pending?.alt = catch
             } else if (pending != null) {
               pending.url = l
               pending.num = ++idx
               val catch = attr(RE_CATCH, pending.name)
               if (catch.isNotEmpty() && pending.alt.isEmpty()) pending.alt = catch
               when (pending.kind) {
                 "movie" -> movie.add(pending)
                 "series" -> series.add(pending)
                 else -> live.add(pending)
               }
               pending = null
             }
           }
           return idx
         }
       }

       /** عميل Xtream-Codes (player_api.php). */
       class Xtream(private val baseIn: String, private val user: String, private val pass: String) {
         val base: String = baseIn.trimEnd('/')

         private fun api(vararg q: String): String {
           val sb = StringBuilder(base).append("/player_api.php?username=")
             .append(Uri.encode(user)).append("&password=").append(Uri.encode(pass))
           for (s in q) if (s.isNotEmpty()) sb.append('&').append(s)
           return sb.toString()
         }

         fun urlAuth() = api()
         fun urlLiveCats() = api("action=get_live_categories")
         fun urlLiveStreams() = api("action=get_live_streams")
         fun urlVodCats() = api("action=get_vod_categories")
         fun urlVodStreams() = api("action=get_vod_streams")
         fun urlSerCats() = api("action=get_series_categories")
         fun urlSeries() = api("action=get_series")
         fun urlSeriesInfo(id: String) = api("action=get_series_info", "series_id=$id")
         fun urlVodInfo(id: String) = api("action=get_vod_streams", "stream_id=$id")
         fun urlEpgShort(id: String) = api("action=get_short_epg", "stream_id=$id", "limit=2")

         fun liveUrl(streamId: String): String =
           "$base/live/${Uri.encode(user)}/${Uri.encode(pass)}/$streamId.m3u8"

         fun liveTs(streamId: String): String =
           "$base/live/${Uri.encode(user)}/${Uri.encode(pass)}/$streamId.ts"

         fun movieUrl(streamId: String, ext: String): String =
           "$base/movie/${Uri.encode(user)}/${Uri.encode(pass)}/$streamId.${if (ext.isEmpty()) "mp4" else ext}"

         fun seriesUrl(epId: String, ext: String): String =
           "$base/series/${Uri.encode(user)}/${Uri.encode(pass)}/$epId.${if (ext.isEmpty()) "mp4" else ext}"

         companion object {
           fun cats(json: String?): List<Group> {
             val out = ArrayList<Group>()
             if (json.isNullOrBlank()) return out
             try {
               val a = JSONArray(json)
               for (i in 0 until a.length()) {
                 val o = a.getJSONObject(i)
                 out.add(Group().apply {
                   catId = o.optString("category_id")
                   name = o.optString("category_name").ifBlank { "بدون اسم" }
                   count = o.optInt("channels_num")
                 })
               }
             } catch (t: Throwable) {}
             return out
           }

           fun parseStreams(json: String?, cats: List<Group>, kind: String, x: Xtream, out: MutableList<Channel>): Int {
             if (json.isNullOrBlank()) return 0
             var n = 0
             try {
               val a = JSONArray(json)
               val byId = HashMap<String, String>()
               for (g in cats) byId[g.catId] = g.name
               for (i in 0 until a.length()) {
                 val o = a.getJSONObject(i)
                 val c = Channel()
                 c.kind = kind
                 c.group = byId[o.optString("category_id")] ?: "عام"
                 c.num = ++n
                 when (kind) {
                   "live" -> {
                     c.name = o.optString("name").ifBlank { o.optString("stream_display_name") }
                     c.id = o.optString("stream_id")
                     c.url = x.liveUrl(c.id)
                     c.alt = x.liveTs(c.id)
                     c.epgId = o.optString("epg_channel_id")
                     c.logo = o.optString("stream_icon")
                     c.extra = o.optString("num", "")
                   }
                   "movie" -> {
                     c.name = o.optString("name")
                     c.id = o.optString("stream_id")
                     c.url = x.movieUrl(c.id, o.optString("container_extension"))
                     c.alt = x.movieUrl(c.id, if (o.optString("container_extension") == "mp4") "mkv" else "mp4")
                     c.logo = o.optString("stream_icon")
                     c.extra = listOf(o.optString("genre"), o.optString("rating"), o.optString("year"))
                       .filter { it.isNotBlank() }.joinToString(" • ")
                   }
                   else -> {
                     c.name = o.optString("name").ifBlank { o.optString("series_name") }
                     c.id = o.optString("series_id")
                     c.url = ""
                     c.logo = o.optString("cover")
                     c.extra = o.optString("genre")
                   }
                 }
                 out.add(c)
               }
             } catch (t: Throwable) {}
             return n
           }

           /** يحلّل get_series_info إلى قائمة حلقات مرتبة بالموسم. */
           fun parseEpisodes(json: String?, x: Xtream, out: MutableList<Channel>): Int {
             if (json.isNullOrBlank()) return 0
             var n = 0
             try {
               val info = JSONObject(json).optJSONObject("episodes") ?: return 0
               val seasons = info.keys().asSequence().toList()
               for (s in seasons) {
                 val arr = info.optJSONArray(s) ?: continue
                 for (i in 0 until arr.length()) {
                   val o = arr.getJSONObject(i)
                   val c = Channel()
                   c.kind = "episode"
                   c.num = ++n
                   c.group = if (seasons.size > 1) "موسم $s" else ""
                   val ep = o.optString("episode_num")
                   val title = o.optString("title")
                   c.name = if (ep.isBlank()) title else "حلقة $ep${if (title.isNotBlank()) " — $title" else ""}"
                   c.id = o.optString("id")
                   val xext = o.optString("container_extension")
                   c.url = x.seriesUrl(c.id, xext)
                   // (8.34) حاوية بديلة: كثير من لوحات Xtream تُعلن mp4 والحقيقة mkv ⇒ التبديل التلقائي يشتغل
                   c.alt = x.seriesUrl(c.id, if (xext == "mp4") "mkv" else "mp4")
                   c.extra = o.optString("info_movie").take(200)
                   out.add(c)
                 }
               }
             } catch (t: Throwable) {}
             return n
           }

           /** بيانات المستخدم (تجديد/انتهاء/حالة). */
           fun userInfo(json: String?): JSONObject? = try {
             if (json.isNullOrBlank()) null else JSONObject(json).optJSONObject("user_info")
           } catch (t: Throwable) { null }
         }
       }

       /**
       * ============================ MAC PORTAL / STALKER ============================
       * دالة البوابة الكاملة (نفس منطق كود Java الأصلي) + إصلاحات لتشغيل «بالضغط مباشرة»:
       *   1) handshake على 5 مسارات × نسختي ترويسات × 4 صيغ (pre_auth / token / mac)
       *   2) get_profile (result.status) ثم get_settings
       *   3) get_genres + get_all_channels للبث · get_categories للأقسام
       *   4) get_ordered_list?genre=<id>&p=<n> لكل قسم (متوازي، مع صفحات)
       *   5) المسلسلات: seriesTree (get_series_info ثم ordered_list&movie_id=) + seasonEpisodes(season_id)
       *   6) التشغيل: playable() = أمر base64 للحلقات ثم create_link لكل الأنواع ثم استخراج cmd من السيرفر
       *   7) جلسة محفوظة: نفس التوكن يُعاد استعماله (StalkerSession) → الضغط يشغّل فورًا
       * ============================================================================
       */
       class Stalker(baseRaw: String, macRaw: String) {
         var base = originOf(baseRaw)
           private set
         val mac: String = normMac(if (macRaw.isNotBlank()) macRaw else macFrom(baseRaw))
         var token = ""
           private set
         var accountStatus = ""
           private set
         var lastError = ""
         @Volatile var lastReq = ""              // آخر طلب أُرسل (للتشخيص في سجل الأعطال)
         @Volatile var lastEpsInfo = ""          // تشخيص جلب الحلقات
           private set
         var liveCats = ArrayList<Group>()
           private set

         private var loadPath = "/server/load.php"
         private var variant = 0
         private var probed = false

         companion object {
           val PATHS = arrayOf(
             "/server/load.php", "/stalker_portal/server/load.php", "/portal.php",
             "/c/server/load.php", "/stalker_portal/c/server/load.php"
           )
           const val UA_STB = "Mozilla/5.0 (QtEmbedded; U; Linux; C) AppleWebKit/534.12 (KHTML, like Gecko) Safari/534.12"
           const val MAX_PAGES_PER_CAT = 60
           const val MAX_ITEMS = 45000
           const val MAX_LIVE = 30000            // سقف أمان للذاكرة (بعض البوابات ترسل 60 ألف+)
           const val PAGE_MIN = 14

           fun normMac(raw: String): String {
             val h = raw.uppercase().replace("[^0-9A-F]".toRegex(), "")
             if (h.length != 12) return raw.trim()
             return h.chunked(2).joinToString(":")
           }

           fun macFrom(url: String): String {
             val m = Regex("([0-9A-Fa-f]{2}[:-]){5}[0-9A-Fa-f]{2}").find(url)
             if (m != null) return m.value
             val q = Regex("[?&]mac=([^&]+)").find(url)
             return if (q != null) q.groupValues[1].replace("%3A", ":") else ""
           }

           fun originOf(url: String): String {
             val m = Regex("^(https?://[^/?#]+)([^?#]*)").find(url.trim()) ?: return url.trim()
             var path = m.groupValues[2]
             while (path.endsWith("/")) path = path.substring(0, path.length - 1)
             if (path.endsWith("/c")) path = path.substring(0, path.length - 2)
             return m.groupValues[1] + path
           }

           /** أمر محلي قياسي عندما لا ترسل البوابة cmd: http://localhost/ch/<id>_ (نفس ما يبنيه MAG) */
           fun localCmd(id: String): String {
             // (8.34) معرّف رقمي فقط (≤9 أرقام). قبل: كنا نُزيل كل غير الأرقام ⇒ أمر MAG
             //        مشوّه مستخرج من base64 ⇒ البوابة ترد stream=. (رابط ميت) ⇒ 444.
             val n = id.substringBefore(":").trim()
             if (n.isEmpty() || n.length > 9 || !n.all { it.isDigit() }) return ""
             return "http://localhost/ch/" + n + "_"
           }

           /** أول معرّف رقمي صالح من المرشّحين (يرفض base64/الروابط/المعرّفات المركّبة). */
           fun firstNum(vararg ids: String): String {
             for (v in ids) {
               val t = v.substringBefore(":").trim()
               if (t.isNotEmpty() && t.length <= 9 && t.all { it.isDigit() }) return t
             }
             return ""
           }

           /**
           * (8.34) أمر create_link لفلم من معرّفه — نفس صيغة البوابة بالحرف:
           *   {"type":"movie","stream_id":"<id>","stream_source":null,"target_container":"[\"mp4\"]"}
           * مُجرّب على البوابة: يرجّع رابطًا سليمًا (play/movie.php?...&stream=<id>.mp4&play_token=…) ✅
           */
           fun movieCmd(id: String, ext: String = "mp4"): String {
             return try {
               val j = JSONObject()
               j.put("type", "movie")
               j.put("stream_id", id)
               j.put("stream_source", JSONObject.NULL)
               j.put("target_container", "[\"" + (if (ext.isBlank()) "mp4" else ext) + "\"]")
               android.util.Base64.encodeToString(j.toString().toByteArray(Charsets.UTF_8), android.util.Base64.NO_WRAP)
             } catch (t: Throwable) { Crash.log(t); "" }
           }

           // ------------------- (8.31) قواعد روابط البوابة (من اختبار البوابة الحقيقية) -------------------

           /** رابط تشغيل من مسار البوابة (play/live.php أو play/movie.php…) — يحتاج play_token. */
           fun isPortalPlayUrl(u: String): Boolean {
             val l = u.lowercase()
             if (!l.contains("/play/")) return false
             return l.contains("live.php") || l.contains("movie.php") || l.contains("series.php")
           }

           /** هل الرابط فيه توكن تشغيل حيّ؟ (بوابة MAC بلا توكن ترد 511 ⇒ رابط ميت) */
           fun hasToken(u: String): Boolean = u.lowercase().contains("play_token=")

           /** معرّف البث للمباشر: من الرابط (stream= أو /ch/<id>_) وإلا من معرّف العنصر. */
           fun liveStreamId(id: String, u: String): String {
             val a = Regex("[?&]stream=(\\d+)").find(u)?.groupValues?.get(1) ?: ""
             val b = Regex("/ch/(\\d+)").find(u)?.groupValues?.get(1) ?: ""
             val c = if (id.isNotBlank() && id.trim().all { it.isDigit() }) id.trim() else ""
             return listOf(a, b, c).firstOrNull { it.isNotBlank() } ?: ""
           }

           /**
           * رد البوابة **ميت**؟ (8.31) البوابة ترجع stream= فارغًا إذا أرسلنا لها
           * رابطًا فيه توكن قديم ⇒ نعتبره فشلًا وننتقل للمصدر الموالي بدل شاشة سوداء.
           */
           fun brokenLink(u: String): Boolean {
             if (u.isBlank()) return true
             val l = u.lowercase()
             if (!l.contains("/play/")) return false
             val m = Regex("[?&]stream=([^&]*)").find(u)?.groupValues?.get(1) ?: return true
             val s = m.trim()
             // (8.34) البوابة ترسل stream=. أو stream= (فارغ) لما يكون الأمر غالطًا ⇒ رابط ميت يُرفض
             return s.isEmpty() || s == "." || s == "%2e"
           }

           /**
           * ترويسات البوابة وقت التشغيل (media3) — تشمل التوكن المحفوظ إن وُجد،
           * لأن كثيرًا من البوابات ترفض الجلب بدونه.
           */
           fun playHeaders(profile: Profile?): Map<String, String> {
             if (profile == null || profile.type != "mac") return emptyMap()
             val st = StalkerSession.peek(profile)
             val mac = st?.mac ?: normMac(if (profile.mac.isNotBlank()) profile.mac else macFrom(profile.url))
             if (mac.isBlank()) return emptyMap()
             val base = st?.base ?: originOf(profile.url)
             val m = LinkedHashMap<String, String>()
             m["Cookie"] = "mac=$mac; stb_lang=ar; timezone=Europe/London"
             m["Referer"] = "$base/c/"
             m["User-Agent"] = UA_STB
             m["X-User-Agent"] = "Model: MAG250; Link: WiFi"
             m["Accept-Language"] = "ar,en;q=0.9"
             val tok = st?.token ?: ""
             if (tok.isNotEmpty()) m["Authorization"] = "Bearer $tok"
             return m
           }
         }

         private fun headers(auth: Boolean): Map<String, String> {
           val m = LinkedHashMap<String, String>()
           m["Cookie"] = "mac=$mac; stb_lang=ar; timezone=Europe/London"
           m["Accept"] = "*/*"
           m["Accept-Language"] = "ar,en;q=0.9"
           if (variant == 0) {
             m["User-Agent"] = UA_STB
             m["X-User-Agent"] = "Model: MAG250; Link: WiFi"
           } else {
             // نفس قيم كود Java المجرَّب حرفيًا
             m["User-Agent"] = "Mozilla/5.0 (QtEmbedded; Linux; C)"
             m["X-User-Agent"] = "Mozilla/5.0 (QtEmbedded; Linux; C)"
           }
           m["Referer"] = base + "/c/"
           if (auth && token.isNotEmpty()) m["Authorization"] = "Bearer $token"
           return m
         }

         /** طلب GET: يجرّب المسارات ونسخ الترويسات ويتذكر ما نجح منها. */
         private fun req(query: String, auth: Boolean = true): String? {
           val q = if (query.contains("JsHttpRequest")) query else "$query&JsHttpRequest=1-xml"
           val paths = if (probed) listOf(loadPath) else PATHS.toList()
           val variants = if (probed) listOf(variant) else listOf(0, 1)
           var err = ""
           for (v in variants) for (pth in paths) {
             variant = v
             try {
               val r = Http.read(base + pth + "?" + q, headers(auth), timeoutMs = 15000, retries = 1)
               val t = r.trimStart()
               if (r.isNotBlank() && (t.startsWith("{") || t.startsWith("["))) {
                 loadPath = pth; probed = true
                 lastReq = q + " ⇒ ok(" + r.length + ")"
                 return r
               }
               err = "رد غير JSON: " + r.take(40)
             } catch (t: Throwable) { err = t.message ?: t.javaClass.simpleName }
           }
           lastError = if (err.isBlank()) "لا رد من البوابة" else err
           lastReq = q + " ⇒ " + lastError
           return null
         }

         // ----------------------------- أدوات JSON -----------------------------

         private fun jsOf(json: String): Any? = try {
           val o = JSONObject(json)
           when {
             o.opt("js") != null -> o.opt("js")
             o.opt("result") != null -> o.opt("result")
             else -> o
           }
         } catch (t: Throwable) { null }

         /** مصفوفة العناصر من أي مخطط: js[] / js.data / js.categories / js.series / خريطة مواسم. */
         fun itemsOf(json: String): JSONArray {
           val res = JSONArray()
           val js = jsOf(json)
           if (js is JSONArray) return js
           val o = js as? JSONObject ?: return res
           for (k in arrayOf("data", "categories", "list", "channels", "items", "series", "episodes")) {
             val a = o.optJSONArray(k)
             if (a != null && a.length() > 0) return a
           }
           val keys = ArrayList<String>()
           val it = o.keys()
           while (it.hasNext()) keys.add(it.next())
           var seasonMap = false
           for (k in keys) {
             val v = o.opt(k)
             if (v is JSONArray && (k.matches(Regex("\\d+")) || k.lowercase().contains("season"))) { seasonMap = true; break }
           }
           for (k in keys) {
             val v = o.opt(k)
             if (v is JSONArray) {
               if (seasonMap) {
                 val so = JSONObject()
                 so.put("id", k)
                 so.put("season_number", k.replace(Regex("\\D"), ""))
                 so.put("name", "موسم $k")
                 so.put("series", v)
                 res.put(so)
               } else for (i in 0 until v.length()) {
                 val e = v.opt(i)
                 if (e != null) res.put(e)
               }
             } else if (v is JSONObject) {
               val inner = v.optJSONArray("series") ?: v.optJSONArray("episodes")
               if (inner != null) {
                 val so = JSONObject()
                 so.put("id", k)
                 so.put("name", v.optString("name", "موسم $k"))
                 so.put("series", inner)
                 res.put(so)
               } else if (v.optString("name").isNotBlank() || v.optString("title").isNotBlank()) res.put(v)
             }
           }
           return res
         }

         private fun pagesOf(json: String): Int {
           val o = jsOf(json) as? JSONObject ?: return 1
           var n = 1
           val tp = o.opt("totalPages")
           n = when (tp) {
             is Int -> tp
             is String -> tp.toIntOrNull() ?: n
             else -> n
           }
           if (n == 1) n = maxOf(o.optInt("total_pages", 1), n)          // صيغة Stalker الشائعة
           if (n == 1) n = maxOf(o.optJSONObject("total")?.optInt("pages", 1) ?: 1, n)
           if (n == 1) n = maxOf(o.optInt("pages", 1), 1)
           if (n == 1) {                                                   // لو ما أرسلتش عدد الصفحات: نحسبها
             var total = o.optInt("total_items", 0)
             if (total == 0) total = o.optInt("total", 0)
             var per = o.optInt("per_page", 0)
             if (per == 0) per = o.optInt("max_page_items", 0)
             if (per == 0 && total > 0) per = PAGE_MIN
             if (total > 0 && per > 0) n = maxOf(1, (total + per - 1) / per)
           }
           return if (n < 1) 1 else n
         }

         private fun str(o: JSONObject, vararg keys: String): String {
           for (k in keys) { val v = o.optString(k); if (v.isNotBlank() && v != "null") return v }
           return ""
         }

         /** يفكّ الهروب (\/) ويزيل علامات التنصيص ويجرّد «ffmpeg ». */
         fun unwrap(s: String): String {
           var c = s.trim()
           if (c.startsWith("\"") && c.endsWith("\"") && c.length > 1) c = c.substring(1, c.length - 1)
           c = c.replace("\\/", "/").replace("\\u0026", "&").trim()
           while (c.startsWith("ffmpeg")) c = c.substring(6).trim()
           return c
         }

         /** يكمل الرابط النسبي بأصل البوابة. */
         fun cleanCmd(cmd: String): String {
           val c = unwrap(cmd)
           if (c.startsWith("http") || c.startsWith("rtmp") || c.startsWith("rtsp") || c.startsWith("udp") || c.startsWith("mms")) return c
           if (c.startsWith("/")) return base + c
           return c
         }

         // ----------------------------- الاتصال -----------------------------

         /** المصافحة: تُنفَّذ مرة واحدة وتُخزَّن الجلسة (token + المسار الناجح). */
         fun connect(): Boolean {
           if (probed && token.isNotEmpty()) return true
           val qs = listOf(
             "type=stb&action=handshake&pre_auth=1&mac=" + Uri.encode(mac),
             "type=stb&action=handshake&token=&mac=" + Uri.encode(mac),
             "type=stb&action=handshake&token=",
             "type=stb&action=handshake&mac=" + Uri.encode(mac)
           )
           for (v in intArrayOf(0, 1)) {
             variant = v
             for (pth in PATHS) {
               for (q in qs) {
                 val r = try {
                   Http.read(base + pth + "?" + q + "&JsHttpRequest=1-xml", headers(false), timeoutMs = 12000, retries = 1)
                 } catch (t: Throwable) { null } ?: continue
                 val tok = tokenOf(r) ?: continue
                 token = tok; loadPath = pth; probed = true; variant = v
                 val prof = req("type=stb&action=get_profile&mac=" + Uri.encode(mac), true)
                 if (prof != null) {
                   val st = statusOf(prof)
                   accountStatus = st
                   if (st.isNotEmpty() && st != "1" && !st.equals("active", true) && !st.equals("ok", true)) {
                     lastError = "حالة الحساب في البوابة: $st"
                     return false
                   }
                 }
                 req("type=stb&action=get_settings")
                 return true
               }
             }
           }
           probed = false
           if (lastError.isBlank()) lastError = "فشلت المصافحة — تحقق من MAC ومن http/https وأن البوابة تقبل جهازًا غير STB"
           return false
         }

         private fun tokenOf(json: String): String? = try {
           val js = JSONObject(json).opt("js")
           when (js) {
             is String -> if (js.length > 8) js else null
             is JSONObject -> (js.optString("token").ifBlank { js.optString("random") }).ifBlank { null }
             else -> JSONObject(json).optString("token").ifBlank { null }
           }
         } catch (t: Throwable) { null }

         private fun statusOf(json: String): String = try {
           val o = JSONObject(json)
           val r = o.optJSONObject("result")
           val a = if (r != null) r.optString("status") else ""
           if (a.isNotBlank()) a
           else {
             val jj = o.opt("js")
             if (jj is JSONObject) jj.optString("status") else o.optString("status")
           }
         } catch (t: Throwable) { "" }

         // ----------------------------- الأقسام -----------------------------

         fun categories(type: String): List<Group> {
           val out = ArrayList<Group>()
           for (a in arrayOf("get_categories", "get_filter")) {
             val r = req("type=$type&action=$a") ?: continue
             val arr = itemsOf(r)
             for (i in 0 until arr.length()) {
               val o = arr.optJSONObject(i) ?: continue
               val id = str(o, "id", "category_id", "value_id")
               val title = str(o, "title", "category_name", "name", "alias")
               if (id.isBlank() || title.isBlank()) continue
               if (out.none { it.catId == id }) out.add(Group().apply { name = title; catId = id; count = o.optInt("total") })
             }
             if (out.isNotEmpty()) break
           }
           return out
         }

         fun liveCategories(): List<Group> = categories("itv").also { liveCats = ArrayList(it) }

         // ----------------------------- البث المباشر -----------------------------

         fun channels(live: MutableList<Channel>): Int {
           live.clear()
           val genres = HashMap<String, String>()
           req("type=itv&action=get_genres")?.let { r ->
             val arr = itemsOf(r)
             for (i in 0 until arr.length()) {
               val o = arr.optJSONObject(i) ?: continue
               val id = str(o, "id"); val t = str(o, "title", "category_name", "name")
               if (id.isNotBlank() && t.isNotBlank()) genres[id] = t
             }
           }
           var n = 0
           val seen = HashSet<String>()
           for (page in 0..3) {
             val r = req("type=itv&action=get_all_channels&number=$page") ?: break
             val arr = itemsOf(r)
             if (arr.length() == 0) break
             val addedBefore = n
             for (i in 0 until arr.length()) {
               val o = arr.optJSONObject(i) ?: continue
               if (n >= MAX_LIVE) break
               val c = Channel()
               c.kind = "live"
               c.num = ++n
               c.name = str(o, "name", "title")
               c.id = str(o, "id", "picon_id")
               c.url = cleanCmd(str(o, "cmd", "media_url", "url"))
               if (c.url.isBlank() && c.id.isNotBlank()) c.url = localCmd(c.id)   // بوابة لا ترسل cmd
               c.logo = str(o, "logo", "logo_url", "picon")
               val gid = str(o, "tv_genre_id", "category_id")
               val gn = if (genres.containsKey(gid)) genres[gid]!! else ""
               c.group = if (gn.isNotBlank()) gn else str(o, "tv_genre", "category_name").ifBlank { "عام" }
               c.extra = str(o, "num")
               // حذف التكرار: بعض البوابات ترجع نفس القائمة في كل صفحة (60 ألف+ قناة مكرّرة)
               val key = c.id + "|" + c.name + "|" + c.url
               if (!seen.add(key)) { n--; continue }
               c.stype = "live"
               if (c.name.isNotBlank() && c.url.isNotBlank()) live.add(c)
             }
             if (n == addedBefore) break              // الصفحة ما زادتش جديد → البوابة تعيد نفسها
             if (arr.length() < 1000) break
           }
           if (live.isEmpty()) {
             val cats = if (liveCats.isNotEmpty()) liveCats else liveCategories()
             for (g in cats) {
               var r = req("type=itv&action=get_ordered_list&genre=" + Uri.encode(g.catId) + "&p=1")
               if (r == null || itemsOf(r).length() == 0)
                 r = req("type=itv&action=get_ordered_list&category=" + Uri.encode(g.catId) + "&p=1")
               if (r == null) continue
               val arr = itemsOf(r)
               for (i in 0 until arr.length()) {
                 val o = arr.optJSONObject(i) ?: continue
                 val c = Channel()
                 c.kind = "live"; c.num = ++n
                 c.name = str(o, "name", "title"); c.id = str(o, "id")
                 c.url = cleanCmd(str(o, "cmd", "media_url"))
                 if (c.url.isBlank() && c.id.isNotBlank()) c.url = localCmd(c.id)
                 c.logo = str(o, "logo", "picon")
                 c.group = g.name; c.catId = g.catId; c.stype = "live"
                 val k2 = c.id + "|" + c.name + "|" + c.url
                 if (c.name.isNotBlank() && c.url.isNotBlank() && seen.add(k2)) live.add(c)
               }
             }
           }
           return live.size
         }

         // ----------------------------- VOD / مسلسلات -----------------------------

         private fun toChannel(o: JSONObject, kind: String, catName: String, catId: String, idx: Int): Channel {
           val c = Channel()
           c.kind = kind
           c.num = idx
           c.name = str(o, "name", "title")
           c.id = str(o, "id", "movie_id", "series_id", "value_id")
           c.url = cleanCmd(str(o, "cmd", "media_url", "url"))
           // بوابات كثيرة ما ترسلش cmd للأفلام/المسلسلات → نبني أمر جهاز MAG: http://localhost/ch/<id>_
           if (c.url.isBlank() && c.id.isNotBlank()) c.url = localCmd(c.id)
           c.logo = str(o, "screenshot_uri", "cover", "screenshot", "backdrop_path", "movie_image")
           c.catId = catId
           c.group = if (catName.isNotBlank()) catName else str(o, "category_name", "genres", "category_id").ifBlank { "عام" }
           val parts = ArrayList<String>()
           val yr = str(o, "year"); if (yr.isNotBlank()) parts.add(yr)
           val rt = str(o, "rating", "rating_kinopoisk", "rating_imdb"); if (rt.isNotBlank()) parts.add("★ $rt")
           val or = str(o, "name_orig"); if (or.isNotBlank()) parts.add(or)
           val ds = str(o, "description", "overview"); if (ds.isNotBlank()) parts.add(ds.take(140))
           c.extra = parts.joinToString(" • ")
           c.stype = kind
           c.mid = str(o, "series_id", "movie_id")
           return c
         }

         /**
         * صفحة قسم واحد. بعض البوابات تقبل `genre=` فقط (Stalker) وبعضها `category=` فقط
         * (كما في كود Java الذي يستعمل get_ordered_list&category=<id>) — نجرب الاثنين.
         */
         fun page(type: String, genreId: String, page: Int, search: String): String? {
           val tail = if (search.isNotBlank()) "&search=" + Uri.encode(search) else ""
           var q = "type=$type&action=get_ordered_list&p=$page"
           if (genreId.isNotBlank() && genreId != "0") q += "&genre=" + Uri.encode(genreId)
           val r = req(q + tail + "&detailed=1&sortby=posted")
           if (r != null && itemsOf(r).length() > 0) return r
           if (genreId.isBlank() || genreId == "0") return r
           // إعادة المحاولة بصيغة category=
           val q2 = "type=$type&action=get_ordered_list&p=$page&category=" + Uri.encode(genreId)
           val r2 = req(q2 + tail + "&detailed=1&sortby=posted")
           return if (r2 != null && itemsOf(r2).length() > 0) r2 else r
         }

         fun fetchAll(kind: String, cats: List<Group>, out: MutableList<Channel>, maxPages: Int, budgetMs: Long, progress: (String) -> Unit): Int {
           val deadline = System.currentTimeMillis() + budgetMs
           val type = if (kind == "movie") "vod" else "series"
           if (type == "vod") req("type=vod&action=get_filter&number=0") else req("type=series&action=get_filter&number=0")
           val list = if (cats.isEmpty()) listOf(Group().apply { name = "ALL"; catId = "0"; special = "all" }) else cats
           val pool = Executors.newFixedThreadPool(8)
           val perCat = java.util.concurrent.ConcurrentHashMap<String, MutableList<Channel>>()
           val doneN = java.util.concurrent.atomic.AtomicInteger(0)
           val totN = java.util.concurrent.atomic.AtomicInteger(0)
           for (g in list) {
             pool.submit {
               val mine = ArrayList<Channel>()
               try {
                 val seenF = HashSet<String>()
                 val first = page(type, g.catId, 1, "")
                 if (first != null) {
                   val arr = itemsOf(first)
                   for (i in 0 until arr.length()) {
                     val o = arr.optJSONObject(i) ?: continue
                     val c1 = toChannel(o, kind, g.name, g.catId, i + 1)
                     if (seenF.add(c1.id + "|" + c1.name)) mine.add(c1)
                   }
                   val pages = pagesOf(first)
                   var p = 2
                   while (arr.length() >= PAGE_MIN && (p <= pages || pages <= 1) && p <= maxPages &&
                     totN.get() < MAX_ITEMS && System.currentTimeMillis() < deadline) {
                     val r2 = page(type, g.catId, p, "") ?: break
                     val a2 = itemsOf(r2)
                     if (a2.length() == 0) break
                     val before2 = mine.size
                     for (i in 0 until a2.length()) {
                       val o2 = a2.optJSONObject(i) ?: continue
                       val c2 = toChannel(o2, kind, g.name, g.catId, mine.size + 1)
                       if (seenF.add(c2.id + "|" + c2.name)) mine.add(c2)
                     }
                     if (mine.size == before2) break
                     if (a2.length() < PAGE_MIN) break
                     p++
                   }
                 }
               } catch (t: Throwable) { Crash.log(t) }
               synchronized(mine) { perCat[g.catId + "|" + g.name] = mine }
               totN.addAndGet(mine.size)
               val d = doneN.incrementAndGet()
               val tt = totN.get()
               Bg.ui { progress("$d/${list.size} قسم • $tt عنصر") }
             }
           }
           pool.shutdown()
           try { pool.awaitTermination(12, java.util.concurrent.TimeUnit.MINUTES) } catch (t: Throwable) { Crash.log(t) }
           val ordered = ArrayList<Channel>()
           for (g in list) { val mine = perCat[g.catId + "|" + g.name]; if (mine != null) ordered.addAll(mine) }
           for (i in ordered.indices) ordered[i].num = i + 1
           synchronized(out) { out.clear(); out.addAll(ordered) }
           return out.size
         }

         /**
         * يجلب **كل** صفحات قسم: نتبع عدد الصفحات إن أرسلته البوابة، وإلا نكمل ما دامت
         * الصفحة ممتلئة (نفس منطق «page++ while len >= 14» في كود Java) حتى آخر صفحة.
         */
         fun fillCat(kind: String, genreId: String, catName: String, maxPages: Int, out: MutableList<Channel>): Int {
           val type = if (kind == "movie") "vod" else "series"
           var p = 1
           var pages = 0
           var added = 0
           val seen = HashSet<String>()
           for (c in out) seen.add(c.id + "|" + c.name)
           while (p <= maxPages) {
             val r = page(type, genreId, p, "") ?: break
             val arr = itemsOf(r)
             if (arr.length() == 0) break
             val before = added
             for (i in 0 until arr.length()) {
               val o = arr.optJSONObject(i) ?: continue
               val c = toChannel(o, kind, catName, genreId, out.size + 1)
               if (c.kind == "series") c.mid = c.id
               if (!seen.add(c.id + "|" + c.name)) continue     // نفس العنصر مرّة أخرى
               out.add(c); added++
               if (out.size >= MAX_ITEMS) return added
             }
             if (pages == 0) pages = pagesOf(r)               // عدد الصفحات (إن وُجد)
             if (added == before) break                       // الصفحة ما زادتش جديد
             if (arr.length() < PAGE_MIN) break               // صفحة ناقصة = آخر صفحة
             if (pages > 0 && p >= pages) break               // وصلنا للعدد المُعلن
             p++
           }
           return added
         }

         fun search(kind: String, genreId: String, query: String, out: MutableList<Channel>): Int {
           val type = if (kind == "movie") "vod" else "series"
           val r = page(type, genreId, 1, query) ?: return 0
           val arr = itemsOf(r)
           for (i in 0 until arr.length()) {
             val o = arr.optJSONObject(i) ?: continue
             out.add(toChannel(o, kind, "", genreId, i + 1))
           }
           return out.size
         }

         /**
         * شجرة المسلسل — **نفس كود Java** (`fetchStalkerSeriesTree` + `tryStalkerSeriesUrl` +
         * `processStalkerSeriesItems`): 3 صيغ للرابط (بـ force_ch_link_check=1)، ومعالجة العناصر:
         *   • موسم فيه حلقات مدمجة → مجلد موسم + حلقاته في الخازن
         *   • موسم بلا حلقات → مجلد موسم (الحلقات تُجلب عند الضغط عليه)
         *   • حلقة مباشرة (فيها cmd) → حلقة
         */
         fun seriesTree(seriesId0: String, genre: String, cover: String, out: MutableList<Channel>): Int {
           val seriesId = seriesId0.replace("series_", "").trim()
           if (seriesId.isBlank()) return 0
           val enc = Uri.encode(seriesId)
           val urls = listOf(
             "type=series&action=get_ordered_list&movie_id=$enc&p=1&force_ch_link_check=1",
             "type=vod&action=get_ordered_list&movie_id=$enc&p=1&force_ch_link_check=1",
             "type=series&action=get_ordered_list&series_id=$enc&p=1&force_ch_link_check=1",
             "type=series&action=get_series_info&movie_id=$enc"
           )
           for (u in urls) {
             val r = req(u) ?: continue
             val created = processSeriesItems(r, seriesId, genre, cover, out)
             if (created > 0) return out.size
           }
           return 0
         }

         /** نفس `processStalkerSeriesItems`: يحوّل عناصر الاستجابة إلى مواسم/حلقات. */
         private fun processSeriesItems(json: String, seriesId: String, genre: String, cover: String, out: MutableList<Channel>): Int {
           var created = 0

           // (أ) خريطة المواسم: js = { "1": {name, series:[...]} } أو js.series = { ... }
           val js = jsOf(json)
           val mapObj: JSONObject? = when {
             js is JSONObject && js.optJSONObject("series") != null -> js.optJSONObject("series")
             js is JSONObject && looksLikeSeasonMap(js) -> js
             else -> null
           }
           if (mapObj != null) {
             val keys = ArrayList<String>()
             val it = mapObj.keys(); while (it.hasNext()) keys.add(it.next())
             keys.sortBy { it.toIntOrNull() ?: 9999 }
             for (k in keys) {
               val sd = mapObj.optJSONObject(k) ?: continue
               val eps = sd.optJSONArray("series") ?: sd.optJSONArray("episodes")
               val sName = str(sd, "name", "title").ifBlank { "موسم $k" }
               addSeasonFolder(out, seriesId, if (genre.isBlank()) "مسلسلات" else genre, cover, k, sName, k, eps)
               created++
             }
             if (created > 0) { sortTree(out); return created }
           }

           // (ب) مصفوفة عناصر (نفس منطق Java حرفيًا)
           val items = itemsOf(json)
           for (i in 0 until items.length()) {
             val item = items.optJSONObject(i) ?: continue
             val id = str(item, "id")
             val name = str(item, "name", "title")
             val cmd = cleanCmd(str(item, "cmd", "media_url", "url"))
             val explicitSeasonId = str(item, "season_id")
             val seasonNumber = str(item, "season_number", "season_num")
             val episodeNumber = str(item, "episode_number", "series_number")
             var nested = item.optJSONArray("series") ?: item.optJSONArray("episodes") ?: item.optJSONArray("seasons")
             val isSeasonStr = str(item, "is_season")
             val hasEpisodeMarkers = episodeNumber.isNotBlank() || item.has("episode_id") || item.has("series_number") || item.has("episode_number")
             val isSeason = !hasEpisodeMarkers && (item.optBoolean("is_season", false) || isSeasonStr == "1" ||
               isSeasonStr.equals("true", true) || explicitSeasonId.isNotBlank() || seasonNumber.isNotBlank() ||
               nested != null || (cmd.isBlank() && (name.contains("موسم") || name.lowercase().contains("season"))))
             val rawKey = when {
               explicitSeasonId.isNotBlank() -> explicitSeasonId
               seasonNumber.isNotBlank() -> seasonNumber
               id.isNotBlank() -> id
               else -> name
             }
             val sName0 = name.ifBlank { "موسم " + seasonNumber.ifBlank { rawKey } }
             val sKey = rawSeasonKey(explicitSeasonId, id, seasonNumber, sName0)
             when {
               nested != null && nested.length() > 0 -> {
                 addSeasonFolder(out, seriesId, if (genre.isBlank()) "مسلسلات" else genre, cover, sKey,
                   sName0, seasonNumber, nested)
                 created++
               }
               isSeason -> {
                 addSeasonFolder(out, seriesId, if (genre.isBlank()) "مسلسلات" else genre, cover, sKey,
                   sName0, seasonNumber, null)
                 created++
               }
               cmd.isNotBlank() -> {
                 out.add(episodeChannel(item, seriesId, rawSeasonKey(explicitSeasonId, id, seasonNumber, name), "", genre, cover, out.size))
                 created++
               }
             }
           }
           sortTree(out)
           return created
         }

         /** هل هذا العنصر بطاقة موسم (لا حلقة)؟ — نفس شروط كود Java. */
         private fun looksLikeSeason(o: JSONObject): Boolean {
           val id = str(o, "id"); val name = str(o, "name", "title")
           val cmd = cleanCmd(str(o, "cmd", "media_url", "url"))
           val seasonNum = str(o, "season_number", "season_num")
           val epNum = str(o, "episode_number", "series_number")
           val isSeasonStr = str(o, "is_season")
           val hasEpisodeMarkers = epNum.isNotBlank() || o.has("episode_id") || o.has("series_number") || o.has("episode_number")
           if (hasEpisodeMarkers) return false
           if (o.optBoolean("is_season", false) || isSeasonStr == "1" || isSeasonStr.equals("true", true)) return true
           if (str(o, "season_id").isNotBlank() || seasonNum.isNotBlank()) return true
           if (cmd.isBlank() && (name.contains("موسم") || name.lowercase().contains("season"))) return true
           return false
         }

         /** يفهم إن كان هذا JSONObject خريطة مواسم (مفاتيح أرقام). */
         private fun looksLikeSeasonMap(o: JSONObject): Boolean {
           val it = o.keys()
           var seen = 0
           while (it.hasNext()) {
             val k = it.next()
             if (k.toIntOrNull() != null || k.lowercase().contains("season")) { seen++; if (seen > 0) return true }
             if (k == "data" || k == "cmd" || k == "token") return false
           }
           return false
         }

         /** رقم الموسم من أي شكل: «3» أو «series:3» أو «موسم 3» أو «Season 3». "" لو ما لقاش. */
         private fun seasonNum(key: String, name: String = ""): String {
           val k = key.trim().replace("series_", "")
           if (k.contains(":")) {
             val t = k.substringAfterLast(':').trim()
             if (t.toIntOrNull() != null) return t
           }
           if (k.toIntOrNull() != null) return k
           val m = Regex("(?i)(?:موسم|season)\\s*0*(\\d{1,4})").find(name)
           if (m != null) return m.groupValues[1]
           val m2 = Regex("(?i)s(\\d{1,3})\\b").find(name)
           if (m2 != null) return m2.groupValues[1]
           return ""
         }

         /** رقم الموسم للعرض والترتيب: من الاسم أولًا («موسم 3»)، ثم من season_number، ثم من المفتاح الصغير. */
         private fun displayNum(key: String, name: String, seasonNumber: String = ""): Int {
           val m = Regex("(?i)(?:موسم|season)\\s*0*(\\d{1,4})").find(name)
           if (m != null) return m.groupValues[1].toIntOrNull() ?: 0
           val m2 = Regex("(?i)(?:^|\\W)s(\\d{1,3})(?:\\W|$)").find(name)
           if (m2 != null) return m2.groupValues[1].toIntOrNull() ?: 0
           val sn = seasonNumber.trim().toIntOrNull()
           if (sn != null && sn in 1..99) return sn
           val kn = seasonNum(key, "").toIntOrNull()
           return if (kn != null && kn in 1..99) kn else 0
         }

         /**
         * مفتاح الموسم **كما يعرفه السرفر**: نستعمله في الرابط وفي المطابقة.
         * (في 8.16 صار المفتاح رقم الاسم ⇒ البوابات التي تطلب `season_id=<id الحقيقي>` ما رجّعتش حلقات).
         */
         private fun rawSeasonKey(seasonId: String, id: String, seasonNumber: String, name: String): String {
           for (v in listOf(seasonId.trim(), id.trim(), seasonNumber.trim())) if (v.isNotBlank() && v != "0") return v
           return name.trim()
         }

         /** اسم بطاقة الموسم + عدد حلقاته الحقيقي. */
         private fun seasonTitle(seasonName: String, num: Int, key: String, cnt: Int): String {
           val lbl = if (num > 0) num.toString() else key
           var base = seasonName.trim()
           if (base.isEmpty() || base.toIntOrNull() != null) base = "موسم $lbl"
           else if (!base.contains("موسم") && !base.lowercase().contains("season")) base = "موسم $lbl"
           return if (cnt > 0) "$base • $cnt حلقة" else base
         }

         /** ترتيب الحلقات رقميًا + حذف التكرار (نفس ترتيب حلقات المسلسل في التطبيق). */
         private fun sortEps(list: List<Channel>): List<Channel> {
           val seen = HashSet<String>()
           val uniq = ArrayList<Channel>()
           for (c in list) {
             val k = (if (c.url.isNotBlank()) c.url else c.id).trim() + "|" + c.name.trim()
             if (k == "|" || !seen.add(k)) continue
             uniq.add(c)
           }
           return uniq.sortedWith(compareBy({ it.num }, { it.name }))
         }

         /** ترتيب بطاقات المواسم رقميًا: موسم 2 قبل موسم 10 (لا ترتيب أبجدي). */
         private fun sortTree(out: MutableList<Channel>) {
           if (out.none { it.stype == "season" }) return
           val sorted = out.sortedWith(compareBy(
             { if (it.stype == "season" && it.num > 0) it.num else it.sid.toIntOrNull() ?: 99999 },
             { it.name }))
           out.clear()
           out.addAll(sorted)
         }

         /** ينشئ بطاقة موسم (ويحفظ حلقاته المدمجة في الخازن) مع دمج المواسم المكرّرة. */
         private fun addSeasonFolder(out: MutableList<Channel>, seriesId: String, genre: String, cover: String,
                       seasonKey: String, seasonName: String, seasonNumber: String, eps: JSONArray?) {
           val g = if (genre.isBlank()) "مسلسلات" else genre
           val key = seasonKey.ifBlank { seasonName.trim() }
           val num = displayNum(key, seasonName, seasonNumber)
           val ck = seriesId + "|" + key
           if (eps != null && eps.length() > 0) {
             val list = ArrayList<Channel>()
             for (k in 0 until eps.length()) {
               val e = eps.optJSONObject(k) ?: continue
               list.add(episodeChannel(e, seriesId, key, seasonName, g, cover, k))
             }
             if (list.isNotEmpty()) synchronized(seasonCache) {
               val merged = ArrayList(seasonCache[ck] ?: emptyList())
               merged.addAll(list)
               seasonCache[ck] = sortEps(merged)
             }
           }
           val cnt = synchronized(seasonCache) { seasonCache[ck]?.size ?: 0 }
           val exist = out.firstOrNull {
             it.stype == "season" && it.mid == seriesId && (it.sid == key || (num > 0 && it.num == num))
           }
           if (exist != null) {                       // موسم مكرّر: نحدّث الاسم/العدد ولا نضيف بطاقة ثانية
             exist.name = seasonTitle(seasonName, num, key, cnt)
             if (exist.num <= 0) exist.num = num
             return
           }
           out.add(Channel().apply {
             kind = "season"; stype = "season"
             this.num = num
             name = seasonTitle(seasonName, num, key, cnt)
             group = g
             id = "season_" + seriesId + "_" + key
             mid = seriesId; sid = key
             logo = cover; catId = seriesId
             extra = seasonName.ifBlank { "موسم " + (if (num > 0) num.toString() else key) }
           })
         }

         /** خازن حلقات المواسم المدمجة في الاستجابة (بلا طلب إضافي). */
         private val seasonCache = HashMap<String, List<Channel>>()

         /** هل حلقات هذا الموسم موجودة في الخازن؟ (يستعمله الجلب المسبق) */
         fun hasCachedEps(seriesId0: String, seasonId: String): Boolean {
           val sId = seriesId0.replace("series_", "").trim()
           val raw = seasonId.trim()
           val n = seasonNum(raw, "")
           synchronized(seasonCache) {
             for (k in listOf(sId + "|" + raw, sId + "|" + n, sId + "|*")) {
               if (k.endsWith("|")) continue
               val v = seasonCache[k]
               if (v != null && v.isNotEmpty()) return true
             }
           }
           return false
         }

         /**
         * حلقات موسم — **نفس كود Java** (`fetchStalkerEpisodes`):
         * 3 صيغ للرابط + مطابقة الموسم `isSameMacPortalSeason` + قراءة `server.series[]`.
         */
         fun seasonEpisodes(seriesId0: String, seasonId: String, out: MutableList<Channel>): Int {
           val seriesId = seriesId0.replace("series_", "").trim()
           if (seriesId.isBlank()) return 0
           val raw = seasonId.trim()
           val key = raw.ifBlank { seasonNum(raw, "") }
           // (0) حلقات مدمجة محفوظة من الشجرة (بلا شبكة) — نفس `getEpisodesForParent` في كود Java
           synchronized(seasonCache) {
             val hit = seasonCache[seriesId + "|" + key] ?: seasonCache[seriesId + "|" + raw]
               ?: seasonNum(raw, "").takeIf { it.isNotBlank() }?.let { seasonCache[seriesId + "|" + it] }
             if (hit != null && hit.isNotEmpty()) { out.addAll(hit); return hit.size }
           }
           val diag = StringBuilder()
           val enc = Uri.encode(seriesId)
           val urls = ArrayList<String>()
           urls.add("type=series&action=get_ordered_list&movie_id=$enc&p=1")
           if (!seriesId.contains(":")) urls.add("type=series&action=get_ordered_list&movie_id=" + Uri.encode("$seriesId:$seriesId") + "&p=1")
           for (k in listOf(key, seasonNum(raw, "")).filter { it.isNotBlank() }.distinct())
             urls.add("type=series&action=get_ordered_list&movie_id=$enc&season_id=" + Uri.encode(k) + "&p=1")
           urls.add("type=series&action=get_series_info&movie_id=$enc")
           for (u in urls) {
             val r = req(u)
             diag.append(lastReq).append(" | ")
             if (r == null) continue
             val tmp = ArrayList<Channel>()
             val n = parseSeasonEpisodes(r, seriesId, key, tmp)
             if (n > 0) return finishEps(seriesId, key, tmp, out)
           }
           // صيغ النجاة: movie_id = series:season (بالمفتاح أو برقم الموسم)
           for (k in listOf(key, seasonNum(raw, "")).filter { it.isNotBlank() }.distinct()) {
             val r = req("type=series&action=get_ordered_list&movie_id=" + Uri.encode("$seriesId:$k") + "&p=1")
             diag.append("$seriesId:$k ⇒ ").append(if (r == null) lastError else "ok(" + r.length + ")").append(" | ")
             if (r == null) continue
             val tmp = ArrayList<Channel>()
             if (parseSeasonEpisodes(r, seriesId, k, tmp) > 0) return finishEps(seriesId, k, tmp, out)
           }
           // (8.19) آخر حل — نفس كود Java: موسم فارغ يطابق كل المواسم ⇒ نعرض كل حلقات المسلسل
           if (raw.isNotBlank()) {
             for (u in listOf("type=series&action=get_ordered_list&movie_id=$enc&p=1",
                     "type=series&action=get_ordered_list&movie_id=" + Uri.encode("$seriesId:$seriesId") + "&p=1")) {
               val r = req(u)
               diag.append("ALL:").append(lastReq).append(" | ")
               if (r == null) continue
               val tmp = ArrayList<Channel>()
               if (parseSeasonEpisodes(r, seriesId, "", tmp) > 0) return finishEps(seriesId, "*", tmp, out)
             }
           }
           lastEpsInfo = "series=$seriesId season=$seasonId :: " + diag.toString().take(400)
           try { Crash.note("EPS", lastEpsInfo) } catch (t: Throwable) {}
           return 0
         }

         /** يختم جلب الحلقات: ترتيب رقمي + حذف التكرار + خزن (نفس `finishEpisodesLoad`). */
         private fun finishEps(seriesId: String, key: String, tmp: List<Channel>, out: MutableList<Channel>): Int {
           val list = sortEps(tmp)
           synchronized(seasonCache) { if (list.isNotEmpty()) seasonCache[seriesId + "|" + key] = list }
           out.addAll(list)
           return list.size
         }

         /** يقرأ حلقات الموسم من الاستجابة (نفس حلقة Java داخل `fetchStalkerEpisodesRequest`). */
         private fun parseSeasonEpisodes(json: String, seriesId: String, seasonId: String, out: MutableList<Channel>): Int {
           // خريطة مواسم: js = {"1": {series:[...]}}
           val js = jsOf(json)
           val mapObj: JSONObject? = when {
             js is JSONObject && js.optJSONObject("series") != null -> js.optJSONObject("series")
             js is JSONObject && looksLikeSeasonMap(js) -> js
             else -> null
           }
           if (mapObj != null) {
             val keys = ArrayList<String>()
             val it = mapObj.keys(); while (it.hasNext()) keys.add(it.next())
             for (k in keys) {
               val sd = mapObj.optJSONObject(k) ?: continue
               if (!isSameSeason(seasonId, k, k, k, str(sd, "name", "title"))) continue
               val eps = sd.optJSONArray("series") ?: sd.optJSONArray("episodes") ?: continue
               val sName = str(sd, "name", "title").ifBlank { "موسم $k" }
               for (i in 0 until eps.length()) {
                 val e = epOf(eps, i) ?: continue
                 val c = episodeChannel(e, seriesId, k, sName, "", "", out.size)
                 if (out.none { it.id == c.id }) out.add(c)
               }
             }
             if (out.isNotEmpty()) return out.size
           }

           val arr = itemsOf(json)
           var added = 0
           for (i in 0 until arr.length()) {
             val season = arr.optJSONObject(i) ?: continue
             val returnedId = str(season, "id").trim()
             val returnedSeasonId = str(season, "season_id").trim()
             val returnedSeasonNumber = str(season, "season_number").trim()
             val nested = season.optJSONArray("series") ?: season.optJSONArray("episodes")
             val same = isSameSeason(seasonId, returnedId, returnedSeasonId, returnedSeasonNumber, str(season, "name", "title"))
             if (!same) continue
             if (nested == null || nested.length() == 0) continue
             val sId = if (returnedId.isNotBlank()) returnedId else seasonId
             val sName = str(season, "name", "title").ifBlank { "موسم " + returnedSeasonNumber.ifBlank { sId } }
             for (e in 0 until nested.length()) {
               val ep = epOf(nested, e) ?: continue
               val c = episodeChannel(ep, seriesId, sId, sName, "", "", out.size)
               if (out.none { it.id == c.id }) { out.add(c); added++ }
             }
           }
           // (احتياطي 8.18) لا شيء طابق الموسم المطلوب؟ إن كان في الرد **مجموعة مواسم واحدة** نعرضها
           // بدل «لا توجد حلقات» (وإن كان فيه عدة مواسم فلا نخلطها — الأدق أن نقول لا توجد)
           if (added == 0) {
             var groups = 0
             var solo: JSONArray? = null
             for (i in 0 until arr.length()) {
               val season = arr.optJSONObject(i) ?: continue
               val nested = season.optJSONArray("series") ?: season.optJSONArray("episodes") ?: continue
               if (nested.length() == 0) continue
               groups++
               solo = nested
             }
             if (groups == 1 && solo != null) {
               val sn = solo
               for (e in 0 until sn.length()) {
                 val ep = epOf(sn, e) ?: continue
                 val c = episodeChannel(ep, seriesId, seasonId, "", "", "", out.size)
                 if (out.none { it.id == c.id && it.name == c.name }) { out.add(c); added++ }
               }
             }
           }

           // لو ما كانش تصنيف مواسم في الرد: العناصر نفسها حلقات (بوابات مسطّحة)
           if (added == 0 && arr.length() > 0) {
             var flat = 0
             for (i in 0 until arr.length()) {
               val o = epOf(arr, i) ?: continue
               if (o.optJSONArray("series") != null || o.optJSONArray("episodes") != null) continue
               if (looksLikeSeason(o)) continue          // بطاقة موسم ≠ حلقة
               val cmd = cleanCmd(str(o, "cmd", "media_url", "url"))
               val id = str(o, "id")
               if (cmd.isBlank() && id.isBlank()) continue
               val c = episodeChannel(o, seriesId, seasonId, "", "", "", out.size)
               if (out.none { it.id == c.id }) { out.add(c); flat++ }
             }
             added += flat
           }
           return added
         }

         /** مطابقة الموسم المطلوب مع ما رجعه السرفر — نفس `isSameMacPortalSeason` بالحرف. */
         fun isSameSeason(wantedSeasonId: String, returnedId: String, returnedSeasonId: String,
                 returnedSeasonNumber: String, returnedName: String = ""): Boolean {
           if (wantedSeasonId.trim().isEmpty()) return true
           val wanted = wantedSeasonId.trim()
           if (wanted == returnedId) return true
           if (wanted == returnedSeasonId) return true
           if (wanted == returnedSeasonNumber) return true
           if (wanted.contains(":")) {
             val wNum = wanted.substring(wanted.lastIndexOf(":") + 1)
             if (wNum == returnedSeasonNumber) return true
             if (returnedId.endsWith(":$wNum")) return true
             if (returnedSeasonId.endsWith(":$wNum")) return true
           }
           if (returnedId.contains(":")) {
             val rNum = returnedId.substring(returnedId.lastIndexOf(":") + 1)
             if (wanted == rNum) return true
           }
           if (returnedSeasonId.contains(":")) {
             val rNum = returnedSeasonId.substring(returnedSeasonId.lastIndexOf(":") + 1)
             if (wanted == rNum) return true
           }
           // مقارنة بالرقم: «2» = `season_number=2` = `id=301:2` (والبوابات تخلط بينها كثيرًا)
           val wNum = seasonNum(wanted, "")
           if (wNum.isNotBlank()) {
             if (wNum == seasonNum(returnedId, "")) return true
             if (wNum == seasonNum(returnedSeasonId, "")) return true
             if (wNum == seasonNum(returnedSeasonNumber, "") && returnedSeasonNumber.trim().isNotBlank()) return true
           }
           if (returnedName.isNotBlank()) {          // «موسم 1» في الرد يطابق المطلوب «1»
             val rNum = displayNum("", returnedName, returnedSeasonNumber)
             val w = seasonNum(wanted, "").toIntOrNull()
             if (rNum > 0 && w != null && w == rNum) return true
           }
           return false
         }

         /** حلقة من عنصر قد يكون كائنًا أو نصًّا («101») — نفس ما يفعله كود Java في حلقة `series`. */
         private fun epOf(arr: JSONArray, i: Int): JSONObject? {
           val o = arr.optJSONObject(i)
           if (o != null) return o
           val raw = arr.optString(i, "").trim()
           if (raw.isBlank() || raw == "null") return null
           if (raw.startsWith("{")) return try { JSONObject(raw) } catch (t: Throwable) { null }
           return JSONObject().put("id", raw).put("name", "الحلقة " + raw).put("cmd", raw)
         }

         private fun episodeChannel(e: JSONObject, seriesId: String, seasonId: String, seasonName: String, genre: String, cover: String, i: Int): Channel {
           val c = Channel()
           c.kind = "episode"
           c.stype = "episode"
           val rawName = str(e, "name", "title", "episode_name")
           var n = str(e, "episode_number", "series_number", "series", "num", "episode")
             .filter { it.isDigit() }.take(4).toIntOrNull()
           if (n == null) n = Regex("(\\d{1,4})").find(rawName)?.groupValues?.get(1)?.toIntOrNull()
           c.num = n ?: (i + 1)
           c.name = rawName.ifBlank { "الحلقة ${c.num}" }
           c.group = if (seasonName.isNotBlank()) seasonName else (if (genre.isNotBlank()) genre else "مسلسلات")
           c.id = str(e, "id", "episode_id", "series_id")
           c.url = cleanCmd(str(e, "cmd", "media_url", "url", "link"))
           c.logo = str(e, "screenshot_uri", "screenshot").ifBlank { cover }
           c.mid = seriesId
           c.sid = seasonId
           c.snum = displayNum(seasonId, seasonName, "")
           if (c.id.isBlank()) {
             // بعض البوابات ترسل الحلقة بلا id: نأخذ الرقم من الأمر أو من الاسم (كود Java يعتمد على id)
             val fromCmd = Regex("(\\d{1,7})").find(c.url)?.groupValues?.get(1) ?: ""
             c.id = fromCmd.ifBlank { (if (c.num > 0) c.num.toString() else "") }
           }
           c.catId = seriesId
           c.extra = str(e, "rating")
           return c
         }


         // ----------------------------- التشغيل -----------------------------

         /** يستخرج رابط التشغيل من رد create_link (js سلسلة أو كائن أو نص فيه رابط). */
         private fun urlFrom(response: String): String {
           val js = jsOf(response)
           val raw = when (js) {
             is String -> js
             is JSONObject -> str(js, "cmd", "url", "link", "media_url")
             else -> response
           }
           var c = unwrap(raw)
           if (c.startsWith("http") || c.startsWith("rtmp") || c.startsWith("rtsp") || c.startsWith("udp") || c.startsWith("mms")) return c
           val m = Regex("https?://[^\\s\"'\\\\]+").find(c) ?: return ""
           return m.value.removeSuffix("\\")
         }

         /** (8.20) تشخيص محاولات الحلقة الأخيرة (يُقرأ من سجل الأعطال). */
         private fun diagEps(q: String) {
           try {
             val s = q.substringAfter("create_link", "").take(120)
             lastEpsInfo = (if (lastEpsInfo.length > 300) lastEpsInfo.takeLast(300) else lastEpsInfo) + " | " + s
           } catch (t: Throwable) {}
         }

         /** أمر create_link الداخلي العائد (بعض البوابات ترد بـ cmd جديد بدل الرابط). */
         private fun innerCmd(response: String): String {
           val js = jsOf(response) as? JSONObject ?: return ""
           val v = str(js, "cmd", "url", "link")
           val u = unwrap(v)
           if (u.startsWith("http") || u.startsWith("rtmp") || u.startsWith("rtsp") || u.startsWith("udp")) return ""
           return u
         }

         /** أمر base64 للحلقات: {"series_id":..,"season_num":..,"type":"series"} — صيغة Stalker القياسية. */
         fun seriesCmd(mid: String, sid: String, num: Int = 0): String {
           val j = JSONObject()
           val sRaw = mid.substringBefore(":").trim()
           val sVal: Any = sRaw.toIntOrNull() ?: sRaw
           // season_num = رقم الموسم (1،2،3…). المعرّف الكبير من السرفر (501) يُرفض في create_link،
           // لذلك نستعمل الرقم المعلوم، وإلا نجرّب المفتاح كما هو (نفس ترتيب كود Java).
           val nRaw = if (num > 0) num.toString() else sid.substringAfterLast(":").trim()
           val nVal: Any = nRaw.toIntOrNull() ?: if (nRaw.isBlank()) "1" else nRaw
           j.put("series_id", sVal)
           j.put("season_num", nVal)
           j.put("type", "series")
           return android.util.Base64.encodeToString(j.toString().toByteArray(Charsets.UTF_8), android.util.Base64.NO_WRAP)
         }

         /** يبحث عن أمر الحلقة (cmd) من قوائم السيرفر — آخر حلقة في سلسلة التشغيل. */
         fun episodeCmd(seriesId: String, seasonId: String, epId: String): String {
           val out = ArrayList<Channel>()
           seasonEpisodes(seriesId, seasonId, out)
           if (out.isEmpty()) return ""
           if (epId.isNotBlank()) {
             val hit = out.firstOrNull { it.id == epId }
             if (hit != null && hit.url.isNotBlank()) return hit.url
             val num = epId.replace(Regex("\\D"), "")
             if (num.isNotBlank()) {
               val byNum = out.firstOrNull { it.name.contains(num) && it.url.isNotBlank() }
               if (byNum != null) return byNum.url
             }
           }
           val any = out.firstOrNull { it.url.isNotBlank() }
           return any?.url ?: ""
         }

         /**
         * رابط التشغيل الفعلي (الضغط = تشغيل مباشر):
         *   1) create_link بأمر البوابة — دائمًا، لأن أمر البوابة (cmd) يمرّ عبر
         *      مسارها (مثل http://localhost/ch/12_) ولا يُشغَّل مباشرة، حتى لو بدا رابطًا كاملًا.
         *   2) الحلقات بلا أمر: create_link بأمر base64 {"series_id","season_num","type":"series"}
         *      (+ &series=<episode_id>) — نفس دالة MAC Portal في كود Java.
         *   3) الحلقات: نجلب أمر الحلقة من السيرفر ثم نعيد create_link.
         *   4) آخر حل: أمر يبدو مباشرًا (http/rtsp/udp/rtmp) → يُعاد كما هو.
         *   5) فشل الجميع → "" مع رسالة واضحة (بدل تشغيل شيء خاطئ).
         */
         /**
         * (8.21) **أوامر** create_link الممكنة بالترتيب — بلا شبكة (تُبنى فورًا).
         * المشغّل ينفّذ الواحد فالواحد حتى ينجح أحدها ⇒ لا تجمّد ولا شاشة فاضية.
         */
         fun playQueries(kind: String, cmd: String, mid: String = "", sid: String = "",
                 epId: String = "", snum: Int = 0, seasonName: String = ""): ArrayList<String> {
           val out = ArrayList<String>()
           val c0 = cleanCmd(cmd)
           val isEp = kind == "episode"

           if (isEp) {
             // (8.34) الحلقات — صيغة كود Java بالحرف: base64 {"series_id":رقم,"season_num":رقم,"type":"series"}
             //        + &series=<رقم الحلقة>، والنوع vod أولًا (مثبت على البوابة أن series يعطي رابطًا ميتًا).
             val nums = ArrayList<Int>()
             if (snum > 0) nums.add(snum)
             val fromName = Regex("(?i)(?:موسم|season)\\s*0*(\\d{1,3})").find(seasonName)?.groupValues?.get(1)?.toIntOrNull()
             if (fromName != null && fromName > 0 && fromName != snum) nums.add(fromName)
             if (nums.isEmpty()) nums.add(1)
             val msgSid = if (mid.isNotBlank()) mid else epId
             val epNum = firstNum(epId)
             for (n in nums) {
               val b64 = seriesCmd(msgSid, sid, n)
               for (t in arrayOf("vod", "series")) {
                 var q = "type=$t&action=create_link&cmd=" + Uri.encode(b64) + "&js_price=0&forced_country="
                 if (epNum.isNotBlank()) q += "&series=" + Uri.encode(epNum)
                 addQuery(out, q)
               }
             }
             // أمر الحلقة base64 كما ترسله البوابة (لو موجود) — نوع vod فقط
             if (c0.isNotBlank() && !c0.startsWith("http") && c0.length > 24)
               addQuery(out, "type=vod&action=create_link&cmd=" + Uri.encode(c0) + "&js_price=0&forced_country=")
           }

           // (8.31) **المباشر — نفس مسار التطبيق القديم**:
           //   أ) الرابط الجاهز من البوابة (فيه play_token حيّ) يُشغَّل فورًا — بلا create_link.
           //   ب) رابط بلا توكن (كاش قديم) أو أمره ليس رابطًا ⇒ create_link بصيغة MAG http://localhost/ch/<id>_.
           //   ولا نُرسل أبدًا رابطًا بتوكن قديم لـ create_link (البوابة ترد stream= فارغًا ⇒ رابط ميت).
           // (8.34) المباشر — نفس مسار التطبيق القديم (كان يخدم): رابط جاهز بتوكن حيّ يُشغَّل فورًا،
           //        وإلا أمر MAG حقيقي من المعرّف الرقمي عبر create_link.
           if (kind == "live") {
             if (c0.startsWith("http") && !isPortalPlayUrl(c0)) addQuery(out, done(c0))
             val lvId = liveStreamId(mid, c0)
             val lvMag = if (lvId.isNotBlank()) "http://localhost/ch/" + lvId + "_" else ""
             if (lvMag.isNotBlank()) for (t in arrayOf("itv", "vod"))
               addQuery(out, "type=$t&action=create_link&cmd=" + Uri.encode(lvMag) + "&js_price=0&forced_country=")
             if (c0.isNotBlank() && !c0.startsWith("http"))
               addQuery(out, "type=itv&action=create_link&cmd=" + Uri.encode(c0) + "&js_price=0&forced_country=")
           }

           // (8.34) الأفلام — type=vod فقط (itv/series كانا يرجّعان بثًّا فارغًا 405).
           if (kind != "live" && !isEp) {
             // أ) أمر البوابة (base64) كما هو — مثبت: يرجع رابطًا سليمًا
             if (c0.isNotBlank() && !c0.startsWith("http") && c0.length > 24)
               addQuery(out, "type=vod&action=create_link&cmd=" + Uri.encode(c0) + "&js_price=0&forced_country=")
             // ب) فلم بلا أمر (أو أمر غالط): نبني الأمر بأنفسنا من المعرّف الرقمي — مثبت على البوابة
             val vid = firstNum(mid, epId)
             if (vid.isNotBlank()) for (ext in arrayOf("mp4", "mkv"))
               addQuery(out, "type=vod&action=create_link&cmd=" + Uri.encode(movieCmd(vid, ext)) + "&js_price=0&forced_country=")
           }
           // (5) **مهم للقنوات**: الأمر كما هو — لو كان رابطًا (حتى `http://localhost/ch/12_`) نصلّح
           //     المضيف ونشغّله مباشرة. هذا هو مسار «القناة تشتغل» الذي كان في 8.20 وضاع في 8.21.
           val rawU = done(c0)
           // (8.31) رابط بوابة بلا توكن = ميت (511) ⇒ ما نضيّعوش وقت المشغّل فيه
           val rawDead = isPortalPlayUrl(rawU) && !hasToken(rawU)
           if (!rawDead && (rawU.startsWith("http://") || rawU.startsWith("https://") || rawU.startsWith("rtsp://") ||
             rawU.startsWith("udp://") || rawU.startsWith("rtmp") || rawU.startsWith("mms"))) {
             addQuery(out, rawU)
           }
           // (8.34) حارس أخير للمباشر: رابط MAG الداخلي من المعرّف الرقمي (يُصلَّح المضيف في done)
           if (kind == "live") {
             val lvId2 = liveStreamId(mid, c0)
             val magU = if (lvId2.isNotBlank()) "http://localhost/ch/" + lvId2 + "_" else ""
             if (magU.isNotBlank() && magU != rawU) addQuery(out, magU)
           }

           if (out.size > 26) { val cut = ArrayList(out.subList(0, 26)); return cut }
           return out
         }

         /** يُضيف أمرًا إن لم يكن مكرّرًا. */
         private fun addQuery(out: ArrayList<String>, q: String) {
           if (q.isNotBlank() && !out.contains(q)) out.add(q)
         }

         /** يُنفّذ أمرًا واحدًا ويُرجع الرابط (أو "" عند الفشل). */
         fun resolveQuery(q: String): String {
           return try {
             // مرشّح رابط جاهز (بلا create_link)؟ يُشغّل كما هو
             if (q.startsWith("http://") || q.startsWith("https://") || q.startsWith("rtsp://") ||
               q.startsWith("udp://") || q.startsWith("rtmp") || q.startsWith("mms")) return done(q)
             val r = req(q) ?: return ""
             diagEps(q)
             var u = done(urlFrom(r))
             if (brokenLink(u)) u = ""          // (8.31) stream= فارغ ⇒ رابط ميت، نجرّب الموالي
             if (u.isBlank()) {
               // بعض البوابات ترد بأمر داخلي (cmd جديد) ⇒ نعيد create_link به (نفس 8.20)
               val inner = innerCmd(r)
               // (8.34) لا نُرسل أبدًا رابط تشغيل من البوابة كأمر (البوابة ترد stream=. ⇒ رابط ميت)
               if (inner.isNotBlank() && inner != uriQ(q) && !isPortalPlayUrl(inner)) {
                 val t = Regex("type=([a-z]+)").find(q)?.groupValues?.get(1) ?: "vod"
                 val r2 = req("type=$t&action=create_link&cmd=" + Uri.encode(inner) + "&js_price=0&forced_country=")
                 if (r2 != null) {
                   val u2 = done(urlFrom(r2))
                   if (!brokenLink(u2)) u = u2
                 }
               }
             }
             if (brokenLink(u)) {
               Crash.note("PLAY-FIX", "البوابة أرجعت رابطًا ميتًا (stream فارغ) ⇒ نجرّب المصدر الموالي")
               ""
             } else u
           } catch (t: Throwable) { Crash.log(t); "" }
         }

         private fun uriQ(q: String): String = try {
           val raw = Regex("cmd=([^&]*)").find(q)?.groupValues?.get(1) ?: ""
           if (raw.isBlank()) "" else java.net.URLDecoder.decode(raw, "UTF-8")
         } catch (t: Throwable) { "" }

         /**
         * نفس playQueries لكن ينفّذ حتى أول رابط ينجح (للتوافق مع الاستدعاءات القديمة).
         * المشغّل الكبير يستعمل playQueries + resolveQuery ليجرب واحدًا واحدًا بلا تجمّد.
         */
         fun playable(kind: String, cmd: String, mid: String = "", sid: String = "",
               epId: String = "", snum: Int = 0, seasonName: String = ""): String {
           val qs = playQueries(kind, cmd, mid, sid, epId, snum, seasonName)
           for (q in qs) {
             val u = resolveQuery(q)
             if (u.isNotBlank()) return u
           }
           // آخر حل: لو كان الأمر نفسه رابطًا كاملًا نصلّح المضيف ونشغّل
           val c = cleanCmd(cmd)
           if (c.startsWith("http://") || c.startsWith("https://") || c.startsWith("rtsp://") ||
             c.startsWith("udp://") || c.startsWith("rtmp") || c.startsWith("mms")) return done(c)
           lastError = "البوابة رفضت إنشاء رابط تشغيل لهذا العنصر (create_link)"
           return ""
         }

         /**
         * أوامر بعض البوابات تكون `http://localhost/ch/12_` (نفس ما يبنيه جهاز MAG)،
         * فلا تشتغل على الهاتف. نستبدل المضيف بأصل البوابة كما يفعل الجهاز الأصلي.
         */
         fun fixHost(u: String): String {
           if (u.isBlank()) return u
           val l = u.lowercase()
           if (!l.contains("localhost") && !l.contains("127.0.0.1")) return u
           return try {
             val bu = java.net.URI(base)
             val host = bu.host ?: return u
             val port = if (bu.port > 0) ":" + bu.port else ""
             val scheme = if (l.startsWith("https")) "https" else "http"
             val rest = u.substringAfter("://").substringAfter("/", "")
             "$scheme://$host$port/" + rest
           } catch (t: Throwable) { u }
         }

         /** رابط نهائي للمشغّل: نصلّح المضيف لو كان محليًا. */
         private fun done(u: String): String = if (u.isBlank()) "" else fixHost(u).trim()

         /** timeshift للبث المباشر. */
         fun timeshift(cmd: String, hours: Int): String {
           val r = req("type=itv&action=create_link&cmd=" + Uri.encode(cleanCmd(cmd)) +
             "&js_price=0&forced_country=&timeshift=" + (hours * 3600)) ?: return ""
           return done(urlFrom(r))
         }
       }

       /**
       * جلسة البوابة المحفوظة: نفس الكائن (ونفس الـ token والمسار الناجح) يُستعمل
       * في كل طلب → الضغط على القناة يشغّلها فورًا بدل مصافحة جديدة كل مرة.
       */
       object StalkerSession {
         private val cache = HashMap<String, Stalker>()

         private fun key(p: Profile): String = p.type + "|" + p.url + "|" + p.mac

         @Synchronized
         fun get(p: Profile): Stalker {
           val k = key(p)
           var s = cache[k]
           if (s == null) { s = Stalker(p.url, p.mac); cache[k] = s }
           return s
         }

         @Synchronized
         fun peek(p: Profile?): Stalker? = if (p == null) null else cache[key(p)]

         @Synchronized
         fun drop(p: Profile?) {
           if (p != null) cache.remove(key(p))
         }
       }

       /** ما يُحمَّل من السيرفر ويُشارك بين الشاشات. */
       object Catalog {
         val live = ArrayList<Channel>()
         val movie = ArrayList<Channel>()
         val series = ArrayList<Channel>()
         val liveCats = ArrayList<Group>()
         val movieCats = ArrayList<Group>()
         val seriesCats = ArrayList<Group>()
         var profile: Profile? = null
         var source = ""
         var expiry = "-"
         var status = "-"
         var maxLive = 0
         var loaded = false

         /** حالة جلب كل قسم: 0 = لم يُجلب، 1 = جارٍ، 2 = جُلبت كل صفحاته. */
         private val fill = java.util.concurrent.ConcurrentHashMap<String, Int>()
         fun fillState(kind: String, catId: String): Int = fill[kind + "|" + catId] ?: 0
         fun fillSet(kind: String, catId: String, v: Int) { fill[kind + "|" + catId] = v }
         fun fillDone(kind: String, catId: String): Boolean = fillState(kind, catId) == 2
         fun fillBusy(kind: String, catId: String): Boolean = fillState(kind, catId) == 1
         fun fillReset() { fill.clear() }

         /** نص تقدّم الجلب في الخلفية (يظهر في شريط التحميل). */
         @Volatile var bgMsg = ""
         @Volatile var bgRun = false

         /** يعيد ترقيم القنوات المباشرة 1..n. */
         /**
         * نقطة تشغيل موحّدة للواجهة: MAC يمرّ عبر البوابة (create_link)، وغيره يُشغّل مباشرة.
         * مثال الاستدعاء من الواجهة:  Catalog.play(profile, ch) { url -> openPlayer(url) }
         */
         fun play(p: Profile, c: Channel, cb: (String) -> Unit) {
           if (p.type == "mac") Loader.macPlayable(p, c.kind, c.url, c.mid, c.sid, c.id, c.snum, c.group, cb)
           else Bg.ui { cb(c.url) }
         }

         fun numbers() {
           var n = 0
           for (c in live) c.num = ++n
           maxLive = n
         }

         fun clear() {
           live.clear(); movie.clear(); series.clear()
           liveCats.clear(); movieCats.clear(); seriesCats.clear()
           expiry = "-"; status = "-"; loaded = false
           fillReset(); bgMsg = ""
         }
       }

       /** ذراع التحميل: كاش القرص + الشبكة + استرجاع ذكي (SmartLoad). */
       object Loader {
         @Volatile var busy = false
         @Volatile var cancel = false

         /** خيط واحد مستقل للجلب في الخلفية — لا يزاحم تشغيل القنوات (Bg.pool يبقى للضغط). */
         private val bgPool = Executors.newSingleThreadExecutor()
         @Volatile private var bgSeq = 0

         fun cacheFile(ctx: Context, p: Profile) = File(ctx.cacheDir, "pl2/${p.key()}")     // v2 = ملف لكل نوع
         private fun cacheMeta(ctx: Context, p: Profile) = File(ctx.cacheDir, "pl2/${p.key()}.meta")
         private fun cacheKind(ctx: Context, p: Profile, kind: String) = File(ctx.cacheDir, "pl2/${p.key()}.$kind")

         private fun ttl(): Long = 6L * 3600_000L

         /**
         * كتابة قائمة العناصر **متدفقة** (عنصر بعنصر داخل gzip) بلا بناء نص ضخم في الذاكرة.
         * هذه كانت أهمّ أسباب انهيار التطبيق مع البوابات الكبيرة (60 ألف عنصر = نص 40 ميغا).
         */
         private fun writeChans(f: File, list: List<Channel>) {
           try {
             f.parentFile?.mkdirs()
             GZIPOutputStream(BufferedOutputStream(FileOutputStream(f))).use { out ->
               out.write("[".toByteArray(Charsets.UTF_8))
               var first = true
               synchronized(list) {
                 for (c in list) {
                   if (!first) out.write(",".toByteArray(Charsets.UTF_8))
                   out.write(c.toJson().toString().toByteArray(Charsets.UTF_8))
                   first = false
                 }
               }
               out.write("]".toByteArray(Charsets.UTF_8))
             }
           } catch (t: Throwable) { Crash.log(t) }
         }

         private fun readChans(f: File, out: MutableList<Channel>) {
           out.clear()
           if (!f.exists()) return
           try { decodeChans(readGz(f), out) } catch (t: Throwable) { Crash.log(t) }
         }

         private fun cacheOk(ctx: Context, p: Profile): Boolean =
           cacheKind(ctx, p, "live").exists() || cacheKind(ctx, p, "movie").exists() || cacheKind(ctx, p, "series").exists()

         fun load(ctx: Context, p: Profile, force: Boolean, progress: (String) -> Unit, done: (Boolean, String) -> Unit) {
           if (busy) { done(false, "التحميل جارٍ بالفعل"); return }
           busy = true; cancel = false
           Bg.pool.execute {
             var ok = false
             var msg = ""
             try {
               try { File(ctx.cacheDir, "pl/${p.key()}.gz").delete() } catch (t: Throwable) {}   // كاش v1 القديم
               val fm = cacheMeta(ctx, p)
               val age = if (fm.exists()) System.currentTimeMillis() - fm.lastModified() else Long.MAX_VALUE
               if (!force && age < ttl() && cacheOk(ctx, p)) {
                 progress("استرجاع من الذاكرة الذكية…")
                 readChans(cacheKind(ctx, p, "live"), Catalog.live)
                 readChans(cacheKind(ctx, p, "movie"), Catalog.movie)
                 readChans(cacheKind(ctx, p, "series"), Catalog.series)
                 val meta = try { readGz(fm) } catch (t: Throwable) { null }
                 if (!meta.isNullOrBlank()) {
                   val o = JSONObject(meta)
                   decodeGroups(o.optString("liveCats"), Catalog.liveCats)
                   decodeGroups(o.optString("movieCats"), Catalog.movieCats)
                   decodeGroups(o.optString("seriesCats"), Catalog.seriesCats)
                   Catalog.expiry = o.optString("expiry", "-")
                   Catalog.status = o.optString("status", "-")
                   Catalog.source = o.optString("source", p.type)
                 }
                 Catalog.profile = p
                 Catalog.loaded = true
                 Catalog.numbers()
                 ok = Catalog.live.size + Catalog.movie.size + Catalog.series.size > 0
                 msg = "من الكاش (${Catalog.live.size} قناة • ${Catalog.movie.size} فيلم • ${Catalog.series.size} مسلسل)"
                 // كاش ناقص (قنوات فقط مثلًا) → نكمل الباقي في الخلفية
                 if (p.type == "mac" && (Catalog.movie.isEmpty() || Catalog.series.isEmpty()) &&
                   Catalog.movieCats.size + Catalog.seriesCats.size > 0) {
                   bgFillAll(ctx, p)
                 }
               }
               if (!ok) {
                 progress("جاري الاتصال بالسيرفر…")
                 when (p.type) {
                   "xtream" -> loadXtream(p, progress)
                   "mac" -> loadMac(ctx, p, progress)
                   else -> loadM3u(p, progress)
                 }
                 if (cancel) throw InterruptedException("ألغيت العملية")
                 Catalog.profile = p
                 Catalog.source = p.type
                 Catalog.loaded = true
                 Catalog.numbers()
                 writeChans(cacheKind(ctx, p, "live"), Catalog.live)
                 if (p.type != "mac") {
                   writeChans(cacheKind(ctx, p, "movie"), Catalog.movie)
                   writeChans(cacheKind(ctx, p, "series"), Catalog.series)
                 }
                 writeMeta(ctx, p)
                 ok = true
                 msg = "تم التحديث"
               }
             } catch (t: Throwable) {
               Crash.log(t)
               msg = when (t) {
                 is InterruptedException -> "تم الإلغاء"
                 else -> "خطأ: " + (t.message ?: t.javaClass.simpleName)
               }
               ok = false
             }
             busy = false
             Bg.ui { done(ok, msg) }
           }
         }

         private fun loadM3u(p: Profile, progress: (String) -> Unit) {
           progress("تنزيل القائمة M3U…")
           val text = Http.read(p.url)
           progress("تحليل ${text.length / 1024} ك.ب…")
           M3u.parse(text, Catalog.live, Catalog.movie, Catalog.series)
           Catalog.liveCats.clear()
           Catalog.liveCats.addAll(Catalog.live.groupBy { it.group }.map { Group().apply { name = it.key; count = it.value.size } }.sortedBy { it.name.lowercase() })
           Catalog.movieCats.clear()
           Catalog.movieCats.addAll(Catalog.movie.groupBy { it.group }.map { Group().apply { name = it.key; count = it.value.size } })
           Catalog.seriesCats.clear()
           Catalog.seriesCats.addAll(Catalog.series.groupBy { it.group }.map { Group().apply { name = it.key; count = it.value.size } }.sortedBy { it.name.lowercase() })
         }

         private fun loadXtream(p: Profile, progress: (String) -> Unit) {
           val x = Xtream(p.url, p.user, p.pass)
           progress("التحقق من الحساب…")
           try {
             val ui = Xtream.userInfo(Http.read(x.urlAuth()))
             if (ui != null) {
               Catalog.status = ui.optString("status", "-")
               Catalog.expiry = Expiry.human(ui.optString("exp_date"))
             }
           } catch (t: Throwable) { throw t }
           progress("البث المباشر…")
           val lc = Xtream.cats(Http.read(x.urlLiveCats()))
           Catalog.liveCats.clear(); Catalog.liveCats.addAll(lc)
           Catalog.live.clear()
           Xtream.parseStreams(Http.read(x.urlLiveStreams()), lc, "live", x, Catalog.live)
           progress("الأفلام…")
           val vc = Xtream.cats(Http.read(x.urlVodCats()))
           Catalog.movieCats.clear(); Catalog.movieCats.addAll(vc)
           Catalog.movie.clear()
           Xtream.parseStreams(Http.read(x.urlVodStreams()), vc, "movie", x, Catalog.movie)
           progress("المسلسلات…")
           val sc = Xtream.cats(Http.read(x.urlSerCats()))
           Catalog.seriesCats.clear(); Catalog.seriesCats.addAll(sc)
           Catalog.series.clear()
           Xtream.parseStreams(Http.read(x.urlSeries()), sc, "series", x, Catalog.series)
           for (g in Catalog.movieCats) g.count = Catalog.movie.count { it.group == g.name }
           for (g in Catalog.seriesCats) g.count = Catalog.series.count { it.group == g.name }
           for (g in Catalog.liveCats) g.count = Catalog.live.count { it.group == g.name }
         }

         /** عمق الجلب (يبقى للتوافق): 0 = صفحة 1، 1 = 6، 2 = 20، وإلا كل الصفحات. */
         fun depth(ctx: Context): Int = when (ctx.sp.s("mac_depth", "3").toIntOrNull() ?: 3) {
           0 -> 1
           1 -> 6
           2 -> 20
           else -> 400
         }

         /**
         * تحميل بوابة MAC — مسار سريع بلا انتظار:
         *   1) مصافحة البوابة (StalkerSession: نفس التوكن) — ثوانٍ
         *   2) أقسام البث + الأفلام + المسلسلات
         *   3) قنوات البث المباشر
         * ثم يبدأ جلب الأفلام والمسلسلات **في الخلفية** (كل قسم بكل صفحاته) دون تجميد الواجهة.
         */
         private fun loadMac(ctx: Context, p: Profile, progress: (String) -> Unit) {
           val st = StalkerSession.get(p)
           progress("مصافحة البوابة…")
           if (!st.connect()) throw java.io.IOException(st.lastError.ifBlank { "تعذّر الاتصال بالبوابة" })
           if (st.mac.isBlank()) throw java.io.IOException("MAC غير صحيح")
           progress("أقسام البث والأفلام والمسلسلات…")
           Catalog.liveCats.clear(); Catalog.liveCats.addAll(st.liveCategories())
           Catalog.movieCats.clear(); Catalog.movieCats.addAll(st.categories("vod"))
           Catalog.seriesCats.clear(); Catalog.seriesCats.addAll(st.categories("series"))
           progress("قنوات البث المباشر…")
           st.channels(Catalog.live)
           Catalog.expiry = if (st.accountStatus.isBlank()) Catalog.expiry else ("حالة الحساب: " + st.accountStatus)
           Catalog.fillReset()
           Catalog.status = "${Catalog.live.size} قناة • ${Catalog.movieCats.size} قسم أفلام • ${Catalog.seriesCats.size} قسم مسلسلات"
           bgFillAll(ctx, p)
         }

         /** يبدأ الجلب الكامل في الخلفية (يُستدعى من التحميل أو من الكاش). */
         fun startBg(ctx: Context, p: Profile) { bgFillAll(ctx, p) }

         /** يضيف عناصر قسم للمحلي بلا تكرار + يحدّث عدّاد القسم. */
         fun appendCat(kind: String, catId: String, catName: String, items: List<Channel>): Int {
           if (items.isEmpty()) return 0
           val cat = if (kind == "movie") Catalog.movie else Catalog.series
           var added = 0
           synchronized(cat) {
             val seen = HashSet<String>()
             for (c in cat) seen.add(c.id + "|" + c.url)
             for (c in items) {
               if (c.name.isBlank()) continue
               if (seen.add(c.id + "|" + c.url)) { cat.add(c); added++ }
             }
             for (i in cat.indices) cat[i].num = i + 1
           }
           val gs = if (kind == "movie") Catalog.movieCats else Catalog.seriesCats
           gs.firstOrNull { it.catId == catId }?.count = cat.count { it.catId == catId }
           return added
         }

         /**
         * الجلب الكامل في الخلفية: كل الأقسام (أفلام ثم مسلسلات)، كل صفحة في كل قسم،
         * مع إخطار الواجهة كل قسمين حتى ترى العناصر تظهر تباعًا.
         */
         private fun bgFillAll(ctx: Context, p: Profile) {
           val mySeq = ++bgSeq
           Catalog.bgRun = true
           bgPool.execute {
             try {
               val st = StalkerSession.get(p)
               if (!st.connect()) { Catalog.bgMsg = st.lastError; Catalog.bgRun = false; return@execute }
               val plan = ArrayList<Pair<String, Group>>()
               for (g in ArrayList(Catalog.movieCats)) plan.add("movie" to g)
               for (g in ArrayList(Catalog.seriesCats)) plan.add("series" to g)
               var n = 0
               for (pr in plan) {
                 if (mySeq != bgSeq || cancel) break
                 if (Catalog.movie.size + Catalog.series.size >= 80_000) break   // سقف ذاكرة
                 val kind = pr.first; val g = pr.second
                 if (g.catId.isBlank() || Catalog.fillState(kind, g.catId) != 0) { n++; continue }
                 Catalog.fillSet(kind, g.catId, 1)
                 val tmp = ArrayList<Channel>()
                 try { st.fillCat(kind, g.catId, g.name, 400, tmp) } catch (t: Throwable) { Crash.log(t) }
                 appendCat(kind, g.catId, g.name, tmp)
                 Catalog.fillSet(kind, g.catId, 2)
                 n++
                 Catalog.bgMsg = "$n/${plan.size} قسم • ${Catalog.movie.size} فيلم • ${Catalog.series.size} مسلسل"
                 Catalog.status = "${Catalog.live.size} قناة • ${Catalog.movie.size} فيلم • ${Catalog.series.size} مسلسل"
                 if (n % 2 == 0) {
                   Events.send(ctx, "catalog")
                   try { Thread.sleep(120) } catch (e: Throwable) {}
                 }
               }
               Catalog.status = "${Catalog.live.size} قناة • ${Catalog.movie.size} فيلم • ${Catalog.series.size} مسلسل"
               saveCache(ctx, p)
               Events.send(ctx, "catalog")
             } catch (t: Throwable) { Crash.log(t) }
             Catalog.bgRun = false
           }
         }

         /** ملف الوصف (أقسام/حالة/انتهاء) — صغير جدًا. */
         private fun writeMeta(ctx: Context, p: Profile) {
           try {
             val o = JSONObject()
             o.put("liveCats", encodeGroups(Catalog.liveCats))
             o.put("movieCats", encodeGroups(Catalog.movieCats))
             o.put("seriesCats", encodeGroups(Catalog.seriesCats))
             o.put("expiry", Catalog.expiry)
             o.put("status", Catalog.status)
             o.put("source", p.type)
             o.put("v", 2)
             cacheMeta(ctx, p).parentFile?.mkdirs()
             writeGz(cacheMeta(ctx, p), o.toString())
           } catch (t: Throwable) { Crash.log(t) }
         }

         /** يحفظ القوائم الحالية (بعد الجلب الخلفي) حتى لا تُعاد من الصفر — كتابة متدفقة. */
         private fun saveCache(ctx: Context, p: Profile) {
           writeChans(cacheKind(ctx, p, "live"), Catalog.live)
           writeChans(cacheKind(ctx, p, "movie"), Catalog.movie)
           writeChans(cacheKind(ctx, p, "series"), Catalog.series)
           writeMeta(ctx, p)
         }

         /** جلب صفحة واحدة من قسم (عند البحث على السيرفر). */
         fun macPage(p: Profile, kind: String, catId: String, page: Int, search: String, out: MutableList<Channel>, cb: (Int, Int) -> Unit) {
           Bg.pool.execute {
             var n = 0
             try {
               val st = StalkerSession.get(p)
               if (st.connect()) {
                 val type = if (kind == "movie") "vod" else "series"
                 val r = st.page(type, catId, page, search)
                 if (r != null) {
                   val arr = st.itemsOf(r)
                   for (i in 0 until arr.length()) {
                     val o = arr.optJSONObject(i) ?: continue
                     val c = Channel()
                     c.kind = kind
                     c.num = out.size + i + 1
                     c.name = o.optString("name", o.optString("title"))
                     c.id = o.optString("id", o.optString("series_id"))
                     c.url = st.cleanCmd(o.optString("cmd", o.optString("media_url")))
                     c.logo = o.optString("screenshot_uri", o.optString("cover"))
                     c.catId = catId
                     c.stype = kind
                     c.extra = o.optString("year")
                     if (c.name.isNotBlank()) out.add(c)
                   }
                 }
                 n = out.size
               } else Catalog.status = st.lastError
             } catch (t: Throwable) { Crash.log(t) }
             val fn = n
             Bg.ui { cb(fn, 1) }
           }
         }

         /** جلب قسم واحد من السيرفر (يُستعمل حين يكون القسم فاضيًا في الذاكرة). */
         fun macFillCat(ctx: Context, p: Profile, kind: String, catId: String, catName: String, out: MutableList<Channel>, cb: (Int) -> Unit) {
           Bg.pool.execute {
             var n = 0
             try {
               if (Catalog.fillState(kind, catId) == 0) Catalog.fillSet(kind, catId, 1)
               val st = StalkerSession.get(p)
               if (st.connect()) n = st.fillCat(kind, catId, catName, 400, out)   // 400 = كل صفحات القسم
               else Catalog.status = st.lastError
               Catalog.fillSet(kind, catId, 2)
             } catch (t: Throwable) { Crash.log(t) }
             val fn = n
             Bg.ui { cb(fn) }
           }
         }

         /** شجرة مسلسل: مواسم + حلقات. */
         /**
         * (8.19) جلب حلقات المواسم في الخلفية — نفس ما يفعله كود Java بعد إنشاء كل مجلد موسم
         * (`fetchStalkerEpisodes` فورًا) ⇒ الضغط على الموسم يعرض الحلقات فورًا وبلا فشل.
         */
         fun prefetchEps(p: Profile, seasons: List<Channel>, onEach: ((Channel, Int) -> Unit)? = null) {
           if (seasons.isEmpty()) return
           Bg.pool.execute {
             try {
               val st = StalkerSession.get(p)
               if (!st.connect()) return@execute
               var done = 0
               for (s in seasons) {
                 if (done >= 30) break
                 if (s.mid.isBlank() || st.hasCachedEps(s.mid, s.sid)) continue
                 val tmp = ArrayList<Channel>()
                 val n = try { st.seasonEpisodes(s.mid, s.sid, tmp) } catch (t: Throwable) { 0 }
                 done++
                 if (n > 0 && onEach != null) { val ss = s; val nn = n; Bg.ui { onEach(ss, nn) } }
               }
             } catch (t: Throwable) { Crash.log(t) }
           }
         }

         fun macSeries(p: Profile, seriesId: String, name: String, genre: String, cover: String, out: MutableList<Channel>, cb: (Int) -> Unit) {
           Bg.pool.execute {
             var n = 0
             try {
               val st = StalkerSession.get(p)
               if (st.connect()) n = st.seriesTree(seriesId, genre, cover, out)
               else Catalog.status = st.lastError
             } catch (t: Throwable) { Crash.log(t) }
             val fn = n
             Bg.ui { cb(fn) }
             try { prefetchEps(p, out.filter { it.kind == "season" || it.stype == "season" }) } catch (t: Throwable) {}
           }
         }

         /** حلقات موسم محدد. */
         fun macSeason(p: Profile, seriesId: String, seasonId: String, out: MutableList<Channel>, cb: (Int) -> Unit) {
           Bg.pool.execute {
             var n = 0
             try {
               val st = StalkerSession.get(p)
               if (st.connect()) n = st.seasonEpisodes(seriesId, seasonId, out)
               else Catalog.status = st.lastError
             } catch (t: Throwable) { Crash.log(t) }
             val fn = n
             Bg.ui { cb(fn) }
           }
         }

         /**
         * الضغط = تشغيل: يحوّل cmd البوابة إلى رابط HTTP عبر الجلسة المحفوظة.
         * يرجع "" عند الفشل (فتظهر رسالة واضحة بدل تشغيل شيء خاطئ).
         */
         fun macPlayable(p: Profile, kind: String, cmd: String, mid: String = "", sid: String = "",
                 epId: String = "", snum: Int = 0, seasonName: String = "", cb: (String) -> Unit) {
           // ملاحظة مهمة: أمر البوابة (cmd) قد يبدو رابطًا كاملًا لكنه يمرّ عبر مسار البوابة،
           // لذلك لا نُعيده كما هو — بل نحوّله عبر create_link (نفس سلوك دالة Java) ثم نُشغّل.
           Bg.pool.execute {
             var u = ""
             try {
               // أمر البوابة فارغ؟ نبنيه من المعرّف بصيغة MAG (http://localhost/ch/<id>_) ثم create_link
               var cmd0 = cmd
               if (cmd0.isBlank()) cmd0 = Stalker.localCmd(if (epId.isNotBlank()) epId else if (mid.isNotBlank()) mid else "")
               val st = StalkerSession.get(p)
               if (st.connect()) u = st.playable(kind, cmd0, mid, sid, epId, snum, seasonName)
               else Catalog.status = st.lastError
             } catch (t: Throwable) { Crash.log(t) }
             val fu = u
             Bg.ui { cb(fu) }
           }
         }

         /** (8.21) أوامر التشغيل الممكنة (بلا شبكة) — المشغّل ينفّذها واحدًا واحدًا حتى ينجح أحدها. */
         fun macPlayQueries(p: Profile, c: Channel, cb: (ArrayList<String>) -> Unit) {
           Bg.pool.execute {
             val out = ArrayList<String>()
             try {
               val st = StalkerSession.get(p)
               if (st.connect()) out.addAll(st.playQueries(c.kind, c.url, c.mid, c.sid, c.id, c.snum, c.group))
               else Catalog.status = st.lastError
             } catch (t: Throwable) { Crash.log(t) }
             Bg.ui { cb(out) }
           }
         }

         /** (8.21) يُنفّذ أمرًا واحدًا ويُرجع الرابط ("" عند الفشل). */
         fun macResolveQuery(p: Profile, q: String, cb: (String) -> Unit) {
           Bg.pool.execute {
             var u = ""
             try {
               val st = StalkerSession.get(p)
               if (st.connect()) u = st.resolveQuery(q) else Catalog.status = st.lastError
             } catch (t: Throwable) { Crash.log(t) }
             val fu = u
             Bg.ui { cb(fu) }
           }
         }

         /** نفس الدالة لكن تأخذ القناة نفسها (لأي استدعاء من الواجهة). */
         fun macPlayable(p: Profile, c: Channel, cb: (String) -> Unit) =
           macPlayable(p, c.kind, c.url, c.mid, c.sid, c.id, c.snum, c.group, cb)   // group الحلقة = اسم الموسم

         /** رابط القبض (timeshift) لبوابات MAC. */
         fun macTimeshift(p: Profile, cmd: String, hours: Int, cb: (String) -> Unit) {
           Bg.pool.execute {
             var u = ""
             try {
               val st = StalkerSession.get(p)
               if (st.connect()) u = st.timeshift(cmd, hours)
             } catch (t: Throwable) { Crash.log(t) }
             val fu = u
             Bg.ui { cb(fu) }
           }
         }

         fun xtreamEpisodes(p: Profile, seriesId: String, out: MutableList<Channel>, cb: (Int) -> Unit) {
           Bg.pool.execute {
             var n = 0
             try {
               val x = Xtream(p.url, p.user, p.pass)
               n = Xtream.parseEpisodes(Http.read(x.urlSeriesInfo(seriesId)), x, out)
             } catch (t: Throwable) { Crash.log(t) }
             Bg.ui { cb(n) }
           }
         }

         fun encodeGroups(list: List<Group>): String {
           val a = JSONArray()
           for (g in list) a.put(JSONObject().put("name", g.name).put("count", g.count).put("catId", g.catId))
           return a.toString()
         }

         fun decodeGroups(text: String?, out: MutableList<Group>) {
           out.clear()
           if (text.isNullOrEmpty()) return
           try {
             val a = JSONArray(text)
             for (i in 0 until a.length()) {
               val o = a.getJSONObject(i)
               out.add(Group().apply { name = o.optString("name"); count = o.optInt("count"); catId = o.optString("catId") })
             }
           } catch (t: Throwable) {}
         }
       }

       /** فهم صيغ الانتهاء المختلفة (ثواني، ميلي ثانية، yyyy-MM-dd، dd/MM/yyyy، null). */
       object Expiry {
         fun human(v: String?): String {
           if (v.isNullOrBlank()) return "غير محدد"
           val s = v.trim()
           if (s == "null" || s.equals("never", true) || s == "0") return "بدون انتهاء"
           s.toLongOrNull()?.let { n ->
             if (n > 0) {
               val ms = if (n < 10_000_000_000L) n * 1000 else n
               return fmtDate(ms) + " (" + daysLeft(ms) + ")"
             }
           }
           for (pat in listOf("yyyy-MM-dd", "yyyy/MM/dd", "dd/MM/yyyy", "dd-MM-yyyy", "MM/dd/yyyy", "yyyy-MM-dd HH:mm:ss")) {
             try {
               val d = java.text.SimpleDateFormat(pat, java.util.Locale.US).parse(s)
               if (d != null) return fmtDate(d.time) + " (" + daysLeft(d.time) + ")"
             } catch (t: Throwable) {}
           }
           return s
         }

         fun expired(v: String?): Boolean {
           if (v.isNullOrBlank()) return false
           val s = v.trim()
           if (s == "null" || s.equals("never", true)) return false
           s.toLongOrNull()?.let { n ->
             if (n > 0) {
               val ms = if (n < 10_000_000_000L) n * 1000 else n
               return ms < System.currentTimeMillis()
             }
           }
           for (pat in listOf("yyyy-MM-dd", "yyyy/MM/dd", "dd/MM/yyyy", "dd-MM-yyyy", "MM/dd/yyyy", "yyyy-MM-dd HH:mm:ss")) {
             try {
               val d = java.text.SimpleDateFormat(pat, java.util.Locale.US).parse(s)
               if (d != null) return d.time + 86_400_000L < System.currentTimeMillis()
             } catch (t: Throwable) {}
           }
           return false
         }

         private fun daysLeft(ms: Long): String {
           val d = (ms - System.currentTimeMillis()) / 86_400_000L
           return when {
             d < 0 -> "منتهٍ"
             d == 0L -> "ينتهي اليوم"
             else -> "بقي $d يوم"
           }
         }

         private fun fmtDate(ms: Long): String =
           java.text.SimpleDateFormat("yyyy-MM-dd", java.util.Locale.US).format(java.util.Date(ms))
       }
