          cat > app/src/main/java/com/nova/play/M3uClient.kt <<'NOVA_EOF'
          package com.nova.play

          import android.content.Context
          import android.os.Handler
          import android.os.Looper
          import com.android.volley.DefaultRetryPolicy
          import com.android.volley.Request
          import com.android.volley.Response
          import com.android.volley.toolbox.StringRequest

          /**
           * قراءة قائمة M3U من رابط مباشر (بدون Xtream).
           */
          class M3uClient(private val ctx: Context) {

              private val main = Handler(Looper.getMainLooper())

              fun load(server: Server, kind: String, cb: XtreamClient.Callback) {
                  val url = server.fullM3uUrl()
                  if (url.isEmpty()) {
                      cb.onError(ctx.getString(R.string.bad_url))
                      return
                  }
                  val req = object : StringRequest(Request.Method.GET, url,
                      Response.Listener { text ->
                          Thread {
                              val all = parse(text)
                              val filtered = ArrayList<Channel>()
                              for (c in all) if (c.kind == kind) filtered.add(c)
                              main.post { cb.onDone(filtered) }
                          }.start()
                      },
                      Response.ErrorListener { e -> cb.onError(e.message ?: "network error") }) {
                  }
                  req.setRetryPolicy(DefaultRetryPolicy(45000, 1, 1f))
                  Net.add(ctx, req)
              }

              fun test(server: Server, done: (Boolean, String) -> Unit) {
                  val url = server.fullM3uUrl()
                  if (url.isEmpty()) {
                      done(false, ctx.getString(R.string.bad_url))
                      return
                  }
                  val req = object : StringRequest(Request.Method.GET, url,
                      Response.Listener { text ->
                          if (text.trimStart().startsWith("#EXTM3U")) {
                              val n = text.split("\n").size
                              done(true, ctx.getString(R.string.srv_ok) + " ($n سطر)")
                          } else {
                              done(false, "الرابط لا يعيد قائمة M3U")
                          }
                      },
                      Response.ErrorListener { e -> done(false, e.message ?: "network error") }) {
                  }
                  req.setRetryPolicy(DefaultRetryPolicy(30000, 1, 1f))
                  Net.add(ctx, req)
              }

              /** تحليل نص M3U إلى قنوات */
              fun parse(text: String): MutableList<Channel> {
                  val out = ArrayList<Channel>()
                  var name = ""
                  var logo = ""
                  var group = "غير مصنّف"
                  var pending = false
                  val lines = text.split("\n")
                  for (raw in lines) {
                      val line = raw.trim()
                      if (line.isEmpty()) continue
                      if (line.startsWith("#EXTINF")) {
                          pending = true
                          name = line.substringAfterLast(",", "").trim()
                          logo = attr(line, "tvg-logo")
                          val g = attr(line, "group-title")
                          if (g.isNotEmpty()) group = g
                      } else if (line.startsWith("#")) {
                          continue
                      } else if (pending) {
                          if (name.isEmpty()) {
                              name = line.substringAfterLast("/").substringBefore("?")
                          }
                          val ch = Channel()
                          ch.name = name
                          ch.logo = logo
                          ch.group = group
                          ch.url = line
                          ch.kind = guessKind(line)
                          ch.ext = line.substringAfterLast(".").substringBefore("?")
                          if (ch.ext.length > 5) ch.ext = "mp4"
                          ch.id = name + "|" + line.hashCode()
                          out.add(ch)
                          name = ""
                          logo = ""
                          pending = false
                      }
                  }
                  return out
              }

              private fun attr(line: String, key: String): String {
                  val i = line.indexOf("$key=\"")
                  if (i < 0) return ""
                  val start = i + key.length + 2
                  val end = line.indexOf('"', start)
                  if (end <= start) return ""
                  return line.substring(start, end)
              }

              private fun guessKind(url: String): String {
                  val u = url.lowercase()
                  if (u.contains("/series/")) return Channel.KIND_SERIES
                  if (u.contains("/movie/") || u.contains("/vod/")) return Channel.KIND_VOD
                  if (u.endsWith(".mp4") || u.endsWith(".mkv") || u.endsWith(".avi") ||
                      u.endsWith(".mov") || u.endsWith(".flv") || u.endsWith(".wmv")) return Channel.KIND_VOD
                  return Channel.KIND_LIVE
              }
          }
          NOVA_EOF

          mkdir -p $(dirname app/src/main/java/com/nova/play/MainActivity.kt)
          cat > app/src/main/java/com/nova/play/MainActivity.kt <<'NOVA_EOF'
          package com.nova.play

          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.view.View
          import android.widget.FrameLayout
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.ProgressBar
          import android.widget.TextView
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity
          import androidx.media3.common.MediaItem
          import androidx.media3.common.MimeTypes
          import androidx.media3.common.PlaybackException
          import androidx.media3.common.Player
          import androidx.media3.exoplayer.DefaultLoadControl
          import androidx.media3.exoplayer.ExoPlayer
          import androidx.media3.ui.PlayerView
          import androidx.recyclerview.widget.LinearLayoutManager
          import androidx.recyclerview.widget.RecyclerView

          /**
           * المشغّل — نفس منطق التطبيق الأصلي:
           * • DefaultLoadControl(3000, 20000, 800, 1500) + backBuffer 2s
           * • Seek ±10 ثوان
           * • mimeType فقط لـ m3u8 / mpd
           * • إعادة محاولة بعد 2000 مللي عند الخطأ
           * • نبضة كل 1000 مللي + مراقب توقف 15 ثانية
           * • حفظ الموضع pos_<url> (أكبر من 10 ثوان، ويُتجاهل قرب النهاية)
           * • تبديل PlayerView صغير/كامل مع setPlayer(null)
           */
          class MainActivity : AppCompatActivity() {

              private lateinit var player: ExoPlayer
              private lateinit var viewSmall: PlayerView
              private lateinit var viewFull: PlayerView
              private lateinit var boxSmall: FrameLayout
              private lateinit var boxList: LinearLayout
              private lateinit var prgPlayer: ProgressBar
              private lateinit var prgBuffer: ProgressBar
              private lateinit var txtTime: TextView
              private lateinit var txtDuration: TextView
              private lateinit var txtTitle: TextView
              private lateinit var txtGroup: TextView
              private lateinit var btnPlay: ImageView
              private lateinit var btnFav: ImageView

              private lateinit var history: HistoryStore
              private lateinit var list: MutableList<Channel>
              private lateinit var listAdapter: ChannelAdapter

              private var index = 0
              private var retryCount = 0
              private var isFull = false
              private var lastPosition = 0L
              private var stallTicks = 0
              private var listVisible = false

              private val handler = Handler(Looper.getMainLooper())

              private val ticker = object : Runnable {
                  override fun run() {
                      updateProgress()
                      checkStall()
                      handler.postDelayed(this, 1000L)
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  history = HistoryStore(this)
                  list = PlaySession.list
                  index = PlaySession.index
                  if (list.isEmpty()) {
                      finish()
                      return
                  }
                  if (index < 0 || index >= list.size) index = 0

                  viewSmall = findViewById(R.id.playerSmall)
                  viewFull = findViewById(R.id.playerFull)
                  boxSmall = findViewById(R.id.boxSmall)
                  boxList = findViewById(R.id.boxList)
                  prgPlayer = findViewById(R.id.prgPlayer)
                  prgBuffer = findViewById(R.id.prgBuffer)
                  txtTime = findViewById(R.id.txtTime)
                  txtDuration = findViewById(R.id.txtDuration)
                  txtTitle = findViewById(R.id.txtTitle)
                  txtGroup = findViewById(R.id.txtGroup)
                  btnPlay = findViewById(R.id.btnPlay)
                  btnFav = findViewById(R.id.btnFav)

                  initPlayer()
                  setupList()
                  setupButtons()

                  playCurrent()
                  handler.postDelayed(ticker, 1000L)
              }

              // ---------------- اللاعب ----------------

              private fun initPlayer() {
                  // media3: خلفية التخزين المؤقت (back buffer) تُضبط هنا
                  val loadControl = DefaultLoadControl.Builder()
                      .setBufferDurationsMs(3000, 20000, 800, 1500)
                      .setBackBuffer(2000, true)
                      .build()

                  player = ExoPlayer.Builder(this)
                      .setLoadControl(loadControl)
                      .setSeekBackIncrementMs(10000L)
                      .setSeekForwardIncrementMs(10000L)
                      .build()

                  player.addListener(object : Player.Listener {
                      override fun onPlaybackStateChanged(playbackState: Int) {
                          // تحديث مؤشري التحميل (الاثنان معاً كما في الأصل)
                          prgBuffer.visibility =
                              if (playbackState == Player.STATE_BUFFERING) View.VISIBLE else View.GONE
                          prgPlayer.visibility =
                              if (playbackState == Player.STATE_READY || playbackState == Player.STATE_ENDED) View.VISIBLE else View.INVISIBLE
                          if (playbackState == Player.STATE_ENDED) next()
                      }

                      override fun onPlayerError(error: PlaybackException) {
                          retryCount++
                          if (retryCount <= 3) {
                              Toast.makeText(this@MainActivity, R.string.player_error, Toast.LENGTH_SHORT).show()
                              handler.postDelayed({ playCurrent() }, 2000L)
                          } else {
                              next()
                          }
                      }

                      override fun onIsPlayingChanged(isPlaying: Boolean) {
                          btnPlay.setImageResource(if (isPlaying) R.drawable.ic_pause else R.drawable.ic_play)
                      }
                  })

                  viewSmall.player = player
              }

              private fun playCurrent() {
                  if (index < 0 || index >= list.size) {
                      finish()
                      return
                  }
                  val ch = list[index]
                  txtTitle.text = ch.name
                  txtGroup.text = ch.group

                  val item = buildMediaItem(ch.url)
                  val saved = history.resume(ch.url)
                  val startAt = if (!ch.isLive() && saved > 10000L) saved else 0L

                  player.setMediaItem(item, startAt)
                  player.prepare()
                  player.playWhenReady = true

                  retryCount = 0
                  stallTicks = 0
                  lastPosition = 0L
                  history.addHistory(ch)
                  updateFavIcon()
                  updateListSelection()
              }

              private fun buildMediaItem(url: String): MediaItem {
                  val b = MediaItem.Builder().setUri(url)
                  val u = url.lowercase()
                  if (u.contains(".m3u8")) {
                      b.setMimeType(MimeTypes.APPLICATION_M3U8)
                  } else if (u.contains(".mpd")) {
                      b.setMimeType(MimeTypes.APPLICATION_MPD)
                  }
                  return b.build()
              }

              private fun next() {
                  if (list.isEmpty()) return
                  index = (index + 1) % list.size
                  playCurrent()
              }

              private fun previous() {
                  if (list.isEmpty()) return
                  index = if (index - 1 < 0) list.size - 1 else index - 1
                  playCurrent()
              }

              // ---------------- النبضة ----------------

              private fun updateProgress() {
                  if (!this::player.isInitialized) return
                  val pos = player.currentPosition
                  val dur = player.duration
                  val hasDur = dur > 0
                  prgPlayer.max = 1000
                  prgPlayer.progress = if (hasDur) ((pos * 1000L) / dur).toInt() else 0
                  txtTime.text = fmt(pos)
                  txtDuration.text = if (hasDur) fmt(dur) else "LIVE"
              }

              private fun checkStall() {
                  if (!this::player.isInitialized) return
                  if (player.isPlaying && player.playbackState == Player.STATE_READY) {
                      val pos = player.currentPosition
                      if (pos == lastPosition) {
                          stallTicks++
                          if (stallTicks >= 15) {
                              stallTicks = 0
                              retryCount = 0
                              playCurrent()
                          }
                      } else {
                          stallTicks = 0
                          lastPosition = pos
                      }
                  } else {
                      stallTicks = 0
                  }
              }

              private fun fmt(ms: Long): String {
                  if (ms <= 0) return "00:00"
                  val total = ms / 1000
                  val h = total / 3600
                  val m = (total % 3600) / 60
                  val s = total % 60
                  return if (h > 0) {
                      String.format("%d:%02d:%02d", h, m, s)
                  } else {
                      String.format("%02d:%02d", m, s)
                  }
              }

              private fun savePosition() {
                  if (!this::player.isInitialized) return
                  if (index < 0 || index >= list.size) return
                  val ch = list[index]
                  if (ch.isLive()) return
                  val pos = player.currentPosition
                  val dur = player.duration
                  if (pos > 10000L && (dur <= 0 || pos < dur - 15000L)) {
                      history.saveResume(ch.url, pos)
                  } else if (dur > 0 && pos >= dur - 15000L) {
                      history.clearResume(ch.url)
                  }
              }

              // ---------------- الواجهة ----------------

              private fun setupList() {
                  val rv = findViewById<RecyclerView>(R.id.rvChannels)
                  rv.layoutManager = LinearLayoutManager(this)
                  listAdapter = ChannelAdapter(this, list, false, history) { pos -> playIndex(pos) }
                  rv.adapter = listAdapter
                  updateListSelection()
              }

              private fun updateListSelection() {
                  listAdapter.notifyDataSetChanged()
              }

              private fun playIndex(pos: Int) {
                  if (pos < 0 || pos >= list.size) return
                  index = pos
                  playCurrent()
              }

              private fun setupButtons() {
                  btnPlay.setOnClickListener {
                      if (player.isPlaying) player.pause() else {
                          if (player.playbackState == Player.STATE_IDLE) playCurrent() else player.play()
                      }
                  }
                  findViewById<ImageView>(R.id.btnRew).setOnClickListener { player.seekBack() }
                  findViewById<ImageView>(R.id.btnFf).setOnClickListener { player.seekForward() }
                  findViewById<ImageView>(R.id.btnPrev).setOnClickListener { previous() }
                  findViewById<ImageView>(R.id.btnNext).setOnClickListener { next() }
                  findViewById<ImageView>(R.id.btnFull).setOnClickListener { toggleFull() }
                  findViewById<ImageView>(R.id.btnList).setOnClickListener { toggleList() }
                  findViewById<ImageView>(R.id.btnExit).setOnClickListener { finish() }
                  btnFav.setOnClickListener {
                      if (index >= 0 && index < list.size) {
                          val nowFav = history.toggleFav(list[index])
                          Toast.makeText(this, if (nowFav) R.string.tab_fav else R.string.srv_deleted, Toast.LENGTH_SHORT).show()
                          updateFavIcon()
                          listAdapter.notifyDataSetChanged()
                      }
                  }
              }

              private fun updateFavIcon() {
                  if (index < 0 || index >= list.size) return
                  val fav = history.isFav(list[index].url)
                  btnFav.setImageResource(if (fav) R.drawable.ic_star else R.drawable.ic_star_border)
              }

              /** تبديل صغير/كامل — مع setPlayer(null) للـ PlayerView غير المستعمل */
              private fun toggleFull() {
                  isFull = !isFull
                  if (isFull) {
                      viewSmall.player = null
                      viewFull.player = player
                      viewFull.visibility = View.VISIBLE
                      boxSmall.visibility = View.GONE
                  } else {
                      viewFull.player = null
                      viewSmall.player = player
                      viewFull.visibility = View.GONE
                      boxSmall.visibility = View.VISIBLE
                  }
              }

              private fun toggleList() {
                  listVisible = !listVisible
                  boxList.visibility = if (listVisible) View.VISIBLE else View.GONE
              }

              // ---------------- الحياة ----------------

              override fun onPause() {
                  savePosition()
                  super.onPause()
              }

              override fun onStop() {
                  savePosition()
                  if (this::player.isInitialized) player.pause()
                  super.onStop()
              }

              override fun onDestroy() {
                  handler.removeCallbacks(ticker)
                  if (this::player.isInitialized) {
                      viewSmall.player = null
                      viewFull.player = null
                      player.release()
                  }
                  super.onDestroy()
              }

              override fun onBackPressed() {
                  if (listVisible) {
                      toggleList()
                      return
                  }
                  if (isFull) {
                      toggleFull()
                      return
                  }
                  savePosition()
                  super.onBackPressed()
              }
          }
          NOVA_EOF

          mkdir -p $(dirname app/src/main/java/com/nova/play/MemoryManager.kt)
          cat > app/src/main/java/com/nova/play/MemoryManager.kt <<'NOVA_EOF'
          package com.nova.play

          import android.content.Context
          import android.os.Handler
          import android.os.Looper
          import android.os.StatFs
          import java.io.File

          /**
           * مدير الذاكرة: تنظيف الكاش كل 10 دقائق — مع الحفاظ على ملف التحديث.
           */
          class MemoryManager(private val ctx: Context) {

              private val handler = Handler(Looper.getMainLooper())

              private val task = object : Runnable {
                  override fun run() {
                      try {
                          clean()
                      } catch (_: Throwable) {
                      }
                      handler.postDelayed(this, INTERVAL_MS)
                  }
              }

              fun start() {
                  handler.removeCallbacks(task)
                  handler.postDelayed(task, INTERVAL_MS)
              }

              fun stop() {
                  handler.removeCallbacks(task)
              }

              /** ينظّف الكاش الداخلي والخارجي ولا يحذف ملف التحديث */
              fun clean() {
                  val dirs = ArrayList<File>()
                  ctx.cacheDir?.let { dirs.add(it) }
                  ctx.externalCacheDir?.let { dirs.add(it) }
                  for (d in dirs) {
                      val files = d.listFiles() ?: continue
                      for (f in files) {
                          if (f.name == Config.UPDATE_FILE) continue
                          try {
                              if (f.isDirectory) f.deleteRecursively() else f.delete()
                          } catch (_: Throwable) {
                          }
                      }
                  }
              }

              /** مساحة خالية بالميغابايت */
              fun freeMb(): Long {
                  return try {
                      val st = StatFs(ctx.filesDir.absolutePath)
                      (st.availableBlocksLong / (1024L * 1024L)) * st.blockSizeLong
                  } catch (e: Exception) {
                      0L
                  }
              }

              companion object {
                  const val INTERVAL_MS = 10L * 60L * 1000L
              }
          }
          NOVA_EOF

          mkdir -p $(dirname app/src/main/java/com/nova/play/Net.kt)
          cat > app/src/main/java/com/nova/play/Net.kt <<'NOVA_EOF'
          package com.nova.play

          import android.content.Context
          import com.android.volley.DefaultRetryPolicy
          import com.android.volley.Request
          import com.android.volley.RequestQueue
          import com.android.volley.toolbox.BasicNetwork
          import com.android.volley.toolbox.HurlStack
          import com.android.volley.toolbox.NoCache

          /**
           * طابور الشبكة — نفس فلسفة التطبيق الأصلي:
           * NoCache + BasicNetwork(HurlStack) + 6 خيوط + وسم موحّد للإلغاء.
           */
          object Net {

              private var queue: RequestQueue? = null

              fun queue(ctx: Context): RequestQueue {
                  var q = queue
                  if (q == null) {
                      q = RequestQueue(NoCache(), BasicNetwork(HurlStack()), 6)
                      q.start()
                      queue = q
                  }
                  return q
              }

              fun <T : Any> add(ctx: Context, req: Request<T>): Request<T> {
                  req.setTag(Config.REQUEST_TAG)
                  req.setRetryPolicy(DefaultRetryPolicy(15000, 2, 1f))
                  return queue(ctx).add(req)
              }

              fun cancelAll() {
                  queue?.cancelAll(Config.REQUEST_TAG)
              }
          }
