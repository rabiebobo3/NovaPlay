                AlertDialog.Builder(this).setTitle("السيرفرات المحفوظة").setItems(names.toTypedArray()) { d, i -> val o = arr.getJSONObject(i); serverType = o.optString("type","m3u"); sUrl = o.optString("url"); sUser = o.optString("user"); sPass = o.optString("pass"); sMac = o.optString("mac"); etUrl.setText(sUrl); etUser.setText(sUser); etPass.setText(sPass); etMac.setText(sMac); prefs.edit().putString("last", o.toString()).apply(); connect(); d.dismiss() }.show()
              }
              findViewById<LinearLayout>(R.id.tile_live).setOnClickListener { mode = "live"; showLive() }
              findViewById<LinearLayout>(R.id.tile_movies).setOnClickListener { mode = "movie"; showGrid() }
              findViewById<LinearLayout>(R.id.tile_series).setOnClickListener { mode = "series"; showGrid() }
              findViewById<LinearLayout>(R.id.tile_switch).setOnClickListener { serverBox.visibility = View.VISIBLE; homeBox.visibility = View.GONE }
              findViewById<LinearLayout>(R.id.tile_reload).setOnClickListener { connect() }
              findViewById<LinearLayout>(R.id.tile_exit).setOnClickListener { finishAffinity() }
