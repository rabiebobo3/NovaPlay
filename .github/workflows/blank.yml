        final Spinner spType = new Spinner(this);
        ArrayAdapter<String> ad = new ArrayAdapter<>(this, android.R.layout.simple_spinner_item, new String[]{"xtream", "mac", "m3u"});
        ad.setDropDownViewResource(android.R.layout.simple_spinner_dropdown_item);
        spType.setAdapter(ad);
        spType.setPadding(0, dp(8), 0, dp(8));
        final EditText edtUrl = makeInput("🔗 الرابط (http://...)", false);
        final EditText edtUserX = makeInput("👤 المستخدم (لنوع xtream)", false);
        final EditText edtPassX = makeInput("🔑 كلمة المرور (لنوع xtream)", false);
        final EditText edtPortal = makeInput("🚪 البوابة (لنوع mac)", false);
        final EditText edtMac = makeInput("📺 عنوان MAC (لنوع mac)", false);
        box.addView(edtId); box.addView(edtName);
        box.addView(makeLabel("النوع:", GRAY, 12, false));
        box.addView(spType);
        box.addView(edtUrl); box.addView(edtUserX); box.addView(edtPassX);
        box.addView(edtPortal); box.addView(edtMac);
        if (c != null) {
        edtId.setText(sid); edtId.setEnabled(false);
        edtName.setText(sval(c.child("name")));
        String t = sval(c.child("type")).toLowerCase();
        if (t.equals("mac")) spType.setSelection(1); else if (t.equals("m3u")) spType.setSelection(2); else spType.setSelection(0);
        edtUrl.setText(sval(c.child("url")));
        edtUserX.setText(sval(c.child("username")));
        edtPassX.setText(sval(c.child("password")));
        edtPortal.setText(sval(c.child("portal")));
        edtMac.setText(sval(c.child("mac")));
