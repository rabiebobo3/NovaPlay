       NP_EOF
       cat <<'NP_EOF' > app/src/main/res/values/theme.xml
       <?xml version="1.0" encoding="utf-8"?>
       <resources>
           <style name="ThemeNova" parent="Theme.AppCompat.DayNight.NoActionBar">
               <item name="android:windowBackground">@drawable/bg_crystal</item>
               <item name="android:statusBarColor">@color/np_bg</item>
               <item name="android:navigationBarColor">@color/np_bg</item>
               <item name="android:textColorPrimary">@color/np_text</item>
               <item name="android:textColorSecondary">@color/np_text_dim</item>
               <item name="colorAccent">@color/np_gold</item>
               <item name="colorControlActivated">@color/np_gold</item>
               <item name="android:colorControlActivated">@color/np_gold</item>
               <item name="android:colorControlHighlight">#33F5C542</item>
               <item name="android:seekBarStyle">@style/NovaSeekBar</item>
               <item name="alertDialogTheme">@style/NovaDialog</item>
               <item name="android:alertDialogTheme">@style/NovaDialog</item>
               <item name="android:buttonStyle">@style/NovaButton</item>
               <item name="android:editTextStyle">@style/NovaEdit</item>
               <item name="windowNoTitle">true</item>
               <item name="windowActionBar">false</item>
               </style>

           <style name="ThemeNovaFullscreen" parent="ThemeNova">
               <item name="android:windowFullscreen">true</item>
               <item name="android:windowContentOverlay">@null</item>
           </style>

           <style name="NovaDialog" parent="Theme.AppCompat.Dialog.Alert">
               <item name="android:background">@drawable/panel</item>
               <item name="android:textColorPrimary">@color/np_text</item>
               <item name="buttonBarPositiveButtonStyle">@style/NovaDialogButton</item>
               <item name="buttonBarNegativeButtonStyle">@style/NovaDialogButton</item>
               <item name="buttonBarNeutralButtonStyle">@style/NovaDialogButton</item>
               <item name="android:windowTitleStyle">@style/NovaDialogTitle</item>
           </style>

           <style name="NovaDialogButton" parent="Widget.AppCompat.Button.ButtonBar.AlertDialog">
               <item name="android:textColor">@color/np_gold</item>
           </style>

           <style name="NovaDialogTitle" parent="RtlOverlay.DialogWindowTitle.AppCompat">
               <item name="android:textColor">@color/np_gold</item>
               <item name="android:textSize">18sp</item>
               <item name="android:textStyle">bold</item>
           </style>

           <style name="NovaButton" parent="android:Widget.Material.Button">
               <item name="android:background">@drawable/btn_gold</item>
               <item name="android:textColor">@color/np_bg</item>
               <item name="android:textStyle">bold</item>
               <item name="android:textSize">13sp</item>
               <item name="android:minWidth">84dp</item>
               <item name="android:minHeight">40dp</item>
           </style>

           <style name="NovaEdit" parent="android:Widget.Material.EditText">
               <item name="android:textColor">@color/np_text</item>
               <item name="android:textColorHint">@color/np_text_dim</item>
           </style>

           <style name="NovaSeekBar" parent="android:Widget.Material.SeekBar">
               <item name="android:progressDrawable">@drawable/seekbar_gold</item>
               <item name="android:thumb">@drawable/seek_thumb</item>
               <item name="android:minHeight">8dp</item>
               <item name="android:maxHeight">8dp</item>
               <item name="android:splitTrack">false</item>
           </style>

           <style name="NovaTab">
               <item name="android:layout_width">wrap_content</item>
               <item name="android:layout_height">40dp</item>
               <item name="android:gravity">center</item>
               <item name="android:minWidth">84dp</item>
               <item name="android:paddingStart">14dp</item>
               <item name="android:paddingEnd">14dp</item>
               <item name="android:layout_marginStart">4dp</item>
               <item name="android:background">@drawable/tab_bg</item>
               <item name="android:textColor">@color/np_text</item>
               <item name="android:textSize">14sp</item>
               <item name="android:singleLine">true</item>
               <item name="android:focusable">true</item>
               <item name="android:clickable">true</item>
           </style>

           <style name="NovaInput">
               <item name="android:layout_width">match_parent</item>
               <item name="android:layout_height">46dp</item>
               <item name="android:background">@drawable/input_gold</item>
               <item name="android:textColor">@color/np_text</item>
               <item name="android:textColorHint">@color/np_text_dim</item>
               <item name="android:textSize">14sp</item>
               <item name="android:paddingStart">14dp</item>
               <item name="android:paddingEnd">14dp</item>
               <item name="android:singleLine">true</item>
               <item name="android:focusable">true</item>
           </style>

           <style name="NovaTile">
               <item name="android:layout_width">match_parent</item>
               <item name="android:layout_height">54dp</item>
               <item name="android:orientation">horizontal</item>
               <item name="android:gravity">center_vertical</item>
               <item name="android:background">@drawable/sel_row</item>
               <item name="android:paddingStart">12dp</item>
               <item name="android:paddingEnd">12dp</item>
               <item name="android:focusable">true</item>
               <item name="android:clickable">true</item>
           </style>

           <style name="NovaCard">
               <item name="android:layout_width">match_parent</item>
               <item name="android:layout_height">wrap_content</item>
               <item name="android:orientation">vertical</item>
               <item name="android:background">@drawable/card_bg</item>
               <item name="android:padding">8dp</item>
               <item name="android:gravity">center</item>
               <item name="android:focusable">true</item>
               <item name="android:clickable">true</item>
           </style>

           <style name="NovaTextTitle">
               <item name="android:textColor">@color/np_gold</item>
               <item name="android:textStyle">bold</item>
               <item name="android:textSize">22sp</item>
           </style>

           <style name="NovaLabel">
               <item name="android:textColor">@color/np_text</item>
               <item name="android:textSize">14sp</item>
               <item name="android:singleLine">true</item>
           </style>

           <style name="NovaSmall">
               <item name="android:textColor">@color/np_text_dim</item>
               <item name="android:textSize">12sp</item>
           </style>
           <!-- (8.34) أنماط لوحة أزرار المشغل الكبير: أزرار دائرية بحدّ ذهبي عند الفوكس (ريموت) -->
           <style name="CtrlBtn">
               <item name="android:layout_width">50dp</item>
               <item name="android:layout_height">50dp</item>
               <item name="android:layout_marginStart">7dp</item>
               <item name="android:layout_marginEnd">7dp</item>
               <item name="android:padding">12dp</item>
               <item name="android:scaleType">fitCenter</item>
               <item name="android:background">@drawable/btn_ctrl</item>
               <item name="android:focusable">true</item>
               <item name="android:clickable">true</item>
           </style>
           <style name="CtrlBtnBox">
               <item name="android:layout_width">50dp</item>
               <item name="android:layout_height">50dp</item>
               <item name="android:layout_marginStart">7dp</item>
               <item name="android:layout_marginEnd">7dp</item>
               <item name="android:background">@drawable/btn_ctrl</item>
               <item name="android:focusable">true</item>
               <item name="android:clickable">true</item>
           </style>
           <style name="CtrlBtnMain">
               <item name="android:layout_width">62dp</item>
               <item name="android:layout_height">62dp</item>
               <item name="android:layout_marginStart">10dp</item>
               <item name="android:layout_marginEnd">10dp</item>
               <item name="android:padding">16dp</item>
               <item name="android:scaleType">fitCenter</item>
               <item name="android:background">@drawable/btn_ctrl_main</item>
               <item name="android:focusable">true</item>
               <item name="android:clickable">true</item>
           </style>
           <style name="CtrlNum">
               <item name="android:layout_width">wrap_content</item>
               <item name="android:layout_height">wrap_content</item>
               <item name="android:layout_gravity">center</item>
               <item name="android:layout_marginTop">12dp</item>
               <item name="android:textColor">@color/np_gold</item>
               <item name="android:textSize">9sp</item>
               <item name="android:textStyle">bold</item>
           </style>
       </resources>
       NP_EOF
       cat <<'NP_EOF' > app/src/main/res/xml/file_paths.xml
       <?xml version="1.0" encoding="utf-8"?>
       <paths>
           <cache-path name="cache" path="." />
           <external-cache-path name="ext" path="." />
           <files-path name="files" path="." />
       </paths>
       NP_EOF
       if [ -f google-services.json ]; then cp google-services.json app/google-services.json; fi
       if [ ! -s app/debug.keystore ]; then
         keytool -genkeypair -keystore app/debug.keystore -storepass android -keypass android \
           -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10950 \
           -dname 'CN=NovaPlay, OU=Dev, O=NovaPlay, L=Setif, ST=S, C=DZ' >/dev/null 2>&1 || true
       fi
       echo '--- الملفات المولّدة ---'
       find app -type f | sort | sed 's|^|  |'
       wc -l app/src/main/java/com/nova/play/*.kt

    - name: Build APK (debug + release)
      run: |
        set -e
        if command -v gradle >/dev/null 2>&1; then gradle wrapper --gradle-version 8.5 >/dev/null 2>&1 || true; fi
        if [ -x ./gradlew ]; then chmod +x ./gradlew; RUN=./gradlew; else RUN=gradle; fi
        $RUN :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace
        ls -lh app/build/outputs/apk/debug app/build/outputs/apk/release
        DBG=$(du -h app/build/outputs/apk/debug/app-debug.apk 2>/dev/null | cut -f1 || echo "-")
        REL=$(du -h app/build/outputs/apk/release/app-release.apk 2>/dev/null | cut -f1 || echo "-")
        echo "### NovaPlay APK" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"
        echo "- debug: $DBG" >> "$GITHUB_STEP_SUMMARY"
        echo "- release: $REL" >> "$GITHUB_STEP_SUMMARY"
        echo "- الحزمة: com.nova.play — الاصدار 8.34 (code 834)" >> "$GITHUB_STEP_SUMMARY"
        echo "- اللغات: Kotlin 1.9.22 + media3 1.4.1 + Firebase RTDB/FCM + Glide + MediaRouter" >> "$GITHUB_STEP_SUMMARY"

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: NovaPlay-Kotlin-v${{ env.VERSION_CODE }}-build${{ github.run_number }}
        path: |
          app/build/outputs/apk/debug/app-debug.apk
          app/build/outputs/apk/release/app-release.apk
        if-no-files-found: error

    - name: Publish Release
      if: success()
      uses: softprops/action-gh-release@v2
      with:
        tag_name: nova-v${{ env.VERSION_NAME }}-build${{ github.run_number }}
        name: NovaPlay Kotlin v${{ env.VERSION_NAME }} (com.nova.play) build ${{ github.run_number }}
        body: |
          APK مبني من ملف Workflow واحد — Kotlin + media3.
          ميزات: M3U / Xtream / MAC Portal، SmartLoad (كاش + إعادة محاولة + مصدر بديل)،
          دخول سحابي عبر Firebase RTDB، جلسة أحادية، OTA، FCM، ثيم Crystal Black × Gold / Nova Maroon.
          لإضافة Firebase: ارفع google-services.json في جذر المستودع.
        files: |
          app/build/outputs/apk/debug/app-debug.apk
          app/build/outputs/apk/release/app-release.apk
        overwrite: true
        generate_release_notes: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
