         /** يبدّل عمق الجلب ثم يطلب إعادة تحميل لتطبيقه. */
         private fun cycleDepth() {
           val cur = sp.s("mac_depth", "3").toIntOrNull() ?: 3
           val nxt = if (cur >= 3) 0 else cur + 1
           sp.put("mac_depth", nxt.toString())
           toast("عمق الجلب: " + depthLabel() + " — اعمل «إعادة تحميل القائمة» لتطبيقه")
         }

         private fun settingsDialog() {
