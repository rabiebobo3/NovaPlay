              fun prefetch(list: List<Channel>, idx: Int, c: Channel?) {
                  try {
                      if (idx < 0 || idx + 1 >= list.size) return
                      val nxt = list[idx + 1]
                      val key = keyOf(nxt)
                      if (key == keyOf(c)) return                                  // لا نجهّز العنصر نفسه
                      val now = System.currentTimeMillis()
                      if (now - preLast.get() < 250) return                        // خنق: لا أكثر من تجهيزة كل 250 مللي
