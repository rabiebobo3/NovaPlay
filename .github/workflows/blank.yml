name: NovaPlay Build

# ==================================================================
#  NovaPlay — تطبيق IPTV بـ Kotlin · بدون Firebase · سيرفرات يدوية
#  الحزمة: com.nova.play      الإصدار: 139.0-NovaPlay
#
#  هذا الملف الواحد يفعل كل شيء:
#   1) يُنشئ كل ملفات المشروع (تراها مكتوبة بالأسفل داخل الخطوات)
#   2) يبني التطبيق: Debug + Release APK
#   3) يرفع الملفات إلى المستودع + APK إلى Artifacts + Release
# ==================================================================

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      commit_files:
        description: 'رفع ملفات المشروع إلى المستودع؟'
        type: choice
        default: 'true'
        options:
          - 'true'
          - 'false'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: "Create Kotlin files — إنشاء ملفات Kotlin"
        run: |
          set -e
          mkdir -p $(dirname app/src/main/java/com/nova/play/Channel.kt)
          cat > app/src/main/java/com/nova/play/Channel.kt <<'NOVA_EOF'
          package com.nova.play

          /**
           * قناة / فيلم / حلقة — كلاس عادي (ليس data class)
           * حتى تبقى المقارنات بالمرجع كما في التطبيق الأصلي.
           */
          class Channel {

              var id: String = ""
              var name: String = ""
              var url: String = ""
              var logo: String = ""
              var group: String = ""
              var kind: String = KIND_LIVE
              var ext: String = "mp4"
              var seriesId: String = ""

              /** آخر موضع مشاهدة (يجيء من التخزين المحلي) */
              var resumeMs: Long = 0L

              fun isLive(): Boolean = kind == KIND_LIVE

              companion object {
                  const val KIND_LIVE = "live"
                  const val KIND_VOD = "vod"
                  const val KIND_SERIES = "series"
              }
          }
          NOVA_EOF

          mkdir -p $(dirname app/src/main/java/com/nova/play/ChannelAdapter.kt)
          cat > app/src/main/java/com/nova/play/ChannelAdapter.kt <<'NOVA_EOF'
          package com.nova.play

          import android.content.Context
          import android.view.LayoutInflater
          import android.view.View
          import android.view.ViewGroup
          import android.widget.ImageView
          import android.widget.TextView
          import androidx.recyclerview.widget.RecyclerView
          import com.bumptech.glide.Glide

          /**
           * عرض القنوات/الأفلام/الحلقات.
           * poster = true → بطاقة عمودية بصورة كبيرة (أفلام ومسلسلات).
           */
          class ChannelAdapter(
              private val ctx: Context,
              val items: MutableList<Channel>,
              private val poster: Boolean,
              private val store: HistoryStore,
              private val onClick: (Int) -> Unit
          ) : RecyclerView.Adapter<ChannelAdapter.VH>() {

              inner class VH(itemView: View) : RecyclerView.ViewHolder(itemView) {
                  val img: ImageView = itemView.findViewById(if (poster) R.id.imgPoster else R.id.imgLogo)
                  val name: TextView = itemView.findViewById(R.id.txtName)
                  val group: TextView = itemView.findViewById(R.id.txtGroup)
                  val badge: TextView = itemView.findViewById(R.id.txtBadge)
                  val fav: ImageView = itemView.findViewById(R.id.imgFav)
              }

              override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): VH {
                  val v = LayoutInflater.from(ctx).inflate(if (poster) R.layout.item_card else R.layout.item_channel, parent, false)
                  return VH(v)
              }

              override fun getItemCount(): Int = items.size

              override fun onBindViewHolder(holder: VH, position: Int) {
                  val ch = items[position]
                  holder.name.text = ch.name
                  holder.group.text = ch.group

                  val resume = store.resume(ch.url)
                  holder.badge.visibility = if (resume > 10000L) View.VISIBLE else View.GONE
                  holder.fav.visibility = if (store.isFav(ch.url)) View.VISIBLE else View.GONE

                  if (ch.logo.isNotEmpty()) {
                      Glide.with(ctx).load(ch.logo).into(holder.img)
                  } else {
                      holder.img.setImageResource(R.drawable.ic_tv)
                  }

                  holder.itemView.setOnClickListener { onClick(holder.adapterPosition) }
              }

              fun submit(list: MutableList<Channel>) {
                  items.clear()
                  items.addAll(list)
                  notifyDataSetChanged()
              }
          }
          NOVA_EOF

          mkdir -p $(dirname app/src/main/java/com/nova/play/Config.kt)
          cat > app/src/main/java/com/nova/play/Config.kt <<'NOVA_EOF'
          package com.nova.play

          /**
           * NovaPlay - إعدادات عامة
           * كل ما تحتاج تعديله موجود هنا.
           */
          object Config {

              const val APP_NAME = "NovaPlay"
              const val VERSION_NAME = "139.0-NovaPlay"

              /** ملفات التخزين المحلي */
              const val PREFS_SETTINGS = "nova_settings"
              const val PREFS_SERVERS = "nova_servers"
              const val PREFS_HISTORY = "nova_history"

              /** كلمة سر فتح التطبيق (فارغة = بدون كلمة سر) */
              const val DEFAULT_APP_PASSWORD = ""

              /** رابط التحديث (اتركه فارغاً = زر التحديث يختفي) */
              const val DEFAULT_UPDATE_URL = ""

              const val REQUEST_TAG = "nova_play_request"
              const val UPDATE_FILE = "nova_update.apk"

              /** حجم الصفحة عند عرض القنوات */
              const val CHUNK = 300
          }
          NOVA_EOF

          mkdir -p $(dirname app/src/main/java/com/nova/play/CrashGuard.kt)
          cat > app/src/main/java/com/nova/play/CrashGuard.kt <<'NOVA_EOF'
          package com.nova.play

          import android.app.AlarmManager
          import android.app.PendingIntent
          import android.content.Context
          import android.content.Intent
          import android.os.Build
          import android.os.Process
          import java.io.File
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          /**
           * حارس الأعطال: يكتب تقريراً في crash_last.txt ثم يعيد تشغيل التطبيق بعد 1.2 ثانية.
           */
          class CrashGuard(private val ctx: Context) : Thread.UncaughtExceptionHandler {

              private val previous: Thread.UncaughtExceptionHandler? = Thread.getDefaultUncaughtExceptionHandler()

              override fun uncaughtException(t: Thread, e: Throwable) {
                  try {
                      val stamp = SimpleDateFormat("yyyy-MM-dd HH:mm:ss", Locale.US).format(Date())
                      val body = StringBuilder()
                      body.append("NovaPlay crash @ ").append(stamp).append("\n")
                      body.append(e.toString()).append("\n\n")
                      for (el in e.stackTrace) body.append("  at ").append(el.toString()).append("\n")
                      File(ctx.filesDir, CRASH_FILE).writeText(body.toString())
                  } catch (_: Throwable) {
                  }

                  try {
                      val intent = Intent(ctx, LoginActivity::class.java)
                      intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TASK)
                      var flags = PendingIntent.FLAG_UPDATE_CURRENT
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) flags = flags or PendingIntent.FLAG_IMMUTABLE
                      val pi = PendingIntent.getActivity(ctx, 7001, intent, flags)
                      val am = ctx.getSystemService(Context.ALARM_SERVICE) as AlarmManager
                      am.set(AlarmManager.RTC, System.currentTimeMillis() + 1200L, pi)
                  } catch (_: Throwable) {
                  }

                  if (previous != null) {
                      previous.uncaughtException(t, e)
                  } else {
                      Process.killProcess(Process.myPid())
                  }
              }

              companion object {
                  const val CRASH_FILE = "crash_last.txt"

                  fun lastCrash(ctx: Context): String? {
                      val f = File(ctx.filesDir, CRASH_FILE)
                      return if (f.exists()) f.readText() else null
                  }

                  fun clear(ctx: Context) {
                      try {
                          File(ctx.filesDir, CRASH_FILE).delete()
                      } catch (_: Throwable) {
                      }
                  }
              }
          }
          NOVA_EOF

          mkdir -p $(dirname app/src/main/java/com/nova/play/GroupAdapter.kt)
          cat > app/src/main/java/com/nova/play/GroupAdapter.kt <<'NOVA_EOF'
          package com.nova.play

          import android.content.Context
          import android.view.LayoutInflater
          import android.view.ViewGroup
          import android.widget.TextView
          import androidx.recyclerview.widget.RecyclerView

          /**
           * شريط المجموعات (التصنيفات).
           */
          class GroupAdapter(
              private val ctx: Context,
              private val groups: MutableList<String>,
              private val onClick: (Int) -> Unit
          ) : RecyclerView.Adapter<GroupAdapter.VH>() {

              var selected: Int = 0

              inner class VH(v: TextView) : RecyclerView.ViewHolder(v) {
                  val txt: TextView = v
              }

              override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): VH {
                  val v = LayoutInflater.from(ctx).inflate(R.layout.item_group, parent, false) as TextView
                  return VH(v)
              }

              override fun getItemCount(): Int = groups.size

              override fun onBindViewHolder(holder: VH, position: Int) {
                  holder.txt.text = groups[position]
                  holder.txt.isSelected = position == selected
                  holder.txt.setOnClickListener {
                      selected = holder.adapterPosition
                      notifyDataSetChanged()
                      onClick(holder.adapterPosition)
                  }
              }

              fun submit(list: MutableList<String>) {
                  groups.clear()
                  groups.addAll(list)
                  selected = 0
                  notifyDataSetChanged()
              }
          }
          NOVA_EOF

          mkdir -p $(dirname app/src/main/java/com/nova/play/HistoryStore.kt)
          cat > app/src/main/java/com/nova/play/HistoryStore.kt <<'NOVA_EOF'
          package com.nova.play

          import android.content.Context
          import com.google.gson.Gson
          import com.google.gson.reflect.TypeToken

          /**
           * المفضلة + متابعة المشاهدة + مواضع التوقف — كل شيء محلي في الهاتف.
           * مفتاح الموضع: pos_<hashcode(url)> كما في التطبيق الأصلي.
           */
          class HistoryStore(private val ctx: Context) {

              private val prefs = ctx.getSharedPreferences(Config.PREFS_HISTORY, Context.MODE_PRIVATE)
              private val gson = Gson()

              private fun key(url: String): String = "pos_" + url.hashCode()

              fun resume(url: String): Long = prefs.getLong(key(url), 0L)

              fun saveResume(url: String, ms: Long) {
                  prefs.edit().putLong(key(url), ms).apply()
              }

              fun clearResume(url: String) {
                  prefs.edit().remove(key(url)).apply()
              }

              // ---------- المفضلة ----------

              fun isFav(url: String): Boolean = favs().contains(url)

              private fun favs(): MutableSet<String> {
                  val s = prefs.getStringSet(KEY_FAV, null) ?: return HashSet()
                  return HashSet(s)
              }

              /** يرجع الحالة الجديدة */
              fun toggleFav(ch: Channel): Boolean {
                  val set = favs()
                  val json = prefs.getString(KEY_FAV_CH, null)
                  val t = object : TypeToken<MutableList<Channel>>() {}.type
                  var list: MutableList<Channel> = try {
                      if (json == null) {
                          ArrayList()
                      } else {
                          val parsed: MutableList<Channel>? = gson.fromJson(json, t)
                          parsed ?: ArrayList()
                      }
                  } catch (e: Exception) {
                      ArrayList()
                  }
                  val nowFav: Boolean = if (set.contains(ch.url)) {
                      set.remove(ch.url)
                      list.removeAll { it.url == ch.url }
                      false
                  } else {
                      set.add(ch.url)
                      list.add(0, ch)
                      true
                  }
                  prefs.edit().putStringSet(KEY_FAV, set).putString(KEY_FAV_CH, gson.toJson(list)).apply()
                  return nowFav
              }

              fun favChannels(): MutableList<Channel> {
                  val json = prefs.getString(KEY_FAV_CH, null) ?: return ArrayList()
                  return try {
                      val t = object : TypeToken<MutableList<Channel>>() {}.type
                      val l: MutableList<Channel>? = gson.fromJson(json, t)
                      val list = l ?: ArrayList()
                      for (c in list) c.resumeMs = resume(c.url)
                      list
                  } catch (e: Exception) {
                      ArrayList()
                  }
              }

              // ---------- متابعة المشاهدة ----------

              fun history(): MutableList<Channel> {
                  val json = prefs.getString(KEY_HIST, null) ?: return ArrayList()
                  return try {
                      val t = object : TypeToken<MutableList<Channel>>() {}.type
                      val l: MutableList<Channel>? = gson.fromJson(json, t)
                      val list = l ?: ArrayList()
                      for (c in list) c.resumeMs = resume(c.url)
                      list
                  } catch (e: Exception) {
                      ArrayList()
                  }
              }

              fun addHistory(ch: Channel) {
                  val list = history()
                  list.removeAll { it.url == ch.url }
                  list.add(0, ch)
                  while (list.size > 80) list.removeAt(list.size - 1)
                  prefs.edit().putString(KEY_HIST, gson.toJson(list)).apply()
              }

              fun clearHistory() {
                  prefs.edit().remove(KEY_HIST).apply()
              }

              companion object {
                  const val KEY_FAV = "fav_urls"
                  const val KEY_FAV_CH = "fav_channels"
                  const val KEY_HIST = "history_list"
              }
          }
          NOVA_EOF

          mkdir -p $(dirname app/src/main/java/com/nova/play/HomeActivity.kt)
          cat > app/src/main/java/com/nova/play/HomeActivity.kt <<'NOVA_EOF'
          package com.nova.play

          import android.app.AlertDialog
          import android.content.Intent
          import android.os.Bundle
          import android.text.Editable
          import android.text.TextWatcher
          import android.view.LayoutInflater
          import android.view.View
          import android.widget.Button
          import android.widget.EditText
          import android.widget.ImageView
          import android.widget.ProgressBar
          import android.widget.TextView
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity
          import androidx.recyclerview.widget.GridLayoutManager
          import androidx.recyclerview.widget.LinearLayoutManager
          import androidx.recyclerview.widget.RecyclerView

          /**
           * الشاشة الرئيسية: تصنيفات + قنوات/أفلام/مسلسلات/متابعة/مفضلة + بحث.
           * المحتوى يأتي من السيرفر اليدوي النشط.
           */
          class HomeActivity : AppCompatActivity() {

              private lateinit var store: ServerStore
              private lateinit var history: HistoryStore
              private lateinit var client: XtreamClient

              private var kind: String = Channel.KIND_LIVE
              private var all: MutableList<Channel> = ArrayList()
              private var groups: MutableList<String> = ArrayList()
              private var groupIndex: Int = 0
              private var openSeries: Channel? = null

              private val cache = HashMap<String, MutableList<Channel>>()

              private lateinit var rvItems: RecyclerView
              private lateinit var rvGroups: RecyclerView
              private lateinit var itemsAdapter: ChannelAdapter
              private lateinit var groupAdapter: GroupAdapter
              private lateinit var prgLoading: ProgressBar
              private lateinit var txtEmpty: TextView
              private lateinit var edtSearch: EditText

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_home)

                  store = ServerStore(this)
                  history = HistoryStore(this)
                  client = XtreamClient(this)

                  prgLoading = findViewById(R.id.prgLoading)
                  txtEmpty = findViewById(R.id.txtEmpty)
                  edtSearch = findViewById(R.id.edtSearch)
                  rvItems = findViewById(R.id.rvItems)
                  rvGroups = findViewById(R.id.rvGroups)

                  itemsAdapter = ChannelAdapter(this, ArrayList(), false, history) { pos -> onItemClick(pos) }
                  rvItems.layoutManager = GridLayoutManager(this, 4)
                  rvItems.adapter = itemsAdapter

                  groupAdapter = GroupAdapter(this, ArrayList()) { pos ->
                      groupIndex = pos
                      applyFilter()
                  }
                  rvGroups.layoutManager = LinearLayoutManager(this, LinearLayoutManager.HORIZONTAL, false)
                  rvGroups.adapter = groupAdapter

                  findViewById<TextView>(R.id.txtServerName).text = store.active()?.name ?: ""

                  findViewById<TextView>(R.id.tabLive).setOnClickListener { setKind(Channel.KIND_LIVE) }
                  findViewById<TextView>(R.id.tabMovies).setOnClickListener { setKind(Channel.KIND_VOD) }
                  findViewById<TextView>(R.id.tabSeries).setOnClickListener { setKind(Channel.KIND_SERIES) }
                  findViewById<TextView>(R.id.tabHistory).setOnClickListener { setKind(KIND_HISTORY) }
                  findViewById<TextView>(R.id.tabFav).setOnClickListener { setKind(KIND_FAV) }

                  findViewById<ImageView>(R.id.btnRefresh).setOnClickListener { cache.clear(); load() }
                  findViewById<ImageView>(R.id.btnServers).setOnClickListener {
                      startActivity(Intent(this, ServerManagerActivity::class.java))
                  }
                  findViewById<ImageView>(R.id.btnExit).setOnClickListener { askExit() }

                  val btnUpdate = findViewById<ImageView>(R.id.btnUpdate)
                  btnUpdate.visibility = if (store.updateUrl().isNotEmpty()) View.VISIBLE else View.GONE
                  btnUpdate.setOnClickListener { Updater(this).check(store) }

                  edtSearch.addTextChangedListener(object : TextWatcher {
                      override fun beforeTextChanged(s: CharSequence?, a: Int, b: Int, c: Int) {}
                      override fun onTextChanged(s: CharSequence?, a: Int, b: Int, c: Int) {}
                      override fun afterTextChanged(s: Editable?) {
                          applyFilter()
                      }
                  })

                  selectTab(Channel.KIND_LIVE)
                  load()
              }

              override fun onResume() {
                  super.onResume()
                  val s = store.active()
                  findViewById<TextView>(R.id.txtServerName).text = s?.name ?: ""
                  if (s == null) {
                      startActivity(Intent(this, LoginActivity::class.java))
                      finish()
                  }
              }

              // ---------------- التبويبات ----------------

              private fun selectTab(k: String) {
                  val live = findViewById<TextView>(R.id.tabLive)
                  val mov = findViewById<TextView>(R.id.tabMovies)
                  val ser = findViewById<TextView>(R.id.tabSeries)
                  val his = findViewById<TextView>(R.id.tabHistory)
                  val fav = findViewById<TextView>(R.id.tabFav)
                  live.isSelected = k == Channel.KIND_LIVE
                  mov.isSelected = k == Channel.KIND_VOD
                  ser.isSelected = k == Channel.KIND_SERIES
                  his.isSelected = k == KIND_HISTORY
                  fav.isSelected = k == KIND_FAV
              }

              private fun setKind(k: String) {
                  if (kind == k) return
                  kind = k
                  openSeries = null
                  selectTab(k)
                  groupIndex = 0

                  val poster = (k == Channel.KIND_VOD || k == Channel.KIND_SERIES)
                  itemsAdapter = ChannelAdapter(this, ArrayList(), poster, history) { pos -> onItemClick(pos) }
                  rvItems.adapter = itemsAdapter
                  rvItems.layoutManager = GridLayoutManager(this, if (poster) 5 else 4)

                  if (k == KIND_HISTORY || k == KIND_FAV) {
                      load()
                  } else if (cache.containsKey(k)) {
                      all = cache[k] ?: ArrayList()
                      buildGroups()
                  } else {
                      load()
                  }
              }

              // ---------------- التحميل ----------------

              private fun load() {
                  if (kind == KIND_HISTORY) {
                      all = history.history()
                      groups = ArrayList()
                      groupAdapter.submit(ArrayList())
                      groupIndex = 0
                      show(all)
                      return
                  }
                  if (kind == KIND_FAV) {
                      all = history.favChannels()
                      groups = ArrayList()
                      groupAdapter.submit(ArrayList())
                      groupIndex = 0
                      show(all)
                      return
                  }

                  val server = store.active()
                  if (server == null) {
                      txtEmpty.text = getString(R.string.login_no_server)
                      txtEmpty.visibility = View.VISIBLE
                      return
                  }

                  prgLoading.visibility = View.VISIBLE
                  txtEmpty.visibility = View.GONE

                  client.load(server, kind, object : XtreamClient.Callback {
                      override fun onDone(list: MutableList<Channel>) {
                          prgLoading.visibility = View.GONE
                          all = list
                          if (kind != KIND_HISTORY && kind != KIND_FAV) cache[kind] = list
                          buildGroups()
                      }

                      override fun onError(msg: String) {
                          prgLoading.visibility = View.GONE
                          txtEmpty.text = "${getString(R.string.net_error)}\n$msg"
                          txtEmpty.visibility = View.VISIBLE
                      }
                  })
              }

              private fun buildGroups() {
                  val g = ArrayList<String>()
                  g.add(getString(R.string.tab_all))
                  for (c in all) if (c.group.isNotEmpty() && !g.contains(c.group)) g.add(c.group)
                  groups = g
                  groupIndex = 0
                  groupAdapter.submit(g)
                  applyFilter()
              }

              private fun applyFilter() {
                  val q = edtSearch.text.toString().trim().lowercase()
                  val g = if (groups.isEmpty() || groupIndex == 0) null else groups[groupIndex]
                  val out = ArrayList<Channel>()
                  for (c in all) {
                      if (g != null && c.group != g) continue
                      if (q.isNotEmpty() && !c.name.lowercase().contains(q)) continue
                      out.add(c)
                  }
                  show(out)
              }

              private fun show(list: MutableList<Channel>) {
                  itemsAdapter.submit(list)
                  txtEmpty.text = getString(R.string.no_results)
                  txtEmpty.visibility = if (list.isEmpty()) View.VISIBLE else View.GONE
                  if (list.isNotEmpty()) rvItems.requestFocus()
              }

              // ---------------- الاختيار ----------------

              private fun onItemClick(position: Int) {
                  val items = itemsAdapter.items
                  if (position < 0 || position >= items.size) return
                  val ch = items[position]

                  if (ch.kind == Channel.KIND_SERIES && ch.url.isEmpty()) {
                      val server = store.active() ?: return
                      openSeries = ch
                      prgLoading.visibility = View.VISIBLE
                      client.loadSeriesEpisodes(server, ch.id, object : XtreamClient.Callback {
                          override fun onDone(list: MutableList<Channel>) {
                              prgLoading.visibility = View.GONE
                              all = list
                              groups = ArrayList()
                              groupAdapter.submit(ArrayList())
                              groupIndex = 0
                              show(list)
                              Toast.makeText(this@HomeActivity, R.string.episodes, Toast.LENGTH_SHORT).show()
                          }

                          override fun onError(msg: String) {
                              prgLoading.visibility = View.GONE
                              Toast.makeText(this@HomeActivity, msg, Toast.LENGTH_LONG).show()
                          }
                      })
                      return
                  }

                  PlaySession.list = items
                  PlaySession.index = position
                  PlaySession.kind = ch.kind
                  startActivity(Intent(this, MainActivity::class.java))
              }

              override fun onBackPressed() {
                  if (openSeries != null) {
                      openSeries = null
                      load()
                      return
                  }
                  askExit()
              }

              private fun askExit() {
                  val v = LayoutInflater.from(this).inflate(R.layout.dialog_exit_custom, null)
                  val d = AlertDialog.Builder(this, R.style.NovaGoldDialog).setView(v).setCancelable(true).create()
                  v.findViewById<Button>(R.id.btnExitYes).setOnClickListener {
                      d.dismiss()
                      finishAffinity()
                  }
                  v.findViewById<Button>(R.id.btnExitNo).setOnClickListener { d.dismiss() }
                  d.show()
              }

              companion object {
                  const val KIND_HISTORY = "history"
                  const val KIND_FAV = "fav"
              }
          }
          NOVA_EOF

          mkdir -p $(dirname app/src/main/java/com/nova/play/LoginActivity.kt)
          cat > app/src/main/java/com/nova/play/LoginActivity.kt <<'NOVA_EOF'
          package com.nova.play

          import android.content.Intent
          import android.os.Bundle
          import android.view.View
          import android.widget.Button
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity

          /**
           * شاشة الدخول — بدون Firebase:
           * كلمة سر محلية (اختيارية) + عرض السيرفر النشط، ومنها إلى إدارة السيرفرات.
           */
          class LoginActivity : AppCompatActivity() {

              private lateinit var store: ServerStore
              private var edtPassword: EditText? = null

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_login)

                  store = ServerStore(this)

                  val boxPassword = findViewById<LinearLayout>(R.id.boxPassword)
                  val txtServerInfo = findViewById<TextView>(R.id.txtServerInfo)
                  val txtVersion = findViewById<TextView>(R.id.txtVersion)
                  val btnEnter = findViewById<Button>(R.id.btnEnter)
                  val btnServers = findViewById<Button>(R.id.btnServers)
                  edtPassword = findViewById(R.id.edtPassword)

                  txtVersion.text = "${Config.APP_NAME}  •  ${Config.VERSION_NAME}"

                  val pwd = store.appPassword()
                  boxPassword.visibility = if (pwd.isNotEmpty()) View.VISIBLE else View.GONE

                  btnServers.setOnClickListener {
                      startActivity(Intent(this, ServerManagerActivity::class.java))
                  }

                  btnEnter.setOnClickListener { tryEnter() }

                  if (!store.exists()) {
                      // أول تشغيل: نفتح له نموذج الإضافة مباشرة
                      val i = Intent(this, ServerManagerActivity::class.java)
                      i.putExtra(ServerManagerActivity.EXTRA_OPEN_FORM, true)
                      startActivity(i)
                  }
              }

              override fun onResume() {
                  super.onResume()
                  refresh()
              }

              private fun refresh() {
                  val txtServerInfo = findViewById<TextView>(R.id.txtServerInfo)
                  val s = store.active()
                  txtServerInfo.text = if (s == null) {
                      getString(R.string.login_no_server)
                  } else {
                      "${getString(R.string.srv_active)}: ${s.name}\n${s.summary()}"
                  }
              }

              private fun tryEnter() {
                  val pwd = store.appPassword()
                  if (pwd.isNotEmpty()) {
                      val typed = edtPassword?.text?.toString()?.trim() ?: ""
                      if (typed != pwd) {
                          Toast.makeText(this, R.string.login_wrong_password, Toast.LENGTH_SHORT).show()
                          return
                      }
                  }
                  if (!store.exists()) {
                      Toast.makeText(this, R.string.login_no_server, Toast.LENGTH_LONG).show()
                      val i = Intent(this, ServerManagerActivity::class.java)
                      i.putExtra(ServerManagerActivity.EXTRA_OPEN_FORM, true)
                      startActivity(i)
                      return
                  }
                  startActivity(Intent(this, HomeActivity::class.java))
                  finish()
              }
          }
