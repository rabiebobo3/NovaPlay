        private void loadDataInto(final LinearLayout stats, final LinearLayout chipsBox, final LinearLayout usersBox, final LinearLayout srvBox, final TextView warn) {
        usersBox.removeAllViews(); srvBox.removeAllViews();
        stats.removeAllViews();
        TextView loading = makeLabel("🔄 جاري التحميل من Firebase...", GRAY, 14, false);
        loading.setGravity(Gravity.CENTER); loading.setPadding(0, dp(14), 0, 0);
        usersBox.addView(loading);
        warn.setVisibility(usingDefaultAdmin ? View.VISIBLE : View.GONE);
        try {
        db.child("users").get().addOnSuccessListener(uSnap -> {
        try {
        db.child("servers").get().addOnSuccessListener(sSnap -> {
        try { renderAll(stats, chipsBox, usersBox, srvBox, uSnap, sSnap); } catch (Exception e) { toast("خطأ عرض: " + e.getMessage()); }
        }).addOnFailureListener(e -> { usersBox.removeAllViews(); TextView x = makeLabel("⚠️ تعذر جلب البيانات — تحقق من الإنترنت", 0xFFFF7B7B, 13, false); usersBox.addView(x); });
        } catch (Exception e) { toast("خطأ: " + e.getMessage()); }
        }).addOnFailureListener(e -> { usersBox.removeAllViews(); TextView x = makeLabel("⚠️ تعذر جلب البيانات — تحقق من الإنترنت", 0xFFFF7B7B, 13, false); usersBox.addView(x); });
        } catch (Exception e) { toast("خطأ: " + e.getMessage()); }
        }

        private void loadData(LinearLayout content) {
        toast("🔄 تحديث...");
        try {
        ScrollView scroll = (ScrollView) content.getParent();
        scroll.removeAllViews();
        } catch (Exception e) {}
        buildPanel();
        }

        private void renderAll(LinearLayout stats, LinearLayout chipsBox, LinearLayout usersBox, LinearLayout srvBox, DataSnapshot users, DataSnapshot servers) {
        // ═══ الإحصائيات ═══
        int total = 0, active = 0, blocked = 0;
        Map<String, Integer> perServer = new HashMap<>();
        Map<String, String> srvNames = new HashMap<>();
        try {
        if (users != null && users.exists()) for (DataSnapshot c : users.getChildren()) {
        total++;
        boolean isBlocked = sval(c.child("blocked")).equalsIgnoreCase("true");
        String ex = sval(c.child("expiry"));
        boolean expired = !expiryOk(ex);
        if (isBlocked) blocked++; else if (expired) {} else active++;
        String sid = sval(c.child("server_id"));
        if (!sid.isEmpty()) { Integer n = perServer.get(sid); perServer.put(sid, n == null ? 1 : n + 1); }
        }
        if (servers != null && servers.exists()) for (DataSnapshot c : servers.getChildren()) srvNames.put(c.getKey(), sval(c.child("name")));
        } catch (Exception e) {}
        stats.removeAllViews();
        LinearLayout.LayoutParams sp = new LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f);
        sp.setMargins(dp(4), 0, dp(4), 0);
        LinearLayout c1 = statCard(String.valueOf(total), "المشتركون"); c1.setLayoutParams(sp);
        LinearLayout c2 = statCard(String.valueOf(active), "النشطون"); c2.setLayoutParams(sp);
        LinearLayout c3 = statCard(String.valueOf(blocked), "المحظورون"); c3.setLayoutParams(sp);
        stats.addView(c1); stats.addView(c2); stats.addView(c3);
        chipsBox.removeAllViews();
        if (!perServer.isEmpty()) {
        for (String sid : perServer.keySet()) {
        String nm = srvNames.containsKey(sid) ? srvNames.get(sid) : sid;
        TextView chip = makeLabel("🖥️ " + nm + ": " + perServer.get(sid) + " مشترك", GOLD, 11, false);
        chip.setBackground(ghostBtnBg()); chip.setPadding(dp(10), dp(6), dp(10), dp(6));
        LinearLayout.LayoutParams cp = new LinearLayout.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT);
        cp.setMargins(dp(4), dp(8), dp(4), 0);
        chip.setLayoutParams(cp);
        chipsBox.addView(chip);
        }
        }

        // ═══ قائمة المشتركين ═══
        usersBox.removeAllViews();
        if (users == null || !users.exists()) {
        TextView empty = makeLabel("لا يوجد مشتركون بعد — اضغط ➕ إضافة مشترك", GRAY, 13, false);
        empty.setPadding(0, dp(10), 0, 0);
        usersBox.addView(empty);
        } else {
        for (DataSnapshot c : users.getChildren()) usersBox.addView(userRow(c.getKey(), c));
        }

        // ═══ قائمة السيرفرات ═══
        srvBox.removeAllViews();
        if (servers == null || !servers.exists()) {
        TextView empty = makeLabel("لا توجد سيرفرات — اضغط ➕ إضافة سيرفر", GRAY, 13, false);
        empty.setPadding(0, dp(10), 0, 0);
        srvBox.addView(empty);
        } else {
        for (DataSnapshot c : servers.getChildren()) srvBox.addView(serverRow(c.getKey(), c));
        }
        }

        private void LayoutParamsRemoved() {}

        private boolean expiryOk(String expiry) {
        // يدعم: 2026-12-31 و 15-09-2026 و 15/09/2026 و 15.09.2026
        try {
        if (expiry == null || expiry.trim().isEmpty()) return true;
        String s = expiry.trim().replace(".", "-").replace("/", "-").replace(" ", "");
        String[] p = s.split("-");
        if (p.length != 3) return true;
        int a = Integer.parseInt(p[0]); int b = Integer.parseInt(p[1]); int c = Integer.parseInt(p[2]);
        int year, month, day;
        if (p[0].length() == 4 || a > 31) { year = a; month = b; day = c; }
        else { day = a; month = b; year = c; }
        if (month < 1 || month > 12 || day < 1 || day > 31 || year < 2000 || year > 2100) return true;
        java.util.Calendar exp = java.util.Calendar.getInstance();
        exp.clear();
        exp.set(year, month - 1, day, 23, 59, 59);
        return System.currentTimeMillis() <= exp.getTimeInMillis();
        } catch (Exception e) { return true; }
        }

