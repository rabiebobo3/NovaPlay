                                          Crash.note("AI-PRE", "جهّزنا رابط العنصر التالي: " + nxt.name.take(40))
                                      }
                                  } catch (t: Throwable) {}
                              }
                          } catch (t: Throwable) { Crash.log(t) }
                      }
                  } catch (t: Throwable) { Crash.log(t) }
              }

