       /** ملء شاشة كامل: إخفاء status/nav bar مع إبقاء المحتوى تحت النوتش. */
       fun android.app.Activity.goImmersive() {
         try {
           if (android.os.Build.VERSION.SDK_INT >= 30) {
             window.setDecorFitsSystemWindows(false)
             window.insetsController?.let {
               it.hide(android.view.WindowInsets.Type.systemBars())
               it.systemBarsBehavior = android.view.WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
             }
           } else {
             @Suppress("DEPRECATION")
             window.decorView.systemUiVisibility = (
               View.SYSTEM_UI_FLAG_LAYOUT_STABLE or View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
               or View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN or View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
               or View.SYSTEM_UI_FLAG_FULLSCREEN or View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY)
           }
           if (android.os.Build.VERSION.SDK_INT >= 28) {
             try {
               val lp = window.attributes
               val f = android.view.WindowManager.LayoutParams::class.java
                 .getField("LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES").getInt(null)
               lp.layoutInDisplayCutoutMode = f
               window.attributes = lp
             } catch (t: Throwable) {}
           }
         } catch (t: Throwable) { Crash.log(t) }
       }

       /** هل الجهاز تلفاز / صندوق أندرويد؟ */
       fun android.content.Context.isTvDevice(): Boolean {
         return try {
           val pm = packageManager
           pm.hasSystemFeature(android.content.pm.PackageManager.FEATURE_LEANBACK) ||
             pm.hasSystemFeature("android.software.live_tv")
         } catch (t: Throwable) { false }
       }
