name: NovaPlay_Kotlin_Full
# ============================================================================
#  NovaPlay v8.40.8 — نسخة «مصغَّرة» للنسخ السهل (نفس المشروع حرفيًّا، بلا حذف أي ميزة)
#
#  لماذا؟ الملف العادي حجمه 538 كيلوبايت لأن كود المشروع مكتوب داخله كنصّ.
#  في هذه النسخة يُخزَّن نفس المشروع **مضغوطًا** (xz ثم base64) داخل خطوة التوليد،
#  فتُفكّ أثناء البناء وتُكتب نفس الملفات بالبايت ⇒ لا فرق في التطبيق الناتج أبدًا.
#
#  الحجم: ~116 كيلوبايت بدل 538  |  المخرَج: مطابق بالبايت للنسخة الكاملة (تمّ التحقّق).
#
#  كل ميزات 8.40.8 داخل هذا الملف: التركيز الدقيق (البحث لا يُركَّز) · سلسلة الرجوع الدقيقة
#  · لوحة التفاصيل الاحترافية للفيلم والمسلسل (وصف كامل + مواسم/حلقات) · «معلومات» نظيفة بلا
#  رابط/توكن خام · عجلة تحميل + إعادة تحميل سريعة عند التجمّد للأفلام والحلقات · كل إصلاحات
#  8.39 / 8.39.1 / 8.40.1 / 8.40.2 / 8.40.3 (الواي فاي، الصوت، الجلب المتوازي، التوكن…)
#  + إدارة الأقسام (ترتيب/حذف/إرجاع محفوظة) + أيقونة Rabie TV + لوحة محسّنة.
#
#  للنسخة المقروءة (الكود ظاهر داخل الملف): استعمل NovaPlay_Kotlin_Full_TV8408.yml
# ============================================================================
on:
  push:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: novaplay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_NAME: "8.40.8"
      VERSION_CODE: "8408"
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-nova-${{ hashFiles('**/*.gradle*', 'gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-nova-

    - name: Setup Android SDK
      run: |
        set -e
        if [ -z "${ANDROID_HOME:-}" ]; then export ANDROID_HOME="$HOME/android-sdk"; fi
        echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
        SDKM="$(command -v sdkmanager || true)"
        if [ -z "$SDKM" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"; fi
        if [ -z "$SDKM" ]; then
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -sSLo /tmp/clt.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q -o /tmp/clt.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest" 2>/dev/null || true
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
        fi
        yes | "$SDKM" --licenses >/dev/null 2>&1 || true
        "$SDKM" "platform-tools" "platforms;android-34" "build-tools;34.0.0" 2>&1 | tail -3 || echo "WARN: تعذّر تثبيت حزم SDK — سنستخدم ما هو مثبّت مسبقًا على الجهاز"

