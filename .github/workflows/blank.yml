        android:gravity="center"
        android:background="@drawable/bg_home_card"
        android:padding="6dp"
        android:focusable="true"
        android:clickable="true">
        <ImageView
        android:layout_width="44dp"
        android:layout_height="44dp"
        android:src="@drawable/ic_home_account"
        android:tint="#F5C542"
        android:contentDescription="حسابي"/>
        <TextView
        android:layout_width="wrap_content"
        android:layout_height="wrap_content"
        android:text="حسابي"
        android:textColor="#E8D89A"
        android:textSize="15sp"
        android:textStyle="bold"
        android:layout_marginTop="4dp"/>
        </LinearLayout>
        <LinearLayout
        android:id="@+id/btn_home_change"
        android:layout_width="0dp"
        android:layout_height="match_parent"
        android:layout_weight="1"
        android:orientation="vertical"
        android:gravity="center"
        android:background="@drawable/bg_home_card"
        android:padding="6dp"
        android:focusable="true"
        android:clickable="true">
        <ImageView
        android:layout_width="44dp"
        android:layout_height="44dp"
        android:src="@drawable/ic_home_changelist"
        android:tint="#F5C542"
        android:contentDescription="تغيير القائمة"/>
        <TextView
        android:layout_width="wrap_content"
        android:layout_height="wrap_content"
        android:text="تغيير القائمة"
        android:textColor="#E8D89A"
        android:textSize="14sp"
        android:textStyle="bold"
        android:layout_marginTop="4dp"/>
        </LinearLayout>
        </LinearLayout>
        </LinearLayout>

        <!-- العمود الجانبي -->
        <LinearLayout
        android:layout_width="0dp"
        android:layout_height="match_parent"
        android:layout_weight="0.95"
        android:layout_marginStart="10dp"
        android:orientation="vertical">

        <LinearLayout
        android:id="@+id/btn_home_settings"
        android:layout_width="match_parent"
        android:layout_height="0dp"
        android:layout_weight="1"
        android:layout_marginBottom="8dp"
        android:orientation="horizontal"
        android:gravity="center"
        android:background="@drawable/bg_home_card"
        android:padding="6dp"
        android:focusable="true"
        android:clickable="true">
        <ImageView
        android:layout_width="30dp"
        android:layout_height="30dp"
        android:src="@drawable/ic_home_settings"
        android:tint="#F5C542"
        android:contentDescription="إعدادات"/>
        <TextView
        android:layout_width="wrap_content"
        android:layout_height="wrap_content"
        android:text="إعدادات"
        android:textColor="#E8D89A"
        android:textSize="15sp"
        android:textStyle="bold"
        android:layout_marginStart="8dp"/>
        </LinearLayout>

        <LinearLayout
        android:id="@+id/btn_home_refresh"
        android:layout_width="match_parent"
        android:layout_height="0dp"
        android:layout_weight="1"
        android:layout_marginBottom="8dp"
        android:orientation="horizontal"
        android:gravity="center"
        android:background="@drawable/bg_home_card"
        android:padding="6dp"
        android:focusable="true"
        android:clickable="true">
        <ImageView
        android:layout_width="30dp"
        android:layout_height="30dp"
        android:src="@drawable/ic_home_refresh"
        android:tint="#F5C542"
        android:contentDescription="تحديث"/>
        <TextView
        android:layout_width="wrap_content"
        android:layout_height="wrap_content"
        android:text="تحديث"
        android:textColor="#E8D89A"
        android:textSize="15sp"
        android:textStyle="bold"
        android:layout_marginStart="8dp"/>
        </LinearLayout>

        <LinearLayout
        android:id="@+id/btn_home_exit"
        android:layout_width="match_parent"
        android:layout_height="0dp"
        android:layout_weight="1"
        android:orientation="horizontal"
        android:gravity="center"
        android:background="@drawable/bg_home_card"
        android:padding="6dp"
        android:focusable="true"
        android:clickable="true">
        <ImageView
        android:layout_width="30dp"
        android:layout_height="30dp"
        android:src="@drawable/ic_home_exit"
        android:tint="#F5C542"
        android:contentDescription="خروج"/>
        <TextView
        android:layout_width="wrap_content"
        android:layout_height="wrap_content"
        android:text="خروج"
        android:textColor="#E8D89A"
        android:textSize="15sp"
