        <ImageView android:layout_width="match_parent" android:layout_height="match_parent" android:src="@drawable/app_logo" android:scaleType="centerCrop"/>
        </androidx.cardview.widget.CardView>
        <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="RABIE PRO" android:textColor="#F5C542" android:textStyle="bold" android:textSize="18sp" android:layout_marginRight="10dp"/>

        <LinearLayout android:layout_width="0dp" android:layout_height="40dp" android:layout_weight="1" android:background="@drawable/bg_search_crystal" android:orientation="horizontal" android:gravity="center_vertical" android:paddingHorizontal="12dp" android:layout_marginRight="10dp">
        <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="🔍" android:textSize="14sp" android:layout_marginRight="4dp"/>
        <EditText android:id="@+id/edt_search_main" android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="1" android:background="@android:color/transparent" android:hint="بحث..." android:textColor="#FFFFFF" android:textColorHint="#88FFFFFF" android:textSize="13sp" android:singleLine="true" android:imeOptions="actionSearch"/>
        <ImageButton android:id="@+id/btn_clear_search" android:layout_width="24dp" android:layout_height="24dp" android:background="@drawable/round_btn" android:src="@android:drawable/ic_menu_close_clear_cancel" android:tint="#FFFFFF" android:visibility="gone"/>
        </LinearLayout>

        <Button android:id="@+id/tab_live" android:layout_width="wrap_content" android:layout_height="38dp" android:text="القنوات" android:textColor="#EEE" android:textSize="12sp" android:layout_marginLeft="3dp" android:focusable="true" android:background="@drawable/tab_button_style"/>
        <Button android:id="@+id/tab_movie" android:layout_width="wrap_content" android:layout_height="38dp" android:text="الأفلام" android:textColor="#EEE" android:textSize="12sp" android:layout_marginLeft="4dp" android:focusable="true" android:background="@drawable/tab_button_style"/>
        <Button android:id="@+id/tab_series" android:layout_width="wrap_content" android:layout_height="38dp" android:text="المسلسلات" android:textColor="#EEE" android:textSize="12sp" android:layout_marginLeft="4dp" android:focusable="true" android:background="@drawable/tab_button_style"/>
        <Button android:id="@+id/tab_fav" android:layout_width="44dp" android:layout_height="38dp" android:text="⭐" android:textColor="#F5C542" android:textSize="14sp" android:focusable="true" android:background="@drawable/tab_button_style" android:layout_marginLeft="4dp"/>
        <Button android:id="@+id/tab_history" android:layout_width="44dp" android:layout_height="38dp" android:text="🕐" android:textColor="#F5C542" android:textSize="14sp" android:focusable="true" android:background="@drawable/tab_button_style" android:layout_marginLeft="4dp"/>
        <Button android:id="@+id/btn_settings" android:layout_width="44dp" android:layout_height="38dp" android:text="⚙️" android:textColor="#FFF" android:textSize="14sp" android:focusable="true" android:background="@drawable/tab_button_style" android:layout_marginLeft="4dp"/>
