name: NovaPlay_TV_Light

# NovaPlay 9.0 — نسخة التلفزيون الخفيفة (com.nova.play)
# يولّد كل ملفات المشروع (Kotlin) داخل جهاز البناء ثم يبني APK وينشره تلقائيًا.
# لا ملفات مضغوطة غامضة: كل سطر الكود مرئي هنا.

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: novaplay-light-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_NAME: "9.0"
      VERSION_CODE: "900"
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-novalight-${{ hashFiles('**/*.gradle*', 'gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-novalight-

    - name: Setup Android SDK
      run: |
        set -e
        if [ -z "${ANDROID_HOME:-}" ]; then export ANDROID_HOME="$HOME/android-sdk"; fi
        echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
        SDKM="$(command -v sdkmanager || true)"
        if [ -z "$SDKM" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"; fi
        if [ -z "$SDKM" ]; then
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -sSLo /tmp/clt.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q -o /tmp/clt.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest" 2>/dev/null || true
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
        fi
        yes | "$SDKM" --licenses >/dev/null 2>&1 || true
        "$SDKM" "platform-tools" "platforms;android-34" "build-tools;34.0.0" 2>&1 | tail -3 || echo "WARN: تعذّر تثبيت حزم SDK"

    - name: Generate project (Kotlin + resources)
      run: |
        set -e
        rm -rf app build.gradle settings.gradle gradle.properties .gitignore README.md
        mkdir -p app/src/main/java/com/nova/play
        mkdir -p app/src/main/res/drawable app/src/main/res/layout app/src/main/res/values app/src/main/res/xml
        cat <<'NP_F_SETTINGS' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "NovaPlay"
        include ':app'
        NP_F_SETTINGS
        cat <<'NP_F_PROPS' > gradle.properties
        org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
        org.gradle.daemon=true
        org.gradle.parallel=true
        android.useAndroidX=true
        android.enableR8.fullMode=false
        kotlin.code.style=official
        NP_F_PROPS
        cat <<'NP_F_GITIGNORE' > .gitignore
        *.iml
        .gradle
        /local.properties
        /.idea
        .DS_Store
        /build
        /captures
        app/build
        app/release
        NP_F_GITIGNORE
        cat <<'NP_F_CORE' > app/src/main/java/com/nova/play/Core.kt
        package com.nova.play

        import android.app.Activity
        import android.content.Context
        import android.content.SharedPreferences
        import android.os.Handler
        import android.os.Looper
        import android.view.View
        import android.view.inputmethod.InputMethodManager
        import android.widget.EditText
        import android.widget.TextView
        import android.widget.Toast
        import android.app.AlertDialog
        import org.json.JSONArray
        import org.json.JSONObject
        import java.io.ByteArrayOutputStream
        import java.io.File
        import java.net.HttpURLConnection
        import java.net.URL
        import java.util.Locale
        import java.util.concurrent.Executors
        import java.util.concurrent.LinkedBlockingQueue
        import java.util.zip.GZIPInputStream
        import kotlin.math.abs

        /* =====================================================================
         *  NovaPlay TV-Light 9.0 — النواة: نماذج + أدوات + سجل + شبكة + تخزين
         *  قاعدة ذهبية في هذه النسخة: لا شيء ثقيل يعمل على الخيط الرئيسي،
         *  ولا بيانات كبيرة تُحفظ في SharedPreferences.
         * ===================================================================== */

        /* --------------------------------- النماذج --------------------------------- */

        class Channel {
            var num = 0
            var name = ""
            var url = ""      // رابط تشغيل (أو أمر بوابة قبل الحل)
            var cmd = ""      // أمر البوابة الخام (Stalker) إن وُجد
            var alt = ""      // مصدر بديل
            var group = "عام"
            var kind = "live" // live | movie | series | season | episode
            var id = ""
            var catId = ""
            var logo = ""
            var extra = ""
            var mid = ""      // معرّف المسلسل/الفلم عند البوابة
            var sid = ""      // معرّف الموسم
            var snum = 0      // رقم الموسم
            var epgId = ""

            fun toJson(): JSONObject = JSONObject().apply {
                put("n", num); put("t", name); put("u", stripToken(url)); put("c", cmd)
                put("g", group); put("k", kind); put("i", id); put("ci", catId)
                put("l", logo); put("x", extra.take(180)); put("m", mid); put("s", sid); put("sn", snum)
            }

            companion object {
                fun fromJson(o: JSONObject) = Channel().apply {
                    num = o.optInt("n"); name = o.optString("t"); url = stripToken(o.optString("u"))
                    cmd = o.optString("c"); group = o.optString("g", "عام"); kind = o.optString("k", "live")
                    id = o.optString("i"); catId = o.optString("ci"); logo = o.optString("l")
                    extra = o.optString("x"); mid = o.optString("m"); sid = o.optString("s"); snum = o.optInt("sn")
                }

                /** نزع التوكن قبل أي حفظ (التوكن قصير العمر ويُطلب جديدًا عند الحاجة). */
                fun stripToken(u: String): String {
                    if (u.isBlank() || !u.contains("play_token=")) return u
                    var s = u.replace(Regex("([?&])play_token=[^&]*"), "$1")
                    while (s.contains("?&")) s = s.replace("?&", "?")
                    while (s.endsWith("&") || s.endsWith("?")) s = s.dropLast(1)
                    return s
                }

                fun hasToken(u: String) = u.contains("play_token=")

                /** روابط البوابة من نوع /play/... تحتاج توكنًا حيًا. */
                fun isPortalPlay(u: String): Boolean {
                    val l = u.lowercase()
                    if (!l.contains("/play/")) return false
                    return l.contains("live.php") || l.contains("movie.php") || l.contains("series.php")
                }

                /** رابط ميت: stream فارغ أو "." (بوابات كثيرة ترد 200 مع رابط فارغ). */
                fun broken(u: String): Boolean {
                    if (u.isBlank()) return true
                    val l = u.lowercase()
                    if (!l.contains("stream=")) return false
                    val v = Regex("[?&]stream=([^&]*)").find(u)?.groupValues?.get(1) ?: return true
                    val s = v.trim()
                    return s.isEmpty() || s == "." || s == "%2e" || s == "null"
                }

                fun direct(u: String): Boolean {
                    if (u.isBlank()) return false
                    val l = u.lowercase()
                    if (l.contains("localhost") || l.contains("127.0.0.1")) return false
                    return l.startsWith("http://") || l.startsWith("https://") || l.startsWith("rtsp://") || l.startsWith("udp://")
                }
            }
        }

        class Group {
            var id = ""
            var name = ""
            var count = 0
            var special = ""
        }

        class Profile {
            var name = ""
            var type = "m3u"          // m3u | xtream | mac
            var url = ""
            var user = ""
            var pass = ""
            var mac = ""

            fun key(): String = abs((type + "|" + url + "|" + user + "|" + mac).hashCode()).toString(16)

            fun toJson(): JSONObject = JSONObject().apply {
                put("name", name); put("type", type); put("url", url); put("user", user); put("pass", pass); put("mac", mac)
            }

            companion object {
                fun fromJson(o: JSONObject) = Profile().apply {
                    name = o.optString("name"); type = o.optString("type", "m3u"); url = o.optString("url")
                    user = o.optString("user"); pass = o.optString("pass"); mac = o.optString("mac")
                }
            }
        }

        class Ota {
            var code = 0L
            var name = ""
            var url = ""
            var note = ""
            fun valid() = url.startsWith("http") && (code > 0 || name.isNotBlank())
        }

        /* ------------------------------ JSON للقوائم ------------------------------ */

        fun chansToJson(list: List<Channel>): String {
            val a = JSONArray()
            for (c in list) a.put(c.toJson())
            return a.toString()
        }

        fun chansFromJson(text: String?, out: MutableList<Channel>) {
            out.clear()
            if (text.isNullOrBlank()) return
            try {
                val a = JSONArray(text)
                for (i in 0 until a.length()) out.add(Channel.fromJson(a.getJSONObject(i)))
            } catch (t: Throwable) {
                Diag.e(t)
            }
        }

        fun groupsToJson(list: List<Group>): String {
            val a = JSONArray()
            for (g in list) a.put(JSONObject().apply { put("i", g.id); put("n", g.name); put("c", g.count) })
            return a.toString()
        }

        fun groupsFromJson(text: String?, out: MutableList<Group>) {
            out.clear()
            if (text.isNullOrBlank()) return
            try {
                val a = JSONArray(text)
                for (i in 0 until a.length()) {
                    val o = a.getJSONObject(i)
                    out.add(Group().apply { id = o.optString("i"); name = o.optString("n"); count = o.optInt("c") })
                }
            } catch (t: Throwable) {
                Diag.e(t)
            }
        }

        /* ------------------------------ الإعدادات (صغيرة فقط) ------------------------------ */

        val Context.sp: SharedPreferences get() = getSharedPreferences("nova", Context.MODE_PRIVATE)
        fun SharedPreferences.s(k: String, d: String = ""): String = getString(k, d) ?: d
        fun SharedPreferences.i(k: String, d: Int = 0): Int = getInt(k, d)
        fun SharedPreferences.l(k: String, d: Long = 0L): Long = getLong(k, d)
        fun SharedPreferences.b(k: String, d: Boolean = false): Boolean = getBoolean(k, d)
        fun SharedPreferences.put(k: String, v: String?) = edit().putString(k, v).apply()
        fun SharedPreferences.put(k: String, v: Int) = edit().putInt(k, v).apply()
        fun SharedPreferences.put(k: String, v: Long) = edit().putLong(k, v).apply()
        fun SharedPreferences.put(k: String, v: Boolean) = edit().putBoolean(k, v).apply()

        /* --------------------------------- السجل ---------------------------------
         *  حلقة في الذاكرة + كتابة على خيط منفصل. لا قرص ولا تنسيق نص على الخيط الرئيسي.
         * ------------------------------------------------------------------------ */

        object Diag {
            private const val MAX = 300
            private val ring = ArrayList<String>(MAX)
            private val q = LinkedBlockingQueue<String>()
            private var out: File? = null
            @Volatile private var started = false

            fun init(ctx: Context) {
                if (started) return
                started = true
                out = File(ctx.filesDir, "nova.log")
                Thread {
                    while (true) {
                        try {
                            val line = q.take()
                            val f = out ?: continue
                            try {
                                if (f.length() > 120_000) f.writeText("")
                                f.appendText(line + "\n")
                            } catch (_: Throwable) {
                            }
                        } catch (_: Throwable) {
                        }
                    }
                }.apply { isDaemon = true; name = "nova-log" }.start()
            }

            fun d(tag: String, msg: String) {
                val line = "[$tag] $msg"
                synchronized(ring) {
                    if (ring.size >= MAX) ring.removeAt(0)
                    ring.add(line)
                }
                q.offer(line)
            }

            fun e(t: Throwable) {
                d("ERR", (t.javaClass.simpleName + ": " + (t.message ?: "") + " @ " + (t.stackTrace.firstOrNull()?.toString() ?: "-")))
            }

            fun text(): String {
                val s = synchronized(ring) { ring.joinToString("\n") }
                return s.ifBlank { "لا يوجد سجل بعد." }
            }

            fun clear(ctx: Context) {
                synchronized(ring) { ring.clear() }
                try { File(ctx.filesDir, "nova.log").delete() } catch (_: Throwable) {}
            }
        }

        /* ------------------------------ الخيوط ------------------------------ */

        object Bg {
            val pool = Executors.newFixedThreadPool(2)
            val io = Executors.newSingleThreadExecutor()
            private val main = Handler(Looper.getMainLooper())
            fun ui(block: () -> Unit) {
                main.post { try { block() } catch (t: Throwable) { Diag.e(t) } }
            }

            fun run(block: () -> Unit) {
                pool.execute { try { block() } catch (t: Throwable) { Diag.e(t) } }
            }
        }

        /* ------------------------------ الشبكة ------------------------------ */

        object Http {
            const val UA = "Mozilla/5.0 (Linux; Android 11; NovaPlay/9.0) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120 Mobile Safari/537.36"
            const val UA_STB = "Mozilla/5.0 (QtEmbedded; U; Linux; C) AppleWebKit/533.3 (KHTML, like Gecko) MAG250 STB"

            fun get(url: String, headers: Map<String, String> = emptyMap(), timeoutMs: Int = 12000, retries: Int = 1): String {
                var last: Throwable? = null
                for (attempt in 0..retries) {
                    var c: HttpURLConnection? = null
                    try {
                        c = (URL(url).openConnection() as HttpURLConnection)
                        c.connectTimeout = timeoutMs
                        c.readTimeout = timeoutMs + 5000
                        c.instanceFollowRedirects = true
                        c.setRequestProperty("User-Agent", UA)
                        c.setRequestProperty("Accept-Encoding", "gzip")
                        c.setRequestProperty("Connection", "close")
                        for ((k, v) in headers) c.setRequestProperty(k, v)
                        val code = c.responseCode
                        if (code !in 200..299) throw java.io.IOException("HTTP $code")
                        val raw = c.inputStream
                        val enc = try { c.contentEncoding ?: "" } catch (t: Throwable) { "" }
                        val stream = if (enc.equals("gzip", true)) GZIPInputStream(raw) else raw
                        return stream.bufferedReader(Charsets.UTF_8).use { it.readText() }
                    } catch (t: Throwable) {
                        last = t
                        try { c?.disconnect() } catch (_: Throwable) {}
                        if (attempt < retries) try { Thread.sleep(250L * (attempt + 1)) } catch (_: Throwable) {}
                    }
                }
                throw last ?: java.io.IOException("فشل الاتصال")
            }

            fun bytes(url: String, onProgress: ((Long, Long) -> Unit)? = null): ByteArray {
                val c = (URL(url).openConnection() as HttpURLConnection)
                try {
                    c.connectTimeout = 20000
                    c.readTimeout = 60000
                    c.instanceFollowRedirects = true
                    c.setRequestProperty("User-Agent", UA)
                    val code = c.responseCode
                    if (code !in 200..299) throw java.io.IOException("HTTP $code")
                    val total = c.contentLengthLong
                    val out = ByteArrayOutputStream(if (total in 1..8_388_608) total.toInt() else 1 shl 16)
                    val buf = ByteArray(64 * 1024)
                    var done = 0L
                    c.inputStream.use { ins ->
                        while (true) {
                            val n = ins.read(buf)
                            if (n < 0) break
                            out.write(buf, 0, n)
                            done += n
                            onProgress?.invoke(done, if (total > 0) total else -1L)
                        }
                    }
                    return out.toByteArray()
                } finally {
                    try { c.disconnect() } catch (_: Throwable) {}
                }
            }

            fun head(url: String): Int = try {
                val c = (URL(url).openConnection() as HttpURLConnection)
                c.requestMethod = "HEAD"
                c.connectTimeout = 8000
                c.readTimeout = 8000
                val code = c.responseCode
                c.disconnect()
                code
            } catch (t: Throwable) { -1 }
        }

        /* ------------------------------ تخزين على القرص (كاش خفيف) ------------------------------ */

        object Disk {
            private fun dir(ctx: Context) = File(ctx.cacheDir, "pg").apply { mkdirs() }

            fun page(ctx: Context, p: Profile, key: String): File = File(dir(ctx), p.key() + "_" + key + ".json")

            fun read(f: File, ttlMs: Long = 12L * 3600_000L): String? {
                return try {
                    if (!f.exists()) return null
                    if (System.currentTimeMillis() - f.lastModified() > ttlMs) return null
                    f.readText()
                } catch (t: Throwable) { null }
            }

            fun write(f: File, text: String) {
                Bg.io.execute {
                    try {
                        f.parentFile?.mkdirs()
                        val tmp = File(f.absolutePath + ".tmp")
                        tmp.writeText(text)
                        if (f.exists()) f.delete()
                        tmp.renameTo(f)
                    } catch (_: Throwable) {}
                }
            }

            fun clear(ctx: Context) {
                Bg.io.execute { try { dir(ctx).deleteRecursively(); dir(ctx).mkdirs() } catch (_: Throwable) {} }
            }

            fun size(ctx: Context): Long = try { dir(ctx).walkTopDown().filter { it.isFile }.sumOf { it.length() } } catch (t: Throwable) { 0L }
        }

        /** مفضلة + أماكن المشاهدة: ملف JSON صغير في filesDir (ليس SharedPreferences). */
        object Store {
            private val favCache = ArrayList<Channel>()
            private var favLoaded = false
            private val posCache = HashMap<String, Long>()
            private var posLoaded = false

            private fun favFile(ctx: Context) = File(ctx.filesDir, "favs.json")
            private fun posFile(ctx: Context) = File(ctx.filesDir, "resume.json")

            @Synchronized
            fun favs(ctx: Context): MutableList<Channel> {
                if (!favLoaded) {
                    favLoaded = true
                    try { chansFromJson(favFile(ctx).readText(), favCache) } catch (_: Throwable) {}
                }
                return favCache
            }

            @Synchronized
            fun saveFavs(ctx: Context) {
                val txt = chansToJson(favCache)
                Bg.io.execute { try { favFile(ctx).writeText(txt) } catch (_: Throwable) {} }
            }

            @Synchronized
            fun isFav(ctx: Context, c: Channel): Boolean {
                val key = favKey(c)
                return favs(ctx).any { favKey(it) == key }
            }

            @Synchronized
            fun toggleFav(ctx: Context, c: Channel): Boolean {
                val list = favs(ctx)
                val key = favKey(c)
                val i = list.indexOfFirst { favKey(it) == key }
                if (i >= 0) { list.removeAt(i); saveFavs(ctx); return false }
                list.add(0, c); if (list.size > 300) list.subList(300, list.size).clear()
                saveFavs(ctx)
                return true
            }

            fun favKey(c: Channel): String =
                if (c.id.isNotBlank()) "i" + c.kind + c.id else "u" + (c.url.ifBlank { c.cmd })

            @Synchronized
            fun pos(ctx: Context, key: String): Long {
                if (!posLoaded) {
                    posLoaded = true
                    try {
                        val o = JSONObject(posFile(ctx).readText())
                        for (k in o.keys()) posCache[k] = o.optLong(k)
                    } catch (_: Throwable) {}
                }
                return posCache[key] ?: 0L
            }

            @Synchronized
            fun setPos(ctx: Context, key: String, v: Long) {
                posCache[key] = v
                val snap = JSONObject()
                for ((k, value) in posCache) if (value > 15000L) snap.put(k, value)
                val txt = snap.toString()
                Bg.io.execute { try { posFile(ctx).writeText(txt) } catch (_: Throwable) {} }
            }

            fun clearPos(ctx: Context) {
                posCache.clear()
                Bg.io.execute { try { posFile(ctx).delete() } catch (_: Throwable) {} }
            }
        }

        /* --------------------------------- أدوات --------------------------------- */

        fun Context.toast(m: String) = try { Toast.makeText(this, m, Toast.LENGTH_SHORT).show() } catch (_: Throwable) {}
        fun Context.toastLong(m: String) = try { Toast.makeText(this, m, Toast.LENGTH_LONG).show() } catch (_: Throwable) {}

        fun fmtTime(ms: Long): String {
            if (ms <= 0) return "0:00"
            val total = ms / 1000
            val h = total / 3600
            val m = (total % 3600) / 60
            val s = total % 60
            return if (h > 0) String.format(Locale.US, "%d:%02d:%02d", h, m, s)
            else String.format(Locale.US, "%d:%02d", m, s)
        }

        fun fmtBytes(n: Long): String = when {
            n <= 0 -> "0 B"
            n < 1024 -> "$n B"
            n < 1048576 -> String.format(Locale.US, "%.1f KB", n / 1024.0)
            n < 1073741824 -> String.format(Locale.US, "%.1f MB", n / 1048576.0)
            else -> String.format(Locale.US, "%.2f GB", n / 1073741824.0)
        }

        fun appVersion(ctx: Context): String = try {
            val pi = ctx.packageManager.getPackageInfo(ctx.packageName, 0)
            (pi.versionName ?: "?") + " (" + pi.versionCode + ")"
        } catch (t: Throwable) { "?" }

        fun appCode(ctx: Context): Long = try {
            val pi = ctx.packageManager.getPackageInfo(ctx.packageName, 0)
            pi.versionCode.toLong()
        } catch (t: Throwable) { 0L }

        fun tail(u: String, n: Int = 150): String = if (u.length <= n) u else u.substring(0, n)

        fun Activity.goImmersive() {
            try {
                if (android.os.Build.VERSION.SDK_INT >= 30) {
                    window.setDecorFitsSystemWindows(false)
                    window.insetsController?.let {
                        it.hide(android.view.WindowInsets.Type.systemBars())
                        it.systemBarsBehavior = android.view.WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                    }
                } else {
                    @Suppress("DEPRECATION")
                    window.decorView.systemUiVisibility = (
                        View.SYSTEM_UI_FLAG_LAYOUT_STABLE or View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                            or View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN or View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                            or View.SYSTEM_UI_FLAG_FULLSCREEN or View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY)
                }
            } catch (t: Throwable) { Diag.e(t) }
        }

        fun Context.isTv(): Boolean = try {
            packageManager.hasSystemFeature(android.content.pm.PackageManager.FEATURE_LEANBACK) ||
                packageManager.hasSystemFeature("android.software.live_tv")
        } catch (t: Throwable) { false }

        fun Activity.hideKeyboard(v: View?) {
            val imm = getSystemService(Context.INPUT_METHOD_SERVICE) as? InputMethodManager ?: return
            if (v != null) imm.hideSoftInputFromWindow(v.windowToken, 0)
        }

        fun Activity.showKeyboard(v: EditText?) {
            if (v == null) return
            v.requestFocus()
            val imm = getSystemService(Context.INPUT_METHOD_SERVICE) as? InputMethodManager
            imm?.showSoftInput(v, InputMethodManager.SHOW_IMPLICIT)
        }

        fun Activity.inputDialog(
            title: String,
            hint1: String,
            v1: String = "",
            hint2: String? = null,
            v2: String = "",
            msg: String? = null,
            onOk: (String, String) -> Unit
        ) {
            val v = layoutInflater.inflate(R.layout.dialog_input, null)
            v.findViewById<TextView>(R.id.d_title).text = title
            val in1 = v.findViewById<EditText>(R.id.d_in1)
            val in2 = v.findViewById<EditText>(R.id.d_in2)
            val m = v.findViewById<TextView>(R.id.d_msg)
            in1.hint = hint1; in1.setText(v1)
            if (hint2 != null) { in2.visibility = View.VISIBLE; in2.hint = hint2; in2.setText(v2) }
