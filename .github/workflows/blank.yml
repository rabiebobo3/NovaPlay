              private inner class ChAdapter(var data: List<Channel>) : RecyclerView.Adapter<VH>() {
                  override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): VH =
                      VH(layoutInflater.inflate(R.layout.item_channel, parent, false))

                  override fun getItemCount(): Int = data.size

                  fun setData(list: List<Channel>) { data = list; notifyDataSetChanged() }

                  override fun onBindViewHolder(holder: VH, position: Int) {
                      val c = data.getOrNull(position) ?: return
                      val v = holder.itemView
                      (v.findViewById<TextView>(R.id.c_num)).text = if (c.num > 0) c.num.toString() else (position + 1).toString()
                      (v.findViewById<TextView>(R.id.c_name)).text = c.name
                      val flag = v.findViewById<TextView>(R.id.c_flag)
                      if (isFav(c)) { flag.text = "★"; flag.visibility = View.VISIBLE } else { flag.text = ""; flag.visibility = View.GONE }
                      val logo = v.findViewById<ImageView>(R.id.c_logo)
                      val art = if (c.logo.isNotBlank()) c.logo else if (c.art.isNotBlank()) c.art else ""
                      if (art.isNotBlank()) Glide.with(v.context).load(art).override(64, 64).into(logo)
                      else Glide.with(v.context).clear(logo)
                      val on = cur != null && sameChan(cur!!, c)
                      v.alpha = if (on) 1f else 0.88f
                      v.setOnClickListener { startPlay(c, true) }
                      v.setOnLongClickListener { toggleFav(c); true }
                      v.setOnFocusChangeListener { _, has -> if (has && !built) { } }
                  }
              }

              private inner class GrAdapter : RecyclerView.Adapter<VH>() {
                  override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): VH =
                      VH(layoutInflater.inflate(R.layout.item_row, parent, false))

                  override fun getItemCount(): Int = groups.size

                  override fun onBindViewHolder(holder: VH, position: Int) {
                      val g = groups.getOrNull(position) ?: return
                      val v = holder.itemView
                      (v.findViewById<TextView>(R.id.g_name)).text = g.name
                      val c = if (g.count > 0) g.count.toString() else ""
                      (v.findViewById<TextView>(R.id.g_count)).text = c
                      v.setOnClickListener { openGroup(g) }
                  }
              }

