              fun onRebuffer(c: Channel?) {
                  try {
                      val o = perfOf(c)
                      val b = o.optLong("b", 8000L); val t = o.optLong("t", 8000L); val rb = o.optInt("rb", 0) + 1
                      if (rb >= 2) {
