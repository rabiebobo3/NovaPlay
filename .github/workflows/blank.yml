        <LinearLayout
        android:id="@+id/btn_home_movies"
        android:layout_width="0dp"
        android:layout_height="match_parent"
        android:layout_weight="1"
        android:layout_marginEnd="8dp"
        android:layout_marginBottom="8dp"
        android:orientation="vertical"
        android:gravity="center"
        android:background="@drawable/bg_home_card"
        android:padding="6dp"
        android:focusable="true"
        android:clickable="true">
        <ImageView
        android:layout_width="44dp"
        android:layout_height="44dp"
        android:src="@drawable/ic_home_movies"
        android:tint="#F5C542"
        android:contentDescription="أفلام"/>
        <TextView
        android:layout_width="wrap_content"
        android:layout_height="wrap_content"
        android:text="أفلام"
        android:textColor="#E8D89A"
        android:textSize="15sp"
        android:textStyle="bold"
        android:layout_marginTop="4dp"/>
        </LinearLayout>
        <LinearLayout
        android:id="@+id/btn_home_series"
        android:layout_width="0dp"
        android:layout_height="match_parent"
        android:layout_weight="1"
        android:layout_marginBottom="8dp"
        android:orientation="vertical"
        android:gravity="center"
        android:background="@drawable/bg_home_card"
        android:padding="6dp"
        android:focusable="true"
        android:clickable="true">
        <ImageView
        android:layout_width="44dp"
        android:layout_height="44dp"
        android:src="@drawable/ic_home_series"
        android:tint="#F5C542"
        android:contentDescription="مسلسلات"/>
        <TextView
        android:layout_width="wrap_content"
        android:layout_height="wrap_content"
        android:text="مسلسلات"
        android:textColor="#E8D89A"
        android:textSize="15sp"
        android:textStyle="bold"
        android:layout_marginTop="4dp"/>
