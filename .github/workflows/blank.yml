              /* ================================ المشغّل ================================ */

              private fun buildPlayer() {
                  val hdr = HashMap<String, String>()
                  hdr["Accept"] = "*/*"
                  hdr.putAll(Stalker.playHeaders(Catalog.profile))
                  val http = DefaultHttpDataSource.Factory()
                      .setUserAgent(if (Catalog.profile?.type == "mac") Stalker.UA_STB else Http.UA)
                      .setAllowCrossProtocolRedirects(true)
                      .setConnectTimeoutMs(12000)
                      .setReadTimeoutMs(20000)
                      .setDefaultRequestProperties(hdr)
                  val load = DefaultLoadControl.Builder()
                      .setBufferDurationsMs(2500, 20000, 500, 1200)
                      .setBackBuffer(3000, true)
                      .setPrioritizeTimeOverSizeThresholds(true)
                      .build()
                  val p = ExoPlayer.Builder(this)
                      .setMediaSourceFactory(DefaultMediaSourceFactory(http))
                      .setLoadControl(load)
                      .setSeekBackIncrementMs(10000L)
                      .setSeekForwardIncrementMs(10000L)
                      .setHandleAudioBecomingNoisy(true)
                      .build()
                  p.playWhenReady = true
                  player = p
                  pv.player = p
                  pv.useController = true
                  p.addListener(this)
              }

              private fun setupCast() {
                  try {
                      val sel = MediaRouteSelector.Builder()
                          .addControlCategory(MediaControlIntent.CATEGORY_REMOTE_PLAYBACK)
                          .addControlCategory(MediaControlIntent.CATEGORY_LIVE_VIDEO)
                          .addControlCategory(MediaControlIntent.CATEGORY_LIVE_AUDIO)
                          .build()
                      castBtn.routeSelector = sel
                  } catch (t: Throwable) { Crash.log(t) }
              }

              /** رقم آخر ضغطة: أي رد قديم (قناة سابقة) لا يقطع تشغيل ما ضغط عليه المستخدم للتو. */
              private var playSeq = 0

              private fun play(c: Channel, full0: Boolean) {
                  playSeq++
                  val mySeq = playSeq
                  stopAllPlayback()
                  cur = c
                  retries = 0
                  usingAlt = false
                  pushRecent(c)
                  val url = c.url.ifBlank { c.alt }
                  if (url.startsWith("rtmp") || url.startsWith("mms")) { openExternal(url); return }
                  val p = Catalog.profile
                  // MAC: كل تشغيل يمرّ عبر البوابة (create_link) — حتى لو كان الأمر يبدو رابطًا كاملًا،
                  // لأن أوامر كثير من البوابات تكون مثل http://localhost/ch/12_ ولا تعمل بلا create_link.
                  if (p?.type == "mac") {
                      if (url.isBlank()) { toast("لا يوجد أمر تشغيل لهذا العنصر"); return }
                      busy(true, "تجهيز رابط البوابة…")
                      Loader.macPlayable(p, c.kind, url, c.mid, c.sid, c.id) { u ->
                          if (mySeq != playSeq) return@macPlayable     // ضغط المستخدم على عنصر آخر
                          try {
                              busy(false, "")
                              val fin = if (u.startsWith("http") || u.startsWith("rtsp") || u.startsWith("udp")) u
                                        else if (u.startsWith("rtmp") || u.startsWith("mms")) { openExternal(u); "" }
                                        else u
                              if (fin.isBlank()) { toast("البوابة لم تُرجع رابطًا صالحًا"); return@macPlayable }
                              c.url = fin
                              startPlayback(c, fin, full0)
                          } catch (t: Throwable) {
                              try { busy(false, "") } catch (e: Throwable) {}
                              Crash.log(t)
                              toast("تعذر التشغيل: " + (t.message ?: t.javaClass.simpleName))
                          }
                      }
                      return
                  }
                  if (url.isBlank()) { toast("لا يوجد رابط تشغيل لهذا العنصر"); return }
                  startPlayback(c, url, full0)
              }

              /** غلاف آمن للضغط على القناة: أي خطأ يظهر كتنبيه ولا يُغلق التطبيق. */
              private fun playSafe(c: Channel, asFull: Boolean) {
                  try { play(c, asFull) } catch (t: Throwable) {
                      try { busy(false, "") } catch (e: Throwable) {}
                      Crash.log(t)
                      toast("تعذر التشغيل: " + (t.message ?: t.javaClass.simpleName))
                  }
              }

              private fun openExternal(u: String) {
                  if (u.isBlank()) return
                  try {
                      val i = Intent(Intent.ACTION_VIEW)
                      i.setDataAndType(Uri.parse(u), "video/*")
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      startActivity(Intent.createChooser(i, "تشغيل خارجيًا (RTMP)"))
                  } catch (t: Throwable) { toast("لا يوجد مشغّل خارجي لهذا الرابط") }
              }

              /** يوقف أي صوت/فيديو سابق فورًا قبل تشغيل عنصر جديد. */
              private fun stopAllPlayback() {
                  try { pv.player = null } catch (t: Throwable) {}
                  try { pvFull.player = null } catch (t: Throwable) {}
                  try { player?.pause() } catch (t: Throwable) {}
                  try { player?.stop() } catch (t: Throwable) {}
                  try { player?.clearMediaItems() } catch (t: Throwable) {}
              }

              private fun startPlayback(c: Channel, url: String, asFull: Boolean) {
                  val p = player ?: return
                  infoName.text = c.name
                  infoSub.text = listOfNotNull(
                      if (c.group.isBlank()) null else c.group,
                      when (c.kind) { "live" -> "بث مباشر"; "movie" -> "فيلم"; "series" -> "مسلسل"; "episode" -> "حلقة"; else -> c.kind }
                  ).joinToString(" • ")
                  infoDesc.text = "بانتظار البيانات…"
                  val mime = when {
                      url.contains(".m3u8", true) -> "application/x-mpegURL"
                      url.contains(".mpd", true) -> "application/dash+xml"
                      else -> null
                  }
                  val meta = MediaMetadata.Builder().setTitle(c.name).build()
                  val item = MediaItem.Builder().setUri(url).setMediaMetadata(meta)
                      .setMimeType(mime).setTag(c.name).build()
                  p.stop()
                  p.setMediaItem(item)
                  p.prepare()
                  p.playWhenReady = true
                  pv.player = p
                  if (full) pvFull.player = p
                  if (asFull && !full) toggleFull(true)
                  if (!full) { dockBusy.visibility = View.VISIBLE; tvLoadPct.text = "0%" }
                  else { fullBusy.visibility = View.VISIBLE; tvFullPct.text = "0%" }
                  armWd()
                  fetchEpg(c)
                  chanAdapter.notifyDataSetChanged()
                  showPip(true)
              }

              private fun playAlt() {
                  val c = cur ?: return
                  if (c.alt.isBlank() || c.alt == c.url) { toast("لا يوجد مصدر بديل"); return }
                  usingAlt = true
                  retries = 0
                  infoDesc.text = "تجربة المصدر البديل…"
                  val item = MediaItem.Builder().setUri(c.alt).setMediaMetadata(MediaMetadata.Builder().setTitle(c.name).build()).build()
                  player?.stop(); player?.setMediaItem(item); player?.prepare(); player?.play()
                  armWd(); toast("المصدر البديل قيد التجربة")
              }

              private fun toggleFull(on: Boolean) {
                  full = on
                  val p = player ?: return
                  if (on) {
                      fullBox.visibility = View.VISIBLE
                      goImmersive()
                      try { PlayerView.switchTargetView(p, pv, pvFull) } catch (t: Throwable) { Crash.log(t) }
                      pvFull.resizeMode = androidx.media3.ui.AspectRatioFrameLayout.RESIZE_MODE_FIT
                      pvFull.useController = false
                      fullTitle.text = cur?.name ?: ""
                      findViewById<View>(R.id.fullBar)?.requestFocus()
                      hideBarsSoon()
                  } else {
                      fullBox.visibility = View.GONE
                      try { PlayerView.switchTargetView(p, pvFull, pv) } catch (t: Throwable) { Crash.log(t) }
                  }
              }

              private fun hideBarsSoon() {
                  h.removeCallbacks(hideBar)
                  h.postDelayed(hideBar, if (tv) 2600 else 4000)
              }

              private val hideBar = Runnable {
                  if (full && player?.isPlaying == true) {
                      val bar = findViewById<View>(R.id.fullBar)
                      bar.animate().alpha(0f).setDuration(250).withEndAction { bar.visibility = View.GONE }.start()
                  }
              }

              private fun showBars() {
                  val bar = findViewById<LinearLayout>(R.id.fullBar)
                  bar.visibility = View.VISIBLE
                  bar.alpha = 1f
                  hideBarsSoon()
              }

              /* ================================ SmartLoad ================================ */

              override fun onPlaybackStateChanged(state: Int) {
                  val p = player ?: return
                  when (state) {
                      Player.STATE_BUFFERING -> {
                          if (full) { fullBusy.visibility = View.VISIBLE; findViewById<TextView>(R.id.tv_full_txt).text = "SmartLoad — تجميع البيانات" }
                          else { dockBusy.visibility = View.VISIBLE; tvLoadTxt.text = "SmartLoad — تجميع البيانات" }
                      }
                      Player.STATE_READY -> {
                          dockBusy.visibility = View.GONE
                          fullBusy.visibility = View.GONE
                          clearWd()
                          retries = 0
                          val dur = p.duration
                          val vod = dur > 0 && dur != C.TIME_UNSET
                          dockSeek.visibility = if (vod) View.VISIBLE else View.GONE
                          val bar = findViewById<LinearLayout>(R.id.fullBar)
                          bar.visibility = if (vod) View.VISIBLE else View.INVISIBLE
                          sbDock.max = (dur / 1000).toInt().coerceAtLeast(0)
                          sbFull.max = sbDock.max
                          tvDur.text = fmtTime(dur)
                          tvFullDur.text = fmtTime(dur)
                          if (vod && infoDesc.text.toString().startsWith("بانتظار")) infoDesc.text = descOf(cur)
                      }
                      Player.STATE_ENDED -> {
                          dockBusy.visibility = View.GONE; fullBusy.visibility = View.GONE
                          if (autoNext) next(true) else toast("انتهى العرض")
                      }
                      else -> {}
                  }
              }

              override fun onIsPlayingChanged(isPlaying: Boolean) {
                  if (isPlaying) {
                      dockBusy.visibility = View.GONE; fullBusy.visibility = View.GONE
                      wdBar.visibility = View.GONE
                      clearWd()
                  }
              }

              override fun onVideoSizeChanged(size: VideoSize) {
                  fullQual.text = if (size.width > 0) "${size.width}×${size.height}" else ""
              }

              override fun onPlayerError(e: PlaybackException) {
                  val p = player ?: return
                  retries++
                  val smartAlt = sp.b("smart_alt", true)
                  val canAlt = !usingAlt && smartAlt && (cur?.alt?.isNotBlank() == true) && cur?.alt != cur?.url
                  val msg = e.errorCodeName
                  if (canAlt) { playAlt(); return }
                  if (retries <= 3) {
                      val wait = 700L * retries
                      tvLoadTxt.text = "انقطاع ($msg) — إعادة محاولة $retries/3 بعد ${wait}ms"
                      dockBusy.visibility = View.VISIBLE
                      h.postDelayed({ if (!isFinishing && !isDestroyed) { p.prepare(); p.play() }; armWd() }, wait)
                  } else {
                      dockBusy.visibility = View.GONE
                      tvWd.text = "فشل التشغيل: $msg — جرّب مصدرًا بديلًا أو أعد التحميل"
                      wdBar.visibility = View.VISIBLE
                  }
              }

              private fun startTicker() {
                  stopTicker()
                  val r = object : Runnable {
                      override fun run() {
                          tick()
                          ticker = this
                          h.postDelayed(this, 500)
                      }
                  }
                  ticker = r
                  h.postDelayed(r, 500)
              }

              private fun stopTicker() {
                  ticker?.let { h.removeCallbacks(it) }
                  ticker = null
              }

              private fun tick() {
                  val p = player ?: return
                  if (p.playbackState == Player.STATE_BUFFERING) {
                      val pct = p.bufferedPercentage
                      val txt = "$pct%"
                      tvLoadPct.text = txt
                      tvFullPct.text = txt
                  }
                  val dur = p.duration
                  if (dur > 0 && dur != C.TIME_UNSET && !userSeeking) {
                      val pos = p.currentPosition
                      sbDock.progress = (pos / 1000).toInt()
                      sbFull.progress = sbDock.progress
                      tvPos.text = fmtTime(pos)
                      tvFullPos.text = fmtTime(pos)
                  }
              }

              /* ================================ الرقابة ================================ */

              private fun armWd() {
                  clearWd()
                  val r = Runnable {
                      val p = player
                      if (p == null || !p.isPlaying) {
                          tvWd.text = "انقطاع في الاتصال منذ 25 ثانية — القناة: ${cur?.name ?: "-"}"
                          wdBar.visibility = View.VISIBLE
                      }
                  }
                  wdTask = r
                  h.postDelayed(r, 25_000)
              }

              private fun clearWd() {
                  wdTask?.let { h.removeCallbacks(it) }
                  wdTask = null
                  wdBar.visibility = View.GONE
              }

              /* ================================ القوائم ================================ */

              private fun sourceList(): List<Channel> = when (listMode) {
                  "fav" -> favs
                  "recent" -> recents
                  "mine" -> myGroupChannels(curGroup)
                  "all" -> Catalog.live
                  else -> Catalog.live.filter { it.group == curGroup }
              }

              private fun myGroupChannels(name: String): List<Channel> {
                  val urls = mine[name] ?: return emptyList()
                  return Catalog.live.filter { urls.contains(it.url) }
              }

              private fun buildGroups() {
                  groups.clear()
                  groups.add(Group().apply { name = "ALL"; special = "all"; count = Catalog.live.size })
                  groups.add(Group().apply { name = "★ المفضلة"; special = "fav"; count = favs.size })
                  groups.add(Group().apply { name = "🕐 شوهدت مؤخرًا"; special = "recent"; count = recents.size })
                  for (k in mine.keys) groups.add(Group().apply { name = k; special = "mine"; count = (mine[k]?.size ?: 0) })
                  val byName = LinkedHashMap<String, Int>()
                  for (c in Catalog.live) byName[c.group] = (byName[c.group] ?: 0) + 1
                  val cats = Catalog.liveCats.filter { it.name.isNotBlank() && it.name != "عام" }
                  if (cats.isNotEmpty()) {
                      for (g in cats.sortedBy { it.name.lowercase() }) byName[g.name] = (byName[g.name] ?: 0)
                  }
                  for ((k, v) in byName.toSortedMap(compareBy(String.CASE_INSENSITIVE_ORDER) { it })) {
                      if (k == "ALL" || mine.containsKey(k)) continue
                      groups.add(Group().apply { name = k; special = if (locked.contains(k)) "lock" else "group"; count = v })
                  }
                  groups.add(Group().apply { name = "+ إضافة مجموعة"; special = "add"; count = 0 })
                  groups.add(Group().apply { name = "🔒 الأقفال"; special = "locks"; count = locked.size })
              }

              private fun selectGroup(g: Group) {
                  curGroup = g.name
                  listMode = when (g.special) {
                      "all" -> "all"
                      "fav" -> "fav"
                      "recent" -> "recent"
                      "mine" -> "mine"
                      "add" -> { addGroupDialog(); return }
                      "lock" -> { unlockDialog(g); return }
                      "locks" -> { locksDialog(); return }
                      else -> "group"
                  }
                  tvGroupTitle.text = g.name
                  refresh()
                  grpAdapter.notifyDataSetChanged()
              }

              private fun refresh() {
                  val q = etSearch.text.toString().trim()
                  shown.clear()
                  val base = sourceList()
                  if (q.isEmpty()) {
                      shown.addAll(base)
                  } else {
                      val needle = q.lowercase()
                      for (c in base) {
                          if (c.name.lowercase().contains(needle) || c.group.lowercase().contains(needle)) shown.add(c)
                          if (shown.size >= 900) break
                      }
                  }
                  tvChanCount.text = if (q.isEmpty()) "${shown.size} عنصر" else "نتائج البحث: ${shown.size}"
                  chanAdapter.notifyDataSetChanged()
                  if (shown.isNotEmpty()) rvChannels.scrollToPosition(indexOf(cur).coerceAtLeast(0))
              }

              private fun indexOf(c: Channel?): Int {
                  if (c == null) return 0
                  return shown.indexOfFirst { it.url == c.url }
              }

              private fun addGroupDialog() {
                  val c = cur
                  if (c == null) { toast("اختر قناة أولًا ثم أضفها لمجموعة"); return }
                  inputDialog("مجموعة جديدة", "اسم المجموعة", null, v1 = "", msg = "ستُضاف القناة «${c.name}» إليها") { name, _ ->
                      if (name.isBlank()) { toast("اسم فارغ"); return@inputDialog }
                      val list = mine.getOrPut(name) { ArrayList() }
                      if (!list.contains(c.url)) list.add(c.url)
                      saveMine()
                      buildGroups()
                      toast("أنشأت مجموعة «$name»")
                  }
              }

              private fun unlockDialog(g: Group) {
                  inputDialog("مجموعة مقفلة", "رمز الفتح", null, msg = "الرمز الافتراضي 0000 — يمكن تغييره من الأدوات") { code, _ ->
                      if (code == sp.s("lock_code", "0000")) {
                          if (!locked.contains(g.name)) locked.add(g.name)
                          saveMine()
                          toast("المجموعة «${g.name}» مقفلة — اضغط عليها لفتحها")
                          buildGroups(); refresh()
                      } else toast("رمز خاطئ")
                  }
              }

              private fun locksDialog() {
                  if (locked.isEmpty()) { toast("لا مجموعات مقفلة"); return }
                  val names = locked.toList()
                  pickDialog("المجموعات المقفلة", names) { i ->
                      val n = names[i]
                      if (locked.remove(n)) { saveMine(); buildGroups(); refresh(); toast("فُتح القفل: $n") }
                  }
              }

              private fun saveMine() {
                  val o = JSONObject()
                  for ((k, v) in mine) o.put(k, JSONArray(v))
                  sp.put("mygroups", o.toString())
                  sp.put("locked", JSONArray(locked).toString())
              }

              private fun loadMine() {
                  mine.clear(); locked.clear()
                  try {
                      val o = JSONObject(sp.s("mygroups", "{}"))
                      for (k in o.keys()) {
                          val a = o.getJSONArray(k)
                          val list = ArrayList<String>()
                          for (i in 0 until a.length()) list.add(a.getString(i))
                          mine[k] = list
                      }
                      val l = JSONArray(sp.s("locked", "[]"))
                      for (i in 0 until l.length()) locked.add(l.getString(i))
                  } catch (t: Throwable) {}
              }

              private fun toggleFav() {
                  val c = cur ?: return
                  val i = favs.indexOfFirst { it.url == c.url }
                  if (i >= 0) { favs.removeAt(i); toast("أُزيلت من المفضلة") } else { favs.add(0, c); toast("أُضيفت للمفضلة ★") }
                  sp.put("favs", encodeChans(favs))
                  grpAdapter.notifyDataSetChanged()
                  if (listMode == "fav") refresh()
              }

              private fun pushRecent(c: Channel) {
                  recents.removeAll { it.url == c.url }
                  recents.add(0, c)
                  while (recents.size > 40) recents.removeAt(recents.size - 1)
                  sp.put("recents", encodeChans(recents))
              }

              private fun next(auto: Boolean) {
                  if (shown.isEmpty()) return
                  val i = indexOf(cur)
                  var n = i + 1
                  if (n >= shown.size) {
                      if (!auto) { toast("هذه آخر قناة"); return }
                      n = 0
                  }
                  play(shown[n], full)
              }

              private fun prev() {
                  if (shown.isEmpty()) return
                  val i = indexOf(cur)
                  var n = i - 1
                  if (n < 0) n = shown.size - 1
                  play(shown[n], full)
              }

              /* ================================ EPG / القبض ================================ */

              private fun fetchEpg(c: Channel) {
                  val p = Catalog.profile ?: run { infoDesc.text = descOf(c); return }
                  if (p.type != "xtream" || c.kind != "live" || c.id.isBlank()) { infoDesc.text = descOf(c); return }
                  val x = Xtream(p.url, p.user, p.pass)
                  io({ Http.read(x.urlEpgShort(c.id), timeoutMs = 9000, retries = 0) }) { body, _ ->
                      if (body.isNullOrBlank()) { infoDesc.text = descOf(c); return@io }
                      val sb = StringBuilder()
                      try {
                          val o = JSONObject(body)
                          val list = o.optJSONArray("epg_listings") ?: o.optJSONObject("epg_listings")?.optJSONArray("list")
                          if (list != null) {
                              for (i in 0 until Math.min(2, list.length())) {
                                  val o = list.getJSONObject(i)
                                  sb.append(if (i == 0) "الآن: " else "التالي: ")
                                      .append(o.optString("title")).append("  (").append(o.optString("start_date").take(16)).append(")\n")
                              }
                          }
                      } catch (t: Throwable) {}
                      infoDesc.text = if (sb.isEmpty()) descOf(c) else sb.toString().trim()
                  }
              }

              private fun descOf(c: Channel?): String {
                  if (c == null) return ""
                  val extra = c.extra.ifBlank { "" }
                  val parts = ArrayList<String>()
                  if (c.epgId.isNotBlank()) parts.add("EPG: " + c.epgId)
                  if (extra.isNotBlank()) parts.add(extra.take(220))
                  if (c.id.isNotBlank()) parts.add("ID: " + c.id)
                  parts.add(if (c.logo.isNotBlank()) "شعار خارجي" else "بدون شعار")
                  return parts.joinToString("\n")
              }

              /** قبض / timeshift: Xtream عبر timeshift.php، MAC عبر create_link بـ timeshift، وM3U لو كان في الرابط. */
              private fun catchup() {
                  val c = cur ?: return
                  val p = Catalog.profile
                  if (p == null) { toast("أضف مصدرًا أولًا"); return }
                  val u = c.url.ifBlank { c.alt }
                  if (u.isBlank()) { toast("لا يوجد رابط للقبض"); return }
                  val opts = arrayOf("آخر ساعة", "آخر 3 ساعات", "آخر 6 ساعات", "آخر 12 ساعة", "إغلاق")
                  androidx.appcompat.app.AlertDialog.Builder(this)
                      .setTitle("القبض على «" + c.name + "»")
                      .setItems(opts) { _, w ->
                          if (w >= 4) return@setItems
                          val hours = intArrayOf(1, 3, 6, 12)[w]
                          when (p.type) {
                              "xtream" -> {
                                  val x = Xtream(p.url, p.user, p.pass)
                                  val url = x.base + "/streaming/timeshift.php?username=" + Uri.encode(p.user) +
                                      "&password=" + Uri.encode(p.pass) + "&stream=" + c.id + "&start=-" + (hours * 60) + "&stop="
                                  startCatchup(url, hours, c.name)
                              }
                              "mac" -> {
                                  busy(true, "طلب timeshift من البوابة…")
                                  Loader.macTimeshift(p, u, hours) { tu ->
                                      busy(false, "")
                                      if (tu.startsWith("http")) startCatchup(tu, hours, c.name)
                                      else toast("البوابة لا تدعم القبض لهذا الباقة")
                                  }
                              }
                              else -> {
                                  if (u.contains("catchup") || u.contains("timeshift")) {
                                      val sep = if (u.contains("?")) "&" else "?"
                                      val head = u.replace("{{TIMESHIFT}}", "").replace("[", "%5B").replace("]", "%5D")
                                          .let { if (it.endsWith("?") || it.endsWith("&")) it.dropLast(1) else it }
                                      startCatchup(head + sep + "start=-" + (hours * 60) + "&stop=", hours, c.name)
                                  } else toast("هذه القائمة لا تحمل رابط قبض")
                              }
                          }
                      }
                      .show()
              }

              private fun startCatchup(url: String, hours: Int, name: String) {
                  if (!url.startsWith("http") && !url.startsWith("rtsp")) { toast("رابط القبض غير صالح"); return }
                  val pl = player ?: return
                  infoDesc.text = "القبض: آخر $hours ساعة"
                  pl.stop()
                  pl.setMediaItem(
                      MediaItem.Builder().setUri(url)
                          .setMediaMetadata(MediaMetadata.Builder().setTitle(name + " — قبض").build()).build()
                  )
                  pl.prepare()
                  pl.playWhenReady = true
                  pv.player = pl
                  armWd()
                  toast("تشغيل القبض — آخر $hours ساعة")
              }

