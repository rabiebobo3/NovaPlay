        cat <<'NP_F_README' > README.md
        # NovaPlay — نسخة التلفزيون الخفيفة 9.0 (com.nova.play)

        نسخة مُعاد بناؤها خصيصًا لأجهزة **Android TV** والهواتف الضعيفة: أسرع، أخف، وريموت يستجيب فورًا.
        كل شيء يُجلب من السيرفر: الأقسام، الصفحات، الحلقات، روابط التشغيل، وحتى الإعدادات والتحديث.

        ## لماذا صار خفيفًا؟

        | المشكلة في 8.38 | الحل في 9.0 |
        |---|---|
        | سطحا عرض (`pv` و `pvFull`) مع نقل اللاعب بينهما عند كل تشغيل | **سطح عرض واحد** طوال عمر الشاشة — لا نقل، لا إعادة إرفاق، لا شاشة سوداء |
        | أحداث `STATE_READY` تتكرر وإعادة تهيئة المُرمّز | معالجة انتقالات الحالة مرة واحدة + مراقب «لا صورة بعد 7 ثوان» يتصرف تلقائيًا |
        | جلب كل الأفلام والمسلسلات دفعة واحدة (عشرات الآلاف) | **ترقيم صفحي من السيرفر** + كاش صفحات على القرص (TTL 12 ساعة) |
        | حفظ قوائم ضخمة (أكثر من 100 ألف حرف) داخل `SharedPreferences` | `SharedPreferences` للإعدادات الصغيرة فقط؛ القوائم في ملفات JSON |
        | كتابة السجل على القرص من الخيط الرئيسي | سجل في الذاكرة + كاتب على خيط منفصل |
        | `notifyDataSetChanged()` لكل تغيير + `ObjectAnimator` عند كل فوكس | بلا حركات في القوائم، وإدراج جزئي `notifyItemRangeInserted` |
        | مؤقّت كل 500ms يعالج الواجهة | مؤقّت 1 ثانية، يعمل فقط عند الحاجة |
        | Firebase يُهيَّأ عند إقلاع التطبيق | Firebase اختياري ومتأخّر (ولا يُبنى أصلًا إلا بوجود `google-services.json`) |

        ## التشغيل

        1. ارفع هذا الملف إلى `.github/workflows/` في المستودع (أو استبدل ملف الـ workflow القديم).
        2. `Actions` → تشغيل → بعد انتهاء البناء نزّل `NovaPlay-Light-*` من Artifacts أو من Release.
        3. ثبّت الـ APK على التلفزيون، ثم: الإعدادات ← «تغيير/إضافة سيرفر» وأدخل:
           - **M3U**: رابط القائمة
           - **Xtream**: الرابط + المستخدم + كلمة المرور
           - **MAC/Stalker**: رابط البوابة + عنوان MAC

        ## كل البيانات من السيرفر (اختياري)

        أنشر ملف JSON (مثال: `https://myserver/nova.json`) وضع رابطه في
        الإعدادات ← «رابط إعدادات السيرفر (JSON)»:

        ```json
        {
          "msg": "مرحبًا بكم",
          "img": true,
          "depth": 1,
          "sources": [
            { "name": "البوابة", "type": "mac", "url": "http://portal.com:8080", "mac": "00:1A:79:AA:BB:CC" }
          ],
          "update": { "code": 901, "name": "9.1", "url": "https://myserver/nova.apk", "note": "إصلاحات" }
        }
        ```

        - `depth`: `0` = صفحة واحدة فقط (الأخف) • `1` = 5 صفحات • `2` = كل الصفحات
        - `img`: `false` يوقف تحميل الصور (أخف وضع للتلفزيونات الضعيفة)
        - `sources`: تُستخدم تلقائيًا عند عدم وجود مصدر محفوظ في الجهاز
        - `update`: التطبيق يفحصه ويقترح التثبيت

        ## أزرار الريموت

        | الزر | البث المباشر | فيلم / حلقة |
        |---|---|---|
        | ◀ ▶ | القناة السابقة / التالية | إرجاع / تقديم 10 ثوان |
        | ▲ ▼ | فتح قائمة القنوات | فتح قائمة العناصر |
        | OK | إظهار الأشرطة / إيقاف مؤقت | إظهار الأشرطة / إيقاف مؤقت |
        | الأرقام | اختيار القناة برقمها | — |
        | Menu | خيارات (صوت، ترجمة، جودة، نسبة الصورة، سجل) | نفسها |
        | رجوع | إغلاق القائمة ← إخفاء الأشرطة ← خروج | نفسها |

        ## سجل الأخطاء

        الإعدادات ← «سجل الأخطاء» ← مشاركة / نسخ / مسح.
        السجل يحفظ آخر 300 سطرًا في الذاكرة ويكتبها في `filesDir/nova.log` على خيط منفصل.
        العلامات المفيدة: `PLAY` (الرابط) • `PLAY-ERR` • `WATCH` (لا صورة) • `RETRY` • `LINK` • `PORTAL` • `SEASON` • `EPS`.
