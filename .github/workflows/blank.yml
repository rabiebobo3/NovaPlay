                bind()
                buildCats()
                val first = cats.firstOrNull()
                if (first != null) selectCat(first) else loadPage()
            }

            override fun onResume() {
                super.onResume()
                goImmersive()
            }

            override fun onWindowFocusChanged(hasFocus: Boolean) {
                super.onWindowFocusChanged(hasFocus)
                if (hasFocus) goImmersive()
            }

            private fun bind() {
                tvTitle = findViewById(R.id.tv_title)
                etSearch = findViewById(R.id.et_search)
                busy = findViewById(R.id.busyBox)
                tvBusy = findViewById(R.id.tv_busy)
                tvEmpty = findViewById(R.id.tv_empty)
                grid = findViewById(R.id.rv_grid)
                rvCats = findViewById(R.id.rv_cats)

                val dm = resources.displayMetrics
                val span = Math.max(4, Math.min(8, (dm.widthPixels / (170f * dm.density)).toInt()))
                grid.layoutManager = GridLayoutManager(this, span)
                grid.itemAnimator = null
                grid.setHasFixedSize(true)
                grid.setItemViewCacheSize(12)
                rvCats.layoutManager = LinearLayoutManager(this)
                rvCats.itemAnimator = null
                rvCats.setHasFixedSize(true)

                cardAdapter = CardAdapter()
                catAdapter = CatAdapter()
                grid.adapter = cardAdapter
                rvCats.adapter = catAdapter

                if (kind == "fav") {
                    rvCats.visibility = View.GONE
                    items.addAll(Store.favs(this))
                    cardAdapter.notifyDataSetChanged()
                    updateTitle()
                }

                grid.addOnScrollListener(object : RecyclerView.OnScrollListener() {
                    override fun onScrolled(rv: RecyclerView, dx: Int, dy: Int) {
                        val lm = grid.layoutManager as? GridLayoutManager ?: return
                        if (!loading && hasMore && !searchMode && level == 0 &&
                            lm.findLastVisibleItemPosition() >= items.size - 10
                        ) loadPage()
                        // إيقاف الصور أثناء التمرير السريع
                        glideResume?.let { h.removeCallbacks(it) }
                        if (imagesOn) try { Glide.with(this@BrowseActivity).pauseRequests() } catch (_: Throwable) {}
                        glideResume = Runnable {
                            if (imagesOn) try { Glide.with(this@BrowseActivity).resumeRequests() } catch (_: Throwable) {}
                        }
                        h.postDelayed(glideResume!!, 350)
                    }
                })

                etSearch.addTextChangedListener(object : TextWatcher {
                    override fun afterTextChanged(s: Editable?) {
                        searchRun?.let { h.removeCallbacks(it) }
                        val q = s?.toString()?.trim() ?: ""
                        searchRun = Runnable { doSearch(q) }
                        h.postDelayed(searchRun!!, 450)
                    }

                    override fun beforeTextChanged(s: CharSequence?, a: Int, b: Int, c: Int) {}
                    override fun onTextChanged(s: CharSequence?, a: Int, b: Int, c: Int) {}
                })
            }

            private fun buildCats() {
                cats.clear()
                if (kind == "fav") return
                cats.addAll(Catalog.cats(kind))
                if (cats.isEmpty()) cats.add(Group().apply { id = "*"; name = "الكل" })
                catAdapter.notifyDataSetChanged()
            }

            private fun selectCat(g: Group) {
                cat = g
                level = 0
                searchMode = false
                items.clear()
                saved.clear()
                hasMore = true
                grid.scrollToPosition(0)
                cardAdapter.notifyDataSetChanged()
                catAdapter.notifyDataSetChanged()
                updateTitle()
                loadPage()
            }

            private fun loadPage() {
                if (loading || !hasMore || searchMode || level > 0 || kind == "fav") return
                loading = true
                if (items.isEmpty()) showBusy(true, "جارٍ الجلب من السيرفر…")
                Catalog.more(this, kind, cat ?: Group().apply { id = "*"; name = "الكل" }) { added, more ->
                    loading = false
                    showBusy(false, "")
                    hasMore = more
                    if (added > 0) {
                        val from = items.size
                        val src = Catalog.bucket(kind, cat?.id ?: "*")
                        for (k in from until src.size) items.add(src[k])
                        cardAdapter.notifyItemRangeInserted(from, items.size - from)
                    }
                    updateTitle()
                    if (items.isEmpty()) {
                        tvEmpty.visibility = View.VISIBLE
                        tvEmpty.text = "لا توجد عناصر في هذا القسم"
                    } else tvEmpty.visibility = View.GONE
                }
            }

            private fun doSearch(q: String) {
                if (q.length < 2) {
                    if (searchMode) {
                        searchMode = false
                        items.clear()
                        cardAdapter.notifyDataSetChanged()
                        loadPage()
                        updateTitle()
                    }
                    return
                }
                if (kind == "fav") {
                    val res = Store.favs(this).filter { it.name.contains(q, true) }
                    items.clear(); items.addAll(res)
                    searchMode = true
                    cardAdapter.notifyDataSetChanged()
                    updateTitle()
                    return
                }
                searchMode = true
                showBusy(true, "بحث…")
                Catalog.search(this, kind, q) { res ->
                    showBusy(false, "")
                    items.clear()
                    items.addAll(res)
                    hasMore = false
                    cardAdapter.notifyDataSetChanged()
                    grid.scrollToPosition(0)
                    updateTitle()
                    tvEmpty.visibility = if (items.isEmpty()) View.VISIBLE else View.GONE
                    tvEmpty.text = "لا نتائج لـ «$q»"
                }
            }

            private fun updateTitle() {
                val base = when (kind) {
                    "live" -> "البث المباشر"
                    "movie" -> "الأفلام"
                    "series" -> "المسلسلات"
                    else -> "المفضلة"
                }
                val c = cat
                val sub = when {
                    level >= 1 -> seriesName
                    c != null && c.name != "الكل" -> c.name
                    else -> ""
                }
                tvTitle.text = base + (if (sub.isNotBlank()) " • $sub" else "") + " (${items.size})"
            }

            private fun showBusy(on: Boolean, t: String) {
                busy.visibility = if (on) View.VISIBLE else View.GONE
                if (t.isNotBlank()) tvBusy.text = t
            }

            /* --------------------------------- الفتح --------------------------------- */

            private fun open(c: Channel) {
                when {
                    kind == "series" && level == 0 && c.kind != "episode" -> openSeries(c)
                    c.kind == "season" -> openSeason(c)
                    else -> play(c)
                }
            }

            private fun openSeries(c: Channel) {
                showBusy(true, "جلب الحلقات…")
                Catalog.seasons(c) { list ->
                    showBusy(false, "")
                    if (list.isEmpty()) {
                        toast("البوابة لم تُرجع حلقات — سنشغّل الرابط مباشرة")
                        play(c)
                        return@seasons
                    }
                    if (saved.isEmpty()) saved.addAll(items)
                    seriesMid = c.mid.ifBlank { c.id }
                    seriesName = c.name
                    items.clear()
                    items.addAll(list)
                    level = if (list.any { it.kind == "season" }) 1 else 2
                    hasMore = false
                    grid.scrollToPosition(0)
                    cardAdapter.notifyDataSetChanged()
                    updateTitle()
                }
            }

            private fun openSeason(s: Channel) {
                showBusy(true, "جلب حلقات الموسم…")
                Catalog.episodes(s.mid, s.sid) { list ->
                    showBusy(false, "")
                    if (list.isEmpty()) { toast("لا حلقات في هذا الموسم"); return@episodes }
                    if (level < 2 && saved.isEmpty()) saved.addAll(items)
                    seriesName = s.name
                    items.clear()
                    items.addAll(list)
                    level = 2
                    hasMore = false
                    grid.scrollToPosition(0)
                    cardAdapter.notifyDataSetChanged()
                    updateTitle()
                }
            }

            private fun play(c: Channel) {
                val i = Intent(this, PlayerActivity::class.java)
                i.putExtra("chan", c.toJson().toString())
                i.putExtra("kind", kind)
                try {
                    val from = Math.max(0, items.indexOf(c) - 60)
                    val to = Math.min(items.size, from + 160)
                    i.putExtra("list", chansToJson(items.subList(from, to)))
                    i.putExtra("pos", items.indexOf(c) - from)
                } catch (t: Throwable) {
                    Diag.e(t)
                }
                sp.put("last_url", Store.favKey(c))
                startActivity(i)
            }

            private fun back(): Boolean {
                if (level > 0) {
                    items.clear()
                    if (level >= 2 && saved.isNotEmpty() && saved.any { it.kind == "season" }) {
                        items.addAll(saved)
                        level = 1
                    } else if (saved.isNotEmpty()) {
                        items.addAll(saved)
                        saved.clear()
                        level = 0
                        hasMore = false
                    } else {
                        level = 0
                        items.clear()
                        val c = cat
                        if (c != null) items.addAll(Catalog.bucket(kind, c.id))
                        hasMore = false
                    }
                    grid.scrollToPosition(0)
                    cardAdapter.notifyDataSetChanged()
                    updateTitle()
                    return true
                }
                if (etSearch.text.isNotBlank()) { etSearch.setText(""); return true }
                return false
            }

            override fun onKeyDown(keyCode: Int, event: KeyEvent): Boolean {
                if (keyCode == KeyEvent.KEYCODE_BACK && event.action == KeyEvent.ACTION_DOWN && back()) return true
                if (keyCode == KeyEvent.KEYCODE_MENU && event.action == KeyEvent.ACTION_DOWN) {
                    val v = currentFocus
                    val pos = grid.getChildAdapterPosition(v ?: return true)
                    if (pos >= 0) longPress(items[pos])
                    return true
                }
                return super.onKeyDown(keyCode, event)
            }

            private fun longPress(c: Channel) {
                pickDialog(c.name, listOf("▶ تشغيل", "★ مفضلة", "ⓘ معلومات")) { k ->
                    when (k) {
                        0 -> open(c)
                        1 -> toast(if (Store.toggleFav(this, c)) "أُضيفت للمفضلة ★" else "أُزيلت من المفضلة")
                        2 -> infoDialog(c.name, (if (c.group.isNotBlank()) c.group + "\n" else "") +
                            (if (c.extra.isNotBlank()) c.extra + "\n" else "") +
                            (if (c.id.isNotBlank()) "المعرّف: " + c.id else ""))
                    }
                }
            }

            /* -------------------------------- المهايئات -------------------------------- */

            private fun iconFor(c: Channel) = when {
                c.kind == "season" -> R.drawable.ic_series
                c.kind == "movie" -> R.drawable.ic_movie
                c.kind == "episode" -> R.drawable.ic_series
                else -> R.drawable.ic_live
            }

            private inner class CardAdapter : RecyclerView.Adapter<CardH>() {
                override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): CardH =
                    CardH(LayoutInflater.from(parent.context).inflate(R.layout.item_card, parent, false))

                override fun getItemCount() = items.size

                override fun onBindViewHolder(h: CardH, i: Int) {
                    val c = items[i]
                    val last = sp.s("last_url") == Store.favKey(c)
                    h.name.text = if (last) "▶ " + c.name else c.name
                    h.badge.visibility = if (c.extra.isBlank()) View.GONE else View.VISIBLE
                    if (c.extra.isNotBlank()) h.badge.text = c.extra.take(12)
                    val fav = Store.isFav(this@BrowseActivity, c)
                    h.name.setTextColor(resources.getColor(if (fav || last) R.color.np_gold else R.color.np_text))
                    if (imagesOn && c.logo.isNotBlank()) {
                        try {
                            Glide.with(this@BrowseActivity).load(c.logo)
                                .override(240, 360)
                                .centerCrop()
                                .placeholder(iconFor(c))
                                .error(iconFor(c))
                                .dontAnimate()
                                .into(h.img)
                        } catch (t: Throwable) { h.img.setImageResource(iconFor(c)) }
                    } else {
                        h.img.setImageResource(iconFor(c))
                        h.img.scaleType = ImageView.ScaleType.CENTER
                    }
                    h.itemView.setOnClickListener { open(c) }
                    h.itemView.setOnLongClickListener { longPress(c); true }
                }
            }

            private inner class CatAdapter : RecyclerView.Adapter<CatH>() {
                override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): CatH =
                    CatH(LayoutInflater.from(parent.context).inflate(R.layout.item_row, parent, false))

                override fun getItemCount() = cats.size

                override fun onBindViewHolder(h: CatH, i: Int) {
                    val g = cats[i]
                    val sel = cat?.id == g.id && level == 0
                    h.name.text = if (sel) "▶ " + g.name else g.name
                    h.name.setTextColor(resources.getColor(if (sel) R.color.np_gold else R.color.np_text))
                    h.count.text = ""
                    h.itemView.setOnClickListener { selectCat(g) }
                }
            }

            class CardH(v: View) : RecyclerView.ViewHolder(v) {
                val img: ImageView = v.findViewById(R.id.k_img)
                val name: TextView = v.findViewById(R.id.k_name)
                val badge: TextView = v.findViewById(R.id.k_badge)
            }

            class CatH(v: View) : RecyclerView.ViewHolder(v) {
                val name: TextView = v.findViewById(R.id.g_name)
                val count: TextView = v.findViewById(R.id.g_count)
            }
        }
