              private fun lastProfile(): Profile? = try {
                  val t = sp.s("last")
                  if (t.isEmpty()) null else Profile.fromJson(JSONObject(t))
              } catch (t: Throwable) { null }

              private fun build() {
                  macLocal = Catalog.loaded && Catalog.profile?.type == "mac"
                  all.clear()
                  all.addAll(if (kind == "movie") Catalog.movie else Catalog.series)
                  cats.clear()
                  val src = if (kind == "movie") Catalog.movieCats else Catalog.seriesCats
                  if (src.isNotEmpty()) cats.addAll(src)
                  else cats.addAll(all.groupBy { it.group }.map { Group().apply { name = it.key; count = it.value.size } }.sortedBy { it.name.lowercase() })
                  val byCat = HashMap<String, Int>()
                  for (c in all) if (c.catId.isNotBlank()) byCat[c.catId] = (byCat[c.catId] ?: 0) + 1
                  for (g in cats) if (g.catId.isNotBlank() && byCat.containsKey(g.catId)) g.count = byCat[g.catId]!!
                  cats.add(0, Group().apply { name = "ALL"; special = "all"; count = all.size })
                  if (macLocal && all.isNotEmpty()) cats.add(Group().apply { name = "★ حديث"; special = "recent"; count = all.size })
                  if (!inEpisodes) rvCats.adapter = CatAdapter()
                  selCat = cats.firstOrNull { it.special == "all" }
                  applyFilter()
              }

              private fun applyFilter() {
                  val q = etSearch.text.toString().trim().lowercase()
                  items.clear()
                  val base: List<Channel> = if (inEpisodes) all else {
                      val c = selCat
                      when {
                          c == null || c.special == "all" || c.name == "ALL" -> base0()
                          c.special == "recent" -> base0().sortedByDescending { it.num }
                          c.catId.isNotBlank() -> base0().filter { it.catId == c.catId }
                          else -> base0().filter { it.group == c.name }
                      }
                  }
                  for (ch in base) {
                      if (q.isEmpty() || ch.name.lowercase().contains(q)) items.add(ch)
                      if (items.size >= 1200) break
                  }
                  adapter.notifyDataSetChanged()
                  title.text = (if (inEpisodes) seriesName else (if (kind == "movie") "أفلام" else "مسلسلات")) +
                      (if (selCat != null && selCat!!.special != "all") " • " + selCat!!.name else "") +
                      " (${items.size})"
              }

              /** تحديث خفيف أثناء الجلب الخلفي: يحدّث العدّادات والعناصر مع الحفاظ على القسم المختار. */
              private fun softRefresh() {
                  if (inEpisodes) return
                  val keep = selCat
                  all.clear()
                  all.addAll(if (kind == "movie") Catalog.movie else Catalog.series)
                  val byCat = HashMap<String, Int>()
                  for (c in all) if (c.catId.isNotBlank()) byCat[c.catId] = (byCat[c.catId] ?: 0) + 1
                  for (g in cats) if (g.catId.isNotBlank()) g.count = byCat[g.catId] ?: 0
                  if (cats.isNotEmpty()) cats[0].count = all.size
                  selCat = keep
                  applyFilter()
                  try { rvCats.adapter?.notifyDataSetChanged() } catch (t: Throwable) {}
              }

              /** لو القسم فاضي في الذاكرة (بوابة MAC): نجلبه من السيرفر فورًا ونضيفه محليًا. */
              private fun maybeFillCat(g: Group) {
                  val p = Catalog.profile
                  if (!macLocal || inEpisodes || p?.type != "mac") return
                  if (g.catId.isBlank() || g.special == "all" || g.special == "recent") return
                  val cat = if (kind == "movie") Catalog.movie else Catalog.series
                  // القسم يُجلب كاملًا مرة واحدة (كل الصفحات)؛ ولا نعيد جلبه إذا كان مكتملًا أو جاريًا
                  if (Catalog.fillDone(kind, g.catId) || Catalog.fillBusy(kind, g.catId)) return
                  showBusy(true, "جلب «" + g.name + "» بكل صفحاته…")
                  val out = ArrayList<Channel>()
                  Loader.macFillCat(this, p, kind, g.catId, g.name, out) { n ->
                      try {
                          showBusy(false, "")
                          if (n == 0) { toast("لا عناصر في هذا القسم عند السيرفر"); return@macFillCat }
                          val keep = ArrayList<Channel>()
                          for (c in cat) if (c.catId != g.catId) keep.add(c)
                          cat.clear(); cat.addAll(keep); cat.addAll(out)
                          for (i in cat.indices) cat[i].num = i + 1
                          g.count = n
                          if (!inEpisodes) {
                              all.clear(); all.addAll(cat)
                              applyFilter()
                              rvCats.adapter = CatAdapter()
                          }
                          toast("+ " + n + " عنصر في «" + g.name + "»")
                      } catch (t: Throwable) {
                          try { showBusy(false, "") } catch (e: Throwable) {}
                          Crash.log(t)
                          toast("تعذر الفتح: " + (t.message ?: t.javaClass.simpleName))
                      }
                  }
              }

              private fun base0(): List<Channel> = all

