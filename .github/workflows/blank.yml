        import base64, lzma, pathlib, re
        txt = pathlib.Path('/tmp/np_nova.b64').read_text(encoding='utf-8', errors='ignore')
        txt = re.sub(r'[^A-Za-z0-9+/=]', '', txt)      # يتحمّل أي أسطر مضافة عند النسخ
