name: NovaPlay_Kotlin_Full
# ============================================================================
#  NovaPlay / Rabie TV v8.42.8 — نسخة «مصغَّرة» للنسخ السهل (نفس المشروع حرفيًّا، بلا حذف أي ميزة)
#
#  لماذا؟ الملف العادي حجمه 673 كيلوبايت لأن كود المشروع مكتوب داخله كنصّ.
#  في هذه النسخة يُخزَّن نفس المشروع **مضغوطًا** (xz ثم base64) داخل خطوة التوليد،
#  فتُفكّ أثناء البناء وتُكتب نفس الملفات بالبايت ⇒ لا فرق في التطبيق الناتج أبدًا.
#
#  الحجم: 163 كيلوبايت بدل 673 (نصّ المشروع المضغوط داخله 103 كيلوبايت) | مطابق بالبايت للكاملة.
#
#  جديد 8.42.8 — دوال Xtream التي أرسلتها صارت مسار التطبيق كاملًا (منقولة حرفيًّا):
#   • object Xtream8428 في Sources.kt: checkXtreamLogin · buildXtreamUrl · xtreamRequest ·
#     fetchXtreamLive/Movie/SeriesCategories · fetchXtreamContent · fetchXtreamLiveStreams ·
#     fetchXtreamSeriesInfo · playXtreamLive/Movie/Episode · buildMediaItem.
#   • التحميل: مصادقة ⇒ الأقسام الثلاثة ⇒ get_live_streams ⇒ get_vod_streams ⇒ get_series
#     (بلا category_id = كل المحتوى، فيمتلئ ALL والأقسام كما كانت).
#   • الحلقات: fetchXtreamSeriesInfo · والتشغيل: روابط playXtream* من كودك نفسه.
#   • والدوال القديمة (class Xtream · loadXtream · parseStreams) باقية بلا تعديل وغير مستعملة.
#
#  وكل ما في 8.42.7 — لا شيء يخصّ Xtream في الإعدادات (البنود وأكوادها حُذفت):
#   • حُذف من الإعدادات: «بصمة الجهاز (ترويسات مخصّصة + فحص الوكلاء)» و«تحديث Xtream بالدوال
#     الجديدة (مصادقة + أقسام)» و«تجهيز محتوى كل الأقسام (الدوال الجديدة + الجالب القديم)»،
#     ومعها أكوادها كلها (فحص الوكلاء · محرّر الترويسات · xflow8424 · xfill8424 · XApi8424 · XDiag8426).
#   • بقي في الإعدادات: «وكيل المستخدم (User-Agent)» و«إعادة استخدام الاتصال (keep-alive)».
#   • وبقي في المشغّل: «تشخيص الرابط (X-Ray)» من قائمة القناة (قيمه تُحسب داخل الشاشة نفسها).
#
#  وكل ما في 8.42.6 (دوالك القديمة مطابقة بالبايت — بلا أي تعديل مني):
#   • class Xtream · loadXtream · appendCat · Catalog.clear · maybeFillCat: مطابقة بالبايت ✔
#     (تحقّق آلي حرفي في كل إصدار، ونتيجة 8.42.8 هي نفسها).
#   • القنوات في الجالب تُضاف بدالة جديدة appendLive8426 (الدالة الأصلية appendCat لم تُمسّ).
#
#  وكل ما في 8.42.5/8.42.4/8.42.3/8.42.2/8.42.1/8.42 (باختصار):
#   • دالة الجلب القديمة كما كانت (parseStreams بالحرف · urlVodInfo القديم · loadXtream سطر واحد).
#   • دوالك الأربع كانت في الإعدادات ثم حُذفت في 8.42.7 بطلبك، ثم صارت هي مسار الاكستريم في 8.42.8.
#   • مطابقة هوية التطبيق الآخر + اتصال واحد فقط + تشخيص الحجب (X-Ray) + عدّاد الانتظار عند 429.
#   • الأقسام/الفئات: اختيار أي فئة يجلب عناصرها فورًا من السيرفر بالـ category_id.
#
#  ومعها كل ميزات 8.41/8.40.10: الرجوع يعود دائمًا للواجهة الرئيسية · الثيم الثالث «أسود كريستالي
#  صافٍ» (مارون · كريستال · أسود) · الأقسام تظهر دائمًا · ALL قابل للحذف · «ترتيب سلس» بالريموت ·
#  لوحة التفاصيل الاحترافية · التركيز الدقيق · عجلة التحميل · إذن تثبيت التحديثات + توقيع ثابت.
#
#  للنسخة المقروءة (الكود ظاهر داخل الملف): استعمل NovaPlay_Kotlin_Full_TV8428.yml
# ============================================================================
on:
  push:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: novaplay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_NAME: "8.42.8"
      VERSION_CODE: "8420"
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-nova-${{ hashFiles('**/*.gradle*', 'gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-nova-

    - name: Setup Android SDK
      run: |
        set -e
        if [ -z "${ANDROID_HOME:-}" ]; then export ANDROID_HOME="$HOME/android-sdk"; fi
        echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
        SDKM="$(command -v sdkmanager || true)"
        if [ -z "$SDKM" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"; fi
        if [ -z "$SDKM" ]; then
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -sSLo /tmp/clt.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q -o /tmp/clt.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest" 2>/dev/null || true
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
        fi
        yes | "$SDKM" --licenses >/dev/null 2>&1 || true
        "$SDKM" "platform-tools" "platforms;android-34" "build-tools;34.0.0" 2>&1 | tail -3 || echo "WARN: تعذّر تثبيت حزم SDK — سنستخدم ما هو مثبّت مسبقًا على الجهاز"

