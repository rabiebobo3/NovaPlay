                      val ms = if (at > 0) System.currentTimeMillis() - at else 0L
                      val cc = ctx()
                      if (ms in 1..2500 && cc != null) cc.sp.put("ai_m_fast", cc.sp.i("ai_m_fast", 0) + 1)
