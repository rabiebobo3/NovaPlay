          package com.nova.play

          import android.app.AlertDialog
          import android.os.Bundle
          import android.view.LayoutInflater
          import android.view.View
          import android.view.ViewGroup
          import android.widget.AdapterView
          import android.widget.ArrayAdapter
          import android.widget.Button
          import android.widget.EditText
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.Spinner
          import android.widget.TextView
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity
          import androidx.recyclerview.widget.LinearLayoutManager
          import androidx.recyclerview.widget.RecyclerView

          /**
           * إدارة السيرفرات يدوياً: إضافة / تعديل / حذف / اختبار / اختيار النشط.
           * كل البيانات محفوظة في الهاتف فقط.
           */
          class ServerManagerActivity : AppCompatActivity() {

              private lateinit var store: ServerStore
              private lateinit var adapter: ServerAdapter

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_server_manager)

                  store = ServerStore(this)

                  val rv = findViewById<RecyclerView>(R.id.rvServers)
                  rv.layoutManager = LinearLayoutManager(this)
                  adapter = ServerAdapter()
                  rv.adapter = adapter

                  findViewById<Button>(R.id.btnAddServer).setOnClickListener { showForm(null) }
                  findViewById<Button>(R.id.btnBack).setOnClickListener { finish() }

                  val edtPwd = findViewById<EditText>(R.id.edtAppPassword)
                  edtPwd.setText(store.appPassword())
                  findViewById<Button>(R.id.btnSavePassword).setOnClickListener {
                      store.setAppPassword(edtPwd.text.toString().trim())
                      Toast.makeText(this, R.string.srv_saved, Toast.LENGTH_SHORT).show()
                  }

                  if (intent.getBooleanExtra(EXTRA_OPEN_FORM, false)) {
                      showForm(null)
                  }
              }

              override fun onResume() {
                  super.onResume()
                  adapter.notifyDataSetChanged()
                  findViewById<TextView>(R.id.txtEmpty).visibility =
                      if (store.exists()) View.GONE else View.VISIBLE
              }

              // ---------------- نموذج الإضافة/التعديل ----------------

              private fun showForm(existing: Server?) {
                  val v = LayoutInflater.from(this).inflate(R.layout.dialog_server_form, null)
                  val spType = v.findViewById<Spinner>(R.id.spType)
                  val edtName = v.findViewById<EditText>(R.id.edtName)
                  val edtHost = v.findViewById<EditText>(R.id.edtHost)
                  val edtPort = v.findViewById<EditText>(R.id.edtPort)
                  val edtUser = v.findViewById<EditText>(R.id.edtUser)
                  val edtPass = v.findViewById<EditText>(R.id.edtPass)
                  val edtM3u = v.findViewById<EditText>(R.id.edtM3u)
                  val boxXtream = v.findViewById<LinearLayout>(R.id.boxXtream)
                  val boxM3u = v.findViewById<LinearLayout>(R.id.boxM3u)
                  val txtTitle = v.findViewById<TextView>(R.id.txtFormTitle)
                  val txtStatus = v.findViewById<TextView>(R.id.txtFormStatus)

                  val types = arrayOf(getString(R.string.srv_type_xtream), getString(R.string.srv_type_m3u))
                  spType.adapter = ArrayAdapter(this, android.R.layout.simple_spinner_dropdown_item, types)

                  fun syncType() {
                      val xt = spType.selectedItemPosition == 0
                      boxXtream.visibility = if (xt) View.VISIBLE else View.GONE
                      boxM3u.visibility = if (xt) View.GONE else View.VISIBLE
                  }
                  spType.onItemSelectedListener = object : AdapterView.OnItemSelectedListener {
                      override fun onItemSelected(parent: AdapterView<*>?, view: View?, position: Int, id: Long) = syncType()
                      override fun onNothingSelected(parent: AdapterView<*>?) = syncType()
                  }

                  if (existing != null) {
                      txtTitle.text = getString(R.string.srv_edit)
                      edtName.setText(existing.name)
                      edtHost.setText(existing.host)
                      edtPort.setText(existing.port)
                      edtUser.setText(existing.user)
                      edtPass.setText(existing.pass)
                      edtM3u.setText(existing.m3uUrl)
                      spType.setSelection(if (existing.isXtream()) 0 else 1)
                  } else {
                      txtTitle.text = getString(R.string.srv_add)
                      edtPort.setText("8080")
                      spType.setSelection(0)
                  }
                  syncType()

                  fun collect(): Server {
                      val s = Server()
                      if (existing != null) s.id = existing.id
                      s.name = edtName.text.toString().trim()
                      s.type = if (spType.selectedItemPosition == 0) Server.TYPE_XTREAM else Server.TYPE_M3U
                      s.host = edtHost.text.toString().trim()
                      s.port = edtPort.text.toString().trim()
                      s.user = edtUser.text.toString().trim()
                      s.pass = edtPass.text.toString().trim()
                      s.m3uUrl = edtM3u.text.toString().trim()
                      if (s.name.isEmpty()) s.name = if (s.isXtream()) s.host else "M3U"
                      return s
                  }

                  fun valid(s: Server): Boolean {
                      return if (s.isXtream()) s.host.isNotEmpty() && s.user.isNotEmpty() else s.m3uUrl.startsWith("http")
                  }

                  val dialog = AlertDialog.Builder(this, R.style.NovaGoldDialog)
                      .setView(v)
                      .setCancelable(true)
                      .create()

                  v.findViewById<Button>(R.id.btnCancelForm).setOnClickListener {
                      dialog.dismiss()
                      adapter.notifyDataSetChanged()
                  }

                  v.findViewById<Button>(R.id.btnTestForm).setOnClickListener {
                      val s = collect()
                      if (!valid(s)) {
                          txtStatus.text = getString(R.string.srv_required)
                          return@setOnClickListener
                      }
                      txtStatus.text = getString(R.string.srv_testing)
                      XtreamClient(this).test(s) { ok, msg ->
                          txtStatus.text = if (ok) msg else getString(R.string.srv_fail) + msg
                          txtStatus.setTextColor(if (ok) 0xFF3DDC84.toInt() else 0xFFFF5252.toInt())
                      }
                  }

                  v.findViewById<Button>(R.id.btnSaveForm).setOnClickListener {
                      val s = collect()
                      if (!valid(s)) {
                          txtStatus.text = getString(R.string.srv_required)
                          return@setOnClickListener
                      }
                      store.save(s)
                      dialog.dismiss()
                      Toast.makeText(this, R.string.srv_saved, Toast.LENGTH_SHORT).show()
                      adapter.notifyDataSetChanged()
                      findViewById<TextView>(R.id.txtEmpty).visibility = View.GONE
                  }

                  dialog.show()
              }

              // ---------------- قائمة السيرفرات ----------------

              inner class ServerAdapter : RecyclerView.Adapter<ServerAdapter.VH>() {

                  inner class VH(v: View) : RecyclerView.ViewHolder(v) {
                      val txtName: TextView = v.findViewById(R.id.txtName)
                      val txtHost: TextView = v.findViewById(R.id.txtHost)
                      val txtActive: TextView = v.findViewById(R.id.txtActive)
                      val btnUse: ImageView = v.findViewById(R.id.btnUse)
                      val btnTest: ImageView = v.findViewById(R.id.btnTest)
                      val btnEdit: ImageView = v.findViewById(R.id.btnEdit)
                      val btnDelete: ImageView = v.findViewById(R.id.btnDelete)
                  }

                  override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): VH {
                      val v = LayoutInflater.from(this@ServerManagerActivity)
                          .inflate(R.layout.item_server, parent, false)
                      return VH(v)
                  }

                  override fun getItemCount(): Int = store.list().size

                  override fun onBindViewHolder(holder: VH, position: Int) {
                      val list = store.list()
                      if (position >= list.size) return
                      val s = list[position]
                      holder.txtName.text = s.name
                      holder.txtHost.text = s.summary()
                      holder.txtActive.visibility = if (s.id == store.activeId()) View.VISIBLE else View.GONE

                      holder.btnUse.setOnClickListener {
                          store.setActive(s.id)
                          notifyDataSetChanged()
                          Toast.makeText(this@ServerManagerActivity, R.string.srv_saved, Toast.LENGTH_SHORT).show()
                      }

                      holder.btnTest.setOnClickListener {
                          Toast.makeText(this@ServerManagerActivity, R.string.srv_testing, Toast.LENGTH_SHORT).show()
                          XtreamClient(this@ServerManagerActivity).test(s) { ok, msg ->
                              val text = if (ok) msg else getString(R.string.srv_fail) + msg
                              Toast.makeText(this@ServerManagerActivity, text, Toast.LENGTH_LONG).show()
                          }
                      }

                      holder.btnEdit.setOnClickListener { showForm(s) }

                      holder.btnDelete.setOnClickListener {
                          AlertDialog.Builder(this@ServerManagerActivity, R.style.NovaGoldDialog)
                              .setMessage(R.string.srv_confirm_delete)
                              .setPositiveButton(R.string.yes) { _, _ ->
                                  store.delete(s.id)
                                  notifyDataSetChanged()
                                  Toast.makeText(this@ServerManagerActivity, R.string.srv_deleted, Toast.LENGTH_SHORT).show()
                              }
                              .setNegativeButton(R.string.no, null)
                              .show()
                      }
                  }
              }

              companion object {
                  const val EXTRA_OPEN_FORM = "open_form"
              }
          }
