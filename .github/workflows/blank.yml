                          "تجديد الرابط (create_link)" -> { freshTried = false; startPlay(c, true) }
                          "تحويل إلى http" -> { httpTried = false; if (!tryHttpFix()) toast("الرابط ليس https") }
                          "من البداية" -> { player?.seekTo(0); sp.put(posKey(c), 0) }
