                  sb.append("الإصدار: ").append(appVersion(this)).append('\n')
                  sb.append("المصدر: ").append(if (p == null) "-" else p.type + " @ " + p.url.take(50)).append('\n')
                  sb.append("النوع: ").append(kind).append('\n')
                  sb.append("العنصر: ").append(cur?.name ?: "-").append('\n')
                  sb.append("الرابط: ").append(lastUrl.take(110)).append('\n')
                  sb.append("توكن موجود: ").append(if (Stalker.hasToken(lastUrl)) "نعم" else "لا").append('\n')
                  sb.append("قائمة التشغيل: ").append(pl.size).append(" عنصر").append('\n')
                  sb.append("موضع القائمة: ").append(pid).append('\n')
                  sb.append("استئنافات ناعمة: ").append(softFails).append(" | صلبة: ").append(hardFails).append('\n')
                  sb.append("حالة المشغل: ").append(playerState()).append('\n')
                  sb.append("حجم الكاش: ").append(fmtBytes(cacheSize())).append(" | الذاكرة: ").append(usedMb()).append(" م.ب\n")
                  sb.append("آخر طلب بوابة: ").append(try { StalkerSession.peek(p)?.lastReq ?: "-" } catch (t: Throwable) { "-" }).append('\n')
                  sb.append("حلقات: ").append(try { StalkerSession.peek(p)?.lastEpsInfo ?: "-" } catch (t: Throwable) { "-" }).append('\n')
                  sb.append("\n— سجل الأعطال —\n").append(Crash.read(this).takeLast(1200))
                  val msg = sb.toString()
                  AlertDialog.Builder(this).setTitle("تشخيص التشغيل").setMessage(msg)
                      .setPositiveButton("إغلاق", null)
                      .setNeutralButton("مسح السجل") { _, _ -> Crash.clear(this) }
                      .show()
              }

              private fun playerState(): String = when (player?.playbackState) {
                  Player.STATE_IDLE -> "مُهيّأ"
                  Player.STATE_BUFFERING -> "تحميل"
                  Player.STATE_READY -> if (player?.isPlaying == true) "يعمل" else "متوقف"
                  Player.STATE_ENDED -> "انتهى"
                  else -> "-"
              }

              private fun cacheSize(): Long = try { cacheDir.walkTopDown().filter { it.isFile }.sumOf { it.length() } } catch (t: Throwable) { 0L }

              private fun usedMb(): Long = try {
                  val rt = Runtime.getRuntime()
                  (rt.totalMemory() - rt.freeMemory()) / 1048576L
              } catch (t: Throwable) { 0L }

