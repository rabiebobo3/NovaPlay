                  full = on
                  setVis(R.id.fullBox, on)
                  setVis(R.id.playerHolder, !on)
                  setVis(R.id.dockSeek, !on && !live)
                  setVis(R.id.livePulse, !on && live)
                  if (on) { showFullBars(); armHideBars() } else hideFullBars()
                  setFullUI()
              }

