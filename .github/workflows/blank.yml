              // =============================== المفاتيح ===============================

              override fun onKeyDown(keyCode: Int, event: KeyEvent?): Boolean {
                  if (keyCode in KeyEvent.KEYCODE_0..KeyEvent.KEYCODE_9 && !dialOff) {
                      dial(("" + (keyCode - KeyEvent.KEYCODE_0))); return true
                  }
                  when (keyCode) {
                      KeyEvent.KEYCODE_MENU -> { settings(); return true }
                      KeyEvent.KEYCODE_INFO -> { showSources(); return true }
                      KeyEvent.KEYCODE_GUIDE -> { showEpg(); return true }
                      KeyEvent.KEYCODE_MEDIA_PLAY_PAUSE -> {
                          val p = player ?: return true
                          if (p.isPlaying) p.pause() else p.play()
                          if (full) showFullBars()
                          return true
                      }
                      KeyEvent.KEYCODE_MEDIA_NEXT -> { next(); return true }
                      KeyEvent.KEYCODE_MEDIA_PREVIOUS -> { prev(); return true }
                      KeyEvent.KEYCODE_CHANNEL_UP, KeyEvent.KEYCODE_PAGE_UP -> { next(); return true }
                      KeyEvent.KEYCODE_CHANNEL_DOWN, KeyEvent.KEYCODE_PAGE_DOWN -> { prev(); return true }
                      KeyEvent.KEYCODE_DPAD_LEFT -> {
                          if (full && !live) { seekBy(-10000); return true }
                      }
                      KeyEvent.KEYCODE_DPAD_RIGHT -> {
                          if (full && !live) { seekBy(10000); return true }
                      }
                      KeyEvent.KEYCODE_DPAD_CENTER, KeyEvent.KEYCODE_ENTER -> {
                          if (full) { showFullBars(); return true }
                      }
                      KeyEvent.KEYCODE_BACK -> { onBackPressed(); return true }
                      KeyEvent.KEYCODE_PROG_RED -> { toggleFav(cur); return true }
                      KeyEvent.KEYCODE_PROG_GREEN -> { catchup(); return true }
                      KeyEvent.KEYCODE_PROG_BLUE -> { cycleResize(); return true }
                  }
                  return super.onKeyDown(keyCode, event)
              }

