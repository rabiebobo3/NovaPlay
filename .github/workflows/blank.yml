         *  لا نحمّل «كل شيء» أبدًا: الأقسام أولًا، ثم صفحة صفحة عند الحاجة.
         * ===================================================================== */

        /** مقبض البوابة: نسخة واحدة لكل مصدر حتى لا نعيد المصافحة مع كل طلب. */
        object Portal {
            private var st: Stalker? = null
            private var key = ""

            @Synchronized
            fun get(p: Profile): Stalker {
                val k = p.key()
                if (st == null || key != k) { st = Stalker(p); key = k }
                return st!!
            }

            @Synchronized
            fun drop() { st = null; key = "" }
        }

        /* ------------------------------ إعدادات السيرفر ------------------------------ */

        object Config {
            var msg = ""
            var img = true
            var depth = 1
            var liveMax = 6000
            var pageLive = 400
            var sources = ArrayList<Profile>()
            var update: Ota? = null
            @Volatile var loaded = false

            fun load(ctx: Context, cb: ((Boolean) -> Unit)? = null) {
                val url = ctx.sp.s("cfg_url").trim()
                if (url.isBlank()) { cb?.invoke(false); return }
                Bg.run {
                    try {
