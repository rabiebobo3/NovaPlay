          package com.nova.play

          import android.content.Context
          import com.google.gson.Gson
          import com.google.gson.reflect.TypeToken
          import java.util.UUID

          /**
           * تخزين السيرفرات محلياً في الهاتف (بدون أي سحابة).
           */
          class ServerStore(private val ctx: Context) {

              private val prefs = ctx.getSharedPreferences(Config.PREFS_SERVERS, Context.MODE_PRIVATE)
              private val gson = Gson()

              fun list(): MutableList<Server> {
                  val json = prefs.getString(KEY_LIST, null) ?: return mutableListOf()
                  return try {
                      val t = object : TypeToken<MutableList<Server>>() {}.type
                      val l: MutableList<Server>? = gson.fromJson(json, t)
                      l ?: mutableListOf()
                  } catch (e: Exception) {
                      mutableListOf()
                  }
              }

              private fun persist(items: List<Server>) {
                  prefs.edit().putString(KEY_LIST, gson.toJson(items)).apply()
              }

              /** إضافة أو تحديث */
              fun save(server: Server) {
                  val items = list()
                  if (server.id.isEmpty()) {
                      server.id = UUID.randomUUID().toString()
                      items.add(server)
                  } else {
                      val i = items.indexOfFirst { it.id == server.id }
                      if (i >= 0) items[i] = server else items.add(server)
                  }
                  persist(items)
                  if (activeId().isEmpty()) setActive(server.id)
              }

              fun delete(id: String) {
                  val items = list()
                  items.removeAll { it.id == id }
                  persist(items)
                  if (activeId() == id) {
                      prefs.edit().putString(KEY_ACTIVE, if (items.isEmpty()) "" else items[0].id).apply()
                  }
              }

              fun activeId(): String = prefs.getString(KEY_ACTIVE, "") ?: ""

              fun setActive(id: String) {
                  prefs.edit().putString(KEY_ACTIVE, id).apply()
              }

              fun active(): Server? {
                  val id = activeId()
                  if (id.isEmpty()) return null
                  return list().firstOrNull { it.id == id }
              }

              fun exists(): Boolean = list().isNotEmpty()

              // ---- كلمة سر التطبيق (اختيارية) ----
              fun appPassword(): String {
                  val s = ctx.getSharedPreferences(Config.PREFS_SETTINGS, Context.MODE_PRIVATE)
                  val v = s.getString("app_password", null)
                  return v ?: Config.DEFAULT_APP_PASSWORD
              }

              fun setAppPassword(v: String) {
                  ctx.getSharedPreferences(Config.PREFS_SETTINGS, Context.MODE_PRIVATE)
                      .edit().putString("app_password", v).apply()
              }

              fun updateUrl(): String {
                  val s = ctx.getSharedPreferences(Config.PREFS_SETTINGS, Context.MODE_PRIVATE)
                  val v = s.getString("update_url", null)
                  return v ?: Config.DEFAULT_UPDATE_URL
              }

              fun setUpdateUrl(v: String) {
                  ctx.getSharedPreferences(Config.PREFS_SETTINGS, Context.MODE_PRIVATE)
                      .edit().putString("update_url", v).apply()
              }

              companion object {
                  const val KEY_LIST = "servers_list"
                  const val KEY_ACTIVE = "active_id"
              }
          }
          NOVA_EOF

