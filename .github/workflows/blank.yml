            /* ------------------------------ المصدر ------------------------------ */

            private fun loadProfile(): Profile? {
                val t = sp.s("last")
                if (t.isBlank()) return null
                return try { Profile.fromJson(JSONObject(t)) } catch (e: Throwable) { null }
            }

            private fun fillForm() {
                val p = loadProfile() ?: return
                etName.setText(p.name); etUrl.setText(p.url); etUser.setText(p.user); etPass.setText(p.pass); etMac.setText(p.mac)
                spType.setSelection(when (p.type) { "xtream" -> 1; "mac" -> 2; else -> 0 })
            }

            private fun connect() {
                val p = Profile()
                p.type = when (spType.selectedItemPosition) { 1 -> "xtream"; 2 -> "mac"; else -> "m3u" }
                p.url = etUrl.text.toString().trim()
                p.user = etUser.text.toString().trim()
                p.pass = etPass.text.toString()
                p.mac = etMac.text.toString().trim()
                p.name = etName.text.toString().trim().ifBlank { if (p.type == "mac") p.mac else p.url }
                if (p.url.isBlank()) { tvSetupStatus.text = "أدخل الرابط أو البوابة"; return }
                if (p.type == "xtream" && (p.user.isBlank() || p.pass.isBlank())) { tvSetupStatus.text = "أدخل المستخدم وكلمة المرور"; return }
                if (p.type == "mac" && p.mac.isBlank()) { tvSetupStatus.text = "أدخل عنوان MAC"; return }
                if (p.type == "mac") p.mac = Stalker.normMac(p.mac)
                saveProfile(p)
                tvSetupStatus.text = "تم الحفظ: ${p.name}"
                showHome()
                reload(false)
            }

            private fun saveProfile(p: Profile) {
                sp.put("last", p.toJson().toString())
                try {
                    val f = File(filesDir, "servers.json")
                    val a = if (f.exists()) JSONArray(f.readText()) else JSONArray()
                    var idx = -1
                    for (i in 0 until a.length()) {
                        val o = a.getJSONObject(i)
                        if (o.optString("url") == p.url && o.optString("type") == p.type) idx = i
                    }
                    if (idx >= 0) a.put(idx, p.toJson()) else a.put(p.toJson())
                    f.writeText(a.toString())
                } catch (t: Throwable) { Diag.e(t) }
            }

            private fun savedServers() {
                val list = try {
                    val f = File(filesDir, "servers.json")
                    if (!f.exists()) JSONArray() else JSONArray(f.readText())
                } catch (t: Throwable) { JSONArray() }
                if (list.length() == 0) { toast("لا توجد سيرفرات محفوظة"); return }
                val names = ArrayList<String>()
                for (i in 0 until list.length()) {
                    val o = list.getJSONObject(i)
                    names.add(o.optString("name", "سيرفر " + (i + 1)) + " • " + o.optString("type"))
                }
                AlertDialog.Builder(this).setTitle("السيرفرات المحفوظة")
                    .setItems(names.toTypedArray()) { d, i ->
                        val p = Profile.fromJson(list.getJSONObject(i))
                        sp.put("last", p.toJson().toString())
                        fillForm()
                        d.dismiss()
                        showHome()
                        reload(false)
                    }
                    .setNeutralButton("حذف الكل") { _, _ ->
                        try { File(filesDir, "servers.json").delete() } catch (_: Throwable) {}
                        toast("حُذفت القائمة")
                    }
                    .setNegativeButton("إغلاق", null)
                    .show()
            }

            /** لو ملف الإعدادات على السيرفر يحمل مصادر: نعتمد الأول عند غياب مصدر محلي. */
            private fun applyServerConfig() {
                if (Config.msg.isNotBlank()) tvStatus.text = Config.msg
                if (loadProfile() == null && Config.sources.isNotEmpty()) {
                    val p = Config.sources[0]
                    sp.put("last", p.toJson().toString())
