        if (type.equals("xtream")) {
        m.put("url", edtUrl.getText().toString().trim());
        m.put("username", edtUserX.getText().toString().trim());
        m.put("password", edtPassX.getText().toString().trim());
        } else if (type.equals("mac")) {
        m.put("portal", edtPortal.getText().toString().trim());
        m.put("mac", edtMac.getText().toString().trim());
        } else {
        m.put("url", edtUrl.getText().toString().trim());
        }
        db.child("servers").child(id).setValue(m)
        .addOnSuccessListener(x -> { toast("✅ تم حفظ السيرفر"); rebuild(); })
        .addOnFailureListener(e -> toast("❌ تعذر الحفظ — فعّل قواعد الكتابة"));
        } catch (Exception e) { toast("❌ " + e.getMessage()); }
        })
        .setNegativeButton("إلغاء", null)
        .show();
        }

        // ═══════════ الإعدادات العامة ═══════════
        private void settingsDialog() {
        LinearLayout box = new LinearLayout(this);
        box.setOrientation(LinearLayout.VERTICAL);
        box.setPadding(dp(18), dp(10), dp(18), 0);
        final EditText edtMsg = makeInput("💬 رسالة الترحيب بعد الدخول", false);
        final EditText edtM3u = makeInput("🔗 القائمة الافتراضية m3u (لمشترك بدون سيرفر)", false);
        box.addView(edtMsg); box.addView(edtM3u);
        try {
        db.child("settings").get().addOnSuccessListener(s -> {
        try {
        if (s != null && s.exists()) {
        edtMsg.setText(sval(s.child("msg")));
        edtM3u.setText(sval(s.child("m3u_url")));
        }
        } catch (Exception ignored) {}
        });
        } catch (Exception ignored) {}
        new AlertDialog.Builder(this)
        .setTitle("⚙️ الإعدادات العامة")
        .setView(box)
        .setPositiveButton("💾 حفظ", (d, w) -> {
        try {
        Map<String, Object> m = new HashMap<>();
        m.put("msg", edtMsg.getText().toString());
        m.put("m3u_url", edtM3u.getText().toString().trim());
        db.child("settings").setValue(m)
        .addOnSuccessListener(x -> { toast("✅ تم حفظ الإعدادات"); rebuild(); })
        .addOnFailureListener(e -> toast("❌ تعذر الحفظ — فعّل قواعد الكتابة"));
        } catch (Exception e) { toast("❌ " + e.getMessage()); }
        })
        .setNegativeButton("إلغاء", null)
        .show();
        }

        private void rebuild() {
        // إعادة بناء اللوحة لعرض البيانات المحدثة
        recreateSafe();
        }

        private void recreateSafe() {
        try { recreate(); } catch (Exception e) { try { buildPanel(); } catch (Exception e2) {} }
        }

        @Override public boolean onKeyDown(int keyCode, KeyEvent event) {
        if (keyCode == KeyEvent.KEYCODE_BACK) {
        if (prefs.getBoolean("admin_logged_in", false)) { prefs.edit().clear().apply(); buildLoginView(); return true; }
        try { finish(); } catch (Exception e) {}
        return true;
        }
        return super.onKeyDown(keyCode, event);
        }
        }
