          LAYOUTS = {
              'activity_grid.xml': '<?xml version="1.0" encoding="utf-8"?>\n<FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"\n    android:layout_width="match_parent" android:layout_height="match_parent" android:layoutDirection="rtl" android:background="@drawable/bg_crystal">\n    <LinearLayout android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical">\n        <LinearLayout android:layout_width="match_parent" android:layout_height="52dp" android:orientation="horizontal" android:gravity="center_vertical" android:paddingStart="12dp" android:paddingEnd="12dp">\n            <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="⌫ رجوع بالزر" android:textColor="@color/np_text_dim" android:textSize="12sp"/>\n            <TextView android:id="@+id/grid_title" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:gravity="center"\n                android:textColor="@color/np_gold" android:textSize="16sp" android:textStyle="bold"/>\n            <EditText android:id="@+id/et_grid_search" android:layout_width="200dp" android:layout_height="38dp" android:background="@drawable/input_gold"\n                android:hint="بحث" android:textColor="@color/np_text" android:textColorHint="@color/np_text_dim" android:paddingStart="12dp" android:paddingEnd="12dp" android:singleLine="true"/>\n        </LinearLayout>\n        <View android:layout_width="match_parent" android:layout_height="1dp" android:background="@color/np_stroke"/>\n        <LinearLayout android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="1" android:orientation="horizontal">\n            <androidx.recyclerview.widget.RecyclerView android:id="@+id/rv_grid" android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="0.75" android:padding="8dp" android:clipToPadding="false"/>\n            <androidx.recyclerview.widget.RecyclerView android:id="@+id/rv_ggroups" android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="0.25" android:padding="8dp" android:clipToPadding="false"/>\n        </LinearLayout>\n    </LinearLayout>\n    <!-- عجلة تحميل القسم -->\n    <LinearLayout android:id="@+id/gridBusy" android:layout_width="300dp" android:layout_height="wrap_content" android:layout_gravity="center"\n        android:orientation="vertical" android:gravity="center" android:background="@drawable/panel" android:padding="22dp"\n        android:elevation="14dp" android:visibility="gone">\n        <ProgressBar android:layout_width="46dp" android:layout_height="46dp" android:indeterminateTint="@color/np_gold"/>\n        <TextView android:id="@+id/gridBusyTxt" android:layout_width="wrap_content" android:layout_height="wrap_content"\n            android:layout_marginTop="12dp" android:textColor="@color/np_gold" android:textSize="14sp" android:textStyle="bold"/>\n        <TextView android:id="@+id/gridBusySub" android:layout_width="wrap_content" android:layout_height="wrap_content"\n            android:layout_marginTop="4dp" android:textColor="@color/np_text_dim" android:textSize="12sp" android:text="لحظة…"/>\n    </LinearLayout>\n</FrameLayout>\n',
              'activity_live.xml': '<?xml version="1.0" encoding="utf-8"?>\n<FrameLayout xmlns:android="http://schemas.android.com/apk/res/android" xmlns:app="http://schemas.android.com/apk/res-auto"\n android:id="@+id/root" android:layout_width="match_parent" android:layout_height="match_parent"\n android:layoutDirection="rtl" android:background="@drawable/bg_crystal">\n\n <LinearLayout android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical">\n  <!-- ======= الشريط العلوي: بحث + تبويبات ======= -->\n  <LinearLayout android:layout_width="match_parent" android:layout_height="52dp" android:orientation="horizontal"\n   android:gravity="center_vertical" android:paddingStart="12dp" android:paddingEnd="8dp">\n   <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="NovaPlay"\n    android:textColor="@color/np_gold" android:textSize="16sp" android:textStyle="bold|italic"/>\n   <EditText android:id="@+id/et_search" android:layout_width="0dp" android:layout_height="38dp" android:layout_weight="1" android:focusable="false" android:focusableInTouchMode="false" android:cursorVisible="false"\n    android:layout_marginStart="12dp" android:layout_marginEnd="12dp" android:background="@drawable/input_gold"\n    android:hint="بحث في القناة / الفيلم / المسلسل" android:textColorHint="@color/np_text_dim" android:textColor="@color/np_text"\n    android:paddingStart="12dp" android:paddingEnd="12dp" android:singleLine="true" android:imeOptions="actionSearch"\n    android:drawableStart="@drawable/ic_search" android:drawablePadding="6dp"/>\n   <TextView android:id="@+id/tab_home" style="@style/NovaTab" android:text="مسكن"/>\n   <TextView android:id="@+id/tab_live" style="@style/NovaTab" android:text="⭐ مفضلة"/>\n   <TextView android:id="@+id/tab_recent" style="@style/NovaTab" android:text="🕐 حديث"/>\n   <TextView android:id="@+id/tab_movies" style="@style/NovaTab" android:text="افلام"/>\n   <TextView android:id="@+id/tab_series" style="@style/NovaTab" android:text="مسلسلات"/>\n   <TextView android:id="@+id/tab_settings" style="@style/NovaTab" android:minWidth="48dp" android:text="⚙"/>\n  </LinearLayout>\n  <View android:layout_width="match_parent" android:layout_height="1dp" android:background="@color/np_stroke"/>\n\n  <!-- ======= الأعمدة الثلاثة ======= -->\n  <LinearLayout android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="1" android:orientation="horizontal">\n   <!-- المشغل + المعلومات -->\n   <LinearLayout android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="0.40" android:orientation="vertical">\n    <FrameLayout android:id="@+id/playerHolder" android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="0.56">\n     <androidx.media3.ui.PlayerView android:id="@+id/pv" android:layout_width="match_parent" android:layout_height="match_parent"\n      android:background="#000000" app:use_controller="false" app:resize_mode="fit"/>\n     <!-- SmartLoad: تغطية التحميل مع نسبة -->\n     <LinearLayout android:id="@+id/dockBusy" android:layout_width="wrap_content" android:layout_height="wrap_content"\n      android:layout_gravity="center" android:orientation="vertical" android:gravity="center" android:background="@drawable/overlay_dark"\n      android:padding="16dp" android:visibility="gone">\n      <ProgressBar android:layout_width="44dp" android:layout_height="44dp" android:indeterminateTint="#E53935"/>\n      <TextView android:id="@+id/tv_load_pct" android:layout_width="wrap_content" android:layout_height="wrap_content"\n       android:visibility="gone" android:text=""/>\n      <TextView android:id="@+id/tv_load_txt" android:layout_width="wrap_content" android:layout_height="wrap_content"\n       android:layout_marginTop="8dp" android:textColor="@color/np_text" android:textSize="13sp" android:textStyle="bold" android:text="جاري تحميل"/>\n      <TextView android:id="@+id/tv_dock_speed" android:layout_width="wrap_content" android:layout_height="wrap_content"\n       android:layout_marginTop="2dp" android:textColor="@color/np_text_dim" android:textSize="11sp" android:text="KB/s 0,0"/>\n     </LinearLayout>\n     <!-- نبض البث: نقطة LIVE حمراء تنبض في المشغل الصغير -->\n     <LinearLayout android:id="@+id/livePulse" android:layout_width="wrap_content" android:layout_height="22dp"\n      android:layout_gravity="top|start" android:layout_marginStart="8dp" android:layout_marginTop="8dp"\n      android:orientation="horizontal" android:gravity="center_vertical" android:background="@drawable/live_badge"\n      android:paddingStart="7dp" android:paddingEnd="7dp" android:visibility="gone">\n      <ImageView android:layout_width="11dp" android:layout_height="11dp" android:src="@drawable/dot_live"/>\n      <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_marginStart="5dp"\n       android:text="LIVE" android:textColor="#FFFFFF" android:textSize="10sp" android:textStyle="bold"/>\n     </LinearLayout>\n     <LinearLayout android:id="@+id/dockSeek" android:layout_width="match_parent" android:layout_height="wrap_content"\n      android:layout_gravity="bottom" android:orientation="horizontal" android:gravity="center_vertical"\n      android:background="@color/np_scrim" android:paddingStart="10dp" android:paddingEnd="10dp" android:visibility="gone">\n      <TextView android:id="@+id/tv_pos" android:layout_width="46dp" android:layout_height="wrap_content" android:textColor="@color/np_text" android:textSize="11sp" android:text="0:00"/>\n      <SeekBar android:id="@+id/sb_dock" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1"/>\n      <TextView android:id="@+id/tv_dur" android:layout_width="46dp" android:layout_height="wrap_content" android:textColor="@color/np_text" android:textSize="11sp" android:gravity="end" android:text="0:00"/>\n     </LinearLayout>\n    </FrameLayout>\n    <LinearLayout android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="0.44" android:orientation="vertical" android:padding="10dp">\n     <TextView android:id="@+id/info_name" android:layout_width="match_parent" android:layout_height="wrap_content"\n      android:textColor="@color/np_text" android:textSize="15sp" android:textStyle="bold" android:singleLine="true"/>\n     <TextView android:id="@+id/info_sub" android:layout_width="match_parent" android:layout_height="wrap_content" style="@style/NovaSmall"/>\n     <TextView android:id="@+id/info_desc" android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="1"\n      android:textColor="@color/np_text_dim" android:textSize="12sp" android:layout_marginTop="4dp" android:maxLines="4" android:ellipsize="end"/>\n     <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal">\n      <Button android:id="@+id/btn_dock_full" android:layout_width="0dp" android:layout_height="38dp" android:layout_weight="1" android:text="توسيع"\n       android:background="@drawable/btn_gold" android:textColor="@color/np_bg" android:textSize="12sp"/>\n      <Button android:id="@+id/btn_dock_fav" android:layout_width="0dp" android:layout_height="38dp" android:layout_weight="1.2" android:layout_marginStart="6dp"\n       android:text="★ المفضلة" android:background="@drawable/btn_ghost" android:textColor="@color/np_text" android:textSize="12sp"/>\n      <LinearLayout android:layout_width="0dp" android:layout_height="38dp" android:layout_weight="1.1" android:layout_marginStart="6dp"\n       android:orientation="horizontal" android:gravity="center" android:background="@drawable/btn_ghost" android:focusable="true" android:clickable="true">\n       <androidx.mediarouter.app.MediaRouteButton android:id="@+id/castBtn" android:layout_width="24dp" android:layout_height="24dp"\n        android:focusable="true" android:clickable="true"/>\n       <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_marginStart="4dp"\n        android:text="للتلفاز" android:textColor="@color/np_text" android:textSize="12sp"/>\n      </LinearLayout>\n      <Button android:id="@+id/btn_dock_catch" android:layout_width="0dp" android:layout_height="38dp" android:layout_weight="0.9" android:layout_marginStart="6dp"\n       android:text="القبض" android:background="@drawable/btn_ghost" android:textColor="@color/np_text" android:textSize="12sp"/>\n     </LinearLayout>\n     <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal" android:layout_marginTop="6dp">\n      <Button android:id="@+id/btn_prev" android:layout_width="0dp" android:layout_height="36dp" android:layout_weight="1" android:text="⏮ السابق"\n       android:background="@drawable/btn_ghost" android:textColor="@color/np_text" android:textSize="12sp"/>\n      <Button android:id="@+id/btn_play" android:layout_width="0dp" android:layout_height="36dp" android:layout_weight="0.8" android:layout_marginStart="6dp"\n       android:text="تشغيل/إيقاف" android:background="@drawable/btn_ghost" android:textColor="@color/np_text" android:textSize="12sp"/>\n      <Button android:id="@+id/btn_next" android:layout_width="0dp" android:layout_height="36dp" android:layout_weight="1" android:layout_marginStart="6dp"\n       android:text="القناة التالية ⏭" android:background="@drawable/btn_ghost" android:textColor="@color/np_text" android:textSize="12sp"/>\n     </LinearLayout>\n    </LinearLayout>\n   </LinearLayout>\n   <!-- القنوات -->\n   <LinearLayout android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="0.35" android:orientation="vertical" android:padding="6dp">\n    <TextView android:id="@+id/tv_chan_count" android:layout_width="match_parent" android:layout_height="wrap_content" style="@style/NovaSmall"\n     android:paddingStart="6dp" android:paddingBottom="4dp"/>\n    <androidx.recyclerview.widget.RecyclerView android:id="@+id/rv_channels" android:layout_width="match_parent" android:layout_height="0dp"\n     android:layout_weight="1" android:clipToPadding="false" android:scrollbars="vertical"/>\n   </LinearLayout>\n   <!-- المجموعات -->\n   <LinearLayout android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="0.25" android:orientation="vertical" android:padding="6dp">\n    <TextView android:id="@+id/tv_group_title" android:layout_width="match_parent" android:layout_height="wrap_content" android:textColor="@color/np_gold"\n     android:textSize="13sp" android:textStyle="bold" android:paddingStart="6dp" android:paddingBottom="4dp" android:singleLine="true"/>\n    <androidx.recyclerview.widget.RecyclerView android:id="@+id/rv_groups" android:layout_width="match_parent" android:layout_height="0dp"\n     android:layout_weight="1" android:clipToPadding="false" android:scrollbars="vertical"/>\n   </LinearLayout>\n  </LinearLayout>\n </LinearLayout>\n\n <!-- ======= البطاقة العائمة (استئناف سريع) ======= -->\n <LinearLayout android:id="@+id/pipBox" android:layout_width="210dp" android:layout_height="wrap_content" android:layout_gravity="bottom|start"\n  android:layout_margin="12dp" android:orientation="horizontal" android:gravity="center_vertical" android:background="@drawable/panel"\n  android:padding="8dp" android:visibility="gone" android:focusable="true" android:clickable="true">\n  <ImageView android:id="@+id/iv_pip" android:layout_width="34dp" android:layout_height="34dp" android:src="@drawable/ic_pip"/>\n  <TextView android:id="@+id/tv_pip" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1"\n   android:layout_marginStart="8dp" android:textColor="@color/np_text" android:textSize="12sp" android:singleLine="true"/>\n  <ImageView android:id="@+id/btn_pip_close" android:layout_width="26dp" android:layout_height="26dp" android:src="@drawable/ic_trash"\n   android:background="@drawable/circle_gold" android:focusable="true" android:clickable="true"/>\n </LinearLayout>\n\n <!-- ======= المشغل الكامل ======= -->\n <FrameLayout android:id="@+id/fullBox" android:layout_width="match_parent" android:layout_height="match_parent"\n  android:background="#000000" android:visibility="gone">\n  <androidx.media3.ui.PlayerView android:id="@+id/pvFull" android:layout_width="match_parent" android:layout_height="match_parent"\n   app:use_controller="false" app:resize_mode="fill"/>\n\n  <!-- عجلة التحميل الأنيقة + «جاري تحميل» + سرعة الشبكة (وسط الشاشة) -->\n  <LinearLayout android:id="@+id/fullBusy" android:layout_width="wrap_content" android:layout_height="wrap_content"\n   android:layout_gravity="center" android:orientation="vertical" android:gravity="center" android:visibility="gone">\n   <ProgressBar android:id="@+id/fullSpin" android:layout_width="58dp" android:layout_height="58dp"\n    android:indeterminateTint="#E53935"/>\n   <TextView android:id="@+id/tv_full_txt" android:layout_width="wrap_content" android:layout_height="wrap_content"\n    android:layout_marginTop="14dp" android:text="جاري تحميل" android:textColor="@color/np_text"\n    android:textSize="15sp" android:textStyle="bold"/>\n   <TextView android:id="@+id/tv_speed" android:layout_width="wrap_content" android:layout_height="wrap_content"\n    android:layout_marginTop="4dp" android:text="KB/s 0,0" android:textColor="@color/np_text_dim" android:textSize="12sp"/>\n   <TextView android:id="@+id/tv_full_pct" android:layout_width="wrap_content" android:layout_height="wrap_content"\n    android:visibility="gone" android:text="٪0" android:textColor="@color/np_gold" android:textSize="14sp"/>\n  </LinearLayout>\n\n  <!-- زر التشغيل/الإيقاف الوسطي: أيقونة متّجهة — الأفلام والحلقات فقط -->\n  <ImageView android:id="@+id/btn_center_play" android:layout_width="80dp" android:layout_height="80dp"\n   android:layout_gravity="center" android:padding="24dp" android:src="@drawable/ic_pause"\n   android:background="@drawable/btn_ctrl_main" android:alpha="0.9"\n   android:contentDescription="تشغيل أو إيقاف"\n   android:focusable="true" android:clickable="true" android:visibility="gone"/>\n\n  <!-- (إصلاح v8.39) السابق/التالي الكبيران (القنوات: تبديل القناة) — كان الوسمان مبتورين في الملف الأصلي -->\n  <ImageView android:id="@+id/btn_big_prev" android:layout_width="96dp" android:layout_height="96dp"\n   android:layout_gravity="start|center_vertical" android:padding="8dp" android:src="@drawable/ic_prev_big" android:alpha="0.85"\n   android:focusable="true" android:clickable="true" android:contentDescription="القناة السابقة" android:visibility="gone"/>\n  <ImageView android:id="@+id/btn_big_next" android:layout_width="96dp" android:layout_height="96dp"\n   android:layout_gravity="end|center_vertical" android:padding="8dp" android:src="@drawable/ic_next_big" android:alpha="0.85"\n   android:focusable="true" android:clickable="true" android:contentDescription="القناة التالية" android:visibility="gone"/>\n\n  <!-- مؤشر تقديم/تأخير عائم -->\n  <TextView android:id="@+id/tv_seek_hint" android:layout_width="wrap_content" android:layout_height="wrap_content"\n   android:layout_gravity="center" android:background="@drawable/overlay_dark" android:paddingStart="18dp" android:paddingEnd="18dp"\n   android:paddingTop="8dp" android:paddingBottom="8dp" android:textColor="@color/np_gold" android:textSize="20sp"\n   android:textStyle="bold" android:visibility="gone"/>\n\n  <!-- الشريط العلوي: سهم الرجوع ثم العنوان -->\n  <LinearLayout android:id="@+id/fullTop" android:layout_width="match_parent" android:layout_height="54dp" android:orientation="horizontal"\n   android:gravity="center_vertical" android:background="@color/np_scrim" android:paddingStart="10dp" android:paddingEnd="12dp">\n   <ImageButton android:id="@+id/btn_full_close" android:layout_width="42dp" android:layout_height="42dp"\n    android:padding="9dp" android:src="@drawable/ic_arrow_end" android:background="@drawable/btn_ctrl"\n    android:contentDescription="رجوع" android:focusable="true" android:clickable="true"/>\n   <TextView android:id="@+id/full_title" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1"\n    android:layout_marginStart="12dp" android:textColor="@color/np_text" android:textSize="15sp" android:textStyle="bold" android:singleLine="true"/>\n   <TextView android:id="@+id/full_qual" android:layout_width="wrap_content" android:layout_height="wrap_content" style="@style/NovaSmall" android:layout_marginEnd="8dp"/>\n   <Button android:id="@+id/btn_full_cast" android:layout_width="wrap_content" android:layout_height="34dp" android:text="إرسال"\n    android:background="@drawable/btn_ghost" android:textColor="@color/np_text" android:visibility="gone"/>\n   <Button android:id="@+id/btn_full_pip" android:layout_width="wrap_content" android:layout_height="34dp" android:layout_marginStart="6dp" android:text="بطاقة"\n    android:background="@drawable/btn_ghost" android:textColor="@color/np_text" android:visibility="gone"/>\n  </LinearLayout>\n\n  <!-- ================= الشريط السفلي: من الأسفل — الأفلام والحلقات فقط ================= -->\n  <LinearLayout android:id="@+id/fullBar" android:layout_width="match_parent" android:layout_height="wrap_content" android:layout_gravity="bottom"\n   android:orientation="vertical" android:paddingStart="14dp" android:paddingEnd="14dp" android:paddingTop="8dp" android:paddingBottom="10dp">\n\n   <!-- (أ) شريط التقدّم اليدوي — يعمل بالريموت -->\n   <LinearLayout android:id="@+id/fullSeekRow" android:layout_width="match_parent" android:layout_height="wrap_content"\n    android:orientation="horizontal" android:gravity="center_vertical"\n    android:background="@drawable/ctrl_panel" android:paddingStart="14dp" android:paddingEnd="14dp"\n    android:paddingTop="2dp" android:paddingBottom="2dp">\n    <TextView android:id="@+id/tv_full_pos" android:layout_width="54dp" android:layout_height="wrap_content"\n     android:gravity="center" android:textColor="@color/np_text" android:textSize="12sp" android:text="0:00"/>\n    <SeekBar android:id="@+id/sb_full" android:layout_width="0dp" android:layout_height="wrap_content"\n     android:layout_weight="1" android:focusable="true" android:focusableInTouchMode="true"\n     android:contentDescription="شريط التقدّم — ◀ ▶ للتمرير اليدوي"/>\n    <TextView android:id="@+id/tv_full_dur" android:layout_width="54dp" android:layout_height="wrap_content"\n     android:gravity="center" android:textColor="@color/np_text" android:textSize="12sp" android:text="0:00"/>\n   </LinearLayout>\n\n   <!-- (ب) صف المعلومات -->\n   <FrameLayout android:id="@+id/fullBottomRow" android:layout_width="match_parent" android:layout_height="62dp"\n    android:layout_marginTop="8dp">\n\n    <!-- (ب-1) الأفلام والحلقات: الاسم في الوسط -->\n    <LinearLayout android:id="@+id/mvInfoC" android:layout_width="wrap_content" android:layout_height="match_parent"\n     android:layout_gravity="center" android:orientation="horizontal" android:gravity="center_vertical">\n     <ImageView android:id="@+id/mv_art" android:layout_width="46dp" android:layout_height="46dp"\n      android:layout_marginEnd="10dp" android:padding="2dp" android:background="@drawable/art_round"\n      android:scaleType="centerCrop" android:contentDescription="صورة العمل"/>\n     <LinearLayout android:layout_width="wrap_content" android:layout_height="wrap_content"\n      android:orientation="vertical" android:gravity="center">\n      <TextView android:id="@+id/mv_name" android:layout_width="wrap_content" android:layout_height="wrap_content"\n       android:gravity="center" android:textColor="#FFFFFF" android:textSize="16sp" android:textStyle="bold"\n       android:shadowColor="#000000" android:shadowDx="1" android:shadowDy="1" android:shadowRadius="3"\n       android:singleLine="true" android:maxWidth="620dp"/>\n      <TextView android:id="@+id/mv_qual" android:layout_width="wrap_content" android:layout_height="wrap_content"\n       android:layout_marginTop="2dp" android:gravity="center" android:textColor="@color/np_gold"\n       android:textSize="11sp" android:singleLine="true"/>\n     </LinearLayout>\n    </LinearLayout>\n\n    <!-- (ب-2) القنوات: شارة LIVE + الشعار + الاسم + [HD] [1080p] [السرعة] -->\n    <LinearLayout android:id="@+id/liveInfoC" android:layout_width="wrap_content" android:layout_height="match_parent"\n     android:layout_gravity="center" android:orientation="horizontal" android:gravity="center_vertical"\n     android:background="@drawable/ctrl_panel" android:paddingStart="12dp" android:paddingEnd="16dp"\n     android:paddingTop="6dp" android:paddingBottom="6dp">\n     <LinearLayout android:id="@+id/liveBadge" android:layout_width="wrap_content" android:layout_height="22dp"\n      android:orientation="horizontal" android:gravity="center_vertical" android:background="@drawable/live_badge"\n      android:paddingStart="6dp" android:paddingEnd="6dp" android:visibility="gone">\n      <ImageView android:layout_width="13dp" android:layout_height="13dp" android:src="@drawable/ic_live"/>\n      <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_marginStart="4dp"\n       android:text="LIVE" android:textColor="#FFFFFF" android:textSize="10sp" android:textStyle="bold"/>\n     </LinearLayout>\n     <ImageView android:id="@+id/ch_logo" android:layout_width="42dp" android:layout_height="42dp"\n      android:layout_marginStart="8dp" android:padding="3dp" android:background="@drawable/panel"\n      android:scaleType="fitCenter" android:visibility="gone"/>\n     <LinearLayout android:layout_width="wrap_content" android:layout_height="wrap_content"\n      android:layout_marginStart="10dp" android:orientation="vertical" android:gravity="center_vertical">\n      <TextView android:id="@+id/ch_name" android:layout_width="wrap_content" android:layout_height="wrap_content"\n       android:textColor="#FFFFFF" android:textSize="15sp" android:textStyle="bold"\n       android:shadowColor="#000000" android:shadowDx="1" android:shadowDy="1" android:shadowRadius="3"\n       android:singleLine="true" android:maxWidth="560dp"/>\n      <LinearLayout android:layout_width="wrap_content" android:layout_height="wrap_content"\n       android:layout_marginTop="4dp" android:orientation="horizontal" android:gravity="center_vertical">\n       <TextView android:id="@+id/li_type" style="@style/Chip" android:text="HD"/>\n       <TextView android:id="@+id/li_res" style="@style/Chip" android:text="1080p"/>\n       <TextView android:id="@+id/li_speed" style="@style/Chip" android:text="—"/>\n      </LinearLayout>\n     </LinearLayout>\n    </LinearLayout>\n\n    <!-- (ب-3) الأيقونات على اليسار (الجودة • المفضلة • نسبة الصورة) -->\n    <LinearLayout android:layout_width="wrap_content" android:layout_height="match_parent"\n     android:layout_gravity="end|center_vertical" android:orientation="horizontal" android:gravity="center_vertical">\n     <ImageView android:id="@+id/btn_layers" android:layout_width="50dp" android:layout_height="50dp" android:padding="12dp"\n      android:src="@drawable/ic_layers" android:background="@drawable/btn_ctrl"\n      android:focusable="true" android:clickable="true" android:contentDescription="الجودة والمصادر"/>\n     <ImageView android:id="@+id/btn_pfav" android:layout_width="50dp" android:layout_height="50dp" android:padding="12dp"\n      android:src="@drawable/ic_heart" android:background="@drawable/btn_ctrl"\n      android:focusable="true" android:clickable="true" android:contentDescription="المفضلة"/>\n     <ImageView android:id="@+id/btn_fit" android:layout_width="50dp" android:layout_height="50dp" android:padding="12dp"\n      android:src="@drawable/ic_expand" android:background="@drawable/btn_ctrl"\n      android:focusable="true" android:clickable="true" android:contentDescription="نسبة الصورة"/>\n    </LinearLayout>\n   </FrameLayout>\n\n   <!-- (ج) لوحة الأزرار في آخر الشريط (أسفل الشاشة) — للأفلام والحلقات فقط -->\n   <LinearLayout android:id="@+id/fullBtnRow" android:layout_width="wrap_content" android:layout_height="wrap_content"\n    android:layout_gravity="center_horizontal" android:layoutDirection="ltr"\n    android:orientation="horizontal" android:gravity="center_vertical"\n    android:layout_marginTop="8dp" android:background="@drawable/ctrl_panel"\n    android:paddingStart="6dp" android:paddingEnd="6dp" android:paddingTop="6dp" android:paddingBottom="6dp">\n    <ImageButton android:id="@+id/btn_full_prev" style="@style/CtrlBtn"\n     android:src="@drawable/ic_prev_big" android:contentDescription="السابق"/>\n    <FrameLayout android:id="@+id/btn_full_back10" style="@style/CtrlBtnBox">\n     <ImageView android:layout_width="match_parent" android:layout_height="match_parent" android:padding="11dp"\n      android:layout_gravity="center" android:src="@drawable/ic_rew10" android:contentDescription="إرجاع 10 ثوان"/>\n     <TextView style="@style/CtrlNum" android:text="10"/>\n    </FrameLayout>\n    <ImageButton android:id="@+id/btn_full_play" style="@style/CtrlBtnMain"\n     android:src="@drawable/ic_play" android:contentDescription="تشغيل أو إيقاف"/>\n    <FrameLayout android:id="@+id/btn_full_fwd10" style="@style/CtrlBtnBox">\n     <ImageView android:layout_width="match_parent" android:layout_height="match_parent" android:padding="11dp"\n      android:layout_gravity="center" android:src="@drawable/ic_fwd10" android:contentDescription="تقديم 10 ثوان"/>\n     <TextView style="@style/CtrlNum" android:text="10"/>\n    </FrameLayout>\n    <ImageButton android:id="@+id/btn_full_next" style="@style/CtrlBtn"\n     android:src="@drawable/ic_next_big" android:contentDescription="التالي"/>\n    <ImageButton android:id="@+id/btn_full_more" style="@style/CtrlBtn"\n     android:src="@drawable/ic_more" android:contentDescription="خيارات المشغل"/>\n   </LinearLayout>\n  </LinearLayout>\n </FrameLayout>\n\n <!-- ======= شريط الحراسة (watchdog) ======= -->\n <LinearLayout android:id="@+id/wdBar" android:layout_width="match_parent" android:layout_height="wrap_content" android:layout_gravity="bottom"\n  android:orientation="horizontal" android:gravity="center_vertical" android:background="@drawable/panel" android:padding="10dp"\n  android:layout_margin="12dp" android:visibility="gone">\n  <TextView android:id="@+id/tv_wd" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1"\n   android:textColor="@color/np_danger" android:textSize="13sp"/>\n  <Button android:id="@+id/btn_wd_retry" android:layout_width="wrap_content" android:layout_height="36dp" android:text="إعادة المحاولة"\n   android:background="@drawable/btn_gold" android:textColor="@color/np_bg"/>\n  <Button android:id="@+id/btn_wd_alt" android:layout_width="wrap_content" android:layout_height="36dp" android:layout_marginStart="6dp" android:text="مصدر بديل"\n   android:background="@drawable/btn_ghost" android:textColor="@color/np_text"/>\n </LinearLayout>\n <!-- أرقام الريموت لاختيار قناة برقمها -->\n <TextView android:id="@+id/tv_dial" android:layout_width="wrap_content" android:layout_height="wrap_content"\n  android:layout_gravity="bottom|center_horizontal" android:layout_marginBottom="76dp" android:visibility="gone"\n  android:background="@drawable/input_gold" android:paddingStart="18dp" android:paddingEnd="18dp"\n  android:paddingTop="6dp" android:paddingBottom="6dp" android:textColor="@color/np_gold"\n  android:textSize="22sp" android:textStyle="bold" android:elevation="12dp"/>\n\n</FrameLayout>\n',
              'activity_main.xml': '<?xml version="1.0" encoding="utf-8"?>\n<FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"\n    android:id="@+id/root" android:layout_width="match_parent" android:layout_height="match_parent"\n    android:layoutDirection="rtl" android:background="@drawable/bg_crystal">\n\n    <!-- ============ بوابة الدخول ============ -->\n    <ScrollView android:id="@+id/gateBox" android:layout_width="match_parent" android:layout_height="match_parent"\n        android:fillViewport="true" android:visibility="gone">\n        <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content"\n            android:orientation="vertical" android:gravity="center" android:padding="28dp">\n            <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"\n                android:text="NovaPlay" style="@style/NovaTextTitle" android:textSize="34sp" android:textStyle="bold|italic"/>\n            <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_marginTop="2dp"\n                android:text="مشغّل IPTV — قنوات • أفلام • مسلسلات" style="@style/NovaSmall"/>\n            <View android:layout_width="180dp" android:layout_height="2dp" android:layout_marginTop="10dp" android:background="@drawable/gold_line"/>\n            <Button android:id="@+id/btn_login_open" android:layout_width="320dp" android:layout_height="48dp" android:layout_marginTop="22dp"\n                android:text="تسجيل الدخول بحساب الخادم" android:background="@drawable/btn_gold" android:textColor="@color/np_bg"/>\n            <Button android:id="@+id/btn_direct" android:layout_width="320dp" android:layout_height="46dp" android:layout_marginTop="10dp"\n                android:text="دخول مباشر (M3U / Xtream / MAC)" android:background="@drawable/btn_ghost" android:textColor="@color/np_text"/>\n            <LinearLayout android:layout_width="wrap_content" android:layout_height="wrap_content" android:orientation="horizontal" android:layout_marginTop="12dp">\n                <TextView android:id="@+id/btn_admin_open" android:layout_width="wrap_content" android:layout_height="40dp" android:gravity="center"\n                    android:text="الحساب" style="@style/NovaSmall" android:paddingStart="12dp" android:paddingEnd="12dp"\n                    android:background="@drawable/btn_ghost" android:focusable="true" android:clickable="true"/>\n                <TextView android:id="@+id/btn_update_open" android:layout_width="wrap_content" android:layout_height="40dp" android:gravity="center"\n                    android:text="تحديث التطبيق" style="@style/NovaSmall" android:paddingStart="12dp" android:paddingEnd="12dp"\n                    android:background="@drawable/btn_ghost" android:focusable="true" android:clickable="true"/>\n                <TextView android:id="@+id/btn_theme_toggle" android:layout_width="wrap_content" android:layout_height="40dp" android:gravity="center"\n                    android:text="تبديل الثيم" style="@style/NovaSmall" android:paddingStart="12dp" android:paddingEnd="12dp"\n                    android:background="@drawable/btn_ghost" android:focusable="true" android:clickable="true"/>\n            </LinearLayout>\n            <TextView android:id="@+id/tv_ver" android:layout_width="wrap_content" android:layout_height="wrap_content"\n                android:layout_marginTop="14dp" style="@style/NovaSmall"/>\n        </LinearLayout>\n    </ScrollView>\n\n    <!-- ============ نموذج الدخول ============ -->\n    <LinearLayout android:id="@+id/loginBox" android:layout_width="match_parent" android:layout_height="match_parent"\n        android:orientation="vertical" android:gravity="center" android:padding="24dp" android:visibility="gone">\n        <LinearLayout android:layout_width="380dp" android:layout_height="wrap_content" android:orientation="vertical"\n            android:background="@drawable/panel" android:padding="20dp">\n            <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="تسجيل الدخول"\n                style="@style/NovaTextTitle" android:textSize="20sp"/>\n            <EditText android:id="@+id/et_luser" style="@style/NovaInput" android:layout_marginTop="14dp"\n                android:hint="اسم المستخدم" android:inputType="text"/>\n            <EditText android:id="@+id/et_lpass" style="@style/NovaInput" android:layout_marginTop="10dp"\n                android:hint="كلمة المرور" android:inputType="textPassword"/>\n            <TextView android:id="@+id/cb_auto" android:layout_width="wrap_content" android:layout_height="40dp" android:layout_marginTop="8dp"\n                android:gravity="center_vertical" android:text="☑ دخول تلقائي عند التشغيل" android:textColor="@color/np_gold_soft"\n                android:textSize="13sp" android:focusable="true" android:clickable="true" android:background="@drawable/btn_ghost"\n                android:paddingStart="10dp" android:paddingEnd="10dp"/>\n            <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal" android:layout_marginTop="14dp">\n                <Button android:id="@+id/btn_login" android:layout_width="0dp" android:layout_height="46dp" android:layout_weight="1"\n                    android:text="دخول" android:background="@drawable/btn_gold" android:textColor="@color/np_bg"/>\n                <Button android:id="@+id/btn_login_back" android:layout_width="0dp" android:layout_height="46dp" android:layout_weight="1"\n                    android:layout_marginStart="8dp" android:text="رجوع" android:background="@drawable/btn_ghost" android:textColor="@color/np_text"/>\n            </LinearLayout>\n            <TextView android:id="@+id/tv_login_status" android:layout_width="match_parent" android:layout_height="wrap_content"\n                android:layout_marginTop="10dp" style="@style/NovaSmall"/>\n        </LinearLayout>\n    </LinearLayout>\n\n    <!-- ============ إعداد السيرفر ============ -->\n    <ScrollView android:id="@+id/serverBox" android:layout_width="match_parent" android:layout_height="match_parent"\n        android:fillViewport="true" android:visibility="gone">\n        <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="vertical"\n            android:gravity="center" android:padding="22dp">\n            <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="إدخال بيانات السيرفر"\n                style="@style/NovaTextTitle" android:textSize="20sp"/>\n            <Spinner android:id="@+id/sp_type" android:layout_width="380dp" android:layout_height="46dp" android:layout_marginTop="14dp"\n                android:background="@drawable/input_gold" android:popupBackground="@color/np_surface"/>\n            <EditText android:id="@+id/et_name" style="@style/NovaInput" android:layout_width="380dp" android:layout_marginTop="8dp" android:hint="اسم القائمة"/>\n            <EditText android:id="@+id/et_url" style="@style/NovaInput" android:layout_width="380dp" android:layout_marginTop="8dp"\n                android:hint="رابط القائمة / البوابة" android:inputType="textUri"/>\n            <EditText android:id="@+id/et_user" style="@style/NovaInput" android:layout_width="380dp" android:layout_marginTop="8dp"\n                android:hint="اسم المستخدم" android:visibility="gone"/>\n            <EditText android:id="@+id/et_pass" style="@style/NovaInput" android:layout_width="380dp" android:layout_marginTop="8dp"\n                android:hint="كلمة المرور" android:inputType="textPassword" android:visibility="gone"/>\n            <EditText android:id="@+id/et_mac" style="@style/NovaInput" android:layout_width="380dp" android:layout_marginTop="8dp"\n                android:hint="عنوان MAC" android:visibility="gone"/>\n            <LinearLayout android:layout_width="380dp" android:layout_height="wrap_content" android:orientation="horizontal" android:layout_marginTop="14dp">\n                <Button android:id="@+id/btn_connect" android:layout_width="0dp" android:layout_height="46dp" android:layout_weight="1"\n                    android:text="اتصال" android:background="@drawable/btn_gold" android:textColor="@color/np_bg"/>\n                <Button android:id="@+id/btn_saved" android:layout_width="0dp" android:layout_height="46dp" android:layout_weight="1"\n                    android:layout_marginStart="8dp" android:text="السيرفرات المحفوظة" android:background="@drawable/btn_ghost" android:textColor="@color/np_text"/>\n                <Button android:id="@+id/btn_server_back" android:layout_width="0dp" android:layout_height="46dp" android:layout_weight="0.5"\n                    android:layout_marginStart="8dp" android:text="رجوع" android:background="@drawable/btn_ghost" android:textColor="@color/np_text"/>\n            </LinearLayout>\n            <TextView android:id="@+id/tv_server_status" android:layout_width="wrap_content" android:layout_height="wrap_content"\n                android:layout_marginTop="10dp" style="@style/NovaSmall"/>\n        </LinearLayout>\n    </ScrollView>\n\n    <!-- ============ الرئيسية ============ -->\n    <LinearLayout android:id="@+id/homeBox" android:layout_width="match_parent" android:layout_height="match_parent"\n        android:orientation="vertical" android:visibility="gone">\n        <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal"\n            android:padding="12dp" android:gravity="center_vertical">\n            <TextView android:id="@+id/home_exp" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1"\n                android:text="قائمة التشغيل الحالية تنتهي: -" style="@style/NovaSmall"/>\n            <TextView android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:gravity="center"\n                android:text="NovaPlay" android:textColor="@color/np_gold" android:textSize="20sp" android:textStyle="bold|italic"/>\n            <TextView android:id="@+id/tv_home_status" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1"\n                android:gravity="end" style="@style/NovaSmall"/>\n        </LinearLayout>\n        <View android:layout_width="match_parent" android:layout_height="1dp" android:background="@color/np_stroke"/>\n        <LinearLayout android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="1"\n            android:orientation="horizontal" android:padding="16dp" android:gravity="center_vertical">\n            <LinearLayout android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:orientation="vertical">\n                <LinearLayout android:id="@+id/tile_settings" style="@style/NovaTile">\n                    <ImageView android:layout_width="22dp" android:layout_height="22dp" android:src="@drawable/ic_gear"/>\n                    <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="الإعدادات" style="@style/NovaLabel" android:layout_marginStart="10dp"/>\n                </LinearLayout>\n                <LinearLayout android:id="@+id/tile_update" style="@style/NovaTile" android:layout_marginTop="8dp">\n                    <ImageView android:layout_width="22dp" android:layout_height="22dp" android:src="@drawable/ic_update"/>\n                    <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="التحقق من التحديث" style="@style/NovaLabel" android:layout_marginStart="10dp"/>\n                </LinearLayout>\n                <LinearLayout android:id="@+id/tile_admin" style="@style/NovaTile" android:layout_marginTop="8dp">\n                    <ImageView android:layout_width="22dp" android:layout_height="22dp" android:src="@drawable/ic_shield"/>\n                    <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="الحساب والاشتراك" style="@style/NovaLabel" android:layout_marginStart="10dp"/>\n                </LinearLayout>\n                <LinearLayout android:id="@+id/tile_reload" style="@style/NovaTile" android:layout_marginTop="8dp">\n                    <ImageView android:layout_width="22dp" android:layout_height="22dp" android:src="@drawable/ic_reload"/>\n                    <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="إعادة تحميل البوابة" style="@style/NovaLabel" android:layout_marginStart="10dp"/>\n                </LinearLayout>\n                <LinearLayout android:id="@+id/tile_exit" style="@style/NovaTile" android:layout_marginTop="8dp">\n                    <ImageView android:layout_width="22dp" android:layout_height="22dp" android:src="@drawable/ic_back"/>\n                    <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="خروج" style="@style/NovaLabel" android:layout_marginStart="10dp"/>\n                </LinearLayout>\n            </LinearLayout>\n            <GridLayout android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1.2"\n                android:columnCount="2" android:layout_marginStart="12dp">\n                <LinearLayout android:id="@+id/tile_movies" style="@style/NovaCard" android:layout_width="0dp" android:layout_height="88dp"\n                    android:layout_columnWeight="1" android:layout_margin="4dp">\n                    <ImageView android:layout_width="34dp" android:layout_height="34dp" android:src="@drawable/ic_movie"/>\n                    <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="افلام" style="@style/NovaLabel" android:layout_marginTop="4dp"/>\n                </LinearLayout>\n                <LinearLayout android:id="@+id/tile_series" style="@style/NovaCard" android:layout_width="0dp" android:layout_height="88dp"\n                    android:layout_columnWeight="1" android:layout_margin="4dp">\n                    <ImageView android:layout_width="34dp" android:layout_height="34dp" android:src="@drawable/ic_series"/>\n                    <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="مسلسلات" style="@style/NovaLabel" android:layout_marginTop="4dp"/>\n                </LinearLayout>\n                <LinearLayout android:id="@+id/tile_account" style="@style/NovaCard" android:layout_width="0dp" android:layout_height="88dp"\n                    android:layout_columnWeight="1" android:layout_margin="4dp">\n                    <ImageView android:layout_width="34dp" android:layout_height="34dp" android:src="@drawable/ic_user"/>\n                    <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="الحساب" style="@style/NovaLabel" android:layout_marginTop="4dp"/>\n                </LinearLayout>\n                <LinearLayout android:id="@+id/tile_switch" style="@style/NovaCard" android:layout_width="0dp" android:layout_height="88dp"\n                    android:layout_columnWeight="1" android:layout_margin="4dp">\n                    <ImageView android:layout_width="34dp" android:layout_height="34dp" android:src="@drawable/ic_switch"/>\n                    <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="تغيير قائمة التسجيل" android:textColor="@color/np_text" android:textSize="11sp" android:layout_marginTop="4dp"/>\n                </LinearLayout>\n            </GridLayout>\n            <LinearLayout android:id="@+id/tile_live" android:layout_width="0dp" android:layout_height="190dp" android:layout_weight="1.15"\n                android:orientation="vertical" android:background="@drawable/card_bg" android:gravity="center"\n                android:layout_marginStart="12dp" android:focusable="true" android:clickable="true">\n                <ImageView android:layout_width="64dp" android:layout_height="64dp" android:src="@drawable/ic_live"/>\n                <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="بث مباشر"\n                    android:textColor="@color/np_text" android:textSize="16sp" android:textStyle="bold" android:layout_marginTop="8dp"/>\n                <TextView android:id="@+id/tv_live_count" android:layout_width="wrap_content" android:layout_height="wrap_content" style="@style/NovaSmall" android:layout_marginTop="2dp"/>\n            </LinearLayout>\n        </LinearLayout>\n    </LinearLayout>\n\n    <!-- ============ شريط التحميل/الحراسة ============ -->\n    <LinearLayout android:id="@+id/busyBox" android:layout_width="260dp" android:layout_height="wrap_content"\n        android:layout_gravity="center" android:orientation="vertical" android:gravity="center" android:background="@drawable/panel"\n        android:padding="18dp" android:visibility="gone">\n        <ProgressBar android:layout_width="34dp" android:layout_height="34dp" android:indeterminateTint="@color/np_gold"/>\n        <TextView android:id="@+id/tv_busy" android:layout_width="wrap_content" android:layout_height="wrap_content"\n            android:layout_marginTop="10dp" style="@style/NovaLabel" android:text="جاري التحميل..."/>\n        <Button android:id="@+id/btn_busy_cancel" android:layout_width="wrap_content" android:layout_height="38dp" android:layout_marginTop="10dp"\n            android:text="إلغاء" android:background="@drawable/btn_ghost" android:textColor="@color/np_text"/>\n    </LinearLayout>\n\n    <LinearLayout android:id="@+id/watchdogBar" android:layout_width="match_parent" android:layout_height="wrap_content"\n        android:layout_gravity="bottom" android:orientation="horizontal" android:gravity="center_vertical" android:background="@drawable/panel"\n        android:padding="10dp" android:layout_margin="12dp" android:visibility="gone">\n        <TextView android:id="@+id/tv_watchdog" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1"\n            android:textColor="@color/np_danger" android:textSize="13sp" android:text="انقطاع في الاتصال"/>\n        <Button android:id="@+id/btn_watchdog_retry" android:layout_width="wrap_content" android:layout_height="36dp" android:text="إعادة المحاولة"\n            android:background="@drawable/btn_gold" android:textColor="@color/np_bg"/>\n    </LinearLayout>\n</FrameLayout>\n',
              'dialog_input.xml': '<?xml version="1.0" encoding="utf-8"?>\n<LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="wrap_content"\n    android:orientation="vertical" android:padding="16dp" android:background="@drawable/panel">\n    <TextView android:id="@+id/d_title" android:layout_width="wrap_content" android:layout_height="wrap_content"\n        android:textColor="@color/np_gold" android:textSize="17sp" android:textStyle="bold"/>\n    <EditText android:id="@+id/d_in1" style="@style/NovaInput" android:layout_marginTop="12dp"/>\n    <EditText android:id="@+id/d_in2" style="@style/NovaInput" android:layout_marginTop="8dp" android:visibility="gone"/>\n    <TextView android:id="@+id/d_msg" android:layout_width="match_parent" android:layout_height="wrap_content"\n        android:layout_marginTop="8dp" style="@style/NovaSmall"/>\n    <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal" android:layout_marginTop="14dp">\n        <Button android:id="@+id/d_ok" android:layout_width="0dp" android:layout_height="42dp" android:layout_weight="1" android:text="حفظ"\n            android:background="@drawable/btn_gold" android:textColor="@color/np_bg"/>\n        <Button android:id="@+id/d_no" android:layout_width="0dp" android:layout_height="42dp" android:layout_weight="1" android:layout_marginStart="8dp"\n            android:text="إلغاء" android:background="@drawable/btn_ghost" android:textColor="@color/np_text"/>\n    </LinearLayout>\n</LinearLayout>\n',
              'item_card.xml': '<?xml version="1.0" encoding="utf-8"?>\n<LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="138dp"\n    android:orientation="vertical" android:background="@drawable/card_bg" android:padding="7dp" android:gravity="center"\n    android:focusable="true" android:clickable="true">\n    <FrameLayout android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="1">\n        <ImageView android:id="@+id/k_img" android:layout_width="match_parent" android:layout_height="match_parent"\n            android:scaleType="centerCrop" android:src="@drawable/ic_movie" android:background="@color/np_bg"/>\n        <TextView android:id="@+id/k_badge" android:layout_width="wrap_content" android:layout_height="wrap_content"\n            android:layout_gravity="top|end" android:layout_margin="4dp" android:textColor="@color/np_bg" android:textSize="10sp"\n            android:textStyle="bold" android:background="@drawable/chip_gold" android:paddingStart="6dp" android:paddingEnd="6dp" android:visibility="gone"/>\n    </FrameLayout>\n    <TextView android:id="@+id/k_name" android:layout_width="match_parent" android:layout_height="wrap_content" android:layout_marginTop="6dp"\n        android:gravity="center" android:textColor="@color/np_text" android:textSize="12sp" android:textStyle="bold" android:maxLines="2"\n        android:ellipsize="end"/>\n</LinearLayout>\n',
              'item_channel.xml': '<?xml version="1.0" encoding="utf-8"?>\n<LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="wrap_content"\n    android:orientation="horizontal" android:background="@drawable/sel_row" android:padding="9dp" android:gravity="center_vertical"\n    android:focusable="true" android:clickable="true">\n    <TextView android:id="@+id/c_num" android:layout_width="30dp" android:layout_height="wrap_content"\n        android:textColor="@color/np_text_dim" android:textSize="11sp" android:gravity="center"/>\n    <ImageView android:id="@+id/c_logo" android:layout_width="28dp" android:layout_height="28dp" android:layout_marginStart="4dp"\n        android:layout_marginEnd="8dp" android:src="@drawable/ic_live" android:scaleType="fitCenter"/>\n    <TextView android:id="@+id/c_name" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1"\n        android:textColor="@color/np_text" android:textSize="12sp" android:textStyle="bold" android:singleLine="true"/>\n    <TextView android:id="@+id/c_flag" android:layout_width="wrap_content" android:layout_height="wrap_content"\n        android:textColor="@color/np_gold" android:textSize="11sp"/>\n</LinearLayout>\n',
              'item_row.xml': '<?xml version="1.0" encoding="utf-8"?>\n<LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="wrap_content"\n    android:orientation="horizontal" android:background="@drawable/sel_row" android:padding="10dp" android:gravity="center_vertical"\n    android:focusable="true" android:clickable="true" android:descendantFocusability="blocksDescendants">\n    <TextView android:id="@+id/g_name" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1"\n        android:textColor="@color/np_text" android:textSize="13sp" android:textStyle="bold" android:singleLine="true" android:ellipsize="middle"/>\n    <TextView android:id="@+id/g_count" android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_marginStart="6dp"\n        android:textColor="@color/np_gold" android:textSize="12sp" android:textStyle="bold"/>\n</LinearLayout>\n',
          }


          def main():
              d = RES / "drawable"
              d.mkdir(parents=True, exist_ok=True)
              for name, body in DRAWABLES.items():
                  (d / name).write_text(body, encoding="utf-8")
              l = RES / "layout"
              l.mkdir(parents=True, exist_ok=True)
              for name, body in LAYOUTS.items():
                  (l / name).write_text(body, encoding="utf-8")
              print("NovaPlay res OK: %d drawable + %d layout => %s" % (len(DRAWABLES), len(LAYOUTS), RES))


          if __name__ == "__main__":
              main()
          NP_EOF

          cat <<'NP_EOF' > tools/check_project.py
          #!/usr/bin/env python3
          # -*- coding: utf-8 -*-
          """
          NovaPlay v8.39 — فحص سلامة المشروع المولَّد قبل البناء (يعمل داخل الـ workflow وبنفس النتيجة محليًا).

          يتحقّق من:
            1) وجود 7 ملفات Kotlin وفي كل منها package com.nova.play.
            2) توازن الأقواس في كل ملف Kotlin مع تجاهل النصوص والتعليقات (لا يخدعه "{")
            3) أن كل ملفات XML تُحلَّل بنجاح (layout/drawable/values/xml + Manifest).
            4) أن كل R.id المستعملة في Kotlin موجودة فعلًا في ملفات layout.
            5) أن كل @color المستعملة في drawable معرَّفة في values أو values-night.
            6) أن كل @drawable / @style المستعملة في layout موجودة.
            7) الأعداد المتوقّعة: 57 drawable + 7 layout على الأقل.

          الاستعمال:  python3 tools/check_project.py     (من جذر المشروع)
          """
          import pathlib
          import re
          import sys
          import xml.etree.ElementTree as ET

          ROOT = pathlib.Path(".").resolve()
          KT_DIR = ROOT / "app/src/main/java/com/nova/play"
          RES = ROOT / "app/src/main/res"
          MANIFEST = ROOT / "app/src/main/AndroidManifest.xml"

          expect_kotlin = ["Core.kt", "Ai.kt", "Cloud.kt", "Sources.kt", "GridActivity.kt", "LiveActivity.kt", "MainActivity.kt"]
          fail = []


          def balanced(src: str) -> bool:
              """توازن {}, () و [] مع تجاهل السلاسل والحرف الواحد والتعليقات."""
              i = 0
              n = len(src)
              stack = []
              mode = None                    # line | blk | raw | str | chr
              pair = {"(": ")", "{": "}", "[": "]"}
              while i < n:
                  c = src[i]
                  nxt = src[i + 1] if i + 1 < n else ""
                  if mode == "line":
                      if c == "\n":
                          mode = None
                      i += 1
                      continue
                  if mode == "blk":
                      if c == "*" and nxt == "/":
                          mode = None
                          i += 2
                          continue
                      i += 1
                      continue
                  if mode == "raw":
                      if src[i:i + 3] == '"""':
                          mode = None
                          i += 3
                          continue
                      i += 1
                      continue
                  if mode == "str":
                      if c == "\\":
                          i += 2
                          continue
                      if c == "$" and nxt == "{":            # قالب نصّي ${
                          j = i + 2
                          d = 1
                          while j < n and d > 0:
                              if src[j] == "{":
                                  d += 1
                              elif src[j] == "}":
                                  d -= 1
                              j += 1
                          i = j
                          continue
                      if c == '"':
                          mode = None
                      i += 1
                      continue
                  if mode == "chr":
                      if c == "\\":
                          i += 2
                          continue
                      if c == "'":
                          mode = None
                      i += 1
                      continue
                  if c == "/" and nxt == "/":
                      mode = "line"
                      i += 2
                      continue
                  if c == "/" and nxt == "*":
                      mode = "blk"
                      i += 2
                      continue
                  if src[i:i + 3] == '"""':
                      mode = "raw"
                      i += 3
                      continue
                  if c == '"':
                      mode = "str"
                      i += 1
                      continue
                  if c == "'":
                      mode = "chr"
                      i += 1
                      continue
                  if c in pair:
                      stack.append(c)
                  elif c in ")}]":
                      if not stack or pair[stack[-1]] != c:
                          return False
                      stack.pop()
                  i += 1
              return not stack


          # 1 + 2 — ملفات Kotlin
          kt_files = []
          for name in expect_kotlin:
              p = KT_DIR / name
              if not p.exists():
                  fail.append("ملف Kotlin ناقص: " + name)
                  continue
              kt_files.append(p)
              t = p.read_text(encoding="utf-8")
              if "package com.nova.play" not in t:
                  fail.append("ملف بلا package com.nova.play: " + name)
              if not balanced(t):
                  fail.append("أقواس غير متوازنة ({} () []): " + name)

          # 3 — ملفات XML
          xml_files = sorted(RES.rglob("*.xml"))
          if MANIFEST.exists():
              xml_files.append(MANIFEST)
          for p in xml_files:
              try:
                  ET.parse(p)
              except Exception as e:
                  fail.append("XML تالف %s : %s" % (p.relative_to(ROOT), e))

          # 4 — معرّفات R.id مقابل ملفات layout
          ids = set()
          for p in (RES / "layout").glob("*.xml"):
              ids |= set(re.findall(r'android:id="@\+id/([A-Za-z0-9_]+)"', p.read_text(encoding="utf-8")))
          for p in kt_files:
              for m in re.finditer(r'R\.id\.([A-Za-z0-9_]+)', p.read_text(encoding="utf-8")):
                  if m.group(1) not in ids:
                      fail.append("معرّف غير معرَّف في أي layout: R.id.%s (في %s)" % (m.group(1), p.name))

          # 5 — الألوان
          colors = set()
          for vf in ("values/colors.xml", "values-night/colors.xml"):
              p = RES / vf
              if p.exists():
                  colors |= set(re.findall(r'<color name="([^"]+)"', p.read_text(encoding="utf-8")))
          for p in (RES / "drawable").glob("*.xml"):
              for m in re.finditer(r'@color/([A-Za-z0-9_]+)', p.read_text(encoding="utf-8")):
                  if m.group(1) not in colors:
                      fail.append("لون غير معرَّف: @color/%s (في %s)" % (m.group(1), p.name))

          # 6 — drawable + style المستعملة في layout
          draw = {p.stem for p in (RES / "drawable").glob("*.xml")}
          sty = set()
          sp = RES / "values/styles.xml"
          if sp.exists():
              sty = set(re.findall(r'<style name="([^"]+)"', sp.read_text(encoding="utf-8")))
          for p in (RES / "layout").glob("*.xml"):
              t = p.read_text(encoding="utf-8")
              for m in re.finditer(r'@drawable/([A-Za-z0-9_]+)', t):
                  if m.group(1) not in draw:
                      fail.append("drawable غير موجود: @drawable/%s (في %s)" % (m.group(1), p.name))
              for m in re.finditer(r'@style/([A-Za-z0-9_.]+)', t):
                  if m.group(1) not in sty:
                      fail.append("style غير موجود: @style/%s (في %s)" % (m.group(1), p.name))

          # 7 — الأعداد
          nd = len(list((RES / "drawable").glob("*.xml")))
          nl = len(list((RES / "layout").glob("*.xml")))
          if nd < 57:
              fail.append("عدد ملفات drawable أقل من المتوقّع: %d" % nd)
          if nl < 7:
              fail.append("عدد ملفات layout أقل من المتوقّع: %d" % nl)

          # 8 — تحذيرات مفيدة (غير مُفشِلة): R.layout + أعضاء الكائنات الداخلية
          warn = []
          layouts = {p.stem for p in (RES / "layout").glob("*.xml")}
          for p in kt_files:
              for m in re.finditer(r'(?<!android\.)R\.layout\.([A-Za-z0-9_]+)', p.read_text(encoding="utf-8")):
                  if m.group(1) not in layouts:
                      warn.append("R.layout.%s غير موجود (في %s)" % (m.group(1), p.name))

          objs = ["Ai", "Catalog", "Loader", "Stalker", "StalkerSession", "Remote", "Ota", "OtaFlag", "Events",
                  "Crash", "Memory", "Engine", "Perf", "Http", "Bg", "Expiry", "Xtream", "M3u", "Channel",
                  "Profile", "Group", "Notify", "NovaApp"]
          declared = {}
          top = set()
          for p in kt_files:
              cur = None
              for ln in p.read_text(encoding="utf-8").split("\n"):
                  m = re.match(r'^(?:object|class|data class)\s+([A-Za-z0-9_]+)', ln)
                  if m:
                      cur = m.group(1)
                      declared.setdefault(cur, set())
                      for extra in re.finditer(r'(?:fun|var|val)\s+([A-Za-z0-9_]+)', ln[m.end():]):
                          declared[cur].add(extra.group(1))
                      continue
                  for pat in (r'^\s+(?:@\w+\s+)*(?:override\s+|private\s+|internal\s+|protected\s+|open\s+|lateinit\s+|const\s+|@Volatile\s+|abstract\s+|suspend\s+)*fun\s+([A-Za-z0-9_]+)',
                              r'^\s+(?:override\s+|private\s+|internal\s+|const\s+|@Volatile\s+|lateinit\s+)*(?:var|val)\s+([A-Za-z0-9_]+)'):
                      mm = re.match(pat, ln)
                      if mm and cur:
                          declared[cur].add(mm.group(1))
                  mn = re.match(r'^\s+(?:private\s+|internal\s+|protected\s+|abstract\s+|open\s+|sealed\s+)*(?:class|object|data class|interface|enum class)\s+([A-Za-z0-9_]+)', ln)
                  if mn and cur:                       # أصناف/كائنات متداخلة (مثل Ota.Info)
                      declared[cur].add(mn.group(1))
                      continue
                  m4 = re.match(r'^(?:private\s+|internal\s+)?fun\s+(?:[A-Za-z0-9_.]+<[^>]*>\.)?([A-Za-z0-9_]+)', ln)
                  if m4:
                      top.add(m4.group(1))
                      cur = None
          for p in kt_files:
              txt = p.read_text(encoding="utf-8")
              for m in re.finditer(r'\b(' + "|".join(objs) + r')\.([A-Za-z0-9_]+)', txt):
                  o, mem = m.group(1), m.group(2)
                  if mem in declared.get(o, set()) or mem in top:
                      continue
                  warn.append("عضو غير موجود؟ %s.%s (في %s)" % (o, mem, p.name))

          print("  ملفات Kotlin : %d" % len(kt_files))
          print("  drawable     : %d" % nd)
          print("  layout       : %d" % nl)
          print("  ملفات XML    : %d" % len(xml_files))
          print("  ألوان        : %d" % len(colors))
          if warn:
              print("\nتحذيرات (لا توقف البناء):")
              for w in sorted(set(warn)):
                  print("   ~ " + w)
          if fail:
              print("\n✖ فشل الفحص — أخطاء:")
              for f in fail:
                  print("   - " + f)
              sys.exit(1)
          print("✔ المشروع سليم: لا معرّفات أو موارد ناقصة، ولا XML تالف، ولا أقواس غير متوازنة.")
          NP_EOF

          echo "› توليد موارد الواجهة (drawable + layout) عبر tools/gen_res.py …"
          python3 tools/gen_res.py app/src/main/res

          echo "› عدد الملفات المولّدة:"
          find . -path ./build -prune -o -type f -print | sort | sed 's|^\./||'

      - name: التحقق من المشروع المولّد
        run: |
          set -euo pipefail

          # ============================================================
          #  فحص ما قبل البناء: Kotlin + XML + المعرّفات + الموارد + الألوان
          #  (نفس الفحص يمكن تشغيله محليًا: python3 tools/check_project.py)
          # ============================================================
          echo "› التحقق من سلامة المشروع المولّد…"
          python3 tools/check_project.py

      - name: إنشاء مفتاح التوقيع (app/debug.keystore)
        run: |
          set -euo pipefail
          # لا نعتمد على PATH: نستعمل keytool من JAVA_HOME مباشرة (تجنّبًا لأي "command not found")
          KT="keytool"
          if [ -n "${JAVA_HOME:-}" ] && [ -x "$JAVA_HOME/bin/keytool" ]; then KT="$JAVA_HOME/bin/keytool"; fi
          echo "› keytool: $KT"
          "$KT" -genkeypair -v \
            -keystore app/debug.keystore \
            -storetype JKS \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10950 \
            -dname "CN=Android Debug,O=Android,C=US"
          test -f app/debug.keystore || { echo "!! لم يُنشأ app/debug.keystore"; exit 1; }
          "$KT" -list -keystore app/debug.keystore -storepass android | tail -n 4
          echo "✔ مفتاح التوقيع جاهز: app/debug.keystore (androiddebugkey / android)"

      - name: بناء نسخة debug
        run: |
          set -euo pipefail
          # مسار مطلق لنسخة Gradle 8.6 التي نزّلناها (تجنّبًا لتعارض نسخة الـ runner الأحدث)
          set -o pipefail
          "$HOME/gradle-dist/gradle-${GRADLE_VERSION}/bin/gradle" --no-daemon --console=plain --stacktrace assembleDebug 2>&1             | tee "$RUNNER_TEMP/build-debug.log"

      - name: بناء نسخة release
        run: |
          set -euo pipefail
          "$HOME/gradle-dist/gradle-${GRADLE_VERSION}/bin/gradle" --no-daemon --console=plain --stacktrace assembleRelease 2>&1             | tee "$RUNNER_TEMP/build-release.log"

      - name: ملخّص أخطاء البناء (يظهر عند الفشل فقط)
        if: failure()
        run: |
          set +e
          echo "## سبب الفشل" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          for f in "$RUNNER_TEMP"/build-debug.log "$RUNNER_TEMP"/build-release.log; do
            [ -f "$f" ] || continue
            echo "== $(basename "$f") ==" >> "$GITHUB_STEP_SUMMARY"
            grep -E "^e: |^w: .*(deprecat|warning)|error:|Could not|FAILURE:|Caused by:|> Task .*FAILED|Unresolved reference" "$f"               | head -n 60 >> "$GITHUB_STEP_SUMMARY"
          done
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          # ونطبعها أيضًا في السجل ليراها من لا يفتح الـ summary
          grep -hE "^e: |error:|Unresolved reference|FAILURE:" "$RUNNER_TEMP"/build-*.log 2>/dev/null | head -n 40

      - name: تجميع المخرجات + البصمات
        run: |
          set -euo pipefail
          mkdir -p dist
          DBG="app/build/outputs/apk/debug/app-debug.apk"
          REL="app/build/outputs/apk/release/app-release.apk"
          ls -l "$DBG" "$REL"
          cp "$DBG" "dist/${APK_NAME}-v${VERSION_NAME}-build${{ github.run_number }}-debug.apk"
          cp "$REL" "dist/${APK_NAME}-v${VERSION_NAME}-build${{ github.run_number }}-release.apk"
          ( cd dist && sha256sum *.apk > SHA256.txt && cat SHA256.txt )
          echo "### NovaPlay v${VERSION_NAME} (${VERSION_CODE}) — build ${{ github.run_number }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          cat dist/SHA256.txt >> "$GITHUB_STEP_SUMMARY"

      - name: رفع الـ APK كـ Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NovaPlay-v${{ env.VERSION_NAME }}-build${{ github.run_number }}
          path: |
            dist/*.apk
            dist/SHA256.txt
          if-no-files-found: error
          retention-days: 30

      - name: نشر إصدار GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nova-v${{ env.VERSION_NAME }}-build${{ github.run_number }}
          name: NovaPlay v${{ env.VERSION_NAME }} — build ${{ github.run_number }}
          body: |
            ## NovaPlay v${{ env.VERSION_NAME }} (build ${{ env.VERSION_CODE }})

            **أول تشغيل:** حمّل نسخة `release` وثبّتها. النسختان (debug/release) موقّعتان بنفس
            المفتاح حتى تُثبَّت التحديثات فوق بعضها بلا تعارض.

            ### ما الجديد في v8.39
            - **خفّة وسرعة ريموت:** لم تُمسح ذاكرة الصور عند الخروج (كانت تُفرَّغ فيُعيد التطبيق
              تنزيل الشعارات والبوسترات من جديد)، بل إيقاف/استئناف طلبات الصور فقط.
            - **تشغيل بعد العودة:** فحص صلاحية الرابط/التوكن عند الاستئناف، وتجديد `create_link`
              تلقائيًا لبوابات MAC، وتصحيح https→http، وتجريب المصدر التالي، وإعادة تحضير ناعمة
              ثم إعادة بناء المشغّل — بدون تعليق للواجهة.
            - **تخزين أخفّ:** كتابة القوائم الكبيرة في الخيط الخلفي وعند التغيّر فقط (كانت تُكتب
              عند كل ضغطة ⇒ ثقل وبطء)، مع حد أعلى للكاش وتشغيل مُسبق لفاكّ الترميز.
            - كل الميزات السابقة كما هي: مباشر/أفلام/مسلسلات، M3U و Xtream و MAC، المفضلة
              والمجموعات والأقفال، القبض، PiP، الإرسال، EPG، المحرّك الذكي، Firebase و OTA.

            ### الملفات
            - `${{ env.APK_NAME }}-v${{ env.VERSION_NAME }}-build${{ github.run_number }}-release.apk` — النسخة الموصى بها
            - `${{ env.APK_NAME }}-v${{ env.VERSION_NAME }}-build${{ github.run_number }}-debug.apk`
            - `SHA256.txt` — بصمات التحقق
          files: |
            dist/*.apk
            dist/SHA256.txt
          draft: false
          prerelease: false
          make_latest: true
