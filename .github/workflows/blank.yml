        package com.rabie.iptv;

        import android.content.Context;
        import android.os.Handler;
        import android.os.Looper;
        import java.io.File;

        /**
         * 🧹 نظام الذاكرة الحديدي: تنظيف صامت وعميق في الخلفية كل 10 دقائق لأداء انسيابي بلا تشنّجات (مثالي لأجهزة TV ضعيفة الرام).
         */
        public class MemoryManager {
        private static final Handler H = new Handler(Looper.getMainLooper());
        private static boolean RUNNING = false;
        private static final long PERIOD = 10 * 60 * 1000L;
        private static final long MAX_AGE = 5 * 60 * 1000L;

        public static void start(final Context app) {
        if (RUNNING) return;
        RUNNING = true;
        H.postDelayed(new Runnable() {
        @Override public void run() {
        try { clean(app); } catch (Exception ignored) {}
        H.postDelayed(this, PERIOD);
        }
        }, PERIOD);
        }

        /** تنظيف عميق: ملفات الكاش الأقدم من 5 دقائق (مع الحفاظ على ملف التحديث) + استدعاء جامع الذاكرة */
        public static void clean(final Context app) {
        new Thread(new Runnable() {
        @Override public void run() {
        try {
        File c = app.getCacheDir();
        long now = System.currentTimeMillis();
        File[] fs = c.listFiles();
        if (fs != null) {
        for (File f : fs) {
        try {
        if (f.getName().equals("rabie_update.apk")) continue;
        if (now - f.lastModified() > MAX_AGE) {
        if (f.isDirectory()) deleteTree(f);
        else f.delete();
        }
        } catch (Exception ignored) {}
        }
        }
        try {
        File ex = app.getExternalCacheDir();
        if (ex != null && ex.exists()) {
        File[] efs = ex.listFiles();
        if (efs != null) for (File f : efs) {
        try { if (f.isDirectory()) deleteTree(f); else f.delete(); } catch (Exception ignored) {}
        }
        }
        } catch (Exception ignored) {}
        } catch (Exception ignored) {}
        try { System.gc(); } catch (Throwable ignored) {}
        }
        }, "rabie_memclean").start();
        }

        private static void deleteTree(File d) {
        File[] fs = d.listFiles();
        if (fs != null) for (File f : fs) {
        if (f.isDirectory()) deleteTree(f);
        else f.delete();
        }
        d.delete();
        }
        }
