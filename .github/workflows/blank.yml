              /** يعيد بناء العنصر كاملًا (kind/mid/sid/id/catId) حتى يعرف المشغّل كيف يحل رابط البوابة. */
              private fun chanFromIntent(url: String): Channel {
                  val raw = intent.getStringExtra("chan")
                  if (!raw.isNullOrBlank()) {
                      try {
                          val c = Channel.fromJson(JSONObject(raw))
                          if (c.url.isBlank()) c.url = url
                          if (c.kind.isBlank()) c.kind = intent.getStringExtra("kind") ?: "movie"
                          return c
                      } catch (t: Throwable) { Crash.log(t) }
                  }
                  return Channel().apply {
                      name = intent.getStringExtra("title") ?: "تشغيل"
                      this.url = url
                      kind = intent.getStringExtra("kind") ?: "movie"
                  }
