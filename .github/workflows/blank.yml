                if (n == 0) {
                 showBusy(true, "مسار احتياطي: جلب الحلقات…")
                 val out2 = ArrayList<Channel>()
                 Loader.macSeason(p, c.mid, "1", out2) { n2 ->
                  showBusy(false, "")
                  if (n2 > 0) {
                   if (saved.isEmpty() && all.none { it.stype == "season" }) saved.addAll(all)
                   all.clear(); all.addAll(out2)
                   inEpisodes = true; seriesName = c.name
                   curSeriesMid = c.mid
                   applyFilter(); rvGrid.scrollToPosition(0)
                   toast("حُمّلت $n2 حلقة (مسار احتياطي)")
                  } else {
                   toast("البوابة لم ترجع حلقات: " + Catalog.status.take(60))
                   playNow(c)
                  }
                 }
                 return@macSeries
                }
                if (saved.isEmpty() && all.none { it.stype == "season" }) { saved.addAll(all) }
                all.clear(); all.addAll(out)
                seasonsList.clear(); seasonsList.addAll(out)
                lvl = 1
                inEpisodes = true; seriesName = c.name
                curSeriesMid = c.mid
                title.text = c.name
                if (out.any { it.kind == "season" }) {
                 seriesName = c.name
                 toast("اختر الموسم لتحميل حلقاته (${out.size} موسم)")
                 Loader.prefetchEps(p, out) { s, nn ->
                  if (!s.name.contains("حلقة")) s.name = s.name + " • $nn حلقة"
                  try { adapter.notifyDataSetChanged() } catch (t: Throwable) {}
                 }
                } else {
                 toast("حُمّلت ${out.size} حلقة")
                }
                applyFilter(); rvGrid.scrollToPosition(0)
               } catch (t: Throwable) {
                try { showBusy(false, "") } catch (e: Throwable) {}
                Crash.log(t)
                toast("تعذر الفتح: " + (t.message ?: t.javaClass.simpleName))
               }
              }
              return
             }
            }
            if (kind == "series" && p?.type == "xtream" && !inEpisodes && c.id.isNotBlank()) {
             showBusy(true, "تحميل الحلقات…")
             val out = ArrayList<Channel>()
             Loader.xtreamEpisodes(p, c.id, out) { n ->
              try {
               showBusy(false, "")
               if (n == 0) { toast("لا توجد حلقات — سيتم تشغيل الرابط المباشر"); playNow(c); return@xtreamEpisodes }
               if (saved.isEmpty() && all.none { it.stype == "season" }) { saved.addAll(all) }
               all.clear(); all.addAll(out)
               inEpisodes = true; seriesName = c.name
               curSeriesMid = c.id
               applyFilter(); rvGrid.scrollToPosition(0)
              } catch (t: Throwable) {
               try { showBusy(false, "") } catch (e: Throwable) {}
               Crash.log(t)
               toast("تعذر الفتح: " + (t.message ?: t.javaClass.simpleName))
              }
             }
             return
            }
            if (c.url.isBlank() && c.alt.isBlank()) {
             val p2 = Catalog.profile
             if (p2?.type == "mac" && (c.id.isNotBlank() || c.mid.isNotBlank())) {
              if (c.url.isBlank()) c.url = Stalker.localCmd(c.id.ifBlank { c.mid })
              playNow(c); return
             }
             toast("لا يوجد رابط لهذا العنصر"); return
            }
            playNow(c)
           }


           private fun openSafe(c: Channel) {
            try { open(c) } catch (t: Throwable) {
             try { showBusy(false, "") } catch (e: Throwable) {}
             Crash.log(t)
             toast("تعذر الفتح: " + (t.message ?: t.javaClass.simpleName))
            }
           }

           private fun playNow(c: Channel) {
            val i = Intent(this, LiveActivity::class.java)
            i.putExtra("play", if (c.url.isNotBlank()) c.url else c.alt)
            i.putExtra("cid", c.id)
            i.putExtra("title", c.name)
            i.putExtra("kind", c.kind.ifBlank { if (kind == "movie") "movie" else "series" })
            i.putExtra("chan", c.toJson().toString())
            i.putExtra("from", "grid")
            try {
             val list = ArrayList<Channel>()
             val idx = items.indexOfFirst { sameItem(it, c) }
             val from = if (idx > 120) idx - 120 else 0
             val to = Math.min(items.size, from + 240)
             for (k in from until to) list.add(items[k])
             if (list.isNotEmpty()) {
              i.putExtra("plist", encodeChans(list))
              i.putExtra("ppos", idx - from)
             }
            } catch (t: Throwable) { Crash.log(t) }
            lastPlayedId = c.id
            lastPlayedUrl = if (c.url.isNotBlank()) c.url else c.alt
            lastName = c.name
            pendingScroll = true
            saveReturn(c)
            i.addFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP)
            try { startActivity(i) } catch (t: Throwable) { toast("تعذّر فتح المشغّل: " + (t.message ?: "")) }
           }


           private fun saveReturn(c: Channel) = saveStateAt(c, lvl)

           private fun saveStateAt(played: Channel?, lv: Int) {
            try {
             if (played != null) {
              lastPlayedId = played.id
              lastPlayedUrl = if (played.url.isNotBlank()) played.url else played.alt
              lastName = played.name
             }
             // ===== v8.39: لا نُعيد كتابة القوائم إن لم يتغيّر شيء، ونكتب الكتل الكبيرة في الخيط الخلفي =====
             // (كانت تُرمّز وتُكتب على الخيط الرئيسي عند كل ضغطة ⇒ ثقل وبطء ريموت عند العودة للمشغّل)
             val sig = kind + "|" + lv + "|" + items.size + "|" + saved.size + "|" + seasonsList.size + "|" + epsList.size +
              "|" + (played?.id ?: "") + "|" + (played?.name ?: "") + "|" + (selCat?.name ?: "") + "|" + seriesName + "|" + curSeriesMid
             if (sig == lastRetSig) { sp.put("ret_pending", "1"); return }
             lastRetSig = sig
             sp.put("ret_kind", kind)
             sp.put("ret_lvl", lv.toString())
             sp.put("ret_level", if (lv > 0) "1" else "0")
             sp.put("ret_series", seriesName)
             sp.put("ret_mid", curSeriesMid)
             sp.put("ret_section", sectionTitle)
             sp.put("ret_cat", selCat?.name ?: "")
             sp.put("ret_played_url", lastPlayedUrl)
             sp.put("ret_played_id", lastPlayedId)
             sp.put("ret_played_name", lastName)
             sp.put("ret_idx", items.indexOfFirst { sameItem(it, played ?: lastPlayedIdOrEmpty()) }.toString())
             sp.put("ret_scroll", firstVisible().toString())
             val mark = played ?: lastPlayedIdOrEmpty()
             sp.put("ret_list_idx", if (lv == 0) items.indexOfFirst { sameItem(it, mark) }.toString() else idxOf(saved, seriesCh).toString())
             sp.put("ret_series_idx", idxOf(saved, seriesCh).toString())
             sp.put("ret_season_idx", idxOf(seasonsList, seasonCh).toString())
             sp.put("ret_season_id", seasonCh?.id ?: "")
             sp.put("ret_series_id", seriesCh?.id ?: "")
             sp.put("ret_eps_idx", epsList.indexOfFirst { sameItem(it, played ?: lastPlayedIdOrEmpty()) }.toString())
             sp.put("ret_pending", "1")
             // الكتل الكبيرة (قد تكون عشرات آلاف عناصر في بوابات MAC) → نسخ سريع ثم ترميز وكتابة في الخلف
             val itemsCopy = if (lv > 0) ArrayList(items) else ArrayList<Channel>()
             val seasonsCopy = if (lv >= 1) ArrayList(seasonsList) else ArrayList<Channel>()
             val epsCopy = if (lv >= 2) ArrayList(epsList) else ArrayList<Channel>()
             val savedCopy = if (saved.isEmpty()) ArrayList<Channel>() else ArrayList(saved)
             Bg.pool.execute {
              try {
               sp.put("ret_items", if (itemsCopy.isEmpty()) "" else encodeChans(itemsCopy))
               sp.put("ret_seasons", if (seasonsCopy.isEmpty()) "" else encodeChans(seasonsCopy))
               sp.put("ret_eps", if (epsCopy.isEmpty()) "" else encodeChans(epsCopy))
               sp.put("ret_saved", if (savedCopy.isEmpty()) "" else encodeChans(savedCopy))
              } catch (t: Throwable) { Crash.log(t) }
             }
            } catch (t: Throwable) { Crash.log(t) }
           }

           private fun lastPlayedIdOrEmpty(): Channel = Channel().apply { id = lastPlayedId; name = lastName; url = lastPlayedUrl }

           private fun idxOf(list: List<Channel>, c: Channel?): Int {
            if (c == null || list.isEmpty()) return -1
            return list.indexOfFirst { sameItem(it, c) }
           }


           private fun allSnapshotIdx(c: Channel): Int =
            try { saved.indexOfFirst { sameItem(it, c) } } catch (t: Throwable) { -1 }

           private fun firstVisible(): Int = try {
            (rvGrid.layoutManager as? LinearLayoutManager)?.findFirstVisibleItemPosition() ?: 0
           } catch (t: Throwable) { 0 }


           private fun ensureSavedList() {
            if (saved.isNotEmpty()) return
            val t = sp.s("ret_saved")
            if (t.isNotBlank()) {
             decodeChans(t, saved)
             if (saved.isNotEmpty()) return
            }
            build()
            val keep = ArrayList(all)
            if (keep.isNotEmpty() && keep.none { it.stype == "season" }) saved.addAll(keep)
           }


           private fun restoreReturn() {
            val savedK = sp.s("ret_kind")
            if ((savedK == "movie" || savedK == "series") && savedK != kind) {
             Crash.note("RET-KIND", "محفوظ=" + savedK + " مطلوب=" + kind + " ⇒ نفتح المطلوب")
             sp.put("ret_eps", ""); sp.put("ret_seasons", ""); sp.put("ret_items", ""); sp.put("ret_pending", "0")
            } else if (savedK.isNotBlank()) kind = savedK
            macLocal = Catalog.loaded && Catalog.profile?.type == "mac"
            lastName = sp.s("ret_played_name")
            lastPlayedId = sp.s("ret_played_id")
            lastPlayedUrl = sp.s("ret_played_url")
            val lv = sp.s("ret_lvl", if (sp.s("ret_level") == "1") "2" else "0").toIntOrNull() ?: 0
            val idx = sp.s("ret_idx").toIntOrNull() ?: -1
            val section = sp.s("ret_section")
            if (section.isNotBlank()) sectionTitle = section

            if (lv >= 2) {
             val eps = ArrayList<Channel>()
             decodeChans(sp.s("ret_eps"), eps)
             val seasons = ArrayList<Channel>()
             decodeChans(sp.s("ret_seasons"), seasons)
             if (eps.isNotEmpty()) {
              ensureSavedList()
              seasonsList.clear(); seasonsList.addAll(seasons)
              epsList.clear(); epsList.addAll(eps)
              lvl = 2
              inEpisodes = true
              seriesName = sp.s("ret_series")
              curSeriesMid = sp.s("ret_mid")
              all.clear(); all.addAll(eps)
              cats.clear()
              cats.add(Group().apply { name = "ALL"; special = "all"; count = all.size })
              title.text = seriesName.ifBlank { sectionTitle }
              applyFilter()
              rvCats.adapter = CatAdapter()
              val pos = if (idx in items.indices) idx else (sp.s("ret_eps_idx").toIntOrNull() ?: 0)
              try { rvGrid.scrollToPosition(pos.coerceAtLeast(0)) } catch (t: Throwable) {}
              adapter.notifyDataSetChanged()
              return
             }
            }
            if (lv >= 1) {
             val seasons = ArrayList<Channel>()
             decodeChans(sp.s("ret_seasons"), seasons)
             if (seasons.isNotEmpty()) {
              ensureSavedList()
              seasonsList.clear(); seasonsList.addAll(seasons)
              lvl = 1
              inEpisodes = true
              seriesName = sp.s("ret_series")
              curSeriesMid = sp.s("ret_mid")
              all.clear(); all.addAll(seasons)
              cats.clear()
              cats.add(Group().apply { name = "ALL"; special = "all"; count = all.size })
              title.text = seriesName.ifBlank { sectionTitle }
              applyFilter()
              rvCats.adapter = CatAdapter()
              val pos = sp.s("ret_idx").toIntOrNull() ?: -1
              try { rvGrid.scrollToPosition((if (pos in items.indices) pos else 0).coerceAtLeast(0)) } catch (t: Throwable) {}
              adapter.notifyDataSetChanged()
              return
             }
            }
            lvl = 0
            inEpisodes = false
            seriesName = ""
            build()
            val catName = sp.s("ret_cat")
            if (catName.isNotBlank()) {
             val g = cats.firstOrNull { it.name == catName }
             if (g != null) { selCat = g; applyFilter() }
            }
            val pos = if (idx in items.indices) idx else (sp.s("ret_scroll").toIntOrNull() ?: 0)
            try { rvGrid.scrollToPosition(pos.coerceAtLeast(0)) } catch (t: Throwable) {}
            adapter.notifyDataSetChanged()
           }


           private fun markOn(c: Channel?) {
            if (c == null) return
            lastPlayedId = c.id
            lastPlayedUrl = if (c.url.isNotBlank()) c.url else c.alt
            lastName = c.name
           }


           private fun upLevel(): Boolean {
            if (lvl >= 2 && seasonsList.isNotEmpty()) {
             lvl = 1
             inEpisodes = true
             all.clear(); all.addAll(seasonsList)
             seriesName = (seriesCh?.name ?: seriesName) + (seriesCh?.group?.let { " • " + it } ?: "")
             title.text = if (seriesName.isNotBlank()) seriesName.substringBefore(" • ") else sectionTitle
             markOn(seasonCh)
             applyFilter(); rvCats.adapter = CatAdapter()
             saveStateAt(null, 1)
             val pos = items.indexOfFirst {
              (lastPlayedUrl.isNotBlank() && it.url == lastPlayedUrl) ||
              (lastPlayedId.isNotBlank() && it.id == lastPlayedId && it.name == lastName)
             }
             try { rvGrid.post { scrollToLast() } } catch (t: Throwable) {}
             if (pos >= 0) { rvGrid.scrollToPosition(pos); focusOn(pos) }
             toast("المواسم (" + items.size + ")")
             return true
            }
            if (lvl >= 1 && saved.isNotEmpty() && saved.none { it.stype == "season" }) {
             lvl = 0
             inEpisodes = false
             seriesName = ""
             all.clear(); all.addAll(saved)
             title.text = sectionTitle
             markOn(seriesCh)
             applyFilter(); rvCats.adapter = CatAdapter()
             saveStateAt(null, 0)
             val pos = items.indexOfFirst {
              (lastPlayedUrl.isNotBlank() && it.url == lastPlayedUrl) ||
              (lastPlayedId.isNotBlank() && it.id == lastPlayedId && it.name == lastName)
             }
             try { rvGrid.post { scrollToLast() } } catch (t: Throwable) {}
             if (pos >= 0) { rvGrid.scrollToPosition(pos); focusOn(pos) }
             toast("رجعنا للقسم: " + (if (kind == "movie") "أفلام" else "مسلسلات"))
             return true
            }
            return false
           }

           private fun sameItem(a: Channel, b: Channel): Boolean {
            if (a.url.isNotBlank() && a.url == b.url) return true
            return a.id.isNotBlank() && a.id == b.id && a.name == b.name
           }


           private fun scrollToLast() {
            try {
             val i = items.indexOfFirst {
              (lastPlayedUrl.isNotBlank() && it.url == lastPlayedUrl) ||
              (lastPlayedId.isNotBlank() && it.id == lastPlayedId && it.name == lastName)
             }
             if (i >= 0) {
              rvGrid.scrollToPosition(i)
              adapter.notifyDataSetChanged()
             }
            } catch (t: Throwable) { Crash.log(t) }
           }

           private fun back() {
            if (upLevel()) return
            try {
             if (lvl == 0 && rvGrid.hasFocus() && rvCats.adapter != null) {
              rvCats.isFocusable = true
              rvCats.descendantFocusability = android.view.ViewGroup.FOCUS_AFTER_DESCENDANTS
              rvCats.post { try { rvCats.requestFocus() } catch (t: Throwable) {} }
              toast("الأقسام — رجوع مرة أخرى للخروج")
              return
             }
            } catch (t: Throwable) { Crash.log(t) }
            if (inEpisodes) {
             inEpisodes = false
             lvl = 0
             seriesName = ""
             all.clear()
             if (saved.isNotEmpty()) { all.addAll(saved); saved.clear() }
             else all.addAll(if (kind == "movie") Catalog.movie else Catalog.series)
             applyFilter()
             rvCats.adapter = CatAdapter()
             return
            }
            finish()
           }

           override fun onResume() {
            super.onResume()
            goImmersive()
            Engine.onStart()
            val wantRestore = sp.s("ret_pending") == "1" || intent?.getStringExtra("restore") == "1"
            if (wantRestore) {
             pendingScroll = false
             tryRestore()
            }
            evRec = Events.register(this) { type, _ ->
             if (type == "catalog") runOnUiThread {
              try { softRefresh() } catch (t: Throwable) { Crash.log(t) }
             }
            }
           }


           override fun onNewIntent(i: Intent?) {
            super.onNewIntent(i)
            intent = i
            if (i?.getStringExtra("kind")?.let { it == "movie" || it == "series" } == true) kind = i.getStringExtra("kind")!!
            if (i?.getStringExtra("restore") == "1") {
             Crash.note("NEWINTENT", "restore=1 kind=" + kind)
             tryRestore()
            }
           }


           private fun tryRestore() {
            // ===== v8.39: الكتلة الكبيرة (ret_saved) تُفكّ في الخيط الخلفي قبل الاسترجاع =====
            if (!restoring && saved.isEmpty()) {
             val big = sp.s("ret_saved")
             if (big.length > 120_000) {
              restoring = true
              showBusy(true, "…جاري استرجاع مكانك")
              Bg.pool.execute {
               val tmp = ArrayList<Channel>()
               decodeChans(big, tmp)
               Bg.ui {
                saved.addAll(tmp)
                showBusy(false, "")
                restoring = false
                tryRestore()
               }
              }
              return
             }
            }
            tryRestoreNow()
           }

           private fun tryRestoreNow() {
            try {
             Crash.note("RET", "kind=" + sp.s("ret_kind") + " lvl=" + sp.s("ret_lvl") +
              " eps=" + sp.s("ret_eps").length + " seasons=" + sp.s("ret_seasons").length +
              " saved=" + sp.s("ret_saved").length + " played=" + sp.s("ret_played_name"))
             restoreReturn()
             focusGrid()
             val i = items.indexOfFirst {
              (lastPlayedUrl.isNotBlank() && it.url == lastPlayedUrl) ||
              (lastPlayedId.isNotBlank() && it.id == lastPlayedId && it.name == lastName)
             }
             if (i >= 0) { rvGrid.scrollToPosition(i); focusOn(i) }
             sp.put("ret_pending", "0")
             Crash.note("RET-OK", "focus=" + (if (i >= 0) i.toString() else "none") + " kind=" + kind +
              " cat=" + (selCat?.name ?: "-"))
             val lv = sp.s("ret_lvl", "0").toIntOrNull() ?: 0
             if (lv >= 1) toast("رجعت للمكان: " + (if (seriesName.isNotBlank()) seriesName.substringBefore(" • ") else "المسلسل"))
             else toast("رجعت للقسم: " + (if (kind == "movie") "أفلام" else "مسلسلات"))
            } catch (t: Throwable) {
             Crash.log(t)
             Crash.note("RET-FAIL", (t.message ?: t.javaClass.simpleName) + " lvl=" + sp.s("ret_lvl"))
             try { rvGrid.post { scrollToLast() } } catch (e: Throwable) {}
            }
           }

           override fun onPause() {
            Events.unregister(this, evRec); evRec = null
            Engine.onStop()
            super.onPause()
           }

           override fun onWindowFocusChanged(hasFocus: Boolean) {
            super.onWindowFocusChanged(hasFocus)
            if (hasFocus) goImmersive()
           }


           override fun dispatchKeyEvent(k: KeyEvent): Boolean {
            if (k.keyCode == KeyEvent.KEYCODE_MENU && k.action == KeyEvent.ACTION_UP) {
             try {
              val i = Intent(this, MainActivity::class.java)
              i.addFlags(Intent.FLAG_ACTIVITY_REORDER_TO_FRONT or Intent.FLAG_ACTIVITY_SINGLE_TOP)
              startActivity(i)
             } catch (t: Throwable) {}
             return true
            }
            if (k.keyCode == KeyEvent.KEYCODE_BACK && k.action == KeyEvent.ACTION_UP && inEpisodes) { back(); return true }
            return super.dispatchKeyEvent(k)
           }

           override fun onBackPressed() = back()

           private fun toggleFav(c: Channel) {
            val i = favs.indexOfFirst { it.url == c.url }
            if (i >= 0) { favs.removeAt(i); toast("أُزيلت من المفضلة") } else { favs.add(0, c); toast("أُضيفت للمفضلة ★") }
            sp.put("favs", encodeChans(favs))
            Events.send(this, "reload")
           }



           inner class CardAdapter : RecyclerView.Adapter<CardH>() {
            override fun onCreateViewHolder(parent: ViewGroup, t: Int): CardH {
             return CardH(LayoutInflater.from(parent.context).inflate(R.layout.item_card, parent, false))
            }

            override fun getItemCount(): Int = items.size

            override fun onBindViewHolder(h: CardH, i: Int) {
             val c = items[i]
             val isLast = (lastPlayedUrl.isNotBlank() && c.url == lastPlayedUrl) ||
              (lastPlayedId.isNotBlank() && c.id == lastPlayedId && c.name == lastName)
             h.name.text = if (isLast) "▶ " + c.name else c.name
             if (inEpisodes) {
              h.badge.text = c.group
              h.badge.visibility = if (c.group.isBlank()) View.GONE else View.VISIBLE
             } else if (!c.extra.isNullOrBlank()) {
              h.badge.text = c.extra.take(14)
              h.badge.visibility = View.VISIBLE
             } else h.badge.visibility = View.GONE
             val img = if (kind == "series") R.drawable.ic_series else R.drawable.ic_movie
             val artU = when {
              c.logo.isNotBlank() -> c.logo
              c.art.isNotBlank() -> c.art
              c.alt.startsWith("http") -> c.alt
              else -> ""
             }
             if (artU.isNotBlank()) {
              try {
               Glide.with(this@GridActivity)
                .load(artU)
                .placeholder(img).error(img).centerCrop().into(h.img)
              } catch (t: Throwable) { h.img.setImageResource(img) }
             } else h.img.setImageResource(img)
             val isFav = favs.any { it.url == c.url && c.url.isNotBlank() }
             h.name.setTextColor(ContextCompat.getColor(this@GridActivity, if (isFav || isLast) R.color.np_gold else R.color.np_text))
             h.itemView.setOnClickListener { openSafe(c) }
             h.itemView.setOnLongClickListener {
              pickDialog(c.name, listOf("▶ تشغيل", "★ مفضلة", "ⓘ معلومات")) { k ->
               when (k) {
                0 -> openSafe(c)
                1 -> toggleFav(c)
                2 -> infoDialog(c.name, (if (c.group.isNotBlank()) c.group + "\n" else "") +
                 (if (c.extra.isNotBlank()) c.extra + "\n" else "") + c.url)
               }
              }
              true
             }
             h.itemView.isFocusable = true
             h.itemView.isFocusableInTouchMode = true
             h.itemView.isClickable = true
             h.itemView.isLongClickable = true
             h.itemView.setOnFocusChangeListener { v, has ->
              try {
               v.scaleX = if (has) 1.06f else 1f
               v.scaleY = if (has) 1.06f else 1f
               v.alpha = if (has) 1f else 0.94f
               h.name.setTextColor(ContextCompat.getColor(this@GridActivity,
                if (has || isLast || isFav) R.color.np_gold else R.color.np_text))
              } catch (t: Throwable) {}
             }
            }
           }

           inner class CatAdapter : RecyclerView.Adapter<RowCatH>() {
            override fun onCreateViewHolder(parent: ViewGroup, t: Int): RowCatH =
             RowCatH(LayoutInflater.from(parent.context).inflate(R.layout.item_row, parent, false))

            override fun getItemCount(): Int = cats.size

            override fun onBindViewHolder(h: RowCatH, i: Int) {
             val g = cats[i]
             h.name.text = if (selCat?.name == g.name) "▶ " + g.name else g.name
             h.count.text = if (g.count > 0) g.count.toString() else ""
