        <?xml version="1.0" encoding="utf-8"?>
        <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
        android:layout_width="match_parent"
        android:layout_height="match_parent"
        android:focusable="true"
        android:focusableInTouchMode="true"
        android:descendantFocusability="beforeDescendants">

        <!-- خلفية الصورة الذهبية -->
        <ImageView
        android:layout_width="match_parent"
        android:layout_height="match_parent"
        android:src="@drawable/bg_home_photo"
        android:scaleType="centerCrop"
        android:contentDescription="bg"/>

        <!-- تعتيم خفيف -->
        <View
        android:layout_width="match_parent"
        android:layout_height="match_parent"
        android:background="#66020612"/>

        <!-- ═══ اللافتة الذهبية (عمودي: البطاقة بعرض الشاشة بهوامش) ═══ -->
        <ScrollView
        android:layout_width="match_parent"
        android:layout_height="match_parent"
        android:fillViewport="true"
        android:scrollbars="none">

        <LinearLayout
        android:layout_width="match_parent"
        android:layout_height="wrap_content"
        android:orientation="vertical"
        android:gravity="center"
        android:padding="22dp">

        <LinearLayout
        android:layout_width="match_parent"
        android:layout_height="wrap_content"
        android:orientation="vertical"
        android:background="@drawable/bg_login_card">

        <TextView
        android:layout_width="match_parent"
        android:layout_height="wrap_content"
        android:text="✦ RABIE PRO ✦"
        android:textColor="#0A1626"
        android:textSize="15sp"
        android:textStyle="bold"
        android:letterSpacing="0.25"
        android:gravity="center"
        android:background="@drawable/bg_login_ribbon"
        android:paddingTop="8dp"
        android:paddingBottom="8dp"/>

        <LinearLayout
        android:layout_width="match_parent"
        android:layout_height="wrap_content"
        android:orientation="vertical"
        android:paddingLeft="24dp"
        android:paddingRight="24dp"
        android:paddingTop="16dp"
        android:paddingBottom="22dp">

        <ImageView
        android:layout_width="84dp"
        android:layout_height="84dp"
        android:layout_gravity="center_horizontal"
        android:src="@drawable/app_logo"
        android:contentDescription="logo"/>

        <TextView
        android:layout_width="wrap_content"
        android:layout_height="wrap_content"
        android:text="مرحباً بك في"
        android:textColor="#8E9BB0"
        android:textSize="14sp"
        android:layout_gravity="center_horizontal"
        android:layout_marginTop="8dp"/>

        <TextView
        android:layout_width="wrap_content"
        android:layout_height="wrap_content"
        android:text="RABIE PRO"
        android:textColor="#F5C542"
        android:textSize="25sp"
        android:textStyle="bold"
        android:letterSpacing="0.18"
        android:layout_gravity="center_horizontal"/>

        <TextView
        android:layout_width="wrap_content"
        android:layout_height="wrap_content"
        android:text="سجّل دخولك للمتابعة"
        android:textColor="#8E9BB0"
        android:textSize="13sp"
        android:layout_gravity="center_horizontal"
        android:layout_marginTop="4dp"
        android:layout_marginBottom="14dp"/>

        <EditText
        android:id="@+id/edt_login_user"
        android:layout_width="match_parent"
        android:layout_height="50dp"
        android:background="@drawable/bg_login_input"
        android:hint="👤 اسم المستخدم"
        android:textColorHint="#6B7A94"
        android:textColor="#F2F6FC"
        android:textSize="15sp"
        android:paddingHorizontal="16dp"
        android:singleLine="true"
        android:imeOptions="actionNext"
        android:layout_marginBottom="12dp"/>

        <LinearLayout
        android:layout_width="match_parent"
        android:layout_height="50dp"
        android:orientation="horizontal"
        android:background="@drawable/bg_login_input"
        android:gravity="center_vertical"
        android:layout_marginBottom="14dp">
        <EditText
        android:id="@+id/edt_login_pass"
        android:layout_width="0dp"
        android:layout_height="match_parent"
        android:layout_weight="1"
        android:background="@android:color/transparent"
        android:hint="🔒 كلمة المرور"
        android:textColorHint="#6B7A94"
        android:textColor="#F2F6FC"
        android:textSize="15sp"
        android:paddingHorizontal="16dp"
        android:inputType="textPassword"
        android:singleLine="true"
        android:imeOptions="actionDone"/>
        <Button
        android:id="@+id/btn_eye"
        android:layout_width="48dp"
        android:layout_height="match_parent"
        android:text="👁"
        android:textSize="16sp"
        android:background="@android:color/transparent"
        android:focusable="true"/>
        </LinearLayout>

        <Button
        android:id="@+id/btn_login"
        android:layout_width="match_parent"
        android:layout_height="52dp"
        android:text="🔐 تسجيل الدخول"
        android:textColor="#0A1626"
        android:textSize="16sp"
        android:textStyle="bold"
        android:background="@drawable/bg_home_gold_btn"
        android:focusable="true"/>


        <ProgressBar
        android:id="@+id/login_progress"
        android:layout_width="30dp"
        android:layout_height="30dp"
        android:layout_gravity="center_horizontal"
        android:layout_marginTop="12dp"
        android:indeterminateTint="#F5C542"
        android:visibility="gone"/>

        <TextView
        android:id="@+id/txt_login_error"
        android:layout_width="match_parent"
        android:layout_height="wrap_content"
        android:textColor="#FF7B7B"
        android:textSize="13sp"
        android:gravity="center"
        android:layout_marginTop="8dp"
        android:visibility="gone"/>
        </LinearLayout>
        </LinearLayout>

        <TextView
        android:layout_width="wrap_content"
        android:layout_height="wrap_content"
        android:text="NovaPlay • Gold Edition • Firebase"
        android:textColor="#5F7292"
        android:textSize="11sp"
        android:layout_marginTop="12dp"/>
        </LinearLayout>
        </ScrollView>
        </FrameLayout>
