              fun takePrefetch(c: Channel): String {
                  return try {
                      val pair = pre.remove(keyOf(c)) ?: return ""
                      val (u, ts) = pair
                      if (System.currentTimeMillis() - ts > 120_000L) return ""
                      if (!online(u)) return ""
                      Crash.note("AI-PRE", "استعملنا رابطًا مجهّزًا مسبقًا ⇒ بداية فورية: " + c.name.take(40))
